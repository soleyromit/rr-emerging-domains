# Pharmacy — dissection manifest. Level 2, per content/ARCHITECTURE.md and the
# schema in _TEMPLATE.yaml in this directory. This file asserts NOTHING of its own:
# every line below is either a pointer into a file that owns the claim, or an
# honest statement about how far along the research is. A fact that wants to live
# here goes down to the file that owns it first.
#
# This is the first real manifest in the family. Pharmacy is the confirmed first
# GTM target (content/scorecard/where-to-play.yaml `actual_gtm_target`, decided
# 2026-09-10, overriding that scorecard's own DO recommendation).

domain: "Pharmacy"            # the RAW `domain:` value from content/domains/pharmacy.yaml
slug: "pharmacy"

is_gtm_target: true           # matches where-to-play.yaml's actual_gtm_target: "Pharmacy"

# content/interviews/2026-09-04-vishaka-ruchi-pharmacy-understanding.md's
# front-matter id. The id deliberately omits "ruchi" and so does not follow the
# filename-slug convention: it was frozen in content/sources/registry.yaml before
# the file was renamed, and 19 existing citations point at it. Read from the
# front-matter, not derived from the filename.
template_of_record: "interview-vishaka-pharmacy-understanding-2026-09-04"

last_reviewed: "2026-09-11"

# Scoping only — who is actually in the Pharmacy clinical-education software market
# this domain has to be won in. The claims about each vendor stay in
# content/competitors/<slug>.yaml.
incumbent_set:
  - competitor_slug: "core-elms"
    role: "primary"
    # The share leader. core-elms.yaml records the reconciled share variance; the
    # 2026-09-04 session puts CORE at "about 80 or more than 80% of pharmacy
    # programs", and CORE is named there as "our biggest competitor in pharmacy".

  - competitor_slug: "rxpreceptor"
    role: "not-a-target"
    # Out of scope as a SEPARATE incumbent, not as a product: rxpreceptor.yaml's
    # own header states "RxPreceptor is not a separate product" — rxpreceptor.com
    # 302s to PeopleGrove's CORE ELMS login, the legacy academicsuiterx.com logins
    # 301 to corehighered.com, and CORE's training listing calls the software
    # "CORE ELMS / RXpreceptor". That file deliberately records only the
    # RxPreceptor-branded surface and keeps platform depth in core-elms.yaml, so
    # listing it alongside core-elms would count one platform twice. Kept visible
    # rather than dropped because the name is still live on school pages and in
    # CORE's own CE listing, so it is still encountered in the field.
    exclusion_reason: "Not a separate product — rxpreceptor.com redirects to CORE ELMS's login; counted once, as core-elms, which owns the platform depth."

  - competitor_slug: "pharmacademic"
    role: "primary"
    # McCreadie Group. Pharmacy experiential education plus the ASHP-residency
    # documentation adjacency that makes it sticky beyond the PharmD program.

  - competitor_slug: "e-value"
    role: "switch-target"
    # The one incumbent the session treats as displaceable rather than defended:
    # e-Value is described there as archaic with no significant enhancements
    # shipping, while pharmacy programs are still subscribing. A carried-over,
    # not-yet-acted-on action item from a prior AACP is to curate the list of
    # e-Value pharmacy programs (booth-lead notes plus a program-website sweep).

  - competitor_slug: "examsoft"
    role: "adjacent"
    # Didactic assessment, not experiential — adjacent by product, but part of
    # the CORE + ExamSoft + Influx stack the session names as the recurring
    # pharmacy configuration.

  - competitor_slug: "influx"
    role: "adjacent"
    # An analytics layer over other vendors' data rather than a system of record.
    # The file is about the real company Enflux; the slug stays "influx" to match
    # how the 2026-09-04 session recorded the name and the committed filename.

  - competitor_slug: "medhub"
    role: "not-a-target"
    # Listed so the corporate owner is not invisible, excluded because the
    # pharmacy book of business is not MedHub's. Per e-value.yaml and medhub.yaml,
    # MedHub and E*Value were separate companies that merged in November 2015
    # under Ascend Learning (MedHub's parent); MedHub had focused on UME/GME while
    # E*Value served the advanced-practice fields including pharmacy, and
    # medhub.yaml records that the two product lines "remain visibly separate
    # systems under one brand". medhub.yaml's own `domains_served` is
    # ["DO", "MD"]. Pharmacy engagement runs through the e-value entry above.
    exclusion_reason: "Pharmacy customers sit on the E*Value side of the merged line; medhub.yaml's own domains_served is DO/MD only."

  # Denticon and a Banner/SIS-type vendor were named earlier as explicitly out of
  # scope for pharmacy, but content/competitors/ has no file for either, so there
  # is no real competitor_slug to exclude. An exclusion of a vendor this repo has
  # never researched would be a new claim, which a manifest may not make. The two
  # `not-a-target` entries above are the opposite case: both have real files, and
  # both are excluded for a reason those files themselves state.

questions:
  - key: "features-to-build"
    answered_in: ["lenses/product-gaps.yaml"]
    coverage: "partial"
    # Not "researched": five Pharmacy rows exist, but all five rest on one
    # domain-expert session, and that session says of itself that the gap
    # research "remains to be done".
    confidence: "low"
    gap_note: "5 Pharmacy gap rows now exist, all from the one 2026-09-04 session and all 'expert-assertion' — no RFP, ticket or lost-deal record backs any, and that session says the gap research remains to be done."

  - key: "competitor-differentiation"
    answered_in: ["lenses/competitor-differentiation.yaml", "competitors/*.yaml"]
    coverage: "partial"
    # Not "researched": 10 head-to-head rows now exist across all 5 in-scope
    # vendors, but 6 of the 10 are "directional" and rest on the one 2026-09-04
    # session. Confidence is a notch above features-to-build's "low" because the
    # vendor teardowns underneath are independent public research, and 4 rows
    # (CORE's share band, CORE's shipped CompMS mapping, ExamSoft's shipped exam
    # delivery, ASHP's PharmAcademic mandate) are carried by that research rather
    # than by the session.
    confidence: "medium"
    gap_note: "10 rows now cover all 5 in-scope vendors, but 6 are directional off the one session, no price or services axis is researched, and e-Value's direction stays 'unknown' on conflicting evidence."

  - key: "market-size"
    answered_in: ["domains/pharmacy.yaml#market_sizing", "market/programs/pharmacy.yaml"]
    coverage: "researched"
    confidence: "medium"
    # Not "high": the sizing work closed with real ambiguities still open.
    gap_note: "Sized, with three open ambiguities: enrollment falls back to an AACP figure a year off the eBook's, TAM rows exceed the accredited count, and 3 registry rows stay unmatched."

  - key: "feature-comparison"
    answered_in: ["lenses/feature-comparison-matrix.yaml"]
    coverage: "none"
    confidence: "low"
    gap_note: "lenses/feature-comparison-matrix.yaml holds zero cells[] and zero exxat_cells[] for any domain; no Pharmacy capability x competitor cell has been rated (plan Task 2.9)."

  - key: "standards-to-product"
    answered_in: ["lenses/standards-use-cases.yaml", "lenses/standards-competitor-ratings.yaml"]
    coverage: "partial"
    confidence: "medium"
    gap_note: "15 Pharmacy use cases and 31 Pharmacy competitor ratings exist, but the ACPE 2025 / COEPA / IPPE-APPE dual-ledger material is not yet turned into use-case rows (plan Task 2.10)."

  - key: "persona-and-document-lens"
    # Not a file: the answer is computed from tags and sources[] the lenses above
    # already carry. A prose marker, never resolved as a path.
    answered_in: ["computed — audience/persona_relevance tags and sources[] across the lenses above"]
    coverage: "partial"
    confidence: "medium"
    gap_note: "Computes today only from the two standards lenses' audience and persona_relevance tags; the product-gap, differentiation and feature-matrix lenses carry no rows, so nothing computes there."
