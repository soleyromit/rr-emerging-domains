# DO — dissection manifest. Level 2, per content/ARCHITECTURE.md and the schema in
# _TEMPLATE.yaml in this directory. This file asserts NOTHING of its own: every line
# below is either a pointer into a file that owns the claim, or an honest statement
# about how far along the research is. A fact that wants to live here goes down to
# the file that owns it first.
#
# Read this one next to content/dissection/pharmacy.yaml, because the contrast IS the
# content. Pharmacy's manifest points at five populated lenses because a domain-expert
# session happened (2026-09-04). No such session has happened for DO. So five of the
# six questions below are coverage: "none" — not because DO is unimportant (this
# repo's own scorecard ranked it first on weighted math before the GTM decision
# overrode it), but because nobody has done the work yet, and a manifest that
# implied otherwise would be the failure this family exists to prevent.
#
# The one exception is market-size: Task 3.1 extracted the CRM export's DO sheet
# mechanically, which needs no domain expert. That question is "partial".

domain: "DO"                  # the RAW `domain:` value from content/domains/do.yaml.
                              # For DO the raw value and the app-resolvable label are
                              # the same string, so nothing here has to be reconciled
                              # — but that is a coincidence of this domain, not a
                              # rule. content/domains/medicine.yaml's raw value is
                              # "MD" while every lens resolves "Medicine", so the
                              # next manifest in this phase cannot copy this line's
                              # shape without checking.
slug: "do"

# where-to-play.yaml's actual_gtm_target is "Pharmacy" (decided 2026-09-10),
# overriding that same scorecard's own recommended beachhead, which was DO. DO is
# therefore a real, researched candidate that LOST the GTM decision — not an
# afterthought — and this flag tracks the decision, not the merit.
is_gtm_target: false

# null, not "", and not a borrowed id: no DO domain-expert session exists in
# content/interviews/. Pharmacy's template_of_record points at the 2026-09-04
# session; pointing this field at that session would claim Pharmacy findings
# transfer to DO, which is exactly what that session's own "we don't know what we
# don't know" finding warns against.
template_of_record: null

last_reviewed: "2026-09-12"

# Scoping only — who is in the DO clinical-education software market. Membership is
# read straight off each competitor file's own `domains_served` field: these are
# every file in content/competitors/ whose list includes "DO". The claims about each
# vendor stay in content/competitors/<slug>.yaml.
#
# Role is "primary" by default, because nothing in these files supports a finer
# distinction for DO yet. Pharmacy's manifest can say "switch-target" and
# "not-a-target" because a domain expert said so out loud; inventing the same
# gradations here from category strings alone would be fabricating the judgment a
# session is supposed to produce. The one exception below is drawn from a file's own
# stated category, not from inference.
incumbent_set:
  - competitor_slug: "e-value"
    role: "primary"
    # domains_served: ["DO", "MD", "Pharmacy"]. The one vendor with DO-specific
    # evidence already in this repo: pharmacy.yaml's manifest cites
    # article-jom-tech-use-satisfaction-coms-2026 putting eValue's use among
    # osteopathic colleges down from 44.8% to 28.6% — a real DO datapoint that was
    # adjacent noise for Pharmacy and is on-domain here. A declining share is still
    # a large share; this is a real incumbent, not a departing one.

  - competitor_slug: "medhub"
    role: "primary"
    # domains_served: ["DO", "MD"]. Note the inversion of Pharmacy's manifest, which
    # marks MedHub "not-a-target" precisely because pharmacy customers sit on the
    # E*Value side of the merged Ascend line. DO is the side of that line MedHub
    # itself claims, so the same evidence that excludes it there includes it here.

  - competitor_slug: "elentra"
    role: "primary"
    # domains_served: ["MD", "DO"].

  - competitor_slug: "emedley"
    role: "primary"
    # domains_served: ["MD", "DO"].

  - competitor_slug: "leo-davinci"
    role: "primary"
    # domains_served: ["MD", "DO", "Pharmacy", "Dentistry"].

  - competitor_slug: "new-innovations"
    role: "primary"
    # domains_served: ["DO", "MD"]. Its own category is "Residency/GME + UME
    # management software" — the UME half is what makes it in-scope for a college of
    # osteopathic medicine rather than only for the residencies its graduates match
    # into. Whether the DO market actually meets it in UME deals is unresearched.

  - competitor_slug: "examsoft"
    role: "adjacent"
    # domains_served lists DO, but examsoft.yaml's own category is "Secure exam
    # delivery, proctoring, and assessment analytics" — didactic assessment, not
    # experiential education. Same reading, from the same file, that Pharmacy's
    # manifest applies to it. This is the one role above not defaulted to "primary",
    # and it rests on the file's own words rather than on a judgment about DO.

  # No "not-a-target" entries. Pharmacy's manifest has two, each excluded for a
  # reason the excluded vendor's OWN file states. Nothing in content/competitors/
  # states such a reason for DO, and an exclusion this repo cannot evidence would be
  # a new claim, which a manifest may not make.

questions:
  - key: "features-to-build"
    answered_in: ["lenses/product-gaps.yaml"]
    coverage: "none"
    confidence: "low"
    gap_note: "No DO rows in the product-gaps lens. No domain-expert session exists for DO; per the Pharmacy session's own 'we don't know what we don't know' finding, real rows here need one first."

  - key: "competitor-differentiation"
    answered_in: ["lenses/competitor-differentiation.yaml", "competitors/*.yaml"]
    coverage: "none"
    confidence: "low"
    gap_note: "No DO differentiation rows. The 7 competitor files scoped above carry teardowns, but no head-to-head read for DO — that requires the domain-expert session DO has not had."

  - key: "market-size"
    answered_in: ["domains/do.yaml#market_sizing", "market/programs/do.yaml"]
    coverage: "partial"
    confidence: "low"
    # The only question above "none", and only to "partial": Task 3.1's extraction was
    # mechanical, which is precisely why it could run without a domain expert.
    gap_note: "Mechanical only: 57 CRM rows, 2 clients, 0 churned, SAM 55. No accredited count, no enrollment, no ACV; TAM is teaching locations and matches neither AACOM figure in the prose block."

  - key: "feature-comparison"
    answered_in: ["lenses/feature-comparison-matrix.yaml"]
    coverage: "none"
    confidence: "low"
    gap_note: "No DO cells in the matrix. Cells are transcribed from researched competitor pillars scoped to a domain; for DO neither the scoping research nor the session that would direct it exists."

  - key: "standards-to-product"
    answered_in: ["lenses/standards-use-cases.yaml", "lenses/standards-competitor-ratings.yaml"]
    coverage: "none"
    confidence: "low"
    gap_note: "Neither standards lens carries a COCA row, though content/accreditation/coca.yaml exists. Turning an accreditor's standards into use cases needs a domain expert to say which ones bite."

  - key: "persona-and-document-lens"
    answered_in: ["computed — audience/persona_relevance tags and sources[] across the lenses above"]
    coverage: "none"
    confidence: "low"
    gap_note: "Computed from tags on rows in the lenses above, and DO has no rows in any of them, so nothing computes. This question cannot move until the other five do."
