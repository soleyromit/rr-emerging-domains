# Real row shape, now populated above. Documented as a comment on purpose — an example row in a
# tracker gets read as a real plan.
#   - id: string, unique across this file, kebab-case
#     kind: enum — whitepaper | podcast | webinar | video | sandbox | use-case-one-pager
#           | conference-abstract
#     title: string, <=150 soft / 300 hard chars
#     domain: string — the canonical APP-LEVEL domain label, same convention and same trap
#       as research-pipeline.yaml's `workstreams[].domain`: the authoritative list is the
#       key set of DOMAIN_TO_ACCREDITATION_SLUG (apps/ecosystem/lib/content.ts and
#       scripts/check_content_density.py), and Medicine's label is "Medicine" even though
#       content/domains/medicine.yaml's own field says "MD"
#     status: enum — idea | drafting | in-review | published | retired
#     owner_team: enum — marketing | sales | product | research. Per the interview above,
#       most collateral is marketing or sales; "research" is the exception, not the default
#     owner: string or null. null when no named person owns it yet
#     target_date: string (YYYY-MM-DD) or null
#     published_url: string or null — non-null ONLY when status is "published"
#     audience: array of content/personas/*.yaml filenames without extension (role-* /
#       discipline-* / lens-* slugs), or empty. Tag-only, not an evidentiary citation
#     grounded_in: array of content/ relative paths whose claims this asset must not
#       outrun, or empty. Same existence/forward-reference rule as research-pipeline.yaml's
#       `produces:`: each path exists today, or is a documented Phase 2/3 forward reference
#       already named in an earlier committed schema (content/lenses/product-gaps.yaml
#       exists; content/dissection/<slug>.yaml and content/market/programs/<slug>.yaml have
#       committed _TEMPLATEs with per-domain files still to come). This is the field that
#       makes "the webinar said X, where did X come from?" answerable
#     claims_review_status: enum — not-reviewed | reviewed-against-content |
#       contains-unverified-claims. Use the WEAKEST honest value: "not-reviewed" is the
#       default and is not a criticism, while "contains-unverified-claims" is a real,
#       useful state to be able to count, not a failure to hide
#     becomes_source_id: string or null — the Level 0.5 source id this asset becomes once
#       published. REQUIRED to be non-null when status is "published"; MUST be null for
#       every other status, including "retired" (a retired draft was never published, so
#       it never became a source). It points at a source HOME, never back at this file,
#       and WHICH home decides whether the published artifact can be cited as fact:
#         content/sources/registry.yaml — citable like any other source, always written
#           with origin: "first-party"
#         a `citable_as_fact: false` home (today content/sources/vendor-comparison-
#           chart.yaml) — registered and referenceable, but quarantined: an id from such
#           a home may never appear as a `source_id` anywhere in content/
#       Destination and registry `type:` per `kind` — every kind has one, so a published
#       row is never left with a required field and no rule:
#         webinar             -> registry.yaml, type "webinar"
#         podcast             -> registry.yaml, type "podcast"
#         video               -> registry.yaml, type "video"
#         conference-abstract -> registry.yaml, type "conference". NOTE the names differ
#              on purpose: "conference-abstract" is this file's `kind`, while the
#              registry's `type:` value is "conference" ("agenda/session/abstract/
#              proceedings"). There is no "conference-abstract" type
#         use-case-one-pager  -> quarantined home, type "sales-collateral". The registry
#              names one-pagers by name as "NOT citable as fact"
#         sandbox             -> quarantined home, type "sales-collateral". A sandbox is a
#              configured demo of our own product, not a document — it can be set up to
#              show anything, so citing it for what Prism ships would bypass
#              prism/capability-map.yaml, whose claims carry real Level 0 sources. The
#              interview that named this kind calls them "sandbox pitch decks". This is
#              the one kind with no content-dependent branch: always quarantined
#         whitepaper          -> ROUTES BY CONTENT, not by kind — the one genuinely
#              ambiguous kind, because the word covers both a research write-up and a
#              pitch:
#                - carries primary material not already in content/ (an original survey,
#                  original program data we collected) -> registry.yaml, type "doc" (or
#                  "research-paper" / "dataset" if that is what it actually is), citable
#                  like any other first-party source
#                - only restates what content/ already holds, i.e. every claim traces to
#                  its own `grounded_in:` files -> still gets a registry.yaml entry so the
#                  artifact can be referenced, but it may NEVER be cited back at any file
#                  listed in its own `grounded_in:`. Same rule content/ARCHITECTURE.md
#                  already states for corpus indexes: citing an id back at the file its
#                  summary was derived from launders a claim, it does not corroborate it
#                - a pitch piece rather than a document of research -> quarantined home,
#                  type "sales-collateral", same treatment as a one-pager
#       Registering an asset does not make its claims true; it makes the artifact
#       referenceable
#     notes: string, <=150 soft / 300 hard chars, or null
