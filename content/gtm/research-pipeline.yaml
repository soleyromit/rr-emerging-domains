# NOT part of the citation DAG — see content/ARCHITECTURE.md's "Outside the strata"
# section, which this family was added to. This file tracks WORK, not facts.
#
# THE ISOLATION RULE, which runs in exactly one direction:
#   - a row here MAY point AT content/ (via `produces:`, and at Level 0.5 ids via
#     `inputs:`);
#   - nothing under content/ outside content/gtm/ may EVER cite a content/gtm/ path or
#     id as evidence. A later integrity check, check_gtm_isolation() in
#     scripts/check_content_density.py (added by Task 1.7 of this plan), enforces that
#     mechanically; until it lands, this comment is the rule.
# Why the asymmetry: "we intend to interview ten deans" and "this stage is blocked on
# Ashish's availability" assert nothing about the world. Requiring such a row to carry a
# `source:` would be a category error, and letting a research file cite it would launder
# an intention into evidence — the same failure content/sources/vendor-comparison-
# chart.yaml is quarantined (`citable_as_fact: false`) to prevent from the other
# direction.
#
# WHAT THIS FILE IS FOR: who is doing what research work, on which domain, at which of
# the seven fixed stages, at what status. It is a work tracker. The findings the work
# produces land in the files named in `produces:` — never here.
last_updated: "2026-09-12"

# The seven fixed research stages, always all seven, in the order stated in
# content/interviews/2026-09-11-romit-ruchi-gtm-taxonomy.md, which names them verbatim as
# "competitive analysis, market sizing, program-level research, domain-expert research,
# conference research, interviews, and consultants" and records that they "feed product
# development first, and sales second" (the `feeds:` enum below).
# Do not add, remove, or reorder. A stage that turns out not to apply to a domain is
# recorded as a workstream with status "dropped", not by deleting a key here.
stages:
  - key: "competitive-analysis"
  - key: "market-sizing"
  - key: "program-level-research"
  - key: "domain-expert-research"
  - key: "conference-research"
  - key: "interviews"
  - key: "consultants"

# Per-domain, per-stage work items. SPARSE BY DESIGN, the same contract as
# content/lenses/product-gaps.yaml and content/lenses/standards-competitor-ratings.yaml:
# an absent row means NOT YET STARTED, never "started and found nothing." Deliberately
# empty at creation (2026-09-11); a workstream is added when real work actually begins,
# and an invented example row would be indistinguishable from a real one the moment it is
# committed.
# PHARMACY IS THE ONE EXCEPTION to the sparseness, added 2026-09-12: it carries all seven
# stages explicitly, including the two that are "not-started", because it is the confirmed
# first GTM target and a stage nobody has begun is worth being able to SEE rather than
# infer from an absence. Every other domain stays sparse.
workstreams:
