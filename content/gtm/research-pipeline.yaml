  # 2026-09-12. Statuses are the honest read of what the produced files actually contain,
  # not of how much effort went in: three stages are "in-progress" precisely because a real
  # pass landed and left a named, countable remainder behind it.
  - id: "pharmacy-competitive-analysis"
    domain: "Pharmacy"
    stage: "competitive-analysis"
    status: "in-progress"
    # NOT "done", and the reason is in the produced files rather than in effort: of the 10
    # head-to-head rows in competitor-differentiation.yaml, 9 are evidence_strength
    # "directional" and one (e-Value on product) is direction "unknown"; the feature matrix
    # holds 14 of 30 possible Pharmacy cells, with all five PharmAcademic entries
    # "unknown" — which is why a named primary incumbent contributes no cell at all. What
    # exists is pillar-granularity: one teardown entry per pillar, not per-feature research.
    owner: null
    started: "2026-09-09"   # earliest `accessed:` date on the Pharmacy competitor sources
                            # this stage registered (CORE's affiliation-agreements page)
    target: null
    blocked_by: null
    objective: "Which vendors a pharmacy program actually buys, where each wins or loses against Prism, and how far Prism's six capability pillars sit from them cell by cell."
    inputs:
      - source_id: "interview-vishaka-pharmacy-understanding-2026-09-04"
