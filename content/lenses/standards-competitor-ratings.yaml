# Level 2 reframing — cites content/accreditation/*.yaml (by element_id) and
# content/competitors/*.yaml (by slug) by name; never asserts a new competitive fact
# not already grounded in one of those two Level-1 registries. This is Wilson's
# per-standard "where do we meet versus the competitors meet" ask
# (2026-08-26 call), scoped to the cross-registry claim specifically — how a named
# competitor stacks up against ONE accreditation element.
#
# Sparse by design: absence of an entry for a given (domain, element_id,
# competitor_slug) triple IS the "unresearched" state that
# getStandardsCrosswalkForDomain() renders by default — do not pre-populate empty
# rows for every cell, that would be 1,000+ rows of noise for zero information. Add an
# entry only after checking a competitor's public docs/site/reviewer notes against one
# specific accreditation standard, with a real source. Run
# scripts/list_missing_competitor_ratings.py to see what's still unrated.
#
# Schema, per entry (added 2026-09-09, additive to the original 5 fields):
#   domain, element_id, competitor_slug, rating, rationale   — original fields, unchanged
#   source: "https://..."                                   — original single-URL field, still
#     accepted; kept for back-compat with any entry that only has one plain citation
#   competitor_feature_ref: "which content/competitors/<slug>.yaml feature_teardown[].pillar
#     (or capability) actually meets this standard" — optional, add when known
#   sources: [{source_id: "..."}]                            — optional list of ids resolving
#     into content/sources/registry.yaml, used instead of (or alongside) `source` when there's
#     more than one citation or a webinar needs structured metadata (publisher/date/type)
#   persona_relevance: ["role-..." | "discipline-..."]        — optional list of
#     content/personas/*.yaml filenames (no extension) this standard affects. Tag-only,
#     not an evidentiary citation — same tolerated-sideways-reference status as an
#     existing file's `related_flows`.
#   evidence_strength: "directional"                         — optional, added 2026-09-10. Present
#     ONLY on a first-pass rating read off public vendor material, not verified element by element.
#     The two original 2026-09-09 core-elms entries below deliberately omit it and stay unflagged.
#   evidence_note: "..."                                     — REQUIRED whenever evidence_strength is
#     "directional". States what the rating actually rests on ("first-pass read of the vendor's
#     public product page only"), not a second rationale. Enforced in
#     scripts/check_content_density.py's check_standards_ratings_integrity(): directional without a
#     note fails, and a note without the flag also fails — an unflagged note reads as verified.
