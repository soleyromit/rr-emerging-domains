#
# On sources[]: capability-map.yaml is Level 1 and cannot be reached through a source_id,
# so the capability-map connection is carried by prism_feature_ref (per the Task 2.7
# precedent) and sources[] cites the Level 0.5 help-center articles indexed in
# content/sources/help-center.yaml that the capability-map content itself rests on. Note
# that index holds 9 of the corpus's 399 articles, one per pillar — so a cell cites the
# article for its pillar, not an article for each specific claim in its rationale. Where a
# rationale narrows a claim, it names exactly what capability-map.yaml does and does not
# state rather than asserting a bare absence.
exxat_cells:
  - domain: "Pharmacy"
    capability_id: "pharmacy-clinical-experiential-education"
    prism_status: "shipped"
    prism_feature_ref: "Clinical & Experiential Education"
    rating: "partially-meeting"
    rationale: >
      The placement engine, patient logging and publish gate all ship. But Placement
      Assist, the matching layer, is self-service only for PT/PTA and OT/OTA —
      support-enabled with "limited functionality" elsewhere — and ACPE's IPPE
      hour minimums are an unconfirmed configuration, not a shipped rule.
    evidence_strength: "verified"
    sources:
      - source_id: "help-center-placement-publish-step"
      - source_id: "help-center-patient-log-review-workflow"

  - domain: "Pharmacy"
    capability_id: "pharmacy-compliance-management"
    prism_status: "shipped"
    prism_feature_ref: "Compliance Management"
    rating: "fully-meeting"
    rationale: >
      Placement Clearance gates on student compliance, site documents, an active contract
      and preceptor licence — a real multi-entity gate. Exemptions are a native status
      (declination, exception, medical, religious), and background checks, drug
      screening and HIPAA training run through named integrations.
    evidence_strength: "verified"
    sources:
      - source_id: "help-center-placement-clearance-dashboard"
      - source_id: "help-center-student-compliance-review"

  - domain: "Pharmacy"
    capability_id: "pharmacy-curriculum-mapping"
    prism_status: "shipped"
    prism_feature_ref: "Curriculum Mapping"
    rating: "partially-meeting"
    rationale: >
      The mechanism ships and is deep: AI-assisted mapping with human approval, heatmap
      and unmapped reports, accreditor-formatted exports. What pharmacy lacks is
      content, not capability — the pre-loaded standard sets capability-map.yaml names
      are ARC-PA, ACOTE and AACN, and ACPE is not among them.
    evidence_strength: "verified"
    sources:
      - source_id: "help-center-curriculum-accreditation-standards"

  - domain: "Pharmacy"
    capability_id: "pharmacy-surveys-course-evaluations"
    prism_status: "shipped"
    prism_feature_ref: "Surveys & Course Evaluations"
    rating: "partially-meeting"
    rationale: >
      Two engines ship: the placement Forms/Evaluations taxonomy and Exxat Surveys, a
      general-purpose builder with 14 question types. Every validated instrument and
      template capability-map.yaml names, though, is PT, OT, SLP or PA — no pharmacy
      preceptor or IPPE/APPE instrument is listed.
    evidence_strength: "verified"
    sources:
      - source_id: "help-center-course-forms-evaluations-activation"

  - domain: "Pharmacy"
    capability_id: "pharmacy-exam-management"
    prism_status: "roadmap"
    prism_feature_ref: "Exam Management"
    rating: "not-meeting"
    rationale: >
      Nothing ships. capability-map.yaml carries this pillar as a bare roadmap entry
      targeted Q2 2027 — no features, no notes, unlike every shipped pillar. The
      2026-09-04 domain-expert session puts an Exxat counterpart to ExamSoft at "a January
      soft launch", a month with no year.
    evidence_strength: "directional"
    evidence_note: "The soft-launch timing is one domain expert's recollection, and capability-map.yaml's roadmap object for this pillar carries source_id: null."
    sources:
      - source_id: "interview-vishaka-pharmacy-understanding-2026-09-04"
        locator: "Sections 'The ExamSoft + CORE + Influx stack' and 'LMS integration'"

  - domain: "Pharmacy"
    capability_id: "pharmacy-accreditation-management"
    prism_status: "roadmap"
    prism_feature_ref: "Accreditation Management"
    rating: "not-meeting"
    rationale: >
      Not shipped; Exxat's roadmap targets Q3 2027. Far from zero, though:
      capability-map.yaml documents standard-mapped guides for seven accreditors across
      five disciplines — ACEN, CCNE, COA, ACOTE, ARC-PA, CAPTE, CSWE — plus SLP's
      KASA/ASHA and nursing's NBCRNA reports. ACPE is only a build target.
    evidence_strength: "verified"
    sources:
      - source_id: "help-center-pa-arcpa-reports"
