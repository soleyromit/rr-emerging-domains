# Level 2 reframing — the feature-level (not just standard-level) sibling of
# lenses/standards-competitor-ratings.yaml. Cites content/domains/*.yaml (by domain label,
# see `domain` below),
# content/prism/capability-map.yaml (by pillar name), content/competitors/*.yaml (by slug
# and feature_teardown pillar), content/accreditation/*.yaml (by element_id) and the
# Level 0.5 source namespace (by source_id) downward.
#
# SAME EVIDENTIARY CONTRACT: sparse — an absent cell is UNRESEARCHED, never "the vendor
# doesn't do this"; every cell carries at least one source; any first-pass rating read off
# public vendor material is flagged evidence_strength: "directional" with a REQUIRED
# evidence_note. ONE DELIBERATE DIFFERENCE from that precedent, spelled out under
# evidence_strength below: there the flag is optional and single-valued ("directional" or
# omitted, with the omission implying verified); here it is a required two-value enum, so
# the verified state is written down rather than inferred from a missing field.
# Deliberately empty at creation (2026-09-11): real cells arrive
# with the per-domain research passes, and an invented example cell would be
# indistinguishable from a researched one the moment it is committed.
#
# FIRST REAL CONTENT, 2026-09-11 (plan Task 2.9) — Pharmacy, at PILLAR granularity.
# Read the granularity before reading the rows. There is exactly ONE capability row per
# capability-map.yaml core_ring pillar (six rows), not the ~15 finer per-feature rows the
# plan originally imagined. That is not a shortcut: the competitor research these cells
# transcribe (content/competitors/*.yaml feature_teardown[], Tasks 2.4/2.8) was itself
# conducted one entry per pillar, so a finer row would be a rating nobody researched.
# Sparse by design means seeding what is real and leaving the rest absent, so the finer
# rows stay absent until somebody researches them.
#
# Every cell here is a transcription of an already-researched feature_teardown entry, with
# three judgment calls applied consistently across all of them:
#   1. depth_vs_prism -> rating. The teardown vocabulary describes the competitor RELATIVE
#      TO PRISM; `rating` here is an absolute verdict on the competitor. "at-parity" and
#      "ahead" both become fully-meeting where the evidence shows the capability genuinely
#      ships, and partially-meeting where the evidence itself narrows the claim (e-value's
#      Exam Management is partner content, not native authoring; its Accreditation
#      Automation is ACGME/GME-shaped and never names ACPE). "unknown" entries are OMITTED
#      entirely — an absent cell is unresearched, which is exactly what they are. That
#      omission is why pharmacademic, a real in-scope Pharmacy incumbent, has zero cells:
#      all five of its feature_teardown entries are depth_vs_prism: "unknown".
#   2. "prism-only" -> not-meeting, but ONLY where the absence is positively evidenced.
#      A vendor that demonstrably does not compete on a pillar does not meet it, and
#      writing that down is what keeps a sourced absence distinguishable from an
#      unresearched one. Two such cells qualify and are verified: an accredited program's
#      ACPE self-study running ExamSoft and CORE on opposite sides of the didactic/clinical
#      line, and Enflux's own FAQ describing itself as reading CORE's data rather than
#      producing any. Each shows a source affirmatively placing the capability elsewhere.
#      A THIRD prism-only entry — ExamSoft on Compliance Management — is deliberately
#      OMITTED rather than rated. Its own evidence text in examsoft.yaml says the finding
#      is "genuinely unassessed rather than proven absent": nothing was found either way.
#      Absence of evidence is not evidence of absence, `not-meeting` would have asserted a
#      gap nobody established, and this file has no "unknown" rating to put there — so the
#      honest record is no cell at all, which is this file's own definition of
#      unresearched. scripts/list_missing_feature_matrix_cells.py now reports it as a
#      MISSING CELL, i.e. as real research still owed. (Removed 2026-09-11 in Task 2.9's
#      review round, which caught the original rating overstating its evidence.)
#   3. evidence_strength. "verified" is reserved for ratings a NON-VENDOR source attests to
#      (a customer institution's own documentation, an accreditation self-study, third-party
#      reviews) or that rest on a vendor statement against its own interest. A rating read
#      off the vendor's own marketing page is "directional" with a note naming that, per the
#      contract above. That is why several cells transcribed from real, careful research are
#      still directional: the research is sound, the SOURCE CLASS is vendor self-description.
#
# element_ids is deliberately EMPTY on every cell. ACPE elements are the granularity
# content/lenses/standards-competitor-ratings.yaml already works at; tagging a pillar-wide
# row with a hand-picked subset of Standard 3's key elements would assert a per-element
# finding this row does not have. Left absent rather than guessed.
#
# ROWS ARE KEYED ON capability-map.yaml's PILLAR VOCABULARY, not on any external
# spreadsheet's row taxonomy. See content/sources/vendor-comparison-chart.yaml for why:
# that artifact is quarantined, non-citable sales collateral (`citable_as_fact: false`) —
# its 81 feature rows are a positioning document's taxonomy, and no id from it may appear
# in `sources:` anywhere in this file.
#
# EXXAT'S OWN COLUMN IS A SEPARATE LIST (exxat_cells), not a competitor_slug value. Two
# reasons: there is no content/competitors/exxat.yaml, and Exxat's evidence class is
# different (help-center articles, playbooks, capability-map — not vendor marketing).
# This separation is also what makes "Exxat: X on every row" structurally impossible here,
# unlike the quarantined sales chart: Exxat's cells require the same sourced-evidence
# treatment as every competitor's cells, in a list a reader can count.
#
# Citable source_ids resolve against the UNION of the Level 0.5 source homes — registry
# .yaml, help-center.yaml, playbooks.yaml, support-tickets/*.yaml, and interviews/*.md
# front-matter — as scripts/check_content_density.py's _load_source_ids() does it.
#
# cells[] — one (domain, capability, competitor) verdict:
#   domain                 — the canonical APP-LEVEL domain label, NOT necessarily the
#                            domain registry's own `domain:` field. Authoritative list =
#                            the key set of DOMAIN_TO_ACCREDITATION_SLUG, mirrored by hand
#                            in apps/ecosystem/lib/content.ts and
#                            scripts/check_content_density.py: DO | Pharmacy | Dentistry |
#                            Medicine | Nursing | Teacher Education | Social Work |
#                            Physical Therapy | Occupational Therapy | Physician Assistant
#                            | Speech-Language Pathology | CRNA | Counseling.
#                            MEDICINE IS THE TRAP: content/domains/medicine.yaml says
#                            `domain: "MD"`, but the label that resolves — and the one all
#                            3 Medicine rows in standards-competitor-ratings.yaml use — is
#                            "Medicine". "MD" is rejected as an unrecognized domain
#   pillar                — one of content/prism/capability-map.yaml's 6 core_ring pillar
#                            names verbatim: "Clinical & Experiential Education",
#                            "Compliance Management", "Curriculum Mapping", "Surveys &
#                            Course Evaluations", "Exam Management", "Accreditation
#                            Management"
#   capability             — the human-readable row label. <=120 soft / 220 hard chars.
#                            A label, not the argument — the argument goes in `rationale`
#   capability_id          — unique, stable, kebab-case, "{domain-slug}-{short-capability
#                            -slug}". Stable means: once written, it is not renamed, since
#                            exxat_cells[] joins on it
#   competitor_slug        — exact match to a content/competitors/<slug>.yaml file
#   rating                 — fully-meeting | partially-meeting | not-meeting. Same three
#                            values lenses/standards-competitor-ratings.yaml uses
#   rationale              — <=300 soft / 600 hard chars
#   competitor_feature_ref — resolves into that competitor's feature_teardown pillar names
#                            in content/competitors/<slug>.yaml, or null
#   evidence_strength      — directional | verified. REQUIRED on every cell; there is no
#                            "omit it" state. This is a real two-value enum and therefore
#                            NOT identical to lenses/standards-competitor-ratings.yaml,
#                            where the field is optional, "directional" is the only
#                            accepted value, and an omitted field is what implicitly means
#                            verified. The behavior below carries over; the enum does not,
#                            so Task 1.7 needs a rule of its own rather than a copy of the
#                            existing check (which rejects "verified" outright)
#   evidence_note          — <=150 soft / 300 hard chars. REQUIRED whenever
#                            evidence_strength is "directional"; FORBIDDEN (absent or null)
#                            when "verified" — the same BEHAVIORAL rule
#                            lenses/standards-competitor-ratings.yaml enforces. States what
#                            the rating rests on, not a second rationale
#   element_ids            — array of accreditation element_id strings, or empty
#   persona_relevance      — array of content/personas/*.yaml filenames without extension
#                            (role-* / discipline-* / lens-* slugs), or empty. Tag-only
#   sources                — array of {source_id, locator?}, at least one entry, REQUIRED
#
# exxat_cells[] — Exxat's own side of the same rows, held to the same standard:
#   domain                 — as above
#   capability_id          — must match a capability_id that appears somewhere in cells[]
#                            (or carry exxat_coverage: "unresearched", below, when Exxat's
#                            side genuinely hasn't been checked for a capability_id that so
#                            far only appears in cells[])
#   exxat_coverage         — optional, the single value "unresearched". Present ONLY on a
#                            row whose Exxat side has not been checked yet; on such a row
#                            rating/rationale/evidence_strength/sources may be omitted,
#                            because there is no finding to source. Its whole job is to
#                            make "we haven't looked at our own product here" a visible,
#                            countable state instead of a missing row
#   prism_status           — shipped | roadmap | partial | absent. MUST agree with what
#                            capability-map.yaml states for prism_feature_ref's pillar or
#                            feature (today the file marks four pillars `shipped` and two —
#                            Exam Management, Accreditation Management — `roadmap`).
#                            `partial` is for a pillar that ships but whose specific
#                            capability on this row does not; `absent` pairs with
#                            prism_feature_ref: null. NOTE the enum differs from
#                            lenses/product-gaps.yaml's prism_status (shipped | roadmap |
#                            absent) by this extra `partial` value — deliberate, because a
#                            matrix row is narrower than a gap and can land between shipped
#                            and absent. Don't unify them without deciding which is right
#   prism_feature_ref      — one of the 6 pillar names verbatim (listed above), or null
#   rating                 — fully-meeting | partially-meeting | not-meeting
#   rationale              — <=300 soft / 600 hard chars
#   evidence_strength      — directional | verified. Required on every cell that carries a
#                            rating, exactly as in cells[] above — omissible only on a row
#                            marked exxat_coverage: "unresearched", which has no rating to
#                            classify
#   evidence_note          — <=150 soft / 300 hard chars. Required iff directional,
#                            forbidden when verified — same rule as cells[] above
#   sources                — array of {source_id, locator?}, at least one entry, REQUIRED
#
# INTEGRITY RULE, enforced later (Task 1.7 adds it to scripts/check_content_density.py;
# until then it is this comment): every capability_id appearing in cells[] must also appear
# in exxat_cells[] — either as a real sourced verdict or carrying exxat_coverage:
# "unresearched". That join is the mechanical guarantee that the sales chart's failure mode
# ("Exxat: present on everything", 81 of 81 rows, zero evidence) cannot recur here, because
# Exxat's own coverage requires the same sourced treatment as every competitor's.
