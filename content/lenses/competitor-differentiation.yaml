    counter_move_status: "proposed"
    evidence_strength: "directional"
    evidence_note: "One session: the displaceability is the speaker's judgment and the install base is unquantified — 'some pharmacy customers', with no list curated."
    persona_relevance: ["discipline-pharmacy", "lens-medhub"]
    sources:
      - source_id: "interview-vishaka-pharmacy-understanding-2026-09-04"
        locator: "Section 'Competitors as Vishaka describes them'"

  - domain: "Pharmacy"
    competitor_slug: "e-value"
    axis: "product"
    direction: "unknown"
    claim: "Called archaic and not significantly enhanced internally, yet this repo's own teardown documents an actively shipping product line — the direction is unsettled"
    prism_feature_ref: null
    competitor_feature_ref: null
    detail: >
      Session: "e-Value is archaic and they're not making any significant
      enhancements." e-value.yaml finds the opposite publicly — shipped ACGME
