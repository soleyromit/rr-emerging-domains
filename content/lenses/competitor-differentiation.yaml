    axis: "distribution"
    direction: "competitor-advantage"
    claim: "ASHP requires PharmAcademic for accredited residency programs — an accreditor-mandated install base inside colleges of pharmacy that no feature pitch reaches"
    prism_feature_ref: null
    competitor_feature_ref: "Clinical & Experiential Education"
    detail: >
