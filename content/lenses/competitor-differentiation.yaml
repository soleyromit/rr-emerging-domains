        locator: "Section 'Competitors as Vishaka describes them'"
      - source_id: "product-page-medhub-evalue-2026"

  - domain: "Pharmacy"
    competitor_slug: "pharmacademic"
    # The 2026-09-04 session never mentions PharmAcademic at all — it names CORE,
