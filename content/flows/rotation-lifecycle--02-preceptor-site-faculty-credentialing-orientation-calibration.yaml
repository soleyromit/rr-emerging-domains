      - element: "Preceptor Is Aware [of program expectations] column"
        type: "read-only rollup (Yes/No)"
        data_shown: "Per Site/Location."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.c (specifically the 'syllabus expectations' half of the orientation requirement)."
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents an equivalent named awareness-of-expectations rollup field."
        gap_severity: "configure-needed"
        gap_note: >
          Companion evidence to the Is Oriented column and subject to identical caveats: confirmed and
          named for OT/Social Work, evaluator-entered and point-in-time rather than gate-enforcing,
          with out-of-the-box availability for the four new domains unstated.
      - element: "[PT] Total Qualifications of CIs report (CAPTE 2024 4P / 2016 4O)"
        type: "read-only aggregate report, scoped by Learning Activity Group (cohort / academic year)"
        data_shown: "Education, clinical experience, teaching experience and evaluation-skills fields sourced from the CI Details form (step 3a), aggregated across a cohort. PT Playbook line 218: 'this is also the report AAR reporting uses to answer \"% credentialed CIs,\" \"% with advanced certification,\" and \"any CI with <1 year experience.\"' Line 229 gives the operating instruction: 'build a Learning Activity Group per cohort/academic year, then run Total Qualifications of CIs.'"
        gates_on: []
        accreditation_citation: "CAPTE Standard 4, Element 4P (capte.yaml) — the report is NAMED after this citation in the product. capte.yaml rates 4P 'Transfer' and calls it 'Fully served today and the strongest existing proof point in the file.'"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents an accreditor-named preceptor-qualification aggregate report. This is a genuine, un-benchmarked Prism strength: the report carries the accreditor's own element number in its title."
        gap_severity: "none"
        gap_note: >
          [PT/PTA — THE STRONGEST CONFIRMED PRECEPTOR-QUALIFICATION EVIDENCE ARTIFACT OF THE TWELVE]
          Unlike the Comprehensive Assessment Report columns above — which are an evaluator's Yes/No
          typed onto a site-visit form — this report is COMPUTED from structured credential data and
          answers percentage questions directly ("% credentialed CIs", "any CI with <1 year
          experience"). That is exactly the shape ARC-PA A2.16d (the 10% non-PA/MD/APN ceiling),
          CSWE B3.3.6 (two years post-degree) and ACOTE C.1.13 (one year full-time) all need, and none
          of those three disciplines has an equivalent. Two limits worth carrying: capte.yaml flags a
          PTA variant problem ("PTA Element 4N permits clinical education faculty to be licensed
          physical therapist ASSISTANTS 'if permitted by the state practice act,' so eligibility
          becomes jurisdiction-conditional... Prism's preceptor credential model stores license and
          certification but has no state-practice-act rule layer"), and the PT Playbook flags that
          'programs want to customize standard forms/evals (CI Details, CIET, etc.)' as a live pain
          point — the field source feeding this report is not program-editable.
      - element: "[PT] Average CI Teaching Effectiveness report (CAPTE 2024 4P / 2016 4O)"
        type: "read-only aggregate report (student ratings rolled up per CI)"
        data_shown: "Aggregated student ratings of CI knowledge, communication and mentorship (PT Playbook line 214), sourced from the PTSE 2 — the APTA-standard Physical Therapy Student Evaluation of Clinical Instructor form."
        gates_on: []
        accreditation_citation: "CAPTE Standard 4, Element 4P (capte.yaml) — the 'effective role models and clinical teachers' half of 4P, and its 'how they are MONITORED' clause. ACOTE Standard C.1.8 (acote.yaml) — 'Evaluating the Effectiveness of Supervision', for which acote.yaml identifies the OT counterpart (the SEFWE form family) and names Prism 'Transfer'. CCNE Standard II, Key Element II-G (nursing.yaml) — 'the program is responsible for evaluating the performance of preceptors'. CSWE AS 3.3.4.a.iii (cswe.yaml) — 'evaluating field instructor and field education setting effectiveness'."
        competitor_equivalent: "CORE ELMS documents 'student evaluations of preceptors/sites' within its evaluation module with 'customizable forms, automated' distribution (core-elms.yaml) — genuinely comparable in intent and the closest published analogue in the competitor set. What CORE ELMS does not publish is whether those evaluations aggregate into a per-preceptor effectiveness score tied to an accreditor element, so the comparison holds at capability level and stops short of this report."
        gap_severity: "configure-needed"
        gap_note: >
          [PT/PTA SHIPPED — AND THE SAME OBLIGATION IS A GAP IN NURSING AND SOCIAL WORK] Four
          accreditors across four already-served disciplines require the program to evaluate its
          supervisors, and only two have a shipped standard instrument. PT has PTSE 2 (an APTA-standard,
          free form, with an option to email the completed form back to the CI); OT has the SEFWE family
          plus OT custom forms. The other two do not: nursing.yaml — "The program's EVALUATION OF the
          preceptor — required by CCNE II-G's 'the program is responsible for evaluating the performance
          of preceptors' and by ACEN 2.9's 'monitored' — is a form Prism can BUILD but does not SHIP as
          a standard instrument for nursing the way the AOTA FWPE family ships for OT; the PT-only PTSE2
          is the closest shipped analogue." cswe.yaml splits its 3.3.4 verdict for the same reason:
          "parts (i) and (ii) are Configure, part (iii) is a Gap... What is genuinely missing is
          longitudinal, agency-scoped and instructor-scoped effectiveness trending that supports a
          documented sunset decision; today that is assembled by hand." The asset to reuse is PT's, and
          it is discipline-locked by form content, not by architecture.
      - element: "[PA][SW][OT] Comprehensive Personnel Report (Sites/Agencies > Reports)"
        type: "read-only export (per-preceptor credential roster, exportable to Excel)"
        data_shown: "Degree, Licensure Details, Certification Details, and area of practice per preceptor. PA Playbook lines 184-188: 'The Degree column lets programs show that most preceptors are practicing physicians and PAs... Licensure Details and Certification Details are tracked per preceptor... Shows the list of preceptors currently providing SCPEs and their area of practice.' Best practice noted there: enter each preceptor's area of practice so it surfaces in this report."
        gates_on: []
        accreditation_citation: "ARC-PA 6e Standard A2, Elements A2.15 and A2.16 a-d (arc-pa.yaml) — Exxat's own PA accreditation guide names this report as the answer for both. ARC-PA Standard B3, Element B3.06 a-g — preceptor-enabled learning outcomes by specialty, which the area-of-practice column evidences (PA Playbook line 275). CSWE AS B3.3.6 (cswe.yaml) — the SW accreditation guide names it as the scale export proving field instructors meet CSWE requirements. ACOTE Standards C.1.10 and C.1.13 (acote.yaml) — the OT ACOTE guide names it for 'identification of missing or expiring licensure'."
        competitor_equivalent: "CORE ELMS' 'preceptor license tracking' (core-elms.yaml) is the nearest published capability and, per the same source, spans the same disciplines (PT, OT, PA, nursing, social work among 15+). Neither vendor publishes the column list, so the comparison cannot be completed at report granularity — but note the direction of the residual doubt is symmetrical here, unlike the expiry-alerting comparison in step 3 where CORE ELMS' published claim is stronger than Prism's confirmed behaviour."
        gap_severity: "configure-needed"
        gap_note: >
          [PA + SW + OT — ONE REPORT, THREE ACCREDITORS, THE SAME MISSING ARITHMETIC] This is the most
          widely reused preceptor artifact across the already-served disciplines and it is named in three
          separate Exxat-authored accreditation guides. Its consistent limitation is also the same in all
          three: it EXPORTS credential rows, it does not EVALUATE them. arc-pa.yaml — "What is missing is
          arithmetic, not data... Both thresholds are computed by hand in Excel today." cswe.yaml — the
          accredited-program and post-degree-years facts are not attributes, so the export cannot prove
          the standard. acote.yaml — the one-year-experience fact "lives inside a form response." Three
          disciplines, three different threshold rules, one shared fix: promote the threshold-bearing
          facts to structured Personnel fields, then the existing report answers all three.
      - element: "[SLP][TE] Absence of a discipline-specific preceptor-qualification rollup"
        type: "absent (no confirmed equivalent report)"
        data_shown: "Nothing. SLP's confirmed report suite is 'built almost entirely around clinical log / clock hour data' (SLP Playbook line 122) — clinical educator appears as a FILTER on student-centric reports, never as the unit of a qualification rollup. TE has no confirmed report suite in any source."
        gates_on: []
        accreditation_citation: "CAA/ASHA Standard 2.0, Standard 2.3 (caa-asha.yaml) — qualifications of ALL individuals providing clinical education, on-site and off-site, must be demonstrable; caa-asha.yaml also records an adjacent computation Prism does not do ('CAA 2.3's majority of academic content taught by doctoral faculty (PhD, EdD) is a workload-weighted composition calculation across the curriculum; nothing in the shipped personnel or curriculum data model computes that ratio'). CAEP Standard R2, Component R2.2 (caep.yaml) — 'three cycles of data with analyses' on clinical educators."
        competitor_equivalent: "Not comparable — the finding is an absence on the Prism side, and no competitor teardown documents discipline-conditional report availability either, so there is nothing to compare against in either direction."
        gap_severity: "gap"
        gap_note: >
          [SLP + TE — THE TWO THINNEST DISCIPLINES IN THIS STAGE] Recorded explicitly rather than left
          silent, because a reader of this file could otherwise assume the PT/PA/OT/SW reporting story
          generalises. It does not. SLP is well served for supervision HOURS and poorly served for
          supervisor QUALIFICATION rollups, and carries the added constraint that new custom forms
          require a support ticket. Teacher Education has no confirmed product evidence at all for this
          stage — the TE Playbook's own data-quality caveat (line 12) and the 37-line
          /Users/romitsoley/Downloads/TEVideosTranscripts.md (zero preceptor/credential/orientation
          mentions) are the complete TE product record, so caep.yaml's ratings for R2.2 are reasoned
          from Prism's generic multi-entity gate rather than from observed TE behaviour. CAEP's
          'three cycles of data with analyses' requirement makes TE the discipline with the longest
          evidence-retention ask and the least verified product support for it.

