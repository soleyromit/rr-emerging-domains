  # Discipline playbooks for the eight already-served disciplines
  - "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical Therapy (PT) Playbook.md — READ IN FULL 2026-08-25 (previously cited by section name or per-stage sample). Lines used across this journey: 18-22 (DCE, ADCE, Program Coordinator, SCCE and CI role definitions, incl. the SCCE frequently also being a CI and regional SCCEs covering many facilities), 34-37 (APTA, CAPTE, ACAPT, ABPTRFE), 43 (the clinical-settings taxonomy), 45-53 (graduation-year cohorts, always Lock Step, cohort movement, off-track students and the original-rotation best practice), 55-60 (Groups, Categories, Announcements, Resources, Attestations, per-setting Program Requirements), 62-64 (compliance, and the instruction to ask where a school tracks compliance if not in Prism), 66-77 (course and rotation setup incl. the full field list and the ICE/DPE/residency special cases), 79-85 (the March 1 M1M cycle, reserved-vs-FCFS responses and Exxat One), 87-91 (wishlist patterns and Placement Assist), 93-97 (pre-placement activity), 99-108 (the four placement modes), 110-113 (slot confirmation and cancellation emails), 115-123 (placement notification lead times and the student-contacts-CI convention), 125-174 (the learning-activity and standard-instrument inventory: PTSE 1, PTSE 2, CIET v2, PTMACS/PTAMACS, SCIPAI and the Duke-developed Standard PT/PTA Surveys), 176-180 (thanking supervisors and the state-variable CEU conversion), 182-188 (pain points, incl. the four marketplace competitors at line 184 and the national competition for IP/acute slots at line 186), 190-197 (the enhancements list, incl. mapping competencies to CAPTE 2024 and the absent Exxat CSIF), 208-232 (the seven CAPTE-mapped reports and the five-section AAR pull sequence), 234-244 (CIET v2.0 full mechanics), 246-248 (the CI Details form as the licensure-renewal and eligibility-check mechanism), 250-259 (the four DCE performance-survey templates), 261-263 (low-score indicators and the support-gated notification), 265-270 (M1M email operations), 272-277 (PTMACS/PTAMACS additional mechanics), 279-281 (the Exxat One availability-based wishlist). In THIS file the load-bearing lines are 22 (the SCCE-is-often-also-a-CI overlap), 148 and 239 (the CIET training quiz: housed in Prism, prompted at first use, CI attest-and-bypass, the 15/20 threshold, unlimited retakes with wrong answers highlighted, once-ever cross-course persistence, and the now-live training-quiz report), 214-221 (the CAPTE-mapped reports, incl. Total Qualifications of CIs as the AAR source for percent-credentialed, percent-with-advanced-certification and any-CI-under-one-year), 229 (build a Learning Activity Group per cohort/academic year before running it), and 246-248 (the CI Details form as Prism's licensure-renewal and instructor-eligibility mechanism rather than a roster field)."
