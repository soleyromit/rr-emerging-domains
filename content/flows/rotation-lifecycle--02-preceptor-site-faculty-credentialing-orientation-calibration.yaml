          transcript states the opposite actor for the same toggle — "an attestation that CLINICAL
          EDUCATORS need to sign WHEN THEY REVIEW student submitted logs"
          (/Users/romitsoley/Downloads/SLPVideosTranscripts.md line 37) — and the CRNA transcript
          agrees with SLP. Both readings share the auto-approval exclusion, so this is one mechanism
