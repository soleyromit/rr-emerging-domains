          THIS step. A student-signed integrity pledge has no calibration or accountability value on
          the supervisor side at all, so if the PA reading is the accurate one for PA, then PA has no
          reviewer-accountability artifact anywhere in its log workflow — which matters because the
          PA transcript also documents that enabling auto-approval DISABLES PRECEPTOR REVIEW outright
