# Element-level ground truth underneath rotation-lifecycle.yaml, stage 2
# ("2. Preceptor / site-faculty credentialing, orientation & calibration").
# Every confirmed_by citation below is a real file in the help-center mirror, a discipline
# playbook, the capability map, or an accreditation standard file — never re-derived from the
# journey's own narrative.
#
# SCHEMA v2 (2026-08-24): accreditation_citation / competitor_equivalent / gap_severity /
# gap_note now live on each ELEMENT rather than on the step. Where a step's original research
# genuinely did not distinguish between sibling elements, the same verdict is stated identically
# on each rather than inventing artificial precision.
#
# 12-DISCIPLINE EXTENSION (2026-08-25): this file was originally written covering only the four
# EXPANSION domains (DO, Pharmacy, Dentistry, Medicine) and therefore cited only acpe.yaml,
# coda.yaml, coca.yaml and lcme.yaml. It has now been extended to also cover the eight
# disciplines Exxat/Prism ALREADY serves in production — PT/PTA, OT/OTA, PA, SLP, Nursing,
# Social Work, Teacher Education, and CRNA — against their real accreditor registries
# (capte.yaml, acote.yaml, arc-pa.yaml, caa-asha.yaml, nursing.yaml [CCNE + ACEN], cswe.yaml,
# caep.yaml, coa.yaml). Every element added in that pass is marked with a leading
# [PT] / [OT] / [PA] / [SLP] / [NURSING] / [SW] / [TE] / [CRNA] tag in the `element` name so the
# already-served content is separable from the four-domain baseline.
#
# WHY THIS STAGE CHANGES SHAPE WHEN THE EIGHT ARE INCLUDED: the four-domain baseline treats
# preceptor credentialing as ONE workflow (Sites > Personnel, plus the Experiential Supervisor
# Intake Form). The already-served disciplines demonstrate that Prism actually ships FOUR
# structurally distinct preceptor-credentialing workflows that the baseline never surfaced —
# (a) the Sites-module Personnel record + PIF, (b) a course-scoped, student-submitted educator
# details form living in Learning Activities (steps 3a below), (c) a slot-level supervision-ratio
# declaration (step 5a), and (d) an instrument-calibration training quiz (step 8a). Three of the
# four new steps below exist ONLY because an already-served discipline needed them.
#
# THE SINGLE MOST DISTINCTIVE FACT IN THIS STAGE across all twelve disciplines is COA Standard
# F.7 (CRNA): "At no time does the number of students directly supervised by an individual
# clinical preceptor exceed 2:1" — the only HARD, numeric, critical-flagged supervision cap
# anywhere in the twelve accreditor registries. It is handled at step 5a.
flow_name: "Preceptor & Faculty Credentialing, Orientation & Calibration"
maps_to_journey: "rotation-lifecycle.yaml, stage 2"
persona: >
  Clinical / Experiential Education Coordinator (role-clinical-coordinator.yaml), acting as
  Program Administrator in Prism, coordinating with a Faculty Compliance Administrator where
  internal/didactic faculty (as opposed to off-site preceptors) are the credentialed entity —
  see step 5's note on the two distinct personnel populations this stage actually covers.
  In the eight already-served disciplines this same persona carries a discipline-specific title
  and a discipline-specific supervisor vocabulary that the screens below inherit: Director of
  Clinical Education (DCE/ACCE) supervising Clinical Instructors and SCCEs in PT/PTA; Academic
  Fieldwork Coordinator supervising Fieldwork Educators and Site Mentors in OT/OTA; Clinical
  Coordinator supervising Preceptors in PA; Clinical Educators (a.k.a. experiential supervisors)
  in SLP; Preceptors under Sites > Personnel in Nursing/CRNA; Field Instructors and Task
  Supervisors under an Agencies-labelled Sites module in Social Work; and Cooperating/Mentor
  Teachers plus University Supervisors in Teacher Education. Confirmed in the discipline
  playbooks' terminology sections (PT Playbook lines 21-29; OT Playbook line 56; SLP Playbook
  line 29; SW Playbook lines 19-20; Nursing Playbook lines 16-19; TE Playbook line 67, which
  explicitly flags TE terminology as UNCONFIRMED).
steps:
  - screen: "Sites > Personnel > Add Personnel wizard"
    navigation_path: "Sites > Personnel tab > Add Personnel"
    action: >
      Coordinator creates a Personnel record for a new preceptor/clinical instructor, marks
      "Will this person serve as Clinical Instructor?" = Yes, and associates them to a site/location.
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Managing Personnel.md; corroborated by /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Add or Edit CI - Preceptor Information.md"
    elements:
      - element: "Will this person serve as Clinical Instructor?"
        type: "toggle (Yes/No)"
        data_shown: "Marks the personnel record as a preceptor/CI; toggling Yes is what exposes the Slots and Placements tabs on that person's profile later. Toggling an existing preceptor back to No removes those tabs from their profile."
        gates_on: ["Whether Slots/Placements tabs appear on the personnel profile", "Whether the person is eligible to receive an Experiential Supervisor Intake Form (step 2) — a non-CI-marked record cannot be sent one"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a and CODA Standard 2, Element 2-6 — this specific toggle is what makes a person a queryable preceptor/CI entity at all, which both a preceptor roster (ACPE) and faculty calibration tracking (CODA) presuppose."
        competitor_equivalent: "New Innovations' 'Credentialling Module' (new-innov.com/pub/gme_details.html, cited in competitors/new-innovations.yaml) and MedHub's 'Automated Credentials Monitoring' (competitors/medhub.yaml) are documented only at marketing-page granularity — neither publishes whether they carry an equivalent role-marking toggle, so no field-level comparison is possible from available sources."
        gap_severity: "none"
        gap_note: >
          This is the element that RESOLVES the journey's core hedge ("unclear whether Compliance
          Management natively models preceptors as a trackable entity today versus only students").
          The preceptor/CI is a first-class Personnel entity, structurally distinct from a Student
          record, and this toggle is the documented mechanism that establishes it.
      - element: "Professional Details section"
        type: "input field set"
        data_shown: "Degree, Practice Settings (multi-select), Designation, National Provider Identifier (NPI), Credentials (free text)."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a — the degree/NPI/credentials fields are where the U.S.-licensure-adjacent roster data for a preceptor is actually stored."
        competitor_equivalent: "Not comparable at element level: New Innovations and MedHub describe credential monitoring only as a marketing-page capability and publish no field list for their own personnel records."
        gap_severity: "none"
        gap_note: >
          Confirmed as shipped, structured fields on the preceptor entity. Note that Credentials is
          free text rather than a validated/dated licensure object — the date-aware expiry question
          is raised properly at step 3, not here.
      - element: "Additional Details section"
        type: "input field set"
        data_shown: "Alumni (Yes/No), Faculty Type (dropdown), Working Hours."
        gates_on: []
        accreditation_citation: "None — no accreditation standard in the source material asks for alumni status, faculty type, or working hours as preceptor evidence. This is program-operations metadata, not accreditation evidence."
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents an equivalent metadata field set."
        gap_severity: "none"
        gap_note: >
          Shipped and complete as documented; carries no accreditation obligation, so no gap arises.
      - element: "Site and Location Association tab"
        type: "input field set"
        data_shown: "Which site(s)/location(s) the preceptor is attached to, their Practice Setting/Designation per location, and a Primary Site flag."
        gates_on: ["Whether the preceptor is included in Slot Request emails for a given location"]
        accreditation_citation: "None directly — site association is the routing/scoping mechanism that later screens (steps 3, 4, 7 report by Site/Location) depend on, but no standard in the source material names it as the evidence location itself."
        competitor_equivalent: "Not comparable at element level — no competitor teardown reaches the granularity of a per-location preceptor association record."
        gap_severity: "none"
        gap_note: >
          Shipped as documented. Worth flagging only as a dependency: the Comprehensive Assessment
          Report in step 7 aggregates preceptor evidence per Site/Location, so this association is
          what makes that rollup addressable.
      - element: "[OT][PT][SW][CRNA] Designation field (Professional Details) — the discipline-specific supervisor role vocabulary"
        type: "dropdown (program-configurable lookup, set at Sites > Setup > Sites Organization > Personnel Categories)"
        data_shown: "The named role this person plays at this site. Confirmed per-discipline value families: OT/OTA uses 'Fieldwork Educator' for clinical placements and 'Site Mentor' for the doctoral capstone (OT Playbook line 223: 'Roles such as Fieldwork Educator and Site Mentor (for capstone projects) are designated per site'; line 56); PT/PTA distinguishes Clinical Instructor (CI) from Site Coordinator for Clinical Education (SCCE), who are frequently the same human being (PT Playbook line 22: 'the SCCE is oftentimes also a CI'); Social Work distinguishes Field Instructor from Task Supervisor (SW Playbook lines 19-20); CRNA distinguishes clinical preceptor from the site's CRNA coordinator (COA Standard F.3)."
        gates_on: ["Which Personnel rows appear in the Field Instructor / Task Supervisor dropdown on the SW Placement Record (SW Accreditation Standards guide, B3.3.6 section: 'the relevant faculty member should be added as a staff at the agency where the student is to be placed. Once this is done, the faculty member's name will start showing in Field Instructor and Task Supervisor drop-down on placement screen')"]
        accreditation_citation: "ACOTE Standard C.1.13 (acote.yaml) and Standard C.1.10 — Level I and Level II fieldwork educators carry DIFFERENT qualification bars (C.1.10 permits psychologists, PAs, teachers, social workers, physicians, SLPs, nurses and PTs as Level I educators; C.1.13 requires a licensed OT with 1 year full-time experience for Level II), so the role designation is the field that determines WHICH bar applies. CSWE AS B3.3.6 / M3.3.6 (cswe.yaml) — the Task-Supervisor-versus-Field-Instructor distinction is the entire mechanism CSWE's 'process for assigning a qualified field instructor when an individual with the required degree and practice experience is unavailable in the field setting' turns on. COA Standard F.5 (coa.yaml) — supervision is restricted by ROLE TYPE (CRNA / physician anesthesiologist / credentialed expert for a named nonanesthetizing area)."
        competitor_equivalent: "CORE ELMS advertises 'centralized site/student/preceptor management' across '15+ disciplines including pharmacy, dental, nursing, PT, OT, PA, veterinary, social work, and undergraduate medicine' (core-elms.yaml, feature_teardown > Clinical & Experiential Education) — the only competitor in the set that claims the same multi-discipline breadth this element serves. But CORE ELMS publishes no per-discipline role taxonomy, so whether their preceptor record distinguishes an OT Site Mentor from a PT SCCE cannot be established from public sources."
        gap_severity: "configure-needed"
        gap_note: >
          [ALREADY-SERVED DISCIPLINES] Confirmed shipped and genuinely multi-discipline: the same
          Personnel entity carries all eight served disciplines' supervisor vocabularies because
          Personnel Categories is a program-editable lookup list (see
          flows/admin-onboarding--05-sites-locations-personnel-management.yaml, "Personnel
          Categories list"). The gap is that designation is a LABEL, not a RULE: nothing in the
          product ties "Level II Fieldwork Educator" to ACOTE C.1.13's licensed-OT-plus-one-year
          bar, or "Task Supervisor" to CSWE's requirement that a qualified off-site Field Instructor
          must also exist on the same placement. Every role-conditional qualification rule across
          these four disciplines is enforced by a human remembering it.
      - element: "[PA] Professional Details > Degree field — the preceptor-composition denominator"
        type: "input field (free text / lookup), surfaced as a report column"
        data_shown: "The preceptor's degree, which the Comprehensive Personnel Report exposes as the Degree column. PA Playbook line 184: 'The Degree column lets programs show that most preceptors are practicing physicians and PAs.'"
        gates_on: []
        accreditation_citation: "ARC-PA 6e Standard A2, Elements A2.15 and A2.16 a-d (arc-pa.yaml) — 6e reworded 5e's 'primarily' to 'MAJORITY' (>=50%) for SCPE experiences with PAs and physicians, and added a hard ceiling that no more than 10% of SCPE instructional faculty may be other clinicians the program itself vets. This Degree field is the only structured input either computation can run on."
        competitor_equivalent: "Not comparable at element level — no competitor teardown in content/competitors documents a preceptor degree/credential-type field at all, let alone one used as the denominator of an accreditor-mandated composition ratio."
        gap_severity: "gap"
        gap_note: >
          [PA — DISTINCTIVE] PA is the only one of the twelve disciplines whose accreditor imposes a
          COMPOSITION ratio on the preceptor pool itself (as opposed to a supervision ratio on a
          single preceptor). arc-pa.yaml is explicit that the data exists and the arithmetic does
          not: "Both thresholds are computed by hand in Excel today... A2.15's test is explicitly PER
          INDIVIDUAL STUDENT — it requires joining the placement roster to the preceptor credential
          roster and rolling up per student, which the Comprehensive Personnel Report (a
          preceptor-centric export) cannot do alone. A2.16d's 10% ceiling is a program-level ratio no
          report computes." Note the field itself is free-form: a Degree of "MD", "M.D." and "Doctor
          of Medicine" are three different strings, which is why the ratio is not computable without
          cleanup even if someone wrote the query.
      - element: "[SW][OT] Credentials / degree fields as evidence of a QUALIFICATION rather than a document"
        type: "input field (free text) + document upload"
        data_shown: "Degree information, licensure details and professional experience, with resumes/transcripts/licenses uploaded directly on the profile (SW Accreditation Standards guide, B3.3.6: 'Exxat's Agency Personnel allows for storage of degree information, licensure details, and professional experience... Supporting documentation (Example: resumes, transcripts, or licenses) can be uploaded directly within the personnel profile')."
        gates_on: []
        accreditation_citation: "CSWE AS B3.3.6 / M3.3.6 (cswe.yaml) — field supervision must come from someone holding a BSW/MSW FROM A CSWE-ACCREDITED PROGRAM with at least TWO YEARS of post-degree practice experience. ACOTE Standard C.1.13 (acote.yaml) — the Level II fieldwork educator must have 'a minimum of one year of full-time (or equivalent) practice experience as a licensed or otherwise regulated occupational therapist PRIOR TO the onset of the fieldwork', and for non-U.S. placements must have graduated from an ACOTE-accredited, WFOT-approved, or host-country-regulated program."
        competitor_equivalent: "CORE ELMS documents 'preceptor license tracking' with 'automated expiration reminders' (core-elms.yaml, Compliance Management pillar) — the single most granular competitor claim about preceptor credentials anywhere in content/competitors. It is still a claim about DOCUMENT PRESENCE AND EXPIRY, not about qualification CONTENT (accredited-program provenance, years of post-degree experience), so on this specific element neither product is documented as clearing the bar and no advantage can be claimed either way."
        gap_severity: "gap"
        gap_note: >
          [SW + OT — DISTINCTIVE, AND THE SAME GAP TWICE] Two different accreditors ask for the same
          shape of fact and Prism stores neither as a structured attribute. cswe.yaml states it
          precisely: "The specific fact CSWE actually audits — 'the degree is from a CSWE-ACCREDITED
          program' and 'two years POST-DEGREE' — is not a structured attribute anywhere; Placement
          Clearance reports only that a CV/license/certification document EXISTS, not that its
          contents clear the standard... Two small structured fields on the Personnel record
          (accredited-program boolean, degree-conferral date) would convert an existence check into a
          compliance check." acote.yaml reaches the identical conclusion independently: "'1 year
          full-time practice experience' and 'adequately prepared' are not structured personnel fields
          at all — they live inside a form response, so they cannot be gated on or reported without
          reading forms one by one." This is the highest-leverage shared finding in the stage: ONE
          pair of fields on the Personnel record closes an accreditor-audited gap in two
          already-served disciplines simultaneously.
      - element: "[SW][NURSING] Certification section on the Personnel profile — the de facto orientation-completion store"
        type: "sub-record set (certification entries + document upload)"
        data_shown: "Certification details, additional documents and assistant information (Managing Personnel.md: 'Load on certification details, any additional documents, and assistant information'). Social Work uses this section specifically to hold FIELD INSTRUCTOR ORIENTATION-COMPLETION CERTIFICATES."
        gates_on: ["The Preceptor Certification column on the Placement Clearance Dashboard (step 3) — SW Accreditation Standards guide, 3.3.4.a.ii: 'It is also useful to add the certificate of completion here as it makes it possible to track whether all instructors assigned to placement have completed orientation or not through Placement Clearance dashboard under Placements module.'"]
        accreditation_citation: "CSWE AS 3.3.4 (cswe.yaml), specifically compliance statement 3.3.4.a.ii ('a process for orienting and engaging with field instructors'). CCNE Standard II, Key Element II-G and ACEN Standard 2, Criterion 2.9 (nursing.yaml) — ACEN 2.9 requires preceptors be 'oriented, mentored, and monitored'; this is the only confirmed place in the product where orientation completion becomes a per-person, per-placement queryable status."
        competitor_equivalent: "Not comparable at element level. CORE ELMS' 'preceptor license tracking' (core-elms.yaml) and MedHub/E*Value's 'Automated Credentials Monitoring... state, DEA, and Controlled Substances licenses' (e-value.yaml) are both LICENSURE monitors; no competitor teardown documents preceptor ORIENTATION completion as a tracked artifact at all."
        gap_severity: "configure-needed"
        gap_note: >
          [SW — DISTINCTIVE, AND IT PARTIALLY RESOLVES THE STAGE'S CENTRAL ORIENTATION HEDGE]
          The four-domain baseline of this file concluded (step 7, "Preceptor Is Oriented" column)
          that orientation evidence in Prism is an evaluator's point-in-time Yes/No on a site-visit
          form, not a pre-assignment gate. Social Work demonstrates a genuinely different and
          stronger pattern that ships today: store the orientation certificate as a CERTIFICATION on
          the personnel record, and the existing Preceptor Certification tri-state on the Placement
          Clearance Dashboard becomes an orientation tracker for free. That is a real, documented,
          per-placement orientation check — the closest thing to an orientation GATE anywhere in the
          twelve disciplines, and it should be offered to the four expansion domains verbatim.
          Two honest limits: (a) it is a CONVENTION, not a feature — nothing in the product
          distinguishes an orientation certificate from a board certification in that column, so a
          preceptor with a board cert but no orientation reads as "Exists"; (b) it inherits the
          presence-only semantics documented on the Certification column in step 3, so an annual
          re-orientation requirement has no expiry behaviour behind it.
      - element: "[CRNA][OT] Slots tab on the personnel profile (Experiential Supervisors only)"
        type: "read-only grid (per-supervisor slot rollup) with filter, sort, column-customization and export"
        data_shown: "Every slot associated with this supervisor across all locations and sites, with columns for Location, Site, Rotation, Start/End Dates, Associated Experiential Supervisor(s), Cohort, Setting, OFFERED / AVAILABLE / STUDENTS PLACED counts, Slot Status, Slot Type, SUPERVISION TYPE, shared/internal notes, and last-updated actor. Filterable by Supervision Type among eleven other criteria (Managing Personnel.md, 'Manage Slots Associated to Personnel')."
        gates_on: []
        accreditation_citation: "COA Standard F.7 (coa.yaml) — CRITICAL (*): 'At no time does the number of students directly supervised by an individual clinical preceptor exceed 2:1.' ACOTE Standard C.1.7 (acote.yaml) — the fieldwork-educator-to-student ratio must permit proper supervision and frequent assessment. This grid is the ONLY confirmed screen in Prism that shows offered/placed counts aggregated to a NAMED SUPERVISOR rather than to a site or a location."
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents a per-preceptor slot rollup. eMedley advertises 'site capacity management' inside eduSched (emedley.yaml) and CORE ELMS advertises 'SmartMatch' student-site-preceptor matching (core-elms.yaml), but both are described at site/matching granularity with no published per-supervisor capacity view."
        gap_severity: "gap"
        gap_note: >
          [CRNA — THE DECISIVE ELEMENT FOR THIS DISCIPLINE] This tab is the closest thing in the
          shipped product to a per-preceptor load view, and it is still the wrong unit for COA F.7.
          Students Placed here counts students placed against a SLOT over a rotation; F.7 counts
          students DIRECTLY SUPERVISED BY ONE PERSON AT ONE MOMENT. coa.yaml states the distinction
          exactly: "a slot cap constrains how many students a SITE takes over a rotation, whereas F.7
          constrains how many students one PERSON supervises at one moment, and a site with ample
          slots can still breach F.7 on a short-staffed day." Two further confirmed limits: the tab
          only appears for personnel designated Experiential Supervisors (so the CI toggle in the
          first element of this step is a prerequisite), and Supervision Type is displayed, not
          validated — nothing compares the declared supervision model against the Students Placed
          count sitting three columns to its left in the same row.
      - element: "[CRNA] Institutional credentialing versus state licensure — an absent field"
        type: "absent (no confirmed field)"
        data_shown: "Nothing. The documented Professional Details fields are Degree, Practice Settings, Designation, NPI and free-text Credentials; the documented sub-records are licensure details and certification details."
        gates_on: []
        accreditation_citation: "COA Standards F.5 and F.8 (coa.yaml) — F.5 is CRITICAL (*): supervision at clinical sites is limited to CRNAs and physician anesthesiologists who are INSTITUTIONALLY CREDENTIALED to practice and immediately available for consultation. F.8 extends the same test to 'credentialed experts' in nonanesthetizing areas. COA Standard F.3 additionally requires a named, degree-evidenced CRNA coordinator per clinical site."
        competitor_equivalent: "MedHub/E*Value is the only competitor whose credential monitoring reaches hospital-privileging vocabulary — 'real-time tracking of state, DEA, and Controlled Substances licenses, alerting the GME Office to any changes' (e-value.yaml) — but DEA/CSR registration is still a regulatory licence, not institutional privileging at the site where a student works, so it is adjacent rather than equivalent. New Innovations' 'Credentialling Module' (new-innovations.yaml) is named for this problem space but publishes nothing at field level."
        gap_severity: "gap"
        gap_note: >
          [CRNA — DISTINCTIVE] F.5 turns on a fact that is structurally different from every other
          discipline's preceptor-credential test: not "does this person hold a valid state licence"
          but "is this person credentialed BY THIS HOSPITAL to practise here." coa.yaml flags the
          uncertainty honestly rather than asserting the gap: "confirm whether a distinct
          privileging/credentialing evidence field exists or whether it collapses into a generic
          document upload." Nothing in Managing Personnel.md, Add or Edit CI - Preceptor
          Information.md, or the COA Accreditation Standards Support Guide names such a field — the
          COA guide answers F.5 with exactly three rows (Clinical Personnel Profiles, Comprehensive
          Personnel Report, Placement Clearance Dashboard), all of which are the generic
          licence/certification machinery. F.3's site-level CRNA coordinator appointment, with its
          Council-approved five-year exception clock, likewise has no confirmed home in Sites or
          Personnel.

  - screen: "Sites > Setup > Form Setup > Experiential Supervisor Intake Form (PIF) — Builder and Review"
    navigation_path: "Sites > Setup > Form Setup > Experiential Supervisor Intake > Edit (builder); Sites > Personnel > [preceptor] > About > Send Intake Form (send); Sites > Personnel > Experiential Supervisor Intake Responses tab (review)"
    action: >
      Coordinator activates the intake form (a one-time per-program setup), sends a preceptor a
      unique delegator link to self-report CV/licensure/certification and (via a Custom Section
      question) can require an Attestation or E-signature acknowledgment — e.g. of a supervision
      policy — then reviews and syncs the response into the Personnel profile.
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Managing Experiential Supervisor Intake Form.md"
    elements:
      - element: "Standard Section (locked, per-field mandatory toggle only)"
        type: "input field set, partially configurable"
        data_shown: "Pre-configured sections feeding the personnel profile directly: basic info, professional summary (education/experience), work site details, CV/licensure/certification, domain-specific fields (auto-generated per program discipline), student supervision and capacity, documents and notes."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a — the CV/licensure/certification sub-section is the confirmed self-service collection instrument for exactly the data 3.3.a requires on file."
        competitor_equivalent: "No competitor teardown in content/competitors documents a preceptor-facing self-service intake instrument at all — New Innovations, MedHub, and CORE ELMS describe credential *monitoring* over already-held data at marketing-page level, so this section has no comparable published counterpart."
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed shipped for 3.3.a data collection. The constraint that matters: Standard Section
          fields cannot be relabeled or reordered, so this section cannot be made the canonical
          mission/orientation-acknowledgment field — that has to live in a Custom Section instead.
      - element: "Custom Section question types"
        type: "form builder (11-12 element types)"
        data_shown: "Single/multi choice, short/long answer, dropdown, date picker, toggle, Attestation, E-signature, Attestation with signature, file upload, text editor, divider."
        gates_on: []
        accreditation_citation: "COCA Standard 5, Element 5.4 (published supervision-policy distribution and acknowledgment) and ACPE Standard 3, Key Element 3.3.c (orientation acknowledgment) — the Attestation / E-signature / Attestation-with-signature types are where an acknowledgment record would actually be captured."
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents attestation or e-signature question types in a preceptor-facing form builder, so there is nothing published to compare these types against."
        gap_severity: "configure-needed"
        gap_note: >
          PARTIALLY RESOLVES the COCA 5.4 hedge ("pending confirmation that Compliance Management
          supports document-acknowledgment item types, not just checklist/expiry items"): Attestation,
          E-signature, and Attestation-with-signature ARE real, shipped question types here (and in
          the separate Custom Site Assessment form builder — capability-map.yaml's "Custom Site
          Assessment form builder" entry lists the same element family). What remains unconfirmed is
          whether a supervision-policy acknowledgment is pre-built for any of the four new domains;
          today it must be added as a Custom Section question per program.
      - element: "Form status (Draft / Activated)"
        type: "read-only status + Activate button"
        data_shown: "A form in Draft cannot be sent; error message displayed if a send is attempted."
        gates_on: ["Whether 'Send Intake Form' can be used at all for this program"]
        accreditation_citation: "None directly — this is the enablement gate in front of the 3.3.a / 5.4 collection above, not itself an evidence field."
        competitor_equivalent: "Not comparable at element level — no competitor publishes a form-activation lifecycle for a preceptor intake instrument."
        gap_severity: "configure-needed"
        gap_note: >
          A genuine one-time per-program setup step: nothing can be sent until this is Activated.
          Operationally relevant limitation from the source FAQ: bulk-sending the intake form to
          multiple preceptors at once is not yet supported (one supervisor at a time), which matters
          when onboarding an entire adjunct preceptor pool ahead of a rotation block.
      - element: "Review drawer (left: supervisor response, read-only; right: personnel profile, editable)"
        type: "diffed review UI"
        data_shown: "Highlights new/changed/blank-vs-filled values between the submitted response and the current profile."
        gates_on: []
        accreditation_citation: "None — a review/diff surface, not a place where accreditation evidence is stored or gated."
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents a diffed review surface for preceptor self-reported data."
        gap_severity: "none"
        gap_note: >
          Shipped and complete as documented for its purpose (human verification of self-reported
          credential data before it lands on the profile).
      - element: "Save and Sync button"
        type: "button (one-way, irreversible)"
        data_shown: "Writes right-pane values to the personnel profile; response then locked and archived. No reject/undo — a new request is required for further changes."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a — this action is what makes self-reported CV/licensure/certification data become the record of file on the personnel profile."
