      - element: "[CRNA] Supervision Type as the sole answer to COA Standard F.7 (2:1 hard cap)"
        type: "declared attribute on a slot — no computation, no validation, no blocking"
        data_shown: "The supervision model an administrator typed onto the slot. Nothing derived from actual assignment data; nothing per-day; nothing per-named-preceptor at a moment in time."
        gates_on: ["Nothing. No confirmed source documents any block, warning, or notification arising from this field."]
        accreditation_citation: "COA Standard F.7 (coa.yaml) — CRITICAL (*). Verbatim from the COA guide: 'The clinical supervision ratio of students to clinical preceptor ensures patient safety by taking into consideration: the complexity of the anesthetic and/or surgical procedure, the student's knowledge and ability, and the comorbidities associated with the patient. At no time does the number of students directly supervised by an individual clinical preceptor exceed 2:1.' The COA glossary tightens it further (coa.yaml): no more than 2 students to 1 CRNA, or 2 students to 1 physician anesthesiologist where no CRNA is involved."
        competitor_equivalent: "No competitor teardown in content/competitors documents a supervision-ratio computation, cap, or enforcement of any kind — not CORE ELMS (whose SmartMatch matches on 'customizable rules' but publishes no ratio dimension), not eMedley eduSched, not MedHub, not New Innovations. This is an un-benchmarked gap rather than a competitive disadvantage: nobody in the documented competitor set does it either."
        gap_severity: "gap"
        gap_note: >
          [CRNA — THE SINGLE MOST DISTINCTIVE FACT IN THIS STAGE ACROSS ALL TWELVE DISCIPLINES]
          COA F.7 is the only HARD, NUMERIC, CRITICAL-FLAGGED supervision cap in any of the twelve
          accreditor registries in content/accreditation, and Prism does not compute it. coa.yaml is
          unambiguous: "Prism holds every input but computes none of the output... a slot count is a
          static number an admin types... This is COA's single most distinctive, most enforceable,
          critical-flagged requirement and Prism does not compute it today."
          The unit mismatch is the whole problem and is worth stating precisely, because it is easy to
          mistake this for a capacity feature request: F.7's unit of enforcement is PRECEPTOR-SHIFT
          (which named CRNA is responsible for which students on which clinical day), not placement
          and not slot. A CRNA site with ample slots, a correct "2 Students:1 CI" Supervision Type on
          every slot, and every preceptor licence showing Exists on the Clearance Dashboard can still
          breach a CRITICAL standard on a short-staffed Tuesday, and nothing in the product would
          know. coa.yaml's scoping recommendation, carried here verbatim because it is the actionable
          output of this element: scope "a new derived object — 'supervision assignment (preceptor x
          date x students)' — sitting between Slot and Placement, plus an exception log", reusing two
          existing precedents (the Placement Assist overlapping-rotation guard, already a concurrency
          check on the wrong axis; and the geolocated Faculty Timesheet, already tying a named
          supervising faculty member to a time-bounded clinical shift). Add the PA Max Placement Limit
          warning (step 4) as a third precedent for injecting the check at commit time.
          The exception log is not optional decoration: F.7 PERMITS brief exceedance for extenuating
          circumstances, but only where the program can then demonstrate the event was rare AND that
          contingency plans existed — a structured record of date, reason, contingency action and
          approver is therefore part of the standard, not a nice-to-have.
          Finally, the CRNA product transcript confirms the absence from the other direction:
          /Users/romitsoley/Downloads/CRNAVideosTranscripts.md is 117 lines covering three CRNA
          product areas and mentions the preceptor ONLY as a reviewer/attester of student logs (line
          67: "you must specify whether a preceptor should review the student's patient log"; line 71:
          "enable the Enable Attestation option to require preceptors to acknowledge an attestation
          when reviewing logs") and as a response source on the Daily Clinical Evaluation Report
          (line 27). The preceptor never appears as a supervision-capacity dimension anywhere in the
          CRNA product material.
