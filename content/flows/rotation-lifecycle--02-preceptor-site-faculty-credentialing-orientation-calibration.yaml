  - screen: "[PT] Learning Activities > CIET v2.0 training quiz — the instrument-calibration gate for clinical instructors"
    navigation_path: "Learning Activities > [course] > Setup > Forms/Evaluations > CIET v2.0 (activate, choosing Midterm+Final or Final-only); the quiz then fires for the student at first form use, and for the CI on first access to the emailed delegator link ('select Yes if the instructor has taken the prerequisite training quiz earlier, and select No to take the quiz'); results at the CIET training-quiz report"
    action: >
      Before a clinical instructor may rate a student on the CIET v2.0 evaluation instrument, they
      must pass — or attest to having previously passed — a built-in training quiz on how to use the
      instrument. This is the ONLY confirmed mechanism anywhere in the twelve disciplines that trains
      and gates a rater on an assessment tool before letting them rate, and it is the closest thing
      in the product to the "calibration" this journey stage is named for.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Discipline Specific Guides/PT-PTA Discipline/Help Guides/Clinical Internship Evaluation Tool - Version 2.0.md
      (lines 48-54: "The CIET v2.0 requires students and the clinical instructors to take a
      pre-requisite quiz (integrated in Exxat Prism) to ensure that the student and the clinical
      instructor have the adequate knowledge to fill the form. This quiz is to be taken at the first
      instance when the student or clinical instructor fills the CIET form. Students and clinical
      instructors can retake the quiz as many times as necessary until they pass."; line 144: "Once
      the student clears the training, the student need not take the quiz again, even though the
      student is filling the quiz second time."; line 169: "Clinical Instructor should select Yes, if
      the instructor has taken the prerequisite training quiz earlier, and select No, to take the
      quiz."). Threshold, retake and report mechanics corroborated by
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical Therapy (PT) Playbook.md
      lines 148 and 239 (the quiz is housed in Prism and students are prompted at first use; CIs
      can take it or attest and bypass; a CIET training-quiz report is now live; the pass threshold
      is 15/20 = 75% with unlimited retakes and wrong answers highlighted on a failed attempt; and
      once passed, a student or CI never retakes it again, even across different courses or
      placements).
    elements:
      - element: "[PT] Training quiz pass threshold (15/20 = 75%) with unlimited retakes and wrong-answer review"
        type: "gating quiz (pass/fail, blocking)"
        data_shown: "Twenty questions on correct use of the CIET instrument; 15 correct required; unlimited retakes; wrong answers highlighted on a failed attempt (PT Playbook line 239)."
        gates_on: ["Access to complete the CIET v2.0 form at all — a CI who has neither passed nor attested cannot rate the student"]
        accreditation_citation: "CAPTE Standard 4, Element 4P (capte.yaml) — 4P requires 'identification of the assessment tool(s) used during clinical education, HOW CIs ARE TRAINED IN THEIR APPROPRIATE USE, and how the program determines the tool was completed correctly.' capte.yaml records this quiz as the confirmed answer. CODA Standard 2, Element 2-6 (coda.yaml) — cited as the closest structural analogue in the expansion domains: dentistry's calibration standard asks that multiple faculty grading the same procedure agree with each other, and rater training on a shared instrument is the mechanism that produces that agreement."
        competitor_equivalent: "Not comparable at element level, and notably so. No competitor teardown in content/competitors documents rater training, rater calibration, or any gate on who may complete an evaluation instrument. CORE ELMS documents 'preceptor assessments of students' with 'customizable forms' (core-elms.yaml) and Elentra documents a form builder plus 'automated distributions' (elentra.yaml) — both describe who RECEIVES a form, neither describes qualifying who may FILL one."
        gap_severity: "none"
        gap_note: >
          [PT/PTA — DISTINCTIVE, AND THE STRONGEST CALIBRATION ARTIFACT IN THE ENTIRE PRODUCT] This is
          the element that most changes the picture when the already-served disciplines are included.
          The four-domain baseline of this file concluded, correctly for those four, that CODA 2-6's
          substantive calibration ask "is not addressed by this element or anything else found in the
          source material" (step 8, Document Status dropdown). That conclusion is now too strong:
          Prism DOES ship real rater-calibration machinery — a blocking, threshold-scored, retakeable,
          wrong-answer-reviewing training gate on a specific assessment instrument, with its own
          report — it is just fenced to one instrument (CIET v2.0) in one discipline (PT/PTA). The
          product question this raises for the expansion domains is not "can Prism do calibration"
          but "can the CIET quiz mechanism be generalised to an arbitrary instrument", which no source
          answers either way.
      - element: "[PT] Once-ever, cross-course persistence of a passed quiz"
        type: "person-level, instrument-level permanent flag"
        data_shown: "A pass is retained against the person forever: 'Once passed, a student or CI never retakes it again — even across different courses/placements' (PT Playbook line 239); 'the student need not take the quiz again, even though the student is filling the quiz second time' (source article line 144)."
        gates_on: []
        accreditation_citation: "CAPTE Standard 4, Element 4P (capte.yaml) — 'a trainable, AUDITABLE record of CI instrument training' is the required software behavior; permanence is what makes it auditable across cohorts. CODA Standard 2, Element 2-6 (coda.yaml) requires calibration training be ONGOING — which this element does not satisfy, see gap_note."
        competitor_equivalent: "Not comparable at element level — no competitor documents rater-training records at all, let alone their persistence model."
        gap_severity: "gap"
        gap_note: >
          [PT/PTA] Confirmed shipped and operationally sensible — a CI supervising students from the
          same school for a decade should not re-sit the same quiz every semester. But it is precisely
          the wrong semantics for a RECURRING calibration obligation. CODA 2-6 asks for ongoing
          calibration with periodic monitoring; a once-ever pass with no expiry cannot evidence that.
          Contrast the Faculty Compliance requirement model in step 7, which DOES support mandatory +
          expiration-dated + archived-on-reset, and note the asymmetry: the module that has expiry
          semantics has no training content, and the mechanism that has training content has no expiry
          semantics. Neither knows the other exists.
      - element: "[PT] CI attest-and-bypass path ('has the instructor taken the quiz earlier? Yes/No')"
        type: "self-declared bypass (unverified honour-system toggle)"
        data_shown: "A binary the CI answers on first access to the CIET delegator link. Answering Yes skips the quiz entirely; the source article documents no verification, no cross-check against the CIET training-quiz report, and no record of WHERE or WHEN the claimed prior training occurred."
        gates_on: ["Whether the quiz is presented at all — a Yes bypasses the only calibration gate in the product"]
        accreditation_citation: "CAPTE Standard 4, Element 4P (capte.yaml) — the standard asks 'how CIs are trained in their appropriate use, and how the program determines the tool was completed correctly'. A self-declared bypass answers the first half by assertion and the second half not at all."
        competitor_equivalent: "Not comparable at element level — no competitor documents a rater-training gate, therefore none documents a bypass to one."
        gap_severity: "gap"
        gap_note: >
          [PT/PTA — THE SHARP EDGE ON AN OTHERWISE STRONG MECHANISM] The bypass is defensible product
          design (a CI who trained via APTA elsewhere should not be blocked) and a genuine hole in the
          evidence chain: a CAPTE reviewer asking "how do you know this CI was trained on the
          instrument?" gets, for every bypassing CI, the answer "they said so." The fix is small and
          already patterned elsewhere in the product — the Custom Section Attestation-with-signature
          question type (step 2) would at least convert an untracked toggle into a timestamped,
          signed claim naming the prior training. Worth noting the CIET training-quiz report is
          confirmed live (PT Playbook line 148: "A CIET training-quiz report is now live"), so the
          program can see who PASSED; nothing in the sources confirms whether it also shows who
          BYPASSED, which is the number that actually matters for 4P.
      - element: "[SLP][CRNA] Reviewer attestation on log approval — the nearest calibration analogue outside PT"
        type: "configurable attestation statement the supervisor must acknowledge when reviewing/approving a student log"
        data_shown: "A program-authored statement (e.g. accuracy and integrity of the review) presented to the clinical educator/preceptor at log-approval time. SLP Playbook line 64: 'Attestation — enable an attestation the clinical educator must sign when reviewing logs... this is the CFCC V-E hook.' CRNA transcript line 71: 'enable the Enable Attestation option to require preceptors to acknowledge an attestation when reviewing logs. For example, you can add a statement requiring preceptors to attest to the accuracy and integrity of their review before approving a log.'"
        gates_on: ["Cannot be configured at all if logs are set to auto-approve — both sources state the attestation field is disabled when auto-approval is on"]
        accreditation_citation: "CAA/ASHA Standard 3.0B, Standard 3.8B (caa-asha.yaml) — clinical education must protect the welfare of each person served by the student and clinical-educator team, with a reviewable supervision trail signed by that educator; caa-asha.yaml names CFCC Standard V-E (clinical supervisor accountability) as the operative hook and confirms Exxat's own FAQ makes the same mapping. COA Standard C.4 (coa.yaml) — clinical experience logs 'reviewed by program faculty on a REGULAR BASIS'."
        competitor_equivalent: "eMedley's eCLAS documents 'preceptor time-approval' on mobile case logs (emedley.yaml) and Elentra documents a 'Logbook for patient encounters/procedures WITH SUPERVISOR EVALUATION' (elentra.yaml) — both confirm supervisor sign-off on logs exists elsewhere in the market, but neither publishes whether a configurable attestation statement is attached to that sign-off, so the comparison stops at the sign-off, not the attestation."
        gap_severity: "configure-needed"
        gap_note: >
          [SLP + CRNA] Included in this calibration step deliberately, to mark a boundary the four-domain
          baseline blurred. This attestation makes the supervisor ACCOUNTABLE for the accuracy of their
          review; it does not make them CALIBRATED — nothing here trains the reviewer, tests them, or
          compares their ratings against another reviewer's on the same case. It is the honesty half of
          rater quality, not the agreement half. For SLP specifically the more consequential gap sits
          one level up and is recorded in caa-asha.yaml: "The supervision PERCENTAGE is the gap. Prism
          aggregates hours by clinical educator and by student, but no source confirms a computed
