          creates the matching activity inside GoReact — no manual duplicate setup required." The
          administrator then configures GoReact-specific settings (activity type, recording/feedback
          privacy, recording settings, feedback settings) DIRECTLY IN GOREACT and marks the activity
          DONE; "once saved, the assignment becomes available to students." Line 26 states the
          integration is "a genuinely connected, two-way workflow — administrators are not expected
          to manually recreate assignments in GoReact once they're set up in Prism," with
          assignments, student submissions, and scores/status updates all syncing automatically
          (lines 22-25).
        gates_on:
          - "Student visibility of the assignment depends on the GoReact-side activity being marked Done, not only on the Prism-side Activate and Save — so a TE assignment can be fully configured in the system of record and still be invisible to candidates."
        accreditation_citation: >
          CAEP Standard R5, Component R5.1 (../accreditation/caep.yaml) — the Quality Assurance
          System requirement, which CAEP verifies by DEMONSTRATION of the live system. A setup
          sequence that spans two products means the demonstration spans two products, and only one
          of them is the EPP's system of record.
        competitor_equivalent: >
          Not comparable at element level — no competitor teardown in content/competitors documents
          a setup sequence that begins in the host platform and completes in an integrated vendor's
          console. E*Value's LTI integration is documented as running the other direction (exporting
          grades to an institutional LMS, content/competitors/e-value.yaml), where the host platform
          remains the place configuration happens.
        gap_severity: "configure-needed"
        gap_note: >
          ADDED 2026-08-25 from a full read of the TE playbook. It sharpens, rather than repeats,
          the "review and scoring happen inside GoReact" element below: the split is not only where
          the EVIDENCE lives, it is also where the SETUP completes. Prism's auto-creation of the
          matching GoReact activity is genuinely good — it removes the duplicate-setup step that
          makes most LTI integrations painful — but the sequence still ends with a human switching
          products and marking an activity Done, and that final action is what makes the assignment
          visible to candidates. Two practical consequences worth naming for a TE conversation.
          (1) The most likely TE failure mode is an assignment that looks complete in Prism and was
          never marked Done in GoReact; nothing in the sources describes Prism surfacing that state.
          (2) Every setting that governs what the RECORDING actually captures and who can see it —
          activity type, recording privacy, feedback privacy — is configured outside the system of
          record and documented in GoReact's help centre rather than Exxat's (line 61), so the
          privacy posture of TE's primary evidence artifact is not inspectable from Prism.
      - element: "Learning Tool Interoperability section visibility (discipline/program-gated)"
        type: "toggle"
        data_shown: "'You'll now see the Learning Tool Interoperability section alongside Forms and Evaluations, Timesheets, and Patient Logs. If you do not see this section, it means this feature has not been activated for your discipline and program. Please create a ticket with Exxat support to activate this feature.'"
        gates_on: ["Whether the TE program's primary summative-evidence instrument exists in Prism at all"]
        accreditation_citation: "CAEP Standard R3, Component R3.3 (the video-observation rubric is one of the triangulated sources); CAEP Standard R5, Component R5.1 (Quality Assurance System — the instrument must be part of the EPP's system, not an unmanaged side channel)"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown in content/competitors documents a discipline-gated integration section requiring vendor activation."
        gap_severity: "gap"
        gap_note: >
          The same support-gating pattern that recurs across low-score notifications (all
          disciplines), custom form creation (Nursing, SLP), min/max hour thresholds (SLP), and
          patient-log templates (CRNA, PA) — but with higher stakes for Teacher Education, because
          for TE the LTI activity is not one instrument among many, it is the confirmed centre of the
          discipline's documented workflow. Everything else about TE in the source material is a
          documented gap: the TE playbook records no confirmed TE terminology, no cohort structure,
          no standard evaluation forms, and no pre-built reports.
      - element: "Review and scoring happen inside GoReact, not Prism"
        type: "read-only rollup"
        data_shown: "'Faculty and administrators can then review those submissions directly in GoReact. Depending on how the assignment is configured, reviewers can watch recordings, leave timestamped comments, provide feedback, complete evaluations, and assign scores. And once the review is complete, all that information syncs into Exxat Prism automatically.' Further configuration of video activity types, recording and feedback privacy is documented in the GoReact Help Center, not Exxat's."
        gates_on: ["Where the summative evidence artifact physically lives"]
        accreditation_citation: "CAEP Standard R3, Component R3.3 (Competency at Completion); CAEP Standard R5, Component R5.1 (Quality Assurance System — evidence must be retrievable and quality-assured by the EPP)"
        competitor_equivalent: "Not evaluated at element level — no competitor source describes an external tool holding the rubric and evidence while the host platform holds only the resulting score."
        gap_severity: "configure-needed"
        gap_note: >
          A real architectural distinction from every other summative instrument in this stage: for
          CIET, FWPE, PTMACS, SEFWE and every configured nursing/SLP/SW form, the responses
          themselves live in Prism and are exportable via Raw Data/Aggregate/Comprehensive reports.
          For TE, only the score and status cross back — the timestamped comments and the rubric
          evidence stay in GoReact. That is not a defect (it is what LTI is), but it means TE's
          Prism-side record is thinner than any other discipline's, and it echoes the Formstack
          dependency risk flagged for OT: an external subscription lapse puts the evidence, not just
          the tooling, out of reach.
      - element: "No triangulation join across instruments"
        type: "read-only rollup"
        data_shown: "Nothing joins the GoReact rubric score, the summative student-teaching evaluation, a dispositions instrument, and an external licensure-exam score into one per-candidate proficiency rollup per competency area, with a program-configurable threshold and demographic disaggregation."
        gates_on: []
        accreditation_citation: "CAEP Standard R3, Component R3.3 — CAEP requires 'more than one source' as a hard requirement rather than a preference, across all six named areas (content knowledge, pedagogical knowledge, pedagogical skills, critical dispositions, professional responsibilities, technology integration), disaggregated by preparation program, race/ethnicity and other demographics"
        competitor_equivalent: "e-value.yaml comes closest of anything in this corpus with 'AI-powered risk assessment analytics that flag at-risk learners against board-exam benchmarks' — a genuine multi-source learner rollup, though built on partner exam content and not competency-area-structured or demographically disaggregated in any public description. No competitor teardown names CAEP at all; elentra.yaml's named-standards list covers LCME, COCA, CACMS, ACPE, CODA and ARC-PA but not CAEP."
        gap_severity: "gap"
        gap_note: >
          caep.yaml rates R3.3 'Build' and calls it 'the highest-value TE-specific build in the file,
          and also the element CAEP will not let an EPP fake, because triangulated is stated as a
          hard requirement rather than a preference.' Two dependencies make it worse than it looks:
          the licensure-exam input is blocked on Exam Management (Q2 2027), and the
          disaggregation-by-race/ethnicity requirement runs through every R1-R4 component, so
          demographic disaggregation should be treated as a cross-cutting reporting primitive for the
          whole CAEP configuration rather than re-solved per element. Note also that NO competitor in
          this corpus claims CAEP coverage — this is an open field, not a catch-up.
    action: "Admin creates the LTI assignment in Prism with its grading and due-date settings; Prism auto-creates the matching activity in GoReact on first save; the candidate records or uploads their teaching video from My Coursework; the reviewer scores it inside GoReact; the score and status sync back into Prism's Gradebook."
