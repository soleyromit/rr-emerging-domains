  - screen: "PTMACS / PTAMACS final-term completion — Summative Section and Final Overall Rating (PT/PTA)"
    navigation_path: "Emailed delegator link to the CI (notifications@exxat.com) after the student completes their self-evaluation; admin side at Learning Activities > [Course] > Forms/Evaluations > PTMACS / PTAMACS"
    elements:
      - element: "'Evaluation of Student Performance' 1-10 rating"
        type: "input field"
        data_shown: "A whole-student rating on a distinct 1-to-10 scale, separate from the per-skill Likert ratings that make up the body of the instrument; the CI enters it toward the end of the form alongside free-text overall comments"
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2D4 (Students Demonstrate Entry-Level Clinical Performance) — capte.yaml names PTMACS/PTAMACS' distinct 1-10 CI scale among the validated instruments serving this element"
        competitor_equivalent: "Not evaluated at element level — no competitor source names an equivalent dual-scale instrument (per-skill Likert plus a separate whole-student 1-10 judgment)."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped, and worth distinguishing from the per-skill ratings because it is the
          single number a program would most plausibly map into Competency Management or read as
          the entry-level verdict. The instrument is free, standard, and available ONLY in Exxat
          (used by Texas Consortium programs and many PTA programs), so unlike the AOTA FWPE it is
