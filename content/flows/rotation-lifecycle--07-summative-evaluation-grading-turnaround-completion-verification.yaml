    action: "The student completes and e-signs the SEFWE at the end of the Level II experience and selects the educator; SEFWE I routes to that educator for review and signature before school review, SEFWE II goes straight to school review; the admin then Reviews, Un-submits to either party, or Reviews and Publishes it into Location Evaluations."
