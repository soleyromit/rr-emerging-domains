    action: "The student completes the PTMACS/PTAMACS self-evaluation first, which triggers the CI's emailed link; the CI rates each skill alongside the student's own rating and comment, adds overall comments and the 1-10 Evaluation of Student Performance, and — on the final pass only — completes the Summative Section and Final Overall Rating before submitting."
