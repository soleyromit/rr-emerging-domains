  - screen: "Standard AOTA FWPE — activation, distribution and school review (OT/OTA)"
    navigation_path: "Learning Activities > [Course] > Setup > Forms/Evaluations grid > [+ icon] > Standard AOTA FWPE - [Fieldwork Educator for OT | Fieldwork Educator for OTA | Student Self-Assessment for OT | Student Self-Assessment for OTA]; review at Learning Activities > [Course] > Forms/Evaluations > 'Pending School Review'"
    elements:
      - element: "Standard AOTA FWPE form-family picker (four activatable forms, plus a Supplement form)"
        type: "input field"
        data_shown: >
          The FWPE ships in Prism BY DEFAULT as a Standard (pre-built, non-editable) form type; the
          program admin activates the right one per course. Four appear in the picker — Fieldwork
          Educator for OT, Fieldwork Educator for OTA, Student Self-Assessment for OT, Student
          Self-Assessment for OTA — and a fifth, a Supplement form for both roles, exists for the
          case where a fieldwork educator leaves mid-rotation and a new educator takes over. The
          instrument is scored in graded sections with per-section subtotals (I. Fundamentals of
          Practice, II. Basic Tenets, III. Evaluation & Screening, each with an 'obtained score'),
          on a 4-point scale requiring a justification comment per rating.
        gates_on: ["Whether an OT or OTA cohort has a summative Level II instrument at all"]
        accreditation_citation: "ACOTE Standard C.1.15 (Evaluation of Student Performance on Level II Fieldwork) — acote.yaml rates this element 'Transfer' and calls the FWPE family 'the single deepest OT-specific capability in the product'"
        competitor_equivalent: "core-elms.yaml: CORE ELMS ships 'preceptor assessments of students, and student evaluations of preceptors/sites — all with customizable forms' for a discipline list that explicitly includes OT, and is rated 'ahead' on this pillar for shipping surveys/evaluations today. But CUSTOMIZABLE is the operative difference: no public CORE source claims the AOTA FWPE as a pre-built, non-editable standard instrument. Prism's advantage here is the validated national instrument itself, not the form engine."
        gap_severity: "none"
        gap_note: >
          The strongest instrument-inventory position of any of the eight existing disciplines
          alongside PT's, and the evaluator-handoff Supplement form is a real workflow case no
          competitor source addresses. One legacy risk carries into this element: some schools
          still run FWPE II through a Formstack integration Exxat is phasing out, where a lapsed
          Formstack subscription renders previously-pulled data inaccessible inside Prism because
          no Exxat-side copy is retained.
      - element: "Grading options plus separate mid and final due dates — only the Final FWPE scores"
        type: "input field"
        data_shown: "On the same activation screen: an Active slider, 'Choose the grading options,' and two distinct fields, 'Due date for the mid form is' and 'Due date for the Final form is.' Exxat's own guidance states that only the Final FWPE is used for scoring."
        gates_on: ["Which of the two instances contributes to the student's score", "When each instance is marked overdue"]
        accreditation_citation: "ACOTE Standard C.1.15 (the timely-submission half); ACOTE Standard A.5.5 (Written Syllabi and Assessment Strategies — assessment strategies aligned with graduation progress)"
        competitor_equivalent: "core-elms.yaml: CORE's module ships 'automated grade calculation/conversion... and due-date reminders' as standard features. Prism's due-date pair is anchor-relative and per-instance, which CORE's public material does not describe at that granularity; CORE's grade CALCULATION is the half Prism does not have (see the Grading Scheme step)."
        gap_severity: "configure-needed"
        gap_note: >
          The 'only the Final scores' rule is the hinge for the whole OT stage-7 flow and it has a
          documented side effect covered on the Auto Notifications step: because the Low Score
          Threshold setting applies to BOTH midterm and final but only the final counts, Exxat's
          own best practice is to leave the threshold off until every midterm has been submitted
          and reviewed. So the grading configuration and the escalation configuration are coupled,
          and the safe order of operations is not obvious from either screen.
      - element: "Send Form > Set up Automation (Beginning / Mid / End of placement, recipient, template)"
        type: "button"
        data_shown: >
          Admins schedule distribution anchor-relative to the placement (Beginning, Mid, or End),
          add a distribution schedule, choose 'who should get the form email?' from a dropdown, and
          pick an email template. Exxat explicitly recommends distributing the Fieldwork Educator
          form only to the 'Fieldwork Educator Added by School' — secondary educators can be named
          inside the form for reference but should not receive it, to prevent duplicate FWPEs for
          one student/placement. Note: the Publish Date does NOT apply to Fieldwork Educator forms,
          which are pushed directly by admins rather than opened on a publish schedule.
        gates_on: ["Whether the correct single evaluator receives the grade-bearing instrument", "When the summative instrument reaches the evaluator relative to rotation end"]
        accreditation_citation: "ACOTE Standard C.1.15 — the element's software requirement is to 'distribute the correct standardized instrument to the correct evaluator per placement without requiring that evaluator to hold a platform account' and to 'schedule distribution relative to the placement timeline rather than to fixed calendar dates'; this is that field set; ACOTE Standard C.1.13 (Qualified Level II Fieldwork Educators — the recipient must be the vetted educator)"
        competitor_equivalent: "leo-davinci.yaml: Leo ships 'on-demand evaluation links [that] can be emailed to clinical faculty with no login required' plus 'completion/reminder tracking reports' — the same no-login distribution primitive with completion tracking. Leo's public FAQ does not document placement-anchored scheduling or a single-recipient de-duplication rule, so those two mechanics are not comparable field-for-field."
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed shipped, and the duplicate-FWPE risk it guards against is real enough that
          Exxat publishes a tip about it — but the guard is advisory, a recommended dropdown
          selection, not an enforced one-evaluator-per-placement rule. The Publish-Date exception
          for educator forms is a genuine asymmetry worth remembering when reasoning about
          turnaround: for the educator instance there is no publish date to measure from, only the
          distribution event. OT best practice is to schedule the evaluation email one week before
          rotation end.
      - element: "Pending School Review > Select an Option > Review | Un-submit"
        type: "toggle"
        data_shown: "On a submitted FWPE the reviewer opens the 'Pending School Review' status and picks from a Select an Option dropdown: Review (finalize the review) or Un-submit (send it back to the student OR to the fieldwork educator to redo the evaluation)"
        gates_on: ["Whether the summative record is final or returns to the evaluator"]
        accreditation_citation: "ACOTE Standard C.1.15 (the program's formal receipt and acceptance of the evaluation); CCNE Standard III, Key Element III-K analogue — not cited for OT, but the same faculty-last structure"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a two-direction un-submit (back to learner vs. back to external evaluator) on a submitted summative form."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped. The un-submit direction matters more than it looks: sending a form
          back to a no-login fieldwork educator depends on their delegator link still being live
          (see the Auto Notifications step), so a program running the OT-recommended 30-50 day
          link expiry can be unable to un-submit a late-reviewed form to its author. That coupling
          between review actions and link lifetime is not surfaced on either screen.
    action: "Admin activates the correct Standard AOTA FWPE per course, sets grading options and separate mid/final due dates, automates anchor-relative distribution to the single school-added Fieldwork Educator, then works the Pending School Review queue with Review or Un-submit."
    confirmed_by: "Help for Program Administrators/Discipline Specific Guides/OT-OTA Discipline/Help Guides for OT-OTA/Fieldwork Performance Evaluation Tool.md; Help for Faculty/Discipline Specific Guides/OT -OTA/Completing FWPE Form - For Fieldwork Educators.md; Playbooks/Occupational Therapy (OT) Playbook.md, sections 'Standard OT Clinical Placement Forms — Level II Fieldwork', 'C.1.15: Evaluation of Student Performance on Level II Fieldwork', 'FWPE — Notification Thresholds and Distribution Mechanics', 'Fieldwork Educator Access — No-Login, Magic-Link Completion', and 'Formstack Integration — Legacy FWPE II Distribution Path'; content/accreditation/acote.yaml, element 'Standard C.1.15'"

  - screen: "SEFWE I / SEFWE II — Review and Publish to Location Evaluations (OT/OTA)"
    navigation_path: "Student: Profile > View Learning Activities > Forms/Evaluations tab > Get Started > complete > e-sign > select Educator > Submit. Admin: Learning Activities > [Course] > Forms/Evaluations > 'Pending Educator Review' / 'Pending School Review'; published output at the admin-side Location Evaluations page"
    elements:
