# Element-level ground truth underneath rotation-lifecycle.yaml, stage 7. See
# content/flows/_TEMPLATE.yaml for the contract this file follows: every
# accreditation_citation and competitor_equivalent claim below traces to a
# real source file in confirmed_by, never back to the journey's own prose.
#
# SCHEMA v2 (2026-08-24): analysis fields live on each element, not on the step.
# Where the underlying research did not distinguish between sibling elements,
# the same verdict is stated identically on each rather than inventing precision.
#
# 2026-08-25 EXTENSION: this file was originally written covering only the four
# expansion domains (DO, Pharmacy, Dentistry, Medicine) and cited only lcme.yaml,
# acpe.yaml and coca.yaml. It now also covers the EIGHT disciplines Exxat/Prism
# already serves in production — PT/PTA, OT/OTA, PA, SLP, Nursing, Social Work,
# Teacher Education, and CRNA (nurse anesthesia) — against their own accreditors
# (capte, acote, arc-pa, caa-asha, nursing [CCNE/ACEN], coa, cswe, caep). Existing
# elements are unchanged; discipline-specific behavior is added either as new
# elements on an existing step or as a new step where the named final instrument
# is structurally distinct rather than a variant of the baseline.
flow_name: "Summative Evaluation, Grading Turnaround & Completion Verification"
maps_to_journey: "rotation-lifecycle.yaml, stage 7"
persona: "Clinical / Experiential Education Coordinator (content/personas/role-clinical-coordinator.yaml); Course Faculty for grade entry; Student for the site/CI evaluation and (where extended) survey steps; and — for the eight existing disciplines — the external evaluator who completes the summative instrument with no Prism login (PT Clinical Instructor, OT Fieldwork Educator, PA preceptor, SLP Clinical Educator, Nursing/CRNA preceptor, SW Field Instructor or Task Supervisor)"
steps:
  - screen: "Grading Scheme (Setup > Grading Scheme, school/program level)"
    navigation_path: "Program Details > Setup > Grading Scheme"
    elements:
      - element: "Add New (Letter Grade / Pass-Fail) button"
        type: "input field"
        data_shown: "Letter Grade band table (e.g. A=90-100, B=80-<90...) or a single Pass/Fail percentage threshold"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 (indirectly — this is the element where the scale that final grades are recorded against is actually defined)"
        competitor_equivalent: "Not evaluated — no competitor teardown in content/competitors documents grading-scale configuration at this element level, only broader assessment/evaluation feature claims."
        gap_severity: "none"
        gap_note: "Confirmed shipped and matches the journey's existing 'Configure' framing; the band table is record-keeping only, Prism does not calculate the grade from it."
      - element: "Per-course grading-scale choice"
        type: "toggle"
        data_shown: "Letter-grade vs. pass/fail — the only per-course choice; the band values themselves are fixed at school/program level and cannot be edited per course"
        gates_on: ["Gradebook display format for that course offering"]
        accreditation_citation: "LCME Standard 9, Element 9.8 (indirectly — this is where a given course offering is bound to one of the school-level scales)"
        competitor_equivalent: "Not evaluated — no competitor teardown in content/competitors documents grading-scale configuration at this element level, only broader assessment/evaluation feature claims."
        gap_severity: "none"
        gap_note: "Confirmed shipped. Narrower than the Add New element by design: a course offering may pick letter-grade vs. pass/fail but cannot override the band values, which stay fixed at school/program level."
      - element: "Grading-scheme reuse by non-Forms learning activities (Patient/CCE Log, LTI assignment)"
        type: "input field"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. The same school-level schemes are selectable from
          inside two other activity types, not just Forms/Evaluations. Patient/CCE Log setup:
          'choose whether the patient log contributes to the final course grade. If you select
          Yes, define the maximum score and specify the weightage percentage, then select the
          grading type, such as letter grade, pass/fail, or not applicable. If using a letter
          grade, choose the appropriate grading scheme configured in the system'
          (CRNAVideosTranscripts.md line 65) — used by CRNA/Nursing CCE logs and, in the same
          shape, by PA patient logs. Learning Tool Interoperability assignment setup carries
          its own 'grading and score settings' for TE video assignments.
        gates_on: ["Which grading scheme a CRNA/Nursing CCE log, a PA patient log, or a TE GoReact assignment is scored against"]
        accreditation_citation: "COA Standard H.1.1 and H.1.1.1 (Evaluation Standards) — indirectly, this is the scale a CRNA program's grade-bearing CCE log is recorded against alongside the terminal evaluation; CAEP Standard R3, Component R3.2 (indirectly — the scale a TE transition-point GPA would have to be derived from)"
        competitor_equivalent: "elentra.yaml: Elentra's Assessment & Evaluation module offers 'gradebook integration for flexible grade scales' spanning 'formative assessments to summative exams,' across a discipline list that includes Nursing and PT — the same primitive of one configurable scale shared across heterogeneous activity types, though Elentra's feature page does not enumerate which activity types can bind to a scale, so this is a shape comparison rather than a field-for-field one."
        gap_severity: "configure-needed"
        gap_note: >
          Materially widens the journey's model of what stops the grading clock. For the four
          expansion domains the flow assumed the grade-bearing event is a Forms/Evaluations
          submission; for CRNA, Nursing and PA a weighted patient/CCE log is a second,
          independent score-contributing path, and for Teacher Education a third path runs
          through an external LTI tool. Each must be configured separately — nothing infers
          the binding.
      - element: "No grade computation from the scheme — the cohort-GPA transition point"
        type: "read-only rollup"
        data_shown: "The band table stores what a score means. It does not derive a course grade from component scores, a course GPA, or a cohort GPA."
        gates_on: []
        accreditation_citation: "CAEP Standard R3, Component R3.2 — the element requires the EPP to 'identify a transition point at which a cohort GPA of 3.0 is achieved, monitored over time'; this is the field that would have to produce it"
        competitor_equivalent: "core-elms.yaml: the CORE ELMS evaluation/survey module ships 'automated grade calculation/conversion' today, across a discipline list that explicitly includes PT, OT, PA, nursing and social work — a direct like-for-like at this element's granularity, and rated 'ahead' of Prism in that teardown. medhub.yaml/e-value.yaml add exam-side grade-scale configuration with 'summaries of learner performance.' This is a real, element-level competitive delta, not a framing difference."
        gap_severity: "gap"
        gap_note: >
          EXISTING-DISCIPLINE EXTENSION, and the sharpest instance of the record-keeping-only
          limitation already noted on the Add New element above. caep.yaml states it without
          hedging: 'the cohort 3.0 GPA transition point cannot be computed in Prism at all: the
          confirmed Grading Scheme module is explicitly record-keeping only and does not
          calculate student grades.' For Teacher Education this is not cosmetic — R3.2 names
          the cohort GPA as a required, monitored transition point, so the one number CAEP asks
          for by name has to come from the SIS, not Prism.
    action: "Admin defines one or more reusable grading schemes once at the school/program level; each course offering then just picks which scheme applies. For CRNA/Nursing and PA, the same scheme is separately bound inside Patient/CCE Log setup; for Teacher Education, inside the LTI assignment's score settings."
    confirmed_by: "Help for Program Administrators/Getting Started for Admin (includes User Guides)/Managing Program Details via Setup.md; capability-map.yaml, 'Grading Scheme module' (Curriculum Mapping pillar); /Users/romitsoley/Downloads/CRNAVideosTranscripts.md lines 63-73 (CCE log Grading section); Playbooks/Physician Assistant (PA) Playbook.md, section 'Timesheet & Patient Logging'; Playbooks/Teacher Education (TE) Playbook.md, section 'GoReact (Echo360) Video Assignment Integration'; content/accreditation/caep.yaml, element 'Standard R3, Component R3.2'"

  - screen: "Gradebook (Learning Activities > Setup > Gradebook)"
    navigation_path: "Learning Activities > [Course] > Setup > Gradebook (also reachable from Courses > Course Offering > Gradebook for faculty)"
    elements:
      - element: "Student x Activity score grid"
        type: "read-only rollup"
        data_shown: "Final score per student across every graded activity in the course"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 (this grid is where the final grade being measured against the six-week window is held)"
        competitor_equivalent: "Not evaluated at element level — one45.yaml and emedley.yaml describe assessment/evaluation feature sets at the marketing-page level (e.g. one45 'Assessment and Evaluation' 360 reviews), not a gradebook screen granular enough to compare cell-for-cell."
        gap_severity: "none"
        gap_note: "Shipped as described. Displays the rolled-up final score only; it carries no due-date or deadline field of its own — the deadline lives one layer up, on whichever score-contributing form's Due Date is configured (see next step)."
      - element: "Pencil-icon inline edit / bulk-update action"
        type: "input field"
        data_shown: "Individual or multi-select score entry"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 (the entry point at which a grade is actually recorded, i.e. where the six-week clock is stopped)"
        competitor_equivalent: "Not evaluated at element level — one45.yaml and emedley.yaml describe assessment/evaluation feature sets at the marketing-page level, not a gradebook screen granular enough to compare cell-for-cell."
        gap_severity: "none"
        gap_note: "Score entry, individually and in bulk, is confirmed shipped. No deadline enforcement or overdue flag is confirmed on this control itself."
      - element: "Publish button (Draft vs. Published state)"
        type: "toggle"
        data_shown: "Whether the gradebook is visible to students yet"
        gates_on: ["Student-facing Gradebook tab visibility (student cannot see any score pre-publish)"]
        accreditation_citation: "LCME Standard 9, Element 9.8 (final grades *available* within six weeks — availability to the student is gated precisely here)"
        competitor_equivalent: "Not evaluated at element level — one45.yaml and emedley.yaml describe assessment/evaluation feature sets at the marketing-page level, not a gradebook screen granular enough to compare cell-for-cell."
        gap_severity: "none"
        gap_note: "Publish gating is shipped as described and is the element that determines the moment a grade becomes student-available, which is the event 9.8 measures."
      - element: "Score-entry authority (admin / course faculty only; no preceptor path)"
        type: "read-only rollup"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. Gradebook score entry is reachable by program admins
          and by course faculty (Courses > Course Offering > Gradebook, per the faculty-facing
          help guide). No confirmed path exists for a site-side evaluator — Clinical
          Instructor, Fieldwork Educator, preceptor, Clinical Educator, Field Instructor — to
          reach the Gradebook at all. Their contribution arrives strictly as a submitted
          Forms/Evaluations or Patient-Log record that a faculty reviewer then acts on.
        gates_on: ["Whether a preceptor's rating can become the grade of record without a faculty step"]
        accreditation_citation: "CCNE Standard III, Key Element III-K (and ACEN Standard 4, Criterion 4.10) — CCNE is explicit that 'faculty may seek input from preceptors regarding student performance, but ultimately faculty are responsible for evaluation of individual student outcomes'; this separation of surfaces is the element where that is enforced structurally rather than by policy"
        competitor_equivalent: "leo-davinci.yaml: Leo ships 'on-demand evaluation links [that] can be emailed to clinical faculty with no login required; results can be reviewed, modified, summarized, and exported to gradebooks' — the same architecture of keeping the external clinical evaluator outside the gradebook and exporting their results into it. Leo's public FAQ does not publish a role-permission matrix, so the comparison holds at the level of where the external evaluator lands, not cell-for-cell on who may edit a score."
        gap_severity: "none"
        gap_note: >
          One of the strongest fits in this stage for the existing disciplines and worth stating
          plainly: nursing.yaml rates III-K 'Configure', but the reason is instrument
          availability, not this element. The faculty-last architecture that CCNE III-K and ACEN
          4.10 actually turn on is already true of the product by construction. The same
          structure serves CSWE AS 5.0.1(a) ('student competence must be assessed by program
          faculty or field personnel') and CAPTE 2D4.
      - element: "LTI (GoReact / Echo360) score and status write-back"
        type: "read-only rollup"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION (Teacher Education). Scores and status values assigned
          by a reviewer inside GoReact — including 'Pending Review' and 'Reviewed' — sync back
          into Prism automatically, with no reconciliation step. The reviewer watches the
          recording, leaves timestamped comments, completes the evaluation and assigns the score
          in GoReact; Prism receives the result.
        gates_on: ["The LTI assignment's Gradebook contribution, per its own grading and score settings"]
        accreditation_citation: "CAEP Standard R3, Component R3.3 — CAEP names 'student-teaching evaluation instruments' and video-observation rubrics among the 'more than one source' of triangulated completion evidence; this is the element that lands one of those sources in the Gradebook"
        competitor_equivalent: "e-value.yaml: E*Value's Curriculum and Assessment Technology module uses 'LTI integration with institutional LMS for automatic grade syncing' — genuinely the same primitive at the same granularity (LTI grade write-back), but travelling the opposite direction: E*Value pushes BoardVitals exam scores OUT to the institution's LMS gradebook, whereas Prism pulls a GoReact video-rubric score IN to its own Gradebook."
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed shipped and genuinely two-way, but gated twice. (1) The Learning Tool
          Interoperability section is discipline/program-gated — if it is not visible alongside
          Forms and Evaluations, Timesheets and Patient Logs under Learning Activities > Setup,
          it has not been activated, and activation requires an Exxat support ticket. (2) Per
          caep.yaml, R3.3 is rated 'Build': the rubric score lands in the Gradebook, but nothing
          joins it to the summative student-teaching evaluation, the dispositions instrument and
          the external licensure exam into one per-candidate proficiency rollup, which is what
          'triangulated' means as a hard requirement in R3.3.
    action: "Admin or course faculty enters/bulk-updates final scores, then explicitly clicks Publish to release them to students. For Teacher Education, one of those scores arrives pre-populated from GoReact rather than being keyed in."
    confirmed_by: "Help for Program Administrators/Step-by-Step Guides (How-tos)/Learning Activities/Tracking Student Grades Via Gradebook.md; Help for Faculty/Step-by-Step Guides (How-tos)/Courses/Gradebook View of Courses for Faculty.md; Help for Students/Step-by-Step Guides (How-tos)/Learning Activities/Viewing Gradebook.md; Playbooks/Teacher Education (TE) Playbook.md, section 'GoReact (Echo360) Video Assignment Integration'; /Users/romitsoley/Downloads/CRNAVideosTranscripts.md lines 99-117; content/accreditation/nursing.yaml, element 'CCNE Standard III, Key Element III-K (and ACEN Standard 4, Criterion 4.10)'; content/accreditation/caep.yaml, element 'Standard R3, Component R3.3'"

  - screen: "Forms/Evaluations Setup — score-contributing form config (Learning Activities > Setup > Forms/Evaluations)"
    navigation_path: "Learning Activities > [Course] > Setup > Forms/Evaluations > [+ icon] > [form name]"
    elements:
      - element: "'Does the form contribute to the student's final score?' toggle"
        type: "toggle"
        data_shown: "Whether this form's score rolls into the Gradebook final score"
        gates_on: ["Gradebook final-score calculation for that course"]
        accreditation_citation: "LCME Standard 9, Element 9.8 (indirectly — this toggle determines which form's completion is the grade-bearing event the deadline applies to)"
        competitor_equivalent: "Not evaluated — no competitor source in content/competitors documents a score-contribution toggle at this granularity."
        gap_severity: "configure-needed"
        gap_note: "Confirmed shipped. Must be set per form; nothing infers grade-bearing status automatically, so the link between a form and the Gradebook is a configuration step."
      - element: "Publish date / Due date fields"
        type: "input field"
        data_shown: "Both are anchor-relative — not a calendar date, but N days before/after a placement's Beginning, Middle, or End"
        gates_on: ["When the form becomes visible / when it is marked overdue"]
        accreditation_citation: "LCME Standard 9, Element 9.8 (grade-due deadline anchored to clerkship end date — this field pair is where that anchoring is expressed)"
        competitor_equivalent: "Not evaluated — no competitor source in content/competitors documents an anchor-relative due-date builder at this granularity."
        gap_severity: "configure-needed"
        gap_note: "The anchor-relative due-date primitive is confirmed shipped and is exactly what lcme.yaml's 'Configure' rating for 9.8 already assumed; this element names the exact fields that make it concrete rather than changing the rating. Someone must still set e.g. 42 days after the placement End anchor per form."
      - element: "Midterm-and-Final vs. Final-only workflow selector (Multi-Term archetype)"
        type: "toggle"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. Chosen at activation, and it decides whether a formative
          instance of the same instrument is ever generated. PT: 'CIET v2.0 Midterm and Final'
          vs. 'CIET v2.0 - Final' (the latter allows one evaluation only, at the end of the
          placement). OT: one FWPE record carries two separate fields, 'Due date for the mid form
          is' and 'Due date for the Final form is.' PTMACS/PTAMACS, CIET and the AOTA FWPE all
          carry midterm responses and scores forward so they stay visible while the final is
          being completed. SLP configures Clinical Supervisor Evaluations as a Midterm and a
          Final pair; SW can split a Learning Contract into mid-term and final instances.
        gates_on: ["Whether a midterm instance of the instrument exists at all", "Whether the evaluator sees their own midterm ratings while completing the final"]
        accreditation_citation: "CAPTE Standard 2, Element 2D4; ACOTE Standard C.1.15; CAA Standard 5.0, Standard 5.2 (a written plan 'using a VARIETY of techniques including both formative and summative methods'); CCNE Standard III, Key Element III-K with ACEN Standard 4, Criterion 4.10 (formative AND summative methods throughout the curriculum); COA Standard H.1.1 (formative and summative evaluations of each student)"
        competitor_equivalent: "e-value.yaml: E*Value ships 'mid-point-to-end-of-rotation summary evaluations' today, for a discipline set that includes PA, nursing, dentistry and pharmacy — the same shape (a mid-point instance rolling into an end-of-rotation summary) confirmed as a production feature, though E*Value's public product page does not expose a per-form workflow-type selector, so the selector itself cannot be compared field-for-field."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and, for the five existing disciplines that use it, this is the
          element the formative/summative half of the standard actually rests on. Worth carrying
          one PA-specific risk that lives here: Exxat's own PA guidance states that mid-point and
          end-of-rotation evaluations of the same student by the same preceptor should be
          EXACTLY consistent in substance, because PA programs have received ARC-PA citations
          where a student's formative feedback contradicts their summative assessment. Prism's
          carry-forward of midterm responses into the final form structurally supports that for
          CIET, PTMACS/PTAMACS and the AOTA FWPE — but no equivalent carry-forward is confirmed
          for a PA-configured custom form, which is where the citation risk actually sits.
      - element: "Patient Log / CCE Log 'Grading' section (max score + weightage)"
        type: "input field"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. A second, parallel score-contributing path that does not
          run through the toggle at the top of this screen. CRNA/Nursing: 'In the Grading section,
          choose whether the patient log contributes to the final course grade. If you select Yes,
          define the maximum score and specify the weightage percentage, then select the grading
          type' (CRNAVideosTranscripts.md line 65). PA: 'Grading' must be activated along with a
          'Weightage' percentage to include the log in the Gradebook. SLP clinical logs carry the
          same optional Grading block (contribution, points value, weightage).
        gates_on: ["Gradebook final-score calculation for that course, independent of any Forms/Evaluations record"]
        accreditation_citation: "COA Standard E.2.3 + Appendix (Curriculum Standards) — indirectly, this is where a CRNA program's per-student case-count completion becomes a grade-bearing event; ARC-PA Standard B3, Element B3.04 a-d (the same, for PA patient logs); CAA Standard 3.0B, Standard 3.1B (the 400 supervised clinical practice hours, for SLP clinical logs)"
        competitor_equivalent: "Not evaluated at element level — core-elms.yaml documents 'case logging and reflections' and, separately, 'automated grade calculation/conversion' on evaluation forms, but no public CORE source ties log completion to a weighted gradebook contribution, so the two halves cannot be joined into a comparison at this granularity."
        gap_severity: "configure-needed"
        gap_note: >
          This element is why the journey's four-domain model of stage 7 is incomplete for the
          existing disciplines: for CRNA, Nursing, PA and SLP the grading clock can be stopped by
          a LOG reaching approval, not only by an evaluation form being submitted. Two frictions.
          The grading block is mutually exclusive with nothing, but the attestation block on the
          same screen IS mutually exclusive with auto-approval — 'if you mark logs for auto
          approval, you will not be able to configure an attestation message' — so a program that
          wants fast approval gives up the preceptor attestation that CFCC V-E (SLP) and COA
          rely on. And per capability-map.yaml new patient-log templates and edits to existing
          ones are support-gated (CSS agent, Account Manager, or prism-support ticket), so a COA
          or ARC-PA edition change is not a self-service admin task.
      - element: "Review-tier ordering (which role reviews last)"
        type: "toggle"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. The configurable multi-step review workflow decides who
          holds the final signature. Confirmed orderings, per discipline: PT PTSE 1 — Student
          Completes > Site Reviews > School Admin Reviews; PT PTSE 2 — Student Completes > School
          Admin Reviews; PT CIET v2.0 — Student and CI complete in parallel > School Admin
          Reviews; PTMACS — Student self-eval > CI evaluates student > Student reviews > School
          reviews; PTAMACS SECEE — Student (Final only) > CI reviews/completes (Final only) >
          School reviews (Final only); OT AOTA FWPE — Educator > School Review; OT FWPE Student
          Self-Assessment — Student > School Review; OT SEFWE I — Student > Educator > School
          Review; OT SEFWE II — Student > School Review; OT Level I Competency Evaluation —
          Educator > Student Review; OT capstone MOU / Supervision Record — Student > Site Mentor
          Review > Faculty Review > Admin Review; SW Learning Contract/Evaluation — configurable
          across Field Instructor rating and student rating completed independently.
        gates_on: ["Which role's submission is treated as the program's determination rather than as input"]
        accreditation_citation: "CCNE Standard III, Key Element III-K (and ACEN Standard 4, Criterion 4.10) — the element turns on faculty being structurally last; CSWE Accreditation Standard 5.0, AS 5.0.1(a) ('Student competence must be assessed by program faculty or field personnel'); ACOTE Standard C.1.15 (formal evaluation 'conducted by qualified educators' and returned to the academic program)"
        competitor_equivalent: "one45.yaml: one45's public Assessment and Evaluation page names '360 reviews, two-tier workflows, customizable forms/scales' — the same primitive, but two tiers where Prism's confirmed PTMACS and OT capstone chains run four, and one45's page does not name the roles, so the depth difference is real but the role mapping is not comparable."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped across every one of the eight existing disciplines and, at four tiers,
          deeper than any competitor claim documented in content/competitors. The genuine
          discipline delta is not the engine but the inventory riding on it: PT ships four free
          validated instruments (CIET v2.0, PTMACS/PTAMACS, SCIPAI, plus the APTA PTSE pair) and
          OT ships the AOTA FWPE family as non-editable Standard forms, whereas Nursing and SLP
          have NO shipped standard national instrument — every nursing and SLP form is configured,
          and new-form creation is not self-service (prism-support@exxat.com ticket). That is a
          services attach on the same engine, and it is the reason caa-asha.yaml rates CAA 5.2
          'Configure-with-services-attach' for SLP where it would be closer to Transfer for PT/OT.
    action: "Admin sets the grade-bearing evaluation's Due Date as, e.g., 42 days (six weeks) after the placement End anchor, so the 'grade due' deadline tracks the rotation's actual end date rather than a fixed calendar date; picks whether a midterm instance exists; and, for the log-centric disciplines, separately decides whether the Patient/CCE Log is itself grade-bearing."
    confirmed_by: "Help for Program Administrators/Step-by-Step Guides (How-tos)/Courses/Managing Course Activities - Activating Forms and Evaluations.md; Help for Program Administrators/Discipline Specific Guides/PT-PTA Discipline/Help Guides/Clinical Internship Evaluation Tool - Version 2.0.md (lines 45-54, 99-100, 109, 179-197); Help for Program Administrators/Discipline Specific Guides/OT-OTA Discipline/Help Guides for OT-OTA/Fieldwork Performance Evaluation Tool.md (lines 117-124); Playbooks/Physical Therapy (PT) Playbook.md lines 127-129 (the standard/other/assessment form inventory) and 145-151, 234-244 (CIET v2.0 workflow selection); Playbooks/Occupational Therapy (OT) Playbook.md, sections 'Standard OT Clinical Placement Forms' and 'Capstone Evaluations & Documentation'; Playbooks/Physician Assistant (PA) Playbook.md, sections 'Timesheet & Patient Logging' and 'Competency Framework & Competency Tracking Report'; Playbooks/Speech-Language Pathology (SLP) Playbook.md, sections 'Clinical Log Setup (Admin)' and 'Assessments & Evaluation Tools'; Playbooks/Nursing Playbook.md, section 'Evaluations & Forms'; Playbooks/Social Work (SW) Playbook.md, section 'Learning Contract / Evaluation Setup Options'; /Users/romitsoley/Downloads/CRNAVideosTranscripts.md lines 63-73"

  - screen: "Auto Notifications (Learning Activities > Auto Notifications)"
    navigation_path: "Learning Activities > Auto Notifications > Add Notification"
    elements:
      - element: "Recipient Type selector"
        type: "input field"
        data_shown: "Students or Experiential Supervisor — these are the only two recipient types"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 ('automatic alerts to faculty/coordinators as the six-week SLA approaches')"
        competitor_equivalent: "Not evaluated at element level."
        gap_severity: "gap"
        gap_note: >
          This is the element that carries the journey's remaining SLA hedge. The only two recipient types are
          Students and Experiential Supervisor. There is no confirmed recipient type of 'Course Faculty' or
          'Coordinator/Admin,' so a reminder aimed at the grading faculty member themselves (as lcme.yaml's exact
          language specifies) is not confirmed to exist as a distinct path — only reminders to whoever is
          completing the graded form.
      - element: "Start Condition (anchor + day-offset builder)"
        type: "input field"
        data_shown: "e.g. 'Send reminders 3 days before Due Date', anchored to Beginning/Middle/End of Placement"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 (the 'as the six-week SLA approaches' timing half of the requirement)"
        competitor_equivalent: "Not evaluated at element level."
        gap_severity: "configure-needed"
        gap_note: "This half of the requirement is resolved: automatic, configurable deadline-approach reminders (including recurring 'Send Every X days') ARE confirmed shipped, anchored to the same Beginning/Middle/End placement anchors as the Due Date itself. An admin must build the notification per form."
      - element: "Auto-exclusion logic"
        type: "read-only rollup"
        data_shown: "System automatically excludes submitted/reviewed forms and placements marked On Hold or Unsuccessful from reminders"
        gates_on: []
        accreditation_citation: "Not the element where evidence for a standard lives — supporting behavior only."
        competitor_equivalent: "Not evaluated at element level."
        gap_severity: "none"
        gap_note: "Confirmed shipped and automatic; requires no configuration and has no known limitation in the sourced material."
      - element: "Low Score Notification / Response-Based Notification (configured on the form, not here)"
        type: "toggle"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. A distinct alerting mechanism from Auto Notifications,
          configured against the form rather than on this screen, and the only confirmed path by
          which a summative result escalates to a human rather than waiting to be read. Two
          mechanisms. Form-level Low Score Notification red-highlights the submission on the
          review screen and emails named recipients when the total score falls below a configured
          threshold — published calibrations exist only for the AOTA FWPE: OT students 111 or
          below, OTA students 91 or below. Question-level Response-Based Notification fires on a
          specific answer — the FWPE default is any rating of 1 on any question, plus a rating of
          1 or 2 on the three named Fundamentals of Practice items (adherence to AOTA's Code of
          Ethics and federal/state/facility regulations; compliance with safety regulations
          including accurate incident reporting; ensuring safety for self and others by
          anticipating and preventing hazards). PT PTSE 1/PTSE 2 carry the same numeric-threshold
          plus red-display pattern. PA configures it per evaluation question tied to a program
          learning outcome. SLP has the same question-based email notifications, also
          support-configured.
        gates_on: ["Whether a below-threshold summative result reaches anyone before the next report is run"]
        accreditation_citation: "ARC-PA Standard B4, Element B4.01 a-b — Exxat's own PA accreditation guide frames this mechanism explicitly as how PA programs avoid a B4.01 citation for late identification of deficiencies; ACOTE Standard C.1.15 (the 'escalate a failing or unsafe performance rating to the program immediately rather than at term end' half); CAPTE Standard 2, Element 2D4 (the exception path for a student assessed below entry level); CAA Standard 4.0, Standard 4.3 (identifying students needing intervention)"
        competitor_equivalent: "core-elms.yaml is the sharpest element-level competitive delta in this stage: the CORE ELMS evaluation module ships 'low-score alerts' and 'due-date reminders' as standard parts of the module for a discipline list that explicitly includes PT, OT, PA, nursing and social work, and that teardown rates the pillar 'ahead' of Prism. e-value.yaml adds 'automated low-score alerts; forced comments on low scores.' Both are self-service product features; Prism's equivalent is not."
        gap_severity: "gap"
        gap_note: >
          Confirmed shipped, genuinely instrument-aware (severity tiering by question, not a flat
          threshold), and better calibrated than anything a competitor publishes — but gated in a
          way that undercuts it. BOTH mechanisms require an Exxat Support or Account-Manager
          ticket supplying each recipient's first name, last name and email, so the escalation
          list is a hand-maintained artifact that goes stale as staff turn over. Worse, Exxat's
          own published OT best practice is to leave the Low Score Threshold OFF until every
          midterm FWPE has been submitted and reviewed — because only the Final FWPE counts
          toward scoring — which deliberately disables the alert during exactly the window when
          early intervention would still change the outcome. For SLP the same support dependency
          extends to min/max hour thresholds. This is the clearest 'shipped but not
          self-service' gap in stage 7 for the existing disciplines.
      - element: "Delegator-link expiry and the soft due date for external evaluators"
        type: "input field"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. The summative instrument for six of the eight existing
          disciplines is completed by someone with no Prism login, via an emailed delegator link,
          so the link's lifetime — not the form's Due Date — is what actually decides whether a
          late grade can still be entered. Program Details > Setup > School Profile > Email Setup
          carries 'Delegator Link Expiry,' default 365 days, with OT guidance recommending 30-50
          days for 4-week rotations specifically so educators lose access to student
          profiles/forms once the rotation ends. PA's Preceptor Evaluation of Student form is
          documented as having a SOFT due date: the preceptor can still submit after the deadline
          as long as the link remains live. OT Fieldwork Educators and PT CIs complete the
          summative form in-browser with Save / Clear All / Submit, and the FWPE requires the
          educator to tick 'Student was informed of this review' before submitting.
        gates_on: ["Whether an overdue external evaluator can still submit the grade-bearing form at all", "How long a non-user retains access to the student's record after the rotation ends"]
        accreditation_citation: "ACOTE Standard C.1.15 — the standard's operative words are that the evaluation is 'submitted on time' and returned to the academic program in a timely manner, and this pair of settings is what determines that; ARC-PA Standard B4, Element B4.01 a-b (documented, timely evaluation)"
        competitor_equivalent: "leo-davinci.yaml: Leo ships the same no-login external-evaluator primitive — 'on-demand evaluation links can be emailed to clinical faculty with no login required' — confirmed as a live feature. Leo's FAQ publishes no link-expiry setting and no soft-due-date behavior, so the expiry/soft-deadline mechanics themselves are not comparable field-for-field. core-elms.yaml ships 'due-date reminders' in the same module."
        gap_severity: "configure-needed"
        gap_note: >
          This is the element that actually governs grading turnaround for every discipline whose
          summative instrument is completed off-platform, and it is invisible from this screen —
          it sits in Program Details. Two consequences worth naming. A 365-day default expiry is
          a data-exposure surface OT guidance already flags, since the educator retains access to
          the student's profile and forms long after the placement ends. And because the PA
          preceptor due date is soft, any turnaround SLA measured against a preceptor form's Due
          Date is measuring an unenforced target — the enforceable boundary is link expiry, which
          is set once at program level and is not per-form.
    action: "Admin configures a recurring reminder (e.g. weekly, or 'Send Every X days') that fires as the grade-due date approaches, targeted at the student or supervisor who owns the score-contributing form — and, separately and by support ticket, configures the low-score/response-based escalation that fires when the result itself is bad rather than late."
    confirmed_by: "Help for Program Administrators/Step-by-Step Guides (How-tos)/Learning Activities/Setup Auto Notifications for Forms and Evaluations.md; Help for Program Administrators/Discipline Specific Guides/OT-OTA Discipline/Help Guides for OT-OTA/Fieldwork Performance Evaluation Tool.md (lines 33-57); Help for Faculty/Discipline Specific Guides/OT -OTA/Completing FWPE Form - For Fieldwork Educators.md (lines 20-31); Playbooks/Physical Therapy (PT) Playbook.md lines 261-263 (a numeric score threshold set at activation, below-threshold submissions displayed in RED on the review screen, and automated low-score email notifications to a designated recipient which are NOT self-service and require an Exxat support ticket); Playbooks/Physician Assistant (PA) Playbook.md, sections 'Low-score indicators + threshold email alerts' and 'Delegator Links, Notifications & Other Workflow Mechanics (FAQ-sourced)'; Playbooks/Occupational Therapy (OT) Playbook.md, sections 'Email Setup' and 'FWPE — Notification Thresholds and Distribution Mechanics'; Playbooks/Speech-Language Pathology (SLP) Playbook.md, section 'Notifications / Early Alerts'; capability-map.yaml, intelligence_layer 'Low-Score Threshold Alerting'"

  - screen: "Custom Reports (Learning Activities > Reports > Create New Report, data source: Forms and Evaluations)"
    navigation_path: "Learning Activities > Reports > Create New Report > Data Source: Forms and Evaluations"
    elements:
      - element: "Available column picker — Evaluation/Form Details group"
        type: "report filter"
        data_shown: "Evaluation Status (Pending/In Progress/Completed), Score, Grade, Assigned Date, Due Date, Submitted Date, Last Updated Date"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 (turnaround-time reporting for program leadership — these are the raw fields such a calculation requires)"
        competitor_equivalent: "Not evaluated at element level."
        gap_severity: "configure-needed"
        gap_note: >
          This element narrows the journey's hedge. The raw fields a turnaround calculation needs (Due Date,
          Submitted Date, Grade) are confirmed present in a self-service report, so 'SLA-compliance reporting is
          unconfirmed' is no longer accurate as an absolute statement — the data exists. A coordinator must still
          select and assemble them themselves.
      - element: "Pivot mode"
        type: "report filter"
        data_shown: "Group by row/column with Sum/Average/Earliest-Latest-date aggregation"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.8 (turnaround-time reporting for program leadership — this is where the Due-Date-vs-Submitted-Date comparison would have to be constructed)"
        competitor_equivalent: "Not evaluated at element level."
        gap_severity: "gap"
        gap_note: >
          This is where the remaining gap actually sits. There is no confirmed pre-built, named 'six-week SLA
          compliance' report or dashboard; a coordinator would have to construct the Due-Date-vs-Submitted-Date
          comparison themselves here, and the confirmed aggregations are Sum/Average/Earliest-Latest date, not an
          elapsed-days calculation. Gradebook itself (as distinct from the feeding form) is also not one of the 10
          confirmed Custom Report data sources. Purpose-built turnaround reporting stays a real gap, just a more
          precisely-scoped one.
      - element: "CAPTE Reports group — one-click, standard-numbered Download Report"
        type: "button"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION (PT/PTA), and the direct counter-example to the pivot-mode
          gap above. Seven pre-built reports whose NAMES carry the accreditor's own element
          numbers, run by selecting Group & Rotation (or Rotation) and clicking Download Report,
          with no column-picking or pivot assembly: Average CI Teaching Effectiveness (CAPTE 2024
          4P / 2016 4O); Involvement in Interprofessional Practice and Supervision of PTAs (CAPTE
          2024 6F / 2016 6L3, 6L4, sourced from PTSE 1 question 14); Patient Disease and
          Condition, Practice Across Lifespan and Continuum of Care (CAPTE 2024 6H / 2016 6L1,
          from PTSE 1 question 7); Practice Settings (CAPTE 2024 6H / 2016 6L2, from PTSE 1
          question 3); Total Qualifications of CIs (CAPTE 2024 4P / 2016 4O, from the CI Details
          form); Number and Variety of Clinical Sites (Standard 2C); Number and Variety of
          Clinical Slots (Standard 8F, with an include-cancelled-slots checkbox).
        gates_on: []
        accreditation_citation: "CAPTE Standard 4, Element 4P (Clinical Education Faculty Qualifications and Effectiveness); CAPTE Standard 6, Element 6F (Intra-professional and Interprofessional Learning Activities); CAPTE Standard 6, Element 6H (Clinical Education Experiences Across Conditions, Life Span, Continuum of Care, and Practice Settings) — these are the exact element IDs the report titles carry, not an inferred mapping"
        competitor_equivalent: "elentra.yaml: Elentra's Medicine discipline page names specific standards its reporting aligns to — 'LCME (incl. reporting aligned to standards like ED-5, ED-7), COCA, CACMS, ACPE, CODA, and ARC-PA' — i.e. the identical 'ship the standard number as the report name' pattern, and rated 'ahead' on the Accreditation Management pillar. The comparison is genuinely two-sided: Elentra's named list covers ARC-PA (PA) but NOT CAPTE, ACOTE, CAA, COA, CSWE or CAEP, so PT is where Prism holds the pattern and Elentra does not. leo-davinci.yaml ships 'completion/reminder tracking reports' but no standard-numbered exports."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped for exactly one of the eight existing disciplines. That is the finding:
          the pattern the journey treats as missing is not missing from the platform, it is
          missing from seven of eight disciplines. PA gets closest without reaching it — its
          accreditation guide maps existing reports to standards AND to Self-Study Report appendix
          numbers (SCPE Details to A1.10a-b / Appendix 11a; Comprehensive Assessment Report to
          B3.02a-c / Appendix 15; 'Student competency report / summative evaluation' to B4.03a-e /
          Appendix 14E) — but that is a documentation crosswalk a human follows, not a named
          report a button produces. OT, SLP, Nursing, CRNA, SW and TE have neither.
      - element: "Scoring vs. non-scoring form routing (Aggregate Report vs. Raw Data Report)"
        type: "report filter"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. Which report a completed summative form can be read out
          of is decided at form-build time, not at report time. Score-based forms run via
          Aggregate Report for Placement-Based Forms; non-scoring/qualitative forms run via Raw
          Data Report for Placement Forms — two separate navigation paths. PT's CIET adds two
          dedicated shapes: a Forms/Evaluations Raw Data Report emitting one row per role per term
          (four rows where Midterm+Final is crossed with Student+CI) and a Graphical Report for
          Placement Forms rendering per-question bar charts by rotation/setting.
        gates_on: ["Whether a summative form's results can ever be aggregated across a cohort, or only exported row-by-row"]
        accreditation_citation: "ARC-PA Standard B3, Element B3.06 a-g — Exxat's PA report catalog names 'Preceptor-based placement report + Aggregate evaluation report' as the paired evidence for this element; ACOTE Standard C.1.8 (evaluating the effectiveness of supervision, read out of the Comprehensive/Aggregate placement-form reports)"
        competitor_equivalent: "Not evaluated at element level — no competitor source in content/competitors documents a scoring-vs-qualitative report routing split, or an equivalent one-row-per-role-per-term raw export."
        gap_severity: "configure-needed"
        gap_note: >
          A real and easily-missed configuration trap. Exxat's own PA guidance is that
          Student-Evaluates-Preceptor and Student-Evaluates-Site forms should be built SCORE-based
          rather than purely qualitative, so preceptor and site performance can be quantified in
          aggregate, while still showing qualitative labels to students on the front end. Get that
          wrong at build time and the form is permanently stuck in Raw Data. For SLP and Nursing,
          where form creation is support-gated, correcting it is a ticket rather than an edit.
    action: "A coordinator builds a custom pivot report comparing each grade-bearing form's Due Date against its Submitted Date, per course/rotation, to manually approximate a turnaround-compliance view — except in PT, where seven of the accreditation-facing reads are one-click downloads instead."
    confirmed_by: "Help for Program Administrators/Step-by-Step Guides (How-tos)/Learning Activities/Generating and Managing Custom Reports.md (section 'Forms and Evaluations'); capability-map.yaml, 'Program Quality Analytics' (intelligence_layer); Help for Program Administrators/Discipline Specific Guides/PT-PTA Discipline/Help Guides/CAPTE (Commission on Accreditation in Physical Therapy Education) Reports.md; Help for Program Administrators/Discipline Specific Guides/PT-PTA Discipline/Help Guides/Physical Therapist Student Evaluation (PTSE) Report.md; Playbooks/Physical Therapy (PT) Playbook.md lines 210-222 (the seven CAPTE-mapped reports, incl. which PTSE 1 question each pulls from) and lines 234-244 (CIET v2.0 mechanics, incl. the two dedicated reports: the Forms/Evaluations Raw Data Report at one row per role per term and the Graphical Report for Placement Forms with per-question bar charts by rotation/setting plus a pie-chart response distribution); Playbooks/Physician Assistant (PA) Playbook.md, sections 'Additional Accreditation-Mapped Reports' and 'Evaluation form design best practice'"

  - screen: "PTSE 1 / PTSE 2 completion workflow (Learning Activities > Forms/Evaluations, Standard form type)"
    navigation_path: "Learning Activities > [Course] > Forms/Evaluations > PTSE 1 / PTSE 2 > [student]"
    elements:
      - element: "PTSE 1 — Physical Therapy Student Evaluation of Clinical Site"
        type: "input field"
        data_shown: "Student-authored evaluation of the site; workflow Student Completes -> Site Reviews -> School Admin Reviews -> publishable as a 'Location Evaluation' visible to future students in Explore Locations"
        gates_on: []
        accreditation_citation: "LCME Standard 8, Element 8.5; COCA Standard 11, Element 11.2 (the student-evaluation-of-clerkship/site half of the requirement)"
        competitor_equivalent: "one45.yaml: 'One45 Assessment and Evaluation is shipped today... 360° reviews, two-tier workflows, customizable forms/scales' — directionally comparable (one45 ships student-facing evaluation instruments today) but one45's public product page is not granular enough to name an equivalent single form/workflow for element-by-element comparison."
        gap_severity: "configure-needed"
        gap_note: >
          This element is the single biggest resolution of the journey's stage-7 pain_or_gap. The 'one-directional
          evaluation problem' framing (Prism can carry the preceptor's assessment of the student but not the
          reverse) is overstated as an absolute: this form runs on the same shipped Forms/Evaluations engine used
          everywhere else in Clinical & Experiential Education, with a validated student-completes /
          site-reviews / school-reviews / publish-as-Location-Evaluation workflow — in production, for PT. What is
          NOT confirmed is that an equivalent named instrument exists for DO, Pharmacy, Dentistry, or Medicine —
          building one is a Configure-level task on an already-proven engine, not a platform gap requiring an
          unshipped 'Surveys & Course Evaluations' roadmap item to ship first. That pillar has itself since
          shipped too (CORRECTED 2026-08-26 per Exxat PM confirmation, see ../prism/capability-map.yaml).
      - element: "PTSE 2 — Physical Therapy Student Evaluation of Clinical Instructor"
        type: "input field"
        data_shown: "Student-authored evaluation of the CI; workflow Student Completes -> School Admin Reviews; midterm responses carry forward into the final form; 'Send to CI' option; publishing creates a school-only (not student-visible) Location Evaluation"
        gates_on: []
        accreditation_citation: "LCME Standard 8, Element 8.5; COCA Standard 11, Element 11.2 (the student-evaluation-of-preceptor half of the requirement)"
        competitor_equivalent: "one45.yaml: 'One45 Assessment and Evaluation is shipped today... 360° reviews, two-tier workflows, customizable forms/scales' — directionally comparable (one45 ships student-facing evaluation instruments today) but one45's public product page is not granular enough to name an equivalent single form/workflow for element-by-element comparison."
        gap_severity: "configure-needed"
        gap_note: >
          Same verdict and same reasoning as PTSE 1 — a validated, in-production, student-authored instrument on
          the shipped Forms/Evaluations engine, confirmed for PT only, so an equivalent for DO, Pharmacy,
          Dentistry, or Medicine is a Configure-level build rather than a platform gap. Its workflow is shorter
          (no site-review tier, and publishing yields a school-only Location Evaluation), which is the intended
          confidentiality difference for a preceptor-directed instrument, not a shortfall. Separately, and
          applying to both PTSE forms: no mechanism was found anywhere in the sourced material that links
          evaluation results to a logged, auditable curricular-change record — the 'flowchart from evaluation data
          to curricular improvement' LCME 8.5 and COCA 11.2 also require stays unconfirmed and is the harder
          remaining gap.
      - element: "PTSE raw-data readout (Learning Activities > Reports > Raw Data for Forms/Evaluations, Form/Evaluation = 'PT Student Evaluation')"
        type: "report filter"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION (PT/PTA). The PTSE is described by its own help guide as
          'a comprehensive evaluation of a PT student's clinical performance... used for GRADING,
          feedback, and program evaluation.' The report is reached by selecting Course Offerings
          (searchable by Course Number, Name, Academic Year, Professional Year, Term, Cohort and
          Campus), filtering Form/Evaluation to 'PT Student Evaluation' and optionally Clinical
          Experience / Settings / Status, then Generate Report and Export to Excel.
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2E (Curriculum Assessment Plan including Clinical Education Assessment — assessment data collected from current students on the quality, quantity and variety of clinical education); CAPTE Standard 4, Element 4L (Effectiveness of the Director(s) of Clinical Education, where PTSE-family data is one input)"
        competitor_equivalent: "Not evaluated at element level — no competitor source names an equivalent single-instrument raw export filtered by instrument name."
        gap_severity: "none"
        gap_note: >
          Names the concrete readout behind the two PTSE elements above, and closes a small
          ambiguity in them: the PTSE is not purely a site/CI evaluation instrument, its own help
          guide states it is used for grading. That makes it a stage-7 grade-bearing artifact in
          PT, not only a stage-8 quality-feedback one. Export is Excel from a Raw Data report;
          there is no PTSE-specific aggregate or graphical shape confirmed beyond the CAPTE-named
          reports that draw on individual PTSE 1 questions.
      - element: "SECEE — Student Evaluation of Clinical Experience, with CI counter-signature (PTAMACS only)"
        type: "input field"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION (PTA). A third student-authored instrument in the PT/PTA
          family, attached to the PTAMACS workflow only and explicitly NOT part of PTMACS. Final
          term only: Student Completes (Final only) -> CI Reviews/Completes (Final only) -> School
          Reviews (Final only). The CI receives an email from the student, opens the SECEE, and —
          per the CI-facing help guide — 'Sign off at the end of the SECEE Evaluation and Click on
          Review.'
        gates_on: ["Whether the PTA student's end-of-experience evaluation carries an external counter-signature"]
        accreditation_citation: "CAPTE Standard 2, Element 2E (the CAPTE PTA document phrases this as 'stakeholders' where the PT document says 'parties of interest'; SECEE is the PTA-side student instrument feeding it); CAPTE Standard 4, Element 4P (Clinical Education Faculty Qualifications and Effectiveness)"
        competitor_equivalent: "one45.yaml: same hedge as PTSE 1/PTSE 2 above — one45 ships student-facing evaluation instruments with 'two-tier workflows,' which is the same shape, but its public page names no equivalent instrument and does not document a counter-signature step, so the sign-off itself is not comparable."
        gap_severity: "none"
        gap_note: >
          The only confirmed instance anywhere in this stage of an EXTERNAL evaluator
          counter-signing a STUDENT-authored summative document — everywhere else the direction
          runs student-signs-then-school-reviews, or educator-submits-then-school-reviews. Worth
          flagging as a reusable pattern for the four expansion domains, where a
          student-evaluates-site instrument that the site has demonstrably seen and signed is
          materially stronger evidence than one the site never saw. It is also PTA-only: PT
          programs on PTMACS do not get it, which is a genuine asymmetry inside one discipline
          rather than between disciplines.
      - element: "Standard PT/PTA Surveys — the site-side summative instrument, distributed TO SCCEs and CIs"
        type: "non-customizable placement-based standard form, distributed by School Admin"
        data_shown: >
          A fourth standard instrument in the PT/PTA family that this file had not carried, and the
          only one pointing at the SITE rather than at the student or the site's evaluation of the
          student. Per Physical Therapy (PT) Playbook.md lines 170-174 it is "not customizable," is
          a "placement-based form distributed by School Admin to SCCEs and/or CIs at the site," was
          "developed at Duke University" with "permission granted for any client to use," and
          carries a published validation study
          (https://dukespace.lib.duke.edu/server/api/core/bitstreams/4ba3c9fc-24a0-4692-8443-50dfd02b823b/content).
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2E — the parties-of-interest / stakeholder input CAPTE requires a program to gather and act on; the SCCE and the CI are the two site-side stakeholders this instrument reaches, and no other shipped PT instrument asks THEM anything. CAPTE Standard 4, Element 4P also reads on it, since site feedback on the program is part of how a program shows its clinical-education relationships are monitored rather than assumed."
        competitor_equivalent: >
          core-elms.yaml documents CORE ELMS shipping "student evaluations of preceptors/sites" with
          customizable forms, rated ahead on that pillar — but that is the student-to-site
          direction, which PTSE 1 and PTSE 2 already cover. Neither CORE ELMS nor any other
          teardown in content/competitors/ documents a SITE-to-PROGRAM instrument, validated or
          otherwise. Prism's position here is stronger than anything published on the competitor
          side, and it is stronger specifically because the instrument is externally developed and
          validated rather than program-authored — which is the same argument that makes the AOTA
          FWPE the strongest comparability surface in rotation-lifecycle--08.
        gap_severity: "none"
        gap_note: >
          ADDED 2026-08-25 from a full read of the PT playbook. Worth having for three reasons.
          (1) It completes the evaluation matrix for PT/PTA: the program evaluates the student
          (CIET/PTMACS/PTAMACS), the student evaluates the site (PTSE 1) and the CI (PTSE 2), and
          the SITE evaluates the program — a four-way loop no other discipline in this journey has
          shipped instruments for. (2) It is externally validated, which is the property this repo
          repeatedly identifies as what makes cross-site comparison meaningful rather than
          rhetorical. (3) Its non-customizability is the same trade-off recorded on the CI Details
          form and CIET in the PT playbook's pain points — programs want to customise standard
          forms and cannot — but here the trade-off is the point: a customised stakeholder survey
          would not carry the Duke validation.
          One boundary worth stating: the DCE Performance Survey family documented in the Surveys
          step below is a different object aimed at a different target (it evaluates the
          DCE/ACCE, and runs in the Surveys app rather than as a placement-based form). Two
          survey-shaped PT artifacts, two audiences, two delivery mechanisms — do not conflate
          them in a demo.
    action: "The student completes a standard, free, APTA-authored form evaluating the clinical site and, separately, the clinical instructor — the reverse direction of evaluation from the preceptor-scores-student direction covered in earlier stages; PTA students additionally complete the SECEE, which the CI signs off before school review; and the school separately distributes the Duke-developed Standard PT/PTA Survey to the SCCE and CI so the site can evaluate the program."
    confirmed_by: "Playbooks/Physical Therapy (PT) Playbook.md — read IN FULL 2026-08-25; lines 127-129 (the standard/other/assessment form inventory), 131-136 (PTSE 1: site is being evaluated, a standard free APTA form, the Student > Site Reviews > School Admin Reviews workflow, publication as a Location Evaluation visible to students in Explore Locations, the 'always answer Yes to does this form require placement' rule, and pre-configured CAPTE-reporting reports many of which pull from specific PTSE 1 questions), 138-143 (PTSE 2: CI is being evaluated, Student Completes > School Admin Reviews, midterm responses visible when completing Final, the 'PTSE2 Send to CI' email option, publication creating a school-only Location Evaluation, and the recommendation to request activation of 'PTSE2 Send Response to CI' rather than downloading manually — i.e. that automation is support-gated), 153-161 ('SECEE is PTAMACS-only'; PTMACS/PTAMACS free, Exxat-exclusive, used by Texas Consortium and many PTA programs), 170-174 (the Duke-developed Standard PT/PTA Surveys, non-customizable, distributed by School Admin to SCCEs and/or CIs, with the validation-study link), 261-263 (the numeric low-score threshold on PTSE 1/PTSE 2 and the support-ticket dependency for automated low-score email notifications); Help for Program Administrators/Discipline Specific Guides/PT-PTA Discipline/Help Guides/Physical Therapist Student Evaluation (PTSE) Report.md; Help for Site/Discipline Specific Guides/PT-PTA Discipline/Completing the PTAMACS for CIs.md (steps 17-19); content/accreditation/capte.yaml (Standard 2, Element 2E; Standard 4, Element 4P)"

  - screen: "CIET v2.0 final-term evaluation — parallel completion and school review (PT/PTA)"
    navigation_path: "Learning Activities > [Course] > Setup > Forms/Evaluations > [+ icon] > CIET v2.0; review at Learning Activities > [Course] > Forms/Evaluations > [status link]"
    elements:
      - element: "Parallel / concurrent completion with mutual blinding"
        type: "toggle"
        data_shown: "Student and Clinical Instructor fill the same instrument simultaneously via the same emailed link; each side's ratings stay hidden from the other until BOTH have submitted, at which point each can view the other's evaluation"
        gates_on: ["Whether either party can see the other's summative ratings before committing their own"]
        accreditation_citation: "CAPTE Standard 2, Element 2D4 (Students Demonstrate Entry-Level Clinical Performance) — capte.yaml calls 2D4 'the single best-served element in the whole document' and names CIET v2.0's concurrent/blinded completion as the reason"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown in content/competitors documents a blinded concurrent self-and-supervisor evaluation. one45's '360° reviews' and e-value's 'mid-point-to-end-of-rotation summary evaluations' both describe multi-rater collection, but neither public source claims mutual blinding until dual submission, which is the specific mechanic here."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped (the PT playbook's earlier 'coming with the March end release' note is
          superseded) and the strongest single differentiator in this stage. Its stated purpose is
          eliminating anchoring bias between self- and CI-evaluation, which is a measurement-validity
          property no competitor source in this corpus claims. Directly reusable messaging for the
          four expansion domains, where the summative instrument is currently assumed to be
          one-directional.
      - element: "Status ladder — Midterm-Pending School Review -> final Get Started -> final Pending School Review"
        type: "read-only rollup"
        data_shown: "Once BOTH student and CI submit, status changes to 'Midterm-Pending School Review'; after school review, and only if the Midterm-and-Final workflow was selected, the form status changes to final 'Get Started' and student and CI repeat the same process for the final term"
        gates_on: ["Whether the final-term instance opens at all — it is gated on the midterm having been school-reviewed"]
        accreditation_citation: "CAPTE Standard 2, Element 2D4 (the per-student, per-placement summative record this ladder produces); CAPTE Standard 2, Element 2C (Ongoing, Formal, Comprehensive Program Assessment — the completion-status view the ladder makes queryable)"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a named status ladder in which the final-term instance is gated on the midterm's review."
        gap_severity: "none"
        gap_note: >
