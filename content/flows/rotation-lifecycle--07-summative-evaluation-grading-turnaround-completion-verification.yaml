        type: "read-only rollup"
        data_shown: "SEFWE I routes to the Fieldwork Educator for review and signature first — status 'Pending Educator Review' — before reaching the school. SEFWE II goes straight to admin review, status 'Pending School Review.' SEFWE I's content areas: OT Process (Evaluation, Intervention, Outcomes), Aspects of the Environment, Documentation and Caseload, Supervision, Summary of Fieldwork Experience, e-signature/completion."
        gates_on: ["Whether the site sees the student's end-of-fieldwork evaluation before the school does"]
        accreditation_citation: "ACOTE Standard C.1.8 (Evaluating the Effectiveness of Supervision) — acote.yaml's software requirement for C.1.8 rests on student evaluations of educators completed at the end of Level II experiences, which is exactly what these instruments are; ACOTE Standard C.1.2 (Student Access to Fieldwork Site Information — the published output is what future students read)"
        competitor_equivalent: "one45.yaml: 'two-tier workflows' on a shipped evaluation module — the same primitive as SEFWE I's educator-then-school routing, but one45's page names no equivalent instrument and does not distinguish two instruments with different tier counts, so the SEFWE I/II asymmetry has no documented counterpart."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and structurally the OT twin of PT's PTSE 1 / PTSE 2 asymmetry (site
          reviews the site-directed instrument; the school-only instrument skips that hop). Worth
          noting a documentation inconsistency to reconcile before external use: Exxat's dedicated
          SEFWE guides define the acronym as Subjective - Environment - Functioning - What is the
          problem - Expected Outcomes, framing it as a clinical-reasoning documentation tool, while
          the OT playbook elsewhere uses 'Student Evaluation of the Fieldwork Experience.'
      - element: "Review options — Review | Un-Submit to Student | Un-submit to Educator | Review and Publish"
        type: "toggle"
        data_shown: "More granular than the general Review/Un-submit pattern used on the FWPE: un-submitting to the student and un-submitting to the educator are distinct actions, and 'Review and Publish' is available as a single combined action"
        gates_on: ["Whether the completed evaluation becomes visible outside the review queue"]
        accreditation_citation: "ACOTE Standard C.1.8 (the documented mechanism for evaluating supervision effectiveness — publication is the step that makes it usable); ACOTE Standard A.6.3 (Program Evaluation — 'student evaluation of the fieldwork experience' is one of the eleven enumerated data streams this standard requires)"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a combined review-and-publish action or a two-target un-submit."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and the most granular review-action set found anywhere in stage 7. It
          also carries the one closed-loop caveat that recurs across every accreditor in this
          corpus: acote.yaml rates A.6.3 'Gap' precisely because nothing links a finding from these
          evaluations to the programmatic change made in response — publishing makes the data
          visible, it does not record the decision taken from it.
      - element: "Audit Log on the form"
        type: "read-only rollup"
        data_shown: "Each SEFWE form carries an Audit Log showing its full change history"
        gates_on: []
        accreditation_citation: "ACOTE Standard C.1.8 (evidentiary integrity of the supervision-effectiveness record); ACOTE Standard A.6.3 (the annual analysis this data feeds must be traceable)"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown in content/competitors documents a per-form audit log."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped for SEFWE specifically. Notable because it is NOT documented on the
          FWPE, CIET, PTMACS or any configured nursing/SLP/SW form — so per-form change history
          appears to be instrument-specific rather than a platform-wide property, which is worth
          verifying before offering it as general evidence. PT's SCIPAI is separately documented as
          giving the DCE access to an audit trail, so the capability exists on at least two
          instruments.
      - element: "Published destination — admin Location Evaluations page and student Explore Clinical Locations & Wishlist"
        type: "read-only rollup"
        data_shown: "Once published, SEFWE I/II land on the admin-side Location Evaluations page and in the student-side Explore Clinical Locations & Wishlist view, where future cohorts see aggregated feedback"
        gates_on: ["Future students' pre-placement view of a site"]
        accreditation_citation: "ACOTE Standard C.1.2 (Student Access to Fieldwork Site Information — programs must document a process ensuring all students access site information, requirements and past evaluations before starting fieldwork; publishing SEFWE is Exxat's named best practice for it)"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents publishing a completed student evaluation into a site-discovery surface for future cohorts."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and structurally identical to PT's PTSE 1 -> Location Evaluation ->
          Explore Locations path, which is what makes it a reusable pattern rather than a
