ain points are ALL explicitly unpopulated, with a standing instruction not to treat field-standard TE terms or CAEP standard numbers as Exxat-specific until confirmed against a TE-specific source). EVERY TE claim in this file that is not about the LTI integration is therefore reasoned from ../accreditation/caep.yaml and carries that caveat inline. In THIS file the load-bearing lines are 33-45 (the full administrator setup sequence, including the auto-creation of the matching GoReact activity on first save and the mark-Done step that actually releases the assignment to students), 54-57 (reviewer scoring and the automatic score/status sync back into Prism), and 61 (GoReact-side configuration living outside Exxat's documentation)."
