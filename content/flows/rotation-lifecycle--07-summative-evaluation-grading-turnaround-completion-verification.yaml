  - screen: "Program Requirements (Student profile > Academics tab, and Students > Reports > Program Requirements)"
    navigation_path: "Students > [student] > Academics > Program Requirements; and Students > Reports > Program Requirements"
    elements:
      - element: "Requirement status field (Pending / Placed for / Completed)"
        type: "read-only rollup"
        data_shown: "Per-requirement status; auto-updates to 'Placed for' when a placement publishes, to 'Completed' when that placement finishes successfully, and reverts to 'Pending' if the placement is later marked Unsuccessful; highest status across multiple placements wins"
        gates_on: ["Graduation-requirement completion for that category"]
        accreditation_citation: "LCME Standard 8, Element 8.6; ACPE Standard 3, Key Elements 3.2.b & 3.2.d (this is the per-requirement status record those standards are satisfied against)"
        competitor_equivalent: "Not evaluated at element level — no competitor file in content/competitors documents an equivalent requirement-status field by name."
        gap_severity: "none"
        gap_note: >
          This element gives the journey's strongest existing claim (LCME 8.6, rated Transfer, 'the strongest fit
          of any standard') a named field instead of an inferred one. The help center's own example list for
          Program Requirement categories is 'Completing placements across specific settings' and 'Achieving a
          minimum grade in all registered courses' — i.e. the exact shape ACPE 3.2.d's four-required-setting rule
          needs — which confirms acpe.yaml's 'Configure' rating concretely: the status-tracking mechanism exists
          and auto-updates off placement completion; only the ACPE-specific four-category taxonomy and the NTPD
          'assessed equivalent' record type would need to be configured on top of it. Whether completion status
          can be configured to auto-BLOCK a graduation-clearance workflow (vs. just display as Pending) rather
          than merely flag it is not confirmed by this source and stays an open question against this field.
      - element: "Program Requirements report — Status/Cohort/Group/Category/Campus filters"
        type: "report filter"
        data_shown: "Every student's status across every defined program requirement, in one grid"
        gates_on: []
        accreditation_citation: "LCME Standard 8, Element 8.6 (the program-wide monitoring view that element requires, as distinct from the per-student record)"
        competitor_equivalent: "Not evaluated at element level — no competitor file in content/competitors documents an equivalent program-wide requirement-status grid screen by name."
        gap_severity: "none"
        gap_note: "Confirmed shipped: the cohort-wide grid with Status/Cohort/Group/Category/Campus filters is what makes 8.6 a program-level monitoring claim rather than a per-student one, and is exactly the screen a coordinator uses to find outstanding Pendings before graduation clearance."
      - element: "Hour-threshold requirements surfaced on the student profile"
        type: "read-only rollup"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION. Beyond placement-category requirements, programs can set HOUR
          thresholds under Program Requirements, surfaced on the student profile so students and admins
          both see progress toward the requirement. Confirmed in use for Nursing against the DNP
          1,000-hour and NP 500-direct-hour minimums, fed by the Hours by Categories report. The same
          shape serves the settings-based requirements PT programs configure (Rural, Underserved,
          School-based, Integrated Clinical Experience-Acute) and OT programs configure (Physical
          Disabilities, Home Health, Outpatient, Community-Based, Inpatient/Long-term care).
        gates_on: ["Graduation-requirement completion for an hours-based or setting-based category"]
        accreditation_citation: "CCNE Standard III, Key Element III-H (Planned Clinical Practice Experiences — DNP 1,000-hour and NP 500-hour minimums); ACEN Standard 4, Criterion 4.6 (Course Credits, Clock Hours, and Contact-Hour Ratios); CAPTE Standard 6, Element 6H (clinical education experiences across settings — the settings-requirement variant)"
        competitor_equivalent: "Not evaluated at element level — core-elms.yaml documents 'timesheet/hours tracking with optional GPS' but no per-student requirement object that hours accrue against; no competitor file names an equivalent requirement-status record."
        gap_severity: "configure-needed"
        gap_note: >
          Materially broadens the element above it: for the existing disciplines Program Requirements
          is not only a placement-category tracker but the surface where hour minimums become visible
          to the student. The open question stated against the status field applies identically here —
          nothing confirms a requirement can auto-BLOCK graduation clearance rather than display as
          Pending, and for hours specifically the rollup is a report an admin reads, not a rule the
          system enforces.
      - element: "Degree-level-conditional and cohort-conditional thresholds"
        type: "read-only rollup"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION, and a limitation rather than a capability. Several existing
          disciplines carry thresholds that vary WITHIN one accreditor standard: ACOTE C.1.12 requires
          24 weeks of full-time Level II fieldwork for OT (doctoral and master's) but 16 weeks for OTA
          (baccalaureate and associate) — commonly in the same Prism tenant under a shared site-sharing
          model. COA's Appendix daggers three case-count rows (total cases 700, mask ventilation 100,
          CVC monitoring 10) so they bind only students matriculating on or after Jan 1 2026, putting
          two cohorts in the same building under different totals. CAPTE 6A sets a 30-week full-time
          clinical minimum for PT at 32 hours/week, with a different curricular floor in the separate
          PTA document. Nothing confirmed applies a per-program or per-matriculation-year threshold
          automatically.
        gates_on: []
        accreditation_citation: "ACOTE Standard C.1.12 (Length of Level II Fieldwork — 24 vs. 16 weeks by degree level); COA Standard E.2.3 + Appendix (the daggered rows binding only post-Jan-2026 matriculants); CAPTE Standard 6, Element 6A (Comprehensive Curriculum Plan and Minimum Clinical Education Weeks — 30 weeks of full-time clinical education at a minimum 32 hours/week); CSWE Accreditation Standard 3.3, AS 3.3.3 (400 BSW vs. 900 MSW)"
        competitor_equivalent: "Not evaluated at element level — no competitor source in content/competitors documents cohort-conditional or degree-level-conditional threshold configuration."
        gap_severity: "gap"
        gap_note: >
          A single, precisely-shaped gap that recurs across four of the eight existing disciplines and
          is stated independently in acote.yaml, coa.yaml, capte.yaml and cswe.yaml. Two distinct
          missing capabilities hide inside it. (1) SCOPE: a threshold cannot be bound to a degree
          level or program within one tenant, so an OTD/MSOT and an OTA program sharing a tenant
          cannot both be checked correctly. (2) TIME: a threshold cannot be conditioned on
          matriculation date, which COA now requires outright. Separately, capte.yaml notes rotation
          setup has no 'counts toward the CAPTE full-time minimum' flag distinguishing Integrated
          Clinical Experience from terminal full-time experiences, so the integrated/full-time split
          relies on naming convention — meaning even the 30-week PT count is assembled by hand from
          the Comprehensive Placement Report.
    action: "A coordinator opens the program-wide Program Requirements report (not a single student's profile) to see, across the whole cohort at once, which students still show Pending against a required rotation category or hour threshold before clearing them for graduation."
    confirmed_by: "Help for Program Administrators/Step-by-Step Guides (How-tos)/Students/Overview of Student Page.md (section 'Managing Program Requirements' / 'Program Requirement'); Help for Program Administrators/Step-by-Step Guides (How-tos)/Students/Viewing Student Reports.md (section 'Program Requirements report'); Playbooks/Nursing Playbook.md, section 'Learning Activities: Timesheets & Patient/CCE Log'; Playbooks/Physical Therapy (PT) Playbook.md line 60 (per-setting Program Requirements — Rural, Underserved, School-based, Integrated Clinical Experience-Acute — set up so completion can be tracked per student); Playbooks/Occupational Therapy (OT) Playbook.md, section 'Student Setup' (Program Requirements examples); content/accreditation/acote.yaml element 'Standard C.1.12'; content/accreditation/capte.yaml element 'Standard 6, Element 6A'; content/accreditation/coa.yaml element 'Standard E.2.3 + Appendix'"

