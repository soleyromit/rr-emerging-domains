ons of Clinical Supervisors, Site Assessments aligned to program goals and accreditation standards, and custom forms — all support-gated to create; and the student-facing Student Performance Report across all nine service delivery areas), 104-105 (surveys buildable in Prism from December 2025), 109-114 (advisement via Communications & Interventions or custom workflow-based advisement forms with signature, plus profile-level and course-level attestations with their navigation paths), 118 (question-based early-alert notifications configured by support), 120-138 (the report suite, the shared filter set, the 50-course-offering cap, and the broader capability list incl. trend/exposure analysis, low-performance indicators and placement-readiness metrics), 142-149 (the discipline's own gap list — explicitly a DOCUMENTATION gap, plus the recurring self-service gap for SLP). In THIS file the load-bearing lines are 88-100 (the configured-forms toolkit and the student-facing Student Performance Report across all nine service delivery areas, with individual and aggregate scores plus personal-qualities/professional-practice-area scores), 49 and 127 (the 400-hour tracking on the Clinical Clock Hours Report (Cumulative)), and 104-105 (Prism-built surveys from December 2025, with Graduating Student Survey and Clinical Supervisor Survey named)."
