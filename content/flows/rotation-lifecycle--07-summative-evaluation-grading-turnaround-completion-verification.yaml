          MEAN across all child competencies' mapped questions rather than an average of averages.
        gates_on: []
        accreditation_citation: "CSWE Accreditation Standard 5.0, AS 5.0.1(b) (Method of Analyzing Competency Outcomes); ARC-PA Standard B4, Element B4.03 a-e and Standard B3, Element B3.05 a-f; COA Standards D.1-D.50 (Graduate Standards, ALL 50 CRITICAL) and Standard H.1.1.1 (terminal evaluation against D1-D50); ACEN Standard 5, Criterion 5.1 (Systematic Plan for Evaluation — Summative Assessment of End-of-Program Student Learning Outcomes)"
        competitor_equivalent: "core-elms.yaml: CORE's CompMS (Competency Management System) is a DISTINCT ADD-ON module, not bundled into core ELMS, that maps competencies to accreditation standards/domains/sub-domains and produces 'curriculum-effectiveness reports tying student outcomes back to the map' — rated 'ahead,' though that teardown flags it as provisional pending pricing/bundling confirmation. That bundling question is the substantive delta: Prism's Competency Management is part of the platform, CORE's appears to be sold alongside it."
        gap_severity: "configure-needed"
        gap_note: >
          The single most reused element in stage 7 across the existing disciplines — four accreditors,
          four different frameworks, one surface. The pooled-mean detail is not a footnote: CSWE AS
          5.0.1(a)(v) requires the program to explain HOW achievement is calculated, so the pooled-mean
          method is the answer to a compliance statement. Two configuration constraints carry across all
          four: assessment questions map at the CHILD-MOST standard level only (a framework configured
          without lettered children has nowhere to attach questions), and Grading Scheme must be enabled
          first if the framework draws on final course grades.
      - element: "Custom competency reporting scale (COA / CRNA)"
        type: "toggle"
        data_shown: "For COA specifically, the Graduate Standards D.1-D.50 are configured directly as the competency framework, with a custom competency reporting scale available instead of the fixed default scale"
        gates_on: ["Whether the terminal evaluation's ratings can be expressed in the accreditor's own vocabulary"]
        accreditation_citation: "COA Standards D.1-D.50 (Graduate Standards, ALL 50 CRITICAL); COA Standard H.1.1 and H.1.1.1 (the terminal evaluation completed to demonstrate the student achieved D1-D50)"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown documents a per-framework configurable reporting scale as distinct from a configurable pass threshold."
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed available and worth naming because it is the piece that makes the COA framework
          expressible rather than approximated — 50 critical graduate standards forced onto a fixed
          default scale would not survive review. The unresolved dependency sits upstream: coa.yaml notes
          the Daily Clinical Evaluation Report is an aggregation and export layer, not a competency
          computation, so bridging daily formative volume to D1-D50 achievement requires the daily
          instrument's questions to be MAPPED here — which the source material does not show and which
          should be verified rather than assumed.
      - element: "Per-program-option vs. aggregate segmentation (one-grid-per-report limit)"
        type: "report filter"
        data_shown: >
          EXISTING-DISCIPLINE EXTENSION, and a limitation. Several accreditors require the same competency
          outcomes reported BOTH broken out by program option and in aggregate. Option-level segmentation
          depends on how cohorts, groups and campuses were configured at onboarding, and a confirmed
          one-grid-per-report limit means a program that set up separate grids per option cannot produce
          the aggregate view from the product.
        gates_on: []
        accreditation_citation: "CSWE Accreditation Standard 5.0, AS 5.0.1(b) — 'outcomes broken out for each program option AND in aggregate'; ACEN Standard 5, Criterion 5.1 (collect AGGREGATE data and DISAGGREGATE it for meaningful analysis, with written justification wherever data is not disaggregated); CAEP Standard R3, Component R3.3 (data disaggregated by preparation program, race/ethnicity and other demographics)"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents grid-scoping constraints on competency reporting. e-value.yaml's 'AI-powered risk assessment' analytics and core-elms' CompMS both claim outcome reporting, but neither publishes a segmentation model to compare against."
        gap_severity: "gap"
        gap_note: >
          cswe.yaml puts it precisely: 'This is a configuration decision made months before anyone reads
          AS 5.0.1(b), which is exactly why it should be called out during SW implementation.' The same
          trap applies to CAEP, where demographic disaggregation runs through EVERY R1-R4 component and
          should be treated as a cross-cutting reporting primitive rather than re-solved per element, and
          to ACEN 5.1(c). One genuine advantage worth stating alongside it, from nursing.yaml: because
          assessment-to-competency mapping happens once and calculates automatically thereafter,
          disaggregation by track or cohort is a FILTER rather than a rebuild — which is what ACEN 5.1(c)
          asks for and what spreadsheet-based programs cannot do. The gap is grid scoping, not the
          measurement model.
    action: "An admin configures a competency framework against final course grades (requires Grading Scheme enabled first) and/or experiential assessment questions, maps assessments to competencies, then reviews the cohort-level rollup before publishing scores to students — and, for CSWE, ARC-PA, COA and CCNE/ACEN programs, exports Review > View Report as the named evidence artifact for the corresponding standard."
    confirmed_by: "Help for Program Administrators/Step-by-Step Guides (How-tos)/Competency Management/Competency Framework Configuration and Management.md; capability-map.yaml, intelligence_layer > 'Competency Tracking'; Help for Program Administrators/Discipline Specific Guides/Social Work (SW)/Social Work Accreditation Standards.md (AS 5.0.1 sections); Playbooks/Physician Assistant (PA) Playbook.md, section 'Competency Framework & Competency Tracking Report'; Playbooks/Nursing Playbook.md, section 'Competency Management'; content/accreditation/cswe.yaml elements 'AS 5.0.1(a)' and 'AS 5.0.1(b)'; content/accreditation/coa.yaml elements 'Standards D.1-D.50' and 'Standard H.1.1 and H.1.1.1'; content/accreditation/nursing.yaml element 'ACEN Standard 5, Criterion 5.1'; content/accreditation/caep.yaml element 'Standard R3, Component R3.3'"

