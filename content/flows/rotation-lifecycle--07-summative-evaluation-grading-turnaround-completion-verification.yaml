  - screen: "PA summative evaluation within the final four months — two documented paths"
    navigation_path: "Path 1: Program > Competency Management > [program-defined competencies framework] > Review > View Report (per-student competency report). Path 2: Learning Activities > [placeholder course or final rotation] > Setup > Forms/Evaluations > [summative evaluation form], read out via Learning Activities > Reports > Aggregate Report for Placement-Based Forms"
    elements:
      - element: "Program-defined-competencies framework with evaluation questions mapped to it (Path 1)"
        type: "read-only rollup"
        data_shown: >
          A program-specific standard created in Competency Management — Exxat's PA guidance names
          examples such as 'ARC-PA B3.03/B3.04 outcomes' and 'Student Learning Outcomes' for
          B3.05a-f — whose lettered sub-requirements become competency categories; existing
          evaluation-form questions are mapped to those categories once, after which achievement
          calculates automatically on every subsequent evaluation. Read out at cohort level as a
          bird's-eye Competency Tracking Report, or per student via 'View Report.'
        gates_on: ["Whether a per-student, per-competency verdict exists at all at program end"]
        accreditation_citation: "ARC-PA Standard B4, Element B4.03 a-e (Summative Evaluation Within the Final Four Months) — Exxat's own report catalog maps 'Student competency report / summative evaluation' to B4.03a-e and Self-Study Report Appendix 14E; ARC-PA Standard B3, Element B3.05 a-f (the six learning-outcome domains the verdict must span)"
        competitor_equivalent: "elentra.yaml names ARC-PA among the standards its accreditation reporting aligns to, and its Assessment & Evaluation module spans 'formative assessments to summative exams' — the only competitor in this corpus with a documented ARC-PA claim. But Elentra's public material names no per-student, per-competency summative artifact and no four-month-window concept, so the comparison stops at 'both claim ARC-PA alignment.'"
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed shipped machinery (Competency Tracking is a live intelligence-layer pillar) and
          arc-pa.yaml rates B4.03 'Configure' on the strength of it. The configuration is real
          though: the framework must be built to the child-most level before questions can be
          mapped, and mapping is per-question. Note the depth caution carried in cswe.yaml and
          applying equally here — Competency Tracking maps experiential assessment questions at the
          child-most standard level ONLY, so a framework configured without lettered children has
          nowhere to attach questions.
      - element: "Milestone summative evaluation form on a placeholder or final-rotation course (Path 2)"
        type: "input field"
        data_shown: >
          A separate qualitative summative evaluation form per student, attached to a placeholder
          course or the final rotation, completed by the DCE or faculty drawing on end-of-rotation
          evaluations, patient-log diagnosis and procedure minimums, PAEA end-of-year exam scores,
          OSCEs and school rubrics; read out via the Aggregate Report for Placement-Based Forms.
        gates_on: ["Gradebook contribution, if the form is set score-contributing"]
        accreditation_citation: "ARC-PA Standard B4, Element B4.03 a-e — the element requires a verdict '(a) attributable to a named evaluator, (b) date-stamped inside a specific four-month window relative to that student's own program end date, and (c) assembled from more than one instrument'; this path supplies (a) and (c)"
        competitor_equivalent: "e-value.yaml: E*Value ships 'mid-point-to-end-of-rotation summary evaluations' plus a BoardVitals-backed assessment module with 'AI-powered risk assessment analytics that flag at-risk learners against board-exam benchmarks' — a documented multi-source learner-risk rollup, which is closer to B4.03's 'more than one instrument' requirement than anything else in this corpus. It is partner content rather than native, and E*Value publishes no four-month-window concept either."
        gap_severity: "configure-needed"
        gap_note: >
          Both paths are documented by Exxat and both ride shipped machinery, so B4.03 is not a
          build. The Path-2 dependency worth pricing is that PAEA end-of-year exam scores and OSCE
          results must be keyed in by hand — no shipped pillar ingests external exam data, which is
          Exam Management's job (roadmap Q2 2027).
      - element: "The four-month window — no field, no check"
        type: "read-only rollup"
        data_shown: "Nothing in either path records or validates that the summative evaluation was completed inside the four months preceding that individual student's own program end date. The forms carry Assigned/Due/Submitted dates; nothing compares them to a per-student program end date."
        gates_on: []
        accreditation_citation: "ARC-PA Standard B4, Element B4.03 a-e — the four-month window is the OPERATIVE constraint of the standard, not an aside"
        competitor_equivalent: "Not evaluated at element level — no competitor source in content/competitors documents a per-learner completion window validated against that learner's own program end date."
        gap_severity: "gap"
        gap_note: >
          arc-pa.yaml states it flatly: 'Nothing enforces or even checks the FOUR-MONTH WINDOW,
          which is the operative constraint of the standard — a summative evaluation completed five
          months out satisfies every report in Prism and fails B4.03.' This is the single most
          precisely-scoped, cheapest-to-close gap in stage 7 across all eight existing disciplines:
          it is a date comparison between an existing Submitted Date and an existing per-student
          program end date, not new data collection. Worth pairing with the anchor-relative
          due-date primitive already shipped on the Forms/Evaluations Setup step, which is the same
          arithmetic anchored to a placement rather than to a program.
      - element: "Mid-point-to-summative consistency (a citation risk with no product control)"
        type: "read-only rollup"
        data_shown: "Exxat's PA guidance states explicitly that mid-point and end-of-rotation evaluations of the same student by the same preceptor should be exactly consistent in substance, because PA programs have received ARC-PA citations where a student's formative feedback contradicts their summative assessment. No confirmed control compares the two."
        gates_on: []
        accreditation_citation: "ARC-PA Standard B4, Element B4.01 a-b (Frequent, Objective, Documented Student Evaluation) with Element B4.03 a-e"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a formative-versus-summative consistency check."
        gap_severity: "gap"
        gap_note: >
          A named, real-world citation cause with no product mitigation for PA specifically. The
          mitigation EXISTS elsewhere in the platform — CIET, PTMACS/PTAMACS and the AOTA FWPE all
          carry midterm responses and scores forward so they stay visible while the final is being
          completed, which structurally discourages contradiction — but no equivalent carry-forward
          is confirmed for a PA-configured custom form. Closing this is arguably just extending the
          Multi-Term archetype's carry-forward behavior to configured forms, which would serve
          nursing and SLP identically.
    action: "In the final four months of the program, the DCE or faculty either reads a per-student competency report out of Competency Management against a program-defined-competencies framework, or completes a milestone summative evaluation form per student on a placeholder/final-rotation course — in practice often both, since ARC-PA requires the verdict be assembled from more than one instrument."
    confirmed_by: "Playbooks/Physician Assistant (PA) Playbook.md, sections 'Additional Accreditation-Mapped Reports (Beyond What's Already Documented)' (report-to-standard-to-SSR-appendix table, incl. 'Student competency report / summative evaluation | B4.03a-e | Appendix 14E') and 'Competency Framework & Competency Tracking Report' (incl. the mid-point/end-of-rotation consistency citation risk); content/accreditation/arc-pa.yaml, elements 'Standard B4, Element B4.03 a-e' and 'Standard B4, Element B4.01 a-b'"

  - screen: "SLP completion verification — Student Performance Report and Clinical Clock Hours Report (Cumulative)"
    navigation_path: "Learning Activities > Reports > Student Performance (available to admins AND to students directly); Learning Activities > Reports > Clinical Clock Hours Report (Cumulative) / Clock Hours Report"
    elements:
      - element: "Form/Evaluation filter — selecting the final performance evaluation across all courses"
        type: "report filter"
        data_shown: "Select Course Offerings (all at once or individually) > Apply, then filter by Form/Evaluation and Status. The student-facing help guide's own worked example is the summative case: 'If you need to see final performance evaluation data across all courses, you can select that form under Form/Evaluation filter.' Output is a grid, exportable to Excel."
        gates_on: []
        accreditation_citation: "CAA Standard 5.0, Standard 5.2 (Ongoing and systematic formative and summative assessment of student performance — 'a demonstration of how assessment results are used to evaluate and enhance student progress'); CAA Standard 4.0, Standard 4.6 (Students receive regular advising on academic and clinical performance and progress)"
        competitor_equivalent: "core-elms.yaml: CORE ELMS serves allied health including SLP-adjacent disciplines and ships student self-evaluations plus preceptor assessments with 'automated grade calculation/conversion,' rated 'ahead.' No public CORE source documents a student-facing cross-course performance report filtered by instrument, so the student-accessible half is not comparable."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and student-accessible, which is the part that matters: CAA Standard 4.8
          requires the program to make progress documentation available to the student, and this
          report is documented in the Help for STUDENTS section, not only the admin section. It is
          the cross-course summative readout SLP has instead of a named terminal instrument.
      - element: "Nine service-delivery-area competency grid with individual and aggregate scores"
        type: "read-only rollup"
        data_shown: "A consolidated view of all evaluation and observation competencies across all 9 KASA service delivery areas, with per-item individual scores alongside aggregate scores, plus personal qualities and professional practice areas with the score received during the clinical"
        gates_on: []
        accreditation_citation: "CAA Standard 3.1B, Sub-elements 3.1.1B - 3.1.6B (Professional Practice Competencies, Foundations, Identification/Prevention, Evaluation, Intervention, and General Knowledge and Skills); CAA Standard 5.0, Standard 5.2"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown in content/competitors names a KASA/service-delivery-area competency rollup or an equivalent discipline-specific framework grid."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and the closest thing SLP has to a summative verdict artifact. The
          honest limitation is upstream of this report rather than in it: caa-asha.yaml notes SLP has
          NO free validated off-the-shelf instrument the way PT has CIET v2/PTMACS/SCIPAI and OT has
          the AOTA FWPE family — every SLP instrument (KASA Summary Forms, Clinical Supervisor
          Evaluations Midterm and Final, Student Self-Assessments, Student Evaluations of Clinical
          Sites and Supervisors) is a configured form, and new-form creation requires a
          prism-support@exxat.com ticket. Shipping a validated KASA Summary Form as a Standard form
          type is the obvious product gap for this discipline.
      - element: "400-hour requirement progress, student-accessible, PDF export"
        type: "read-only rollup"
        data_shown: "The Clinical Clock Hours Report (Cumulative) explicitly tracks progress toward the 400-hour clinical requirement; the Clock Hours Report (By Student) is available to students as well as admins and exports to PDF, summarising hours by intervention/evaluation participation, observation vs. direct contact, age group, setting, and placement and attestation details"
        gates_on: ["Whether a graduating student can evidence the supervised-hours threshold for ASHA CCC-SLP certification"]
        accreditation_citation: "CAA Standard 3.0B, Standard 3.1B (the 400 supervised clinical practice hours); CAA Standard 4.0, Standard 4.7 (with 4.8) — 'per-student documentation demonstrating that the student has met ALL academic, clinical, and other requirements for the degree AND for the credential(s)', and 4.8's requirement to make that documentation available to the student, graduates, and non-completing attendees"
        competitor_equivalent: "Not evaluated at element level — no competitor source in content/competitors documents a credential-threshold progress report exposed directly to the learner."
        gap_severity: "configure-needed"
        gap_note: >
          The completion-verification half of SLP's stage 7, and the strongest single fit — the
          hours report is self-service to the student, which is literally what CAA 4.8 asks for. Two
          real gaps carried from caa-asha.yaml. (1) No single artifact combines coursework, hours
          and competency sign-off into one per-student credentialing dossier; a program assembles it
          from two or three reports. (2) Post-graduation access is unresolved — the CCC-SLP
          application is filed AFTER graduation, exactly when the student needs the hours
          verification, and nothing confirms a graduate or non-completing attendee retains access to
          their own Prism record. An alumni/verification export is the scoping ask.
      - element: "Min/max hour thresholds that red-flag under-logged students (support-configured)"
        type: "report filter"
        data_shown: "The Clinical Log Report supports configured min/max thresholds per participation-type x mode-of-delivery combination, flagging under-logged students in red. These thresholds are NOT self-service — programs must contact prism-support@exxat.com, the same dependency as new custom forms and notification rules."
        gates_on: ["Whether an incomplete-hours student is visible before the completion deadline"]
        accreditation_citation: "CAA Standard 4.0, Standard 4.3 (Policies and procedures for identifying students needing intervention in the academic and clinical components); CAA Standard 3.0B, Standard 3.1B (the hours threshold being measured against)"
        competitor_equivalent: "core-elms.yaml: CORE's module ships 'low-score alerts' and 'due-date reminders' self-service. Prism's SLP-side threshold flagging is functionally adjacent (an at-risk indicator on a completion metric rather than a score) but is support-gated where CORE's is not — the same self-service delta already noted on the Auto Notifications step."
        gap_severity: "gap"
        gap_note: >
          caep.yaml independently identifies this exact mechanism as 'the closest confirmed analogue'
          to a per-student threshold rollup anywhere in the product, while noting it is
          'support-configured only, single-source, and hours-based rather than a multi-instrument
          competency triangulation.' That is the right verdict for SLP too: the primitive exists and
          works, it is just neither self-service nor multi-instrument.
    action: "At the end of a placement sequence, the coordinator (or the student directly) generates the Student Performance Report filtered to the final performance evaluation form across all course offerings, and separately runs the Clinical Clock Hours Report (Cumulative) to verify progress against the 400-hour requirement before certifying completion."
    confirmed_by: "Help for Students/Discipline Specific Guides/SLP/Generate Student Performance Report in Exxat Prism - Students.md; Playbooks/Speech-Language Pathology (SLP) Playbook.md lines 41-49 (CAA/CFCC mapping and the 400-hour tracking), 88-100 (the configured-forms toolkit and the Student Performance Report's coverage of all nine service delivery areas with individual and aggregate scores plus personal-qualities and professional-practice-area scores), 100 and 133 (the Student Performance Report as student-audience and filterable by form/evaluation and status), 120-138 (the report suite and shared filter set); content/accreditation/caa-asha.yaml, elements 'Standard 5.0, Standard 5.2', 'Standard 4.0, Standard 4.7 (with 4.8)', 'Standard 3.0B, Standard 3.1B'"

  - screen: "Daily Clinical Forms/Evaluations Report, Student Activity Insights and NBCRNA Transcript Report (CRNA / nurse anesthesia)"
    navigation_path: "Dashboard or hamburger menu > Reports > Daily Clinical Forms and Evaluation Reports; Learning Activities > [course] > Reports > Student Activity Insights; NBCRNA Transcript Report"
    elements:
      - element: "Daily clinical case log form picker with student / rotation / course / status filters"
        type: "report filter"
        data_shown: "'From the From drop-down menu, select the daily clinical case log form that has already been set up for your program. Next, apply filters to refine your results. You can filter by student, rotation, course, and status.' The report exists because, over a three-year doctoral program, daily clinical evaluations accumulate in the thousands per cohort from both students and preceptors, and per-response reports cannot be read by a human."
        gates_on: []
        accreditation_citation: "COA Standard H.1.1 and H.1.1.1 (Evaluation Standards, H.1.1 CRITICAL) — 'a written systematic plan for continuous self-assessment incorporating formative and summative evaluations of EACH student'; the aggregation is the load-bearing requirement because an accreditor cannot read individual forms"
        competitor_equivalent: "e-value.yaml: E*Value serves nursing among its advanced-practice fields and ships configurable evaluation forms with 'mid-point-to-end-of-rotation summary evaluations' — a rollup of the same shape. No public E*Value or CORE source documents a discipline-specific report built for daily-evaluation VOLUME, which is the specific problem this report solves, so the comparison is directional only."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and explicitly built for CRNA: 'The Daily Clinical Evaluation Report is
          designed for nursing CRNA programs, where daily clinical evaluations play a critical role
          in assessing student performance during clinical practice' (CRNAVideosTranscripts.md line
          21). This is the clearest instance in the corpus of Exxat building a report for one
          discipline's structural problem rather than generalising — the direct precedent for the
          CAPTE Reports group being extended to other accreditors.
      - element: "Wrench icon — include student responses, preceptor responses, or both (side-by-side per question)"
        type: "toggle"
        data_shown: "'you will choose whether you want to include student responses, preceptor responses, or both. If your evaluation is configured for both, you have full control over what gets included' (line 27), and 'If both student and preceptor responses are included, the report displays them side by side for each question, making it easy to compare perspectives' (line 31)"
        gates_on: ["Whether the summative artifact shows self-assessment against supervisor assessment on the same item"]
        accreditation_citation: "COA Standard H.1.2 (Evaluation Standards, CRITICAL) — H.1.2.7 separately requires students to evaluate their own achievement, so dual-perspective capture on one instrument is what lets one artifact serve both H.1.1 and H.1.2; COA Standards D.1-D.50 (Graduate Standards, ALL 50 CRITICAL)"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a per-question side-by-side rendering of learner self-rating against supervisor rating in an aggregate export."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and native, not a workaround. Conceptually the same insight as PT's
          CIET parallel/blinded completion — capture both perspectives on the same item — but
          solved at the REPORT layer rather than the collection layer, which means CRNA gets the
          comparison without CIET's blinding guarantee. Worth naming the difference explicitly when
          reusing either pattern for the expansion domains.
      - element: "Download Report -> per-student PDF (ZIP for multi-select), shareable with clinical sites"
        type: "button"
        data_shown: "Export is asynchronous ('a message confirming that the export is being generated and that you will be notified once it is ready'); multi-student selection downloads as a ZIP of individual per-student PDFs. The transcript adds that 'these individual PDF reports can also be shared directly with clinical sites, giving preceptors and site coordinators visibility into student evaluation data.'"
        gates_on: ["Whether a portable per-student summative artifact exists outside the platform"]
        accreditation_citation: "COA Standard H.1.1 and H.1.1.1 — the standard's software requirement is a per-student artifact rather than a screen, which is exactly what the ZIP-of-PDFs produces"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a per-learner PDF bundle export of aggregated evaluation data."
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed shipped, and coa.yaml flags a caution that belongs on this element specifically:
          the documented practice of sharing these per-student PDFs directly with clinical sites is
          a FERPA-adjacent disclosure path and should be paired with Compliance Management's
          one-time-password protection before it is recommended. Rated configure-needed rather than
          none for that reason — the export is shipped, the disclosure discipline around it is not
          automatic.
      - element: "Student Activity Insights — green / amber / red against configured case minimums"
        type: "read-only rollup"
        data_shown: "'A green cell signifies that the student has met or exceeded the minimum requirement, showing 100% or more completion. A yellow or amber cell indicates that the student is approaching the minimum, typically completing around 80 to 99%... a red cell, representing 0% to below the minimum, means the student has not met the required threshold' (line 87). Filterable by rotation, program, clinical settings, site location, status and student; available to students themselves as well as admins."
        gates_on: ["Whether a CRNA student can be certified as having met COA's case minimums"]
        accreditation_citation: "COA Standard E.2.3 + Appendix (Curriculum Standards, E.2 CRITICAL) — 2,000 clinical hours plus roughly sixty individually numbered minimum case counts across eight families; COA Standard C.4 (Clinical Experience Logs, Faculty-Reviewed on a Regular Basis)"
        competitor_equivalent: "Not evaluated at element level — core-elms.yaml documents 'case logging and reflections' but publishes no per-category minimum-threshold traffic-light view; no other competitor teardown names an equivalent."
        gap_severity: "configure-needed"
        gap_note: >
          Shipped and demonstrably COA-shaped — the CRNA log layout already carries COA's own
          taxonomy families (patient physical status, patient assessment, special cases, anatomical
          categories, methods of anesthesia, arterial technique, central venous catheter, pulmonary
          artery catheter), so the work is loading the May 2025 Appendix as the threshold set rather
          than building a thresholds engine. Three limitations coa.yaml flags and this element
          inherits: no cohort-conditional thresholds (COA's daggered rows bind only students
          matriculating on/after Jan 1 2026, so one course offering must apply two threshold sets by
          matriculation year); no actual-vs-simulated flag on a logged encounter, though COA forbids
          satisfying certain rows by simulation alone; and multi-parent counting ('count all that
          apply') needs confirming rather than assuming. Log templates are also support-gated, so a
          COA edition change is not self-service.
      - element: "NBCRNA Transcript Report"
        type: "read-only rollup"
        data_shown: "Auto-generates a per-student transcript of logged case counts by NBCRNA-required category, displayed 'in accordance with NBCRNA guidelines' and formatted directly for national certification eligibility documentation"
        gates_on: ["The graduate's eligibility documentation for the National Certification Examination"]
        accreditation_citation: "COA Standard E.2.3 + Appendix (the case counts being transcribed); COA Standard C.4 (Clinical Experience Logs, Faculty-Reviewed on a Regular Basis)"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown in content/competitors names a credentialing-body-formatted transcript export for any discipline. capability-map.yaml describes it as 'direct curriculum-to-accreditor-framework mapping for advanced-practice nursing, not a generic hours log.'"
        gap_severity: "none"
        gap_note: >
          The single cleanest completion-verification artifact in stage 7 across all eight existing
          disciplines, and the pattern SLP explicitly lacks (caa-asha.yaml: 'No single artifact
          combines coursework, hours, and competency sign-off into one per-student credentialing
          dossier'). CRNA has exactly that artifact, formatted for the credentialing body. Worth
          carrying as the reference model when scoping the SLP alumni/verification export and any
          expansion-domain equivalent.
    action: "At course or program end the CRNA program administrator downloads the Daily Clinical Forms/Evaluations Report as per-student PDFs to evidence the formative record, reads Student Activity Insights to confirm each student has cleared COA's case minimums, and generates the NBCRNA Transcript Report as the certification-eligibility artifact."
    confirmed_by: "/Users/romitsoley/Downloads/CRNAVideosTranscripts.md lines 19-37 (Daily Clinical Evaluation Report), lines 75-87 (log review, Student Activity Insights colour semantics); Playbooks/Nursing Playbook.md, sections 'Learning Activities: Timesheets & Patient/CCE Log', 'Competency Management', and 'Evaluations & Forms'; capability-map.yaml, 'Nursing advanced-practice accreditor reports (NBCRNA, AACN Essentials)'; content/accreditation/coa.yaml, elements 'Standard H.1.1 and H.1.1.1', 'Standard E.2.3 + Appendix', 'Standard C.4', 'Standard H.1.2'"

  - screen: "Social Work Learning Contract / field evaluation configuration and competency readout"
    navigation_path: "Learning Activities > [field course offering] > Setup > Forms/Evaluations; competency readout at Competency Management > Review > View Report; hours at Learning Activities > Reports > Hours by Category"
    elements:
      - element: "Learning Contract / Evaluation configuration model (combined, separate, or four-way split)"
        type: "toggle"
        data_shown: >
          Three documented models, chosen per program (Playbooks/Social Work (SW) Playbook.md lines
          69-73): a combined Learning Contract + Evaluation in a single form; separate Learning
          Contract and Evaluation forms; or split forms — mid-term, final, Field Instructor rating,
          and student rating — completed independently. The playbook's own terminology entry (line 28)
          establishes why this is one object rather than two: 'Learning Contract (or Learning
          Agreement) = Learning Activity/Evaluation form — SW's discipline-specific term for the
          goals/activities document tied to competencies.' The combined model is explicitly paired
          with the combined-course setup option, 'useful when combining a Learning Contract &
          Evaluation across terms' (line 65), so the form model and the course-container model are
          one decision made twice. Exxat's CSWE
          guide confirms the placement of instruments at 'midterm and final field evaluations' plus
          course-based assessments, assignable to faculty, agency personnel, or set as
          self-evaluation.
        gates_on: ["Whether the summative field evaluation is one record or four independent ones", "Which role's rating is separable for reporting"]
        accreditation_citation: "CSWE Accreditation Standard 5.0, AS 5.0.1(a) — the standard requires at least TWO instruments assessing EACH of the nine competencies, at least one based in real or simulated demonstration in field education, and requires the program to state 'how each instrument is implemented' and 'by whom'; the four-way split is how a program produces two separable field-based instruments from one placement"
        competitor_equivalent: "core-elms.yaml: CORE ELMS serves social work explicitly and ships 'student self-evaluations, preceptor assessments of students, and student evaluations of preceptors/sites — all with customizable forms,' rated 'ahead' on that pillar. That is the same instrument mix; CORE's public material does not describe a combined-vs-split Learning Contract model, which is the SW-specific structure here."
        gap_severity: "configure-needed"
        gap_note: >
          Genuinely distinctive rather than a baseline variant: in Social Work the SUMMATIVE
          instrument and the goal-setting document are the same object (the Learning Contract), so
          the configuration decision made at implementation determines whether AS 5.0.1(a)'s
          two-instruments-per-competency test is satisfiable at all. cswe.yaml rates 5.0.1(a)
          'Transfer' — the strongest fit in that file — but carries the structural caution that
          Competency Tracking maps experiential assessment questions at the child-most standard
          level only, so the nine competencies must be configured WITH behavior-level children
          before field season or there is nowhere to attach questions.
      - element: "Multiple-supervisor placements — who signs the final evaluation"
        type: "input field"
        data_shown: "The Placement Record supports assigning multiple supervisors for alternative field instruction: an on-site Task Supervisor who may not hold the required SW degree, alongside an off-site qualified Field Instructor. Placement tags can flag these arrangements. For hours, the student chooses Field Instructor OR Task Supervisor as their reviewer, with Program Admin also able to review/approve."
        gates_on: ["Which supervisor's signature counts as the qualified evaluation of student competence"]
        accreditation_citation: "CSWE Accreditation Standard 5.0, AS 5.0.1(a) — 'Student competence must be assessed by program faculty or field personnel'; CSWE Accreditation Standard 3.3, AS B3.3.6 / M3.3.6 (Field Instructor Qualification — degree from a CSWE-accredited program plus two years' post-degree practice)"
        competitor_equivalent: "Not evaluated at element level — no competitor teardown documents a dual-supervisor placement record distinguishing a qualified off-site evaluator from an on-site supervisor."
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed shipped for the hours-review case (the student picks their reviewer) and for the
          placement record itself. What is NOT confirmed anywhere in the sourced material is whether
          the summative field EVALUATION can be routed specifically to the degree-qualified Field
          Instructor while the Task Supervisor is excluded from it — which is precisely the
          distinction B3.3.6/M3.3.6 exists to enforce. Flagged as an open question against this
          element rather than asserted either way.
      - element: "Comprehensive Report for Placement Based Form — de-identified sample Learning Agreements"
        type: "report filter"
        data_shown: "Named by Exxat's CSWE guide as the export used to produce and de-identify sample completed Learning Agreements for CSWE self-study submission; groups by student/site/rotation and pulls detailed per-form responses"
        gates_on: []
        accreditation_citation: "CSWE Accreditation Standard 3.3, AS 3.3.1 (with M3.3.2) — Field Education competency opportunities across all five system levels; CSWE Accreditation Standard 5.0, AS 5.0.1(a) requirement 6, 'copies of all instruments used to assess the nine social work competencies, including assignment descriptions, scoring rubrics'"
        competitor_equivalent: "Not evaluated at element level — no competitor source documents a de-identifiable completed-instrument export produced for accreditor submission."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and specifically named against the standard by Exxat's own SW
          accreditation guide, which makes it one of the few instances outside PT where a report is
          tied to an accreditor requirement by name rather than by inference. The de-identification
          step is manual.
      - element: "Hours by Category report with automatic break deduction against 400 / 900"
        type: "read-only rollup"
        data_shown: "Timesheet logs in-person and virtual hours by customizable Category (individual, group, seminar tracked separately); break and time-off hours entered are AUTOMATICALLY deducted from logged totals, aligning with CSWE's rule that breaks and time off do not count toward field hours. Hours by Category (Learning Activities > Reports) tracks accrual across all of a student's experiences; Student Overview shows cumulative logged hours."
        gates_on: ["Whether a BSW/MSW student can be certified as having completed the field-hours minimum"]
        accreditation_citation: "CSWE Accreditation Standard 3.3, AS 3.3.3 (Minimum Field Education Hours — 400 BSW / 900 MSW)"
        competitor_equivalent: "core-elms.yaml: CORE ELMS ships 'timesheet/hours tracking with optional GPS, absence tracking' for a discipline list including social work — the same hours-plus-absence primitive, and arguably ahead on the GPS verification dimension. No public CORE source describes automatic deduction of break hours from the accrued total, which is the CSWE-specific rule Prism encodes."
        gap_severity: "none"
        gap_note: >
          The automatic break deduction is a genuinely accreditor-aware behavior rather than a
          generic timesheet, and it is the completion-verification half of SW's stage 7. Same
          structural limitation as ACOTE C.1.12 and CAPTE 6A though: the rollup is a report an admin
          reads, not a rule the system enforces — nothing blocks certification of a student below
          400/900 hours.
    action: "The program configures the Learning Contract/Evaluation split at implementation, the Field Instructor and student complete their respective mid-term and final ratings, and the coordinator reads competency achievement out of Competency Management > Review > View Report while verifying accrued field hours against the 400/900 minimum in Hours by Category."
    confirmed_by: "Help for Program Administrators/Discipline Specific Guides/Social Work (SW)/Social Work Accreditation Standards.md (AS 5.0.1(a) section, incl. 'Midterm and final field evaluations' and 'Competency Management > Review > View Report'); Playbooks/Social Work (SW) Playbook.md — read in full 2026-08-25; line 28 (Learning Contract = Learning Activity/Evaluation form), lines 63-67 (the three course-setup models, incl. the combined course 'useful when combining a Learning Contract & Evaluation across terms'), lines 69-73 (the three Learning Contract / Evaluation configuration models), lines 133-137 (Personnel Profile, the Experiential Supervisor Intake Form, Placement Clearance FI/Task Supervisor verification, and alternative field instruction with two supervisors), lines 139-145 (Field Hours: the Timesheet field set incl. activity description and in-person/virtual hours, break auto-deduction, the FI-or-Task-Supervisor reviewer choice, Hours by Category, Students > Overview), lines 155-172 (the CSWE EPAS mapping, incl. line 164 naming Post-Placement Surveys and the Agencies > Interventions & Communications reports as AS 3.3.4 evidence and line 169 rating AS 5.0.1(a) an area of STRONG Exxat support), line 198 (curriculum mapping must be configured before field placement season because Learning Contracts/Evaluations depend on it for competency reporting); content/accreditation/cswe.yaml, elements 'Accreditation Standard 5.0, AS 5.0.1(a)', 'AS 5.0.1(b)', 'Accreditation Standard 3.3, AS 3.3.3', 'AS B3.3.6 / M3.3.6'"

