        gates_on: ["Whether the record carries an explicit end-of-experience verdict distinct from the midterm's"]
        accreditation_citation: "CAPTE Standard 2, Element 2D4 — the element asks for positive evidence that each student demonstrated entry-level clinical performance BY THE END OF THEIR LAST clinical education experience, and this is the named field carrying that end-of-experience judgment"
        competitor_equivalent: "e-value.yaml: E*Value ships 'mid-point-to-end-of-rotation summary evaluations' — the closest documented equivalent in shape, but its product page describes the rollup, not a named summative section that exists only on the final instance, so the comparison holds at workflow level and not at field level."
        gap_severity: "none"
        gap_note: >
          Confirmed shipped and the clearest named 'summative' field anywhere in the eight existing
          disciplines — it is literally labelled a Summative Section in the CI-facing help guide.
          Directly relevant to the four expansion domains: the pattern of a final-only section
          appended to an otherwise-identical midterm/final instrument is a cheaper way to satisfy an
          end-of-experience verdict requirement than building a separate terminal instrument.
      - element: "Optional supplemental skills 35/36/37, defaulting to N/A"
        type: "toggle"
        data_shown: "Programs (or the CI, if the student did not add them) can toggle Yes to add up to three supplemental skill questions at midterm or final; ratings on added skills default to N/A until explicitly changed"
        gates_on: []
        accreditation_citation: "CAPTE Standard 6, Element 6E (Comprehensive Course Syllabi — where program-specific clinical objectives beyond the standard instrument would be declared)"
        competitor_equivalent: "Not evaluated at element level — the PT playbook records 'programs want to customize standard forms/evals (CI Details, CIET, etc.)' as an open pain point, and no competitor source documents a bounded extension slot on an otherwise non-editable standard instrument."
