          Third consent surface in the product (after the day-one privacy/ToU
          gate and the separate per-program AI Legal Consent flow that gates Map
          with Leo, per capability-map.yaml). Nothing links them; an admin
          auditing 'what have we agreed to' has to know all three exist.
      - element: "Logged-in Devices"
        type: "session list with revoke actions"
        data_shown: "Device type (Desktop/Mobile/Unknown), browser name, last-active timestamp; log out an individual device or all other devices"
        gates_on: []
        accreditation_citation: "none directly — no element in coca.yaml, lcme.yaml, acpe.yaml or coda.yaml requires session management."
        competitor_equivalent: "axiUm is the only competitor whose public materials claim adjacent controls — 'role-based access, audit trails, and encryption—help schools meet HIPAA, FERPA and CODA requirements' (axium.yaml) — but an audit trail of record access is a different object from a self-service device-session list, so this is adjacency, not equivalence. No competitor file documents a device-session panel."
        gap_severity: "none"
        gap_note: ""
      - element: "Login History"
        type: "read-only log"
        data_shown: "Device used, date/time of login, unfamiliar devices flagged; article directs the user to email prism-support@exxat.com on an unrecognized login"
        gates_on: []
        accreditation_citation: "none directly; see the Logged-in Devices note above."
        competitor_equivalent: "Same as Logged-in Devices — axiUm's 'audit trails' claim (axium.yaml) is the nearest public analog and is about clinical-record access governance, not user login history; not element-comparable."
        gap_severity: "cosmetic"
        gap_note: "Documentation notes times may display in IST or local timezone — a small but real ambiguity in a security log."
      - element: "Trust Portal"
        type: "gated document library (Program and Institution Administrators only)"
        data_shown: "Security areas (Product Security, Responsible AI, Data Protection, Compliance, Risk Management, Data Privacy); certifications SOC 2 Type II, ISO 27001, ISO 42001, HIPAA, TX-RAMP Level 2; downloadable SOC 2, ISO, HIPAA, VAPT and HECVAT documents"
        gates_on: ["institutional vendor/security review during procurement and annual re-review"]
        accreditation_citation: "none — no element in coca.yaml, lcme.yaml, acpe.yaml or coda.yaml imposes a vendor-security requirement; this is an institutional procurement/IT-governance artifact, not an accreditor one, and should be described that way rather than borrowed into an accreditation story."
        competitor_equivalent: "MedHub is the only competitor with comparable public claims — 'FERPA compliance, SOC 2 compliance, 128-bit STRONG Encryption SSL, Multifactor authentication, 99.95% uptime' (medhub.yaml, sourced to medhub.com/software/) — but those are marketing-page assertions, not a self-service portal delivering the underlying SOC 2/ISO/HECVAT artifacts to the customer. Prism is ahead on delivery mechanism and on breadth (ISO 42001 for AI management systems and TX-RAMP Level 2 have no competitor analog in this research); MedHub is at parity on the claim itself."
        gap_severity: "none"
        gap_note: >
          Strongest under-used element in the stage for the four expansion
          domains: DO/Pharmacy/Dentistry/Medicine programs sit inside larger
          academic health centers with formal HECVAT-driven vendor review, and
          this portal answers that review self-service. It is currently buried in
          a personal-preferences dropdown alongside Light/Dark Mode.
      - element: "Earn Your Exxat Certification link"
        type: "outbound link on the profile card"
        data_shown: "Named quick-link next to the user's name and email"
        gates_on: []
        accreditation_citation: "none — this is a Prism user-proficiency certification, NOT a programmatic accreditation artifact; do not conflate."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "A day-one-relevant training on-ramp sitting in a settings menu rather than in the Resource Center where a new admin is told to look for training."
      - element: "Logout"
        type: "button"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Read-only accreditation site-visit account (support-provisioned; no admin-facing screen exists)"
    navigation_path: "n/a — not self-service; requested from Exxat support / the Account Manager"
    action: >
      When a site visit approaches, the program requests a purpose-built
      read-only account for the visiting accreditation team rather than sharing
      an admin login. Included in this stage because it is an account-
      provisioning decision, not a reporting one — it belongs to whoever owns
      account activation, which is the persona of this stage.
    confirmed_by: >
      NOT covered by any tutorial transcript. Source is
      content/prism/capability-map.yaml, "Read-only accreditation site-visit accounts": "Exxat support can provision a dedicated read-only account specifically for accreditation site visitors on request — a purpose-built account type rather than repurposing a standard admin login." Cross-checked against the named program-level role catalog in the same file, which includes a "Read-Only Program Administrator" role.
    elements:
      - element: "Read-only site-visit account type"
        type: "account/role provisioning (support-gated)"
        data_shown: "Purpose-built read-only access for external accreditation visitors"
        gates_on: ["what an accreditation site-visit team can see directly in the product"]
        accreditation_citation: >
          CODA Standard 1, Element 1-2 and COCA Standard 11, Element 11.9 —
          citing the precedent already established in
          competency-verification--08-close-the-loop-external-validation-against.yaml
          and coda.yaml (whose Element 1-2 entry describes the self-study report
          "CODA reviews before every site visit" and the "one-time manual
          compilation before a site visit" it currently requires). The tie here
          is narrow and should be stated narrowly: this element governs site-visit
          ACCESS, not the evidence those standards actually require, which
          remains a Gap pending the Accreditation Management pillar (roadmap
          Q3 2027 per capability-map.yaml).
        competitor_equivalent: "New Innovations is the closest documented analog — new-innovations.yaml names Annual Program Evaluation with citation/concern tracking plus CLER visit management, i.e. explicit site-visit tooling — but that is visit workflow, not a visitor account type. axiUm's RBAC-for-CODA framing (axium.yaml) is about internal user visibility, not external reviewer access. No competitor teardown in this research documents a purpose-built external-reviewer account, so on this specific element there is no comparator."
        gap_severity: "configure-needed"
        gap_note: >
          The capability exists and is genuinely thoughtful (a distinct account
          type rather than a shared admin login), but it is invisible: it appears
          in no transcript, no Getting Started guide, and no self-service screen.
          A program discovers it only if their Account Manager mentions it, which
          means the default behaviour under site-visit time pressure is the
          insecure one — sharing an admin credential. Making this a documented,
          self-service provisioning action is a small change with a
          disproportionate trust payoff in the DO/Dentistry/Medicine sales cycle.

