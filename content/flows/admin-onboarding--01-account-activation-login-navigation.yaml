# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 1
# ("Account activation, login & navigation"). See _TEMPLATE.yaml for field meanings.
#
# SOURCING NOTE (deliberate, and the reason this file exists in this form):
# the PRIMARY source for this stage is the raw tutorial transcript at
# exxat_transcripts.md — specifically "1/16
# Administrator Navigation in Exxat Prism" (lines 5-71), "16/16 (Part 1) How to
# use Ask Leo" (lines 1683-1699), and "16/16 (Part 2) Using the Resource Center"
# (lines 1701-1719). Earlier work in this repo laundered transcript content
# through help-center paraphrases and lost the direct citation; every
# confirmed_by below cites the transcript FILE AND LINE NUMBERS wherever the
# transcript covers the step, and falls back to the help-center mirror only for
# material the transcript genuinely does not cover (2FA, User Settings panel,
# Trust Portal, the SSO provisioning boundary).
#
# SCOPE NOTE: Tutorial 1/16 is a single 60-minute video that walks the entire
# Program Details tree (school profile, accreditation record, grading schemes,
# clinical settings, standards, Notification Hub, User Roles, Program 360,
# program calendar). Only the account-activation / login / chrome-and-navigation
# portions of it belong to stage 1; the Program Details subtrees it covers are
# stages 2+ of this journey and are deliberately NOT modeled here. In
# particular, Program Details > Setup > Accreditation is already modeled at
# element level in competency-verification--08-close-the-loop-external-
# validation-against.yaml (COCA 11.9 / CODA 1-2), and that citation is NOT
# re-derived here — the only accreditation-relevant element in THIS stage is the
# read-only site-visit account type, which is an account-provisioning element.

flow_name: "Day One — Activation, Login & Finding Your Way Around"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 1"
persona: >
  Primary: Program Administrator brand new to the platform
  (../personas/role-program-admin.yaml) — has been named by their school as the
  person who will own Prism, has an invitation email (or, on SSO, is waiting to
  be told their account is live), and has not yet seen the product. Secondary:
  Exxat Support / the assigned Account Manager, who is a mandatory participant
  in this stage rather than an optional escalation — SSO account activation,
  SSO configuration itself, custom-role creation, and read-only site-visit
  accounts are all support-provisioned, not admin-self-service. Tertiary: the
  Compliance / Accreditation Liaison (../personas/role-compliance-accreditation-
  liaison.yaml), who inherits the Trust Portal and the site-visit account type.

steps:
  - screen: "Exxat Prism invitation email (arrives in inbox, outside the product)"
    navigation_path: "n/a — email client; the account does not exist in a usable state until this link is clicked"
    action: >
      New admin receives an email invitation from the Exxat Prism support team,
      reads the username their school assigned, and clicks the activation link.
      This is the only entry point for a standard (non-SSO) account — there is
      no self-registration path documented anywhere in the source material.
    confirmed_by: >
      exxat_transcripts.md line 9 ("1/16
      Administrator Navigation"): "You will receive an email invitation from the
      EXAT Prism support team. The invitation includes a link to activate your
      account. The email invite also includes the username for your account set
      up by your school. Simply click the link in the invite to activate your
      account." Corroborated by PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Getting Started for Admin (includes User Guides)/School Administrator User Guide.md ("Logging In and Dashboard": "If you are not using Single Sign On, you will receive an invitation to set up your account.")
    elements:
      - element: "Activation link in the invitation email"
        type: "one-time link (email body)"
        data_shown: "Single hyperlink; the transcript states no expiry window, no resend control, and no admin-visible invitation status"
        gates_on: ["password setup", "first login", "every downstream setup stage in this journey"]
        accreditation_citation: "none — this is a platform-mechanics element with no direct accreditor tie in coca.yaml, lcme.yaml, acpe.yaml or coda.yaml."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. The nine files in content/competitors/ document clinical/placement/accreditation feature depth; none describes an invitation-email or account-activation mechanic. The nearest adjacent data point is one45.yaml's own note that its public materials leave capabilities 'unable to verify whether this exists behind login' — i.e. competitor activation flows are not publicly observable at all."
        gap_severity: "configure-needed"
        gap_note: >
          The single highest-frequency day-one failure mode (invite filtered to
          spam, link already used, wrong username) has no self-service remedy on
          this screen and no Prism-specific troubleshooting content behind it:
          the help center's own Troubleshooting Guide.md has a section literally
          titled "Login/Logout Issues" whose entire content is how to sign in and
          out of Windows and macOS, not Exxat Prism. Separately, Whitelist
          Communications from Exxat PRISM.md exists and names the three sending
          IPs plus notifications@exxat.com — but it is written for the admin to
          forward to CLINICAL SITES, not for the admin's own IT department to
          pre-whitelist before the admin's own invitation is sent. Ordering
          problem: the deliverability fix is documented downstream of the first
          email that can fail.
      - element: "Username (assigned by the school, printed in the invite)"
        type: "read-only value delivered by email"
        data_shown: "The account username set by the school, not chosen by the user"
        gates_on: ["standard login"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; no competitor file describes username issuance."
        gap_severity: "none"
        gap_note: "Behaves as documented. Worth noting only that the username is school-assigned and not editable by the admin, so it becomes a support ticket if wrong."
      - element: "SSO accounts: no invitation email at all"
        type: "absence of an element (support-provisioned instead)"
        data_shown: "Nothing — the admin is notified out-of-band by support that the account is ready"
        gates_on: ["SSO first login"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "MedHub is the only competitor in this research whose public materials name the authentication stack at all — 'SAML/Shibboleth SSO' and 'multifactor authentication' (medhub.yaml, Compliance Management pillar, sourced to medhub.com/software/). MedHub's pages name the protocols, not the provisioning handoff, so the comparison holds at protocol level and stops there. CORE ELMS is explicitly weaker: core-elms.yaml records that 'only generic SSO/LTI standards support is described' with no named integration partners."
        gap_severity: "configure-needed"
        gap_note: >
          Asymmetric onboarding: the transcript tells SSO admins only that
          "support will let you know when you are ready to access your account"
          (line 13), and the School Administrator User Guide confirms "If you are
          using Single Sign On, our support team will activate both school and
          student accounts on your behalf." SSO configuration itself is on
          capability-map.yaml's explicit list of support-gated (non-self-service)
          configuration. So the SSO day-one path has no admin-visible status,
          no admin-triggerable action, and no ETA surface — it is a wait-for-email
          relationship with Exxat, which is a real friction point to name when
          selling into IT-governed MD/DO/Pharmacy/Dentistry institutions where SSO
          is mandatory rather than optional.

  - screen: "Set your password (standard/non-SSO accounts only)"
    navigation_path: "Invitation email > activation link > password setup screen"
    action: >
      Admin sets a first password against five stated complexity rules and clicks
      Submit; the system confirms the password was set successfully.
    confirmed_by: >
      exxat_transcripts.md line 11 ("1/16
      Administrator Navigation"): "For standard accounts, you'll be prompted to
      set up a new password following a few guidelines. Your password must be a
      minimum of eight characters with at least one uppercase character, one
      lowercase character, one numerical character, and one non-alphanumeric
      character... Once you've set up your password, click Submit. The system
      will notify you after your password is successfully set up." The identical
      five rules are restated in PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Getting Started for Admin (includes User Guides)/Using User Settings- Administrators.md ("Password Guidelines").
    elements:
      - element: "Password field + complexity rules"
        type: "input field with client-side validation"
        data_shown: "Min 8 chars; >=1 uppercase [A-Z]; >=1 lowercase [a-z]; >=1 base-10 digit [0-9]; >=1 non-alphanumeric"
        gates_on: ["first login"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file records a password policy. MedHub's page-level security claims (medhub.yaml: '128-bit STRONG Encryption SSL, Multifactor authentication, FERPA compliance, SOC 2 compliance') are marketing-page assertions about the stack, not a comparable field-level password rule set."
        gap_severity: "none"
        gap_note: "Standard, unremarkable policy, consistently documented in both the transcript and the User Settings guide. No institutional override (e.g. a school-set rotation interval or length floor) is documented anywhere in the source material."
      - element: "Submit button"
        type: "button"
        data_shown: "Success notification on completion"
        gates_on: ["first login"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "login.exxat.com — standard login"
    navigation_path: "login.exxat.com"
    action: >
      Admin enters the school-assigned username and the password they just set,
      and clicks LOGIN.
    confirmed_by: >
      exxat_transcripts.md line 11: "Go to
      login.exat.com and log in to EXAT Prism using your login credentials you
      just set up." (Transcript renders the domain phonetically as
      'login.exat.com'; the product is Exxat Prism.) Login-screen sequence
      corroborated by PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Getting Started for Admin (includes User Guides)/Two-Factor Authentication (2FA) for Exxat Prism Non-SSO Admin Users.md ("Login Using 2FA", steps 1-2).
    elements:
      - element: "Username field"
        type: "input field"
        data_shown: "School-assigned username (not an email address, per the invite element above)"
        gates_on: ["session"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Note the asymmetry with the SSO path on the same page, which takes an email address rather than a username — two different identifier types on one entry point."
      - element: "Password field"
        type: "input field (masked)"
        gates_on: ["session"]
        data_shown: ""
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "LOGIN button"
        type: "button"
        data_shown: "Advances to the 2FA prompt (non-SSO) or, on first login, to the privacy-policy acceptance gate"
        gates_on: ["2FA setup/challenge", "privacy policy acceptance"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "login.exxat.com — single sign-on"
    navigation_path: "login.exxat.com > [school email] > school IdP login page > redirect back to Exxat"
    action: >
      Admin enters their school email address, is redirected to their school's
      own login page, authenticates there, and is redirected back into Prism.
    confirmed_by: >
      exxat_transcripts.md line 13: "Single sign-on
      is a user authentication method that allows users to log in to multiple
      applications and websites using one set of credentials. Accounts using SSO
      verification verify your identity outside of the EXAT system... For single
      sign-on accounts, support will let you know when you are ready to access
      your account. Go to login.exat.com and enter your school's email address.
      You will then be taken to your school's login page. Log in to your school
      portal, and you will be redirected to the EXAT site." Cross-discipline
      corroboration that SSO is the assumed default in practice:
      OTOTAVideosTranscripts.md line 75 ("log into
      Exxat using your university credentials") and
      PAVideosTranscripts.md line 23 ("Log in to
      Exxat Prism using your university credentials").
    elements:
      - element: "School email address field (IdP discovery)"
        type: "input field, email-domain routed"
        data_shown: "Routes to the institution's own login page based on the email domain"
        gates_on: ["session", "skips the 2FA setup path entirely"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "MedHub explicitly names 'SAML/Shibboleth SSO' plus multifactor authentication on its software page (medhub.yaml, Compliance Management pillar) — the only element-level-nameable authentication claim among the nine competitor teardowns, and the one place a head-to-head on protocol support is fair. CORE ELMS describes 'only generic SSO/LTI standards support' with no named partners (core-elms.yaml). Prism's own transcript never names a protocol (SAML, Shibboleth, OIDC) at all, so Prism is currently BEHIND MedHub on public specificity here even if the underlying implementation is equivalent."
        gap_severity: "configure-needed"
        gap_note: >
          Two distinct issues. (1) Public specificity: no protocol is named in
          any transcript or help article inspected, which is a procurement
          liability in exactly the IT-governed institutions the four expansion
          domains (DO, Pharmacy, Dentistry, Medicine) live in. (2) Self-service:
          capability-map.yaml lists 'SSO configuration' on its confirmed
          support-gated configuration boundary — the admin cannot set up,
          re-point, or test SSO themselves.
      - element: "Redirect back to Exxat after IdP authentication"
        type: "system redirect"
        data_shown: "Lands on the privacy-policy acceptance gate on first login"
        gates_on: ["privacy policy acceptance"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Setup Two Factor Authentication (mandatory, non-SSO users only)"
    navigation_path: "login.exxat.com > LOGIN > Setup Two Factor Authentication"
    action: >
      On first login, a non-SSO admin must register either a phone number or
      their institutional email as a second factor, verify a 6-digit code, and
      only then reaches the dashboard. Mandatory since July 2025 with a 90-day
      grace window, after which setup is required to keep using Prism.
    confirmed_by: >
      NOT covered by the tutorial transcript — the "1/16 Administrator
      Navigation" video predates this rollout and describes a login flow with no
      second factor, which is itself worth knowing (the canonical onboarding
      video is out of date on the very first screen a new non-SSO admin sees).
      Source is PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Getting Started for Admin (includes User Guides)/Two-Factor Authentication (2FA) for Exxat Prism Non-SSO Admin Users.md, corroborated by content/prism/capability-map.yaml (exxat_advantage_layer, Trust Portal item: "mandatory Two-Factor Authentication rollout for all non-SSO users (students, faculty, admins) effective July 2025 with a 90-day setup grace window before lockout").
    elements:
      - element: "Setup with Phone Number (recommended path)"
        type: "button + phone input + Verify Phone Number"
        data_shown: "6-digit code delivered by SMS"
        gates_on: ["dashboard access after the 90-day grace window"]
        accreditation_citation: "none directly — no element in coca.yaml, lcme.yaml, acpe.yaml or coda.yaml names an authentication control. Adjacent but not equivalent: COCA Standard 11, Element 11.2 requires documented proof of CONFIDENTIALITY for student evaluations of instruction, which is an evidence-handling requirement, not an account-security one; citing 2FA against it would be a stretch."
        competitor_equivalent: "MedHub names 'Multifactor authentication' on its software page (medhub.yaml) — at-parity as a claim, but MedHub's public materials do not say whether it is mandatory, what factors are supported, or whether there is a device-remember window, so the comparison stops at 'both have MFA.' No other competitor teardown in this research mentions MFA at all."
        gap_severity: "none"
        gap_note: "Shipped and enforced. Prism is arguably ahead of the documented field here on mandatoriness, but that fact is not in the onboarding video, so a new admin meets it as a surprise."
      - element: "Setup Another Way (email OTP fallback)"
        type: "link > auto-filled registered email + Send Code"
        data_shown: "Registered institutional email is pre-filled and not editable on this screen; 6-digit code by email"
        gates_on: ["dashboard access after the 90-day grace window"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          The article warns that "2FA codes are sent only to your registered
          institutional email ID. Make sure it's up to date in your user profile"
          — but a brand-new admin on their very first login has not yet seen
          their profile and cannot verify or change that address before it
          becomes their second factor. Circular dependency on day one.
      - element: "Remember this device for 30 days"
        type: "checkbox on the OTP challenge"
        data_shown: "Skips OTP prompts for 30 days on that specific browser only"
        gates_on: []
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Per-browser, not per-user — an admin who works from a lab machine and a laptop re-enrols each one."
      - element: "Change Phone Number (post-setup, via User Settings)"
        type: "flow initiated from User Settings; secure emailed link"
        data_shown: "Logs the user out of ALL devices, then emails a secure link to re-enrol a phone"
        gates_on: ["all active sessions"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Correctly conservative security design, but a destructive-feeling side effect (global logout) for what reads like a profile edit; worth a clearer warning in-flow."

  - screen: "Privacy Policy & Terms of Use acceptance gate (first login, both auth paths)"
    navigation_path: "login.exxat.com > [authenticate] > acceptance gate"
    action: >
      Admin optionally opens the linked privacy policy and terms of use, then
      accepts. Acceptance is a hard gate — the transcript states the login does
      not complete until it is given, on both the standard and SSO paths.
    confirmed_by: >
      exxat_transcripts.md line 13 (standard path):
      "Click on the links to view and read EXAT's privacy policy and terms of
      use. Accept EXAT's privacy policy. Once you accept, you will log into your
      account." and line 15 (SSO path): "Accept EXAT's privacy policy and terms
      of use. Click on the links to view the full details. Once you accept, you
      will log into your account."
    elements:
      - element: "Privacy policy / Terms of Use links"
        type: "outbound links"
        data_shown: "Full policy text"
        gates_on: []
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Accept button"
        type: "button (hard gate)"
        data_shown: "No 'decline' path is described; the account is unusable until accepted"
        gates_on: ["all product access"]
        accreditation_citation: "none — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Note the relationship to Consent Detail in User Settings (below) and
          to the separate AI Legal Consent flow that gates Map with Leo per
          capability-map.yaml — Prism has at least three distinct consent
          surfaces, and only this one is encountered on day one.

  - screen: "Dashboard (central hub, post-login landing)"
    navigation_path: "login > Dashboard"
    action: >
      Admin lands on the dashboard and uses its link tiles to reach the three
      documented section groups. This is the primary orientation surface of the
      product and the one the rest of the tutorial library assumes you start from.
    confirmed_by: >
      exxat_transcripts.md lines 15-17 ("1/16
      Administrator Navigation"): "The dashboard is your central hub, presenting
      all the available options tailored to your needs. Use the links on the
      dashboard to access different sections of the EXAT system. These sections
      are broken into subsections of program, curriculum management, and
      placement management... You can also access these options anytime through
      the hamburger menu at the top of the page. We support custom roles based on
      your program's needs. If you are assigned a custom role, you might have
      limited access to these sections. Use the dashboard icon at the top of the
      webpage to navigate back to the dashboard at any time."
    elements:
      - element: "Program section links"
        type: "navigation tiles/links"
        data_shown: "Per the transcript: program information, students, faculty, and their compliance"
        gates_on: ["stages 2-4 of this journey (program details, users/roles, students & faculty setup)"]
        accreditation_citation: "none — this is a navigation element; the accreditation-bearing screens it leads to (Program Details > Setup > Accreditation, COCA 11.9 / CODA 1-2) are modeled in competency-verification--08-close-the-loop-external-validation-against.yaml and belong to a later stage of this journey, not here."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes a dashboard's information architecture. The only adjacent evidence is negative: one45.yaml records a reviewer complaint of an outdated interface, and emedley.yaml records a reviewer calling the UI 'clunky' relative to modern tools, but neither is anchored to a specific navigation element."
        gap_severity: "none"
        gap_note: ""
      - element: "Curriculum / Course Management section links"
        type: "navigation tiles/links"
        data_shown: "Courses and curriculum of the program"
        gates_on: ["curriculum setup stages of this journey"]
        accreditation_citation: "none — navigation element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Placement Management section links"
        type: "navigation tiles/links"
        data_shown: "Experiential education management"
        gates_on: ["placement setup stages of this journey"]
        accreditation_citation: "none — navigation element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Dashboard icon (top bar, 'return home')"
        type: "persistent navigation button"
        data_shown: "Returns to the dashboard from anywhere"
        gates_on: []
        accreditation_citation: "none — navigation element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Custom-role visibility limiting (what a new admin can actually see here)"
        type: "role-based access control affecting which sections render"
        data_shown: "The transcript's own caveat: 'If you are assigned a custom role, you might have limited access to these sections' — but no in-product indication of WHICH sections were withheld or WHY"
        gates_on: ["everything downstream in this journey"]
        accreditation_citation: "none directly. axiUm markets RBAC as a HIPAA/FERPA/CODA compliance control (axium.yaml: 'role-based access control limiting user visibility', 'built-in security features—such as role-based access, audit trails, and encryption—help schools meet HIPAA, FERPA and CODA requirements'), but no element in coda.yaml itself imposes an access-control requirement, so that framing is axiUm's marketing, not a CODA element this repo has verified."
        competitor_equivalent: "axiUm is the one competitor with a comparable, publicly stated RBAC claim (axium.yaml, tied to HIPAA/PIPEDA/FERPA/CODA). Prism's own position is stronger on catalog breadth per capability-map.yaml — a named out-of-the-box role catalog at both program level (Super Program Administrator, Curriculum Administrator, Faculty Compliance Administrator, Site & Contract Coordinator (Limited), Read-Only Program Administrator, etc.) and tenant level — but the two are documented at different altitudes (axiUm: security posture; Prism: role names), so this is not a clean element-for-element comparison."
        gap_severity: "gap"
        gap_note: >
          The day-one orientation problem this stage exists to surface: a new
          admin cannot tell whether a missing dashboard section means 'your
          program does not use this' or 'your role does not permit this' or
          'this pillar is not yet configured.' Nothing on the dashboard names
          the assigned role or lists withheld sections. Compounded by the fact
          that custom roles are support-requested (capability-map.yaml), so the
          admin often did not choose their own role and has no record of it.

  - screen: "Hamburger menu (persistent global navigation)"
    navigation_path: "Any screen > hamburger menu (upper left / top of page)"
    action: >
      Admin opens the hamburger menu to reach any module from anywhere, rather
      than routing back through the dashboard.
    confirmed_by: >
      exxat_transcripts.md line 17: "You can also
      access these options anytime through the hamburger menu at the top of the
      page." This is the single most-repeated navigation instruction in the whole
      corpus and it is discipline-invariant — verbatim reliance on it appears in
      PTPTAVideosTranscripts.md lines 37, 79, 117;
      OTOTAVideosTranscripts.md lines 75, 91, 93, 95,
      97, 119; PAVideosTranscripts.md line 23;
      SLPVideosTranscripts.md line 23.
    elements:
      - element: "Hamburger menu module list"
        type: "global navigation drawer"
        data_shown: "Same program / curriculum / placement module set as the dashboard, minus whatever the user's role withholds"
        gates_on: []
        accreditation_citation: "none — navigation element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Worth flagging for the onboarding narrative rather than as a defect:
          every discipline tutorial in this corpus opens its instructions with
          'from your dashboard or upper left hand hamburger menu,' which makes
          this element the de facto shared vocabulary of all Exxat training
          content. Any change to it invalidates six discipline video libraries
          at once.

  - screen: "Global search bar"
    navigation_path: "Any screen > global search bar (top of page)"
    action: >
      Admin types a name or ID and narrows with an entity filter to jump straight
      to a record, rather than navigating the module tree.
    confirmed_by: >
      exxat_transcripts.md lines 65-69: "The global
      search bar in EXAP Prism allows you to efficiently search across the entire
      platform... you can effortlessly locate individuals, courses, sites and
      locations, placements, and standards... Click on the people filter if you
      are having trouble locating the student... Use the curriculum option to
