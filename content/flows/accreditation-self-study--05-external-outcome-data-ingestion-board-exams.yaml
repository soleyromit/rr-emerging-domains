# Element-level ground truth for accreditation-self-study.yaml, Stage 5:
# "External outcome-data ingestion — board exams, match/licensure, mandated surveys"
# SCHEMA v2 (2026-08-24): analysis fields live on each element, not on the step.
flow_name: "External Outcome-Data Ingestion (Board Exams, Match, Mandated Surveys)"
maps_to_journey: "accreditation-self-study.yaml, stage 5"
persona: "Program Administrator (accreditation/self-study preparer)"
steps:
  - screen: "Exxat Surveys — Survey Home / Create Survey"
    navigation_path: "Program (hamburger menu) > Surveys > Create Survey"
    action: "Program admin builds a survey instrument from scratch, a template, an existing survey, or an uploaded Word/PDF document, then distributes it to Prism users, external emails, or the public."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Surveys/Exxat Surveys.md"
    elements:
      - element: "Create Survey entry tiles"
        type: "action tiles"
        data_shown: "Start from Scratch / Copy an existing survey / Use a template / Upload Document (Word/PDF auto-converted to survey questions)"
        gates_on: []
        accreditation_citation: "ACPE Standard 7, Key Element 7.5.a and COCA Standard 11, Element 11.8 — this is the element where an accreditor-specific instrument would be selected, so it is where the absence of a pre-built AACP/COCA-branded template is visible."
        competitor_equivalent: "CORE ELMS (core-elms.yaml), eMedley eValuate+ (emedley.yaml), MedHub/E*Value (medhub.yaml, e-value.yaml) and one45 Assessment (one45.yaml) all ship general-purpose survey authoring. None of their public docs enumerate their template libraries at a granularity that would confirm whether they bundle accreditor-branded instruments, so no comparison is claimed at this element."
        gap_severity: "configure-needed"
        gap_note: "The authoring engine itself is live today (help-center article dated August 24, 2026), including Word/PDF-to-survey conversion — which contradicts the journey's prior framing of Surveys as 'roadmap Q1 2027 / blocked outright'. The branded Surveys & Course Evaluations pillar this engine belongs to has itself been corrected to shipped too (CORRECTED 2026-08-26 per Exxat PM confirmation, see ../prism/capability-map.yaml, Surveys & Course Evaluations pillar). What is missing at this tile is a pre-built, AACP/COCA-branded instrument library (unlike PT's bundled APTA-aligned templates): a program must self-author or upload the official AACP AAMS/PHARMS or COCA survey text rather than picking it from a native template. Configuration/content gap, not an engine gap; depth vs. named competitors' template libraries not yet re-verified."
      - element: "Access Settings toggle"
        type: "toggle"
        data_shown: "Visible to all program users vs. creator only; locks permanently once the survey is published"
        gates_on: ["who can view survey/results after publish"]
        accreditation_citation: "None directly — visibility scoping is not itself evidence for any ACPE or COCA element; it conditions who can later retrieve the evidence produced by this survey."
        competitor_equivalent: "No competitor teardown in this repo documents per-survey visibility/permission settings at field level, so this element is unconfirmed for all named vendors rather than compared."
        gap_severity: "none"
        gap_note: "Shipped and functional. The permanent lock at publish is documented product behavior, not an accreditation shortfall."
      - element: "Question type picker"
        type: "input field (14 types)"
        data_shown: "Single Choice, Multiple Choice, Short/Long Answer, Title, Number, Dropdown, Date Picker, Date Range, Time Range, Toggle, Attestation, E-Signature, Divider, Text Editor"
        gates_on: []
        accreditation_citation: "ACPE Standard 7, Key Element 7.5.a and COCA Standard 11, Element 11.2 (student evaluation of instruction) — the item types here are sufficient to reproduce the question formats those elements' instruments require."
        competitor_equivalent: "The 14 question types (including Attestation and E-Signature) match or exceed what CORE ELMS, eMedley eValuate+, MedHub/E*Value and one45 describe on their public marketing pages — but none of those pages document question-type counts precisely enough to claim Prism is ahead rather than at parity."
        gap_severity: "none"
        gap_note: "Fully shipped; no accreditation-driven item type is documented as missing."
      - element: "Distribution channel tiles"
        type: "action tiles"
        data_shown: "Via Exxat Prism (select recipients by persona: Student/Faculty/Personnel, with filters and email-template picker); Additional Email (manual entry or CSV upload of external, non-system-user recipients); Anonymous Link (public URL + QR code)"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.8 (mandatory COCA student survey) — this element is the distribution/participation-promotion mechanism that 11.8 requires; ACPE 7.5.a for routine stakeholder survey distribution."
        competitor_equivalent: "All four named competitors ship survey distribution as part of their evaluation engines, but their public docs do not break distribution out by channel (in-system vs. external email vs. anonymous public link), so parity cannot be confirmed at this granularity."
        gap_severity: "none"
        gap_note: "All three channels are shipped, including the anonymous-link and external-email paths that reach non-system users."

  - screen: "Exxat Surveys — View Analysis (Insights, Question Summaries, Reports)"
    navigation_path: "Program > Surveys > [survey card] > View Analysis"
    action: "Admin reviews response analytics and exports raw or aggregate survey data as the evidentiary basis for a self-study finding."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Surveys/Exxat Surveys.md"
    elements:
      - element: "Survey Status Overview panel"
        type: "read-only rollup"
        data_shown: "Completed / pending / not-started response counts"
        gates_on: []
        accreditation_citation: "Supporting only — response-completeness context for ACPE 7.5.a and COCA Element 11.8; the panel is not itself the evidence either element requires."
        competitor_equivalent: "Public docs for CORE ELMS, eMedley, MedHub/E*Value and one45 describe comparable response-status dashboards at marketing-page level of detail; no teardown in this repo is granular enough to compare panel contents."
        gap_severity: "none"
        gap_note: "Read-only display of shipped data; nothing accreditor-specific is expected of it."
      - element: "Weekly Response Rates chart"
        type: "read-only chart"
        data_shown: "Responses submitted per week"
        gates_on: []
        accreditation_citation: "Supporting only — participation-rate context for COCA Element 11.8; not the findings-and-actions evidence itself."
        competitor_equivalent: "Comparable response-rate charting is described on competitor marketing pages, but at a level of detail that does not support element-level comparison."
        gap_severity: "none"
        gap_note: "Shipped read-only chart; no documented shortfall."
      - element: "Response-per-distribution-channel breakdown"
        type: "read-only chart"
        data_shown: "Response counts split by email / link / in-Prism channel"
        gates_on: []
        accreditation_citation: "Supporting only — helps demonstrate the participation-promotion effort COCA Element 11.8 expects, without constituting the required report."
        competitor_equivalent: "Per-channel breakdowns are described generically on competitor pages; no repo teardown documents them at field level, so this is unconfirmed for all vendors."
        gap_severity: "none"
        gap_note: "Shipped read-only chart; no documented shortfall."
      - element: "Export Raw Report / Export Aggregate Report buttons"
        type: "report export"
        data_shown: "Raw = every individual respondent-level answer; Aggregate = totals/averages/trends per question"
        gates_on: []
        accreditation_citation: "ACPE 7.5.a (requires 'communication of major findings/actions to key stakeholders at least annually' — this export produces the underlying data but does not author the findings-and-actions narrative); COCA Element 11.8 (requires a findings/actions report capped at 500 words — same gap: no narrative-report generator, no word-count enforcement)."
        competitor_equivalent: "None of the public materials for CORE ELMS, eMedley, MedHub/E*Value or one45 document an auto-generated narrative CQI report or a word-count-capped findings report either; no competitor teardown in this repo supports a comparison at this element, so it is flagged unconfirmed for all vendors rather than claimed as a Prism-specific deficit."
        gap_severity: "configure-needed"
        gap_note: "Raw and aggregate export exist today; the accreditor-specific narrative synthesis (annual CQI findings-and-actions writeup, 500-word cap enforcement, auto-publication timing) does not exist anywhere in the documented product and must be authored manually outside this screen. This export button is the point in the flow where that hand-off to manual authoring occurs."
      - element: "Individual Responses list with reminder-send action"
        type: "read-only list + button"
        data_shown: "Per-respondent answers; send-reminder action targets only non-responders"
        gates_on: []
        accreditation_citation: "COCA Element 11.8 — the non-responder reminder is a documented participation-promotion mechanism for the mandatory COCA student survey."
        competitor_equivalent: "Competitor evaluation engines advertise reminder functionality, but no public doc for the named vendors specifies non-responder targeting, so parity is unconfirmed at this element."
        gap_severity: "none"
        gap_note: "Shipped; targeting only non-responders is documented behavior."

  - screen: "Exxat Surveys — Additional Email distribution (Alumni/Job Placement Survey precedent)"
    navigation_path: "Program > Surveys > Create Survey > Distribute > Additional Email tile"
    action: "Admin distributes a self-report survey (e.g., an Alumni Survey or Job Placement Survey) to graduates who are no longer active Prism users, collecting post-graduation outcome data by self-report."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing Playbook.md (Surveys section: 'Surveys module supports Annual Student Surveys, Alumni Surveys, Job Placement Surveys... cited as the mechanism for ACEN Criterion 5.4 (annual job-placement-rate assessment) and COA H.1.4/H.1.6 (alumni quality feedback, employment-rate outcome measures)'), cross-referenced against /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Surveys/Exxat Surveys.md for the Additional Email mechanic"
    elements:
      - element: "Additional Email recipient entry / CSV upload"
        type: "input field + file upload"
        data_shown: "Manually entered first name/last name/email, or bulk CSV upload — the mechanism used to reach non-system-user recipients such as program alumni or employers"
        gates_on: []
        accreditation_citation: "Directly documented for ACEN Criterion 5.4 and COA H.1.4/H.1.6 (Nursing). Adjacent, not identical, to COCA Standard 11, Element 11.5 (GME placement rates) — 11.5's required_software_behavior in coca.yaml calls for tracking each student's Match outcome as structured data and auto-computing a placement-rate formula, which self-reported alumni-survey data does not satisfy; it satisfies only a lower-rigor, precedented workaround (self-report via survey) that a program could adapt for COCA 11.5 evidence in the absence of a structured Match-data integration."
        competitor_equivalent: "MedHub/E*Value's structured AAMC ERAS resident-demographic-data integration (medhub.yaml, e-value.yaml) is the higher-rigor structured alternative to this survey-based workaround — Prism has no equivalent structured integration; the comparison is not close at the element level, and this flow does not overstate it as one."
        gap_severity: "gap"
        gap_note: "A real, verified precedent workaround exists (self-reported placement/employment survey, already used by Nursing for ACEN 5.4/COA H.1.4-H.1.6), which the journey's prior framing of 'no home in any pillar' understated. But this workaround does not satisfy COCA 11.5's specific requirement for structured, auto-computed Match-outcome tracking, so the underlying structured-data gap stands — softened from 'no mechanism at all' to 'a lower-rigor self-report workaround exists, the structured mechanism does not.'"

  - screen: "Overview of Student Page — Status field"
    navigation_path: "Dashboard > Students > [student] > Status section"
    action: "Admin marks a student Graduate; this is the terminal state Prism tracks for that student record."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Students/Overview of Student Page.md"
    elements:
      - element: "Student Status field"
        type: "input field / dropdown"
        data_shown: "Active, Inactive, Graduate — no post-graduation state or outcome fields beyond 'Graduate'"
        gates_on: []
        accreditation_citation: "Negative evidence relevant to COCA Element 11.5, LCME Element 8.4 (outcome data gathered 'during AND after program completion'), and CODA Element 1-2: confirms no structured field exists anywhere in the student record for licensure-exam result, Match outcome, or residency placement."
        competitor_equivalent: "Not applicable — this element documents an absence in Prism, not a comparable competitor field."
        gap_severity: "gap"
        gap_note: "Confirms at the field level that the student record has no home for post-graduation outcome data; 'Graduate' is a terminal status with nothing captured after it. This directly corroborates (rather than merely re-asserts) the journey's existing claim that Match/placement outcomes have no home in any shipped pillar."

  - screen: "Exam Management (roadmap pillar) — no shipped screen exists"
    navigation_path: "n/a — not reachable in the product; no navigation path exists"
    action: "n/a"
    confirmed_by: "/Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/prism/capability-map.yaml (line 702-704: 'Exam Management, status: roadmap, target: Q2 2027' — a single line with no shipped-feature notes, unlike every other pillar in the file); corroborated by an exhaustive keyword search across all 322 files in /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides and all files in /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks for 'exam management', 'ExamN', 'licensure', 'board exam', 'pass rate', 'COMLEX', 'USMLE', 'NAPLEX', 'residency', 'match rate' — zero matches for any exam-ingestion or licensure-outcome feature in either corpus"
    elements:
      - element: "Board-exam / licensure result ingestion — no such element exists in any shipped screen"
        type: "absent (roadmap pillar, no UI)"
        data_shown: "none — nothing in the product accepts or displays an external board-exam score, licensure result, or Match outcome"
        gates_on: []
        accreditation_citation: "COCA Element 11.4 (COMLEX-USA pass rates); LCME Element 8.4 (USMLE/national norms); ACPE Standard 7 (NAPLEX/MPJE outcomes, referenced generally, not a named element in acpe.yaml); CODA Element 1-2 (INBDE/DLOSCE/regional clinical-exam pass rates)"
        competitor_equivalent: "eMedley's ExamN ships today as a standalone product (question banks, lockdown browser, eProctor webcam proctoring add-on, item-analysis psychometrics — emedley.yaml) but is an authoring/delivery engine, not an external-board-score ingestion tool, so it doesn't actually solve COCA 11.4/CODA 1-2 either. MedHub/E*Value's 'Curriculum and Assessment Technology' module is a BoardVitals partner-content integration for exam-readiness practice questions, not board-score ingestion (e-value.yaml). one45's closest analog is real ingestion-shaped: it pulls NBME CBSE/CCSE exam data (not COMLEX/NAPLEX/INBDE) into a 'Gateway exams' performance dashboard via ExamSoft integration (one45.yaml) — the closest public precedent for the correct scope (ingestion, not authoring) that this stage actually needs, though even that precedent is documented for a different exam series than any of the four target domains require. CORE ELMS has no publicly verifiable exam-related module of any kind (core-elms.yaml)."
        gap_severity: "gap"
        gap_note: "No change from the journey's existing framing — this is the one part of Stage 5 the newly available source material does not resolve. Nothing in the help-center mirror, the discipline playbooks, or the capability map documents any board-exam-result ingestion mechanism, confirming (not just re-asserting) that this remains an unqualified gap with a Q2 2027 roadmap date and no further shipped detail. Recorded as a single placeholder element because the pillar has no UI to enumerate; the analysis is unchanged from the pre-migration step-level verdict."

