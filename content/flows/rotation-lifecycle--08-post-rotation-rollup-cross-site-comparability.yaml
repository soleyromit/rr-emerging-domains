  - screen: "OT/OTA discipline > ACOTE program-evaluation evidence assembly (Students > Reports; Learning Activities > Reports; Curriculum Mapping > Measure Attributes Usage)"
    navigation_path: "Students > Reports > Communication and Intervention Report / Attestation Report / Program Requirements Report; Learning Activities > Reports > Comprehensive Report for Placement-Based Forms (AOTA FWPE family); Curriculum Mapping > Mapping Reports > Measure Attributes Usage"
    elements:
      - element: "Comprehensive Report for Placement-Based Forms, Group By selector (AOTA FWPE data)"
        type: "read-only rollup with pivot selector"
        data_shown: "FWPE results grouped by student, course, educator, site, location, or setting; sibling shapes are Raw Data, Aggregate, and Graphical"
        gates_on: []
        accreditation_citation: "ACOTE Standard C.1.8 (evaluating the effectiveness of supervision — ../accreditation/acote.yaml names this report's Group By pivots, Site > Location > Student and Preceptor > Student, as 'the pivots the standard actually needs'); ACOTE Standard C.1.15 (formal evaluation of student performance on Level II fieldwork)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in ../competitors/ names ACOTE or any OT-specific instrument. The AOTA FWPE has no competitor analogue documented anywhere in this research; e-value.yaml's 'CCC Milestone Review' equivalent at New Innovations aggregates ACGME milestone data, a different instrument for a different accreditor."
        gap_severity: "none"
        gap_note: "Shipped, and the single strongest cross-site comparability surface for any existing discipline: because the FWPE is a nationally standardized AOTA instrument shipped as a non-editable Standard form archetype, grouping the SAME instrument by site or by educator produces a like-for-like comparison rather than a comparison of differently-worded local forms. That instrument standardization is the thing that makes comparability meaningful, and acote.yaml is explicit that it is what the four expansion domains should be assessed on."
      - element: "The same Group By rollup, read against ACOTE's COMPARABILITY clause"
        type: "read-only rollup"
        data_shown: "Aggregated FWPE outcomes per site / per instructional method"
        gates_on: []
        accreditation_citation: "ACOTE Standard C.1.11 — documentation that ALL students had SIMILAR Level I experiences across learning activities, objectives, assignments and outcome measures, with each experience tagged to one of six permitted instructional methods (virtual, simulated, standardized patients, faculty practice, faculty-led site visits, or supervision by a fieldwork educator in a practice environment); see ../accreditation/acote.yaml"
        competitor_equivalent: "Not comparable at element level — no teardown documents ACOTE. e-value.yaml's 'benchmarking against national/institutional trends' is the nearest marketed claim of comparability anywhere in ../competitors/, but it is ACGME-scoped and MedHub publishes no statistic list, so it cannot be shown to do what C.1.11 needs either."
        gap_severity: "gap"
        gap_note: "acote.yaml states the finding in terms this file should not soften: comparability under C.1.11 is 'asserted by construction (same course offering, therefore same experience), not measured. Nothing compares realized Level I outcomes across sites or delivery methods to show that a simulated cohort and a practice-environment cohort actually performed comparably — the same cross-site statistical comparability gap logged against COCA 6.11 and rotation-lifecycle--08 in this repo.' An accreditor registry for an EXISTING, well-served discipline independently named this stage as the home of the gap, which is the strongest available confirmation that the gap is real and not expansion-domain-specific."
      - element: "Measure Attributes Usage report (Instructional Methods; Lifespan/population tags)"
        type: "read-only coverage rollup, bar graph"
        data_shown: "Distribution of course measures across a configured attribute taxonomy — for OT, Instructional Methods and lifespan/population tags"
        gates_on: []
        accreditation_citation: "ACOTE Standard A.5.1 (curriculum prepares students for generalist practice across named lifespan populations and practice settings) and Standard C.1.11 (documentation of which of the six permitted instructional methods each Level I experience used — acote.yaml confirms this report is the mechanism Exxat's own ACOTE guide cites for C.1.11)"
        competitor_equivalent: "core-elms.yaml documents CORE ELMS' CompMS as marketing 'accreditation-standards mapping and reporting' with 'continuous improvement tools' and an ACPE-aligned curriculum gap analysis — a feature-name-level analogue to a coverage report, for a different accreditor, with no disclosed attribute model. Not comparable at element level."
        gap_severity: "configure-needed"
        gap_note: "Shipped, and OT is one of only two disciplines (with PA) where the attribute taxonomy is confirmed loaded. The limit acote.yaml names is that coverage here is descriptive, not evaluative: 'nothing asserts a threshold (every student must see at least one pediatric and one older-adult experience) and alerts on a cohort falling short.' A distribution bar graph answers 'what did we cover' and never 'who is short.'"
      - element: "Communication and Intervention Report / Attestation Report / Program Requirements Report"
        type: "standard reports, student-scoped"
        data_shown: "All communication and intervention activity; attestation completion; per-student Program Requirements completion"
        gates_on: []
        accreditation_citation: "ACOTE Standard A.3.5 (documented, regular faculty advisement per student, inspectable by a site visitor — ../accreditation/acote.yaml rates this Transfer and names this report family); ACOTE Standard A.6.3 (routinely secured formative and summative data across eleven enumerated streams, analysed EACH ACADEMIC YEAR)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents an advisement-history export. New Innovations' APE citation/concern tracking (new-innovations.yaml) is a program-level finding register, not a per-student advisement history, so it is a different object."
        gap_severity: "configure-needed"
        gap_note: "Shipped for OT specifically — and worth flagging because a dedicated Interventions report is recorded as MISSING in five other accreditor registries in this repo (arc-pa, caa-asha, cswe, caep, acote all note that the only interventions-needing-follow-up surface is the Sites/Locations Dashboard on a 24-hour refresh). The OT playbook documents a 'Communication and Intervention Report' under Students > Reports; reconcile that against the capability-map's 'no dedicated Interventions report' finding before either claim is used externally. This is a genuine open question, not a settled fact."
