  - screen: "CRNA discipline > per-student threshold rollups and COA's critical-standard severity tier"
    navigation_path: "Learning Activities > [course] > Reports > Student Activity Insights; Reports > Daily Clinical Forms and Evaluation Reports; Learning Activities > Reports > NBCRNA Transcript Report"
    elements:
      - element: "Student Activity Insights report — green / amber / red threshold cells"
        type: "read-only rollup with a threshold-driven color scale"
        data_shown: "Per-student progress against each configured case-category minimum: green = met or exceeded (100%+), amber = approaching (roughly 80-99%), red = below the minimum; filterable by rotation, program, clinical settings, site location, status and student"
        gates_on: []
        accreditation_citation: "COA Standard E.2.3 and the Appendix (roughly sixty individually numbered minimum case counts across eight families, plus the 2,000 clinical-hour floor) — see ../accreditation/coa.yaml, which matches the transcript's worked example (a 200 minimum against 21 entered) to COA's ASA Classes III-VI row; COA Standard C.4 (clinical experience logs reviewed by faculty on a regular basis)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in ../competitors/ names COA or NBCRNA. emedley.yaml documents encounter logging with 'dashboard + frequency-analysis reporting' and one45.yaml documents procedure/patient-encounter logs, but neither discloses a threshold model or a traffic-light state, so there is nothing to compare the color semantics against."
        gap_severity: "configure-needed"
        gap_note: "The most complete threshold-rollup in the product and the closest shipped thing to what this stage's central gap describes — a rule, a computed status, and a visual state change — but the axis is PER STUDENT, not per site. coa.yaml names three things it does not obviously handle: cohort-conditional thresholds (COA's dagger rows bind only students matriculating on/after Jan 1 2026, so one course offering must apply two threshold sets by matriculation year), an actual-vs-simulated split, and multi-parent counting ('count all that apply' means one encounter must increment several thresholds at once). All three are open questions in coa.yaml, not confirmed defects."
      - element: "Daily Clinical Evaluation Report — student and preceptor responses side by side"
        type: "aggregation and export layer, per-student PDF (ZIP for multi-select)"
        data_shown: "Total response counts and percentage distributions per question across the large volume of daily evaluations a multi-year CRNA program accumulates; a wrench icon selects student responses, preceptor responses, or both, and both render side by side per question"
        gates_on: []
        accreditation_citation: "COA Standard H.1.1 and H.1.1.1 (CRITICAL) — a written systematic plan for continuous self-assessment incorporating formative and summative evaluations of EACH student, plus a terminal evaluation demonstrating achievement of Graduate Standards D1-D50; COA Standard H.1.2.7 separately requires students to evaluate their own achievement, which is what makes the dual-perspective capture load-bearing (../accreditation/coa.yaml)"
        competitor_equivalent: "New Innovations' evaluation-data aggregation with spider graphs (new-innovations.yaml) is the closest shipped competitor aggregation of high-volume evaluation data, but it aggregates to ACGME milestones rather than to response distributions, and its dual-rater model is undisclosed. Not comparable at element level."
        gap_severity: "gap"
        gap_note: "Built specifically for the volume problem this standard creates, and the transcript is explicit that it exists because 'a large volume of evaluation forms accumulates over time from both students and preceptors.' The gap coa.yaml names is precise and matters for this stage: the report is 'an aggregation and export layer, not a competency computation — it reports response counts and percentage distributions per question, whereas H.1.1.1 asks for achievement of D1-D50.' Bridging the two requires the daily instrument's questions to be MAPPED into Competency Management, which the transcript does not show. One FERPA-adjacent note: the transcript states these per-student PDFs can be shared directly with clinical sites."
      - element: "NBCRNA Transcript Report"
        type: "accreditor/certifier-format-matched report"
        data_shown: "Case-log statistics per student rendered by NBCRNA-required category, 'in accordance with NBCRNA guidelines'"
        gates_on: []
        accreditation_citation: "COA Standard C.4 (accurate, complete, faculty-reviewed clinical experience logs, with COA's Guidelines for Counting Clinical Experiences placing final quantification authority on the Program Administrator) and COA Standard E.2.3 with the Appendix (../accreditation/coa.yaml)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents generation of a certifying body's own transcript format. Alongside SLP's KASA Clinical Certification Report and PA's B2 export, this is the third such artifact inside Prism and the second with no competitor analogue documented anywhere."
        gap_severity: "none"
        gap_note: "coa.yaml calls this 'the strongest existing CRNA-specific accreditation asset in the product,' and explains why the underlying log's integrity behaviors matter more here than anywhere else: the same record is simultaneously the academic record, the COA C.4 artifact, and the NBCRNA certification-eligibility document. Two configuration traps travel with it — auto-approval and preceptor attestation are MUTUALLY EXCLUSIVE (so a program cannot have frictionless logging and a signed integrity attestation at once, and for C.4 the attestation is the load-bearing half), and no program-administrator affirmation tier exists above preceptor/faculty approval despite COA vesting final quantification authority there."
      - element: "Standard-severity tier (COA's critical-concern asterisk)"
        type: "not shipped"
        data_shown: "N/A — a standard in Prism's standards list carries a code, a description and annotations; it carries no severity attribute"
        gates_on: []
        accreditation_citation: "COA's asterisk convention — 'failure to fully comply with one or more of these Standards is considered to be of critical concern in decisions regarding nurse anesthesia program accreditation' — applied to F.7 (the 2:1 supervision cap), F.1, F.5, A.3, A.10, E.2, H.1.1, H.1.2, H.1.6, G.3, B.5/B.6/B.11/B.12/B.15/B.16, and ALL FIFTY graduate standards D.1-D.50 (../accreditation/coa.yaml). The nearest analogue elsewhere is CAPTE's active STAY on Standard 2B, which instructs programs not to respond to it at all (../accreditation/capte.yaml)."
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents standard-severity tiering. New Innovations' 'citation/concern tracking' (new-innovations.yaml) tracks the severity of a FINDING after the fact, which is a different object from a severity attribute on the standard itself."
        gap_severity: "gap"
        gap_note: "Two accreditors in this repo, researched independently, attach a per-standard STATE that changes how a program must respond — COA's critical-concern asterisk and CAPTE's stay on 2B — and Prism's standards model can represent neither. capability-map.yaml already names the COA convention as 'a standard-severity-tiering concept absent from the ACEN/CCNE guides that could inform how a unified Accreditation Management pillar surfaces risk across accreditors of different rigor.' A severity/state field on the standard object is small, and it is the difference between a flat list and a risk-ordered one. capte.yaml adds the second state a stay needs: suppressed, not merely deactivated, because deactivation cascade-deletes mappings."
      - element: "Annual publication of attrition, 6-month employment, and NCE first-time pass rate"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "COA Standard G.3 (CRITICAL) with G.3.4.1-G.3.4.3 — annual publication, on a website linked to COA's List of Accredited Educational Programs, of attrition, employment of graduates as nurse anesthetists within 6 months of graduation, and the NBCRNA NCE FIRST-TIME pass rate for the most recent graduating class; COA Standard H.1.6 (CRITICAL) separately requires pass rates AND MEAN SCORES (../accreditation/coa.yaml)"
        competitor_equivalent: "e-value.yaml documents MedHub's automated ADS-formatted report generation and benchmarking against national trends — a shipped annual-submission pipeline, ACGME-scoped, with no public-page publication claim. No competitor is documented publishing an accreditor-required metric to a public URL."
        gap_severity: "gap"
        gap_note: "coa.yaml calls G.3.4 and H.1.6 together 'the cleanest business case in this file for Accreditation Management: three specific, externally-sourced figures, published annually, on a critical-flagged standard.' One subtlety worth keeping in the data model: H.1.6.2 wants pass rates AND mean scores while G.3.4.3 wants the FIRST-TIME pass rate specifically — a single 'pass rate' field will not satisfy both. Also note COA H.1.2 (CRITICAL) is a straight Gap: the eight-facet student evaluation of courses, instruction, sites, environment, advising, self and program has no CRNA template family, and the PT PTSE1/PTSE2 confidentiality pattern that would satisfy it exists only for PT."
    action: "A CRNA program reads per-student threshold progress off Student Activity Insights, exports per-student daily-evaluation PDFs, and generates the NBCRNA transcript — then computes and publishes the three COA G.3.4 outcome figures outside the product, with no representation anywhere of which standards COA treats as critical."
