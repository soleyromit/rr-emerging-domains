        accreditation_citation: "CAEP Standard R3, Component R3.3 — CAEP requires 'more than one source' of evidence that candidates reached expected proficiency at completion across all six named areas (content knowledge, pedagogical knowledge, pedagogical skills, critical dispositions, professional responsibilities, technology integration), disaggregated by preparation program, race/ethnicity and other demographics; ../accreditation/caep.yaml scores this prism_fit: Build — the only Build rating in the CAEP file"
        competitor_equivalent: "Not comparable at element level — no teardown names CAEP. The nearest shipped competitor analogue for multi-source competency rollup is New Innovations' CCC Milestone Review (new-innovations.yaml), which aggregates evaluation data to ACGME milestones; it is single-framework and does not join heterogeneous instrument types."
        gap_severity: "gap"
        gap_note: "caep.yaml calls this 'the highest-value TE-specific build in the file and also the element CAEP will not let an EPP fake, because triangulated is stated as a hard requirement rather than a preference.' The closest confirmed analogue in the product is SLP's min/max hour thresholds (step 10) — a real per-student threshold rollup, but support-configured, single-source and hours-based rather than a multi-instrument triangulation. Two dependencies make it worse: the licensure-exam input is blocked on Exam Management (Q2 2027), and the disaggregation requirement runs through every R1-R4 component."
      - element: "Complaint register (including complaints made to CAEP itself)"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "CAEP Standard R3, Component R3.2 — 'a system for effectively maintaining records of candidate complaints, including complaints made to CAEP,' with documented resolution and aggregate reporting by demographic without exposing identities; the same component asks pointedly how the EPP proves the transition-point process is followed with fidelity — 'how does the EPP ensure there are no loopholes to work around the system?' (../accreditation/caep.yaml)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents a complaint register. e-value.yaml's CLER letter/response-action tracking is the nearest adjacent object (an externally-originated item with a regulator in the loop) and is ACGME-scoped."
        gap_severity: "gap"
        gap_note: "caep.yaml is explicit that Interventions must not be stretched to cover this: 'CAEP's requirement is specifically for complaints INCLUDING those made to CAEP itself — an externally-originated record type with a regulator in the loop. Do not stretch Interventions to cover it; scope it as its own object.' Also unbuildable from Prism today: the cohort 3.0 GPA transition point R3.2 requires, because the Grading Scheme module is record-keeping only and 'does not calculate student grades.'"
      - element: "Exxat Surveys template family for Teacher Education (Employer Satisfaction / Completer Satisfaction)"
        type: "not shipped (content, not engineering)"
        data_shown: "N/A — Exxat Surveys ships named templates only for PT (four APTA-aligned Multi-Rater DCE Performance Survey templates) and SLP (Graduating Student Survey, Clinical Supervisor Survey, added December 2025)"
        gates_on: []
        accreditation_citation: "CAEP Standard R4, Component R4.2 (satisfaction of employers, with instruments eliciting responses specific to the R1 criteria and a representativeness argument built on response rates) and Component R4.3 (satisfaction of completers, distributed to alumni whose institutional accounts are deprovisioned); ../accreditation/caep.yaml rates both Configure on the strength of Exxat Surveys' email/CSV and anonymous public-link channels plus its Weekly Response Rates analytic"
        competitor_equivalent: "Not comparable at element level — no teardown names CAEP. axium.yaml and core-elms.yaml both reference survey/CQI tooling at feature-name level for other accreditors, with no template inventory disclosed."
        gap_severity: "configure-needed"
        gap_note: "caep.yaml identifies the cheapest product investment in the whole TE file: 'the December 2025 SLP extension is the useful precedent — adding a TE template pair (Employer Satisfaction Survey, Completer Satisfaction Survey) is a demonstrated, recent, repeatable content-ops motion.' The unconfirmed half is the rollup: nothing in the corpus shows Exxat Surveys questions tagging to a Curriculum Mapping standard, so 'results roll up per R1 component' is manual crosswalk work today. Note the same missing template family blocks COA H.1.2 for CRNA (step 13) — one content-ops motion, two disciplines."
    action: "A TE program evidences observational practice through the GoReact LTI, surveys employers and completers through Exxat Surveys' external channels, and then assembles the triangulated completion rollup, the demographic disaggregation, and the complaint register outside the product — because CAEP requires all three across every component."
    confirmed_by: "TE Playbook.md lines 12 and 67-72 (the single-source data-quality caveat and the explicit instruction not to cite CAEP standard numbers until confirmed against a TE-specific source — which ../accreditation/caep.yaml now does for the accreditor half only); /Users/romitsoley/Downloads/CRNAVideosTranscripts.md lines 99-117 (the GoReact/Echo360 LTI workflow, support-gated activation, auto-created matching activity, and score/status sync); ../accreditation/caep.yaml (R1.3, R2.1-R2.3, R3.2, R3.3, R4.1-R4.3, R5.1, R5.4). IMPORTANT: caep.yaml states every prism_fit in it is scored against GENERIC pillar capability confirmed for other disciplines, not against observed TE configurations — read this step the same way."

  - screen: "Accreditation Management pillar (not yet built)"
    navigation_path: "N/A — no shipped screen; roadmap item"
    elements:
      - element: "Cross-site statistical comparability engine"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.11; LCME Standard 8, Element 8.7 and Standard 8, Element 8.4. Independently confirmed from an existing discipline: ACOTE Standard C.1.11's comparability clause, where ../accreditation/acote.yaml names 'the same cross-site statistical comparability gap logged against COCA 6.11 and rotation-lifecycle--08 in this repo.'"
        competitor_equivalent: "MedHub/E*Value ships benchmarking and program scorecards today under its named 'Accreditation Automation' product (e-value.yaml) — the single largest publicly-verifiable gap identified anywhere in this research. Scope caveat now confirmed: MedHub's accreditation automation is documented as ACGME/GME-specific, so it is not proven to serve any of the eight disciplines in this stage either."
        gap_severity: "gap"
        gap_note: "Partial analogs exist and this stage now names the two best. Step 5's Custom Report pivot averages scores by site or setting; step 11's Competency Review Dashboard renders a Score Distribution box plot RED when a domain median falls below a configured threshold — the only place a threshold drives a visual state change on an outcome distribution. What still has no analog is variance/effect-size flagging BY SITE against a threshold band. Confirmed Gap, and now confirmed from an existing discipline's accreditor as well as from the expansion domains."
      - element: "Closed-loop finding -> action -> evidence object"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Elements 11.1/11.4/11.5; CODA Standard 1, Element 1-2. Plus, from the eight existing disciplines: CAPTE Element 2C, ACOTE A.6.3, ARC-PA C1.01, CAA 5.4 and 5.8, CCNE IV-A/IV-F, ACEN 5.1, CSWE AS 5.0.1(c), CAEP R5.4, COA H.2 — twelve accreditors, one object."
        competitor_equivalent: "MedHub/E*Value's 'Accreditation Automation' (e-value.yaml) and New Innovations' Annual Program Evaluation with citation/concern tracking (new-innovations.yaml) are the two named shipped equivalents; neither publishes its object model, and both are ACGME-shaped, so neither is proven to carry CAA 5.4's re-measurement field or CAEP R5.4's stakeholder-group and disposition fields."
        gap_severity: "gap"
        gap_note: "Confirmed Gap, and the field list is now specified rather than gestured at (see step 4): a cited data point, a stakeholder group, a disposition of keep/modify/discontinue, a re-measurement result, a queryable timestamp supporting a four-year lookback, an exemplar flag, and tolerance for logging a change that did NOT improve the outcome. Nearest shipped analog remains step 4's Mapping Tags, which carries none of them."
      - element: "Standards-to-evidence repository with deadline/submission tracking"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.9; ACPE Standard 7, Key Element 7.5.b; LCME Standard 1, Element 1.1; CODA Standard 5, Element 5-3. From the existing disciplines: ARC-PA Standard A3, Element A3.11 c imposes a hard April 1 annual publish-by date; CAEP's EPP Annual Report via AIMS covers eight annual measures on a between-visit cycle; COA Standard A.11 requires Council PRE-approval before a significant class-size increase (../accreditation/arc-pa.yaml, caep.yaml, coa.yaml)"
        competitor_equivalent: "MedHub/E*Value ships automated ADS-formatted generation, an accreditation document workspace, and automated alerts for accreditation tasks and policy expirations under 'Accreditation Automation' (e-value.yaml); Prism has no equivalent screen at all."
        gap_severity: "gap"
        gap_note: "Analogs now exist for the taxonomy (step 2), for standard-named reports (step 6), and for genuinely accreditor-format-matched OUTPUTS in three separate disciplines — PA's B2 Instructional Objectives Report, Nursing's Crosswalk Report modelled on AACN's own Essentials Toolkit template, and SLP's KASA Clinical Certification Report which generates a signed ASHA template. Nothing shipped stores evidence against a standard number or tracks a submission deadline; step 1's accreditation card records status metadata only. Confirmed Gap — but the format-matching half is proven three times over, which is a materially stronger position than the original four-domain read of this element."
      - element: "Accreditor edition-crosswalk / standard-version registry"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "CAPTE 2016 -> 2024 (two shipped reports still carrying dead 2016 numbers, step 6); AACN Essentials 2021 -> 2026 with CCNE's amendment effective Jan 1 2027; CAA October 2025 -> the adopted 2027 Standards effective Aug 1 2027; ARC-PA 5e -> 6e (with a stale C2.01 citation surviving inside Exxat's own 6e-titled guide); CSWE 2022 EPAS with review due by ~2029; the per-SPA edition churn behind CAEP; ACOTE's dated reissues of the 2023 standards; COA's dagger rows binding only students matriculating on/after Jan 1 2026"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in this research documents edition-crosswalk handling in any direction. leo-davinci.yaml's AAMC business rules flagging data errors pre-submission is validation, not versioning."
        gap_severity: "gap"
        gap_note: "The clearest NEW requirement this extension surfaces. Prism already carries dual 2024/2016 numbering inside five CAPTE report titles, so the concept exists as report metadata — but it is metadata on a report, not a versioned attribute on the standard, and the Standards screen's deactivate toggle CASCADE-DELETES every mapping made against a standard, which makes an edition transition destructive rather than migratory. Eight of the eight disciplines in this stage have an edition event either recently past or already scheduled. COA adds a second dimension the others do not: cohort-conditional effectivity, where two matriculation years in the same course offering are held to different thresholds."
      - element: "Standard-severity / standard-state attribute"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "COA's critical-concern asterisk across F.7, F.1, F.5, A.3, A.10, E.2, G.3, H.1.1, H.1.2, H.1.6, six Standard B elements and all fifty of D.1-D.50 (../accreditation/coa.yaml); CAPTE's active STAY on Standard 2B, which instructs programs not to respond to it at all and warns that further stays may follow (../accreditation/capte.yaml)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents severity or state on a standard. New Innovations tracks the severity of a finding after the fact (new-innovations.yaml), which is a different object."
        gap_severity: "gap"
        gap_note: "Two accreditors, researched independently, attach a per-standard state that changes how a program must respond, and the standards object can represent neither. capability-map.yaml already flags COA's convention as informing 'how a unified Accreditation Management pillar surfaces risk across accreditors of different rigor.' A stay additionally needs a SUPPRESSED state distinct from deactivated, because deactivation destroys mappings — so the two requirements are one field with at least three values, not two features."
      - element: "Public-page publication with a recurrence/recency clock"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "ACOTE Standard A.4.2 (three-year outcome table plus an active NBCOT link on the program HOME PAGE); CAA Standard 1.9 (three-year table under the verbatim label 'Student Achievement Data' or 'Student Outcome Data,' segmented per modality); CSWE AS 5.0.1(d) (Form B5.0.1(d)/M5.0.1(d) on the program webpage, refreshed at least every two years, hyperlinked to CSWE); COA Standard G.3 (CRITICAL — annual publication on a site linked to COA's List of Accredited Programs); ARC-PA Element A3.11 c (NCCPA's five-year report, distant campuses broken out individually, by April 1 each year); CAEP's EPP Annual Report requirement that the annual measures display on the EPP's OWN public website; plus CAPTE Element 5B and COCA Element 11.4 from the expansion side"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents publishing an accreditor-required metric to a public URL. e-value.yaml's 'automated alerts for accreditation tasks and policy expirations' is the nearest adjacent mechanic and covers the clock, not the publication."
        gap_severity: "gap"
        gap_note: "Six of the eight existing disciplines plus two expansion accreditors require a program-owned PUBLIC page carrying accreditor-specified figures on a recurring cycle, with three different cadences (annual, two-yearly, and a hard April 1 date) and at least two prescribed labels or layouts. caep.yaml reaches the same conclusion from the TE side — 'publish an accreditor-required metric to a public URL' is a cross-accreditor primitive rather than a COCA quirk. No shipped pillar publishes anything outward, so this is a genuinely new surface rather than a report variant, and it is the most repeated single requirement across the twelve accreditor registries in this repo."
      - element: "Post-graduation outcome object"
        type: "not shipped"
        data_shown: "N/A"
        gates_on: []
        accreditation_citation: "CAPTE Element 1C3 (90% employment rate over two years); ACOTE Standard A.6.3 (graduate job placement, employer satisfaction, alumni scholarly activity among its eleven enumerated streams); CSWE AS 5.0.3 (graduation rate plus at least one additional outcome, three most recent years, against a program-set benchmark); CCNE Key Element IV-E and ACEN Criterion 5.4 (80% employment; response rate reported as a first-class metric); COA Standards H.1.4/H.1.5/H.1.6.3 and G.3.4.2 (alumni and employer evaluation; employment within 6 months); CAEP Components R4.1 and R4.3 (completer effectiveness and completer satisfaction); CAA Standard 4.8 (documentation available to graduates and non-completing attendees); plus COCA Element 11.5 from the expansion side"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents an alumni or completer entity surviving graduation. one45.yaml's Analytics spans admissions through evaluation but stops at the program boundary as well."
        gap_severity: "gap"
        gap_note: "Every one of the eight existing disciplines needs this and none of them has it — Prism's student record ends at conferral. Three registries note the same downstream consequence from different angles: capte.yaml (residency/fellowship tracking, employment rate, and licensure rate all blocked by one missing entity), caa-asha.yaml (the CCC-SLP application is filed AFTER graduation, which is exactly when the hours verification is needed), and caep.yaml (an alumni contact list must stay current for three-plus years or the completer survey is worthless). caep.yaml also supplies the scoping discipline: CAEP R4.1's state-owned P-12 growth data is largely unobtainable, so the honest product answer is 'support the case-study and observation route well,' not 'integrate state longitudinal data systems.'"
    action: "N/A"
    confirmed_by: "../prism/capability-map.yaml, 'Accreditation Management' pillar entry (status: roadmap, target: Q3 2027) and its notes recording six accreditor-specific precedents across five disciplines, the CAPTE edition-crosswalk precedent, the KASA document-generation precedent, COA's critical-standard convention, and the CSWE honest-partial-coverage precedent; ../accreditation/capte.yaml, acote.yaml, arc-pa.yaml, caa-asha.yaml, nursing.yaml, coa.yaml, cswe.yaml, caep.yaml, coca.yaml, lcme.yaml, acpe.yaml, coda.yaml"

