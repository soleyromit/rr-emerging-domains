# Element-level ground truth underneath rotation-lifecycle.yaml, stage 8.
# See _TEMPLATE.yaml for field conventions (SCHEMA v2: analysis fields live per element).
# Every accreditation_citation and competitor_equivalent claim below traces to a real
# source file in confirmed_by — never re-derived from the journey's own synthesis.
#
# COVERAGE NOTE (2026-08-25): this file originally covered only the four expansion
# domains (DO, Pharmacy, Dentistry, Medicine) plus the PT/PTA precedent. It has been
# extended to cover the eight disciplines Exxat Prism serves TODAY — PT/PTA, OT/OTA,
# PA, SLP, Nursing, Social Work, Teacher Education, and CRNA — because stage 8 is the
# one stage where each accreditor's requirements stop being narrative and become a
# concrete, field-shaped report. Every existing-discipline claim below is grounded in
# the accreditor registry built for that discipline in ../accreditation/ (capte,
# acote, arc-pa, caa-asha, nursing, coa, cswe, caep) plus that discipline's playbook.
#
# COMPETITOR-COVERAGE FINDING, stated once and referenced throughout: across all nine
# competitor teardowns in ../competitors/, EVERY named-standard accreditation claim is
# for ACGME, LCME, CACMS, COCA, ACPE, CODA, or ARC-PA. Not one teardown documents a
# competitor artifact against CAPTE, ACOTE, CAA/ASHA, CCNE, ACEN, COA, CSWE, or CAEP.
# So for six of the eight existing disciplines there is genuinely NOTHING to compare
# against at element level, and that is recorded as such below rather than papered
# over with screen-level vagueness. The two exceptions are PA (Elentra names ARC-PA
# report alignment) and the generic CQI loop (New Innovations ships citation/concern
# tracking inside its ACGME Annual Program Evaluation).
flow_name: "Post-Rotation Rollup: Cross-Site Comparability, CQI Closure & Accreditation Evidence"
maps_to_journey: "rotation-lifecycle.yaml, stage 8"
persona: "Compliance / Accreditation Liaison (../personas/role-compliance-accreditation-liaison.yaml), working alongside the Program Administrator who holds most of the underlying screen access"
steps:
  - screen: "School Profile > Accreditation card"
    navigation_path: "Program Details > Setup > School Profile > Accreditation"
    elements:
      - element: "+ / pencil icon to add or edit an accreditation entry"
        type: "record editor (drawer)"
        data_shown: "Name of accrediting body; Accreditation status; Type of accreditation; Accreditation details (free text); Next accreditation date; Most recent accreditation date"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.9; LCME Standard 1, Element 1.1 (institutional accreditation-status record only — these are free-text/date metadata fields, not standard-level evidence)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in this research documents an equivalently-scoped accreditation-status editor; e-value.yaml's 'Accreditation Automation' feature page markets dashboards and scorecards at a feature-name level, not field-by-field, so a like-for-like element comparison isn't supportable from public docs."
        gap_severity: "cosmetic"
        gap_note: "The drawer captures who/what/when as free text and dates. There is no field that ties an entry to a specific standard number or to supporting evidence, which is what COCA 11.9 and ACPE 7.5.b actually require."
      - element: "Accreditation entries list"
        type: "read-only rollup, repeatable per accreditor"
        data_shown: "One entry per accrediting body the program holds status with"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.9; LCME Standard 1, Element 1.1 (institutional accreditation-status record, not standard-level evidence)"
        competitor_equivalent: "Not comparable at element level — e-value.yaml documents MedHub/E*Value's accreditation dashboards only by feature name, with no disclosed per-accreditor record list to compare this rollup against."
        gap_severity: "cosmetic"
        gap_note: "A read-only list of status records per accreditor. It is a metadata roster, not a standards-to-evidence mapping, so it satisfies nothing COCA 11.9 or ACPE 7.5.b require beyond recording that a status exists."
      - element: "Accreditation entries list — repeatability across a MULTI-ACCREDITOR STACK (Nursing / CRNA clause)"
        type: "read-only rollup, repeatable per accreditor"
        data_shown: "One entry per body; a nurse anesthesia track can legitimately need three (COA for the CRNA track, CCNE or ACEN for the DNP around it, and the state board of nursing's program approval)"
        gates_on: []
        accreditation_citation: "COA Standard A.12 (program acts in accordance with the Accreditation Policies and Procedures Manual — see ../accreditation/coa.yaml); CCNE Standard IV, Key Element IV-A and ACEN Standard 5, Criterion 5.1 (both require a written systematic evaluation plan per program type — see ../accreditation/nursing.yaml)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in ../competitors/ documents ANY nursing accreditor (CCNE, ACEN, or COA) by name; every named-standard claim across the nine files is ACGME/LCME/CACMS/COCA/ACPE/CODA/ARC-PA. There is nothing to compare a three-body accreditation stack against."
        gap_severity: "cosmetic"
        gap_note: "The repeatable-entry model is enough to RECORD all three bodies, which nursing.yaml confirms ('Prism's Accreditation record already stores repeatable accrediting-body entries, so a program can record both its accreditor and its board approval'). What it cannot express is that the three carry different rules over the same data: state boards outrank the accreditor on clock hours, ratios, and simulation caps (ACEN Criterion 4.6 explicitly defers to 'regulatory agencies'), and nothing encodes a per-state rule table. The card is a roster, not a rule stack."
      - element: "Accreditation entries list — one entry per DEGREE LEVEL (OT/OTA clause)"
        type: "read-only rollup"
        data_shown: "The OT playbook documents a school running both MSOT and OTD adding both as separate accreditation details under one accrediting body"
        gates_on: []
        accreditation_citation: "ACOTE Standard A.4.2 with A.6.5 (publication of program outcomes and the graduation-rate formula, applied per degree level — ACOTE holds doctoral, master's, baccalaureate, and associate programs to four parallel standard columns in one document; see ../accreditation/acote.yaml)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents ACOTE at all, so degree-level segmentation of an accreditation record has no competitor artifact to measure against."
        gap_severity: "configure-needed"
        gap_note: "Multiple entries per body is supported and is how OT programs already use it. The limitation is that the degree level lives in free text, so nothing downstream (report, threshold, or standard set) is keyed to it — which matters because ACOTE's Level II length rule is degree-level-conditional inside ONE standard number (24 weeks OT vs. 16 weeks OTA at C.1.12) and a single university often runs both in one tenant."
      - element: "View-only site-visitor access (provisioned by Exxat support, not on this card)"
        type: "access grant, support-gated"
        data_shown: "Read-only account for an external reviewer during an accreditation site visit"
        gates_on: ["Requires an Exxat support / Account Manager request — not admin self-service"]
        accreditation_citation: "CAEP Standard R5, Component R5.1 — 'Verification of the Quality Assurance System through demonstration,' i.e. the artifact CAEP expects is a LIVE system walkthrough, not a PDF binder (see ../accreditation/caep.yaml); COA Accreditation Policies and Procedures Manual (site visits as a COA-side assessment mechanism, ../accreditation/coa.yaml)"
        competitor_equivalent: "Not comparable at element level — e-value.yaml documents MedHub's 'CLER visit/letter/response-action tracking' as a shipped feature, but that tracks the visit as a workflow object; no competitor teardown discloses a reviewer-scoped read-only role, so the comparison is between two different things rather than field-by-field."
        gap_severity: "configure-needed"
        gap_note: "The strongest existing answer to the one accreditor requirement a binder structurally cannot satisfy. Two limits: it is a support request rather than a first-class role (OT playbook records Exxat staff 'providing view-only access for site visitors and assisting with report generation when needed'), and it is not scoped to an accreditation cycle or to a standard set — a reviewer either gets read access or does not. caep.yaml names 'a read-only reviewer role scoped to one accreditation cycle' as a concrete differentiating feature request; this is the raw material for it, not the feature."
    action: "Admin manually records the program's institution-level accreditation status per accreditor (e.g. COCA, LCME, ACPE, CODA — or, for existing disciplines, CAPTE, ACOTE, ARC-PA, CAA, CCNE/ACEN, COA, CSWE, CAEP) as free-text/date fields. For a site visit, a separate support request provisions read-only reviewer access."
    confirmed_by: "'Managing Program Details via Setup.md' (Help for Program Administrators > Step-by-Step Guides > Program Details), section 'Accreditation'; OT Playbook.md lines 112-118 (accreditation fields, both MSOT and OTD addable, Exxat-assisted site-visitor view-only access); Nursing Playbook.md lines 112-120 (ACEN/CCNE/COA standards reference and the critical-standard convention); ../accreditation/coa.yaml, ../accreditation/nursing.yaml, ../accreditation/acote.yaml, ../accreditation/caep.yaml"

  - screen: "Curriculum Mapping > Standards management"
    navigation_path: "Curriculum Mapping > Program Details > Standards"
    elements:
      - element: "Pre-populated accreditation standards list (left panel)"
        type: "read-only list, domain-scoped"
        data_shown: "Every accreditor standard pre-loaded for the program's configured domain"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.4; ACPE Standard 2, Element 2.2.d (this list is the taxonomy load point a COCA/LCME/ACPE/CODA standard set would occupy; confirmed in ../accreditation/coca.yaml and ../accreditation/acpe.yaml as prism_fit: Configure/Transfer)"
        competitor_equivalent: "Elentra markets 'tag-based accreditation-standard linkage' at a comparable conceptual level (elentra.yaml), but its public pages do not disclose whether standard sets ship pre-loaded per accreditor, so this stays a feature-level, not element-level, comparison."
        gap_severity: "none"
        gap_note: "Shipped and generic across accreditors already — ARC-PA and ACOTE standard sets are pre-loaded on this same panel today. The four new domains need a content load here, not engineering."
      - element: "Pre-populated standards list — CONFIRMED LOADED SETS for the eight existing disciplines"
        type: "read-only list, domain-scoped"
        data_shown: "ARC-PA 6th Edition (PA); ACOTE split four ways by degree level — Doctoral 2023 + legacy 2018, Master's 2023, Baccalaureate 2023, Associate 2023 — plus an NBCOT set for OTR; AACN Essentials pre-populated for Nursing; CAA Standards and CFCC Standards as two separate sets for SLP"
        gates_on: []
        accreditation_citation: "ARC-PA Standard B1, Elements B1.01 a-d and B1.02 (../accreditation/arc-pa.yaml, prism_fit: Transfer); ACOTE Standard A.5.1 (../accreditation/acote.yaml, prism_fit: Transfer); CCNE Standard I, Key Element I-B — CCNE does not merely recommend the AACN Essentials, it REQUIRES the 10 Domains / 8 Concepts / 45 Competencies (../accreditation/nursing.yaml); CAA Standard 3.1B sub-elements 3.1.1B-3.1.6B (../accreditation/caa-asha.yaml)"
        competitor_equivalent: "Elentra's Medicine discipline page names ARC-PA specifically among the standards it reports against (elentra.yaml) — the only genuine element-adjacent competitor comparison available anywhere in this stage, and it is for ONE of the eight disciplines. Elentra names no PT, OT, SLP, nursing, social work, or teacher-education accreditor; neither does any other teardown."
        gap_severity: "none"
        gap_note: "This is the strongest single proof that the Accreditation Management build is a generalization rather than a new capability: four accreditor families are already loaded, one of them (ACOTE) split four ways by degree level and one of them (SLP) carrying two independently-revised sets side by side. Two disciplines are NOT loaded and should not be claimed: CSWE's nine competencies run as a program-authored custom set under 'Program Specific Standards' (cswe.yaml AS 3.1.2), and caep.yaml states there is no evidence InTASC or CAEP R1-R5 ships pre-loaded at all."
      - element: "Activate / Deactivate toggle"
        type: "toggle"
        data_shown: "Checkmark = active standard, usable for curriculum mapping"
        gates_on: ["Deactivating a standard cascades to delete every mapping already made against it"]
        accreditation_citation: "COCA Standard 6, Element 6.4; ACPE Standard 2, Element 2.2.d (this toggle is what makes a standard available as a mapping target)"
        competitor_equivalent: "Not comparable at element level — elentra.yaml documents tag-based standard linkage but discloses no activate/deactivate mechanic, and nothing about cascade-delete behavior, so there is no competitor equivalent to compare this toggle against."
        gap_severity: "none"
        gap_note: "Shipped and works generically across accreditors. Worth flagging for a taxonomy migration: per gates_on, deactivating a standard cascade-deletes every mapping already made against it, so an edition change (e.g. a CAPTE-style 2016-to-2024 renumber) is destructive rather than versioned."
      - element: "Activate / Deactivate toggle — EDITION-CHURN EXPOSURE across the eight existing disciplines"
        type: "toggle"
        data_shown: "The same cascade-delete behavior, applied to standard sets that are all mid-revision right now"
        gates_on: ["Deactivating a standard cascade-deletes every mapping made against it — there is no versioned migration path"]
        accreditation_citation: "CAPTE 2024 Standards, effective for all programs Jan 1 2026, superseding the 2016 edition (../accreditation/capte.yaml); CCNE Standard I, Key Element I-B — Prism's loaded Essentials are documented against the 2021 edition while CCNE's 2026 amendment exists precisely because AACN reissued them, effective Jan 1 2027 (../accreditation/nursing.yaml); CAA's separately adopted 2027 Standards effective Aug 1 2027 (../accreditation/caa-asha.yaml); CSWE bylaws requiring EPAS review at intervals not exceeding 7 years, next expected ~2029 (../accreditation/cswe.yaml); the per-SPA edition churn behind CAEP (ACTFL 2026, ALA/AASL 2019, AMLE 2022, CEC, NPBEA/NELP 2018 — see ../accreditation/caep.yaml)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in this research documents how any competitor handles an accreditor edition renumber. leo-davinci.yaml is the nearest adjacent claim (AAMC Curriculum Inventory business rules that flag data errors PRE-submission), which is validation rather than versioning."
        gap_severity: "gap"
        gap_note: "This is the sharpest cross-discipline risk this stage surfaces, and it is not hypothetical: four of the eight served disciplines have a standards edition landing between now and 2029. Because deactivation cascade-deletes mappings, an edition transition destroys the very longitudinal mapping history a self-study trends. capte.yaml calls the CAPTE 2016-to-2024 renumber 'the concrete argument for making the edition crosswalk a first-class field in Accreditation Management'; caep.yaml independently calls SPA edition transitions 'a genuinely risky operation for a TE customer.' Two accreditor registries reached that conclusion separately, which is what makes it a product requirement rather than an opinion."
      - element: "+Add <Standard Name> drawer (Standard code / Standard description / Annotations)"
        type: "input fields"
        data_shown: "Custom sub-standard authoring beneath a pre-loaded accreditor standard"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.4; ACPE Standard 2, Element 2.2.d (program-specific sub-standards beneath the accreditor's own numbering)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in this research documents a custom sub-standard authoring form, so the comparison stops at Elentra's feature-level 'standard linkage' claim (elentra.yaml)."
        gap_severity: "none"
        gap_note: "Shipped. Lets a program extend an accreditor's standard set with its own sub-standards, which is the escape hatch for accreditor language that does not decompose cleanly into the pre-loaded taxonomy."
      - element: "+Add drawer used to carry SEVERAL FRAMEWORKS AT ONCE (Nursing / Social Work / Teacher Education clause)"
        type: "input fields, repeatable per standard set"
        data_shown: "Nursing maps one course objective simultaneously to AACN Essentials + NONPF + IPEC + the four spheres of care + program SLOs; Social Work runs one generalist set plus one per area of specialized practice; Teacher Education needs InTASC + CAEP + the relevant SPA + the state's own standards"
        gates_on: []
        accreditation_citation: "CSWE Accreditation Standard M3.2, AS M3.2.1 (MSW programs must carry the extended and enhanced version of all nine competencies per specialization — ../accreditation/cswe.yaml); CAEP Standard R1, Component R1.1 (CAEP components wrap named InTASC standards, so the mapping target is InTASC with a CAEP rollup — ../accreditation/caep.yaml); CCNE Standard I, Key Element I-B (../accreditation/nursing.yaml)"
        competitor_equivalent: "one45 documents 'standardized vocabularies aligned to CanMEDS and AAMC competency frameworks' with version control and an audit trail (one45.yaml) — genuinely multi-framework, and one45.yaml rates it 'at-parity' with Prism's Curriculum Mapping. That is the closest real comparison in this stage, and it is at framework-inventory level, not at the field level of this drawer."
        gap_severity: "none"
        gap_note: "Shipped and proven — nursing.yaml treats the multi-framework case as settled ('nothing here needs building'), and cswe.yaml confirms the dual generalist/specialization shape is 'already a solved problem.' The unbuilt half is CONSISTENCY: cswe.yaml notes nothing enforces that the client system levels named in AS M3.2.1 match those in AS M3.2.4 and AS 5.0.1(a), which is exactly what CSWE audits. A cross-standard divergence check is named there as 'a small, high-credibility Accreditation Management feature.'"
    action: "Admin activates the accreditor's standard set and, if needed, adds program-specific sub-standards or additional parallel frameworks beneath it — this is the configuration step a COCA/LCME/ACPE/CODA taxonomy load would use, and the step CSWE and CAEP programs already use because their sets do not ship pre-loaded."
    confirmed_by: "'Managing Accreditation Standards for Curriculum Mapping.md' (Help for Program Administrators > Step-by-Step Guides > Curriculum Mapping); OT Playbook.md line 146 (four ACOTE degree-level sets plus NBCOT for OTR); Nursing Playbook.md line 41 (Standards pre-populated with AACN Essentials); SLP Playbook.md lines 41-45 (CAA + CFCC sets loaded as two independently-revised standard sets; the Mapped Standards Report as the gap-identification surface over them; and 'beyond KASA' framework mapping requiring CSS/Account Manager assistance rather than self-service); SW Playbook.md lines 56-59 (nine CSWE competencies configured as a custom framework); ../accreditation/capte.yaml, nursing.yaml, caa-asha.yaml, cswe.yaml, caep.yaml"

  - screen: "Curriculum Mapping > Mapping Reports > Heatmap Report"
    navigation_path: "Curriculum Mapping > [select Curriculum] > Mapping Reports > [select standard] > Other Reports > Heatmap Report"
    elements:
      - element: "Heatmap grid"
        type: "read-only rollup, cross-tabulation"
        data_shown: "X-axis = accreditation standards; Y-axis = course offering name/number; cell = count of mapped course measures"
        gates_on: []
        accreditation_citation: "ARC-PA 6th Edition (confirmed live today); the same grid would need COCA/LCME/ACPE/CODA edition-specific configuration for the new domains"
        competitor_equivalent: "No competitor teardown documents a directly comparable course-by-standard heatmap at element level; core-elms.yaml notes CORE ELMS ships ACPE-aligned 'curriculum gap analysis' by name but does not disclose its visual or interaction shape, so the comparison stops at feature-name parity."
        gap_severity: "none"
        gap_note: "Shipped, and generic once a standard set is loaded. Scope caveat: cells count course-to-standard mappings, i.e. curriculum coverage — not site-by-outcome comparability. It does not touch what COCA 6.11 or LCME 8.7 require (see step 5), and capability-map.yaml is explicit that the two should not be conflated."
      - element: "Heatmap grid — DOWNLOAD (absent)"
        type: "missing export control"
        data_shown: "N/A — the PA playbook instructs CSS to advise programs to screenshot the grid"
        gates_on: []
        accreditation_citation: "ARC-PA Standard B1, Elements B1.01 a-d and B1.02 (../accreditation/arc-pa.yaml, which flags this defect explicitly: 'For a report whose entire purpose is accreditation-readiness evidence, screenshot-as-export is a real gap')"
        competitor_equivalent: "leo-davinci.yaml documents Leo's Insights Dashboard as an aggregated accreditation-readiness surface and Leo as an AAMC-authorized Curriculum Inventory vendor with one-click submission since 2013; that is a submission pipeline where this element has no export at all. Leo's public pages do not decompose the dashboard's export options, so the comparison holds at the workflow level."
        gap_severity: "gap"
        gap_note: "Confirmed in Exxat's own PA playbook as a CSS advisory, not an inference: the Heatmap cannot be downloaded. Every other Mapping Report in the suite exports. A screenshot is not an auditable exhibit, so for any accreditor that wants the coverage matrix in the self-study — ARC-PA B1, CAA 3.1.1B-3.1.6B, CAEP R5.1 — the liaison retypes it. Small, well-defined, and the cheapest fix identified in this stage."
      - element: "Hover tooltip"
        type: "read-only detail"
        data_shown: "Standard code, course details, total measures mapped for that cell"
        gates_on: []
        accreditation_citation: "ARC-PA 6th Edition (confirmed live today); surfaces the standard code for a cell, so it inherits whichever standard set is configured"
        competitor_equivalent: "Not comparable at element level — core-elms.yaml names ACPE-aligned 'curriculum gap analysis' as a feature but discloses no drill-down or tooltip behavior to compare against."
        gap_severity: "none"
        gap_note: "Shipped read-only drill-down on the grid. Same scope caveat as the grid: it explains a coverage count, not an outcome comparison."
      - element: "Color legend"
        type: "read-only legend"
        data_shown: "Distribution of mapping counts, min-to-max, darker = more mappings"
        gates_on: []
        accreditation_citation: "ARC-PA 6th Edition (confirmed live today) — legend is accreditor-agnostic, keyed to mapping counts rather than to any standard's own thresholds"
        competitor_equivalent: "Not comparable at element level — no competitor teardown in this research discloses heatmap scaling or legend behavior."
        gap_severity: "none"
        gap_note: "Shipped. Scaled min-to-max by mapping count, so shading is relative to the program's own data — there is no accreditor-defined threshold or target band behind the colors."
      - element: "Crosswalk Report (Nursing sibling report on the same pillar)"
        type: "read-only rollup, cross-tabulation with a depth dimension"
        data_shown: "AACN Essentials by row, course/objective by column; each cell records BOTH content type (knowledge- / skill- / behavior-based) AND depth (introduced / reinforced / demonstrated)"
        gates_on: []
        accreditation_citation: "CCNE Standard III, Key Elements III-B through III-E (a separate demonstration per degree program AND per track of where the Domains, Concepts and 45 Competencies are incorporated — ../accreditation/nursing.yaml); the same depth axis is what CAEP Standard R1, Component R1.1 needs for the InTASC Learning Progressions (../accreditation/caep.yaml names this report as 'the closest existing analogue to InTASC learning progressions in the product')"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents CCNE or ACEN at all. elentra.yaml's '>40% of the CACMS Data Collection Instrument covered' is the nearest structural analogue (an accreditor's own instrument mirrored in the mapping tool) but it is a different accreditor and a different instrument."
        gap_severity: "none"
        gap_note: "Shipped, and modelled directly on AACN's own Essentials Toolkit crosswalk template — i.e. a second accreditor-format-matched report alongside PA's B2 export. The reason it belongs in this stage: it is the only mapping report in the product carrying a depth dimension rather than a flat mapped/not-mapped bit, which is precisely what CAEP's learning-progression language and CCNE's per-track demonstration both need. Currently nursing-only."
    action: "Admin reviews which courses cover which standards, and how thoroughly, as a curriculum-coverage accreditation-readiness check — then, for PA, screenshots it, because the Heatmap has no export."
    confirmed_by: "'Heatmap Report.md' (Help for Program Administrators > Step-by-Step Guides > Curriculum Mapping Reports); ../prism/capability-map.yaml lines ~446-461 and ~568-577; PA Playbook.md line 73 ('this report cannot be downloaded — advise programs to screenshot it'); Nursing Playbook.md line 56 (Crosswalk Report, Essentials-by-row with knowledge/skill/behavior and introduced/reinforced/demonstrated); ../accreditation/nursing.yaml, ../accreditation/caep.yaml"

  - screen: "Curriculum Mapping > Mapping Reports > Mapping Tags Report"
    navigation_path: "Curriculum Mapping > Mapping Reports > [select curriculum/standard] > Mapping Tags tile > [click a tag bar]"
    elements:
      - element: "Tag bars (e.g. 'Needs Review', 'Reviewed')"
        type: "clickable read-only rollup"
        data_shown: "Count of mappings carrying each free-form colored tag"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (closed-loop finding -> action -> evidence — this tag mechanism is the nearest existing building block, not a fit)"
        competitor_equivalent: "New Innovations ships 'Annual Program Evaluations (APE): Cross-program performance review with trend analysis and citation/concern tracking' (new-innovations.yaml, rated 'ahead') — a named finding-tracking object where this is a two-state colored label. New Innovations' public GME page does not decompose the citation/concern record's fields, so the comparison is object-level, not field-by-field. This is the single closest documented competitor equivalent to a CQI loop anywhere in ../competitors/."
        gap_severity: "gap"
        gap_note: "A tag is a free-form label, not a finding object. Nothing links a tag to the specific programmatic change made in response, and a count of tagged mappings is not a queue with ownership, due date, or closure state."
      - element: "Tag detail report / Word export"
        type: "report export"
        data_shown: "Every mapping instance carrying the selected tag"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (the nearest shipped analog to a finding register; does not satisfy the element)"
        competitor_equivalent: "Not comparable at element level — no competitor teardown documents an equivalent tag-filtered QA export."
        gap_severity: "gap"
        gap_note: "The export lists mapping instances carrying a tag. There is no evidence attachment and no per-academic-year queryability, so it cannot be pulled as a self-study exhibit showing a finding, the action taken, and the resulting evidence. This confirms — rather than merely re-asserts — that COCA 11.1 stays Gap: the nearest shipped mechanism does not do what the standard requires, it is simply the closest analog available today."
      - element: "Tag object — MISSING FIELDS the eight existing accreditors each name explicitly"
        type: "absent fields on a shipped object"
        data_shown: "N/A — a tag carries a label and a color; it carries no cited data point, no stakeholder group, no disposition, no re-measurement"
        gates_on: []
        accreditation_citation: "CAA Standard 5.0, Standards 5.4 and 5.8 — the program must EVALUATE the improvement, not merely log it, so the object needs a re-measurement field rather than a close-out (../accreditation/caa-asha.yaml); CAEP Standard R5, Component R5.4 — the decision grid names a STAKEHOLDER GROUP as a required field and CAEP explicitly expects records of changes that did NOT improve outcomes, so the object must not be modelled as a remediation tracker (../accreditation/caep.yaml); CAPTE Standard 2, Element 2C — two worked examples of change within the LAST FOUR YEARS, each with rationale, process, timeline and reassessment result, which needs a queryable timestamp and an exemplar flag (../accreditation/capte.yaml); ACOTE Standard A.6.3 — eleven ENUMERATED data streams analysed EACH ACADEMIC YEAR with an annual report of planned action responses (../accreditation/acote.yaml); CSWE Accreditation Standard 5.0, AS 5.0.1(c) — specific curricular changes with CLEAR LINKS TO THE DATA (../accreditation/cswe.yaml); CCNE Standard IV, Key Element IV-F and ACEN Standard 5, Criterion 5.1(d)-(f) (../accreditation/nursing.yaml); ARC-PA Standard C1, Element C1.01 — the standard's verb is not 'collect' but 'create self-improvement action plans' (../accreditation/arc-pa.yaml); COA Standard H.2 (../accreditation/coa.yaml)"
        competitor_equivalent: "New Innovations' APE citation/concern tracking (new-innovations.yaml) and MedHub/E*Value's customizable Annual Program Evaluation forms with CLER letter/response-action tracking (e-value.yaml) are both shipped finding-to-response objects — but BOTH are ACGME-shaped, and neither vendor publishes the object's field list. Critically, neither is documented against any of the eight accreditors in this stage, so no competitor is proven to satisfy CAA 5.4's re-measurement clause or CAEP R5.4's stakeholder-group field either."
        gap_severity: "gap"
        gap_note: "Eight independent accreditor registries, researched separately, each land on the same missing object and each add one field the others do not: re-measurement (CAA), stakeholder group plus a keep/modify/discontinue disposition plus tolerance for changes that failed (CAEP), a four-year lookback window with an exemplar flag (CAPTE), a fixed eleven-stream annual template (ACOTE), a link to the specific data point (CSWE), and a three-year retention of the analysis itself rather than just the numbers (ACEN 5.1). That convergence is the argument acote.yaml, caa-asha.yaml, cswe.yaml, caep.yaml and nursing.yaml all make independently: this belongs as a first-class object type in Accreditation Management, not bolted onto Curriculum Mapping. ACOTE's version is the useful scoping detail — because A.6.3's list is enumerated and fixed at eleven streams, an ACOTE build can be a fixed report template rather than a generic evidence binder."
    action: "A curriculum owner filters mappings by a QA tag (e.g. clears a 'Needs Review' queue by re-tagging items 'Reviewed' once addressed) — the closest existing analog to a finding-tracking workflow, and the mechanism every one of the eight existing accreditors' CQI standards falls back to today."
    confirmed_by: "'Mapping Tags Report for Curriculum Mapping.md' (Help for Program Administrators > Step-by-Step Guides > Curriculum Mapping Reports); ../prism/capability-map.yaml lines ~510-523; ../accreditation/caa-asha.yaml (Standards 5.4/5.8), ../accreditation/caep.yaml (R5.4), ../accreditation/capte.yaml (2C), ../accreditation/acote.yaml (A.6.3), ../accreditation/cswe.yaml (5.0.1(c)), ../accreditation/nursing.yaml (IV-F, 5.1), ../accreditation/arc-pa.yaml (C1.01), ../accreditation/coa.yaml (H.2)"

