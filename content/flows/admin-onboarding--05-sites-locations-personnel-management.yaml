        gates_on: []
        accreditation_citation: "The literal evidence artifact for LCME 1.4, CODA 4-6, ACPE 3.5.b and COCA Standard 6, Element 6.9 ('executed affiliation agreements for every contracted clinical site')."
        competitor_equivalent: "CORE ELMS 'HIPAA-compliant document storage' (core-elms.yaml) and eMedley eKeeper (emedley.yaml) both store agreements; neither publishes archive/versioning behaviour."
