        competitor_equivalent: "Genuinely comparable and documented on both sides: eMedley eKeeper ships 'affiliation agreement tracking with auto-expiration reminders' (emedley.yaml) and CORE ELMS ships 'affiliation agreement tracking with expiration alerts' (core-elms.yaml). Neither publishes configurable lead time, frequency, or recipient selection, so Prism's configurability is plausibly a differentiator but cannot be proven ahead from public sources."
