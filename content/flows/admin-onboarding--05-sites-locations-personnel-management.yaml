        gap_severity: "gap"
        gap_note: "Not self-serve. A brand-new program cannot load its own contract templates; it is a support-ticket dependency, the same pattern as the site-sharing model (step 3) and the administrative-positions list (step 16). For a day-one admin these are the three places where 'setup' quietly means 'ask Exxat'."
