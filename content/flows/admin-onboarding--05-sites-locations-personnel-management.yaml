      - element: "Comprehensive Personnel Report (counts: total personnel, total preceptors, personnel missing information types; drill-through by clicking a count; Download Detailed Report; search/filter/wrench column editor)"
        type: "roster completeness report with drill-through"
        data_shown: "Data-quality census of the personnel directory."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (roster-level reporting on preceptor credentials) — the 'missing information' counts are the practical bridge between a directory and a defensible preceptor roster."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Purpose-built for exactly the post-migration data-quality problem that step 11's missing personnel import creates — a good mitigation, not a substitute."
      - element: "HRSA Grant Details Raw report (one row per location with HRSA info; filter, search, export, wrench column editor)"
        type: "grant-reporting extract"
        data_shown: "All location HRSA grant information in one place; source data entered per location (line 525)."
        gates_on: []
        accreditation_citation: "None — HRSA is a federal grant program, not an accreditor. Explicitly not an accreditation element; pairs with the rural/underserved location attributes from step 9."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor teardown mentions federal grant reporting. (New Innovations' IRIS/Medicare Cost Report automation, new-innovations.yaml, is GME funding, a different program entirely.)"
        gap_severity: "none"
        gap_note: "A narrow but genuinely differentiated capability for HRSA-funded programs, notably relevant to nursing, PA and rural-track medicine."
      - element: "Explore Locations map (search-type selector, filters by location area / settings / tags, Draw Miles Radius from the program address, Reset All, click-through location summary)"
        type: "geographic verification view"
        data_shown: "All ACTIVE locations plotted, with a distance-radius query from the program's address and a per-location summary popup."
        gates_on: ["Active-only: inactive locations are invisible here, which is itself a verification signal"]
        accreditation_citation: "LCME Standard 5, Element 5.5 (Resources for Clinical Instruction — adequate numbers and types of sites) and COCA Standard 6, Element 6.9 (capacity adequacy) are geographic-sufficiency questions; the mileage radius is the closest thing in Prism to a coverage analysis, though it answers 'where are they' rather than 'are they enough'."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor teardown documents a mapping or distance-radius view of the site directory."
        gap_severity: "cosmetic"
        gap_note: "Shows distribution, not capacity: neither slot counts nor placement volume appear on the map, so the LCME 5.5 / COCA 6.9 adequacy question still requires the Slot Sufficiency Report (a Custom report under Sites > Reports, per the Nursing playbook) rather than this view."
      - element: "Faculty Information Report (all faculty with profile/demographic data; filter by status, rank, administrative position; export)"
        type: "roster report on a 24-hour refresh"
        data_shown: "Demographic and profile information for every faculty member in one table."
        gates_on: ["Staleness: 'this report gets updated every 24 hours. Therefore, edits to faculty member profiles will not be reflected immediately'"]
        accreditation_citation: "CODA Standard 3, Element 3-4 and the faculty-roster exhibits in LCME/COCA/ACPE self-studies — this plus Generate CV (step 20) is Prism's faculty-qualification evidence pair."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "The 24-hour lag is the only stated non-realtime report in this stage and will confuse a day-one admin who fixes a record and re-runs the report expecting the correction."

# ---------------------------------------------------------------------------
# DISCIPLINE VARIANCE WITHIN THIS STAGE (11 disciplines in scope: the four
# expansion domains — Medicine, DO, Dentistry, Pharmacy — plus PT, OT, PA,
# Nursing, SLP, Social Work, Teacher Education). Recorded here because these
# differences change what the SAME screens above mean, not what they do.
# ---------------------------------------------------------------------------
discipline_notes:
  - discipline: "Physical Therapy (PT/PTA)"
    note: >
      Two distinct personnel roles must both exist on the Sites > Personnel record: the SCCE
      (Site Coordinator for Clinical Education) who receives slot requests and assigns
      instructors, and the Clinical Instructor (CI) who supervises — and per the PT playbook
      "the SCCE is oftentimes also a CI", and a regional SCCE may cover many hospitals while one
      facility may have several SCCEs (one for IP, one for OP). The per-location designation and
      communication-preference overrides in step 11 are what make that expressible; a flat
      one-person-one-role model would not.
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical Therapy (PT) Playbook.md"
  - discipline: "Occupational Therapy (OT/OTA)"
    note: >
      Terminology is renamed wholesale: Sites -> Agencies, Rotations -> Fieldwork Education,
      Preceptor -> Fieldwork Educator (and Site Mentor for the doctoral capstone). ACOTE C.1.2
      (Student Access to Fieldwork Site Information) makes the 'Show on Explore Clinical
      Locations' toggle (step 9) a standards-relevant control rather than a convenience, and
      C.1.7/C.1.10/C.1.13 (fieldwork-educator ratios and qualifications) load the personnel
      licensure/certification cards (step 12).
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational Therapy (OT) Playbook.md"
  - discipline: "Physician Assistant (PA)"
    note: >
      PA programs run two different slot-sourcing models that place different weight on the same
      records: Site Based (the location provides slots, no advance preceptor assignment) versus
      Preceptor Based (the preceptor provides slots and "all locations associated with a preceptor
      are published to the student"). The Preceptor Based model makes the personnel-to-many-
      locations association from step 11 load-bearing rather than optional, and pairs with the
      'Follow the Preceptor' placement feature.
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md"
  - discipline: "Nursing"
    note: >
      The playbook is explicit that the preceptor lives "under Sites -> Personnel, not Faculty and
      Staff" — which means the faculty compliance engine (step 21) does NOT cover them, and the
      preceptor-license-expiry gap noted in step 12 lands hardest here. COA caps CRNA supervision
      at a hard 2:1 ratio (Standard F.7) assigned and monitored at Sites > Slots, and site-visit
      assessments map to COA F.4 with follow-up dates pushed to the Program Calendar. Site
      sufficiency evidence (ACEN 4.9, CCNE II-C, COA A.10/F.1) is drawn from the Sites database
      plus a Slot Sufficiency Report under Sites > Reports.
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing Playbook.md"
  - discipline: "Speech-Language Pathology (SLP)"
    note: >
      The supervisor is the Clinical Educator (the UI also calls them experiential supervisor in
      at least one email template), and the playbook states plainly that affiliation agreements
      are "stored, viewed, and monitored in the Sites module" — i.e. the step-7 Contracts tab is
      SLP's documented accreditation artifact. Every SLP clinical-log report filters by Site,
      Location and Clinical Educator, so directory hygiene in steps 4-12 directly determines
      whether the 400-hour/KASA reporting is sliceable.
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Speech-Language Pathology (SLP) Playbook.md"
  - discipline: "Social Work"
    note: >
      "Agency" is the consistent term for Site/Location, tracked in an Agencies module. Two
      supervisor roles must coexist on one placement: the CSWE-qualified Field Instructor and an
      on-site Task Supervisor who may lack the required SW degree ("alternative field
      instruction"). Prism's personnel model supports two associated people, but the
      qualification distinction that CSWE actually audits is not a structured attribute anywhere
      in step 11-12 — it would have to be carried in personnel categories or designation free text.
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social Work (SW) Playbook.md"
  - discipline: "Teacher Education"
    note: >
      The TE playbook explicitly warns that terminology (Cooperating Teacher / Mentor Teacher /
      University Supervisor, school districts as sites) is NOT confirmed for Exxat and should not
      be treated as Exxat-specific until verified. Structurally, a school district is a natural
      Site with schools as Locations, and the step-10 Move Location capability maps onto district
      reorganisation — but no TE source in this research confirms any of it, so this is the one
      discipline where stage-5 fit is inferred rather than documented.
    source: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Teacher Education (TE) Playbook.md"
  - discipline: "Medicine (MD) — expansion domain"
    note: >
      The clerkship model is a clinical TEAM (attending -> fellow -> resident -> intern), not a
      single preceptor, so the one-personnel-record-per-supervisor model in step 11 under-describes
      who actually supervised. LCME 1.4 demands clause-level affiliation-agreement content that
      step 7 stores only as an uploaded PDF, and LCME 5.5 demands site-level case-mix/acuity
      adequacy that no field in stage 5 captures. Site scarcity is the domain's defining pressure
      (44% of AAMC-surveyed schools report pressure to pay community preceptors) — which makes the
      step-5 Payment Details card unusually relevant here.
    source: "content/domains/medicine.yaml"
  - discipline: "Osteopathic Medicine (DO) — expansion domain"
    note: >
      COMs recruit hundreds of independent community preceptors across many small sites rather
      than a few large affiliates, which multiplies the per-record cost of the manual Add Personnel
      wizard (step 11) and makes the absence of a personnel importer the domain's sharpest
      friction. COCA 6.10 needs filterable attributes ('supervising physician is a DO', 'residents
      present at site', inpatient/outpatient) that stage 5 can only approximate through site
      categories, settings and personnel designations. Health-system consolidation makes the
      step-10 Move Location workflow disproportionately valuable — and its contracts-don't-move
      caveat disproportionately dangerous.
    source: "content/domains/do.yaml"
  - discipline: "Dentistry — expansion domain"
    note: >
      Most instruction happens in the school's OWN teaching clinic with chairside, per-procedure
      faculty supervision, so the site/location hierarchy is thin (often one site marked as its own
      location via the step-4 checkbox) while the FACULTY side carries the weight. CODA 4-6 applies
      to the off-campus community rotations, and CODA 2-6 (faculty calibration across sites) is the
      standard that faculty compliance in step 21 partially answers — this file's step-21 analysis
      is the direct evidence that coda.yaml's 'faculty-side calibration tracking is unconfirmed'
      hedge is now resolvable. axiUm, the incumbent, is a practice-management system built around
      that in-house clinic and documents no external site directory at all.
    source: "content/domains/dentistry.yaml; content/competitors/axium.yaml"
  - discipline: "Pharmacy — expansion domain"
    note: >
      One-to-one preceptor supervision with a hard 2:1 ratio cap (ACPE 3.3.e) and four mandatory
      APPE settings (community, ambulatory care, hospital/health-system, inpatient adult) make the
      Settings card (steps 5 and 10) the field the whole curriculum-coverage argument rests on, and
      the personnel Slots/Placements grids (step 12) the ratio's raw data. ACPE also requires a
      majority-U.S.-licensed-pharmacist calculation per student — a roster query against the
      licensure cards. Note that this stage's evidence should trigger a re-rating of acpe.yaml
      3.5.b from 'Gap' to 'Configure': the site contract repository it says does not exist is
      documented in the primary transcript at lines 399-419.
    source: "content/domains/pharmacy.yaml; content/accreditation/acpe.yaml"

