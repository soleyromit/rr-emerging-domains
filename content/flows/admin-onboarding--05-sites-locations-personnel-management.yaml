# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 5
# ("5. Sites, locations & personnel management").
#
# SOURCE DISCIPLINE (deliberate, and different from the four older journeys):
# every step below is confirmed FIRST against the raw program-administrator tutorial
# transcript at exxat_transcripts.md — the actual narrated
# product walkthrough — with line ranges and verbatim quotes. Help-center articles are
# cited only as a SECONDARY corroboration, or where the transcript is silent (e.g. the
# Experiential Supervisor Intake Form, which post-dates the 16-part tutorial series).
# Earlier flow files in this repo laundered this same transcript through help-center
# paraphrases and lost the primary citation; this file does not.
#
# SCOPE NOTE: this is DAY-ONE PRODUCT SETUP, not the clinical rotation lifecycle. The
# sibling flows rotation-lifecycle--01 / --02 and preceptor-site-onboarding--01 / --03
# walk the same Sites > Personnel and Contracts screens for the *operational* questions
# ("is this preceptor cleared for this placement?"). This file walks them for the
# *configuration* question: what a brand-new administrator must create, in what order,
# before any of those screens have data in them at all. Where a screen appears in both,
# the element analysis here is about setup mechanics (taxonomy lists, inheritance,
# migration, invitation), not about gating.
flow_name: "Standing Up the Site, Location & Personnel Directory"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 5"
persona: >
  Primarily the Program Administrator who is new to the platform (role-program-admin.yaml)
  performing first-time configuration — they own the Setup tab, the site-sharing model
  decision, and the faculty invitation. Secondary: the Clinical/Experiential Education
  Coordinator (role-clinical-coordinator.yaml), who inherits day-to-day personnel and
  contract upkeep once the directory exists, and the Institutional Administrator, who is
  the only role that can change contract organization lists when contracts are shared
  across programs (transcript, line 359-361).

steps:

  - screen: "Sites > Setup > Sites Organization"
    navigation_path: "Dashboard (or hamburger menu) > Sites > Setup tab > Sites Organization"
    action: >
      Before adding a single site, the new administrator defines the classification vocabulary
      the whole module will use — site/location categories, personnel categories, and location
      areas — because these lists become filter dimensions on every later grid and drive the
      student location-area wishlist.
    confirmed_by: >
      exxat_transcripts.md, "5/16 Setting up Sites and Locations in
      Exxat Prism" (lines 351-355): "Click on the Sites section from your dashboard or from the
      left hamburger menu, then click on the Setup tab and select the Sites Organization option.
      You can then set up site/location categories, personnel categories, and location areas."
      Corroborated by help-center mirror: Help for Program Administrators > Step-by-Step Guides
      (How-tos) > Sites > "Managing Site Organization and Auto-Notifications.md".
    elements:
      - element: "Site/Location Categories list (pencil icon > Add Site or Location Category)"
        type: "admin-managed lookup list (add / rename / delete)"
        data_shown: "Free-text category names used to group sites and locations — transcript examples: 'whether the site is a private or public office, whether a payment is required by the student.' Becomes a filter on the Sites and Locations grids."
        gates_on: ["Which values are selectable in the Categories card on every site and location profile", "The Categories option in the Sites-grid filter"]
        accreditation_citation: "COCA Standard 6, Element 6.11 (Comparability Across Clinical Education Sites) — indirectly: category tags are the dimension a program would later slice site-by-site outcome comparisons on. No accreditor prescribes a category taxonomy, so this is enabling structure, not evidence itself."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. CORE ELMS (core-elms.yaml) advertises 'centralized site/student/preceptor management' and eMedley (emedley.yaml) advertises 'site capacity management', but neither publishes whether the site taxonomy is admin-configurable at all, let alone its editing UX."
        gap_severity: "none"
        gap_note: "Ships as self-serve, unlimited, admin-editable free text. The only real day-one risk is sequencing: categories entered here must exist before a bulk-ish site build-out, and nothing in the UI warns a new admin of that ordering dependency."
      - element: "Personnel Categories list (pencil icon)"
        type: "admin-managed lookup list"
        data_shown: "Grouping labels for site personnel (preceptors, site contacts, experiential supervisors). Transcript: 'Personnel categories can be used for grouping site personnel.'"
        gates_on: ["Which values appear in the Categories card on a personnel profile", "Personnel-grid filter options"]
        accreditation_citation: "None — this is a platform-mechanics element with no direct accreditor tie. (Preceptor *qualification* evidence lives on the licensure/certification cards in step 12, not here.)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Location Areas list (pencil icon)"
        type: "admin-managed lookup list with locked system defaults"
        data_shown: "Geographic groupings students pick from in the location-area wishlist. Transcript: 'Students will be able to indicate their preferences for location areas using the location area wish list.'"
        gates_on: ["Student location-area wishlist options", "Locations-grid 'location area' filter (transcript line 527: the one filter the Locations tab has that the Sites tab does not)"]
        accreditation_citation: "None directly. Relevant to ACPE Standard 3 multi-state licensure texture (acpe.yaml, 'site records need a per-state licensure/compliance dimension') only if a program chooses to model areas by state — the field does not enforce that."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Transcript line 355: 'you will not be able to change the in area, out area, or out of state options as they are the default option set up at central level.' A new admin whose program thinks in regions/consortia rather than in/out-of-area inherits three immovable rows they must design around."
      - element: "Site & Location Tags (tag icon on a site record > Add Tag, name + color)"
        type: "colored free-text tag, applied per record"
        data_shown: "Tag name and color, multi-select per site; editable after creation."
        gates_on: ["Sites-grid 'tags' filter (transcript line 527)", "Explore Locations map tag filter (line 531)"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; no competitor file describes a tagging layer distinct from a category taxonomy."
        gap_severity: "none"
        gap_note: "Two overlapping classification systems (categories set up centrally in Setup, tags created ad hoc on the record) with no in-product guidance on when to use which — a predictable day-one taxonomy-sprawl trap, not a capability gap."

  - screen: "Sites > Setup > Contract Organization"
    navigation_path: "Sites > Setup tab > Contract Organization"
    action: >
      The administrator defines the contract vocabulary — categories, the routing checklist that
      models their institution's contract-negotiation steps, and the contract status ladder —
      before any affiliation agreement is entered.
    confirmed_by: >
      exxat_transcripts.md, lines 357-361: "Navigate back to the Setup
      tab, then click on the Contract Organization option. On the contract organization page, you
      can set up contract categories, your routing checklist, and contract statuses... The routing
      checklist is mainly used for contract management. It can be used to capture important steps
      in the contract negotiation process."
    elements:
      - element: "Contract Categories list"
        type: "admin-managed lookup list"
        data_shown: "Category values assignable to a contract from the contract's Categories card."
        gates_on: ["Contract-grid filtering", "Categories card on each contract"]
        accreditation_citation: "None on its own — the agreement evidence itself lives on the contract record (step 7), not on its taxonomy."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. eMedley's eKeeper (emedley.yaml) is described only as 'affiliation agreement tracking with auto-expiration reminders', with no public detail on contract classification."
        gap_severity: "none"
        gap_note: ""
      - element: "Routing Checklist list"
        type: "admin-managed checklist template (applied per contract as applicable / completed / completion date)"
        data_shown: "Institution-specific negotiation steps — e.g. legal review, risk management sign-off, counter-signature — later instantiated per contract (transcript line 409)."
        gates_on: ["The Routing Checklist card available on every individual contract"]
        accreditation_citation: "LCME Standard 1, Element 1.4 (Affiliation Agreements) and CODA Standard 4, Element 4-6 (written agreements for sites not owned by the institution) — the checklist is where a program can evidence that the required clauses/approvals were actually routed and completed, which is the part accreditors ask about beyond the signed PDF."
        competitor_equivalent: "Closest documented analog is E*Value/MedHub's 'automated document collection during onboarding (contracts, health records, training documents) via dynamic forms' (e-value.yaml) — but that is a document-intake workflow, not a per-contract negotiation checklist, and MedHub publishes no field-level detail. Not a like-for-like comparison."
        gap_severity: "configure-needed"
        gap_note: "Transcript line 359-361: 'you will not be able to make changes to the routing checklist or contract statuses if your program shares contracts between programs... you will need to have your institutional administrator make these changes for you.' For a new program admin at a multi-program school this screen may be read-only on day one — a hard dependency on another human before contract setup can proceed."
      - element: "Contract Statuses list"
        type: "admin-managed lookup list (status ladder)"
        data_shown: "Stage-of-implementation values assignable to a contract. Transcript: 'the contract status is used to keep track of the contract stage of implementation.'"
        gates_on: ["Status dropdown when adding/editing a contract (line 403)", "Placement Clearance contract-status surfacing (line 413)"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.5.b (a fully executed, current affiliation agreement on file for every practice facility) — the status ladder is what distinguishes 'executed' from 'in negotiation' when a surveyor asks."
        competitor_equivalent: "CORE ELMS (core-elms.yaml) documents 'affiliation agreement tracking with expiration alerts' at pillar level; whether its agreement records carry a configurable status ladder is not published, so no element-level comparison is possible."
        gap_severity: "configure-needed"
        gap_note: "Same shared-contracts lock as the routing checklist. Also note the ACPE file (acpe.yaml, 3.5.b) currently rates site-level contract management as 'Gap' — 'site affiliation-agreement management isn't named in any current or roadmap pillar.' This transcript contradicts that: a full contract object with status, expiry, documents, routing and auto-notification ships today. acpe.yaml 3.5.b should be re-rated Configure on the strength of transcript lines 399-419."

  - screen: "Sites > Setup > Site Sharing Model"
    navigation_path: "Sites > Setup tab > Site Sharing Model"
    action: >
      At a multi-program institution the administrator inspects (and, with the account manager,
      chooses) how much site data is common across sibling programs versus configured per program
      — a decision that is expensive to reverse once hundreds of site records exist.
    confirmed_by: >
      exxat_transcripts.md, lines 361-365: "All the information in green
      is common, while all the information in red is configured per program... as of September 2025,
      we have made some changes to our site-sharing model. We used to have five different types of
      site-sharing models. We have since simplified this list of models into three models."
      Corroborated by help-center mirror: Sites > "Understanding Site Sharing Model in Exxat Prism.md".
    elements:
      - element: "Site Sharing Model viewer (green = common, red = per-program legend)"
        type: "read-only configuration map"
        data_shown: "Field-by-field breakdown of which site, location, contract and personnel attributes are shared across the institution's programs versus program-scoped."
        gates_on: ["Whether a sibling program sees this program's site edits", "What the Programs card on a site/contract can grant (steps 5 and 7)"]
        accreditation_citation: "None directly — but consequential for CODA Standard 4, Element 4-6 and LCME 1.4 evidence assembly at institutions where one agreement covers several programs: the sharing model determines whether one contract record can serve all of them or must be duplicated."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file in content/competitors/ addresses multi-program data partitioning of a site directory at all. This is one of the clearest un-benchmarked areas of Prism's setup surface."
        gap_severity: "none"
        gap_note: "Ships and is self-serve to VIEW."
      - element: "Model selection (Standard sharing / All sharing / No sharing)"
        type: "vendor-mediated configuration (not a self-serve control)"
        data_shown: "Standard = selective sharing of site, location and contract info with chosen programs; All = every site/location entity including personnel shared; No = nothing shared."
        gates_on: ["Every downstream site, location, contract and personnel visibility decision at the institution"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "Transcript line 365: 'If you have any questions about the site-sharing model, please contact your account manager or reach out to our support team at prism-support@exxat.com.' The single highest-blast-radius decision in stage 5 is not a control the day-one administrator can exercise or change in-product — it is a support ticket, and the tutorial never states whether it can be changed later without data loss."

  - screen: "Sites > Sites tab > Add Site"
    navigation_path: "Sites > Sites tab > Add Site button"
    action: >
      The administrator creates the first site record — the organization that accepts students —
      and decides at creation time whether that organization is also itself a physical location.
    confirmed_by: >
      exxat_transcripts.md, lines 345-347 (hierarchy: "The first entity
      is sites. This is the organization which accepts your students... The second entity is
      locations... The third entity is contracts... The fourth entity is personnel") and lines
      365-367 ("Click on the Sites tab, then click on the Add Site button... you will need to fill
      in information for any area marked with a red asterisk").
    elements:
      - element: "Site Name / Alias Name / Site EIN"
        type: "input fields (name required)"
        data_shown: "Legal site name, an alias for how the program refers to it, and the site's Employer Identification Number."
        gates_on: ["Duplicate detection during Exxat One bulk linkage (step 15)", "Search and merge behaviour across the Sites grid"]
        accreditation_citation: "None individually — identity fields. The EIN becomes materially relevant only alongside Payment Details (step 5) for programs that compensate sites."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "No transcript-confirmed duplicate-name check at site creation (the only duplicate warning described anywhere is in the Exxat One bulk-add path, line 1885). Day-one risk of the same hospital being entered twice under two spellings by two coordinators."
      - element: "'Do you want to add this site as a location?' checkbox"
        type: "toggle / checkbox at creation"
        data_shown: "Marks a single-building organization as both the parent site and its own child location, avoiding a redundant location record."
        gates_on: ["Whether a child location record is auto-created", "Whether students can be placed against the record at all — placements attach to locations, not sites"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; no competitor file describes a two-level site/location hierarchy, so the collapse-to-one case has no published analog."
        gap_severity: "none"
        gap_note: "This is the single most consequential checkbox on the Add Site form for a new admin: miss it on a free-standing clinic and the site exists but is unplaceable until a location is added manually. The transcript flags it conditionally ('If this site serves as the brick-and-mortar location...') but the form gives no downstream warning."
      - element: "Active toggle"
        type: "toggle"
        data_shown: "Whether the site is in active use by the program."
        gates_on: ["Active/inactive filters on the Sites grid and on the contract-link picker (line 401)"]
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "About Us Notes"
        type: "rich text, institution-scoped"
        data_shown: "Site-authored/institution-authored descriptive copy. Transcript line 367: 'used as a part of the institutional app-level setup. When sites are added from the institutional app, programs can access the information added in the About Us Notes section.'"
        gates_on: ["What a sibling program sees when it reuses this site"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Only meaningful for institutions using the institutional app; for a standalone single-program admin it is an unexplained empty box on the create form."
      - element: "Address Information — Domestic / International selector + address"
        type: "radio + address field set"
        data_shown: "Country model then street address; feeds the Explore Locations map and the mileage-radius search (line 531)."
        gates_on: ["Explore Locations map plotting", "Draw Miles Radius distance search", "Advanced-search matching during Exxat One linkage"]
        accreditation_citation: "ACPE (acpe.yaml, regulatory layer note): 'because affiliation agreements and site licensure must satisfy the specific state the rotation occurs in... site records need a per-state licensure/compliance dimension.' The address is the only structured geography Prism captures on the site record; there is no separate state-licensure attribute."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Address is captured, but nothing in the transcript exposes a per-state regulatory attribute on the site record — programs needing ACPE-style multi-state compliance must improvise with categories or tags."

  - screen: "Site profile > About tab"
    navigation_path: "Sites > Sites tab > [site name] > About"
    action: >
      With the shell record created, the administrator populates the site's substantive content —
      programs granted access, site-wide requirements, settings, payment terms, categories,
      documents and notes — knowing that almost all of it will be inherited by every child location.
    confirmed_by: >
      exxat_transcripts.md, lines 369-385 ("In the About tab, you can
      populate information about the site that can be shared with students... any requirements added
      will automatically be inherited by all locations associated with the site"), and line 385 for
      the delete guard. Corroborated by help-center mirror: Sites > "Adding and Managing Sites.md".
    elements:
      - element: "Programs card (pencil icon > select programs)"
        type: "multi-select access grant"
        data_shown: "Which sibling programs at the institution may access this site's information."
        gates_on: ["Cross-program visibility of this site — operating inside whatever ceiling the site-sharing model (step 3) sets"]
        accreditation_citation: "None directly; enables the one-agreement-many-programs case behind CODA 4-6 / LCME 1.4."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Interacts silently with the site-sharing model: the transcript never explains what this card does when the institution is on the 'no sharing' model."
      - element: "Requirements card (+ icon, comma-separated entry, X to delete, notes area)"
        type: "free-text list with cascade"
        data_shown: "Site-imposed prerequisites (e.g. site-specific orientation, badge, drug screen) entered as comma-separated values plus a notes block."
        gates_on: ["Every child location inherits these automatically (line 371); locations may then remove them individually (line 425)"]
        accreditation_citation: "None as authored here. Requirements that must be *evidenced* per student are the separate Student Requirement Uploads element below; free-text requirements are informational."
        competitor_equivalent: "CORE ELMS (core-elms.yaml) tracks 'immunizations, CPR certification, background checks, drug checks, HIPAA training' as compliance items — but those are student-item trackers, not a site-authored free-text requirement list with location inheritance. Not comparable at this granularity."
        gap_severity: "cosmetic"
        gap_note: "Comma-separated free text means no reporting or matching across sites — a program cannot ask 'which sites require a drug screen?' from structured data."
      - element: "Settings card (+ / pencil, select from list, X to disassociate)"
        type: "controlled multi-select (practice settings)"
        data_shown: "Practice-setting classifications for the site (e.g. inpatient, outpatient, school-based), with a notes area."
        gates_on: ["Location inheritance with a per-location 'Inherit Setting Notes' toggle (line 425)", "Locations-grid 'location settings' filter (line 527)", "Setting-scoped report filters across disciplines (e.g. SLP clinical-log reports filter by setting)"]
        accreditation_citation: "ACPE Standard 3 (four required APPE settings — community, ambulatory care, hospital/health-system, inpatient adult) per acpe.yaml: the setting attribute on the site/location is the structural field a program would count required-setting coverage from. COCA Standard 6, Element 6.10 similarly needs 'setting is inpatient/outpatient' as a filterable attribute."
        competitor_equivalent: "eMedley eKeeper/eduSched (emedley.yaml) advertises 'site capacity management' but publishes no setting taxonomy; CORE ELMS publishes none either. Not comparable at element level."
        gap_severity: "none"
        gap_note: "This is the highest-value structured field on the site record for accreditation reporting and, notably, the one the tutorial spends the least time on."
      - element: "Payment Details card (+ icon > payment model Site / Location / Personnel, payment rate, rate unit, vendor ID, payment notes)"
        type: "structured financial record"
        data_shown: "Who is paid (site, its locations, or named individuals), 'how much you're paying per student placement', how often, and the vendor ID identifying the payee in the program's finance system."
        gates_on: ["Site Payment Report under Placements > [course] > Reports (line 379)", "Rate inheritance: 'If you enter a rate for a location within a site profile, every location under that site will use the same rate. The same goes for personnel.' (line 377)"]
        accreditation_citation: "None — no accreditor requires payment tracking. Contextually important for medicine/DO: domains/medicine.yaml records that '44% of AAMC-surveyed schools feel moderate-to-severe pressure to pay community physicians/clinics to host students', making this a market-relevant, not standards-relevant, field."
        competitor_equivalent: "eMedley's eKeeper is documented as including 'preceptor pay automation' (emedley.yaml) — the closest published analog, and the only competitor in this research with any site/preceptor payment capability named. New Innovations' contract/IRIS Medicare-cost-report automation (new-innovations.yaml) is a GME funding workflow, not a per-placement site payment, so it is adjacent rather than equivalent."
        gap_severity: "configure-needed"
        gap_note: "Two setup traps stated in the transcript: (a) 'you won't be able to assign a vendor ID to locations or personnel from this page' — vendor IDs must be entered one profile at a time (line 377); (b) editing a rate forces you to 'enter a new placement start date. Only placements starting after that date will reflect the new payment details' (line 377-379) — a retroactivity boundary a day-one admin backfilling historical rates will hit immediately."
      - element: "Documents card (general vs archived tables; name, upload date, description, archive bit, share-with-students bit, Browse to Upload)"
        type: "document repository with archive + student-visibility flags"
        data_shown: "Per-document: upload date, the file, whether shared with students, notes."
        gates_on: ["Student visibility of the document in Explore Clinical Locations", "Location-level inheritance with per-document on/off toggles (line 429)"]
        accreditation_citation: "None for arbitrary site documents. The affiliation agreement itself belongs on the Contract record (step 7), not here — a distinction the UI does not enforce and a new admin can easily get wrong, which would scatter LCME 1.4 / CODA 4-6 / ACPE 3.5.b evidence across two places."
        competitor_equivalent: "CORE ELMS (core-elms.yaml) documents 'HIPAA-compliant document storage' at pillar level with no per-document flags published. Not comparable at element level."
        gap_severity: "cosmetic"
        gap_note: "Archive-vs-active is a manual flag with no version lineage: 'It could be useful to archive old versions of documents' (line 383) is advice, not a versioning feature."
      - element: "Student Requirement Uploads card (+ icon; name, description, include-in-shared-profile-link bit, show-to-students bit, template upload, Add Another Requirement)"
        type: "per-site evidence request that generates a student-facing upload task"
        data_shown: "Requirement name/description, an optional downloadable template, and two visibility bits."
        gates_on: ["Placement Clearance tab > Requirement Upload Status column, with statuses Get Started / Action Required / Uploaded / Approved / Not Approved (lines 391-397)", "Inherited by every location, with an 'Enabled for this Location' toggle per location (line 427)"]
        accreditation_citation: "LCME Standard 1, Element 1.4 (occupational-exposure follow-up responsibility and site-imposed conditions) and CODA Standard 4, Element 4-6 — where the *site's* conditions on students are the thing being evidenced. Also the mechanism ACPE 3.5.b programs use for site-mandated onboarding paperwork."
        competitor_equivalent: "E*Value/MedHub (e-value.yaml) documents 'automated document collection during onboarding... via dynamic forms' — genuinely comparable in intent, but MedHub publishes no per-requirement field list, template-attachment behaviour, or site-to-location inheritance, so the comparison stops at capability level."
        gap_severity: "none"
        gap_note: "Rich and clearly the strongest element on this screen: template distribution, per-location enable/disable, admin upload-on-behalf-of-student, reject-with-reason, and reset — all confirmed in transcript lines 389-399."
      - element: "Delete Site button (upper right)"
        type: "destructive action with referential guard"
        data_shown: "Removes the site."
        gates_on: ["Blocked outright: 'You will not be able to delete a site if there are any available slots or placements at any of the site's child locations' (line 385)"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Sensible guard. Note the asymmetry with contract deletion (step 7), which requires typing a confirmation number, and personnel deletion (step 12), which deletes a person's entire profile from a site-scoped row with only a trash icon."

  - screen: "Site profile > Contracts tab"
    navigation_path: "Sites > [site name] > Contracts tab"
    action: >
      The administrator records the affiliation agreement — either linking an existing contract that
      already covers several sites, or creating a new one — then fills in its contacts, covered
      programs, covered locations, routing checklist and documents.
    confirmed_by: >
      exxat_transcripts.md, lines 399-413: "The chain icon allows you to
      link contracts you have already created for different sites. If, for example, you have multiple
      sites that are covered by the same contract, rather than consolidating them, you can easily link
      the contract"; "You can provide the contract with a name, contract number, tax ID, the name of
      the person who initiated the contract, a start date, and an end date." Corroborated by
      help-center mirror: Sites > "Managing Contracts.md".
    elements:
      - element: "Link Contract (chain icon) — searchable picker with active/inactive filter"
        type: "many-to-many association control"
        data_shown: "All existing contracts in the program, searchable and filterable by active status."
        gates_on: ["One contract record serving multiple sites without duplication", "Unlink Contract button on the contract detail (line 401)"]
        accreditation_citation: "LCME Standard 1, Element 1.4; CODA Standard 4, Element 4-6; ACPE Standard 3, Key Element 3.5.b — a master agreement covering a health system with many hospitals is exactly the case all three standards produce, and linking (rather than copying) keeps one authoritative expiry date."
        competitor_equivalent: "eMedley eKeeper — 'affiliation agreement tracking with auto-expiration reminders' (emedley.yaml) — and CORE ELMS — 'affiliation agreement tracking with expiration alerts' (core-elms.yaml) — both ship agreement tracking, but neither publishes whether one agreement record can span multiple site records. The many-to-many linkage is un-benchmarked."
        gap_severity: "none"
        gap_note: "Directly contradicts acpe.yaml's 3.5.b rating of 'Gap' ('no pillar today models site-level compliance/contract documents'). It ships, with many-to-many linkage."
      - element: "Contract Information fields — Name, Contract Number, Tax ID, Initiated By, Start Date, End Date, Open-Ended bit, Contract Template, Active bit, Status, Notes, Add Reference Address"
        type: "input field set"
        data_shown: "The core agreement record. 'Open-ended' means no end date; 'Contract Template' is reference-only, indicating which entity's template was used in negotiation."
        gates_on: ["Expiring-contract auto-notifications (step 8) key off the End Date", "Contract status surfaces on Placement Clearance (line 413)"]
        accreditation_citation: "LCME Standard 1, Element 1.4 requires 'the agreement document, effective/expiration dates, and the specific responsibility clauses, with renewal alerts' — the first two ship here verbatim; the clause-level structure does not (see gap_note)."
        competitor_equivalent: "eMedley eKeeper and CORE ELMS both document expiration tracking; neither publishes a field list, so field-for-field comparison is not possible from public sources."
        gap_severity: "configure-needed"
        gap_note: "LCME 1.4 asks for specific clauses to be evidenced — school authority over education/assessment, resource access, faculty appointment role, occupational-exposure follow-up. Prism stores those only inside the uploaded PDF plus free-text Notes; there is no structured clause field, so an LCME program must answer clause questions by reading documents rather than querying. The Open-Ended bit also silently exempts a contract from every expiry notification in step 8."
