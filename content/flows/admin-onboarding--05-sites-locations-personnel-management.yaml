  - screen: "Faculty Compliance (setup, groups, assignment, review, auto-notifications)"
    navigation_path: "Dashboard (or hamburger menu) > Faculty Compliance; setup under its Setup section"
    action: >
      A program subscribed to Exxat Approved configures faculty-side compliance requirements,
      bundles them into groups, assigns groups to faculty, reviews submissions and schedules
      reminder notifications.
    confirmed_by: >
      exxat_transcripts.md, "Setting Up and Reviewing Faculty Compliance"
      (lines 1935-1963): "Faculty compliance is a powerful feature that allows you to collect essential
      information from your faculty, such as healthcare records, identity information, insurance
      information, and licensure or certification information... To get started with faculty
      compliance, you'll need to have Exxat Approved as part of your services."
    elements:
      - element: "Prepopulated requirement list with per-requirement editor (document name, document category, short name, Enabled bit, Mandatory bit, guidelines for faculty, guidelines for reviewer, template upload, sample upload)"
        type: "compliance item definition"
        data_shown: "Commonly used faculty requirements shipped ready to customise, with separate instructions for the submitter and the reviewer."
        gates_on: ["Enabled/mandatory state drives the compliant / non-compliant calculation"]
        accreditation_citation: "CODA Standard 2, Element 2-6 — coda.yaml's gap_notes state 'Compliance Management's item taxonomy is confirmed for students only; faculty-side calibration/credential tracking is an open Phase 2 question per the capability map.' This transcript RESOLVES that: faculty-side compliance with licensure/certification collection ships today. COCA Standard 5, Element 5.4 similarly assumes 'the same gating model for both students and faculty' — also supported here."
        competitor_equivalent: "MedHub/E*Value's 'Automated Credentials Monitoring' with 'automated alerts for expiring credentials' (medhub.yaml, e-value.yaml) and CORE ELMS's compliance module with 'automated expiration reminders' (core-elms.yaml) are the documented analogs. Both are described at capability level only, so the field-level comparison (per-requirement reviewer guidance, template vs sample uploads, renameable field labels) is not possible from public sources — but the capability itself is at parity."
        gap_severity: "configure-needed"
        gap_note: "Gated on the Exxat Approved service, so it is not universally available to a day-one admin — and it covers FACULTY (Faculty & Staff records), not site personnel. The preceptor-license-expiry gap flagged in step 12 is not closed by this screen unless the preceptor also exists as a faculty record."
      - element: "Per-requirement collected-field configuration (field selection e.g. expiration date, result date, file upload, test type, notes; per-field Required toggle; renameable Label)"
        type: "field-level schema configuration"
        data_shown: "Which sub-fields each requirement collects; 'you can also rename the field using the label text box, but keep in mind that this only changes the display name, not the type of data being collected.'"
        gates_on: ["Expiration-date collection is what makes the 'compliant until' date possible (line 1953)"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (license status with expiration) and CODA 2-6 — the expiration sub-field is the specific element that turns a stored credential into a monitorable one."
        competitor_equivalent: "MedHub's real-time license/DEA/controlled-substances tracking (medhub.yaml) is functionally comparable; field-level configurability is not documented on their side."
        gap_severity: "none"
        gap_note: "The relabel-without-retyping warning is a good guard against exactly the mistake a discipline-specific program would make when localising terminology."
      - element: "Compliance Groups (Create Group: name, description, select documents) + Associate Faculty (select faculty > Assign Group, with 'override currently associated groups' checkbox)"
        type: "bundling and assignment"
        data_shown: "Requirement bundles assigned to selected faculty; override versus additive assignment."
        gates_on: ["Which requirements a given faculty member sees on login"]
        accreditation_citation: "CODA Standard 2, Element 2-6 — different site-facing faculty may need different calibration/credential bundles; groups are how that differentiation is expressed."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "The override checkbox is correctly explicit — but destructive if misread during a bulk reassignment."
      - element: "Faculty Compliance dashboard (compliance group selector; 'by faculty' pie — green compliant / red non-compliant; 'by status' pie; status-count table) plus Faculty View, Document View and export"
        type: "monitoring dashboards with export"
        data_shown: "Compliance distribution by person and by document status; document view adds due dates, expiration dates, last update and last editor."
        gates_on: ["A faculty member is non-compliant if any required document is missing or awaiting review; a 'compliant until' date appears when everything is approved but something expires soon"]
        accreditation_citation: "CODA Standard 2, Element 2-6 (documented faculty participation and monitoring) and COCA Standard 5, Element 5.4 (proof supervision policies reached faculty) — this dashboard is the reportable artifact."
        competitor_equivalent: "MedHub/E*Value's credentials monitoring with 'GME-office alerts on changes' (medhub.yaml) is the nearest documented analog; no competitor publishes dashboard composition."
        gap_severity: "none"
        gap_note: "The 'compliant until' concept — compliant today, expiring soon — is a sharper primitive than a binary flag and is worth calling out competitively."
      - element: "Compliance auto-notifications (title, description, start date, frequency e.g. 1 / week / Monday, end date; requirement selection; summary then Create Notification; per-instance activate bit, pencil, trash)"
        type: "scheduled reminder engine"
        data_shown: "Recurring reminders covering documents in Get Started, In Progress, Not Approved, Expiring or Expired states."
        gates_on: ["Only the requirements selected during setup are chased"]
        accreditation_citation: "CODA Standard 2, Element 2-6 and ACPE 3.3.a — an expiry-chasing loop is the operational difference between 'we store licenses' and 'our supervising faculty are currently licensed', which is what a surveyor actually asks."
        competitor_equivalent: "This is the clearest parity claim in stage 5: CORE ELMS ships 'automated expiration reminders' and MedHub/E*Value ships 'automated alerts for expiring credentials' (core-elms.yaml, e-value.yaml, medhub.yaml). Prism matches for faculty. Neither side publishes recipient/frequency configurability, so Prism's day/week/weekday scheduling is plausibly finer-grained but unproven as an advantage."
        gap_severity: "none"
        gap_note: "Note this is the THIRD independent auto-notification engine in stage 5 — expiring contracts (step 8), faculty compliance (here), and site communications/slot requests (out of scope for this stage). Each is configured in a different Setup area with different recipient models; there is no single notification console for a new administrator to review what their program will send."

