      categories, requirements, student requirement uploads, documents and notes — and adds
      location-only content such as housing and parking.
    confirmed_by: >
      exxat_transcripts.md, lines 423-431: "The location will inherit
      almost all site information, including contracts, settings, categories, requirements,
      site-specific requirements, documents, and notes"; "Toggle the Enabled for this Location bit to
      deactivate or activate these site-specific requirements"; "Toggle the Inherit Notes from Site
      bit in the Notes for Internal Use Only and Notes Shared with Student sections." Corroborated by
      help-center mirror: Sites > "Adding and Managing Locations.md".
