      for expiring contracts, navigate to the Setup tab and click on the Auto-Notifications
      option... using the two rightmost dropdown menus, you can select the number of days, weeks, or
      months in advance of a contract expiration date for which you would like to be notified...
      if you choose daily, when you have a contract expiring within the timeframe you indicated
      above, recipients... will receive an email containing this expiring contract every day until
      the contract has been refreshed."
    elements:
      - element: "Notification Title"
        type: "input field"
