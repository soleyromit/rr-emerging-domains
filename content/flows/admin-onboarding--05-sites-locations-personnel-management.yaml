  - screen: "Faculty & Staff > Setup (View Settings, Faculty Organization, Announcements, Resources)"
    navigation_path: "Faculty and Staff > Setup tab"
    action: >
      Before inviting anyone, the administrator decides what faculty will be able to see when they
      log in, defines the rank and administrative-position vocabularies, and optionally preloads
      announcements and resources so the dashboard is not empty on first login.
    confirmed_by: >
      exxat_transcripts.md, "11/16 Setting up Faculty in Exxat Prism"
      (lines 1175-1193): "First, you will need to set up the faculty dashboard and configure faculty
      organization options. Then you will need to add faculty to the system and invite them to create
      their login"; "you can enable or disable access to their assigned course offerings, the student
      profiles they're associated with, the uploaded faculty resources, your shared school contacts,
      their assigned student placements, your program's curriculum grids, or the faculty compliance
      section"; "These labels won't affect their system access."
    elements:
      - element: "Faculty Dashboard Configuration toggles (course offerings, associated student profiles, faculty resources, shared school contacts, assigned student placements, curriculum grids, faculty compliance)"
        type: "feature-visibility toggle set (program-wide)"
        data_shown: "Which seven areas exist in the faculty login at all."
        gates_on: ["Everything a faculty member can reach — the transcript's example is turning off curriculum grids to keep curriculum mapping administrator-only"]
        accreditation_citation: "None directly, but consequential for LCME/COCA confidentiality expectations around who may view student records; the toggles are the coarse-grained half of Prism's faculty access model, with per-record Associations (step 20) as the fine-grained half."
        competitor_equivalent: "axiUm (axium.yaml) documents 'role-based access control limiting user visibility' as a named capability supporting HIPAA/FERPA/CODA — the closest documented analog, though axiUm publishes no toggle inventory. Every other competitor teardown is silent on administrator-configurable role visibility."
        gap_severity: "none"
        gap_note: "Program-wide, not per-role: there is no documented way to give one faculty group curriculum grids and another none. Combined with 'ranks don't affect access', a program's only real access dimensions are these seven switches plus per-record associations."
      - element: "Student Compliance Access — 'Student Compliance Status for Advisors' and 'Student Compliance Status for Course Faculty' toggles"
        type: "sensitive-data visibility toggles"
        data_shown: "Whether advisors and course faculty can see student compliance status."
        gates_on: ["Faculty ability to self-serve placement-readiness checks"]
        accreditation_citation: "None names this specific disclosure; it is a FERPA/health-record governance decision the transcript frames as a program choice ('Some programs choose to grant this access so faculty can confirm student readiness for placements. Others prefer to keep compliance information visible only to administrators')."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Correctly identified by the tutorial as a policy decision, and one a day-one admin should route to their privacy officer rather than toggle casually."
      - element: "Faculty Rank list (pencil > type + Add) and Administrative Positions list"
        type: "admin-managed lookup lists (labels only)"
        data_shown: "Rank and position vocabularies assignable to faculty and staff."
        gates_on: ["Faculty-grid filtering and organisation only — explicitly NOT access"]
        accreditation_citation: "CODA Standard 3, Element 3-4 (faculty evaluation process) and the faculty-qualification narrative sections of LCME/COCA self-studies use rank; here it is a filterable label that supports those reports rather than evidence itself."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Two-sided trap. First, the transcript says twice that ranks and positions do not affect access (lines 1191-1195) — a genuine day-one misconception. Second, on the faculty profile the administrative-position dropdown is NOT freely extensible: 'You can also add additional options to this list by contacting our support team at prism-support@exxat.com' (line 1231), while this Setup screen implies self-serve editing. The two statements need reconciling before a program standardises its position taxonomy."
      - element: "Announcements (start/end date-time, title, description, document upload) with Upcoming / Current / Former grouping"
        type: "scheduled dashboard content"
        data_shown: "Time-boxed messages on the left of the faculty dashboard."
        gates_on: ["Visibility strictly by date window — upcoming announcements 'aren't visible to faculty yet'"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Faculty Resources (categories with drag-reorder; resource types document / video / link / FAQ)"
        type: "categorised content library"
        data_shown: "Handbooks, observation frameworks, policies, FAQs available in the faculty login."
        gates_on: ["Gated by the 'faculty resources' dashboard toggle above"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.c-style preceptor development texture (acpe.yaml: 'Evidence that every preceptor completed orientation... plus ongoing professional-development activity records') — resources are where orientation material would live, though nothing here records who consumed it."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "Distribution without acknowledgment: a program can publish an orientation handbook but the transcript describes no read receipt or completion record on faculty resources, which is what ACPE-style orientation evidence actually requires. (The attestation primitive exists in the form builder, step 14, and the compliance engine, step 21 — just not attached to resources.)"

