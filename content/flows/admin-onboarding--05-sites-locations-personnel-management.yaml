  - screen: "Sites > Locations grid > Move Location (mergers & acquisitions) + Location Move History"
    navigation_path: "Sites > Locations tab > [location] > Move Location"
    action: >
      When a hospital is acquired, the administrator re-parents an existing location to a different
      site, reviews the explicit table of what moves and what does not, confirms, and then watches
      an asynchronous job complete.
    confirmed_by: >
      exxat_transcripts.md, lines 433-437: "In recent times, we have seen
      many mergers and acquisitions, M&A, of hospitals and sites. As part of this process, locations
      that are part of one site must be merged with the new site... attributes inherited from site
      such as settings, categories, requirements, requirement uploads, notes, documents, and
      contracts will not be moved. Location-specific information, location-associated details, and
      slot and placement details will be moved along with the location."
    elements:
      - element: "Move Location > destination site picker (search + filter)"
        type: "record re-parenting control"
        data_shown: "All sites in the program, searchable."
        gates_on: ["Blocked for locations linked to Exxat One: 'you will not be able to move an Exxat Prism location from one site to another once it has been linked to an Exxat One location' (line 1887)"]
        accreditation_citation: "COCA Standard 6, Element 6.9 (executed affiliation agreements for every contracted clinical site) and LCME 1.4 — an acquisition is precisely when a program's agreement coverage silently lapses, and this is the control that surfaces it."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. Notably, health-system consolidation is a named market pressure in domains/do.yaml ('community hospitals increasingly reserve slots exclusively for affiliated MD programs while university systems acquire hospital networks') and domains/medicine.yaml, yet no competitor teardown documents any re-parenting feature at all — this looks like a genuine, un-benchmarked Prism strength."
        gap_severity: "none"
        gap_note: ""
      - element: "Implications table shown before confirming the move"
        type: "read-only pre-flight impact summary"
        data_shown: "Explicit split: site-inherited attributes (settings, categories, requirements, requirement uploads, notes, documents, contracts) do NOT move; location-specific data, associations, slots and placements DO."
        gates_on: ["Administrator's informed consent before an irreversible-in-practice re-parenting"]
        accreditation_citation: "LCME Standard 1, Element 1.4 / CODA 4-6 / ACPE 3.5.b — because contracts explicitly do not travel, a moved location is, the instant the move completes, a location with no inherited agreement until it is re-covered under the destination site's contract (step 7, Locations Covered)."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "The most under-flagged accreditation hazard in the whole stage: the tutorial states contracts do not move but never tells the admin to go re-cover the location under the new site's agreement, and no notification in step 8 fires for a location that has no agreement at all (those alerts key off expiry dates, not absence)."
      - element: "Async progress banner (yellow = in progress, green = complete)"
        type: "job status indicator"
        data_shown: "'This may take a few minutes to complete, but you are free to leave this page and come back later.'"
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Location Move History (directional arrows, who moved it, when)"
        type: "read-only audit log"
        data_shown: "Left arrows = moved in from another site; right arrows = moved out; plus actor and timestamp."
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.9 and LCME 1.4 — provenance for 'why does this site's history show placements before we contracted with it?', a question a survey team asks after any acquisition."
        competitor_equivalent: "axiUm (axium.yaml) advertises 'full audit trail' on 'every transaction, form, and clinical entry', but that is a clinical-record audit trail in a dental teaching clinic, not a site-directory move history. Not equivalent."
        gap_severity: "none"
        gap_note: ""
      - element: "Personnel cascade on move (implicit, no control)"
        type: "automatic side effect"
        data_shown: "Transcript line 471: personnel associated with the moved location move too; they are dropped from the origin site only if they have no other location there, and always become associated with the destination site."
        gates_on: ["Who receives slot-request emails at the origin versus destination site afterwards"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Correct behaviour, but invisible: the pre-flight implications table describes data, not people, so the admin is not shown which named preceptors are about to change parent site."

  - screen: "Sites > Personnel > Add Personnel (3-step wizard)"
    navigation_path: "Sites > Personnel tab > Add Personnel (also reachable from a site profile's Personnel tab and from a location's Personnel section)"
    action: >
      The administrator creates a person who works at a site — a site/location contact, an
      experiential supervisor, or both — sets their email-notification preferences, and associates
      them to the specific sites and locations they cover, with a primary site.
    confirmed_by: >
      exxat_transcripts.md, lines 439-451: "It is important to maintain an
      updated list of personnel so the correct people receive slot requests and the correct
      experiential supervisors can be assigned to student placements"; "Experiential supervisors
      supervise student placements and therefore are assigned to student placements for them to fill
      and review forms and evaluations distributed to them and review timesheet entries and patient
      logs submitted"; "If you select a single site to associate with the person, this site will be
      marked as the primary site." Corroborated by help-center mirror: Sites > "Managing Personnel.md"
      and "Add or Edit CI - Preceptor Information.md".
    elements:
      - element: "Active personnel toggle"
        type: "toggle"
        data_shown: "Whether the person is currently working in the field; inactive people are retained 'for information purposes' (line 441)."
        gates_on: ["Personnel-grid filters", "Whether they appear as an assignable supervisor"]
        accreditation_citation: "None on its own; retention of inactive supervisors matters for retrospective self-study questions ('who supervised this 2024 cohort?'), which is a records-retention property rather than a named standard."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Will this person serve as an experiential supervisor?' (Yes/No)"
        type: "role-defining toggle"
        data_shown: "Separates a supervising clinician from an administrative site contact."
        gates_on: ["Assignability to student placements", "Appearance of Slots and Placements tabs on the profile (line 453)", "Eligibility to receive and complete forms/evaluations, review timesheets and patient logs", "Triggers the 'associate with ongoing or upcoming slots and placements?' prompt on save (line 451)"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (a preceptor profile/credentialing record linked to every placement a preceptor supervises); CODA Standard 2, Element 2-6 (faculty calibration per clinical site); COCA Standard 6, Element 6.10 ('at least one [rotation] under an osteopathic physician's supervision' requires the supervisor to be a first-class, attribute-bearing record). This single toggle is what makes the preceptor a queryable entity rather than a name in a text field."
        competitor_equivalent: "CORE ELMS documents 'preceptor license tracking' and 'centralized site/student/preceptor management' (core-elms.yaml); MedHub/E*Value documents 'Automated Credentials Monitoring' for licenses (medhub.yaml). Both confirm competitors model preceptors as entities, but neither publishes a role-designation control or what it unlocks, so the element-level comparison stops there."
        gap_severity: "none"
        gap_note: "Confirms — from the primary transcript, not a paraphrase — the correction that acpe.yaml 3.3.a and coda.yaml 2-6 both hedge on ('unclear whether Compliance Management natively models preceptors as a trackable entity today versus only students'). It does."
      - element: "Profile Details field set — first/last name, title, email, other contact info, Add Address, Professional Details, Additional Details"
        type: "input field set (asterisked fields required)"
        data_shown: "Identity and professional background of the supervisor."
        gates_on: ["Email is the address slot requests and form/evaluation links are sent to"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a — the profile is the container for the credential evidence added later (licensure/certification cards, step 12)."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "There is NO bulk import for personnel. The transcript documents bulk import only for faculty/staff (lines 1199-1205), and the help-center Data Feed Integration guide covers only student and course-registration feeds — no site, location or personnel feed. A program migrating from a legacy system with hundreds of preceptors enters them one wizard at a time, or via the Exxat One AI linkage (step 15) which only creates sites/locations and only for Exxat One customers. This is the single largest day-one throughput gap in stage 5."
      - element: "Communication preferences step — receive distributed slot requests / location information update requests / other email notifications (slot confirmations and cancellations, students interested in the location, student placement notifications)"
        type: "notification opt-in set, defaulted per person and overridable per location"
        data_shown: "Which automated site-facing emails this person receives."
        gates_on: ["Slot-request email recipients — help-center 'Managing Personnel.md' warns: 'If personnel are added to a Site, but not associated with a specific location, they will not be included in your Slot Request emails.'"]
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. E*Value/MedHub documents 'automated notifications for students' (e-value.yaml) but nothing about per-site-contact notification preferences."
        gap_severity: "configure-needed"
        gap_note: "Highest-consequence silent failure in the module: a personnel record attached to a site but not to any of its locations is invisible to slot requests. The wizard even labels the association step optional ('You can always click on the Skip button'), which is exactly how a program ends up wondering why a site never answers."
      - element: "Associate Sites and Locations step — site table (name, address, programs), primary-site marker, 'Select All Locations' vs 'Choose Locations', per-location practice setting / designation / communication preferences, association notes"
        type: "hierarchical multi-select with per-association overrides"
        data_shown: "Which buildings this person covers and in what capacity at each, pre-populated from the profile step then individually overridable."
        gates_on: ["Slot-request routing", "Assignability as experiential supervisor at a given location", "Primary-site designation, which cannot later be disassociated (line 459)"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.e (2:1 student-to-preceptor ratio) and LCME Standard 3, Element 3.1 texture — a ratio or supervision query is only computable if the supervisor-to-location mapping is explicit, which this step is where it becomes so."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; no competitor publishes a person-to-many-locations association model with per-location role attributes."
        gap_severity: "none"
        gap_note: "Genuinely sophisticated — per-location designation and communication preferences on one person is a real modelling advantage. Cost: it is also the most laborious screen a migrating admin will meet, repeated once per preceptor."

  - screen: "Personnel profile (About / Associations / Slots / Placements / Communications / Interventions)"
    navigation_path: "Sites > Personnel > [person name]"
    action: >
      The administrator enriches the person's record — tags, categories, CV, licensure,
      certifications, documents, assistants, notes — and manages their site/location associations
      over time, including disassociation when they leave.
    confirmed_by: >
      exxat_transcripts.md, lines 451-477: "The Slots and Placements tabs
      appear only when the personnel member is marked as a clinical instructor"; "If there are any
      past or current placements assigned to the person at a location at this site, the person will
      continue to be associated with these placements to preserve any placement or form and
      evaluation information. However, the person will be removed from any unused slots and upcoming
      placements"; "you cannot disassociate the site marked as the primary site."
    elements:
      - element: "Licensure card (+ icon) and Certification card (+ icon), each with edit and delete"
        type: "structured credential records"
        data_shown: "License and certification details for the supervisor."
        gates_on: ["Placement Clearance preceptor credential checks (Nursing playbook: the Placement Clearance Dashboard 'consolidates preceptor CV/license/certification status, contract validity...')"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a ('a record that the majority of preceptors for any given student are U.S.-licensed pharmacists, with performance evaluations on file'); COCA Standard 5, Element 5.4 (direct supervision by a licensed health care professional); CODA Standard 2, Element 2-6 (faculty calibration/credential tracking per site). This card is where preceptor-qualification evidence physically lives."
        competitor_equivalent: "The strongest documented head-to-head in this stage: MedHub/E*Value ships 'Automated Credentials Monitoring for state licenses, DEA, and Controlled Substances registrations' with 'real-time tracking' and 'automated alerts for expiring credentials' (medhub.yaml, e-value.yaml); CORE ELMS ships 'preceptor license tracking' with 'automated expiration reminders' (core-elms.yaml). Prism's transcript documents the license as a stored record but describes NO expiry alerting on it — the contract auto-notification in step 8 is contract-scoped, and the faculty compliance auto-notification in step 16 covers faculty, not site personnel."
        gap_severity: "gap"
        gap_note: "Personnel licensure appears to be stored data without an expiry-notification engine of its own, while two named competitors advertise exactly that. If a preceptor license expiry alert does exist it is not in the primary transcript, the Sites help-center folder, or the Faculty Compliance flow — worth confirming with product before it is repeated as a competitive claim either way."
      - element: "CV upload (Browse to Upload, with file type/size limits)"
        type: "document upload"
        data_shown: "The supervisor's CV."
        gates_on: ["Nursing playbook: preceptor CV status is one of the items the Placement Clearance Dashboard consolidates"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a and CODA Standard 3, Element 3-4 (objective measurement of faculty performance) rely on documented qualifications; a CV on file is the baseline artifact surveyors request for supervising clinicians."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Unlike the FACULTY profile (step 20), there is no Generate CV for site personnel — the site-side record stores a CV, the faculty-side record can build one."
      - element: "Slots tab and Placements tab (conditional on the experiential-supervisor designation)"
        type: "read-only grids, conditionally visible"
        data_shown: "Slots: site, location, rotation dates, scheduling info, with co-preceptors sharing a row. Placements: consolidated view-only list of the person's placements with site/location/assignment details."
        gates_on: ["Visibility is gated on the supervisor designation set in step 11"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.e (2:1 ratio) — this grid is the raw data a ratio check reads; Nursing's COA Standard F.7 imposes the same hard 2:1 cap for CRNA programs per the Nursing playbook."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "The data needed for a ratio check is visible per person, but the transcript describes no automatic ratio enforcement here — consistent with acpe.yaml 3.3.e's 'required_software_behavior' of 'blocking or flagging a new assignment that would push the ratio above 2:1', which remains unconfirmed at this screen."
      - element: "Associations > Associate Sites and Locations / Disassociate Site / Mark as Primary / per-location pencil and unlink"
        type: "association management with referential protections"
        data_shown: "Primary site marker, expandable location lists, per-location edit of communication preferences, designation, practice settings and association notes."
        gates_on: ["Primary site cannot be disassociated", "Typed-number confirmation required to disassociate a site", "Past/current placements retain the person; unused slots and upcoming placements drop them"]
        accreditation_citation: "LCME Standard 1, Element 1.4 and ACPE 3.3.a indirectly — the preservation rule ('to preserve any placement or form and evaluation information') is what keeps historical supervision evidence intact when a preceptor leaves, which is the property a retrospective self-study depends on."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "The past-preserved / future-cleared split is exactly right for accreditation and is one of the more thoughtful behaviours in the product. Contrast with the trash icon on a site's Personnel row, which 'deletes the person's profile entirely' (line 465) with no typed confirmation described — an inconsistent destructive guard."
      - element: "Communications tab and Interventions tab (mode, initiated by, communicated with, subject, description, date, document, follow-up date/completion; interventions add rotation, status Open/Closed and multiple follow-ups)"
        type: "structured relationship log"
        data_shown: "Every logged contact and every escalation with this person — the transcript's example is 'excessive experiential supervisor absence' (line 485)."
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.11 (Comparability Across Clinical Education Sites) and CODA Standard 2, Element 2-6 — an intervention log is the documented remediation trail when one site or supervisor drifts from the others, which is precisely what comparability standards ask a program to show it monitors and acts on."
        competitor_equivalent: "CORE ELMS documents 'incident report tracking' (core-elms.yaml) — comparable in spirit, but no public field list, follow-up model, or site/location/personnel scoping, so no element-level comparison is possible."
        gap_severity: "none"
        gap_note: "Available identically at site, location and personnel level (lines 479-491) — an unusually complete relationship-management layer that no competitor teardown in this research matches on documentation."
      - element: "Assistants card (+ icon: name and contact information)"
        type: "sub-record"
        data_shown: "An administrative assistant or scheduler attached to a busy supervisor."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Stores the assistant's contact details but the transcript does not say the assistant receives any of the automated emails — so the real-world workflow (route slot requests through the scheduler) still requires adding the assistant as their own personnel record."

  - screen: "Sites > Setup > Form Setup (custom site assessment forms)"
