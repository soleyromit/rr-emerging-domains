      emails.
    confirmed_by: >
      exxat_transcripts.md, "Linking Sites and Locations in Exxat One to
      Exxat Prism" (lines 1857-1891): "This is a one-time activity designed to establish a connection
      between the site and location information maintained by schools in Exxat Prism and the
      corresponding information in Exxat One"; "Below the site details, you'll find AI-generated
      recommendations for potential location matches organized into three categories. High confidence
