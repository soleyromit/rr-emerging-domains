        accreditation_citation: "CODA Standard 3, Element 3-4 and faculty-roster sections of LCME/COCA self-studies distinguish faculty from staff; getting this wrong at creation pollutes every later faculty count."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
