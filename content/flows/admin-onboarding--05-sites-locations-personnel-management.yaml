        accreditation_citation: "CODA Standard 4, Element 4-6 ('any site not owned by the institution where required educational activity occurs') — a health-system master agreement rarely covers every clinic in the system, and this is the only field that records which ones it does."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Nothing in the transcript indicates Prism blocks a placement at a location that is NOT in Locations Covered — the association is descriptive. Compare LCME 1.4's stated software need: 'the ability to block new placements at a site whose agreement has lapsed.' That enforcement is unconfirmed."
