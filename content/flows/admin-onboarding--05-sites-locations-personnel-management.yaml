      customises it, building sections and questions, then publishes it so it becomes selectable
      when logging a site visit.
    confirmed_by: >
      exxat_transcripts.md, lines 493-513: "If you have never configured a
      site assessment form in the past, you will have a table displaying our two standard site
      assessment forms"; "When you publish a site assessment form, this form will be used when adding
      an assessment to a site or location in the future. Once a published assessment form is used at
      least once, you will no longer be able to make changes to the assessment form."
    elements:
      - element: "Two standard site assessment forms (marked with the 'standard' indicator) + copy icon"
        type: "shipped template with clone-to-customise"
        data_shown: "Preconfigured site-visit assessment content, previewable by accordion."
        gates_on: ["Whether a new program has anything to assess sites with on day one"]
        accreditation_citation: "COCA Standard 6, Element 6.11 (Comparability Across Clinical Education Sites); CODA Standard 2, Element 2-6 (comparable instruction and assessment across all clinical sites); Nursing COA Standard F.4 per the Nursing playbook ('structured site-visit tracking... with follow-up dates pushed to the Program Calendar'). A shipped default means a new program can produce site-visit evidence before it has designed its own instrument."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes site-assessment instrument authoring. This is a shipped Prism capability with no benchmark, notable given that axiUm (axium.yaml) and CORE ELMS (core-elms.yaml) are both rated 'ahead' on Accreditation Management generally."
        gap_severity: "none"
        gap_note: ""
      - element: "Field Type dropdown (single choice, multiple choice, short/long answer, title, select from dropdown, date picker, toggle, attestation, e-signature, divider, text editor)"
        type: "form-builder question type selector"
        data_shown: "Eleven question types including attestation and e-signature."
        gates_on: ["What kind of evidence a site visit can capture"]
        accreditation_citation: "COCA Standard 5, Element 5.4 — coca.yaml's stated software need is 'a version-controlled policy library... that tracks acknowledgment/attestation of the supervision policy', with the gap_note 'Confirm Compliance Management supports document-acknowledgment item types, not just checklist/expiry items.' The attestation and e-signature field types here are direct evidence that Prism's form builder supports attestation item types — in the site-assessment context at least."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Partially answers an open question carried in coca.yaml 5.4's gap_notes. It confirms attestation/e-signature exist as form primitives; it does not confirm they can be attached to a compliance item, which is a different object."
      - element: "Per-question options — help text (hover), comments bit, 'Make This Mandatory' bit, character limit, Allow Multiple, Long Answer bit"
        type: "question configuration toggles"
        data_shown: "Guidance, optionality and input constraints per question."
        gates_on: ["Whether an assessor can submit an incomplete assessment"]
        accreditation_citation: "CODA Standard 2, Element 2-6 — mandatory fields are what make cross-site assessments actually comparable rather than sparsely completed."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Save as Draft / Preview / Publish, with status column (draft vs published)"
        type: "lifecycle controls with an irreversible lock"
        data_shown: "Draft forms are not usable; published forms become selectable when adding an assessment."
        gates_on: ["'Once a published assessment form is used at least once, you will no longer be able to make changes to the assessment form' (line 513)"]
        accreditation_citation: "CODA Standard 2, Element 2-6 and COCA 6.11 — instrument stability across sites is exactly what comparability requires, so the lock is defensible as a feature, not merely a limitation."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "A day-one trap with teeth: a new administrator experimenting with the form builder who publishes and runs one test assessment has permanently frozen that instrument. The workaround (copy to a new form) means the program accumulates near-duplicate forms and loses longitudinal comparability — the very thing 2-6 and 6.11 want."

  - screen: "Exxat One > Prism site & location linkage (one-time)"
