        gates_on: []
        accreditation_citation: "LCME Standard 1, Element 1.4 and CODA Standard 4, Element 4-6 — process evidence that the agreement was properly reviewed and executed."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
