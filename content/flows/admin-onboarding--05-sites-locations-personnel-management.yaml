        gates_on: ["Correct 1:many mapping — multiple Prism sites may be linked to one Exxat One site"]
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Add New Site / Add New Location inside the link drawer (fields prefilled from Exxat One, asterisked fields still required)"
        type: "inline record creation from external data"
