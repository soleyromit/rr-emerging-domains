# Element-level ground truth underneath competency-verification.yaml, Stage 2:
# "Build and deploy the assessment instruments tied to those competencies."
# Every accreditation_citation and competitor_equivalent below traces to a real
# source file named in confirmed_by — none are re-derived from the journey's
# own stage-level narrative.
#
# SCHEMA v2 (2026-08-24): analysis fields (accreditation_citation /
# competitor_equivalent / gap_severity / gap_note) now live on each ELEMENT
# rather than on the step. Where the original research did not distinguish
# between sibling elements, the same verdict is stated identically on each
# rather than inventing artificial precision.

flow_name: "Build and Deploy Competency-Linked Assessment Instruments"
maps_to_journey: "competency-verification.yaml, stage 2"
persona: >
  Primary actor is the Assessment / Curriculum & Competency Director configuring
  the Competency Management framework and the underlying Forms/Evaluations,
  Assignment, and LTI instruments; day-to-day activation on a specific course
  offering is typically delegated to the Clinical/Experiential Education
  Coordinator. See ../../journeys/competency-verification.yaml persona note —
  role files themselves are not yet written.

steps:
  - screen: "Competency Management — Setup Tab (Add New Framework)"
    navigation_path: "Dashboard > Curriculum Management > Competency Management > Setup tab > Add New"
    elements:
      - element: "Add New button"
        type: "button"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          None lives on this element. It is the entry point to the framework
          builder; the COCA 6.4 / CODA 2-5 evidence for this screen lives in
          the assessment-association, scoring-scale, and threshold fields.
        competitor_equivalent: >
          Not element-matched. Neither one45's nor Leo/DaVinci's public
          materials (one45.yaml, leo-davinci.yaml) document a framework-
          creation entry control at this granularity.
        gap_severity: "none"
        gap_note: "Shipped. Part of a module the journey's original stage text did not name at all."
      - element: "Select a Competency dropdown"
        type: "picker"
        data_shown: "One competency framework can be configured at a time, though multiple frameworks can exist for the same competency."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 ("rolled up per student, per competency,
          over time") — this control is where the per-competency axis of that
          rollup is chosen.
        competitor_equivalent: >
          Directional only. Leo/DaVinci markets a mapping-completion Insights
          Dashboard against tools that "only map to your assessments or your
          content" (leo-davinci.yaml, cited at Stage 1), but its public docs do
          not document a per-competency framework picker to match 1:1.
        gap_severity: "none"
        gap_note: "Shipped, and more specific than the journey's prior stage-1/stage-2 framing gave it credit for."
      - element: "Select Course Type radio (Experiential / Didactic / Both)"
        type: "toggle group"
        data_shown: ""
        gates_on: ["determines which downstream assessment pool the framework can draw from"]
        accreditation_citation: >
          None lives on this element directly; it is a scoping control that
          constrains which instruments can supply COCA 6.4 / CODA 2-5 evidence
          downstream on this same screen.
        competitor_equivalent: >
          Not element-matched. No competitor teardown on file documents a
          didactic-vs-experiential scoping control on a competency framework.
        gap_severity: "none"
        gap_note: "Shipped."
      - element: "Select the assessments to associate (multi-select picker)"
        type: "filtered picker"
        data_shown: "Only assessments with a scoring scale already configured, and matching the chosen course type (experiential vs. didactic), are shown; an eye icon previews each candidate assessment."
        gates_on: ["assessment must already have a scoring scale configured", "assessment must be active"]
        accreditation_citation: >
          COCA Standard 6, Element 6.4 (competencies must be assessed, not just
          taught) — this picker is where a competency is bound to the actual
          instruments that assess it. CODA Standard 2, Element 2-5.
        competitor_equivalent: >
          Directional only. one45's Assessment and Evaluation module ships
          customizable forms/scales and question tagging (one45.yaml), and
          Leo/DaVinci markets competency-to-content/assessment mapping
          (leo-davinci.yaml) — but neither vendor's public materials document
          an assessment-association picker gated on a pre-configured scoring
          scale, so the comparison is directional rather than element-matched.
        gap_severity: "none"
        gap_note: "Shipped, and the gating behaviour (scale-configured + active only) is more specific than the journey's stage text credited."
      - element: "Scoring Scale selector"
        type: "config field"
        data_shown: "Default 1–5 scale or a custom scale; whatever scale the underlying instrument used, scores are converted to this unified scale."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 ("rolled up per student, per competency,
          over time") — unifying heterogeneous instrument scales onto one scale
          is what makes that rollup arithmetically possible.
        competitor_equivalent: >
          Directional only. one45 ships customizable scales inside its
          Assessment and Evaluation module (one45.yaml), but its public docs do
          not document a framework-level scale-conversion step to compare
          against at this granularity.
        gap_severity: "none"
        gap_note: "Shipped."
      - element: "Competency Threshold field"
        type: "input field"
        data_shown: "Expected performance level; scores below it are flagged in reports."
        gates_on: []
        accreditation_citation: >
          COCA Standard 6, Element 6.4 (assessed, not just taught) — the
          threshold is the element that turns a recorded score into a
          pass/fail attainment judgement surfaced in reports.
        competitor_equivalent: >
          Not element-matched. No competitor teardown on file documents an
          explicit expected-performance threshold field whose breach flags the
          student in downstream reports.
        gap_severity: "none"
        gap_note: "Shipped, and considerably more specific than the journey's prior stage framing gave it credit for."
      - element: "Summary screen — Title field + Save button"
        type: "input field / button"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          None lives on this element; it commits the framework built by the
          fields above.
        competitor_equivalent: >
          Not element-matched — no competitor's public docs are granular enough
          to compare a save/commit control.
        gap_severity: "none"
        gap_note: "Shipped."
    action: >
      The Competency Director builds a competency framework by choosing which
      already-scored assessment instruments (experiential evaluations, didactic
      assessments, or course grades) feed a given competency, then sets the
      scoring scale and threshold used to judge attainment.
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Competency Management/Competency Framework Configuration and Management.md"

  - screen: "Competency Management — Map Competencies"
    navigation_path: "Curriculum Management > Competency Management > Setup tab > [Framework row] > Map"
    elements:
      - element: "Map button (per framework row)"
        type: "button"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          None lives on this element; it opens the mapping workspace where the
          COCA 6.4 / CODA 2-5 evidence on this screen actually lives.
        competitor_equivalent: >
          Not element-matched — Leo/DaVinci's public docs (leo-davinci.yaml)
          are not granular enough to compare a per-row entry control.
        gap_severity: "none"
        gap_note: ""
      - element: "Didactic / Experiential mapping-type switch"
        type: "toggle"
        data_shown: "Shown only if the framework was configured for Both."
        gates_on: []
        accreditation_citation: >
          None lives on this element directly; it scopes which pool of mapped
          instruments the director is working in.
        competitor_equivalent: >
          Not element-matched — no competitor teardown on file documents a
          didactic-vs-experiential mapping-mode switch.
        gap_severity: "none"
        gap_note: ""
      - element: "Assessment expand-arrow"
        type: "disclosure control"
        data_shown: "Reveals the individual questions inside a mapped assessment."
        gates_on: ["assessment must be associated with the framework's course type"]
        accreditation_citation: >
          COCA Standard 6, Element 6.4 — this disclosure is what exposes
          question-level resolution at all; without it mapping would stop at
          the whole-instrument level.
        competitor_equivalent: >
          Leo/DaVinci's public description ("maps every session in every course"
          to competency sets and EPAs, per leo-davinci.yaml) does not specify
          whether its mapping resolves to the individual question inside an
          assessment or only to the assessment as a whole — its public docs are
          not granular enough to support a direct element-level comparison, so
          this is stated explicitly rather than guessed.
        gap_severity: "none"
        gap_note: ""
      - element: "Add Mapping button (per question)"
        type: "button"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          COCA Standard 6, Element 6.4 (assessed, not just taught) — question-
          level mapping is the strongest available resolution of this element
          seen anywhere in this stage's research. CODA Standard 2, Element 2-5
          (instruments "mapped to the program's defined competencies").
        competitor_equivalent: >
          Leo/DaVinci's public materials (leo-davinci.yaml) do not state whether
          their mapping resolves to the individual question or only to the whole
          assessment — not granular enough for an element-level comparison,
          stated explicitly rather than guessed.
        gap_severity: "none"
        gap_note: ""
      - element: "Competency selector + Save as Draft button"
        type: "picker / button"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 (instruments "mapped to the program's
          defined competencies") — this selector is where the question-to-
          competency binding is actually recorded.
        competitor_equivalent: >
          Not element-matched — leo-davinci.yaml does not document a draft
          state for competency mappings.
        gap_severity: "none"
        gap_note: ""
      - element: "Apply Changes button"
        type: "button"
        data_shown: "Draft mappings do not affect scores until Apply Changes is clicked; applying triggers immediate recalculation."
        gates_on: ["mapping must be saved as draft first"]
        accreditation_citation: >
          CODA Standard 2, Element 2-5 ("rolled up per student, per competency,
          over time") — this control is the commit point where mapping changes
          propagate into the Review Grid, Student Dashboard, and Competency
          Reports rollups.
        competitor_equivalent: >
          Not element-matched — no competitor teardown on file documents a
          draft/apply recalculation boundary for competency mappings.
        gap_severity: "none"
        gap_note: ""
      - element: "Generate Assessment Map export"
        type: "report filter + export button"
        data_shown: "Report Anchor (Competency vs. Assessments) and Data scope (Only Mapped vs. All Data); exports to Excel."
        gates_on: []
        accreditation_citation: >
          COCA Standard 6, Element 6.4 and CODA Standard 2, Element 2-5 — this
          export is the artifact form of the mapping evidence, i.e. what a site
          visitor would actually be handed.
        competitor_equivalent: >
          Directional only. Leo/DaVinci markets a mapping-completion Insights
          Dashboard (leo-davinci.yaml) covering similar ground, but as a
          dashboard rather than a documented Excel export with anchor/scope
          filters, so the comparison is not element-matched.
        gap_severity: "none"
        gap_note: ""
    action: >
      The Competency Director maps individual QUESTIONS inside an already-
      deployed instrument (not just the whole form) to a specific competency,
      then applies the mapping so competency scores in the Review Grid, Student
      Dashboard, and Competency Reports recalculate immediately.
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Competency Management/Competency Framework Configuration and Management.md"

  - screen: "Course Learning Activities Setup — Forms/Evaluations"
    navigation_path: "Courses > [Course] > Learning Activities > Setup > Forms/Evaluations (+ icon)"
    elements:
      - element: "+ icon for Forms/Evaluations"
        type: "button"
        data_shown: "Opens a drawer listing all standard and custom-built forms."
        gates_on: []
        accreditation_citation: >
          ACPE Standard 7, Key Element 7.3.c — acpe.yaml's own
          prism_fit_rationale names this exact workflow ("Setup ->
          Forms/Evaluations -> Add Assignment") as evidence the same form
          object is reused per site by design; this control is that workflow's
          entry point.
        competitor_equivalent: >
          Directional only. eMedley's eValuate/eValuate+ is a shipped general-
          purpose evaluation engine with reusable question sets and rubrics
          (emedley.yaml), but its public pages do not document a per-course-
          offering activation drawer to compare against 1:1.
        gap_severity: "none"
        gap_note: ""
      - element: "Per-form expand arrow"
        type: "disclosure control"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          None lives on this element; it exposes the per-form configuration
          fields below, which is where the ACPE 7.3.c / CODA 2-5 evidence sits.
        competitor_equivalent: >
          Not element-matched — emedley.yaml is not granular enough to compare
          a disclosure control.
        gap_severity: "none"
        gap_note: ""
      - element: "Does this form require a placement? toggle"
        type: "toggle"
        data_shown: ""
        gates_on: ["placement existence"]
        accreditation_citation: >
          ACPE Standard 7, Key Element 7.3.c — binding an instrument to a
          placement is what makes the same form object reusable per site.
          CODA Standard 2, Element 2-5.
        competitor_equivalent: >
          Not element-matched. eMedley's eValuate ships rubrics, question sets,
          anonymous responses and dashboards (emedley.yaml), but its public
          marketing does not document a placement-gating toggle on an
          evaluation instrument.
        gap_severity: "none"
        gap_note: ""
      - element: "Does the form contribute to the student's final score? toggle"
        type: "toggle"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 — this toggle determines whether the
          instrument's output is graded evidence or formative only.
        competitor_equivalent: >
          Not element-matched — emedley.yaml does not document a per-form
          contributes-to-final-score switch at this granularity.
        gap_severity: "none"
        gap_note: ""
      - element: "Publish date / Due date anchor builder"
        type: "config field"
        data_shown: "Not an actual calendar date — a number of days before or after a placement's start, mid, or end date."
        gates_on: []
        accreditation_citation: >
          ACPE Standard 7, Key Element 7.3.c — anchor-relative dating is
          precisely the mechanic that lets one identical form definition
          redeploy unchanged across cohorts and sites, which acpe.yaml cites as
          evidence of by-design reuse.
        competitor_equivalent: >
          eMedley's eValuate/eValuate+ is a shipped evaluation engine
          (emedley.yaml), but its public marketing pages do not document an
          anchor-relative (days-before/after-placement) date mechanic to
          compare against 1:1 — the comparison is directional, not
          element-matched.
        gap_severity: "none"
        gap_note: ""
      - element: "Preview button"
        type: "button"
        data_shown: "Shows the configured form plus its workflow, with a downloadable blank copy."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 — the downloadable blank copy is a
          usable instrument artifact for a site-visit binder.
        competitor_equivalent: >
          Not element-matched — emedley.yaml does not document a preview /
          blank-copy download control.
        gap_severity: "none"
        gap_note: ""
      - element: "Course Faculty / Placement Faculty / Faculty Advisor access matrix"
        type: "permissions grid"
        data_shown: "Edit vs. view-only access per faculty role."
        gates_on: []
        accreditation_citation: >
          None lives on this element; it governs who may complete or read the
          instrument rather than supplying assessment evidence itself.
        competitor_equivalent: >
          Directional only. eMedley's eValuate ships anonymous-response
          handling (emedley.yaml), implying comparable role controls, but its
          public pages do not enumerate a per-faculty-role edit/view matrix.
        gap_severity: "none"
        gap_note: ""
    action: >
      The Coordinator activates a specific evaluation instrument (e.g. a
      competency-linked preceptor rating form) onto a course offering, using
      anchor-relative rather than fixed dates so the identical instrument
      definition redeploys unchanged across cohorts and sites.
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Courses/Managing Course Activities - Activating Forms and Evaluations.md"

