      (psychometrically valid exam scoring); LCME Standard 9, Element 9.4
      (centralized system using a variety of measures).
    competitor_equivalent: >
      eMedley's ExamN is a shipped standalone exam-management product —
      question banks, lockdown browser, eProctor webcam-proctoring add-on,
      item analysis via algorithmic psychometrics, and a competency-tied
      performance dashboard (emedley.yaml) — a directly comparable, fully
      granular element-level gap. Elentra's Assessment & Evaluation module
      ships "proctored/secured online exams" and a customizable item bank
      today (elentra.yaml). one45 has no native exam-authoring/delivery
      engine either — it only pulls third-party ExamSoft and NBME data into
      an analytics dashboard (one45.yaml) — so Prism is not uniquely behind
      here. axiUm, dentistry's entrenched incumbent, has "no exam-management
      feature found on any public axiUm/Exan/Henry Schein One page reviewed"
      (axium.yaml) — on this specific step Prism is at parity with the
      dominant dental incumbent even though it trails eMedley and Elentra.
