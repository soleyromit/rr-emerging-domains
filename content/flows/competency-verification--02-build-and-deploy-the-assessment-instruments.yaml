  - screen: "Learning Tool Interoperability — GoReact Linked Assignment"
    navigation_path: "Courses > [Course] > Learning Activities > Setup > Learning Tool Interoperability (+ icon); rubric assignment happens inside GoReact after Prism hands off"
    elements:
      - element: "Select LTI tool dropdown"
        type: "picker"
        data_shown: "GoReact is the named integration."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 (OSCEs, clinical skills testing
          measuring skills/behaviors, not recall) — this picker is where the
          skills-demonstration capability is sourced, and it sources it
          externally.
        competitor_equivalent: >
          eMedley's eValuate natively supports OSCEs and rubrics inside its own
          evaluation engine (emedley.yaml) and Elentra's Assessment &
          Evaluation module natively spans "formative assessments to summative
          exams" (elentra.yaml) — neither has an analogue to this control,
          because neither depends on a third-party LTI hand-off. A real
          architectural difference (native vs. bolted-on), not a timing gap.
        gap_severity: "configure-needed"
        gap_note: >
          The capability exists today only by selecting an external tool, so a
          school must hold a GoReact relationship before this element does
          anything.
      - element: "Active toggle / Title / Description fields"
        type: "toggle / input field"
        data_shown: ""
        gates_on: []
        accreditation_citation: "None lives on these fields; they identify and enable the linked instrument."
        competitor_equivalent: >
          Not element-matched — emedley.yaml and elentra.yaml describe native
          OSCE/rubric engines but do not document comparable LTI-link
          identification fields.
        gap_severity: "none"
        gap_note: "Shipped Prism-side configuration."
      - element: "Requires placement toggle"
        type: "toggle"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          None lives on this element; it binds the instrument to a placement
          context.
        competitor_equivalent: >
          Not element-matched — no competitor teardown on file documents a
          placement-gating toggle on an LTI-linked instrument.
        gap_severity: "none"
        gap_note: "Shipped Prism-side configuration."
      - element: "Associate a score toggle + score value field"
        type: "toggle / input field"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 — scoring is what turns the video
          submission into assessable skills evidence.
        competitor_equivalent: >
          Directional only. eMedley (emedley.yaml) and Elentra (elentra.yaml)
          score OSCE/rubric work natively, but their public docs do not
          document a score-association control on an externally delivered
          instrument.
        gap_severity: "none"
        gap_note: "Shipped Prism-side configuration."
      - element: "Contributes to final score toggle + weightage field"
        type: "toggle / input field"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 — determines whether the skills result
          carries into the graded record.
        competitor_equivalent: >
          Not element-matched — emedley.yaml and elentra.yaml do not document
          per-instrument weighting at this granularity.
        gap_severity: "none"
        gap_note: "Shipped Prism-side configuration."
      - element: "Visible to other faculties toggle"
        type: "toggle"
        data_shown: ""
        gates_on: []
        accreditation_citation: "None lives on this element; it is a visibility control."
        competitor_equivalent: >
          Not element-matched — no competitor teardown on file documents a
          cross-faculty visibility toggle at this granularity.
        gap_severity: "none"
        gap_note: "Shipped Prism-side configuration."
      - element: "(inside GoReact) Scoring & Evaluation dropdown — Rubric"
        type: "config field"
        data_shown: "Select a rubric from the GoReact library or upload a new one; rubrics are built/held in GoReact, not Prism."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-5 (OSCEs, clinical skills testing
          measuring skills/behaviors, not recall) — the rubric-scored video
          format is structurally the right shape for this element, and this is
          the element where the rubric itself lives. Also the most plausible
          home for a DO OMM manual-skills instrument named in this stage's
          domain_divergence, though no source confirms OMM-specific use.
        competitor_equivalent: >
          eMedley's eValuate natively supports OSCEs and rubrics inside its own
          evaluation engine (emedley.yaml) and Elentra's Assessment &
          Evaluation module natively spans "formative assessments to summative
          exams" (elentra.yaml) — both author and hold the rubric in-product,
          where Prism's rubric object lives outside Prism entirely. This is the
          sharpest element-level expression of the native-vs-bolted-on
          architectural difference.
        gap_severity: "configure-needed"
        gap_note: >
          Functionally covers rubric-scored skills assessment today, but the
          rubric is authored and held outside Prism — this nuances the
          "architecturally real" framing in the journey's current_state_in_prism
          for the specific OSCE/skills-demonstration format CODA 2-5 and COCA
          6.4 name. Status flips Submitted -> Reviewed automatically once the
          rubric is posted in GoReact, with no manual reconciliation back into
          Prism.
    action: >
      Faculty create a rubric-scored, video-based skills-performance
      instrument — the closest thing Prism ships today to a structured
      OSCE/clinical-skills demonstration — by handing off from a Prism
      Assignment object to GoReact for rubric authoring and scoring; status
      flips Submitted -> Reviewed automatically once the rubric is posted in
      GoReact, with no manual reconciliation back into Prism.
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Learning Activities/Set-up and Review GoReact Linked Assignment.md"

  # SCHEMA v2 EXCEPTION: this step has zero elements by definition — the module
  # does not exist in Prism, so there is no field, button, or column to attach
  # analysis to. The analysis therefore remains at step level here rather than
  # being deleted (which would destroy confirmed research) or attached to an
