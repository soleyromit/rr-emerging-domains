          encounter logging being a medicine-family convention that PT never adopted.
        gap_severity: "configure-needed"
        gap_note: >
          The most surprising discipline finding in this stage. Prism ships two reports named
          after CAPTE 6H — "Patient Disease and Condition, Practice Across Lifespan and
          Continuum of Care (CAPTE 2024 6H / 2016 6L1)" and "Practice Settings (CAPTE 2024 6H
          / 2016 6L2)" — and BOTH source their data from PTSE 1 questionnaire answers
          (Questions 7 and 3 respectively), i.e. from a student's retrospective survey after
          the experience ends, not from encounter records captured during it. capte.yaml names
          the consequence: "the evidence is retrospective and self-reported ... a program
          cannot see mid-curriculum that a given student has not yet encountered a required
          setting or population. The forward-looking gap view lives in Program Requirements,
          which is a separate object with a separate taxonomy — reconciling the two is
          manual." So PT satisfies a case-mix standard with survey data while PA and CRNA
          satisfy structurally similar standards with logged encounters — the same standard
          shape, two entirely different evidence models, and only one of them supports
          mid-rotation intervention.
    action: >
      OT/PT admin runs the weekly summary to evidence fieldwork/clinical-education duration,
      exports the raw entries as the audit trail, and uses the approved-hours total to generate
      educator thank-you certificates and CEU credit.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/
      Occupational Therapy (OT) Playbook.md (Reports section: Raw Data Timesheet, Timesheet
      Hours Summary by Week; C.1.12 support model; Thanking Fieldwork Educator);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/
      Physical Therapy (PT) Playbook.md lines 127-129 (the learning-activity inventory: PTSE 1,
      PTSE 2, CI Details Form and Timesheets as standard forms; weekly planning form, DCE surveys
      and Mid-Term Call Form as other forms; CIET v2, PTA CIET, SCIPAI, PTMACS, PTAMACS as
      assessments of student performance, with CPI 3.0 explicitly outside Exxat — and no patient or
      encounter log anywhere in it), lines 214-221 (the CAPTE-mapped reports, with "Patient Disease
      and Condition, Practice Across Lifespan and Continuum of Care (CAPTE 2024 6H / 2016 6L1)"
      pulling from PTSE 1 Question 7 and "Practice Settings (CAPTE 2024 6H / 2016 6L2)" pulling from
      PTSE 1 Question 3), and lines 69 and 176-180 (CEU credits used as part of the thank-you email
      and computed from approved timesheet hours, with programs commonly leaving the CEU total blank
      because CEUs vary by state);
      content/accreditation/acote.yaml (Standard C.1.12); content/accreditation/capte.yaml
      (Standard 6, Element 6A; Standard 6, Element 6H); content/competitors/one45.yaml;
      content/competitors/leo-davinci.yaml

  - screen: "LTI video-assignment submission (Teacher Education) — GoReact / Echo360"
    navigation_path: >
      Student: My Coursework > [assignment] > redirect into GoReact. Admin: Learning
      Activities > Setup > Learning Tool Interoperability > + icon
    elements:
      - element: "The LTI video assignment as Teacher Education's only documented in-rotation capture surface"
        type: "externally-hosted activity with two-way LTI sync"
        data_shown: >
          Students record video directly, upload video files, or submit other supported media
          (e.g. recorded teaching demonstrations, lesson observations); status updates
          (Pending Review, Reviewed) and scores sync back into Prism automatically.
        gates_on: ["Discipline/program activation — if the LTI section is absent from Learning Activities > Setup, the feature is not enabled for that discipline"]
        accreditation_citation: >
          CAEP Standard R2, Component R2.3 — clinical experiences must be "assessed with
          performance-based criteria," and CAEP names a "Tracking system of placements/
          experiences" as a possible evidence source. A timestamped video artefact with
          reviewer commentary and a score is genuinely performance-based evidence; it is not,
          however, duration or breadth evidence, which R2.3 also demands as named attributes.
        competitor_equivalent: >
          Not comparable — none of the nine competitor files documents an education-discipline
          product line at all. Every competitor in this corpus is health-professions or
          GME-focused (medicine, GME, pharmacy, dental, nursing, PT/OT/PA), so Teacher
          Education has no competitive reference point in this research. Stating that
          explicitly is more useful than reaching for a loose analogy.
        gap_severity: "configure-needed"
        gap_note: >
          The integration itself is real, two-way, and good: Prism auto-creates the matching
          activity inside GoReact on first save, so admins do not duplicate setup, and
          reviewers can leave timestamped comments and assign scores that flow back. Two hard
          constraints: activation requires an Exxat support ticket and is discipline-gated,
          and GoReact-side configuration (activity type, recording/feedback privacy) lives in
          GoReact's own documentation, not Prism's.
      - element: "Student-teaching clock hours for Teacher Education"
        type: "absent as a discipline-specific surface"
        data_shown: >
          Nothing TE-specific. The generic Timesheet learning activity is the only mechanism
          available, and no source read documents a TE program using it, a TE hour category
          taxonomy, a TE hour threshold, or a TE-named hours report.
        gates_on: []
        accreditation_citation: >
          CAEP Standard R2, Component R2.3 — Duration is one of the six named attributes CAEP
          requires documented evidence on, alongside Depth, Breadth, Diversity, Coherence and
          Modality, and the required evidence includes a scope-and-sequence chart "of every
          clinical experience from early field experience through the culminating student
          teaching / internship."
        competitor_equivalent: >
          Not comparable — no competitor file covers educator preparation. See above.
        gap_severity: "gap"
        gap_note: >
          The honest statement is that this is a DOCUMENTATION gap that may also be a product
          gap, and the TE playbook says so itself: TE "does not currently have a dedicated
          internal help-center playbook article or a CSS discipline playbook PDF," and its
          single source covers only the GoReact integration, explicitly not "standard
          evaluation forms and reports" or accreditor standards. caep.yaml adds the
          structural concern independently: "Prism's placement model is confirmed to diverge
          by discipline (PT/OT/Nursing model a Course as a Timeframe with each rotation its
          own course; PA models a Course as the clinical Setting) — TE's
          early-field-hours-plus-semester-of-student-teaching shape matches neither cleanly,
          and which variant TE programs are provisioned on is undocumented in this corpus."
          Since early field hours and a culminating student-teaching semester are two
          structurally different hour-capture problems in one program, this is the one
          discipline in this stage where the in-rotation capture model cannot be described
          from the available sources at all. Flag for a TE-specific source before any
          customer-facing claim.
      - element: "Diversity-of-P-12-students evidence on the placement record"
        type: "absent"
        data_shown: "Nothing — no confirmed field for partner-school demographics."
        gates_on: []
        accreditation_citation: >
          CAEP Standard R2, Component R2.3 — Diversity is a named required attribute
          ("opportunities with students of varied learning needs and backgrounds"), and
          candidates must have "active clinical experiences in diverse settings with diverse
          P-12 students."
        competitor_equivalent: "Not comparable — no competitor file covers educator preparation."
        gap_severity: "gap"
        gap_note: >
          caep.yaml identifies the reason this is structurally awkward rather than merely
          missing: "CAEP's 'diversity of P-12 students' attribute is a property of the SCHOOL's
          student body, not of the placement or the candidate — Prism's site/location record
          has no confirmed field for partner-school demographics, so demographic-diversity
          evidence would today be a manual crosswalk against state report-card data." Note the
          contrast with every health discipline in this file, where the diversity dimension
          (age group, condition, setting) is a property of the ENCOUNTER and is therefore
          capturable on a log. TE's is a property of an external institution, which no
          log-shaped object can capture.
    action: >
      TE candidate records or uploads a teaching video from My Coursework; the university
      supervisor reviews it inside GoReact with timestamped comments and a score, which syncs
      back to Prism.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Teacher
      Education (TE) Playbook.md (the whole note — GoReact/Echo360 LTI is the only documented
      TE workflow, and the Open Gaps section enumerates what is not documented);
      /Users/romitsoley/Downloads/CRNAVideosTranscripts.md, "Setting Up and Managing Echo360
      (GoReact) Assignments in Exxat Prism" (lines 99-117 — the same integration documented
      for a second discipline, confirming it is not TE-specific);
      content/accreditation/caep.yaml (Standard R2, Component R2.3, incl. its gap_notes on
      placement-model divergence and partner-school demographics);
      admin-onboarding--08-learning-activities-competency-management-reporting.yaml (LTI as a
      fifth learning-activity type, discipline-gated)

  - screen: "Student-side progress surfaces (Coursework, My Placements, Student Overview)"
    navigation_path: >
      My Coursework > Require Placement tab > [course] > Course Activities — and — Dashboard >
      My Placements > [placement] > Clinical Logs / Timesheets sections — and — Students >
      Overview (admin view of the same accrual)
    elements:
      - element: "Per-course log tallies: total logs, needs attention, in progress, and average log entries per day"
        type: "read-only counters, clickable into detail"
        data_shown: "Four counters at the top of the Patient Log section of a course's Course Activities tab."
        gates_on: []
        accreditation_citation: >
          COA Standard C.4 — "logs kept by every student and reviewed by program faculty on a
          REGULAR BASIS." An average-entries-per-day counter is the only documented surface in
          this stage that measures logging CADENCE rather than volume, which is what
          "regular" means.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a logging-cadence metric. eValue
          markets automated reminders on hours (competitors/e-value.yaml), which is a nudge
          rather than a measure.
        gap_severity: "none"
        gap_note: >
          Ships, and the average-entries-per-day counter is quietly the best-fitted small
          feature in this stage for COA C.4's "regular basis" clause. Nothing acts on it —
          it is a number the student sees, not a threshold anyone is alerted against.
      - element: "Calendar view of dates with submitted clinical logs"
        type: "calendar affordance on the My Placements clinical-logs section"
        data_shown: "Which dates within the placement have logs submitted against them."
        gates_on: []
        accreditation_citation: >
          COA Standard C.4 (contemporaneous, regular logging) and, negatively, COA Standard
          F.9 — a per-date view is the closest existing UI to the duty-period timeline an
          adjacency rule would need, and it shows presence/absence of a log, not shift spans.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a calendar view over log entries.
        gap_severity: "none"
        gap_note: >
          Ships for students. Worth naming because it is the only date-axis visualisation of
          clinical activity found anywhere in this stage; every other surface is a table or a
          category rollup.
      - element: "Clinical time totals on the placement card (submitted / approved / needs attention duration)"
        type: "read-only rollup on the placement"
        data_shown: "Total clinical time submitted, duration of approved time, and duration marked needs attention — for that course."
        gates_on: []
        accreditation_citation: >
          CAA-ASHA Standard 4.0, Standard 4.7 (with 4.8) — student-visible progress toward the
          credentialing hours requirement, which 4.8 requires be made available to the student
          rather than mediated by a staff request.
        competitor_equivalent: >
          one45 documents "real-time student access to longitudinal feedback"
          (competitors/one45.yaml) for evaluations; no competitor documents student-visible
          approved-vs-submitted hour totals.
        gap_severity: "none"
        gap_note: >
          Ships. The approved/submitted split is the important part: only approved time counts
          toward any accreditor threshold, and this is where a student sees the gap between
          what they logged and what has been signed off.
      - element: "Student Overview dashboard — cumulative logged hours across all experiences (Social Work)"
        type: "admin-facing per-student rollup"
        data_shown: "Cumulative logged hours alongside a placement/coursework snapshot."
        gates_on: []
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.3 — cswe.yaml names "Hours by Category
          (Learning Activities > Reports) and the Students > Overview dashboard" together as
          the accrual evidence for the 400 BSW / 900 MSW minimums.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a per-student cumulative-hours
          dashboard spanning multiple placements.
        gap_severity: "configure-needed"
        gap_note: >
          Ships, and matters more for Social Work than for most disciplines because CSWE's
          minimum is a PROGRAM total across every field experience, not a per-placement one —
          so a per-course report is structurally the wrong shape and a cross-experience
          cumulative view is the right one. The threshold is still not asserted here: cswe.yaml
          confirms "nothing red-flags a student tracking short of the CSWE floor."
      - element: "Program Requirements hour thresholds surfaced on the student profile (Nursing, PT, OT)"
        type: "per-requirement completion tracker on the student record"
        data_shown: "Progress toward program-defined requirements, including hour thresholds, visible to students and admins."
        gates_on: []
        accreditation_citation: >
          CCNE Standard III, Key Element III-H — the Nursing playbook names Program
          Requirements as where hour thresholds live and states they are "surfaced on the
          student profile so students/admins see progress toward the requirement." CAPTE
          Standard 6, Element 6H is served by the same object for PT, where per-setting
          requirements (Rural, Underserved, School-based, Integrated Clinical Experience-Acute)
          are tracked per student.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a program-requirement completion
          tracker distinct from hour reporting.
        gap_severity: "configure-needed"
        gap_note: >
          This is the second, parallel threshold mechanism in the product and the source of a
          real reconciliation problem. capte.yaml states it for PT: the forward-looking gap
          view "lives in Program Requirements, which is a separate object with a separate
          taxonomy — reconciling the two is manual." So a program can end up with setting
          categories on the timesheet, setting tags on locations, setting values on the log,
          and setting-named Program Requirements on the student profile — four taxonomies for
          one concept, none of which is documented as the system of record.
    action: >
      Student checks their own logging cadence, submitted-vs-approved hours, and requirement
      progress mid-rotation; admin reads the same accrual from the Student Overview and
      Program Requirements surfaces.
    confirmed_by: >
      Exxat-Help-Guides/Help for Students/Discipline Specific Guides/Nursing/CCE Case Log for
      Students.md (total logs / needs attention / in progress / average log entries per day);
      Exxat-Help-Guides/Help for Students/Step-by-Step Guides (How-tos)/Learning Activities/
      Adding Clinical Hours.md (calendar icon; clinical-time totals on the placement card);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
      Work (SW) Playbook.md line 145 (Students > Overview showing cumulative logged hours alongside
      the placement/coursework snapshot) with line 144 (Hours by Category tracking accrual "across
      all a student's experiences");
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing
      Playbook.md (Program Requirements hour thresholds on the student profile);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical
      Therapy (PT) Playbook.md (per-setting Program Requirements);
      content/accreditation/cswe.yaml (AS 3.3.3); content/accreditation/nursing.yaml (III-H);
      content/accreditation/capte.yaml (Standard 6, Element 6H)

