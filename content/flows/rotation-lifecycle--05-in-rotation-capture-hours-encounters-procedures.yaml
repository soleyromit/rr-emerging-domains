ons of Clinical Supervisors, Site Assessments aligned to program goals and accreditation standards, and custom forms — all support-gated to create; and the student-facing Student Performance Report across all nine service delivery areas), 104-105 (surveys buildable in Prism from December 2025), 109-114 (advisement via Communications & Interventions or custom workflow-based advisement forms with signature, plus profile-level and course-level attestations with their navigation paths), 118 (question-based early-alert notifications configured by support), 120-138 (the report suite, the shared filter set, the 50-course-offering cap, and the broader capability list incl. trend/exposure analysis, low-performance indicators and placement-readiness metrics), 142-149 (the discipline's own gap list — explicitly a DOCUMENTATION gap, plus the recurring self-service gap for SLP). In THIS file the load-bearing lines are 28-35 (the Clinical Log field vocabulary), 53-67 (the whole per-course Clinical Log setup drawer and the support-gated min/max thresholds), 71-84 (the review workflow, status model, bulk approve, the 6am EST Statistics refresh and the filter set), and 120-138 (the five-report Clinical Log family, the shared filter set and the 50-course-offering cap)."
