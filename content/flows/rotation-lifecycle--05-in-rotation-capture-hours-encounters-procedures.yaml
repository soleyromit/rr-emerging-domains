  - screen: "Timesheet Rules panel (per course) — duty-hour limits"
    navigation_path: "Learning Activity Setup > Timesheet > pencil icon > Rules section"
    elements:
      - element: "'Limit hours a student can log per day' (yes/no + max hours)"
        type: "conditional input"
        data_shown: "Default when No: up to 24 hours/day."
        gates_on: ["Student entry validation only — a per-entry cap, not a duty-hour rule"]
        accreditation_citation: >
          COA Standard F.9 (CRITICAL) — Student Time Commitment: 64 hours per week summed
          across class AND clinical hours, AVERAGED OVER 4 WEEKS, with a 10-hour rest period
          between scheduled clinical duty periods and a 16-hour ceiling on continuous direct
          patient care. This per-day cap is the only shipped control in the vicinity of that
          standard, and it tests none of the three rules.
        competitor_equivalent: >
          This is the sharpest, most direct competitor comparison in the entire file, and
          Prism is behind on it. New Innovations ships a discrete duty-hour module — "Work
          Hours Monitoring: Violation tracking, rule configuration, and automated
          notifications for duty hour compliance" — and competitors/new-innovations.yaml rates
          it "ahead" of Prism on Compliance Management partly for that reason. MedHub ships an
          "Intuitive timesheet interface with auto-alerts for violations"
          (competitors/medhub.yaml). eValue documents flagging "incomplete, or
          violation-triggering work hours" (e-value.yaml). one45 ships "duty-hours and
          leave-time tracking at the event level ... for accurate and simplified program and
          accreditation reporting" (one45.yaml). Leo/DaVinci logs duty hours per student,
          downloadable as a spreadsheet (leo-davinci.yaml). Five of the nine competitor files
          name a duty-hour concept; three of them name a VIOLATION concept. Prism's documented
          equivalent is a maximum-hours-per-day integer.
        gap_severity: "gap"
        gap_note: >
          admin-onboarding--08 reaches the same verdict from the setup side: "A per-day
          maximum is not a duty-hour rule engine — no weekly cap, no consecutive-day rule, no
          violation flag." coa.yaml scopes the missing work precisely and argues it should be
          built once rather than per-discipline: "every duty-hour rule COA states is a
          temporal-adjacency computation (rest gap between shifts, continuous-span ceiling,
          4-week rolling average) and none of the documented Timesheet reporting does adjacency
          math." Note the didactic half is worse still — F.9's 64 hours spans class AND
          clinical time, and class hours live in Courses while clinical hours live in
          Timesheet/CCE log, with nothing summing across the two.
      - element: "10-hour inter-duty-period rest check"
        type: "absent"
        data_shown: "Nothing. Requires shift start/end timestamps compared across consecutive entries; no such adjacency computation is documented."
        gates_on: []
        accreditation_citation: "COA Standard F.9 (CRITICAL) — confirmed ABSENT."
        competitor_equivalent: >
          New Innovations' Work Hours Monitoring advertises "rule configuration" for duty-hour
          compliance (competitors/new-innovations.yaml); whether its rule set includes an
          inter-shift rest interval specifically is not published, so the comparison is
          concept-level (they have a rule engine, Prism has none) rather than rule-for-rule.
        gap_severity: "gap"
        gap_note: >
          The raw material exists and is unusually good: the Timesheet entry captures Start
          Time, End Time and an Overnight toggle, so consecutive duty periods are already
          timestamped rather than typed as daily totals — and content/prism/capability-map.yaml
          confirms the limited-release geolocated Faculty Timesheet already captures real
          check-in/check-out. What is missing is the comparison BETWEEN two entries. This is
          the cheapest of the three F.9 rules to build on existing data.
      - element: "16-hour continuous-direct-care ceiling"
        type: "absent"
        data_shown: "Nothing. Requires detecting a continuous span across entries, including one crossing midnight."
        gates_on: []
        accreditation_citation: "COA Standard F.9 (CRITICAL) — confirmed ABSENT."
        competitor_equivalent: >
          Same as above — three competitor files (new-innovations.yaml, medhub.yaml,
          e-value.yaml) name violation detection generically; none publishes a
          continuous-span rule specifically. Concept-level comparison only.
        gap_severity: "gap"
        gap_note: >
          The Overnight toggle on the entry screen is the one control that shows Prism already
          models a duty period spanning two calendar days — the primitive a continuous-span
          test needs. Nothing consumes it for that purpose.
      - element: "4-week rolling 64-hour average (class + clinical)"
        type: "absent"
        data_shown: "Nothing. The shipped custom report builder aggregates Timesheet data by Sum/Average over a chosen date range, which yields a weekly total but not a rolling-window violation."
        gates_on: []
        accreditation_citation: "COA Standard F.9 (CRITICAL) — confirmed ABSENT."
        competitor_equivalent: >
          Not comparable at window level — no competitor file specifies an averaging window,
          so "they have violation tracking, Prism has a date-range sum" is as far as the
          public evidence supports.
        gap_severity: "gap"
        gap_note: >
          Worth stating precisely because it is a design trap, not just a missing feature: a
          4-week AVERAGE deliberately tolerates one heavy week and catches a sustained
          pattern. A per-week snapshot report would produce false violations, so shipping the
          naive version is worse than shipping nothing. coa.yaml argues this engine is
          "genuinely reusable" beyond CRNA — medicine and any GME-adjacent product need the
          same rules layer.
      - element: "'Limit days a student can edit past timesheets prior to approval' (yes/no + N days)"
        type: "conditional input"
        data_shown: ""
        gates_on: ["Student edit window"]
        accreditation_citation: >
          None directly; but this is the timesheet analogue of the Patient Log's N-day
          submission window, and contemporaneous entry is the behaviour COA Standard C.4 and
          ACOTE Standard C.1.12 both depend on for an auditable rather than reconstructed
          record.
        competitor_equivalent: >
          Not comparable — no competitor teardown in this research documents an edit-window
          rule.
        gap_severity: "none"
        gap_note: >
          Ships. Note the asymmetry with the Patient Log's equivalent rule, which per the PA
          admin guide is a HARD block on submission; this one governs editing before approval,
          and the student help guide separately confirms Pending Review entries remain
          editable while Approved ones do not.
      - element: "Allow future-dated entries (yes/no)"
        type: "radio"
        data_shown: "For programs that allow logging planned or pre-scheduled activity in advance."
        gates_on: []
        accreditation_citation: >
          None directly. Relevant negatively: hours logged before they are worked cannot serve
          as CSWE Accreditation Standard 3.3, AS 3.3.3 accrual evidence or ACOTE Standard
          C.1.12 week-equivalence evidence until they are approved after the fact.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a future-dating rule.
        gap_severity: "none"
        gap_note: >
          Ships as an admin choice. The OT playbook's "record overall hours by placement
          duration (e.g. by week)" pattern is the practice most likely to rely on it, and is
          also the practice acote.yaml flags as weakening "the audit trail the standard's
