        gates_on: ["Whether a signed supervision statement exists per reviewed log", "Mutually exclusive with auto-approval"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.8B (via CFCC Standard V-E) and COA Standard C.4
          — the two standards in this file that most explicitly demand a supervisor-affirmed
          record. This is the object that satisfies them, and it is NOT the profile/course
          attestation object analysed above.
        competitor_equivalent: >
          Not comparable, and notably so — across all nine competitor files no supervisor-side
          attestation captured at log-approval time is documented. eMedley's "preceptor
          time-approval" (competitors/emedley.yaml) is an approval, not a signed statement.
        gap_severity: "configure-needed"
        gap_note: >
          Correcting an implicit assumption in the original four-domain version of this file:
          Prism has TWO attestation objects, not one. The student-facing profile/course
          attestation is the one that cannot reach an encounter; the supervisor-facing
          log-review attestation is per-review, admin-authorable without a vendor ticket, and
          prints into the SLP Clock Hours report. Its constraints are (1) mutual exclusion with
          auto-approval, stated verbatim in the CRNA transcript at line 71 and in the PA
          playbook, and (2) free text — it records assent to a sentence, not a structured
          claim, so it still cannot answer COA C.4's factual question ("did the student
          personally manage the critical portions?") as data.
          SECOND CORRECTION 2026-08-25, and it changes the shape of this element rather than
          adding to it. This file described the log-setup Attestation as SUPERVISOR-side by
          construction. That is true for SLP and for CRNA and is NOT true for PA. The three
          Exxat-authored sources disagree, verbatim:
          - SLP: "activate the Enable Attestation bit to provide an attestation that CLINICAL
            EDUCATORS need to sign WHEN THEY REVIEW student submitted logs"
            (/Users/romitsoley/Downloads/SLPVideosTranscripts.md line 37; same framing in
            Speech-Language Pathology (SLP) Playbook.md line 64).
          - CRNA: "enable the Enable Attestation option to require PRECEPTORS to acknowledge an
            attestation WHEN REVIEWING logs" (/Users/romitsoley/Downloads/CRNAVideosTranscripts.md
            line 71).
          - PA: "enable the attestation option if you want STUDENTS to acknowledge a statement
            BEFORE SUBMITTING THEIR LOGS. For example, you can include an academic integrity
            statement" (/Users/romitsoley/Downloads/PAVideosTranscripts.md line 39).
          So the same Enable Attestation toggle is documented as binding a DIFFERENT ACTOR at a
          DIFFERENT MOMENT depending on the discipline. Both readings share the same auto-approval
          exclusion, which is consistent with them being one mechanism rather than two — but they
          are not interchangeable as evidence. A student-signed pre-submission integrity pledge is
          an academic-honesty artifact; a supervisor-signed post-review statement is the
          supervision-accountability artifact CFCC Standard V-E and COA Standard C.4 actually ask
          for. Cited here as a documented contradiction to resolve, not silently reconciled: before
          this element is used in a PA conversation, confirm whether the PA drawer offers the
          supervisor-side variant at all, because if it does not, PA's patient log has no
          supervision attestation and the auto-approval interlock documented two steps above means
          it may have no supervisor review either.
