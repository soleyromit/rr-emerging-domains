# Element-level ground truth underneath rotation-lifecycle.yaml, stage 5.
# Every accreditation_citation and competitor_equivalent claim below traces to a real source
# file in confirmed_by — never re-derived from the journey's own narrative.
# SCHEMA v2 (2026-08-24): analysis fields live on each element, not on the step.
#
# 12-DISCIPLINE PASS (2026-08-25): this file was originally built covering only the four
# expansion domains (DO, Pharmacy, Dentistry, Medicine). It now also covers the eight
# disciplines Exxat/Prism serves today — PT/PTA, OT/OTA, PA, SLP, Nursing, Social Work,
# Teacher Education, and CRNA. This is the most discipline-varied stage in the journey,
# because the UNIT OF RECORD itself changes by discipline:
#
#   PT/PTA      — hours (Timesheet); encounter logging is largely unused, and CAPTE case-mix
#                 evidence comes from a POST-rotation survey form (PTSE 1), not from logs.
#   OT/OTA      — hours (Timesheet), often recorded weekly rather than daily.
#   PA          — encounters (Patient Log) + hours (Timesheet) for the telehealth ceilings.
#   SLP         — TIME, but captured on a distinct Learning Activity type (Clinical Log),
#                 split intervention/evaluation and direct-contact/observation minutes.
#   Nursing     — hours by category (Timesheet), plus Patient Log for encounter logging.
#   Social Work — hours (Timesheet) with break/time-off auto-deduction.
#   Teacher Ed  — no documented hour/encounter surface at all; the only confirmed TE
#                 in-rotation capture is a GoReact/Echo360 LTI video assignment.
#   CRNA        — cases AND anesthesia time AND procedures AND duty hours, on one CCE log.
#
# Three cross-cutting objects do the accreditation work in every discipline: the per-log
# supervisor link, the preceptor-signed attestation at review time, and the threshold report.
# Their gaps are catalogued per element below rather than summarised at screen level.
#
# SOURCE REMEDIATION (2026-08-25): the two Level-0 discipline video transcripts that document
# this stage's central objects — /Users/romitsoley/Downloads/PAVideosTranscripts.md (Patient Log
# setup and review) and /Users/romitsoley/Downloads/SLPVideosTranscripts.md (Clinical Log setup,
# review and the five-report family) — were cited in content/personas/, content/prism/
# capability-map.yaml and admin-onboarding--08, but in NONE of this journey's eight flow files.
# Both have now been read in full and threaded through the elements below. Two of the findings
# they produced are CORRECTIONS rather than additions, and both are flagged inline: (a) the
# Enable Attestation toggle is documented as binding the STUDENT before submission in PA and the
# SUPERVISOR at review time in SLP and CRNA — see the Attestations step; (b) enabling
# auto-approval is documented as disabling PRECEPTOR REVIEW ITSELF, not merely the attestation —
# see the Patient Log Setup step. A third finding partially corrects the SLP playbook's own
# stated gap that the nine KASA service-delivery areas are never enumerated: the SLP transcript
# names one of them ("voice and resonance") as a live report column.
flow_name: "In-Rotation Capture: Patient Log, Clinical Log, CCE Log, Timesheet & Supervision Attestation"
maps_to_journey: "rotation-lifecycle.yaml, stage 5"
persona: >
  Multi-persona by design, matching the stage's own framing. The Student is the primary
  actor (captures the encounter/hour/procedure record). The Experiential Supervisor /
  Preceptor (role-preceptor.yaml) reviews and approves/attests via an emailed link, outside
  a full Prism login — the role is named differently per discipline (Clinical Instructor for
  PT/PTA, Fieldwork Educator for OT/OTA, Clinical Educator for SLP, Field Instructor or Task
  Supervisor for Social Work, Preceptor for PA/Nursing/CRNA, Cooperating/Mentor Teacher for
  Teacher Education), but is one Prism entity underneath. The Program Administrator
  (role-program-admin.yaml) configures the log form, the lookup taxonomies (CPT/Medication/
  Disease-and-Condition, Participation Levels, timesheet categories), and runs the aggregate/
  threshold reports that turn individual logs into accreditation evidence.
steps:
  - screen: "Patient Log Entry Drawer"
    navigation_path: >
      Dashboard > My Placements > [placement card] > Patient Log > Add Patient Log — or —
      Coursework > [course requiring placement] > View Details > Patient Logs section > +
    elements:
      - element: "Clinical Notes"
        type: "text area"
        data_shown: "Free-text notes on the encounter, observations, or care provided."
        gates_on: []
        accreditation_citation: >
          None. Free text carries no coded value, so no LCME 6.2 "defined, published set"
          evidence lives on this element — the coded lookup fields below carry that.
        competitor_equivalent: >
          Neither eMedley's eCLAS nor Leo's Patient Encounter Tracking publishes a
          field-by-field schema (competitors/emedley.yaml, leo-davinci.yaml), and neither
          names a narrative-notes field specifically — not comparable at this granularity.
        gap_severity: "configure-needed"
        gap_note: >
          Present only if the program's Log Layout template includes it; no fixed schema.
      - element: "Date of Encounter"
        type: "date picker"
        data_shown: "Date the encounter occurred."
        gates_on: ["Placement start/end date window; school-set 'restricted date choices' limiting how far back a log can be entered"]
        accreditation_citation: >
          None directly; the date is what makes the log auditable against the placement
          window, but no standard read here names a date field as its evidence locus.
        competitor_equivalent: >
          Not comparable — no competitor teardown in this research documents entry-date
          restriction windows at field level.
        gap_severity: "none"
        gap_note: >
          Ships with school-configurable back-dating restrictions, per the student help guide.
      - element: "Patient Age Group"
        type: "dropdown (lookup)"
        data_shown: "Age group representing the patient at time of encounter."
        gates_on: []
        accreditation_citation: >
          LCME Standard 6, Element 6.2 — this is the "patient types" half of the required
          defined, published set. For the existing disciplines the same field carries CAPTE
          Standard 6, Element 6H ("across the life span"), ACOTE Standard A.5.1 (lifespan
          breadth for generalist practice), and — most load-bearing — COA Standard E.2.3's
          age-keyed Special Cases rows (geriatric 65+ >=100, pediatric 2-12 >=30, pediatric
          <2 >=10), which are literal per-student minimum counts, not narrative claims.
        competitor_equivalent: >
          Not comparable — eMedley and Leo public sources name diagnosis, procedure, and
          setting categories, but neither names a patient-demographic/age-group field.
        gap_severity: "configure-needed"
        gap_note: >
          The dropdown exists, but its value list is program-configurable per Log Layout
          template — LCME 6.2's required list has to be built as this program's own set.
          For SLP, age group is not a Patient Log field at all: it is a first-class reporting
          AXIS on the separate Clinical Log module, cross-tabulated against the nine KASA
          service-delivery areas (see the SLP report-family step below).
      - element: "Disease and Condition"
        type: "typeahead (Standard lookup category)"
        data_shown: "Patient's diagnosed condition/presenting concern; ICD-10 codes appear as a dropdown while typing if the program requires diagnosis coding."
        gates_on: []
        accreditation_citation: >
          LCME Standard 6, Element 6.2 — the "conditions" half of the required defined,
          published set. CAPTE Standard 6, Element 6H names the same dimension for PT
          ("diseases and conditions representative of those commonly seen in practice");
          ARC-PA Standard B3, Element B3.03 a-c makes it a preventive/acute/chronic split.
        competitor_equivalent: >
          eMedley's eCLAS ships mobile ICD-10 case logging (competitors/emedley.yaml,
          e-value.yaml) and Leo logs diagnoses as a column on a single-encounter record
          (leo-davinci.yaml). Both name the same category as this field, but neither
          publishes a full field schema — a category-level match, not byte-for-byte.
        gap_severity: "none"
        gap_note: >
          Ships as a system-provided ("Standard") lookup category with ICD-10 coding, so
          unlike most fields here it is not build-it-yourself. Discipline note: per
          content/prism/capability-map.yaml the PA pricing model makes ICD codes
          non-chargeable and CPT codes chargeable ($18/student/year), so diagnosis coding is
          the free half and procedure coding the paid half of the same drawer.
      - element: "Environment of Care"
        type: "dropdown (lookup)"
        data_shown: "Healthcare setting where the encounter took place (e.g. acute care, outpatient, community care)."
        gates_on: []
        accreditation_citation: >
          LCME Standard 6, Element 6.2 — the "settings" half of the required defined,
          published set. This is the single most reused element across the eight existing
          disciplines: ARC-PA Standard B3, Element B3.04 a-d requires all four of Emergency
          Department / Inpatient / Outpatient / Operating Room per student; CAPTE Standard 6,
          Element 6H requires settings "representative of those where physical therapy is
          practiced"; ACOTE Standard A.5.1 requires generalist breadth across settings.
        competitor_equivalent: >
          Both eMedley/eCLAS and Leo name a setting category on the encounter record
          (competitors/emedley.yaml, leo-davinci.yaml) — same category, no published field
          schema to compare against.
        gap_severity: "configure-needed"
        gap_note: >
          Program-configurable value list per Log Layout template; no out-of-the-box
          medicine/DO/dentistry setting list confirmed in any source read. For PA the
          documented best practice is the opposite of build-your-own — arc-pa.yaml records
          that programs tag LOCATIONS with the four ARC-PA settings and let the log inherit
          the vocabulary, so setting lives in two places and can drift between them.
      - element: "Procedure / Medication"
        type: "typeahead (Standard lookup categories: CPT, Medication)"
        data_shown: "Procedure or medication involved in the encounter, searched and selected from the program's configured lookup list."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-24 (procedure-level evidence) — partial only; see the
          Lookups tab element in the next step for why. COA Standard C.4 imposes a stricter
          crediting rule on the same field for CRNA: a student may count a procedure only if
          they PERSONALLY performed it, and observation-only involvement cannot be counted.
        competitor_equivalent: >
          eMedley's eCLAS ships mobile CPT logging and Leo logs procedures as a column
          (competitors/emedley.yaml, e-value.yaml, leo-davinci.yaml) — category-level match
          on procedure coding; neither publishes the underlying code-set options. New
          Innovations goes one step further than any of them and imports procedure records
          directly from the ACGME Resident Case Log System (competitors/new-innovations.yaml,
          rated "ahead" on Clinical & Experiential Education) — no comparable
          certification-body import is documented for Prism in any source read, which is the
          nearest analogue to what a CRNA program needs for NBCRNA.
        gap_severity: "configure-needed"
        gap_note: >
          CPT is a Standard (system-provided) lookup category; CDT is not — so for a dental
          program this field must be populated from an admin-built lookup. See the next step.
          The procedure field also has no documented "performed / assisted / observed"
          participation qualifier on the field itself (participation lives on the separate
          Participation Levels lookup), which is exactly the distinction COA C.4 makes
          crediting turn on.
      - element: "Interprofessional Practice information"
        type: "input field(s)"
        data_shown: "Collaboration with other healthcare professionals involved in the patient's care."
        gates_on: []
        accreditation_citation: >
          None among the four expansion-domain standards read for this step; no LCME 6.2 or
          CODA 2-24 clause names interprofessional collaboration as encounter-log evidence.
          It IS named for PT, though not on this element: CAPTE Standard 6, Element 6F covers
          intra-professional (PT/PTA) and interprofessional learning activities, and Prism's
          shipped "Involvement in Interprofessional Practice and Supervision of PTAs (CAPTE
          2024 6F)" report sources that evidence from PTSE 1 Question 14 — a post-rotation
          survey answer, not this log field.
        competitor_equivalent: >
          Not comparable — no competitor teardown in this research names an
          interprofessional-practice field on the encounter record.
        gap_severity: "configure-needed"
        gap_note: >
          Present only if the program's Log Layout template includes it; no fixed schema.
          Worth flagging that PT already has a CAPTE-numbered report for this concept that
          reads from a different object entirely, so a PT program enabling this log field
          would be creating a second, unreconciled source for the same standard.
      - element: "Experiential Supervisor dropdown"
        type: "dropdown, scoped to placement"
        data_shown: "Supervisors already associated with this specific placement; 'add new' option if the program allows student-added supervisors."
        gates_on: ["Only supervisors linked to the placement's site or its parent site appear"]
        accreditation_citation: >
          LCME Standard 9, Element 9.3 (supervision attestation per encounter). This same
          element is analyzed in full at the "Patient Log <-> Experiential Supervisor Linkage"
          step below, where the eight existing disciplines' supervision standards (CAA-ASHA
          3.8B, COA F.7, ACOTE C.1.7, CSWE B3.3.6/M3.3.6) are cited against it.
        competitor_equivalent: >
          New Innovations markets a Procedure Logger with "supervision-level tracking"
          (competitors/new-innovations.yaml), but that is a marketing page, not a documented
          field list — not granular enough to compare against this dropdown.
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed as a per-log (not just per-placement) supervisor link. The "role/level"
          half of 9.3 is unconfirmed — see the linkage step below.
      - element: "Log layout template (the discipline-variant field set itself)"
        type: "system-selected form template, one active per course"
        data_shown: >
          The field set a student actually sees. Confirmed to differ radically by discipline
          even though all of them are 'Patient Log' underneath: PA logs demographics, chief
          complaints, diagnoses, procedures; CRNA's 'single CCE form' logs anesthesia time,
          case counts and eight COA taxonomy families; SLP does not use this object at all
          and has its own Clinical Log Learning Activity type.
        gates_on: ["Everything the program can ever report on for this course", "Which accreditation standard the log can evidence at all"]
        accreditation_citation: >
          ARC-PA Standard B3, Element B3.04 a-d and COA Standard E.2.3 both make the same
          point from opposite directions: the template's field set IS the evidence model. For
          ARC-PA the four required settings must be capturable attributes; for COA the eight
          Appendix families (Patient Physical Status, Patient Assessment, Special Cases,
          Anatomical Categories, Methods of Anesthesia, Regional/Arterial techniques, etc.)
          must each be a countable field.
        competitor_equivalent: >
          Elentra ships a "Logbook for patient encounters/procedures with supervisor
          evaluation" inside Clinical Experience Management (competitors/elentra.yaml, rated
          at-parity), and one45 ships "procedure/patient-encounter logs" inside Assessment and
          Evaluation (one45.yaml) — but neither publishes whether the log schema is
          program-authorable or vendor-fixed, so the self-service question this element turns
          on cannot be compared from public docs.
        gap_severity: "gap"
        gap_note: >
          Only ONE Patient Log template can be active per course at a time (different courses
          may use different templates), and the template is not admin-editable: per the PA
          admin guide "A standard layout is available by default. Customized layouts can be
          requested through your CSS Agent, your Account Manager, [or] Exxat Support." The PA
          administrator video transcript states the same and adds the conceptual framing this file
          had not carried — templates ARE the discipline's log types: "In some cases, PA programs may
          want to use different patient logs for different courses or rotations. To support this, we
          offer PATIENT LOG TEMPLATES, WHICH CAN BE THOUGHT OF AS DIFFERENT PATIENT LOG TYPES. We
          provide a standard template, but if you need a customized template, you can contact your
          CSS agent or account manager for assistance. You can also reach out to our support team at
          prism-support@exxat.com to request changes to EXISTING templates"
          (/Users/romitsoley/Downloads/PAVideosTranscripts.md lines 27-29). Two things follow. The
          per-course template choice is how a PA program expresses that a surgery rotation and a
          behavioural-health rotation capture different fields, so one-template-per-course is the
          mechanism for variety rather than a limit on it — and the support dependency covers
          CHANGES TO EXISTING templates as well as new ones, which is the sharper half. Because the CRNA and PA layouts are
          the accreditation evidence model for COA E.2.3 and ARC-PA B3.04 respectively, an
          accreditor edition change (COA's Jan 2026 Appendix, ARC-PA's 6th Edition) is a
          vendor ticket, not an admin task. This is the same vendor dependency
          admin-onboarding--08 rates a gap on the form builder, reaching this file from the
          clinical side rather than the setup side.
      - element: "Save / Submit buttons"
        type: "button"
        data_shown: "Save marks the log 'In Progress' (editable draft); Submit sends it to the school for review; sending to the Experiential Supervisor for review is a separate, manual step afterward."
        gates_on: []
        accreditation_citation: >
          None. Workflow control, not an evidence-bearing field.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents log submission-state transitions
          at button level.
        gap_severity: "none"
        gap_note: >
          Both states ship. Worth noting from the help guide's own wording: routing a
          submitted log to the Experiential Supervisor is a separate manual step, not part of
          Submit — a workflow friction, not a standards gap.
      - element: "'Send for Clinical Educator Review' action (per-log routing, resendable)"
        type: "button on the log-hours drawer"
        data_shown: "Routes one or more already-submitted logs to the named clinical educator/preceptor for sign-off; the same control resends if the educator did not act."
        gates_on: ["Whether a supervisor sign-off record exists at all for this log"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.8B (a reviewable supervision trail signed by the
          clinical educator on every clinical encounter) and COA Standard C.4 (logs reviewed
          by faculty "on a REGULAR BASIS," not once at graduation). This button is the only
          documented mechanism that turns a submitted log into a supervisor-reviewed one when
          auto-approval is off.
        competitor_equivalent: >
          eMedley documents "preceptor time-approval" inside eCLAS (competitors/emedley.yaml)
          and eValue markets that teachers "review and validate logs" (e-value.yaml) — the
          same concept, but neither publishes whether routing is automatic on submission or a
          separate student-initiated action, which is precisely the difference this element
          exposes.
        gap_severity: "configure-needed"
        gap_note: >
          Resolves the "separate manual step" hedge on the Save/Submit element above into a
          named, documented, repeatable control — and confirms the friction is real: for
          SLP/Social Work the STUDENT is responsible for pushing their own log to the person
          who will attest to it. Per the student help guide the same control also allows
          editing and deleting a submitted (not yet approved) log and resending it. Contrast
          the Timesheet's "Send for Review," which routes directly to the assigned reviewer.
      - element: "Approved-status lock (permanent academic record)"
        type: "system-enforced state transition"
        data_shown: "Once a log reaches Approved it is verified and locked; it cannot be edited or deleted by the student. Statuses: In Progress -> Pending Review -> (Needs Attention <-> resubmit) -> Approved."
        gates_on: ["Student ability to edit", "Whether the log is defensible as an unaltered record"]
        accreditation_citation: >
          COA Standard C.4 — the standard's required software behaviour is explicitly "a
          review/approval workflow that produces an immutable record once approved (because
          these logs are simultaneously the academic record, the accreditation evidence, and
          the certification eligibility artifact)." This element is that behaviour, shipped.
        competitor_equivalent: >
          No competitor teardown in this research documents record immutability after
          approval at state-transition level — eValue, eMedley, Leo, one45 and Elentra all
          describe logging and review, none describes a lock. Not comparable, and Prism looks
          stronger here than anything documented, though absence of evidence is not evidence
          of absence.
        gap_severity: "none"
        gap_note: >
          Ships and is documented in the student-facing Nursing/CRNA guide in bold: "Approved
          logs cannot be edited or deleted." The CRNA guide frames it as becoming "part of
          your permanent academic record." Faculty retain an Update action for typo-level
          corrections, and per the PA admin guide moving a log to Needs Attention REQUIRES
          feedback text, so the loop back to the student is always accompanied by a reason.
    action: >
      Student documents a single patient encounter — including which named supervisor was
      present — and either saves it as a draft, submits it for school review, or pushes it to
      the named clinical educator for sign-off.
    confirmed_by: >
      Exxat-Help-Guides/Help for Students/Step-by-Step Guides (How-tos)/Coursework/Completing
      Patient Logs.md; Exxat-Help-Guides/Help for Students/Step-by-Step Guides (How-tos)/
      Learning Activities/Adding Clinical Hours.md (steps 9-16, the Send for Clinical Educator
      Review loop); Exxat-Help-Guides/Help for Students/Discipline Specific Guides/Nursing/
      CCE Case Log for Students.md (status model and Approved lock);
      Exxat-Help-Guides/Help for Program Administrators/Discipline Specific Guides/PA
      Discipline/Setting Up and Managing Patient Log - PA.md (template availability and the
      Needs Attention feedback requirement);
      /Users/romitsoley/Downloads/PAVideosTranscripts.md — "Physician Assistant: Setting up and
      Managing Patient Logs in Exxat Prism" (vimeo.com/1190121374, 6:26), READ IN FULL 2026-08-25
      and previously uncited anywhere in this journey's eight flow files. Lines 25-41 are the setup
      drawer (Learning Activities > select course > Setup > pencil on Patient Log; template
      selection and Preview Layout; templates as log TYPES and the CSS/support dependency for new
      OR CHANGED ones; the N-day post-encounter submission limit; the Grading section incl. maximum
      score, weightage and Grading Type; the Review and Approval interlock in which auto-approval
      DISABLES preceptor review; the wrench column customization with the first four columns fixed;
      and the STUDENT-side pre-submission attestation, unavailable when auto-approval is on). Lines
      43-61 are the review workflow (the per-student status table, the four status colours, the
      per-rotation accordion, the Pending Review / Needs Attention header counts and the instruction
      to chase students outside Exxat, the setting/status/faculty filters, per-log Approve and Need
      Attention with a mandatory reason, direct admin edits followed by Update, delete, bulk review,
      the Action-column Edit and the history icon, and the per-placement Excel export). Line 70
      records that a second PA video on the same topic is private on Vimeo and could not be
      transcribed — i.e. this is the complete PA administrator video record.

  - screen: "Patient Log Setup: Forms & Lookups"
    navigation_path: "Courses > Setup > Learning Activity > Patient Log > Setup Logs tab / Lookups tab"
    elements:
      - element: "Setup Logs tab — form list"
        type: "table"
        data_shown: "Form Name, Status (Draft/Published), Last Updated By, available actions (Publish/Duplicate/Edit/Delete)."
        gates_on: ["A form cannot be unpublished once Published (per capability-map.yaml's Custom Site Assessment form builder pattern, same form-builder family)"]
        accreditation_citation: >
          CODA Standard 2, Element 2-24 — indirectly: this list governs which form template
          is live, and therefore whether a procedure-code field appears on the log at all.
        competitor_equivalent: >
          axiUm is the CODA-specific incumbent (85-90% of U.S. dental schools per
          competitors/axium.yaml), but its public materials describe chairside
          scheduling/sign-off only at marketing level — axium.yaml itself rates
          "depth_vs_prism: unknown" — so no element-level comparison is possible.
        gap_severity: "configure-needed"
        gap_note: >
          The form-management surface ships; what it manages is program-built. No
          out-of-the-box discipline template is confirmed in any source read.
      - element: "Create New Form"
        type: "button + method picker"
        data_shown: "Use From Template, Use From Document, Create from JSON, or From Scratch."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-24 — indirectly, same as the form list: this is where a
          procedure-log form would be created.
        competitor_equivalent: >
          Not comparable — axium.yaml rates depth_vs_prism as unknown and publishes no
          form-builder detail (competitors/axium.yaml).
        gap_severity: "configure-needed"
        gap_note: >
          Four creation methods ship, but "Use From Template" is not confirmed by any source
          read to include a pre-built medicine/DO/dentistry log template — the template
          library's contents are undocumented. Note the tension with the existing
          disciplines: the PA and CRNA admin guides both state plainly that a customized log
          LAYOUT must be requested from a CSS Agent/Account Manager/Support, so whatever this
          builder authors, it is not the discipline log layout itself.
      - element: "Lookups tab — Lookup Category list"
        type: "list, some rows tagged 'Standard'"
        data_shown: "System-provided ('Standard') categories confirmed: CPT, Medication, Disease and Condition."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-24 — Gap. This element is where that gap is located."
        competitor_equivalent: >
          Not comparable — axiUm holds 85-90% of U.S. dental schools (competitors/axium.yaml)
          but publishes no lookup-category schema, so its CDT handling cannot be compared
          against this list.
        gap_severity: "gap"
        gap_note: >
          The only "Standard" (system-provided) procedure-coding lookup category documented is
          CPT, not CDT. Nothing in the help-center documentation shows CDT as a pre-built
          category the way CPT is. This confirms, rather than resolves, coda.yaml's Gap rating
          on 2-24: per coda.yaml, a dental procedure log "should speak CDT natively rather than
          inventing a parallel taxonomy." The same absence pattern holds for the existing
          disciplines' code sets: no source read names an NBCRNA case-category set, an ASHA
          nine-service-delivery-area set, or a CSWE nine-competency set as a Standard lookup
          category — every one of them is program- or support-loaded.
      - element: "Add New Lookup panel"
        type: "form (Excel upload)"
        data_shown: "Upload an .xlsx of lookup values, select the Lookup Category, optionally add one or more Participation Levels."
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-24 — this is the mechanism by which the gap above is
          worked around. Also carries LCME Standard 6, Element 6.2's "expected level of
          student responsibility" via the Participation Levels field — the same field that
          carries CAA-ASHA Standard 3.0B, Standard 3.1B's direct-contact-vs-observation split
          (max 25 of the 400 hours may be observation) and COA Standard C.4's crediting rule
          that observation-only involvement cannot be counted at all.
        competitor_equivalent: >
          Not comparable — no competitor teardown in this research documents a bulk
          lookup-value upload at element level.
        gap_severity: "configure-needed"
        gap_note: >
          A CDT-coded lookup is buildable here via the generic Excel-upload mechanism, so the
          capability exists — it is just not out-of-the-box. Distinct from the Lookup Category
          list above, which is where the absence itself sits. The Participation Levels
          sub-field is quietly the highest-leverage thing on this panel for the existing
          disciplines: it is the only documented place where "how involved was the student"
          becomes a structured value, and both ASHA's 25-hour observation ceiling and COA's
          "personally provided anesthesia for critical portions" rule are participation-level
          tests, not encounter-count tests.
      - element: "Diagnosis Minimums / Procedure Minimums (PA)"
        type: "program-defined threshold set, collected on an Excel intake sheet"
        data_shown: >
          Which diagnoses students must encounter and the minimum encounters per diagnosis;
          which procedures they must observe/assist/perform and the minimum counts; and the
          rotations/settings in which each must occur (playbook examples: hypertension,
          diabetes, asthma; suturing, venipuncture, EKG interpretation, wound care, joint
          injections).
        gates_on: ["Whether the Required Procedures Count Report and the real-time student progress view have anything to measure against"]
        accreditation_citation: >
          ARC-PA Standard B3, Element B3.03 a-c (SCPE learning outcomes for preventive, acute
          and chronic patient encounters) and Standard B3, Element B3.04 a-d (the four
          required settings) — arc-pa.yaml names Diagnosis and Procedure Minimums directly as
          the mechanism that "let programs set per-rotation encounter floors so students see
          gaps in real time." The same mechanism is what COA Standard E.2.3 needs for its ~60
          Appendix case-count minimums.
        competitor_equivalent: >
          No competitor teardown in this research documents a configurable per-diagnosis or
          per-procedure minimum-count threshold. eValue's closest published claim is flagging
          "incomplete, or violation-triggering work hours" (competitors/e-value.yaml) — a
          duty-hour concept, not an encounter-quota one. Genuinely not comparable, and this
          appears to be a Prism-side strength no competitor file documents an answer to.
        gap_severity: "configure-needed"
        gap_note: >
          Real and shipped, but not self-service: per the PA playbook a "CSS note" instructs
          that diagnosis and procedure minimums "need to be collected under separate tabs in
          the Excel spreadsheet" during requirements gathering — i.e. the program states them,
          Exxat loads them. Three limits carried over from coa.yaml's analysis of the same
          mechanism, all unresolved by any source read here: no cohort-conditional thresholds
          (COA's dagger-marked rows bind only students matriculating on/after Jan 1 2026, so
          one course offering must apply two threshold sets), no actual-vs-simulated
          sub-counts, and no confirmation that one encounter can increment several thresholds
          at once, which COA's "count all that apply" footnote requires.
      - element: "Review and Approval section — the auto-approval / preceptor-review interlock (PA)"
        type: "conditional toggle pair on the Patient Log setup drawer"
        data_shown: >
          "In the Review and Approval section, indicate whether you want to enable automatic
          approval of logs upon submission. IF YOU SELECT YES, THE OPTION FOR PRECEPTOR REVIEW OF
          THE PATIENT LOG WILL BE DISABLED. If you select No, you can then choose whether the
          preceptor should review the log before approval"
          (/Users/romitsoley/Downloads/PAVideosTranscripts.md line 35).
        gates_on:
          - "Whether ANY preceptor review of a patient log is possible for this course — auto-approval does not merely skip review, it removes the option."
        accreditation_citation: >
          ARC-PA Standard B3, Element B3.03 a-c (content/accreditation/arc-pa.yaml) — the SCPE
          learning outcomes a patient log evidences are outcomes a preceptor is supposed to have
          seen. COA Standard C.4 (content/accreditation/coa.yaml) — logs "reviewed by program
          faculty on a REGULAR BASIS," which coa.yaml pairs with an immutable post-approval record;
          an auto-approved log is immutable without ever having been reviewed. CAA-ASHA Standard
          3.0B, Standard 3.8B for the SLP equivalent.
        competitor_equivalent: >
          Not comparable at element level. eMedley documents "preceptor time-approval" inside eCLAS
          and eValue that "teachers review and validate logs" (content/competitors/emedley.yaml,
          e-value.yaml); neither publishes whether their review step can be switched off, which is
          the whole content of this element.
        gap_severity: "gap"
        gap_note: >
          NEW 2026-08-25, from the PA administrator video transcript — a source cited NOWHERE in
          this journey's eight flow files before this pass. It materially sharpens a finding this
          file already carried in weaker form.
          The attestation step below (and the CRNA transcript at line 71) established that ENABLING
          AUTO-APPROVAL DISABLES THE ATTESTATION. The PA transcript establishes something stronger
          and one level up the chain: enabling auto-approval disables PRECEPTOR REVIEW ITSELF. So
          the choice is not "signed review versus unsigned review," it is "reviewed versus not
          reviewed at all," and the attestation exclusion is a downstream consequence of that rather
          than a separate quirk.
          That makes the conflicting Exxat-authored guidance recorded on the attestation element
          considerably more serious than previously stated. The PA playbook recommends turning
          auto-approval ON "for ease of approval/review"; coa.yaml concludes that for CRNA
          auto-approval "should be treated as configuration malpractice." Both are advising on a
          toggle that, per this transcript, silently removes the preceptor from the workflow. A
          PA program following its own playbook's convenience advice produces patient logs that no
          clinician ever saw — which is defensible for a low-stakes activity log and is not
          defensible as B3.03 evidence.
      - element: "Grading Type field on the Patient Log (PA)"
        type: "select on the Grading section of the Patient Log setup drawer"
        data_shown: >
          Beyond the maximum score and weightage documented elsewhere in this file, the PA setup
          drawer carries a distinct GRADING TYPE field: "confirm whether this patient log will
          contribute to the course grade. If yes, enter the maximum score and the weightage it will
          cover. In the Grading Type field, specify the grading type you want to apply"
          (/Users/romitsoley/Downloads/PAVideosTranscripts.md line 33).
        gates_on: ["How a log's contribution is expressed in the Gradebook"]
        accreditation_citation: >
          None directly — a grading-mechanics field, not an evidence field. Recorded because
          rotation-lifecycle--07 documents the Grading Scheme module as "explicitly record-keeping
          only" that "does not calculate student grades" (per content/accreditation/caep.yaml), and
          this field is one of the inputs that framing has to be reconciled against.
        competitor_equivalent: >
          Not comparable at element level — no competitor teardown in this research documents
          grading configuration on an encounter log.
        gap_severity: "none"
        gap_note: >
          NEW 2026-08-25 from the PA transcript. Small, and included because this file previously
          described patient-log grading as "whether the log contributes to the student's final
          score, points value, and weightage" — a three-part model borrowed from the SLP Clinical
          Log. PA's drawer has a fourth part. No source read states what the Grading Type values
          are, so this is recorded as a confirmed field with unconfirmed contents, which is the
          honest position and is the thing to check before describing patient-log grading to a PA
