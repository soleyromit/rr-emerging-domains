  - screen: "Clinical Log Entry (SLP) — clock-hour capture"
    navigation_path: >
      Coursework > Require Placement tab > [course offering] > Course Activities > Clinical
      Log > + Clinical Log — or — Dashboard > My Placements > [placement] > Clinical Logs
      section > Add Clinical Log
    elements:
      - element: "Clinical Log as a distinct Learning Activity type (not the Patient Log renamed)"
        type: "module-level distinction"
        data_shown: "A separate activity type whose unit of record is TIME, not an encounter count."
        gates_on: ["Which report family exists for the course", "Whether diagnosis/procedure minimums are even applicable"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.1B — the 400 supervised clinical practice hours,
          of which at most 25 may be observation and at least 325 must be at graduate level.
          An encounter-count log cannot evidence an hours standard; this is why the module is
          separate rather than a relabelled Patient Log.
        competitor_equivalent: >
          Not comparable. Every competitor teardown in this research describes ONE logging
          object — Elentra's "Logbook for patient encounters/procedures" (elentra.yaml),
          one45's "procedure/patient-encounter logs" (one45.yaml), eMedley's eCLAS
          (emedley.yaml), Leo's Patient Encounter Tracking (leo-davinci.yaml), CORE ELMS's
          "case logging and reflections" (core-elms.yaml). None documents a second,
          time-denominated log type for an hours-based accreditor, so there is nothing to
          compare this architectural split against.
        gap_severity: "none"
        gap_note: >
          Confirmed as a genuine module split, not terminology: content/prism/capability-map.yaml
          states it outright ("Clinical Log is its own Learning Activity type, not the Patient
          Log renamed... which is why the whole SLP reporting family aggregates hours rather
          than case counts, and why the diagnosis/procedure-minimum model documented above for
          PA does not transfer to SLP"). This is the strongest existing precedent in the
          product for an hours-and-supervision-based accreditor, and capability-map.yaml
          names it as such — the closest shipped analogue for ACPE- or CODA-style hour
          thresholds in the expansion domains.
      - element: "Student Participation Type (Direct Contact vs. Observation)"
        type: "dropdown"
        data_shown: "Which of the two ASHA participation categories the logged minutes belong to."
        gates_on: ["Which side of the 25-hour observation ceiling the minutes land on", "Min/max threshold cell the entry is measured against"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.1B — the observation-vs-direct split is one of
          the three axes the 400 hours is divided along, and the only one with a hard ceiling
          (<=25 observation hours). caa-asha.yaml rates this Transfer specifically because the
          report family already filters on this exact axis.
        competitor_equivalent: >
          Not comparable — no competitor teardown names a participation-type dimension on an
          hours entry. New Innovations' "supervision-level tracking" on the Procedure Logger
          (competitors/new-innovations.yaml) is the nearest concept and is marketing copy with
          no published field list.
        gap_severity: "none"
        gap_note: >
          Ships as a first-class field and a first-class reporting axis. What does not ship is
          the ceiling: nothing documented stops a student logging a 26th observation hour, and
          the min/max threshold that would flag it is support-configured only.
      - element: "Practice Type (Intervention vs. Evaluation) with minutes split"
        type: "categorised time fields"
        data_shown: "Minutes attributed to intervention vs. evaluation on the same encounter."
        gates_on: ["Clinical Log Report's intervention/evaluation tables", "Types of Services by Age Group report split"]
        accreditation_citation: >
          CAA-ASHA Standard 3.1B, Sub-elements 3.1.1B - 3.1.6B — CAA asks for evaluation AND
          intervention across the lifespan for each of the nine communication and swallowing
          elements, which is why the log splits one encounter's minutes two ways rather than
          tagging the encounter once.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a within-encounter time split
          between two service types. This is a genuinely finer-grained capture model than
          anything in the competitor corpus.
        gap_severity: "none"
        gap_note: >
          Ships. The downstream consequence is the reason SLP has a report ("Clinical Log
          Report — Type of Services by Age Group") that splits into separate intervention and
          evaluation tables — a shape no other discipline's reports take.
      - element: "Mode of Delivery / Training Level (graduate vs. undergraduate)"
        type: "dropdowns"
        data_shown: "In-person vs. telepractice/other delivery mode; whether the hours were earned at graduate or undergraduate level."
        gates_on: ["The >=325-graduate-hours half of the 400-hour rule", "Mode-of-delivery axis on the threshold matrix"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.1B — Training Level is the field that makes the
          ">=325 at the graduate level" clause provable per student rather than assumed.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a training-level dimension on a
          clinical-hours record. ARC-PA's telehealth ceilings give the mode-of-delivery
          dimension a parallel in PA, where Prism's documented answer is a Timesheet CATEGORY
          rather than a log field (see arc-pa.yaml Standard B3, Element B3.01 a-e) — two
          different mechanisms for the same concept in two disciplines.
        gap_severity: "none"
        gap_note: >
          Both ship as fields and as report filters (the Clock Hours Report filter set names
          Mode of Delivery and Training Level explicitly). The composite assertion is still
          missing: no view says "this student has 412 total, 18 observation, 340 graduate —
          PASS."
      - element: "Clinical Educator selector (+ student-added educator drawer)"
        type: "dropdown with add-new drawer (first name, last name, email)"
        data_shown: "The supervising clinical educator for this encounter; students can add one if the program allows."
        gates_on: ["Whether a supervision trail exists for these minutes", "Whether the log can be routed for review"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.8B — "Record the supervising clinical educator on
          every clinical encounter, hold a reviewable supervision trail signed by that
          educator, [and] compute supervision intensity as a proportion of the student's
          client contact." The first two clauses are this element; the third is the gap noted
          below and at the supervisor-linkage step.
        competitor_equivalent: >
          Not comparable at this granularity — the closest is New Innovations'
          "supervision-level tracking" claim (competitors/new-innovations.yaml), a marketing
          line with no field list.
        gap_severity: "configure-needed"
        gap_note: >
          The student-added-educator drawer captures first name, last name, email only — the
          same four-field shape as the Patient Log's Add Experiential Supervisor drawer, and
          the same consequence: no role, credential, or supervision-level attribute travels
          with the record. For CFCC Standard V-E's 25% direct-supervision floor (cited via
          caa-asha.yaml's 3.8B analysis) the missing piece is not the identity of the educator
          but the PROPORTION of the student's contact they supervised, which nothing computes.
      - element: "Log Hours by Status rollup (In Progress / Pending Review / Needs Attention / Approved)"
        type: "read-only tally, student- and admin-visible"
        data_shown: "Both a log COUNT and an HOURS total per status, side by side."
        gates_on: []
        accreditation_citation: >
          CAA-ASHA Standard 4.0, Standard 4.7 (with 4.8) — the program must document each
          student's progress toward the credential AND make that documentation available to
          the student. The student-visible half of this tally is the 4.8 mechanism.
        competitor_equivalent: >
          Not comparable — competitor materials describe hour logging and summary reporting
          (competitors/e-value.yaml, core-elms.yaml) but none documents a status-segmented
          hours tally exposed identically to student, faculty, and admin.
        gap_severity: "none"
        gap_note: >
          Shipped comparatively recently and enumerated precisely in the SLP release note:
          clinical log hours are visible in "4 places for program administrators, 3 places for
          faculty, and 3 places for students." Only APPROVED hours are defensible as
          accreditation evidence, and this control is what makes the approved-vs-submitted gap
          visible mid-rotation rather than at the end.
    action: >
      SLP student records the minutes spent with a client, split by intervention/evaluation
      and direct-contact/observation, tagged with age group, mode of delivery, training level
      and the supervising clinical educator, then routes it to that educator for review.
