      - element: "Min/max hour thresholds per participation-type x mode-of-delivery (SLP)"
        type: "support-configured threshold matrix on the Clinical Log module"
        data_shown: "Per-cell minimum and maximum hours that red-flag an under-logged student directly inside the Clinical Log report."
        gates_on: ["Whether an SLP program gets any automated under-logging alert at all"]
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.1B — the 400 total / <=25 observation / >=325
