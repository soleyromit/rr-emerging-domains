  - screen: "CCE (Clinical Case Experience) Log Entry — CRNA / Nurse Anesthesia"
    navigation_path: >
      My Coursework > View All Coursework > Require Placement tab > [course] > Course
      Activities tab > Patient Log section > + — or — Student Dashboard > View Learning
      Activities > Patient Log > [course] > Log Status
    elements:
      - element: "Encounter Details block (Preceptor, Date of Service, Total Hours of Anesthesia Time, Total Clinical Log Hours, Total Cases, Procedure)"
        type: "input group"
        data_shown: "Six fields on one encounter, two of which are DURATIONS and one of which is a COUNT — so a single CRNA log entry simultaneously carries case-count, hour, and procedure evidence."
        gates_on: ["Every COA case-count threshold", "The 2,000-clinical-hour minimum", "The internal consistency rule that clinical hours >= anesthesia time"]
        accreditation_citation: >
          COA Standard E.2.3 + Appendix — per-student proof of a minimum 2,000 clinical hours
          AND each of roughly sixty numbered case-count minimums. COA Standard F.9 defines
          "clinical hours" broadly (anesthesia time plus in-house call, pre- and
          post-anesthetic assessment, patient and OR preparation, clinical rounds) and states
          that total clinical hours must be greater than or equal to total anesthesia time —
          which is precisely why both durations sit on this one block.
        competitor_equivalent: >
          New Innovations is the closest documented equivalent and is rated "ahead" of Prism
          on Clinical & Experiential Education for exactly this reason: "procedure logging with
          supervision-level tracking and import from the ACGME Resident Case Log System"
          (competitors/new-innovations.yaml). No competitor file documents a
          certification-body case-log IMPORT on the Prism side, which is the mechanic a CRNA
          program would most want for NBCRNA. Leo/DaVinci's Patient Encounter Tracking logs
          "diagnoses, procedures, observed conditions, and duty hours per student"
          (leo-davinci.yaml) — the only other competitor that puts duty hours and encounters
          on the same object.
        gap_severity: "configure-needed"
        gap_note: >
          Ships, and this is the strongest confirmed discipline fit in the file — coa.yaml
          rates Standard C.4 "Transfer" and calls it "the strongest Transfer in this file."
          The unresolved piece is the consistency rule: nothing documented validates that
          Total Clinical Log Hours >= Total Hours of Anesthesia Time for the same student, a
          check COA's own glossary makes explicit and which is trivially computable from these
          two adjacent fields.
      - element: "Eight repeatable COA-taxonomy sections (+Add per section)"
        type: "repeatable sub-forms"
        data_shown: >
          Patient Physical Status; Patient Assessment; Special Cases; Anatomical Categories;
          Methods of Anesthesia; Arterial Technique; Central Venous Catheter; Pulmonary Artery
          Catheter; plus Other Details. Each section's "+ Add" button supports multiple entries
          per encounter.
        gates_on: ["Whether one encounter can increment several COA thresholds at once"]
        accreditation_citation: >
          COA Standard E.2.3 + Appendix — these section names map one-to-one onto COA's own
          Appendix families (Patient Physical Status ASA III-VI >=200; Patient Assessment
          initial preanesthetic >=50 / postanesthetic >=50; Special Cases geriatric >=100,
          pediatric 2-12 >=30, pediatric <2 >=10, trauma/emergency >=30, obstetrical >=30;
          Anatomical Categories intra-abdominal >=75 through vascular >=10; Methods of
          Anesthesia general >=400, tracheal intubation >=250, emergence >=300; arterial
          puncture >=25, IV catheter >=100, ultrasound-guided >=20).
        competitor_equivalent: >
          Not comparable — no competitor teardown publishes a log schema at section level, so
          no competitor can be shown to carry (or to lack) an accreditor's own taxonomy as its
          native field structure. This is the single most accreditor-shaped log layout
          documented anywhere in this research, on either side.
        gap_severity: "configure-needed"
        gap_note: >
          The repeatable "+ Add" model is what makes COA's "Count all that apply" footnote
          mechanically possible — a case with an alternative-technique intubation should
          increment BOTH the tracheal-intubation and alternative-technique rows. What no
          source read confirms is that the THRESHOLD engine behind the report counts it twice
          rather than assigning the encounter to one category; coa.yaml flags exactly this as
          unresolved. Two further unresolved items from coa.yaml, neither visible on this
          drawer: no actual-vs-simulated flag on an entry (COA forbids satisfying certain rows
          by simulation alone), and no cohort-conditional thresholds for the dagger-marked
          rows that bind only students matriculating on/after Jan 1 2026.
      - element: "Preceptor field on the encounter"
        type: "dropdown"
        data_shown: "The supervising CRNA or anesthesiologist for this case."
        gates_on: ["Who receives the review/attestation email"]
        accreditation_citation: >
          COA Standard C.4 (crediting rules only the supervising clinician can affirm) and —
          by absence — COA Standard F.7, the CRITICAL hard 2:1 student-to-preceptor
          supervision cap.
        competitor_equivalent: >
          New Innovations markets "supervision-level tracking" on its Procedure Logger
          (competitors/new-innovations.yaml) but publishes no field list. No competitor file
          documents a concurrent-supervision-ratio computation either, so the gap below is not
          a competitive disadvantage so much as an unserved requirement across the category.
        gap_severity: "gap"
        gap_note: >
          coa.yaml is explicit that this field is the one CRNA capture point that COULD feed a
          real observed 2:1 ratio, but that Prism treats the preceptor here purely as a
          REVIEWER, never as a supervision-capacity dimension, and that no CRNA report
          aggregates by preceptor at all — the only CRNA report demonstrated in the transcript
          aggregates by student. F.7 asks how many students one PERSON supervised at one
          moment; a slot count answers how many students a SITE takes over a rotation. That
          computation does not exist, and this field is where its input already sits.
      - element: "Approved-status lock on the CCE log"
        type: "system-enforced state transition"
        data_shown: "Approved logs are verified and locked, become part of the permanent academic record, and cannot be edited or deleted."
        gates_on: ["Defensibility of the record as certification-eligibility evidence"]
        accreditation_citation: >
          COA Standard C.4 — the log is simultaneously the academic record, the accreditation
          evidence, and the NBCRNA certification-eligibility artifact, which is why COA's
          required behaviour is an immutable post-approval record.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents record immutability after
          approval. See the same element on the Patient Log step above.
        gap_severity: "none"
        gap_note: >
          Ships. The Nursing playbook flags this as "a notable trust/integrity mechanic worth
          flagging for other disciplines' log-based evaluation tools" — i.e. the mechanic is
          discipline-agnostic even though it was documented for CRNA.
      - element: "Program-Administrator final-quantification tier"
        type: "absent"
        data_shown: "Nothing — the documented review chain ends at preceptor/faculty approval."
        gates_on: []
        accreditation_citation: >
          COA Standard C.4 — COA's companion Guidelines for Counting Clinical Experiences
          "places final authority for quantifying experiences on the Program Administrator,
          who must affirm the accuracy of the record." Confirmed ABSENT.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a multi-tier affirmation chain
          above preceptor sign-off.
        gap_severity: "gap"
        gap_note: >
          coa.yaml identifies this as the second of three C.4 gaps: "the transcript's review
          chain ends at preceptor/faculty approval — no program-administrator affirmation tier
          is demonstrated." Nothing in the Nursing CCE admin guide or the CRNA transcript adds
          one. The third C.4 gap is likewise absent here: nothing enforces COA's rule that two
          learners should not be assigned to the same case except where acuity requires it.
    action: >
      CRNA student records one anesthesia case — anesthesia time, clinical hours, case count,
      procedure, and multiple entries across eight COA taxonomy families — and submits it to
      the named preceptor, who approves it into a locked permanent record.
    confirmed_by: >
      Exxat-Help-Guides/Help for Students/Discipline Specific Guides/Nursing/CCE Case Log for
