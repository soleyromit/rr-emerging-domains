        competitor_equivalent: >
          Not comparable — no competitor teardown documents a multi-tier affirmation chain.
        gap_severity: "gap"
        gap_note: >
          Repeated here deliberately because it is the one gap that sits at the intersection
          of both attestation objects: neither the two-tier student attestation model
          (profile/course) nor the supervisor-side log attestation provides a third,
          administrator-level sign-off on the aggregate. For CRNA that sign-off is the artefact
