  - screen: "Student Activity Insights & NBCRNA Transcript reports (CRNA / Nursing)"
    navigation_path: >
      Learning Activities > [course offering] > Action column > Reports > Student Activity
      Insights — or — NBCRNA Transcript report — student-side at Dashboard > View Learning
      Activity Reports > Student Activity Insights
    elements:
      - element: "Traffic-light cells against a per-category minimum and preferred benchmark"
        type: "colour-coded rollup grid with drill-down"
        data_shown: >
          Green = at or above the minimum (100%+ of requirement); amber/yellow = approaching,
          roughly 80-99%; red = below the minimum. The transcript's worked example: "if the
          minimum requirement is 200 and the student has entered only 21, the cell will appear
          red."
        gates_on: ["The program-configured minimum and preferred benchmark per category"]
        accreditation_citation: >
          COA Standard E.2.3 + Appendix (CRITICAL) — roughly sixty numbered case-count
          minimums plus the 2,000-hour floor, which coa.yaml rates "Configure" precisely
          because this report already renders progress "with exactly the traffic-light
          semantics this standard needs." Also COA Standard C.4 (regular faculty review, since
          this is the surface that makes irregularity visible) and CCNE Standard III, Key
          Element III-I for the Nursing (non-CRNA) read.
        competitor_equivalent: >
          Not comparable, and this is the clearest place in the file where Prism is ahead of
          everything documented: no competitor teardown describes progress-against-minimum
          rendering on clinical logs at all. eValue's nearest published behaviour is flagging
          "incomplete, or violation-triggering work hours" (competitors/e-value.yaml) — a
          binary violation on hours, not graded progress against a case-category quota. New
          Innovations imports ACGME case logs (new-innovations.yaml) but no source describes
          it scoring them against thresholds.
        gap_severity: "configure-needed"
        gap_note: >
          Shipped, discipline-specific, and available to BOTH admins and students — the
          student-facing CCE guide reproduces the same colour semantics for the student's own
          view, which makes this simultaneously the early-intervention tool and the
          self-monitoring tool. coa.yaml's three unresolved questions all live behind this
          grid rather than on it: cohort-conditional thresholds for COA's dagger-marked rows,
          actual-vs-simulated sub-counts, and whether one encounter can increment several
          thresholds at once under COA's "count all that apply" footnote. Note also that this
          is an on-demand report, not a push alert — CODA 2-9's "pacing alerts" and ARC-PA
          B4.01's "timely identification" both imply something that reaches out; this waits to
          be run.
      - element: "Filters (rotation, program, clinical settings, site/location, status, student)"
        type: "filter controls"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          COA Standard E.2.3 — filtering by clinical setting and site is how a program tests
          whether a threshold shortfall is a student problem or a site problem, which is the
          difference between remediating a student and re-planning a placement.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents filters on a progress-against-minimum
          report, because no competitor documents the report.
        gap_severity: "none"
        gap_note: "Ships as standard; enumerated identically in the CRNA transcript and both CCE help guides."
      - element: "NBCRNA Transcript Report"
        type: "certification-formatted export (Excel)"
        data_shown: "Case-log statistics per student across courses and rotations, organised by NBCRNA-required category, formatted for national certification eligibility documentation."
        gates_on: []
        accreditation_citation: >
          COA Standard C.4 and Standard E.2.3 — the Nursing playbook ties this report to
          "COA E.2, Standard C.4" directly. It is the artefact that connects programmatic
          accreditation evidence to individual certification eligibility, which is a coupling
          no other discipline in this file has.
        competitor_equivalent: >
          New Innovations is the only competitor with a documented certification-body
          integration on case logs — but in the opposite direction: it IMPORTS from the ACGME
          Resident Case Log System (competitors/new-innovations.yaml). Prism's documented
          motion is an EXPORT formatted for NBCRNA. Comparable in ambition, opposite in
          direction, and no competitor file documents an NBCRNA-shaped artefact at all.
        gap_severity: "none"
        gap_note: >
          Shipped and named in both the Nursing playbook and the Nursing CCE admin guide. This
          is the single strongest discipline-fit artefact documented in this stage: an
          auto-generated, certification-body-formatted transcript derived from the same logs
          that serve accreditation. It is worth flagging as the template for what an
          equivalent would look like in the expansion domains, where no comparable
          certification-body export is documented.
      - element: "Aggregation by preceptor"
        type: "absent"
        data_shown: "Nothing. The demonstrated CRNA reports aggregate by student; no report aggregates by supervising preceptor."
        gates_on: []
        accreditation_citation: >
          COA Standard F.7 (CRITICAL) — confirmed ABSENT, and the reason the 2:1 ratio cannot
          be observed from log data even though the preceptor is captured per case.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents preceptor-axis aggregation of case
          logs either.
        gap_severity: "gap"
        gap_note: >
          coa.yaml states it plainly: "No report in the transcript's reporting walkthrough
          aggregates by preceptor at all; the only CRNA report demonstrated aggregates by
          student." Contrast the OT side, where a Placements by Educator report exists and the
          SLP side, where Clinical Educator is a report FILTER — so the preceptor axis is
          reachable in two other disciplines and not in the one whose accreditor makes it
          CRITICAL.
    action: >
      Admin or student runs the colour-coded progress report to see which case/procedure
