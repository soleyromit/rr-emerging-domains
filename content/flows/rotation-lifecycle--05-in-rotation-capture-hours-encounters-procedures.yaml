fication), 265-270 (M1M email operations), 272-277 (PTMACS/PTAMACS additional mechanics), 279-281 (the Exxat One availability-based wishlist). In THIS file the load-bearing lines are 127-129 (the learning-activity inventory, which contains NO patient or encounter log — the basis for the encounter-log-unused finding), 69 and 176-180 (CEU credit derived from approved timesheet hours, and the state-variable conversion that leads many programs to list supervision hours instead of a CEU total), and 214-221 (the two CAPTE 6H reports sourced from PTSE 1 Questions 7 and 3 rather than from logged encounters)."
