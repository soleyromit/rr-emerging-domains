    elements:
      - element: "Experiential Supervisor dropdown (on the log itself)"
        type: "dropdown, scoped to placement"
        data_shown: "Ties one named supervisor to this specific logged encounter, not just to the placement as a whole."
        gates_on: []
        accreditation_citation: >
          LCME Standard 9, Element 9.3 — the "named supervisor tied to a named student and
          encounter" half of the standard. The identical structure carries CAA-ASHA Standard
          3.0B, Standard 3.8B for SLP and COA Standard C.4 for CRNA.
        competitor_equivalent: >
          New Innovations markets its Procedure Logger with "supervision-level tracking"
