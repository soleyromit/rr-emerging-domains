ws, standard evaluation forms and reports, accreditor standards, and pain points are ALL explicitly unpopulated, with a standing instruction not to treat field-standard TE terms or CAEP standard numbers as Exxat-specific until confirmed against a TE-specific source). EVERY TE claim in this file that is not about the LTI integration is therefore reasoned from ../accreditation/caep.yaml and carries that caveat inline. In THIS file the load-bearing lines are 19-26 and 47-57 (the LTI video assignment as TE's only documented in-rotation capture surface) and 71 (standard evaluation forms and reports explicitly unavailable, which is why no TE hour or encounter surface can be asserted in either direction)."
