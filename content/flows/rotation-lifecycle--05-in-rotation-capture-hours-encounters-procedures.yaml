        gap_note: >
          This resolves half of lcme.yaml's 9.3 hedge: the named-supervisor-to-named-encounter
          link is confirmed to exist as a per-log field, not just a per-placement one.
      - element: "Add Experiential Supervisor drawer"
        type: "form"
        data_shown: "First name, last name, email, phone."
        gates_on: []
        accreditation_citation: >
          LCME Standard 9, Element 9.3 — the "role/level" half. This element is where such an
          attribute would be captured, and it is not. Three existing disciplines make the same
          field set insufficient for a different reason each: CSWE Accreditation Standard 3.3,
          AS B3.3.6 / M3.3.6 needs to know whether this person is a degree-qualified Field
          Instructor or a Task Supervisor; ACOTE Standard C.1.13 needs licensure and >=1 year
          of practice experience; COA Standards F.5 and F.8 restrict supervision to
          institutionally credentialed CRNAs and anesthesiologists.
        competitor_equivalent: >
          Not comparable — New Innovations' "supervision-level tracking" claim
          (competitors/new-innovations.yaml) is marketing copy with no published field list,
          so it cannot be checked against this drawer's documented four fields.
        gap_severity: "gap"
        gap_note: >
          The documented field list is name, email, phone only — no role/level attribute is
          captured alongside the supervisor record in any source read, and the SLP Clinical
          Log's student-added-educator drawer is narrower still (first name, last name, email).
          The credential data those three standards need does exist in Prism, just not here:
          it lives on the Sites > Personnel record and is checked at the Placement Clearance
          gate (an earlier stage). So a student-added supervisor on a log is, by construction,
          an unvetted record — which is exactly what the "Added by School" tag below exists to
          make visible.
      - element: "'Added by School' tag"
        type: "read-only badge"
        data_shown: "Distinguishes admin-mapped supervisors (top of list, locked) from student-added ones (unmapped until an admin reviews them)."
        gates_on: []
        accreditation_citation: >
          LCME Standard 9, Element 9.3 — indirectly: provenance is what makes a
          student-selected supervisor name defensible as verified rather than self-reported.
          Same read for CSWE AS B3.3.6/M3.3.6 and ACOTE Standard C.1.13, where an unvetted
          student-entered supervisor cannot satisfy a prior-verification requirement.
        competitor_equivalent: >
          Not comparable — no competitor teardown in this research documents supervisor-record
          provenance at element level.
        gap_severity: "none"
        gap_note: >
          Ships as standard; admin-mapped records are locked and sort above unmapped
          student-added ones. Cross-discipline note: the PA FAQ confirms students can add
          their own preceptor from My Coursework rather than waiting on an admin, and the SW
          playbook documents an admin MAPPING step for student-entered supervisors on Field
          Application Forms — so provenance-then-mapping is an established pattern, but only
          the SW field-application flow documents mapping as a required admin action.
      - element: "Supervision proportion / direct-supervision percentage"
        type: "absent"
        data_shown: "Nothing. Hours aggregate by clinical educator and by student, but no ratio of supervised contact to total contact is computed."
        gates_on: []
        accreditation_citation: >
          CAA-ASHA Standard 3.0B, Standard 3.8B via CFCC Standard V-E's 25% direct-supervision
          floor — confirmed ABSENT as a computed figure.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents a supervision-proportion
          computation. Unserved across the category.
        gap_severity: "gap"
        gap_note: >
          caa-asha.yaml states the shape of the missing thing exactly: "Prism aggregates hours
          by clinical educator and by student, but no source confirms a computed 'direct
          supervision as a percent of this student's total contact with each client' figure,
          which is the form CFCC V-E actually takes. Scope that ratio as a derived metric on
          the Clinical Log data model — it is the difference between 'we recorded who
          supervised' and 'we can prove the supervision floor was met.'" Every input already
          exists on the Clinical Log: educator, participation type, and minutes.
      - element: "Concurrent per-preceptor supervision ratio (students supervised at one moment)"
        type: "absent"
        data_shown: "Nothing. Slot capacity is a number an admin types; the log's preceptor field is treated as a reviewer, not a capacity dimension."
        gates_on: []
        accreditation_citation: >
          COA Standard F.7 (CRITICAL) — the hard 2:1 student-to-preceptor cap, which "AT NO
          TIME" may be exceeded. Confirmed ABSENT. ACOTE Standard C.1.7 asks a softer version
          of the same question for OT and is answered by a declared Supervision Type on the
          slot (1:1, 1:2, 2:1, 2:2) plus a Placements by Educator report — declared, not
          observed.
        competitor_equivalent: >
          Not comparable — no competitor teardown documents concurrent-supervision-ratio
          computation. New Innovations' "supervision-level tracking" is the nearest phrase in
          the corpus and is unsubstantiated at field level (competitors/new-innovations.yaml).
        gap_severity: "gap"
        gap_note: >
          coa.yaml's analysis is unusually specific about why this cannot be solved with slot
          caps: "a slot cap constrains how many students a SITE takes over a rotation, whereas
          F.7 constrains how many students one PERSON supervises at one moment, and a site with
          ample slots can still breach F.7 on a short-staffed day." It scopes the fix as a new
          derived object — supervision assignment (preceptor x date x students) — plus a
          structured exception record capturing date, reason, contingency action and approver,
          because COA permits brief exceedance only with documented justification. The two
          nearest shipped precedents it names are the Placement Assist overlapping-rotation
          guard and the geolocated Faculty Timesheet. OT's declared Supervision Type is the
          closest existing UI for the concept and is the wrong shape for COA: it states an
          intended ratio at slot-offer time, not an observed one on a given day.
