        accreditation_citation: "None as an element, but the guard has an accreditation consequence: it means the taxonomy chosen on day one is close to permanent once placements exist, which is exactly when a program discovers its accreditor wants a different cut (e.g. COCA 6.9's inpatient distinction) — see gap_note."
