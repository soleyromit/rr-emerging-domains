# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 2
# ("Program details & settings setup").
#
# SCOPE NOTE — this is PRODUCT ONBOARDING, not clinical workflow. The four
# existing journeys (rotation-lifecycle, preceptor-site-onboarding,
# competency-verification, accreditation-self-study) all begin AFTER the
# tenant is configured. This stage is the day-one work a brand-new Program
# Administrator does inside Program Details before any student, site, course,
# or placement record exists: identity/branding, the academic calendar
# skeleton, mission/vision, the program-level accreditation record, grading
# schemes, the clinical-settings taxonomy, AI consent, the Notification Hub
# (email identity + template library), user roles, and the two program-wide
# read surfaces (Program 360, Program Calendar).
#
# PRIMARY SOURCE DISCIPLINE — every step below is confirmed first against the
# raw admin tutorial transcript at exxat_transcripts.md,
# "1/16 Administrator Navigation in Exxat Prism" (lines 35-65), which is the
# single tutorial that walks this entire stage end to end. Help-center articles
# are cited only as SECONDARY confirmation where they add field-level detail
# the transcript narrates but does not enumerate (e.g. the exact Program
# Information sub-sections, the named standard user roles, the SendGrid DNS
# records). Nothing below is sourced ONLY from a help-center paraphrase of the
# same video.
#
# SCHEMA v2: accreditation_citation / competitor_equivalent / gap_severity /
# gap_note are per-ELEMENT, not per-step.

flow_name: "Program Details & Settings Setup"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 2"
persona: >
  Program Administrator, brand new to the platform and holding the Super
  Program Administrator role (primary — this stage is almost entirely
  self-service inside Program Details, and the transcript addresses this
  persona directly: "Here we will learn how to manage basic information about
  your school in the Program Details section").
  Secondary roles that touch this stage: the Exxat CSR / Account Manager and
  Support team (gatekeepers for the Program Information academic calendar,
  new Type-of-program dropdown values, custom user roles, View-as-Student
  access, and university-domain email sending — see gap notes below);
  University IT / identity team (SSO enablement and the SendGrid CNAME/DMARC
  DNS records); Compliance & Accreditation Liaison (secondary consumer of the
  Accreditation record and Program 360). See ../personas/role-program-admin.yaml.

steps:

  # ---------------------------------------------------------------------
  - screen: "Program Details > Setup > School Profile (Program Name + Logo + Details card)"
    navigation_path: "Dashboard > Program section > Program Details  (or hamburger menu > Program Details) > Setup tab > School profile"
    action: >
      The new administrator establishes the program's identity in the tenant:
      uploads the school logo, sets/corrects the program name, and opens the
      Details drawer to record description, program type, degrees offered,
      additional information, and the program address. Per the transcript this
      is the literal first thing shown after navigation: "We will now walk you
      through profile details section. Here we will learn how to manage basic
      information about your school in the Program Details section. You can
      access the Program Details section from your dashboard or the upper
      left-hand hamburger menu."
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation in Exxat Prism"
      (line 35-37): "In the Setup section of the Program Details page, you can provide some general
      information about the school. Click on your school logo box to change your school's logo. Then
      click the Upload Image button to select an image to be used as your school's logo... To change
      the name of your program, click on the pencil icon next to your program name... Click on the
      pencil icon in the Details section to add a description of your program, assign a program type,
      add degrees offered, provide additional information, and provide an address for your school.
      After you have added these sections, click on the Save button."
      SECONDARY (field enumeration only): .../Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Program Details/Managing Program Details via Setup.md
    elements:
      - element: "School logo box + Upload Image button"
        type: "file upload"
        data_shown: "Current program/school logo; replaced via an Upload Image picker."
        gates_on:
          - "Transcript is explicit that this is not cosmetic: 'this logo will be visible to all members of your school who have access to EXAT Prism' AND 'this logo can be used when sending communications with sites and experiential supervisors. Therefore, make sure to choose an appropriate image.' It therefore gates the visual identity of every outbound site/preceptor email sent later in preceptor-site-onboarding stages 3-5."
        accreditation_citation: "None — this is a platform-branding element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. None of core-elms.yaml, axium.yaml, elentra.yaml, one45.yaml, medhub.yaml, e-value.yaml, emedley.yaml, leo-davinci.yaml, or new-innovations.yaml describes tenant logo upload or outbound-email branding as a documented feature — it is almost certainly present in all of them and simply below the granularity of public marketing/help material."
        gap_severity: "none"
        gap_note: ""
      - element: "Program name pencil icon (opens text drawer)"
        type: "input field (validated)"
        data_shown: "Program name string. Transcript states the validation rule verbatim: 'your program name should start with an alphabetical character, cannot include any white space or numbers, and it can include hyphens, underscores, and apostrophes.' Help center adds it is a mandatory field."
        gates_on:
          - "The no-whitespace/no-numerals rule means a real program name cannot be entered literally. 'Doctor of Osteopathic Medicine' or 'PharmD Class of 2030' are both invalid; the admin must enter something like 'Doctor-of-Osteopathic-Medicine'. Whatever token is stored here is the program identifier that then appears across the tenant."
        accreditation_citation: "None directly — but note that COCA, CODA, ACPE and LCME all publish and reference programs by their exact legal program name, so a slugified name here creates a cosmetic mismatch between the system of record and the accreditor's record. Not a standard violation."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file records a program-name validation rule."
        gap_severity: "cosmetic"
        gap_note: >
          Day-one friction that lands on 100% of new administrators in every
          discipline: the first field they touch rejects the natural value.
          The constraint is unexplained in-product (the tutorial narrates it,
          the field does not), so a new admin discovers it by failing.
      - element: "Details drawer > Type of program (dropdown)"
        type: "dropdown (vendor-controlled value list)"
        data_shown: "The discipline/program-type taxonomy value for this tenant."
        gates_on:
          - "Vendor-gated: the help center states 'select the type of program from the dropdown. If you need additional dropdown options, please contact prism-support@exxat.com.' A new administrator in a discipline Prism has not yet enumerated cannot self-serve a correct value."
        accreditation_citation: "None — a taxonomy element, not an evidence element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          This is the first hard vendor dependency of the whole onboarding, and
          it lands squarely on the four expansion domains. A DO, MD, PharmD or
          DDS/DMD program spinning up is the exact case where the existing
          dropdown values (built around PT/OTA/PA/Nursing/SLP/SW/TE) are most
          likely to be missing, and the remedy is a support ticket rather than
          a self-service add. Severity is 'gap' not 'configure-needed' because
          the admin cannot resolve it inside the product at all.
      - element: "Details drawer > Description / Degree offered / Additional program information (free text)"
        type: "input field set (free text)"
        data_shown: "Narrative program description, degree(s) conferred, and an open catch-all field."
        gates_on: []
        accreditation_citation: "None as a gating element. Worth noting only that these free-text fields are where a program would informally park degree/credential facts that COCA Standard 1 / CODA Standard 1 self-studies restate — but they are not structured, exportable evidence fields and should not be sold as such."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Details drawer > Address"
        type: "input field set (address)"
        data_shown: "Physical location of the program."
        gates_on: []
        accreditation_citation: "None as an evidence element, though COCA's Standard 10/11 reporting and CODA's Standard 1 both key off institutional location/teaching-site identity; this field is descriptive only and does not feed those."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Save button (Details drawer)"
        type: "button"
        data_shown: "Commits the drawer; no confirmation/versioning described."
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------
  - screen: "Program Details > Setup > School Profile > Information (Terms, Professional Years, Program Clinical Settings)"
    navigation_path: "Program Details > Setup > School profile > Information card > pencil icon per sub-section"
    action: >
      The administrator establishes the academic calendar skeleton — the term
      names and the professional-year labels the entire course catalog,
      course offerings and curriculum grid will hang off — plus the first pass
      at the program's clinical-settings list. In practice this is the single
      highest-consequence and least self-service screen in the stage.
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" narrates the
      Setup section and the clinical Settings sub-section at lines 46-48 ("We will now walk you through
      how to add clinical settings to your program. Settings are the settings in which students are
      placed for their placement experiences").
      SECONDARY, for the Terms/Professional-years enumeration and the CSR warning the video does not
      state: .../Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Program Details/Managing Program Details via Setup.md
      — "The Information section will have the following sections... 1. Terms: Winter, Spring, etc.
      2. Professional years: 1st year, 2nd year, etc. 3. Program clinical settings... Please note, any
      edits done on program calendar will impact entire course catalog, course offering and curriculum
      grid in the system. Kindly reach out to your CSR for any changes on this section."
    elements:
      - element: "Terms (pencil icon)"
        type: "input field set / value list"
        data_shown: "The program's term names (Winter, Spring, etc.)."
        gates_on:
          - "Every Course Offering, the Curriculum Grid, and the course catalog key off these values. The help center warns edits 'will impact entire course catalog, course offering and curriculum grid in the system' and directs the admin to their CSR."
        accreditation_citation: "None directly. Indirect only: CODA Standard 1, Element 1-2 and COCA Standard 11, Element 11.9 both require year-over-year reporting cycles, and the term structure defined here is what any later cohort/term rollup is sliced by — but this field is not itself accreditation evidence."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. one45.yaml documents 'multi-layered concurrent schedules' and three named rotation-allocation algorithms but says nothing about how the underlying term taxonomy is defined or who can edit it."
        gap_severity: "gap"
        gap_note: >
          Day-one blocker with a delayed blast radius. A new admin cannot
          safely set up terms without CSR involvement, yet nothing downstream
          (courses, curriculum grid, offerings) can be built until terms exist.
          This is the structural reason admin onboarding is not actually
          self-service today, and it is discipline-blind — it hits a PT program
          and a PharmD program identically.
      - element: "Professional years (pencil icon)"
        type: "input field set / value list"
        data_shown: "Professional-year labels (1st year, 2nd year, etc.)."
        gates_on:
          - "Same CSR-gated warning as Terms; drives cohort/year-level slicing across the curriculum grid and course offerings."
        accreditation_citation: "None directly — but this is where discipline-native year nomenclature (OMS-1..4 for DO, P1-P4 for pharmacy, D1-D4 for dentistry, MS1-MS4 for MD, DPT1-3 for PT) would be encoded, and per content/domains/do.yaml DO clinical training is explicitly framed as 'OMS-3 and OMS-4'. Getting this label set wrong makes every later report read in the wrong dialect to the accreditor."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Same CSR gate as Terms. The expansion-domain angle is that the four
          new domains all use strong, non-generic year nomenclature (OMS, P,
          D, MS) that the generic '1st year / 2nd year' default does not
          match, so every new-domain tenant needs this edited on day one —
          exactly the edit the help center says to route through a CSR.
      - element: "Program clinical settings (entry point from the Information card)"
        type: "value list (duplicate entry point)"
        data_shown: "Same settings list also reachable via Setup > Grading and clinical settings — see the dedicated step below."
        gates_on: []
        accreditation_citation: "See the Program clinical settings drawer step below, where the substantive accreditation ties live."
        competitor_equivalent: "See the dedicated step below."
        gap_severity: "cosmetic"
        gap_note: "The same list is exposed from two different Setup cards (Information, and Grading and clinical settings), which is a minor wayfinding inconsistency for a first-time admin following a tutorial."

  # ---------------------------------------------------------------------
  - screen: "Program Details > Setup > School Profile > Mission and Vision"
    navigation_path: "Program Details > Setup > School profile > Mission and Vision card > + icon (pencil icon once populated)"
    action: >
      The administrator records the program's mission and vision statements as
      free-text on the school profile.
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" (line 37-39):
      "Click on the plus icon in the Mission and Vision section to add a mission and vision statement
      to your school's profile. Provide your statements in the text area provided, then click on the
      Save button."
    elements:
      - element: "+ icon / pencil icon (Mission and Vision)"
        type: "button (add vs. edit state)"
        data_shown: "Plus when empty, pencil once populated."
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Mission and Vision free-text area"
        type: "input field (free text, unstructured)"
        data_shown: "Mission statement and vision statement as narrative text."
        gates_on: []
        accreditation_citation: >
          Genuinely relevant, and the most accreditation-load-bearing field on
          the School Profile. ACPE (per content/accreditation/acpe.yaml,
          Element on preceptor orientation) requires evidence 'that every
          preceptor completed orientation to the program's mission'; CODA
          Standard 1, Element 1-2 requires that planning and improvement be
          'tied to institutional goals'; ARC-PA B1.01 a-d (per the PA
          playbook) requires the curriculum be 'aligned with mission/goals/
          learning outcomes'. The mission text every one of those standards
          points at is stored here — as unstructured prose.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. Notably, no competitor file describes a program mission/vision record at all, so this is not a place Prism is behind — it is a place nobody's public documentation goes."
        gap_severity: "configure-needed"
        gap_note: >
          The field exists and is free-text, which is fine for storage but
          means the mission is not a linkable object: nothing in Curriculum
          Mapping, Competency Management, or preceptor orientation can
          reference or attest against this record. For ACPE's
          orientation-to-mission evidence and ARC-PA B1.01's mission-alignment
          evidence, the mission still has to be re-pasted into an orientation
          document or a curriculum narrative elsewhere. Not a missing feature
          so much as an unconnected one.

  # ---------------------------------------------------------------------
  - screen: "Program Details > Setup > School Profile > Accreditation (add/edit drawer)"
    navigation_path: "Program Details > Setup > School profile > Accreditation card > + icon (pencil to edit; vertical ellipsis next to Save > Delete to remove)"
    action: >
      The administrator creates one structured, repeatable accreditation
      instance per accrediting body the program answers to, capturing status,
      type, narrative details, and the next/most-recent accreditation dates.
      Multiple instances are supported — the transcript is explicit that
      "You can add more accreditation instances by clicking on the plus icon
      again," which is what a multiply-accredited program (e.g. a nursing
      program holding both CCNE and state board approval) needs.
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" (line 39):
      "To add accreditation information, click on the plus icon in the Accreditation section. You can
      then provide the name of the accrediting body, the accreditation status, type of accreditation,
      details about the accreditation, the next accreditation date, and the most recent accreditation
      date. Please note that you need to fill all the sections marked with a red asterisk before you
      can submit this accreditation instance. Click the Save button when you are finished. You can add
      more accreditation instances by clicking on the plus icon again. To make changes to a previously
      added accreditation instance, click on the pencil icon."
      SECONDARY (delete path only): .../Program Details/Managing Program Details via Setup.md —
      "Click on the vertical ellipsis next to the Save button and click Delete."
      PRECEDENT: content/journeys/competency-verification.yaml stage 8 and content/prism/capability-map.yaml
      ("Program-level accreditation record + Sites accreditation reports").
    elements:
      - element: "Name of accrediting body"
        type: "input field"
        data_shown: "The accrediting body this instance represents (COCA, ACPE, CODA, LCME, CAPTE, ACOTE, ARC-PA, CCNE/ACEN/COA, CAA-ASHA, CSWE, CAEP...)."
        gates_on:
          - "Required field (red asterisk) — the instance cannot be submitted without it."
        accreditation_citation: >
          Directly relevant. This is the field that names the standard-owner
          for everything downstream. Per content/accreditation/coca.yaml
          (Standard 11, Element 11.9 — 'COCA Annual and Mid-Cycle Reports')
          and content/accreditation/coda.yaml (Standard 1, Element 1-2 —
          'Institutional Effectiveness'), the accreditor's identity and cycle
          are the frame for all periodic reporting; content/journeys/competency-verification.yaml
          stage 8 already established this screen as the COCA 11.9 / CODA 1-2
          anchor and that precedent is adopted here rather than re-derived.
        competitor_equivalent: "elentra.yaml is the only competitor file that names specific accreditor standard sets (LCME/COCA/CACMS/ACPE/CODA/ARC-PA, with a >40% CACMS DCI coverage claim), but that is Elentra's standards-mapping library, not a program-level accreditation-status record — a different object. No competitor teardown in this research documents a program accreditation record with body/status/type/dates at this granularity."
        gap_severity: "none"
        gap_note: ""
      - element: "Accreditation status"
        type: "dropdown / input field"
        data_shown: "The program's current standing with this body (e.g. continuing accreditation, provisional, probation)."
        gates_on:
          - "Required field (red asterisk)."
        accreditation_citation: >
          Relevant. COCA Standard 11 elements are keyed to a COM's held
          accreditation status ('every COM holding accreditation status',
          coca.yaml 11.9), and CODA's Standard 1 self-study cycle likewise
          turns on current standing. This is where that standing is recorded.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Type of accreditation"
        type: "dropdown / input field"
        data_shown: "Category of the accreditation instance (e.g. programmatic vs. institutional)."
        gates_on: []
        accreditation_citation: >
          Relevant for the expansion domains specifically, where programmatic
          and institutional accreditation genuinely diverge — a COM answers to
          COCA programmatically and to a regional institutional accreditor
          separately, and a dental school answers to CODA (coda.yaml Standard
          1) alongside its university's institutional accreditation. This is
          the field that distinguishes them.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Accreditation details"
        type: "input field (free text)"
        data_shown: "Narrative notes on the accreditation instance."
        gates_on: []
        accreditation_citation: "None as a structured evidence field — it is a free-text note, and should not be positioned as self-study evidence."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Next accreditation date"
        type: "date field"
        data_shown: "The next scheduled accreditation action/site-visit date."
        gates_on:
          - "No documented downstream behavior — the transcript and help center describe capture and edit only. Nothing states that this date generates a Program Calendar event, a reminder, or a task."
        accreditation_citation: >
          Directly relevant and the sharpest gap in this step. COCA Standard
          11, Element 11.9 requires 'timely, complete submission of COCA's own
          required annual and mid-cycle reports,' and coca.yaml calls for
          'deadline and submission-status tracking' as the required software
          behavior. CODA 1-2 similarly requires 'broad-based, systematic, and
          continuous' planning rather than a pre-visit scramble. This date
          field is where that deadline lives — and it lives there inertly.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. Adjacent-but-different: new-innovations.yaml documents a Credentialling Module with 'expiration alerts' and 'automated notifications' for licenses/certifications, and emedley.yaml documents 'automated expiration notifications' — both prove the date-driven-alert pattern is table stakes in this market, but neither applies it to a program accreditation cycle."
        gap_severity: "gap"
        gap_note: >
          The Next accreditation date is stored but does nothing. Prism ships
          a Program Calendar (see the final step) that color-codes events by
          module and supports due-date events, and it ships auto-notification
          machinery elsewhere in the product (per the OT transcript's
          form-automation drawer) — but no source confirms this date feeds
          either one. Wiring it into the Program Calendar as a due-date event
          would be a small change that directly serves COCA 11.9's
          deadline-tracking requirement. Also note capability-map.yaml scopes
          full Accreditation Management as a Q3 2027 roadmap pillar, so this
          record is currently a stub, not a system of record.
      - element: "Most recent accreditation date"
        type: "date field"
        data_shown: "Date of the last accreditation action."
        gates_on: []
        accreditation_citation: "Relevant to COCA 11.9 and CODA 1-2 as the cycle-start anchor (evidence gathered 'since the last accreditation cycle' is the standard framing — see coca.yaml Element 10.2, which literally asks for counts 'since the last accreditation cycle'). Nothing in Prism is documented as computing a since-last-cycle window from this field."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "Same inert-date problem as Next accreditation date. A stored cycle-start with no downstream 'since last cycle' filtering on any report means the accreditation window has to be re-typed by hand into every report run during a self-study."
      - element: "Add-another-instance + icon"
        type: "button (repeatable record)"
        data_shown: "Adds a further independent accreditation instance."
        gates_on: []
        accreditation_citation: >
          Relevant to the multiply-accredited disciplines specifically. Per
          the Nursing playbook a nursing program may answer to ACEN, CCNE and
          COA simultaneously (ACEN 4.9 / CCNE II-C / COA A.10/F.1 are cited
          together for the same evidence), and per the SLP playbook an SLP
          program answers to CAA while its graduates certify through ASHA.
          Repeatable instances are the right shape for that.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------
  - screen: "Program Details > Setup > Grading and clinical settings > Grading Scheme"
    navigation_path: "Program Details > Setup > Grading Scheme > Add New > (Letter Grade | Pass/Fail Grade)"
    action: >
      The administrator defines the program's grading schemes — the cutoff
      tables that later get applied to course overall scores and to individual
      learning activities. The transcript is precise about the downstream
      reach: "These scales can be applied to courses for students' overall
      score in the course. Additionally, grading scales added here can be
      applied to specific learning activities. You can view the grade a
      student received on a learning activity from within the course grade book."
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" (lines 41-45):
      "Grading schemes are used for storing the cutoff values of students' grades... There are two
      different types of grading schemes you can add here, letter grade-based or pass-and-fail-based...
      To add a new grading scheme, click on the Add New button... enter the first letter grade you would
      like to assign and minimum percentage for this letter grade. For example... you would enter A and
      the minimum percentage should be 90. This means that if the student receives any score between 90
      and 100, they would receive an A... Keep doing this until every possible percentage is accounted
      for... When you are adding a pass or fail grading scheme, enter a title of the pass or fail grading
      scheme, then enter a passing score percentage. This percentage is set, so any score above this
      percentage will be considered passing."
    elements:
      - element: "Add New button > Letter Grade / Pass-Fail type selector"
        type: "button + type selector (irreversible per scheme)"
        data_shown: "Two and only two scheme archetypes."
        gates_on:
          - "The chosen type determines the entire editor that follows (a cutoff table vs. a single passing percentage)."
        accreditation_citation: "None directly — grading policy is a program decision, not an accreditor-specified field. Indirect only: LCME and COCA both expect a documented, consistently applied grading policy, but neither prescribes a data structure."
        competitor_equivalent: >
          The one place in this stage where a competitor teardown IS granular
          enough to compare. axium.yaml records axiUm's Evaluations Module as
          letting faculty 'record student assessments using customizable
          grading schemes' — but positioned inside a competency/clinical
          evaluation module, not as a program-level scheme library reusable
          across courses and learning activities. Directionally comparable,
          architecturally different: Prism defines the scheme once at program
          level and applies it in two places; axiUm's is described only at the
          evaluation. This matters because axiUm is the incumbent in the
          dentistry expansion domain.
        gap_severity: "none"
        gap_note: ""
      - element: "Grading scheme Title"
        type: "input field"
        data_shown: "Human name for the scheme."
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Letter grade + Minimum percentage row (repeating, with + icon and trash icon)"
        type: "input field set (repeating cutoff table)"
        data_shown: "One row per letter grade: the letter, and the minimum percentage at which it is earned. Rows are added one at a time via the + icon 'until every possible percentage is accounted for.'"
        gates_on:
          - "The transcript states the completeness expectation ('every possible percentage is accounted for') but describes no validation that enforces it — the admin is trusted to leave no gap or overlap."
        accreditation_citation: "None directly."
        competitor_equivalent: "axium.yaml's 'customizable grading schemes' is the closest documented equivalent, but axiUm's public material does not describe a per-letter minimum-percentage cutoff table, so the comparison cannot be made row-for-row."
        gap_severity: "cosmetic"
        gap_note: >
          Manual, row-at-a-time entry with no documented gap/overlap
          validation and no starter template. Every new program in every
          discipline hand-builds a standard A/B/C/D/F table on day one. A
          seeded default (and a completeness check) would remove a
          universal, error-prone chore. Low severity because the workaround
          is trivial; high frequency because it is 100% of tenants.
