        gates_on:
          - "This list is the vocabulary later used on slots, placements, sites and locations, and is the group-by/filter axis on downstream reports (per the PT/OT/SLP/Nursing playbooks, e.g. the Nursing Patient Log Aggregate Report groups by 'course, rotation, setting, location, site, or student')."
        accreditation_citation: >
          Genuinely relevant and discipline-specific. Per the PA playbook,
          SCPE settings are a mapped course-attribute category tied to
          ARC-PA B3.xx; per the PT playbook, Practice Settings map to CAPTE
          2024 6H / 2016 6L2 and pull from PTSE 1 Question 3; per the OT
          playbook the settings list is explicitly organized against 'AOTA
          Recommended Practice & Fieldwork Settings' for ACOTE. For the
          expansion domains the analogue is COCA Element 6.9 (which per
          coca.yaml requires core clerkships including 'more than one in an
          inpatient setting') — meaning the setting tag on a placement is
          literally the evidence that an inpatient requirement was met.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. No competitor file describes a program-owned, color-coded, program-editable setting taxonomy; the closest is one45.yaml's event-level tracking, which is about duty hours and leave, not setting classification."
