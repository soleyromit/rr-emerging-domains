  - screen: "University-domain email sending (SendGrid domain authentication) — off-platform setup"
    navigation_path: "Not a Prism screen. Support ticket / Account Manager request > Exxat DevOps > SendGrid domain whitelisting > university IT adds DNS records"
    action: >
      To make system email come from the university's own domain rather than
      exxat.com, the administrator raises a support ticket, nominates the from
      address, and the university IT team adds SendGrid CNAME records (and
      optionally a DMARC TXT record) to the university's DNS. Included in this
      stage because it is a day-one deliverability decision that must be
      started early — it is a multi-party, multi-week dependency, not a
      setting.
    confirmed_by: >
      .../Exxat-Help-Guides/Help for Program Administrators/Getting Started for Admin (includes User Guides)/Sending Emails using University-s Email Address.md
      — "Raise support ticket or request Account Manager's to initiate process... Exxat support team
      will work with Exxat Devops team to setup domain whitelisting into SendGrid account and send
      invitation email from SendGrid to whitelist CNAME records"; "Clinical sites won't need to
      whitelist the Exxat Domain (exxat.com) – they'll simply whitelist your university domain."
      NOTE ON SOURCING: not covered by the 1/16 tutorial transcript, which stops at in-product Email
      Setup. Cited from the help center by necessity and flagged as such.
    elements:
      - element: "Support ticket / Account Manager request to initiate domain configuration"
        type: "off-platform request (vendor-gated)"
        data_shown: "n/a — a ticket, not a screen."
        gates_on:
          - "Gates whether program email is deliverable at scale. Until it is done, every outbound email originates from exxat.com and each clinical site must whitelist the vendor's domain."
        accreditation_citation: "None, this is a platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file addresses outbound email deliverability or domain authentication at all."
        gap_severity: "gap"
        gap_note: >
          A pure vendor dependency on the critical path of onboarding, with no
          in-product status visibility: nothing in Program Details tells the
          admin whether domain authentication is pending, verified, or failed.
          For a new program whose entire first term depends on reaching
          clinical sites by email, this is the highest-risk invisible
          dependency in the stage.
      - element: "University IT DNS entries (3x CNAME for SendGrid automated security; optional DMARC TXT)"
        type: "external configuration (third-party DNS)"
        data_shown: "CNAME records aliasing the university domain to SendGrid (handling SPF/DKIM automatically), plus an optional 'v=DMARC1; p=none;' TXT record."
        gates_on:
          - "Requires a third party (university IT/identity team) the program administrator does not control and often cannot prioritize."
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Three-party coordination (program admin, Exxat support/DevOps,
          university IT) with no shared tracker. Note this sits alongside the
          other identity dependency the transcript describes at line 13 —
          SSO, where 'support will let you know when you are ready to access
          your account' — meaning both of the tenant's identity rails (login
          and outbound mail) are vendor-and-IT-gated and invisible in-product.

  # ---------------------------------------------------------------------
  - screen: "Program Details > User Roles (By Name / By Role)"
    navigation_path: "Program Details > User Roles > By Name (default) | By Role > Manage Roles / Manage Users > Assigned / Unassigned tabs"
    action: >
      The administrator provisions who else can do what: reviewing every user
      with access, inspecting exactly what a role grants, and assigning or
      unassigning roles individually (By Name) or in bulk against one role
      (By Role).
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" (lines 55-59):
      "In the User Roles section, you can manage the faculty and administrators who have access to your
      program. This section consists of two tabs: By Name and By Role... the table displays each person's
      name, username, email, number of associated roles, the modules they have access to, and the date
      and time of their last login. You will also see an action column. From here, you can click on
      Manage Roles to assign or remove access for the selected user. A search box is available to help
      you quickly find a specific user. Additionally, you can export this table into an Excel file using
      the export icon. The By Role tab provides a different view. In this table, you will see the role
      name, role type, total number of users, role description, and an action column to manage user
      roles. Please note, if you see a black eye icon, it indicates that the date and time when the staff
      member was assigned the role were not tracked. In such cases, the displayed date and time correspond
      to when your school joined EXAP Prism."
      SECONDARY (assign-before-unassign guidance, custom-role and View-as-Student gates, standard role
      catalog): .../Program Details/Managing User Roles and Access.md and
      .../Getting Started for Admin (includes User Guides)/Understanding User Roles in Exxat Prism.md.
    elements:
      - element: "By Name table (name, username, email, # roles, modules, last login)"
        type: "read-only rollup + row actions"
        data_shown: "One row per person with access, including last-login datetime and the modules that person can reach."
        gates_on: []
        accreditation_citation: "None as a standard citation. Adjacent: LCME and COCA both expect documented control over who can access student records; the last-login and modules columns are the closest thing to an access-review artifact in the product, though neither accreditor prescribes it."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. medhub.yaml documents MedHub's authentication posture (SAML/Shibboleth SSO, MFA, FERPA/SOC 2) but not an admin-facing user/role review table; core-elms.yaml notes only that 'generic SSO/LTI standards support is described' with no named integrations, explicitly calling integration depth 'hard to evaluate against Prism without a demo/RFP.' Prism's advantage here is real but unverifiable from competitor public docs."
        gap_severity: "none"
        gap_note: ""
      - element: "Eye icon > role permission detail drawer"
        type: "read-only permission viewer"
        data_shown: "What permission and access a given role covers, section by section across the Prism system."
        gates_on:
          - "Per the transcript, a BLACK eye icon carries a specific meaning: the role-assignment timestamp was never tracked, so the date shown is the date the school joined Prism rather than the date of assignment."
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          The black-eye-icon convention means the assignment audit trail is
          knowingly incomplete for legacy assignments and silently substitutes
          the tenant-creation date. Harmless for a brand-new tenant (where all
          assignments are new and tracked) but it means an admin cannot tell
          'assigned at go-live' from 'untracked' by reading the date alone.
      - element: "Manage Roles > Assigned / Unassigned tabs with per-role Assign / Unassign"
        type: "button set (permission mutation)"
        data_shown: "Two lists per user — roles held, roles available — each row with a single action."
        gates_on:
          - "Ordering matters and is not enforced: 'always assign the new role before removing the existing role... If you remove a user's existing role before assigning the replacement role, the user may temporarily lose access to the modules and features associated with that role.'"
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          The assign-before-unassign rule is documented guidance, not a
          product guard — the UI will happily let a new admin strip a role
          first and lock a colleague out mid-term. A swap action, or a warning
          on unassigning a user's last role, would make the guidance
          unnecessary.
      - element: "By Role table (role name, role type, total users, description) + Manage Users"
        type: "read-only rollup + bulk action"
        data_shown: "One row per role including whether the access is standard or custom, and a clickable Total Users count that opens a drawer of the assigned users."
        gates_on:
          - "The catalog itself is fixed: standard Program-Level roles (Super Program Administrator, Curriculum Administrator, Faculty Compliance Administrator, Site & Contract Coordinator (Limited), Compliance Administrator (Approve Only), Read-Only Program Administrator, Non-Compliance Admin, Site & Placement Program Administrator, PRISM LITE, Site Management Program Admin (Limited), Exxat One Access) and Tenant-Level roles (CCS Institution Administrator, User Management Admin (Read-Only), Compliance Management Admin, Institutional Placement Admin)."
        accreditation_citation: "None as a standard citation."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Custom role creation"
        type: "ABSENT in-product (vendor-gated)"
        data_shown: "Custom roles exist and are visible in the By Role table's role-type column, but cannot be created here."
        gates_on:
          - "Help center: 'You can create custom user roles tailored to your program's requirements. To request a new custom role, please contact Exxat Support.' The transcript corroborates that custom roles exist ('We support custom roles based on your program's needs. If you are assigned a custom role, you might have limited access to these sections') without offering a creation path."
        accreditation_citation: "None as a standard citation. Practically relevant to the expansion domains: a COM's clerkship structure or a dental school's clinic-supervision hierarchy may not map onto the eleven standard program-level roles, and the mismatch surfaces as a support ticket."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor teardown documents role-model extensibility either way, so this cannot be scored as behind or ahead."
        gap_severity: "gap"
        gap_note: >
          Second hard vendor dependency of the stage (after the Type of
          program dropdown). Role modelling is exactly the kind of thing a
          program discovers it needs mid-onboarding, and it is a ticket, not
          a setting.
      - element: "View as Student access"
        type: "ABSENT in-product (vendor-gated)"
        data_shown: "n/a — the help center states plainly: 'View as Student access cannot be assigned through the User Roles page. To enable View as Student access for a user, contact the Exxat Support Team.'"
        gates_on:
          - "Gates the admin's ability to see what students see, which is precisely what a new admin needs while configuring the student experience in later onboarding stages."
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Third vendor dependency, and the one with the worst timing: a
          brand-new administrator setting up cohorts, announcements,
          attestations and student resources has no self-service way to
          preview the result. Should be requested during onboarding kickoff,
          not discovered later.
      - element: "Export icon (Excel export of the By Name table)"
        type: "button (export)"
        data_shown: "The By Name access table as an Excel file."
        gates_on: []
        accreditation_citation: "None as a standard citation, though an exportable access roster is the artifact a university security review typically asks for during annual access recertification."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------
  - screen: "Program Details > Program 360"
    navigation_path: "Program Details > Program 360"
    action: >
      The administrator opens the program-wide live rollup. On day one this
      screen is almost entirely zeroes — which is exactly why it is useful
      during onboarding: it is the completeness checklist for the rest of
      product setup, showing which entities still have no records.
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" (lines 59-61):
      "Next, let's move to the Program 360 tab. This tab gives program administrators instant visibility
      into student activity, placements, curriculum data, and site operations... It includes high-level
      overviews of core entities, academics, sites and contracts, slots, placements, and learning
      activities, allowing you to track progress, identify trends, and make informed decisions efficiently."
      SECONDARY (metric enumeration): .../Program Details/Using Program 360.md. Corroborated in
      content/prism/capability-map.yaml ("Program 360 / Placement 360 dashboards").
    elements:
      - element: "Core Entities overview (Active Students, Faculty/Staff)"
        type: "read-only rollup (live counts)"
        data_shown: "Count of active students and of faculty/staff associated with the program."
        gates_on: []
        accreditation_citation: >
          Weakly relevant: CODA Standard 1, Element 1-2 requires
          'broad-based, systematic, and continuous' assessment rather than a
          pre-visit compilation, and a live rollup is the right architectural
          answer — but these two counts are not themselves 1-2 evidence.
          Cite the pattern, not the numbers.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. capability-map.yaml judges the drill-down dashboard pattern 'meaningfully different (more useful) than a report library,' but no competitor file documents a comparable program-wide live rollup to test that against."
        gap_severity: "none"
        gap_note: ""
      - element: "Academics overview (course-offering distribution, Total courses, Curricula, Accreditation standards, Requiring vs. Not requiring placement)"
        type: "read-only rollup"
        data_shown: "Curriculum-side counts including how many accreditation standards are mapped."
        gates_on: []
        accreditation_citation: >
          The 'Accreditation standards' tile is the one genuinely
          accreditation-tied element on this screen — it counts standards
          mapped to the curriculum, which is the coverage evidence COCA
          Element 6.4, ACPE 2.2.d, CODA 2-8 and LCME 9.4 all ultimately want.
          It is a count, not the evidence itself; the substantive analysis
          lives in competency-verification--01 and --04.
        competitor_equivalent: "elentra.yaml documents standard-set coverage claims (>40% CACMS DCI) as a marketing metric, which is the closest public analogue to a mapped-standards count — but Elentra's is a vendor claim about their library, not a live per-tenant tile, so the two are not comparable element-for-element."
        gap_severity: "none"
        gap_note: ""
      - element: "Sites & Contracts overview (Sites, Locations, Contracts, Site assessments, Location assessments, Personnel)"
        type: "read-only rollup"
        data_shown: "Partner-network counts including active agreements and collected site/location assessments."
        gates_on: []
        accreditation_citation: >
          Relevant to the sufficiency-of-clinical-resources family of
          standards — the Nursing playbook cites ACEN 4.9, CCNE II-C and COA
          A.10/F.1 together for exactly this evidence, and COCA Element 6.9
          (core clerkships, coca.yaml) depends on a documented site network.
          The counts here are a health indicator, not the submission-grade
          evidence, which lives in the Sites module reports.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Slots overview (Total / Past / Ongoing / Future) and Placements overview (Total / Past / Ongoing / Future, Wishlists, My Request, Placement Assist)"
        type: "read-only rollup (time-sliced)"
        data_shown: "Placement pipeline health across time, plus counts of student wishlists, requests, and Placement Assist activity."
        gates_on: []
        accreditation_citation: "None on day one — these are all zero for a new tenant. Downstream these counts feed the rotation-lifecycle journey rather than this stage."
        competitor_equivalent: "one45.yaml documents 'personalized learner dashboards' and multi-layered concurrent schedules, but a learner dashboard is a different object from a program-wide slot/placement rollup; not comparable element-for-element."
        gap_severity: "none"
        gap_note: ""
      - element: "Learning Activities overview (Forms/Evaluations, Patient Log, Timesheet, Time Off record counts)"
        type: "read-only rollup"
        data_shown: "Volume of submitted learning-activity records by type."
        gates_on: []
        accreditation_citation: "None on day one. Downstream, Patient Log and Timesheet counts are the raw material for e.g. the SLP 400-hour ASHA requirement (per the SLP playbook, the report suite is 'built almost entirely around clinical log / clock hour data') and for COCA 6.9 rotation counts — but as counts on a dashboard they are not evidence."
        competitor_equivalent: "leo-davinci.yaml documents encounter/duty-hour logging in detail and new-innovations.yaml documents duty-hour violation tracking, but neither describes a program-wide record-volume rollup; not comparable element-for-element."
        gap_severity: "none"
        gap_note: ""
      - element: "Program 360 as an onboarding-completeness surface"
        type: "ABSENT (opportunity, not a shipped element)"
        data_shown: "n/a — Program 360 shows counts, not setup state. Nothing on it says 'terms not configured,' 'no grading scheme defined,' 'clinical settings list empty,' or 'accreditation record missing.'"
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file documents a setup-progress or onboarding-checklist surface."
        gap_severity: "gap"
        gap_note: >
          The single clearest product opportunity in this stage. Prism already
          ships the exact screen where a day-one setup checklist belongs, and
          it already computes the counts that would drive it, but it presents
          them as steady-state metrics rather than as onboarding progress.
          There is no in-product answer to a new administrator's actual
          question — 'what have I not set up yet?' — anywhere in Program
          Details. Today that answer lives only in a 16-video tutorial series
          and a CSR's head.

  # ---------------------------------------------------------------------
  - screen: "Program Details > Calendar (Program Calendar)"
    navigation_path: "Dashboard > Program section > calendar icon  (or hamburger menu > Program Details > Calendar) > Add Event"
    action: >
      The administrator reviews the program-wide event surface and creates any
      program-level events or deadlines. Per the transcript this surface is
      program-scoped and role-scoped: "The program calendar is specific to your
      program and is available for program administrators only."
    confirmed_by: >
      exxat_transcripts.md — "1/16 Administrator Navigation" (lines 61-65):
      "We will now cover how to use the program calendar to view, track, and manage all key events and
      deadlines in one place... The month view provides a high-level overview of all events. The week
      view gives a more detailed breakdown of events. The day view allows you to focus on daily
      activities, and the agenda view which displays all the events in the list view. Events are color
      coded by module, making it easy to identify where they originate. For example, purple indicates
      attestations and blue indicates follow-ups. You can see all the different color codes in the event
      type dropdown. Clicking on an event opens a detailed view where you can see the event title and
      description, view relevant contextual details, and navigate directly to the associated record. To
      create a new event on the program calendar page, click the Add Event button in the top right
      corner. In the new event drawer, enter the event title and set the start and end dates. You can
      choose to mark the event as an all-day event, set it as a recurring event, select both options, or
      leave both unselected. You can also add a description for the event and click Save to create the event."
      SECONDARY (event-type taxonomy: single-day vs. due-date events; Go To navigation):
      .../Program Details/Using Program Calendar.md.
    elements:
      - element: "Month / Week / Day / Agenda view selector"
        type: "view toggle"
        data_shown: "Four presentations of the same event set. Note the transcript names four views including Agenda; the help-center article lists only three (Month/Week/Day) — the transcript is the more complete source and is preferred here."
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Event Type dropdown (module color legend)"
        type: "filter + legend"
        data_shown: "Events color-coded by originating module — purple for Attestations, blue for Follow-Ups, and the rest enumerated in the dropdown."
        gates_on:
          - "Which modules currently emit calendar events is defined by this list, and it is the practical answer to 'what feeds this calendar?' Notably, nothing in either source says the Accreditation record's Next accreditation date is among them."
        accreditation_citation: >
          Relevant by omission. COCA Standard 11, Element 11.9 requires
          'timely, complete submission' of annual and mid-cycle reports and
          coca.yaml names 'deadline and submission-status tracking' as the
          required software behavior; CODA 1-2 requires continuous rather
          than episodic planning. A program-wide calendar with due-date
          events is the natural home for those deadlines, and no source
          confirms accreditation dates appear on it.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Pairs with the Next-accreditation-date gap above: Prism ships both
          halves of accreditation deadline tracking (a structured date field
          and a due-date-aware program calendar) and no documented connection
          between them.
      - element: "Event detail view + Go To (navigate to associated record)"
        type: "drill-down navigation"
        data_shown: "Title, description, contextual detail, and a direct link to the originating record."
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Add Event drawer (title, start/end dates, all-day toggle, recurring toggle, description)"
        type: "input field set + toggles"
        data_shown: "Manually created program-level events; all-day and recurring are independent toggles ('select both options, or leave both unselected')."
        gates_on: []
        accreditation_citation: "None as a standard citation — manual events are unstructured and should not be positioned as accreditation deadline management."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "External calendar subscription / iCal feed"
        type: "ABSENT"
        data_shown: "n/a — neither the transcript nor the help-center article describes any export, iCal feed, or subscription from the Program Calendar."
        gates_on: []
        accreditation_citation: "None, platform-mechanics element."
        competitor_equivalent: >
          The clearest documented competitor advantage in this entire stage,
          and one of the few element-level comparisons the competitor files
          actually support. one45.yaml documents 'personalized learner
          dashboards synced to Google Calendar/Apple iCal/Outlook';
          leo-davinci.yaml documents 'a per-user central calendar [that]
          surfaces rotation/session details (location, materials, mandatory
          status, real-time iCal feed).' Two independent competitors publicly
          document live external calendar sync; no Prism source documents any.
        gap_severity: "gap"
        gap_note: >
          Caveat on scope before this is scored: one45's and Leo/DaVinci's
          synced calendars are LEARNER-facing schedule feeds, while Prism's
          Program Calendar is an admin-only program surface — related but not
          identical objects, and the honest comparison is 'they publish
          external sync for their calendar surface and Prism does not publish
          it for its own,' not a like-for-like feature loss. Still worth
          raising: an admin-only calendar with no feed means program deadlines
          live in a tool the admin must remember to open.

sources:
  - "exxat_transcripts.md — '1/16 Administrator Navigation in Exxat Prism' (https://vimeo.com/933464453), lines 35-65. PRIMARY SOURCE for this stage: Program Details/Setup, logo and program name, Details drawer, Mission and Vision, Accreditation instances, Grading Schemes (letter and pass/fail), clinical Settings, Standards tab pointer, Notification Hub (Email Setup + Email Templates), User Roles (By Name / By Role), Program 360, and Program Calendar are all narrated in this one transcript."
  - "exxat_transcripts.md — line 13 (SSO activation: 'For single sign-on accounts, support will let you know when you are ready to access your account') and line 17 ('We support custom roles based on your program's needs')."
  - "exxat_transcripts.md — '16/16 (Part 1) How to use Ask Leo' (line 1683) and '16/16 (Part 2) Using the Resource Center' (line 1701), for the distinction between Ask Leo (chatbot, covered in the 1/16 navigation transcript) and the newer AI Features Hub consent flow (not covered by any transcript)."
  - ".../Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Program Details/Managing Program Details via Setup.md — SECONDARY: Program Information sub-sections (Terms, Professional years, Program clinical settings) and the CSR warning that calendar edits impact the entire course catalog, course offerings and curriculum grid."
  - ".../Program Details/Managing Your Program Information.md — SECONDARY: Details-drawer field list and mandatory-field flags."
  - ".../Program Details/Using Notification Hub.md — SECONDARY: OTP forward-protection behavior, template type definitions (Locked/Regular/Restricted), template constraints (unique name per category, category immutable, 2-character search minimum), and the unrecoverable-delete caveat."
  - ".../Program Details/Managing User Roles and Access.md — SECONDARY: assign-before-unassign guidance, Manage Users bulk path, custom-role and View-as-Student support gates."
  - ".../Getting Started for Admin (includes User Guides)/Understanding User Roles in Exxat Prism.md — SECONDARY: the standard Program-Level and Tenant-Level role catalog."
  - ".../Getting Started for Admin (includes User Guides)/Sending Emails using University-s Email Address.md — SECONDARY: SendGrid domain authentication process, CNAME/DMARC records, support-ticket-initiated workflow."
  - ".../Program Details/Using Program 360.md — SECONDARY: full metric-group enumeration."
  - ".../Program Details/Using Program Calendar.md — SECONDARY: single-day vs. due-date event types, Go To navigation."
  - ".../Program Details/Add New Settings in Exxat Prism.md — SECONDARY: definition of clinical settings and the Grading-and-clinical-settings navigation path."
  - ".../Program Details/Agreeing to AI Usage Terms.md — AI Features Hub, consent ledger, per-feature toggles, role gating. Not covered by any transcript."
  - "content/accreditation/coca.yaml — Standard 11 Element 11.9 (annual/mid-cycle reports, deadline tracking), Element 10.2 ('since the last accreditation cycle'), Element 6.9 (core clerkships incl. inpatient setting), Element 5.4 (patient care supervision)."
  - "content/accreditation/coda.yaml — Standard 1 Element 1-2 (institutional effectiveness; continuous rather than pre-visit evidence)."
  - "content/accreditation/acpe.yaml — preceptor orientation to program mission; PHARMS submission-platform scoping note."
  - "content/accreditation/lcme.yaml — clinical supervision element (context for the OTP/data-handling posture)."
  - "content/journeys/competency-verification.yaml stage 8 — precedent for the COCA 11.9 / CODA 1-2 tie on the program accreditation record; adopted rather than re-derived."
  - "content/flows/competency-verification--01-define-the-competency-framework-and-map.yaml — authority for the Program Details > Standards tab elements and the Map with Leo AI-consent precondition."
  - "content/prism/capability-map.yaml — OTP protection detail, Program 360 metric groups, program-level accreditation record, Accreditation Management as a Q3 2027 roadmap pillar."
  - "content/competitors/axium.yaml — 'Evaluations Module: Record student assessments using customizable grading schemes' (the one directly comparable element in this stage; axiUm is the dentistry incumbent)."
  - "content/competitors/one45.yaml — learner dashboards 'synced to Google Calendar/Apple iCal/Outlook' (external calendar sync)."
  - "content/competitors/leo-davinci.yaml — 'per-user central calendar... real-time iCal feed'."
  - "content/competitors/medhub.yaml — SAML/Shibboleth SSO, MFA, FERPA/SOC 2 (vendor-level security posture vs. Prism's admin-configurable link security)."
  - "content/competitors/core-elms.yaml — 'only generic SSO/LTI standards support is described'; CompMS as a separately priced module."
