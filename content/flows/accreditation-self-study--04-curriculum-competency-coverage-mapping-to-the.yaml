# Element-level ground truth for journey stage:
# accreditation-self-study.yaml, stage 4 — "Curriculum & competency coverage
# mapping to the accreditor's outcome taxonomy"
#
# SCHEMA v2 (2026-08-24): analysis fields (accreditation_citation / competitor_equivalent /
# gap_severity / gap_note) live on each ELEMENT rather than on the step.
flow_name: "Curriculum & Competency Coverage Mapping"
maps_to_journey: "accreditation-self-study.yaml, stage 4"
persona: "Compliance / Accreditation Liaison (working with faculty/curriculum-committee mapping owners and the Program Administrator; see ../personas/role-compliance-accreditation-liaison.yaml)"
steps:
  - screen: "Standards (accreditor taxonomy setup)"
    navigation_path: "Program Details > Standards"
    elements:
      - element: "Standards tree (left panel)"
        type: "read-only list, per-domain pre-populated"
        data_shown: "All accreditation standards pre-populated for the program's domain (confirmed pre-loaded today for ARC-PA and ACOTE, per capability-map.yaml)"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.4; ACPE Standard 2, Key Element 2.2.d; CODA Standard 2, Element 2-8; LCME Standard 9, Element 9.4 — this tree is where the accreditor's taxonomy has to exist before any evidence against those four elements can be produced"
        competitor_equivalent: "Not confirmable at element level — none of the competitor teardowns (leo-davinci.yaml, core-elms.yaml, e-value.yaml, elentra.yaml) document a standards-activation/setup screen in enough detail to compare field-by-field."
        gap_severity: "configure-needed"
        gap_note: "This is the element the step-level gap actually attaches to. Capability map (content/prism/capability-map.yaml) confirms ARC-PA (PA) and ACOTE (OT) come pre-loaded out of the box; no source in this research confirms COCA/ACPE/CODA/LCME are pre-loaded the same way for the four new domains. Very likely a content-load exercise, but not directly observed for these four accreditors."
      - element: "Activate control"
        type: "toggle/checkmark button"
        data_shown: "Activates a standard for mapping; a checkmark marks it active"
        gates_on: ["Whether the standard appears as a mappable target in the course/measure mapping screen"]
        accreditation_citation: "COCA Element 6.4; ACPE Key Element 2.2.d; CODA Element 2-8; LCME Element 9.4 — gates whether each of those taxonomy elements is mappable at all"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a standards-activation control."
        gap_severity: "none"
        gap_note: "Mechanism is shipped and proven in production; it is agnostic to which accreditor's taxonomy sits in the tree above it."
      - element: "Add <<Standard Name>> drawer"
        type: "input drawer (Standard code, Standard description, Annotations)"
        data_shown: "Lets an admin add a custom sub-standard or standard category under any pre-populated standard"
        gates_on: []
        accreditation_citation: "COCA Element 6.4 (7 osteopathic core competencies incl. OPP/OMM); ACPE Key Element 2.2.d (2.1.a-m elements); CODA Element 2-8 (Standard 2-24 clinical categories); LCME Element 9.4 (program objectives) — this drawer is the documented mechanism for entering those taxonomies where they are not pre-loaded"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a custom-standard entry drawer with comparable field detail (code / description / annotations)."
        gap_severity: "none"
        gap_note: "Explicitly the escape hatch that makes the step-1 pre-load gap a configuration exercise rather than a missing capability: the 'Add or Editing Standards' mechanism is already proven in production for PA/OT."
      - element: "Reorder handle (6-dot grid)"
        type: "drag control"
        data_shown: "Re-orders standards within the tree"
        gates_on: []
        accreditation_citation: "None — presentation ordering only; no standard's evidence lives on this control."
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents standards-tree ordering controls."
        gap_severity: "none"
        gap_note: ""
      - element: "Delete (vertical ellipsis > Delete)"
        type: "button, destructive"
        data_shown: "Deletes a standard; deactivating a mapped standard also deletes every mapping tied to it (no separate confirmation of what's lost)"
        gates_on: []
        accreditation_citation: "COCA Element 6.4; ACPE Key Element 2.2.d; CODA Element 2-8; LCME Element 9.4 — destructive against the mapping evidence produced for all four"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents delete/cascade behaviour on a standards tree."
        gap_severity: "cosmetic"
        gap_note: "Sharpened from this element's own documented behaviour, not from new research: the cascade delete of every mapping tied to a standard is documented as happening without a separate confirmation of what is lost. A safeguard/confirmation gap on a destructive control, not a capability gap."

    action: "Admin activates the pre-loaded accreditor taxonomy, or — where COCA/ACPE/CODA/LCME are not yet pre-populated the way ARC-PA/ACOTE are — adds the taxonomy elements (e.g. COCA's 7 osteopathic core competencies including OPP/OMM, ACPE's 2.1.a-m elements, CODA's Standard 2-24 clinical categories, LCME's program objectives) as standards/sub-standards via this same drawer, before any course-level mapping can begin."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping/Managing Accreditation Standards for Curriculum Mapping.md"

  - screen: "Course/Measure mapping grid"
    navigation_path: "Curriculum Mapping > [Course] > Go to Mapping > Course Objectives / Course Measures"
    elements:
      - element: "Objective/measure list"
        type: "read-only list with status color"
        data_shown: "Each course measure (Learning Outcome, Course Objective, Instructional Objective, Lecture Objective, etc.) shown red if unmapped, green if mapped, with mapping count in parentheses"
        gates_on: []
        accreditation_citation: "COCA Element 6.4; ACPE Key Element 2.2.d; CODA Elements 2-5/2-8; LCME Element 9.4 — the per-measure mapped/unmapped state is the raw evidence each element asks for"
        competitor_equivalent: "Leo (DaVinci) markets mapping 'every session in every course' plus cross-course themes (leo-davinci.yaml), but its public materials don't document the mapping-grid UI at field level — the feature-level claim is comparable, this list is not comparable element-for-element."
        gap_severity: "none"
        gap_note: "Mature, shipped, proven in production for two disciplines."
      - element: "'+' icon per activated standard category"
        type: "button, opens multi-select drawer"
        data_shown: "Lets the mapper multi-select standard sections (with '>' caret to expand parent standards into sub-sections) to attach to the selected measure"
        gates_on: []
        accreditation_citation: "COCA Element 6.4; ACPE Key Element 2.2.d; CODA Elements 2-5/2-8; LCME Element 9.4 — this control is the literal act of creating the mapping evidence"
        competitor_equivalent: "Leo (DaVinci) claims equivalent session-to-standard mapping at feature level (leo-davinci.yaml); no public material documents their attach control, so no like-for-like element comparison is possible."
        gap_severity: "none"
        gap_note: "The mapping mechanism itself is confirmed mature; the gap for the four new domains is loading the right taxonomy (step 1), not this control."
      - element: "Add/Edit details drawer"
        type: "input drawer"
        data_shown: "Per-mapping Tags (free-form colored labels, e.g. 'Needs Review'/'Reviewed') and Mapping Attributes (discipline-specific taxonomy — Bloom's Taxonomy, PANCE Topics, ACOTE Instructional Methods, SCPE settings, Lifespan/population tags are the confirmed examples from PA/OT; COCA/ACPE/CODA/LCME-specific attribute sets would be configured the same way)"
        gates_on: []
        accreditation_citation: "CODA Element 2-5 and LCME Element 9.4 in particular rely on the attribute taxonomy (instructional method / setting / population) carried here, beyond the bare standard-to-measure link"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents per-mapping tag or attribute fields at this granularity."
        gap_severity: "configure-needed"
        gap_note: "Sharpened from this element's own documented content: the attribute sets confirmed in production are PA/OT-specific (PANCE Topics, ACOTE Instructional Methods). COCA/ACPE/CODA/LCME-specific attribute sets are configured through the same mechanism but are not confirmed to exist yet — same configure-not-build story as step 1."
      - element: "Map with Leo button"
        type: "AI-assist button"
        data_shown: "Leo reads the selected objective plus curriculum structure and existing mappings, suggests standards with a summary, shows an 'Already Mapped' label where a manual mapping exists, and takes thumbs-up/down feedback per suggestion"
        gates_on: ["Requires per-program AI-consent opt-in at Program Details > Setup > AI Features Hub before the option appears", "Nothing is auto-applied — an explicit 'Apply Mapping' click is required"]
        accreditation_citation: "None directly — an accelerator for producing COCA 6.4 / ACPE 2.2.d / CODA 2-5,2-8 / LCME 9.4 evidence; the evidence itself is the applied mapping, not the suggestion."
        competitor_equivalent: "Leo (DaVinci) is a distinct product from Prism's Leo assistant; its public materials describe mapping breadth, not an AI suggestion-and-apply loop, so no element-level comparison is supportable here."
        gap_severity: "configure-needed"
        gap_note: "Shipped, but gated behind a per-program AI-consent opt-in that must be turned on at Program Details > Setup > AI Features Hub before the control appears — a documented configuration prerequisite its sibling controls do not carry."
      - element: "Map Entire Course option"
        type: "alternate mapping mode"
        data_shown: "Maps a standard to the whole course rather than a single measure, for a coarser-grained view"
        gates_on: []
        accreditation_citation: "COCA Element 6.4; ACPE Key Element 2.2.d; CODA Element 2-8; LCME Element 9.4 — course-level coverage evidence where measure-level granularity is not required"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a course-level vs. measure-level mapping mode."
        gap_severity: "none"
        gap_note: "Mature, shipped."

    action: "Faculty member or curriculum-committee mapper attaches each course objective/measure to one or more activated standards (manually or by reviewing and applying Leo's suggestions), tagging mappings for a lightweight review queue where needed."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping/Adding- Editing & Deleting Mappings Course For Curriculum Mapping.md; /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping/Curriculum Mapping with Leo.md; /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md (Curriculum Mapping section, lines ~52-76)"

  - screen: "Mapping Summary Dashboard / Mapped Standards Report"
    navigation_path: "Curriculum Mapping > Mapping Reports"
    elements:
      - element: "Mapped Standards tile"
        type: "read-only rollup with progress bar"
        data_shown: "Total standards activated for the selected curriculum/cohort vs. total mapped, and a % mapped bar per standard (hover reveals exact percentage)"
        gates_on: []
        accreditation_citation: "Direct coverage-completeness evidence for COCA Element 6.4, ACPE Key Element 2.2.d, CODA Element 2-8, LCME Element 9.4"
        competitor_equivalent: "Leo (DaVinci)'s 'Insights Dashboard' markets real-time mapping-completion status with green checkmarks (leo-davinci.yaml). This tile does the same underlying job (total/mapped/% mapped), so Leo's 'no dashboard' attack line does not hold against Prism. Unconfirmed either way: refresh cadence (Leo claims 'real-time'; no Prism source states live vs. periodic) and visual treatment (% progress bar, not checkmark iconography) — functionally comparable, not confirmed UI-equivalent."
        gap_severity: "cosmetic"
        gap_note: "The capability is confirmed shipped (this resolves the journey's prior 'no confirmed dashboard' hedge). The open item is presentation/refresh-cadence parity with Leo's marketed real-time UI — cosmetic, not functional."
      - element: "Mapped Courses tile"
        type: "read-only rollup"
        data_shown: "Courses mapped / total courses, per standard"
        gates_on: []
        accreditation_citation: "COCA Element 6.4, ACPE Key Element 2.2.d, CODA Element 2-8, LCME Element 9.4 — course-level breadth of coverage per standard"
        competitor_equivalent: "Covered by the same Leo (DaVinci) Insights Dashboard completion-status claim, at feature level only; their public materials do not break the dashboard down to individual tiles, so no element-level comparison is supportable."
        gap_severity: "cosmetic"
        gap_note: "Same refresh-cadence/presentation open item as the Mapped Standards tile; capability itself confirmed shipped."
      - element: "Unmapped Standards filter"
        type: "report filter toggle"
        data_shown: "Switches the detailed Mapped Standards Report between 'All Standards' and 'Unmapped Standards' — i.e., which activated standards have zero mappings"
        gates_on: []
        accreditation_citation: "COCA Element 6.4, ACPE Key Element 2.2.d, CODA Element 2-8, LCME Element 9.4 — this filter is what surfaces the zero-coverage taxonomy elements a self-study has to account for"
        competitor_equivalent: "Directly answers Leo (DaVinci)'s marketed 'gap flags' (leo-davinci.yaml). Comparable in function; their materials do not document the filter/control itself, so parity is claimable at feature level only."
        gap_severity: "none"
        gap_note: "Confirmed shipped and is the specific control that closes the 'can't find uncovered standards' concern."
      - element: "Directly Mapped / Indirectly Mapped classification"
        type: "read-only label"
        data_shown: "Distinguishes a mapping created explicitly on the item from one inherited via parent-child standard hierarchy (replaces an older 'Semi-Mapped' label)"
        gates_on: []
        accreditation_citation: "COCA Element 6.4, ACPE Key Element 2.2.d, CODA Element 2-8, LCME Element 9.4 — matters to reviewers who distinguish explicit coverage from inherited coverage"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a direct-vs-inherited mapping distinction."
        gap_severity: "none"
        gap_note: ""
      - element: "Course/Measure Attributes Usage tiles"
        type: "clickable chart"
        data_shown: "Drills into a course-by-attribute grid with checkmarks showing where each attribute (e.g. a discipline-specific competency tag) has been assigned"
        gates_on: []
        accreditation_citation: "CODA Element 2-5 and LCME Element 9.4 — reports on the attribute taxonomy (method/setting/population) rather than the bare standard link"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents attribute-usage reporting."
        gap_severity: "none"
        gap_note: "Reports whatever attributes were configured in step 2; if the discipline-specific attribute sets are not loaded, the limitation is upstream at the mapping drawer, not here."
      - element: "Export control"
        type: "button, drawer"
        data_shown: "Exports the selected standard, or all standards plus parent/child standards, as Word or Excel"
        gates_on: []
        accreditation_citation: "COCA Element 6.4, ACPE Key Element 2.2.d, CODA Element 2-8, LCME Element 9.4 — produces the artifact that physically goes into the self-study evidence file"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents export formats for a mapping-coverage report."
        gap_severity: "none"
        gap_note: "Word/Excel export on this report is confirmed. The PA playbook's note that the Heatmap Report cannot be downloaded and must be screenshotted is a limitation on an adjacent report, not on this control."

    action: "Accreditation liaison opens the Mapping Summary Dashboard, filters to Unmapped Standards to find which COCA/ACPE/CODA/LCME taxonomy elements still have zero course/measure coverage, and exports the report for the self-study evidence file."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping Reports/Mapping Summary Reports for Curriculum Mapping.md; /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping Reports/Mapped Standards Report for Curriculum Mapping.md"

  - screen: "Competency Management — Setup (Add New Framework)"
    navigation_path: "Curriculum Management > Competency Management > Setup > Add New"
    elements:
      - element: "Select Competency dropdown"
        type: "input"
        data_shown: "Names the competency/taxonomy element the framework tracks; only one framework configurable at a time, though multiple frameworks per competency are allowed"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d (achievement against 2.1.a-n), LCME Element 9.4 (assessment against program objectives), CODA Element 2-5 (evaluation methods must measure defined competencies) — this is where the accreditor's taxonomy element is named"
        competitor_equivalent: "Not confirmable at element level — CORE's CompMS is described only as 'curriculum gap assessment' plus 'auto-built assessment e-portfolios' (core-elms.yaml), with no setup-screen detail."
        gap_severity: "configure-needed"
        gap_note: "This is the element the step-level gap attaches to: the PA playbook confirms the pattern of naming a framework after the exact standard (e.g. 'ARC-PA B3.03/B3.04 outcomes'), but no source confirms a pre-built COCA/ACPE/CODA/LCME framework — a program creates it fresh here."
      - element: "Course Type selector"
        type: "radio/select"
        data_shown: "Experiential (placement course), Didactic (non-placement course), or Both"
        gates_on: ["Didactic tracking requires grading schemes enabled on the course offering before it appears as eligible"]
        accreditation_citation: "ACPE Key Element 7.3.d and LCME Element 9.4 — both expect attainment evidence spanning didactic and experiential work"
        competitor_equivalent: "Not confirmable at element level — core-elms.yaml gives no CompMS setup-screen detail to compare against."
        gap_severity: "configure-needed"
        gap_note: "Shipped, but the Didactic path carries a documented upstream prerequisite (grading schemes enabled on the course offering) that must be satisfied before the option is usable."
      - element: "Assessment / Course Offering picker"
        type: "multi-select"
        data_shown: "Only eligible items are shown — assessments must carry a scoring scale and be active; didactic course offerings must be configured as non-placement with grading schemes enabled"
        gates_on: []
        accreditation_citation: "CODA Element 2-5 (evaluation methods must measure the defined competencies) and ACPE Key Element 7.3.d — this picker is where the evidence sources are bound to the competency"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents how assessments are bound to a competency framework."
        gap_severity: "configure-needed"
        gap_note: "The eligibility rules documented on this picker (scoring scale present, assessment active, non-placement + grading schemes for didactic) are configuration prerequisites that must be met upstream before a framework can be completed."
      - element: "Scoring Scale config"
        type: "input"
        data_shown: "Default 1-5 standardized scale, or a custom scale"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d, LCME Element 9.4 — the scale underpins any individual/aggregate attainment claim"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents scoring-scale configuration."
        gap_severity: "none"
        gap_note: "Ships with a usable 1-5 default plus custom-scale support; no accreditor-specific configuration is implied by any source."
      - element: "Competency Threshold config"
        type: "numeric input"
        data_shown: "Expected performance level; scores below it are highlighted red downstream"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d — the threshold is the 'expected level of achievement' the element turns on; LCME Element 9.4"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a competency threshold setting."
        gap_severity: "configure-needed"
        gap_note: "Mechanism confirmed shipped, but the threshold value is program-defined per framework; no accreditor-specific default is confirmed for the four new domains. Note that this threshold drives red-flag highlighting only — enforcement is absent downstream (see the Review dashboard's Publish/Unpublish control)."
      - element: "Start Mapping / I'll Map It Later"
        type: "button choice"
        data_shown: "Routes straight into the assessment-mapping workflow or defers it"
        gates_on: []
        accreditation_citation: "None — workflow routing only."
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents setup-wizard routing."
        gap_severity: "none"
        gap_note: ""

    action: "Program admin builds a competency framework that represents the accreditor's taxonomy element (e.g. one of COCA's 7 core competencies, an ACPE 2.1.a-m element, a CODA Standard 2-24 clinical category, or an LCME program objective — confirmed pattern from the PA playbook, which shows programs creating a framework named after the exact standard, e.g. 'ARC-PA B3.03/B3.04 outcomes'), selects which assessments or course grades feed it, and sets scale/threshold."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Competency Management/Competency Framework Configuration and Management.md; /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md (Competency Framework & Competency Tracking Report section, lines ~305-313)"

  - screen: "Competency Management — Review Dashboard"
    navigation_path: "Competency Management > Review > [Framework] > [Cohort]"
    elements:
      - element: "Course Type dropdown"
        type: "toggle"
        data_shown: "Switches the whole dashboard between Didactic and Experiential competency review (defaults to Experiential when both exist)"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d, LCME Element 9.4 — scopes the attainment view to didactic vs. experiential evidence"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown (leo-davinci.yaml, core-elms.yaml, e-value.yaml) documents a competency review dashboard at screen-level detail."
        gap_severity: "none"
        gap_note: ""
      - element: "Domain Scores chart"
        type: "read-only bar chart"
        data_shown: "Average competency score per domain for the selected cohort"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d (aggregate attainment), LCME Element 9.4"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a competency review dashboard at comparable granularity."
        gap_severity: "none"
        gap_note: "Satisfies the reporting half of ACPE 7.3.d; the unbuilt half is enforcement, which lives on the Publish/Unpublish control below."
      - element: "Student Proficiency Distribution chart"
        type: "read-only chart"
        data_shown: "Meeting Threshold (all domains at/above threshold) vs. Below Threshold (at least one domain below) counts"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d — aggregate-level achievement against expected performance"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents an equivalent distribution view."
        gap_severity: "none"
        gap_note: "Identifies who is below threshold; note it identifies only — no action is available from this chart."
      - element: "Students Meeting Threshold by Domain chart"
        type: "read-only chart"
        data_shown: "Per-competency counts of students above/below threshold"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d, LCME Element 9.4"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents an equivalent per-domain threshold view."
        gap_severity: "none"
        gap_note: ""
      - element: "Score Distribution box plot"
        type: "read-only chart"
        data_shown: "Min/max/average/median score per domain; box plot renders red when the domain's median falls below its configured threshold"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d, LCME Element 9.4 — aggregate distribution evidence"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents an equivalent distribution plot."
        gap_severity: "none"
        gap_note: ""
      - element: "Students in Cohort grid"
        type: "read-only grid with drilldown"
        data_shown: "Student names with 'View Report' link into an individual student's competency performance dashboard"
        gates_on: []
        accreditation_citation: "ACPE Key Element 7.3.d — the individual-level half of 'individual and aggregate' attainment; LCME Element 9.4"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents an individual-student competency drilldown."
        gap_severity: "none"
        gap_note: "Read-and-drill only; no per-student action or hold is available from this grid."
      - element: "Publish/Unpublish control"
        type: "dropdown"
        data_shown: "Controls whether students can see the framework's scores in My Competency Tracker; explicitly documented as visibility-only and fully reversible, and never touches the underlying calculation"
        gates_on: ["Framework must be Published for the student-facing tracker to appear at all"]
        accreditation_citation: "ACPE Key Element 7.3.d — specifically the readiness-GATE portion of that element (block APPE entry until Pre-APPE thresholds are verified)"
        competitor_equivalent: "Not confirmable at element level — no competitor teardown documents a competency publish/enforcement control, so this gap is not confirmed to be Prism-specific."
        gap_severity: "gap"
        gap_note: "This is the element the step-level 'gap' verdict actually attaches to, and it is a confirmed gap rather than an inferred one: this control is explicitly documented as visibility/reporting-only and as 'never touching the underlying calculation'. There is no enforcement or blocking action anywhere in the Competency Management module's documented workflow, so ACPE 7.3.d's readiness gate is unbuilt. Every sibling element on this screen reports attainment correctly; only this one is asked to enforce it and does not."

    action: "Liaison or program admin reviews cohort-level attainment ahead of a site visit, drills into a red-flagged domain or a specific student's report, and controls when scores become visible to students."
    confirmed_by: "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Competency Management/Competency Framework Configuration and Management.md (Review Competency and Publish Competency Score sections)"

  - screen: "My Competency Tracker (student-facing)"
    navigation_path: "Student Dashboard > My Competency Tracker"
    elements:
      - element: "Competency drop-down"
        type: "input"
        data_shown: "Selects which published competency to review"
        gates_on: ["Only competencies the admin has configured AND published are selectable"]
        accreditation_citation: "Supporting evidence for COCA 6.4 / ACPE 7.3.d / CODA 2-5 / LCME 9.4 as a student self-assessment/transparency artifact, not itself a standard-cited requirement"
        competitor_equivalent: "Not confirmable — no competitor teardown in this research documents a student-facing competency self-tracking screen at comparable granularity."
        gap_severity: "none"
        gap_note: ""
      - element: "Score Overview Per Competency"
        type: "read-only chart"
        data_shown: "Student's own score trend for the selected competency"
        gates_on: []
        accreditation_citation: "Supporting evidence for COCA 6.4 / ACPE 7.3.d / CODA 2-5 / LCME 9.4 as a student self-assessment/transparency artifact, not itself a standard-cited requirement"
        competitor_equivalent: "Not confirmable — no competitor teardown in this research documents a student-facing competency self-tracking screen at comparable granularity."
