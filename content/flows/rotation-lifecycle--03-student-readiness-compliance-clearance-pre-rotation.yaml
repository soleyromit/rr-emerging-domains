        data_shown: "Missing | Exists | NA, per preceptor, for the assigned specialty"
        gates_on: ["Whether the preceptor side of the placement is credential-clear"]
        accreditation_citation: >
          EXISTING-DISCIPLINE EXTENSION (2026-08-25) — this column was
          previously uncited; three existing disciplines cite it directly.
          (1) ARC-PA Standard A2, Element A2.14 (content/accreditation/arc-pa.yaml,
          element_id "Standard A2, Element A2.14" — "Preceptor Licensure —
          Valid, Unrestricted, and Unencumbered"), rated "Transfer" and
          described there as "one of the cleanest fits in the whole file," with
          this exact three-state Missing/Exists/NA tracker named as the
          mechanism. (2) CSWE Accreditation Standard 3.3, AS B3.3.6 / M3.3.6
          (content/accreditation/cswe.yaml) — Field Instructor degree plus two
