          but that teardown does not document its screens at element level, so
          no element-for-element comparison is possible from the material
          reviewed. Stated here rather than guessed.
        gap_severity: "configure-needed"
        gap_note: >
          Shipped. The preceptor half of the multi-entity gate; the underlying
          data is entered on the Personnel record (step 9).

          EXISTING-DISCIPLINE CLAUSE (PA, added 2026-08-25) — severity raised
          from none to configure-needed on the strength of this: the tri-state
          proves a credential record EXISTS, not that it CLEARS. ARC-PA 6th
          edition added "unrestricted, and unencumbered" to A2.14, and
          content/accreditation/arc-pa.yaml states the consequence precisely:
          "The three-state tracker proves a license record EXISTS; it does not
          encode 'unrestricted and unencumbered,' which is a status attribute
          (board action, probation, restriction) with no field today. For the
          expansion domains this is the reusable lesson: 6e-style wording
          changes turn a document-presence check into a document-STATUS check,
          and Prism's compliance taxonomy is presence-oriented."

          EXISTING-DISCIPLINE CLAUSE (Social Work, added 2026-08-25) — the same
          presence-vs-substance gap in a different shape, and already logged
          elsewhere in this repo. Per content/accreditation/cswe.yaml on AS
