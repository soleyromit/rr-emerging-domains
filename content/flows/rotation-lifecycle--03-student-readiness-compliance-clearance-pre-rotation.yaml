  # =======================================================================
  # NEW STEP (EXISTING-DISCIPLINE EXTENSION, 2026-08-25). Added because the
  # gate mechanic here is STRUCTURALLY different from the upload drawer above,
  # not a variation on it: the student does not produce a document at all.
  # They initiate an off-platform transaction with a third-party vendor, wait
  # on that vendor's own processing chain, and the requirement is satisfied by
  # a status sync rather than by an artifact. Documented for Social Work
  # (the one discipline with named integrations) and relevant to PT/PTA,
  # OT/OTA and — pending confirmation — Teacher Education.
  # =======================================================================
  - screen: "Vendor-backed compliance requirement — student ordering and status sync"
    navigation_path: >
      Student Dashboard > Compliance > [background check / drug screening /
      HIPAA Training requirement] > vendor launch — OR — Student Compliance >
      Setup tab > [cohort] > External Trainings (admin side, configured in
      admin-onboarding stage 4, not re-modeled here)
    elements:
      - element: "Vendor order/launch control (Universal Background Screening — fingerprint background checks and drug screening; Cisive — separate onboarding flow)"
        type: "button"
        data_shown: "Entry point into the vendor's own flow; the requirement's Prism status is driven by what comes back, not by a student upload"
        gates_on: ["Requirement Upload Status and Compliance Status on the Placement Clearance Dashboard (step 7)"]
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5
          (content/accreditation/cswe.yaml, element_id "Accreditation Standard
          3.3, AS 3.3.5"), whose required_software_behavior is "a pre-placement
          readiness gate covering background checks, drug screening, and
          required trainings (the operational form 'safety protocols' takes in
          practice)"; rated "Transfer," with cswe.yaml naming CISIVE and
          Universal Background Screening explicitly. Also CAPTE Standard 5,
          Element 5B (content/accreditation/capte.yaml) for PT/PTA, which
          enumerates "potential drug testing and criminal background check
          requirements" among the clinical-education requirements a program must
          disclose to students — capte.yaml's own rationale notes Prism "is
          already the system of record for several enumerated items... through
          Compliance Management's Universal Background Screening and Cisive
          integrations."
        competitor_equivalent: >
          Item-type parity, mechanism gap, in Prism's favour. CORE ELMS
          (content/competitors/core-elms.yaml, rated at-parity) publicly claims
          to "monitor compliance data such as immunizations, background checks,
          drug checks, and licensing requirements" — tracking, not ordering. No
          competitor file in content/competitors/ describes initiating a vendor
          transaction from inside the platform. The real competitive set is
          undocumented in this repo: the PT Playbook names myClinicalExchange
          (mCE), Clinician Nexus, ACEMAPP and CastleBranch Bridges as "direct
          competitors of Exxat/Exxat One" that "require student account
          registration and payments for... onboarding" and "will not integrate
          with us" — i.e. four products whose entire business is this element,
          none of which has a teardown in content/competitors/. Flagged as a
          research gap rather than compared against.
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed as a shipped, named integration pair in
          content/prism/capability-map.yaml ("Third-party background check &
          drug screening integrations") and in the SW playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
          Work (SW) Playbook.md line 151 — CISIVE and Universal named explicitly
          for SW). Configure-needed rather than
          shipped because the vendor relationship is a commercial prerequisite
          the program must hold, not a toggle — and per
          content/accreditation/cswe.yaml, "whether the CISIVE/Universal/
          ComplianceJunction integrations extend beyond SW and the health
          professions to the four expansion domains is unconfirmed anywhere in
          this corpus and is a live commercial question."
      - element: "Order-dependency enforcement between background check and drug screening"
        type: "read-only rollup"
        data_shown: "Drug screening can only be requested once the background check reaches 'In Process,' and vice versa for an additional background check"
        gates_on: ["The sequence and therefore the total elapsed time before a student can be clear"]
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5
          (content/accreditation/cswe.yaml) — the sequencing is part of what
          makes the readiness gate a real lead-time problem rather than a
          checklist, which is the operational form AS 3.3.5's "safety protocols"
          take.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes ordering constraints between compliance items."
        gap_severity: "none"
        gap_note: >
          Shipped and confirmed in content/prism/capability-map.yaml. Worth
          surfacing to Social Work programs specifically because the SW
          playbook's own best-practice section makes the same point from the
          other end: "Complete profiles and Field Application Forms early — SW
          programs commonly begin placement/profile review months ahead of field
          education start, and background checks/drug screenings/HIPAA training
          all carry provider processing lead time." A serialized dependency on
          top of vendor lead time is exactly why the documented 6-8-week
          Clearance Dashboard monitoring window (step 7) can already be too late
          for a student who has not started.
      - element: "Cisive status taxonomy including 'Complete – Under MRO Review'"
        type: "read-only rollup"
        data_shown: "Vendor-side intermediate states, including a Medical Review Officer review stage on a drug screen"
        gates_on: ["Whether the requirement reads as satisfied on the step 7 rollup while a real-world review is still open"]
        accreditation_citation: ""
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes vendor-specific intermediate statuses."
        gap_severity: "cosmetic"
        gap_note: >
          Confirmed in content/prism/capability-map.yaml. Named here because it
          is the one place in this stage where a status word can mislead: a
          state literally beginning "Complete" that still has an open DOT-style
          Medical Review Officer chain behind it. An admin scanning the step 7
          dashboard for anything short of clear will read "Complete" and move
          on. No source confirms how this maps into the three-state Requirement
          Upload Status column, which is the specific thing to verify.
      - element: "ComplianceJunction HIPAA training account (one-time setup tied to the student's university email, which cannot be changed; training auto-saves and resumes; completion syncs back as Approved with a downloadable certificate in both systems)"
        type: "input field"
        data_shown: "Vendor course launch and completion state, plus the certificate"
        gates_on: ["Compliance Status column on the Placement Clearance Dashboard (step 7)"]
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5
          (content/accreditation/cswe.yaml), which names ComplianceJunction
          HIPAA training as part of the readiness gate. Note also CAA Standard
          3.1B, sub-elements 3.1.1B-3.1.6B (content/accreditation/caa-asha.yaml)
          folds "accountability incl. HIPAA/FERPA compliance" into SLP's
          professional practice competencies — so for SLP the HIPAA obligation
          sits in the COMPETENCY framework rather than in a pre-rotation
          document item, a genuinely different placement of the same
          requirement.
        competitor_equivalent: >
          eMedley (content/competitors/emedley.yaml) lists "HIPAA training" as a
          tracked document type and CORE ELMS
          (content/competitors/core-elms.yaml) lists "HIPAA training" in its
          compliance monitoring list — but both describe tracking a completion
          record, not an embedded, launchable vendor course with sync-back. Not
          documented at integration granularity by any competitor teardown in
          this research.
        gap_severity: "cosmetic"
        gap_note: >
          The immutable university-email binding is the operational trap, and it
          is documented in the SW playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
          Work (SW) Playbook.md line 152): the ComplianceJunction account
          is "a one-time account setup tied to the student's university email
          (cannot be changed)." A student who sets it up under a personal
          address, or a program that changes its email domain, has no documented
          remediation path. Small, but it lands on an individual student at the
          worst possible moment.
      - element: "School Pay vs. Student Pay configuration"
        type: "toggle"
        data_shown: "Which party funds the vendor transaction, set per institution"
        gates_on: ["Whether the student can start the transaction at all without a personal payment"]
        accreditation_citation: >
          CAPTE Standard 5, Element 5B (content/accreditation/capte.yaml) — 5B
          requires disclosure of clinical-education requirements including "access
          to and responsibility for the cost of emergency services during
          off-campus experiences," i.e. cost-responsibility disclosure is
          explicitly part of what a PT/PTA program must tell students. Who pays
          for a required background check is the same class of disclosure, though
          5B does not name it verbatim — stated as adjacent rather than direct.
        competitor_equivalent: >
          Directly comparable and NOT in Prism's favour as a differentiator: the
          PT Playbook records that mCE, Clinician Nexus, ACEMAPP and CastleBranch
          Bridges are built on student registration AND PAYMENTS, so
          student-funded compliance is the competing model's default. None of
          those four has a teardown file in content/competitors/, so this is a
          named finding from a discipline playbook rather than a competitor
          teardown comparison.
        gap_severity: "none"
        gap_note: >
          Confirmed in the SW playbook's Compliance section ("Payment can be
          School Pay or Student Pay depending on institution configuration").
          Included because it is the one element in this stage with a direct
          student-cost consequence, and because the choice determines whether
          the readiness gate is blocked on institutional procurement or on an
          individual student's card.
    action: >
      Student initiates a vendor-mediated compliance requirement (background
      check, drug screening, or HIPAA training), completes it in the vendor's
