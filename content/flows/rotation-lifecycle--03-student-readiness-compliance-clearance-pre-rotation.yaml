          means the program needs the superseded card retained, not overwritten,
          to evidence continuous currency across a renewal. The Reset behavior
          is the mechanism that produces that trail.
        competitor_equivalent: >
          CORE ELMS ("automated expiration reminders"), eMedley ("automated
          expiration notifications") and New Innovations ("expiration alerts")
          all publicly claim expiry alerting — content/competitors/core-elms.yaml,
          emedley.yaml, new-innovations.yaml — but none of their public sources
          describes what happens to the SUPERSEDED document on renewal.
