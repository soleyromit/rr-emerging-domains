        gates_on: ["Overall pre-rotation clearance for the student"]
        accreditation_citation: >
          COCA Standard 6, Element 6.10 (per-student completion checklist
          satisfiable before fourth-year clerkships begin) — this composite
          rollup is the literal completion-checklist view described there
          (content/accreditation/coca.yaml, element 6.10, rated Configure).
        competitor_equivalent: >
          eMedley's Student Documents module (content/competitors/emedley.yaml)
          is the closest public match on the student-document side, but its
          public pages describe no composite per-student clearance rollup that
          gates placement start; New Innovations' Credentialling Module is
          named in competitor teardowns as a plausible match but that teardown
          does not document its screens at element level, so a direct
          comparison is not possible from the material reviewed.
        gap_severity: "none"
        gap_note: >
          Shipped, and the single strongest-evidenced element in the stage:
          the composite rollup is what turns per-requirement statuses into an
          actual pre-rotation clearance verdict.

          EXISTING-DISCIPLINE CLAUSE (PT/PTA, added 2026-08-25) — the most
          important limitation of this column, and it is CAPTE's finding, not
          ours. CAPTE Standard 4, Element 4O (content/accreditation/capte.yaml,
          element_id "Standard 4, Element 4O" — "Students Professional,
          Competent, Safe, and Ready to Progress to Clinical Education")
          defines PT/PTA readiness as a COMPETENCY-AND-SAFETY gate, not a
          document gate: the required behavior is "a pre-clinical competency
          gate: a defined skill set with per-skill pass/fail results, a severity
          flag distinguishing critical-safety skills from ordinary ones, a hard
          block preventing progression to placement until the gate clears." Per
          capte.yaml's gap_notes: "Placement Clearance's gate evaluates
          compliance documents, contracts, and preceptor credentials —
          competency-framework results are not one of its inputs, so 'ready to
          progress' is currently a human judgment outside the block." So for
          PT/PTA an All Docs Approved on this column is NOT the readiness
          verdict 4O asks for. The nearest shipped analog lives on a different
          screen entirely — the Student Proficiency Distribution chart in step
          10 — and nothing joins the two. This is the clearest example in the
          whole stage of a discipline whose readiness gate is structurally
          different from the document-clearance model, and it belongs to an
          EXISTING customer base, not an expansion domain.

          EXISTING-DISCIPLINE CLAUSE (Teacher Education, added 2026-08-25):
          CAEP Standard R3, Component R3.2 (content/accreditation/caep.yaml)
