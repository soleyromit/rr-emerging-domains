        gates_on: ["Compliance Status column on the Placement Clearance Dashboard (step 7) — an exempted item counts as satisfied"]
        accreditation_citation: >
          COA Standard C.5 (Student Standards), with Standard D.12
          (content/accreditation/coa.yaml, element_id "Standard C.5 (Student
          Standards), with Standard D.12"). This is the element's own named
          hazard, quoted from coa.yaml's gap_notes: "Compliance Management
          supports Approved with Declination / Exception / Medical Exemption /
          Religious Exemption sub-statuses, which are appropriate for
          immunization mandates but would silently satisfy a hard
          clinical-competency precondition like ACLS if applied here. Confirm
          exemption sub-statuses can be disabled per item type before
          configuring ACLS/PALS."
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research. CORE ELMS, eMedley and New Innovations all describe binary
          submitted/missing or approved/expired states; none of their public
          sources describes an exemption taxonomy at all, which makes this a
          genuine Prism differentiator on the immunization side and a genuine
          risk surface on the certification side.
        gap_severity: "gap"
        gap_note: >
          The single highest-consequence discipline-specific finding in this
          stage, and it is CRNA's. The exemption codes are correct and valuable
          for the immunization mandates that dominate PT/OT/PA/SLP/Nursing/SW
          compliance — a religious or medical exemption from a flu shot is a
          legitimate satisfied state. Applied to a COA C.5 ACLS or PALS
          certification they are not: C.5 is a clinical-safety precondition with
          no exemption path, and an "Approved with Exception" on ACLS would show
          the student as fully clear on the step 7 rollup while they hold no
          valid card. Nothing in the reviewed sources confirms the taxonomy can
          be disabled per item type, and
          content/prism/capability-map.yaml ("Compliance document status &
          exemption taxonomy") describes it as a status property of an approval
          generally, not a per-requirement configuration. Verify before a CRNA
          program configures ACLS/PALS. Contrast Teacher Education, where a
          state fingerprint clearance is likewise non-exemptible per
          content/accreditation/caep.yaml's licensure_or_gme_layer entry — the
          same hazard, different regulator.
