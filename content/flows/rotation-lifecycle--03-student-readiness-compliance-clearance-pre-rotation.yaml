# Element-level ground truth underneath rotation-lifecycle.yaml, stage 3
# ("3. Student readiness & compliance clearance (pre-rotation gate)").
# Every accreditation_citation and competitor_equivalent claim below traces to
# a real source file in confirmed_by — see per-step citations, not the
# journey's own narrative.
#
# SCHEMA v2 (2026-08-24): analysis fields (accreditation_citation /
# competitor_equivalent / gap_severity / gap_note) now live on each ELEMENT
# rather than on the step. Where the underlying research did not distinguish
# between sibling elements, the same verdict is stated identically on each
# rather than inventing false precision.
#
# SCOPE EXTENSION (2026-08-25): this file was originally built covering only
# the four EXPANSION domains (DO, Pharmacy, Dentistry, Medicine) via COCA,
# ACPE, CODA and LCME. It now also covers the eight disciplines Exxat/Prism
# ALREADY serves — PT/PTA, OT/OTA, PA, SLP, Nursing, Social Work, Teacher
# Education, and CRNA — against CAPTE, ACOTE, ARC-PA, CAA-ASHA, CCNE/ACEN,
# CSWE, CAEP and COA respectively. Added material is marked either with an
# "EXISTING-DISCIPLINE EXTENSION" comment above a new element/step or with an
# "EXISTING-DISCIPLINE CLAUSE (<discipline>, added 2026-08-25)" paragraph
# inside an existing element's gap_note, so the original four-domain analysis
# stays separable from the extension.
#
# SCOPE BOUNDARY vs. admin-onboarding--04-compliance-template-setup.yaml: that
# file documents DAY-ONE SETUP of the compliance scaffolding (the pencil
# drawer, the two-question cap, publish irreversibility, auto-notification
# one-way switches, Faculty Compliance). This file documents the ONGOING
# PER-STUDENT GATE — what each discipline must put in the shells, how an
# individual student clears it, and what actually blocks a placement. Facts
# established there (CISIVE/Universal/ComplianceJunction integrations,
# Reset-as-versioning, the exemption taxonomy, the Included-in-Profile-Link
# privacy toggle, HIPAA training via ComplianceJunction) are re-used here from
# the student's side and deliberately not contradicted.
#
# THREE FINDINGS THAT CUT ACROSS THE EIGHT DISCIPLINES, stated once here so
# they are not buried in element notes:
#   1. PT/PTA's readiness gate is structurally NOT a document gate. CAPTE 4O
#      defines readiness as a competency-and-safety verdict, and competency
#      results are not an input to Placement Clearance. See step 7's Compliance
#      Status clause and step 10's threshold element.
#   2. CRNA's gate is the only one with an absolute, non-exemptible
#      precondition (COA C.5 ACLS/PALS), and Prism's shipped exemption
#      sub-status taxonomy can silently satisfy it. See step 3.
#   3. Teacher Education's compliance content comes from state statute and
#      partner districts, not from CAEP — a requirements-modeling problem, not
#      an accreditation-mapping one, and the TE playbook's own compliance
#      section is explicitly unpopulated. See step 1's per-setting element.
flow_name: "Placement Clearance Gate"
maps_to_journey: "rotation-lifecycle.yaml, stage 3"
persona: >
  Primary: Compliance / Accreditation Liaison
  (../personas/role-compliance-accreditation-liaison.yaml) and Program
  Administrator (../personas/role-program-admin.yaml), who configure and
  monitor the gate. Secondary actor per step: the Student, who is the one
  actually clearing items (uploading documents, agreeing to attestations),
  and the Clinical Coordinator / Site, who supplies the site- and
  preceptor-side half of the gate.
steps:
  - screen: "Student Compliance – Setup tab (requirement configuration)"
    navigation_path: "Dashboard > Student Compliance > Setup tab > select Cohort"
    elements:
      - element: "Select Template dropdown"
        type: "input field"
        data_shown: "Existing cohort compliance configurations available to copy, or None to start from scratch"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not evaluated — eMedley's Student Documents module
          (content/competitors/emedley.yaml) documents a fixed document
          taxonomy but its public pages describe no copy-a-configuration
          template concept at all, so there is nothing to compare this
          control against.
        gap_severity: "none"
        gap_note: >
          Shipped mechanism. Templating is part of the configuration
          machinery the step's gap_note describes as "fully shipped"; it
          carries no per-domain content burden of its own.
      - element: "Requirement Categories (Health & Immunization, Certifications & Training, Verification/Identity Documents, Insurance & Liability, Memberships & Licensure, Attestations, Additional Documents)"
        type: "configurable list"
        data_shown: "Category groupings a program can add/edit requirements under"
        gates_on: []
        accreditation_citation: >
          COCA Standard 5, Element 5.4 (supervision-policy distribution) — the
          "Attestations" category confirmed here is the item type that element
          needs; COCA Standard 6, Element 6.10 (per-student completion checklist
          before clerkships) — the category/requirement model is the mechanism
          that checklist would be built on.
        competitor_equivalent: >
          eMedley's "Student Documents" module (eMedley playbook,
          content/competitors/emedley.yaml) publicly documents a comparable fixed
          document taxonomy (MMR, Hepatitis, flu, PPD, Varicella, BLS/CPR/HIPAA,
          licenses), but its public pages do not describe a configurable,
          admin-defined category system with a structured Attestations category
          the way Prism's Setup tab does — not granular enough on eMedley's side
          to call this element-for-element, only category-for-category.
        gap_severity: "configure-needed"
        gap_note: >
          This is the element that carries the step's per-domain work: the
          category shells exist and are configurable, but populating the item
          taxonomy inside them — which immunizations, which certifications,
          and critically which Attestations (e.g. a COCA 5.4-style
          supervision-policy attestation) a DO/Pharmacy/Dentistry/Medicine
          program needs — comes pre-loaded for none of these four domains the
          way ARC-PA/ACOTE curriculum attributes do elsewhere.
      - element: "Per-requirement edit (pencil) settings: Enable/Disable, Mandatory/Optional, Requires review by Approve team, Due Date, Guidelines/sample documents"
        type: "input field / toggle"
        data_shown: "Whether a given requirement is active for this cohort and whether it blocks placement (Mandatory) vs. is informational (Optional)"
        gates_on: ["Compliance Status column on the Placement Clearance Dashboard (see step 7)"]
        accreditation_citation: >
          COCA Standard 6, Element 6.10 (per-student completion checklist
          before clerkships) — the Mandatory/Optional flag is the specific
          control that makes an item gating rather than informational, i.e.
          what turns the requirement list into a completion checklist.
        competitor_equivalent: >
          eMedley's Student Documents module (content/competitors/emedley.yaml)
          publicly documents manual vs. auto-approval on its document items,
          the nearest analog to the "Requires review by Approve team" setting,
          but its public pages do not describe a per-item mandatory/optional
          gating flag or per-item due dates — not granular enough on eMedley's
          side for an element-for-element comparison.
        gap_severity: "none"
        gap_note: >
          Shipped mechanism. Per the step's own finding, the mandatory/optional
          flag, due dates and review routing are fully built; the per-domain
          work sits in the requirement taxonomy above, not in these controls.
      # ---------------------------------------------------------------------
      # EXISTING-DISCIPLINE EXTENSION (2026-08-25): the 8 disciplines Exxat
      # already serves (PT/PTA, OT/OTA, PA, SLP, Nursing, Social Work, Teacher
      # Education, CRNA). Elements below document where a discipline's
      # PER-STUDENT readiness taxonomy genuinely differs from the four
      # expansion domains' baseline. Setup-time mechanics (the pencil drawer,
      # publish irreversibility, auto-notifications) are deliberately NOT
      # re-modeled here — they belong to
      # admin-onboarding--04-compliance-template-setup.yaml. What is modeled
      # here is WHAT each discipline must put in the shells and how the gate
      # then behaves per student.
      - element: "OT/OTA and PT/PTA seeded requirement taxonomy inside the shipped categories (Health & Immunization: COVID-19 Test, COVID-19 Vaccination, Flu, HepA, HepB, TB, CPR, Physical Exam, CBC; Verification/Identity: Background check, Drug screening; Insurance & Liability: Health Insurance, Professional liability insurance)"
        type: "configurable list"
        data_shown: "The specific per-student items an OT/OTA (and, less fully enumerated, a PT/PTA) program actually populates the category shells with"
        gates_on: ["Compliance Status column on the Placement Clearance Dashboard (step 7)", "Whether a student is placement-eligible at all"]
        accreditation_citation: >
          CAPTE Standard 5, Element 5B (content/accreditation/capte.yaml,
          element_id "Standard 5, Element 5B") — 5B enumerates, as information
          the program must provide to prospective and enrolled students,
          "required health information, potential drug testing and criminal
          background check requirements, health and professional liability
          insurance requirements." That list is almost exactly the OT
          playbook's three-category taxonomy, so for PT/PTA and OT/OTA the
          taxonomy is not an internal convention — it is the accreditor's own
          enumerated disclosure set. capte.yaml rates 5B "Gap" overall, but
          splits it: the disclosure/health-requirements half is a Configure on
          Compliance Management today; only the outcomes-publication half is
          the Gap. No ACOTE element in content/accreditation/acote.yaml
          imposes a student health/immunization requirement — for OT the
          taxonomy is institutional and site-driven, not ACOTE-driven, which is
          a real structural difference worth stating rather than assuming
          symmetry with CAPTE.
        competitor_equivalent: >
          This is the ONE place in this stage where a competitor teardown is
          genuinely granular enough for an item-for-item comparison, and it is
          not favorable. CORE ELMS (content/competitors/core-elms.yaml,
          "Compliance Management," rated at-parity) publicly claims tracking of
          "immunizations, CPR certification, background checks, drug checks,
          HIPAA training, and licensing requirements, with automated expiration
          reminders" — the same taxonomy, named on a public page. eMedley
          (content/competitors/emedley.yaml) enumerates a comparable fixed list
          (MMR, Hepatitis, flu, PPD, Varicella, BLS/CPR/HIPAA, licenses) and
          New Innovations (content/competitors/new-innovations.yaml,
          "Credentialling Module," rated ahead) claims "licenses,
          certifications, visas, and immunizations with expiration alerts." At
          the level of WHICH ITEMS ARE TRACKED, PT/OT compliance is a
          commoditized, at-parity capability. The differentiation is in the
          gating behavior (step 7), which none of the three states publicly.
        gap_severity: "none"
        gap_note: >
          Shipped and in production, and the asymmetry with the four expansion
          domains is the finding: OT/OTA is the only discipline in the corpus
          with a written, enumerable starter taxonomy
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational
          Therapy (OT) Playbook.md, section "6. Student Compliance"), and the
          PT playbook records only the health/immunization half plus the
          onboarding instruction "Ask the school where they are tracking
          compliance if they don't track it on Prism" — i.e. even for PT, Prism
          is not assumed to be the system of record. Consistent with
          admin-onboarding--04-compliance-template-setup.yaml's finding that
          the mechanism ships and the content does not; this element names the
          content that DOES exist, for two disciplines only.
      - element: "CRNA ACLS and PALS certification requirement rows (Certifications & Training category), with issue and expiry dates"
        type: "configurable list"
        data_shown: "Per-student ACLS and PALS certification records with validity windows, required before any clinical activity begins"
        gates_on: ["Requirement Upload Status and Compliance Status on the Placement Clearance Dashboard (step 7)", "Per COA C.5 this must be a HARD BLOCK on placement start, not an advisory flag"]
        accreditation_citation: >
          COA Standard C.5 (Student Standards), with Standard D.12
          (content/accreditation/coa.yaml, element_id "Standard C.5 (Student
          Standards), with Standard D.12" — "ACLS and PALS Certification Before
          Beginning Clinical Activities"). C.5 requires proof every student
          holds ACLS and PALS certification BEFORE beginning clinical
          activities; D.12 is a critical-flagged graduate competency requiring
          the graduate to MAINTAIN current certification. coa.yaml rates the
          pair "Transfer" and states the required behavior precisely:
          certification items with issue and expiry dates that hard-block the
          start of a placement "rather than merely flagging non-compliance,
          since C.5 is a precondition and not a target," expiry alerting on a
          cycle short enough to catch a two-year ACLS card lapsing mid-program,
          and re-validation at EACH new placement rather than a one-time
          admission check.
        competitor_equivalent: >
          eMedley (content/competitors/emedley.yaml) publicly lists BLS and CPR
          as tracked certification item types, and CORE ELMS
          (content/competitors/core-elms.yaml) lists "CPR certification" — but
          neither names ACLS or PALS, and neither states that a certification
          item blocks placement start; emedley.yaml records explicitly that
          whether its items "actually GATE placement start/continuation... is
          not stated on eMedley's public pages." So the item type is at parity
          and the two-checkpoint precondition behavior is not documented at
          this granularity by any competitor teardown in this research.
        gap_severity: "configure-needed"
        gap_note: >
          Genuinely distinctive to CRNA and the sharpest per-student
          precondition in the whole 12-discipline set: two named certifications
          that must be valid at two separate checkpoints (placement start and
          graduation), where every other discipline's health/immunization items
          are renewal-cycle items rather than absolute preconditions. Two
          concrete configure-items follow. (1) Re-validation must happen at each
          new placement, not once at admission — the Requirement Upload Status
          column evaluates current document state, so a card that lapses
          between rotation 3 and rotation 4 is caught only if the expiry model
          and the 6-8-week monitoring cadence are both configured. (2) Per
          coa.yaml's own gap_notes, the exemption taxonomy is a live hazard here
          — see the dedicated element in step 3. Source note: the Nursing
          Playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing
          Playbook.md, "Compliance" and "Clinical Sites, Contracts &
          Placements") names ACLS/PALS explicitly as the CRNA-specific
          certifications verified at the Placement Clearance gate. The CRNA
          video transcripts at CRNAVideosTranscripts.md
          do NOT corroborate this — the only compliance-adjacent line in that
          file is line 49 (the CCE log keeping students "compliant with
          accreditation and certification standards"), and the transcripts
          contain no ACLS, PALS, background-check, immunization or readiness-gate
          narration at all. Stated here rather than implied.
      - element: "Nursing/CRNA pre-clinical licensure verification requirement (Memberships & Licensure category)"
        type: "configurable list"
        data_shown: "Student's own RN/APRN licensure record verified before clinical rotations begin — distinct from the FACULTY licensure tracked in Faculty Compliance"
        gates_on: ["Compliance Status column on the Placement Clearance Dashboard (step 7)"]
        accreditation_citation: >
          None available at element granularity, stated rather than invented.
          Neither content/accreditation/nursing.yaml (CCNE/ACEN) nor
          content/accreditation/coa.yaml carries an element_id imposing a
          STUDENT licensure prerequisite — nursing.yaml's licensure elements
          are CCNE Standard IV, Key Element IV-C (NCLEX-RN pass rates, an
          outcome measure) and CCNE Standard II, Key Element II-F / II-G
          (faculty and preceptor qualification). The requirement is documented
          only in the Nursing Playbook's Compliance section, which maps COA
          Standard A (conducting institution) and Standard C (students) onto
          Student Compliance without naming a sub-standard. Do not cite a COA
          element for this until one is verified.
        competitor_equivalent: >
          CORE ELMS (content/competitors/core-elms.yaml) names "licensing
          requirements" in its public compliance list and MedHub
          (content/competitors/medhub.yaml) claims "automated credentials
          monitoring for state, DEA, and Controlled Substances licenses" —
          but MedHub's is registry-verification of PRACTITIONER licenses in a
          GME context, not a student pre-clinical licensure item, so it is not
          a like-for-like comparison. At student-licensure granularity this is
          not documented by any competitor teardown in this research.
        gap_severity: "configure-needed"
        gap_note: >
          Structurally distinctive: Nursing and CRNA are the only disciplines in
          the set where the STUDENT already holds a professional license that
          must itself be verified before clinical work — for PT/OT/PA/SLP/SW/TE
          the licence is the outcome of the program, not a prerequisite to it.
          That inverts the usual mental model of the Memberships & Licensure
          category, which everywhere else in this corpus is a preceptor-side
          concern. Note the same inversion means the licensure item shares the
          two-checkpoint problem described for ACLS/PALS above: an RN licence
          renewing mid-program must re-clear at the next placement.
      - element: "Vendor-backed requirement types (Universal Background Screening, Cisive, ComplianceJunction HIPAA training) added as requirements alongside upload-based items"
        type: "configurable list"
        data_shown: "Requirements satisfied by a third-party transaction and a synced status rather than a student-uploaded document"
        gates_on: ["Requirement Upload Status and Compliance Status on the Placement Clearance Dashboard (step 7)", "Student's ability to start the vendor transaction at all (see step 4)"]
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5 (content/accreditation/cswe.yaml,
          element_id "Accreditation Standard 3.3, AS 3.3.5" — "Orienting,
          Placing, Monitoring, Safety Protocols, and Evaluating Students in
          Field"). cswe.yaml states the required behavior as "a pre-placement
          readiness gate covering background checks, drug screening, and
          required trainings (the operational form 'safety protocols' takes in
          practice)" and rates the element "Transfer," naming Social Work as
          "the ONE discipline with named third-party integrations behind it."
          Also CAPTE Standard 5, Element 5B for PT/PTA, which enumerates
          "potential drug testing and criminal background check requirements"
          as a required student disclosure.
        competitor_equivalent: >
          CORE ELMS (content/competitors/core-elms.yaml, rated at-parity)
          publicly claims tracking of "background checks, drug checks... HIPAA
          training," so the ITEM TYPES are at parity — but no competitor file in
          content/competitors/ describes an embedded vendor integration where
          the platform initiates the order and receives a synced status. A
          second, more important competitor finding sits outside
          content/competitors/ entirely: the PT Playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical
          Therapy (PT) Playbook.md) names myClinicalExchange (mCE), Clinician
          Nexus, ACEMAPP and CastleBranch Bridges as "third-party vendors that
          require student account registration and payments for slot requests or
          onboarding — direct competitors of Exxat/Exxat One" that "will not
          integrate with us." Those four are the real competitive set for THIS
          element and none of them has a teardown file in content/competitors/ —
          a documented research gap, stated here rather than papered over.
        gap_severity: "configure-needed"
        gap_note: >
          The named vendor set is documented for Social Work only. Per
          admin-onboarding--04-compliance-template-setup.yaml (External
          Trainings step), whether these integrations are offered outside
          SW/health-professions is unconfirmed anywhere in the corpus — and
          content/accreditation/cswe.yaml logs the same open question as "a live
          commercial question." For Teacher Education this matters more than for
          any other discipline: per content/accreditation/caep.yaml's
          licensure_or_gme_layer entry "State background-check, fingerprinting
          and school-district clearance requirements," fingerprint-based state
          and FBI criminal-history checks are absolute placement blockers for TE
          candidates, and Universal Background Screening is specifically named
          in content/prism/capability-map.yaml as the FINGERPRINT background-check
          vendor — so the mechanism TE needs already exists, but nothing in the
          corpus confirms it is offered to TE programs.
      - element: "Per-setting Program Requirements (a requirement that applies only to certain placement settings/sites, tracked per student as completed/pending/overdue/outstanding)"
        type: "configurable list"
        data_shown: "Differential requirement sets — e.g. an item required only for Acute Care placements, or only at a particular district/agency"
        gates_on: ["Whether a student is clear for a SPECIFIC placement rather than clear in general"]
        accreditation_citation: >
          CAEP Standard R3, Component R3.2 (content/accreditation/caep.yaml,
          element_id "Standard R3, Component R3.2" — "Monitoring and Supporting
          Candidate Progression"), which requires a per-candidate gate model
          where advancement is blocked until named criteria are satisfied and
          asks pointedly "how does the EPP ensure there are no loopholes to work
          around the system?"; caep.yaml rates R3.2 "Configure" and names
          Placement Clearance as the supported gate. The requirement CONTENT for
          TE, though, comes from outside CAEP entirely — see caep.yaml's
          licensure_or_gme_layer entry "State background-check, fingerprinting
          and school-district clearance requirements," which states flatly that
          "no component of the 2022 Initial-Licensure standards imposes a
          background-check requirement on candidates" while those requirements
          are nonetheless "absolute placement blockers."
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research. CORE ELMS, eMedley and New Innovations all describe a flat,
          program-wide item list; none of their public sources describes
          requirements scoped to a setting, site, or partner district.
        gap_severity: "gap"
        gap_note: >
          Real and Teacher-Education-specific. caep.yaml states the structural
          pattern outright: "for Teacher Education the COMPLIANCE burden is
          state/district-driven while the EVIDENCE burden is accreditor-driven,
          whereas in the health disciplines both flow largely from the same
          accreditor... the requirement SETS have to be modeled per state and
          per district partner rather than once per program." Per-setting
          Program Requirements is the closest shipped mechanism, but the
          scoping unit documented in the corpus is the SETTING (e.g. Acute
          Care), not the partner district, and the Setup tab confirmed in this
          step scopes configuration to a COHORT. A TE program placing candidates
          across twenty districts with twenty different clearance packets has no
          documented modeling path. Compounding it: the TE playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Teacher
          Education (TE) Playbook.md, "Open Gaps") lists "Compliance —
          background-check/fingerprinting and other TE-specific compliance
          document patterns" as EXPLICITLY UNPOPULATED, so there is no
          discipline source to configure against either. This is an evidence gap
          on top of a product gap, and both should be stated to a TE prospect.
      - element: "Universal-precautions / infection-control training requirement (Certifications & Training category) — SLP"
        type: "configurable list"
        data_shown: "Completion record for the infection-control training that must precede student contact with clients"
        gates_on: ["Compliance Status column on the Placement Clearance Dashboard (step 7)"]
        accreditation_citation: >
          CAA Standard 3.0B, Standard 3.8B (content/accreditation/caa-asha.yaml,
          element_id "Standard 3.0B, Standard 3.8B" — "Clinical education
          protects the welfare of each person served by the student and clinical
          educator team"). Among its required behaviors caa-asha.yaml lists "gate
          the student's presence at the site on completed universal-precautions /
          infection-control training," and its prism_fit_rationale states
          Placement Clearance "separately gates the placement on student
          compliance items, so infection-control/universal-precautions training
          is an existing item type." Rated "Configure."
        competitor_equivalent: >
          CORE ELMS (content/competitors/core-elms.yaml) and eMedley
          (content/competitors/emedley.yaml) both name HIPAA training as a
          tracked item type, which is the nearest analog to a mandated
          pre-placement training, but neither names infection control or
          universal precautions specifically. Not documented at this
          granularity by any competitor teardown in this research.
        gap_severity: "configure-needed"
        gap_note: >
          Worth flagging precisely because SLP's compliance story is
          under-documented rather than absent: the SLP playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Speech-Language
          Pathology (SLP) Playbook.md, read in full 2026-08-25) contains NO
          compliance section at all — its own gap list at lines 142-149 is
          explicit that thin coverage is "a documentation gap, not necessarily a
          product gap," and its data-quality caveat at line 12 explains why
          (the note is synthesized from eight thin feature-specific artifacts —
          an FAQ, four report/feature how-tos, a release note and one video
          transcript — rather than from a CSS playbook). So
          the accreditor requirement (3.8B) is verified and the item type is
          verified from caa-asha.yaml, but no SLP-side source confirms how SLP
          programs actually configure it. Note separately that the 3.8B GAP
          caa-asha.yaml identifies is not the training item — it is the computed
          direct-supervision PERCENTAGE (CFCC V-E's 25% floor), which is a
          rotation-lifecycle stage 5 concern, not this gate.
      - element: "Additional Profile Details as a PARALLEL readiness-capture surface outside Compliance Management (Social Work)"
        type: "configurable list (student-profile section, not a compliance requirement)"
        data_shown: >
          Placement-readiness information collected on the student PROFILE rather than as compliance
          requirements — the SW playbook names accommodations, vaccination records, and
          background-check details specifically, and records that the section is "fully customizable
          and is commonly used IN PLACE OF a traditional field application form"
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
          Work (SW) Playbook.md line 77).
        gates_on:
          - "Nothing — and that is the finding. Data captured here does NOT feed the Requirement Upload Status or Compliance Status columns on the Placement Clearance Dashboard (step 7), because those columns evaluate compliance REQUIREMENTS, not profile fields."
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5 (content/accreditation/cswe.yaml, element_id
          "Accreditation Standard 3.3, AS 3.3.5") — the pre-placement readiness gate covering
          background checks, drug screening and required trainings. cswe.yaml rates AS 3.3.5
          "Transfer" on the strength of Compliance Management's named vendor integrations; this
          element is the caveat on that rating, because a program that collects the same facts on
          the profile instead gets none of the gating.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. CORE ELMS,
          eMedley and New Innovations all describe a single compliance record per student
          (content/competitors/core-elms.yaml, emedley.yaml, new-innovations.yaml); none describes a
          second, ungated profile surface capable of holding the same data, so it cannot be said
          whether the same split exists in their products.
        gap_severity: "gap"
        gap_note: >
          ADDED 2026-08-25 from a full read of the SW playbook. This is the sharpest
          Social-Work-specific finding in this step and it cuts against the discipline's otherwise
          strong rating: the SW playbook documents, as COMMON PRACTICE, collecting vaccination
          records and background-check details in a profile section rather than as compliance
          requirements. Three consequences, none of them hypothetical. (1) Those items have no
          status model, no expiry, no review routing, and no exemption taxonomy — the entire
          machinery documented in steps 1-4 simply does not apply to them. (2) They do not reach the
          Placement Clearance gate, so a student can be "All Docs Approved" on the step 7 rollup
          while their background-check detail sits unreviewed in a profile field. (3) The
          "Included in Profile Link" privacy control documented in step 2 governs COMPLIANCE items;
          nothing in the sources states what governs external exposure of Additional Profile Details,
          which matters because SW's Share Profile is student-initiated (line 81).
          Worth stating plainly to a Social Work program: the playbook is describing a workaround
          for the absence of a first-class field-application intake, and the cost of that workaround
          is the readiness gate. Distinct from the vendor-integration step below, which documents
          the well-modelled path.
