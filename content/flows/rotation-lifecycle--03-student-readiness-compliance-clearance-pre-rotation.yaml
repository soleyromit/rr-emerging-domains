          question "how does the EPP ensure there are no loopholes to work
          around the system?" — caep.yaml's rationale names the Clearance
          Dashboard's parallel status models plus Exxat's documented
          6-8-weeks-ahead monitoring practice as exactly that evidence. For TE
          this column is therefore doing double duty: an operational gate AND a
          transition-point audit artifact.
      - element: "Preceptor CV / License / Certification columns"
