        gap_note: >
          Shipped. This is one of the non-student columns that makes the gate
          multi-entity (student + site + contract + preceptor) rather than a
          single-entity compliance checklist.

          EXISTING-DISCIPLINE CLAUSE (OT/OTA, added 2026-08-25): the OT
          playbook records a specific, named false-positive on this column —
          "Not all sites require a contract, but the system assumes a contract
          is required when a site is added, so it flags missing contracts even
          when none is needed. Schools have requested a way to mark a site as
          'contract not required' so it isn't flagged as missing/incomplete"
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational
          Therapy (OT) Playbook.md, "Placement Clearance Requirements"). This is
          the one documented defect in the clearance gate itself rather than in
          its inputs, and it degrades the gate in the worst way — by training
          admins to ignore a red state. It bites OT hardest because Level I
          fieldwork routinely uses observation/service-learning settings that
          carry no affiliation agreement, whereas ACOTE Standard C.1.5
          (content/accreditation/acote.yaml) requires written agreements for
          Level I and Level II alike, so an OT program cannot simply suppress
          the column either.

          EXISTING-DISCIPLINE CLAUSE (SLP, added 2026-08-25): CAA Standard 3.0B,
