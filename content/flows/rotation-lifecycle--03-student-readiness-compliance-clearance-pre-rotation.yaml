        competitor_equivalent: "Not evaluated — no competitor teardown documents a report/dashboard split at this granularity."
        gap_severity: "gap"
        gap_note: >
          A named, documented product gap, not a hedge, and it applies to this
          report as a whole rather than to one column: per FAQ #13 the report
          explicitly does NOT indicate whether the student's profile has
          actually been *shared* with the site — only that documents are
          uploaded and the contract is valid. Profile-sharing is a distinct,
          easy-to-miss manual step, and a program relying on this report alone
          (rather than the live Dashboard) could believe a student is
          clinically placed and clear when the receiving site has never
          actually seen their compliance profile. Real operational risk worth
          surfacing in the pre-rotation gate story.
      - element: "Site contract status column"
        type: "read-only rollup"
        data_shown: "Whether the placement site has a valid contract"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: "Not evaluated — no competitor teardown documents a report/dashboard split at this granularity."
        gap_severity: "gap"
        gap_note: >
          Same report-level gap as the sibling column, stated identically
          because the source material does not distinguish between them: per
          FAQ #13 the report shows only uploaded-document status and site
          contract status, and explicitly does NOT indicate whether the
          student's profile has been *shared* with the site. A program relying
          on this report instead of the live Dashboard can believe a placement
          is clear when the site has never seen the student's compliance
          profile.
    action: >
      Admin reviews or exports this report as a point-in-time check before
      finalizing clinical placements.
    confirmed_by: >
      Explicit product-scope statement, FAQ #13: "Placement clearance report
      status, does it show the status if the student has sent their profile
      or just the uploaded document? ... the Placements Clearance report only
      shows the status of uploaded documents and the site contract status." —
      PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/FAQs for Administrators/Frequently Asked
      Questions- Program Administrators.md. Navigation path corroborated in
      the Nursing COA Accreditation Standards Support Guide's "Placement
      Clearance Report" row.

  - screen: "Personnel record – Preceptor credential fields"
    navigation_path: "Sites > [Site] > Personnel > [Preceptor record]"
    elements:
      - element: "Certification field"
        type: "input field"
        data_shown: "e.g. NCCPA certification details for the preceptor's specialty"
        gates_on: ["Preceptor Certification column on the Placement Clearance Dashboard"]
        # preceptor/site half of the gate, not a student-readiness standard for this stage
        accreditation_citation: ""
        competitor_equivalent: "Not evaluated — no competitor teardown documents preceptor-record fields at this granularity."
        gap_severity: "none"
        gap_note: >
          Shipped. Included because current_state_in_prism describes this
          stage as gating on more than the student; this is one of the
          concrete fields where that non-student gating data actually lives.
      - element: "License Number field"
        type: "input field"
        data_shown: "Preceptor's license details"
        gates_on: ["Preceptor License column on the Placement Clearance Dashboard"]
        # preceptor/site half of the gate, not a student-readiness standard for this stage
        accreditation_citation: ""
        competitor_equivalent: "Not evaluated — no competitor teardown documents preceptor-record fields at this granularity."
        gap_severity: "none"
        gap_note: >
          Shipped. Included because current_state_in_prism describes this
          stage as gating on more than the student; this is one of the
          concrete fields where that non-student gating data actually lives.
      - element: "CV upload"
        type: "input field"
        data_shown: "Preceptor curriculum vitae"
        gates_on: ["Preceptor CV column on the Placement Clearance Dashboard"]
        # preceptor/site half of the gate, not a student-readiness standard for this stage
        accreditation_citation: ""
        competitor_equivalent: "Not evaluated — no competitor teardown documents preceptor-record fields at this granularity."
        gap_severity: "none"
        gap_note: >
          Shipped. Included because current_state_in_prism describes this
          stage as gating on more than the student; this is one of the
          concrete fields where that non-student gating data actually lives.
      # --- EXISTING-DISCIPLINE EXTENSION (2026-08-25) ---
      - element: "Educator-supplied credential intake that does NOT write back to this record (OT Fieldwork Educator Details Form; OT Educator Verification Form; SW Experiential Supervisor Intake Form / Field Instructor Information Form)"
        type: "input field"
        data_shown: "Years of experience, degrees, certifications, licensure and CV collected FROM the educator on a form — which an admin must then re-key into the Personnel record for it to reach the clearance gate"
        gates_on: ["Nothing directly — that is the defect: the collected data does not gate until re-entered by hand"]
        accreditation_citation: >
          ACOTE Standard C.1.13 (content/accreditation/acote.yaml, element_id
          "Standard C.1.13" — "Qualified Level II Fieldwork Educators"), which
          requires the educator to be currently licensed or otherwise regulated
          as an occupational therapist with at least one year of full-time
          post-licensure practice experience prior to supervising Level II
          fieldwork. Also CSWE Accreditation Standard 3.3, AS B3.3.6 / M3.3.6
          (content/accreditation/cswe.yaml), whose named mechanisms include "My
          Request forms or a Field Instructor Information Form to mandatorily
          capture FI credentials at placement time" alongside the Agency
          Personnel profile and the Placement Clearance Dashboard.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research — no competitor file in content/competitors/ describes a
          preceptor-facing credential intake form at all, so there is no basis
          for comparing whether their equivalents sync.
        gap_severity: "gap"
        gap_note: >
          A named, quoted product gap on the preceptor side of the gate, and it
          is OT's most concrete one. Per the OT playbook: "Schools require
          students to provide info about their Fieldwork Educator: years of
          experience, degrees, certifications, licensure, and a CV — an
          accreditation requirement to confirm educators are qualified to
          supervise. LIMITATION: CV and other details collected via the
          Fieldwork Educator Details Form do not sync automatically with the
          system — schools must manually enter this data"
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational
          Therapy (OT) Playbook.md, "Fieldwork Educator" section). The
          consequence lands exactly on this stage: the step 7 dashboard's
          Missing/Exists/NA preceptor tracker reads Missing until someone
          re-keys data the program already holds, so a placement can be blocked
          by a transcription backlog rather than by an actual credential
          problem — the mirror image of the OT contract false-positive recorded
          on the Contract Status column. Social Work runs the same intake
          pattern (Experiential Supervisor Intake Form, Field Instructor
          Information Form) but its playbook does not state whether those sync,
          so the SW case is unconfirmed rather than confirmed-broken; do not
          assume symmetry. Note the OT playbook also records an "Educator
          Verification Form" that "lets educators electronically confirm
          preparation, licensure, and practice experience," which is the closest
          thing to a self-service path and whose write-back behavior is likewise
          unstated.
    action: >
      Admin (or a site contact via a delegated no-login link) enters or
      verifies the preceptor's specialty-specific license/certification/CV
      data, which feeds the Dashboard's three-state Missing/Exists/NA
      preceptor tracker.
    confirmed_by: >
      PA Playbook, "Personnel" and "Personnel data best practices" sections
      (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician
      Assistant (PA) Playbook.md); corroborated in
      content/prism/capability-map.yaml, "Personnel compliance" feature.

  - screen: "Competency Review Dashboard"
    navigation_path: >
      Competency Management > [Framework] > Review Dashboard (per cohort,
      after mapping assessments/course offerings to the framework)
    elements:
      - element: "Domain Scores chart"
        type: "read-only rollup"
        data_shown: "Average score per competency domain across the cohort"
        gates_on: []
        accreditation_citation: >
          ACPE Standard 7, Key Element 7.3.d — the AGGREGATE half of the
          requirement (evidence of APPE-readiness measured at aggregate level
          before students enter APPEs); content/accreditation/acpe.yaml rates
          this element "Configure."
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable pooled competency-scoring dashboard at element level."
        gap_severity: "configure-needed"
        gap_note: >
          The aggregation mechanism is confirmed and more specific than
          previously known: parent-level (domain) scores are a POOLED mean
          across all child competencies' mapped questions, not a naive
          average-of-averages. What remains configure-work is whether a
          program can point this engine at ACPE's specific 2.1.a-n outcome
          taxonomy rather than a generic framework.
      - element: "Student Proficiency Distribution chart"
        type: "read-only rollup"
        data_shown: "Meeting Threshold (all domains above configured threshold) vs. Below Threshold (at least one domain below)"
        gates_on: []
        accreditation_citation: >
          ACPE Standard 7, Key Element 7.3.d — the INDIVIDUAL-STUDENT half of
          the requirement, since this chart classifies each student against
          the configured threshold before rolling up;
          content/accreditation/acpe.yaml rates this element "Configure."
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable pooled competency-scoring dashboard at element level."
        gap_severity: "configure-needed"
        gap_note: >
          Per-student threshold classification exists, which is the closest
          shipped analog to a readiness verdict. What is genuinely unconfirmed
          is narrower than the journey's earlier hedge: (1) whether the
          APPE-ready/Practice-ready/Team-ready three-tier readiness language
          can be configured here specifically, and (2) standardized,
          psychometrically valid knowledge assessment behind the gate, which
          depends on Exam Management (roadmap Q2 2027, still not shipped) per
          acpe.yaml's own gap_notes.
      - element: "Score Distribution box plot"
        type: "read-only rollup"
        data_shown: "Renders red when a domain's median falls below its configured pass threshold (default 70%, school-configurable)"
        gates_on: []
        accreditation_citation: >
          ACPE Standard 7, Key Element 7.3.d — aggregate-level evidence, with
          the configurable pass threshold as the explicit
          readiness-bar mechanism; content/accreditation/acpe.yaml rates this
          element "Configure."
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable pooled competency-scoring dashboard at element level."
        gap_severity: "configure-needed"
        gap_note: >
          Threshold is shipped and school-configurable (default 70%), so the
          bar itself is a configuration decision each program must make
          against its own ACPE readiness definition rather than a shipped
          default that satisfies 7.3.d out of the box.
      # --- EXISTING-DISCIPLINE EXTENSION (2026-08-25) ---
      - element: "Configurable pass threshold as a pre-clinical safety gate (PT/PTA) — and the absent critical-safety severity flag"
        type: "toggle"
        data_shown: "Per-domain pass threshold (default 70%, school-configurable) determining Meeting Threshold vs. Below Threshold per student"
        gates_on: ["Nothing in Placement Clearance — this is the finding, not an omission in the modeling"]
        accreditation_citation: >
          CAPTE Standard 4, Element 4O (content/accreditation/capte.yaml,
          element_id "Standard 4, Element 4O" — "Students Professional,
          Competent, Safe, and Ready to Progress to Clinical Education"), rated
          "Configure." 4O requires the program to document the processes and
          criteria core faculty use to determine students are "professional,
          competent, and safe in faculty-identified skills and ready to engage
          in clinical education"; HOW CRITICAL SAFETY ELEMENTS are identified
          within the competency testing process; what happens when a student is
          found not safe and ready to progress; and how the required skills are
          communicated to students AND to clinical education faculty. The
          PTA-side equivalent is CAPTE PTA Element 4M, per capte.yaml's source
          note.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research — no competitor file in content/competitors/ documents a
          per-student pass-threshold classification, let alone one intended to
          gate progression to clinical education.
        gap_severity: "gap"
        gap_note: >
          Named as a gap, not a hedge, and it is the PT/PTA headline for this
          stage. Three of 4O's four asks are met by machinery already modeled
          above: per-student threshold classification exists, a remediation
          record exists (Interventions, step 11), and publication to students
          exists (the Publish toggle below). The two that do not, per
          capte.yaml's own gap_notes: (1) "Placement Clearance's gate evaluates
          compliance documents, contracts, and preceptor credentials —
          competency-framework results are not one of its inputs, so 'ready to
          progress' is currently a human judgment outside the block," i.e. there
          is no hard block; and (2) "Critical-safety severity has no
          representation" — a program cannot mark a subset of skills as
          safety-critical so that failing one carries different consequence from
          failing an ordinary skill. capte.yaml notes the nearest precedent
          anywhere in the corpus is COA's asterisk convention for critical
          standards (visible in content/accreditation/coa.yaml, e.g. Standard
          F.7 and Standards D.1-D.50), which is an accreditor's convention Prism
          reflects in content, not a product primitive. Also note the dependency
          capte.yaml flags: scoring a didactic course from final grades requires
          grading schemes enabled first, and per
          content/accreditation/caep.yaml the Grading Scheme module is
          "explicitly record-keeping only" and "does not calculate student
          grades."
      - element: "Student-facing publication of the readiness record (SLP: Clinical Clock Hours Report by Student, exportable to PDF by the student)"
        type: "read-only rollup"
        data_shown: "The student's own cumulative supervised clinical hours and competency scores across the nine service-delivery areas"
        gates_on: []
        accreditation_citation: >
          CAA Standard 4.0, Standard 4.7 (with 4.8)
          (content/accreditation/caa-asha.yaml, element_id "Standard 4.0,
          Standard 4.7 (with 4.8)" — "The program documents student progress
          toward the graduate degree AND professional credentialing
          requirements"), rated "Configure." 4.8 specifically requires the
          program to make that documentation available TO THE STUDENT — and to
          graduates and non-completing attendees — to assist them in qualifying
          for the credential.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes a student-self-service credentialing record."
        gap_severity: "configure-needed"
        gap_note: >
          Included in this stage because for SLP the "readiness" concept spans
          two audiences: readiness to ENTER a placement (the compliance gate
          above) and documented progress toward the CCC-SLP credential, which
          4.7/4.8 makes a per-student record obligation. The student-facing half
          is genuinely shipped — caa-asha.yaml notes the Clinical Clock Hours
          Report (By Student) "is explicitly available to STUDENTS, not just
          admins, and exports to PDF." The configure-work is assembly and
          retention: per caa-asha.yaml, "No single artifact combines coursework,
          hours, and competency sign-off into one per-student credentialing
          dossier," and "nothing in the sources confirms that a graduate or a
          non-completing attendee retains access to their own Prism record,
          which is exactly when the student needs the hours verification."
      - element: "Publish/Unpublish toggle"
        type: "toggle"
        data_shown: ""
        gates_on: ["Whether scores appear on the student-facing My Competency Tracker"]
        accreditation_citation: ""
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable pooled competency-scoring dashboard at element level."
        gap_severity: "none"
        gap_note: >
          Shipped visibility control, with no per-domain configuration burden
          of its own; it governs student visibility, not the readiness
          evidence ACPE 7.3.d asks for.
    action: >
      Admin reviews pooled, per-domain competency attainment for the cohort
      before publishing it — the closest existing analog to the
      individual-and-aggregate readiness rollup ACPE 7.3.d asks for.
    confirmed_by: >
      content/prism/capability-map.yaml, intelligence_layer > "Competency
      Tracking" (sourced there to the "Setting Up Competency Management"
      tutorial transcript and Exxat help-center documentation).

  - screen: "Student Interventions record"
    navigation_path: "Student Profile > Interventions tab > New Intervention"
    elements:
      - element: "Mode / Initiator fields"
        type: "input field"
        data_shown: "How the concern was raised and by whom"
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-2 (individual evaluation and documented
          due process when a student fails to meet published criteria) —
          content/accreditation/coda.yaml rates this element "Configure."
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable structured incident/case-log record at element level."
        gap_severity: "configure-needed"
        gap_note: >
          Captures how and by whom a concern was raised, which is the opening
          of the due-process trail. What is still open is whether the field
          set can be extended to the specific items a formal institutional
          due-process procedure requires (e.g. hearing date, appeal outcome).
      - element: "Open/Closed status"
        type: "toggle"
        data_shown: "Formal case status, distinct from a plain compliance-item status"
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-2 (documented due process) — the
          case-status primitive that distinguishes a due-process case record
          from an ordinary compliance item;
          content/accreditation/coda.yaml rates this element "Configure."
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable structured incident/case-log record at element level."
        gap_severity: "configure-needed"
        gap_note: >
          This element is what resolves the journey stage's prior hedge that a
          "case-management/due-process trail" was simply unconfirmed: a real
          case-management primitive exists. What remains open is reporting —
          there is no dedicated Interventions report; the only way to see
          interventions needing follow-up is the Sites/Locations Dashboard
          (24-hour refresh, per capability-map.yaml), which is not built
          around due-process case tracking specifically.
      - element: "Follow-Ups (planned vs. actual date, notes)"
        type: "input field"
        data_shown: "Structured remediation/monitoring trail over time"
        gates_on: []
        accreditation_citation: >
          CODA Standard 2, Element 2-2 (documented due process and
          remediation over time) — the planned-vs-actual follow-up trail is
          the durable documentation half of that element;
          content/accreditation/coda.yaml rates this element "Configure."
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable structured incident/case-log record at element level."
        gap_severity: "configure-needed"
        gap_note: >
          Structured remediation tracking is shipped, but its surfacing is the
          weak point: there is no dedicated Interventions report, so
          follow-ups that are due can only be spotted via the Sites/Locations
          Dashboard (24-hour refresh, per capability-map.yaml), which is not
          built around due-process case tracking.
      - element: "Make visible to student toggle"
        type: "toggle"
        data_shown: "Requires explicit confirmation before the student can see the intervention record"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: "Not evaluated — no competitor teardown documents a comparable structured incident/case-log record at element level."
        gap_severity: "none"
        gap_note: >
          Shipped visibility control with an explicit confirmation step; it
          governs student access to the record rather than the due-process
          documentation CODA 2-2 asks for, so it carries no configure-work of
          its own.
      # --- EXISTING-DISCIPLINE EXTENSION (2026-08-25) ---
      - element: "Communications record type (neutral advising) as a sibling of Interventions, with faculty-advisor binding and RBAC scoping"
        type: "input field"
        data_shown: "Dated, attributable advising conversations logged separately from documented concerns; visible only to the assigned advisor and authorized personnel"
        gates_on: ["Nothing in the placement gate — this is the evidence trail beside the gate, not an input to it"]
        accreditation_citation: >
          ACOTE Standard A.3.5 (content/accreditation/acote.yaml, element_id
          "Standard A.3.5" — "Student Advising by Faculty"), rated "Transfer"
          and described there as "shipped and in production for OT today."
          A.3.5 requires documented advisement by faculty who are OT
          practitioners in the program, covering conduct and responsibilities to
          enter the profession, student progress and academic standing,
          fieldwork education, and (OTD only) the doctoral capstone — with
          visibility restricted to the assigned advisor because advisement
          content is sensitive. Also CAA Standard 4.0, Standard 4.6
          (content/accreditation/caa-asha.yaml, "Students receive regular
          advising on academic and clinical performance and progress") for SLP,
          which caa-asha.yaml records as "directly served by Compliance
          Management's Communications record type."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no reviewed teardown documents a structured advising log distinct from an incident log."
        gap_severity: "configure-needed"
        gap_note: >
          The Communications/Interventions SPLIT is the thing worth naming, and
          it belongs to the existing disciplines rather than the expansion
          domains: the modeled steps above treat Interventions as the
          due-process object (CODA 2-2), but for OT and SLP the accreditor asks
          for the NEUTRAL half — proof that routine advising happened on a
          regular basis, including specifically on fieldwork preparation. The
          OT playbook records the distinction in practice, with faculty mentors
          associated directly to student profiles and notes logged both
          internally and shared with the student
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational
          Therapy (OT) Playbook.md, "Student Profile" and "Communication and
          Intervention — A.3.5"). Social Work uses the same pair for field-visit
          documentation with attachments and email records (SW playbook lines
          79-80: Communications carries "faculty advising notes and field-visit
          documentation (attachments/email records supported)" and Interventions
          "captures concerns/support activity, NOT NECESSARILY DISCIPLINARY"),
          noting both tabs are read-only to students. That
          not-necessarily-disciplinary framing is worth carrying: it is the one
          source in this corpus that says the Interventions object is not
          inherently a due-process record, which cuts against the CODA 2-2 reading
          the four-domain elements above build on. Configure-work is the reporting: per
          acote.yaml, "there is currently no dedicated Interventions report —
          open follow-ups surface only via the Sites/Locations Dashboard
          (24-hour refresh...) or via an Ask Leo natural-language query. For an
          A.3.5 evidence pull a program wants a per-student advisement history
          export, not a dashboard bucket." The OT playbook does confirm a
          "Communication and Intervention Report" exists, which is the one
          discipline source contradicting the "no dedicated report" finding —
          an inconsistency worth resolving before it is repeated to a customer.
      - element: "Absent complaint register (no record type distinct from Interventions for candidate complaints, including complaints made to the accreditor)"
        type: "read-only rollup"
        data_shown: "Nothing — modeled here because its absence is the finding"
        gates_on: []
        accreditation_citation: >
          CAEP Standard R3, Component R3.2 (content/accreditation/caep.yaml,
          element_id "Standard R3, Component R3.2"), which requires "a system
          for effectively maintaining records of candidate complaints, including
          complaints made to CAEP," with documented resolution, and asks for
          remediation data disaggregated by race/ethnicity across three cycles.
        competitor_equivalent: >
          CORE ELMS (content/competitors/core-elms.yaml) is the one competitor
          whose public compliance list includes "incident report tracking,"
          which is the nearest public analog to a complaint register — but its
          source does not describe complaint origination, resolution states, or
          regulator involvement, so it is not documented at this granularity.
        gap_severity: "gap"
        gap_note: >
          Named gap, Teacher-Education-specific, and quoted rather than inferred.
          Per content/accreditation/caep.yaml: "Prism has no confirmed complaint
          register distinct from Interventions, and CAEP's requirement is
          specifically for complaints INCLUDING those made to CAEP itself — an
          externally-originated record type with a regulator in the loop. Do not
          stretch Interventions to cover it; scope it as its own object under
          Accreditation Management (Q3 2027)." The same file records the
          companion gap on the reporting side: "the 'three cycles of remediation
          data, disaggregated by race/ethnicity' that R3.2 demands is not
          extractable today," because the only intervention-follow-up surface is
          the Sites/Locations Dashboard on a 24-hour refresh, which is
          site-oriented rather than candidate-cohort-oriented. Both sit squarely
          in the pre-rotation gate story for TE, because R3.2's transition points
          are exactly the gates a candidate must clear before student teaching.
      - element: "Absence of a 'student safety protocol' object distinct from a compliance item (Social Work)"
        type: "read-only rollup"
        data_shown: "Nothing — modeled here because its absence is the finding"
        gates_on: []
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5
          (content/accreditation/cswe.yaml, element_id "Accreditation Standard
          3.3, AS 3.3.5"), which requires documented processes for implementing
          "student SAFETY PROTOCOLS" as one of five named field-education
          activities.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Quoted from content/accreditation/cswe.yaml: "'Student safety
          protocols' as CSWE means it — safety in a field agency, incident
          escalation, lone-visit protocols — is not modeled as its own object.
          It is currently approximated by compliance items plus the Interventions
          log, and Interventions notably still has NO dedicated report." Worth
          separating from the CAEP complaint-register gap above even though both
          land on Interventions: CAEP needs an externally-originated record with
          a regulator in the loop; CSWE needs a forward-looking protocol
          definition (what the student is instructed to do in an unsafe agency
          situation) plus its escalation trail. Neither is a due-process case in
          the CODA 2-2 sense the modeled elements above describe, and stretching
          Interventions across all three is how a single record type ends up
          proving none of them.
    action: >
      Faculty/admin opens a case record when a student fails to meet
      published didactic/behavioral/clinical criteria, and tracks the
      remediation or due-process decision over time via Follow-Ups.
    confirmed_by: >
      content/prism/capability-map.yaml, "Communications vs. Interventions
      (structured advising/incident log)" feature note.

