        gates_on: ["Whether the student can share their profile externally with a prospective agency at all", "Whether field-education activities unlock for the student"]
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5
          (content/accreditation/cswe.yaml, element_id "Accreditation Standard
          3.3, AS 3.3.5"), which requires documented processes for "orienting
          students, placing students... implementing student SAFETY PROTOCOLS"
          and "how they are articulated to students and field personnel." An
          attestation that must clear before the student can approach an agency
          is the articulation half, enforced rather than asserted.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research — none of the reviewed teardowns in content/competitors/
          documents a checkbox-attestation item type at all, let alone one whose
          un-agreed state gates a different feature.
        gap_severity: "none"
        gap_note: >
          Structurally distinctive to Social Work and worth naming because it is
          the only place in this stage where an attestation gates something other
          than the compliance rollup itself. Per the SW playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
          Work (SW) Playbook.md line 82),
          attestations are "commonly required before a profile can be shared
          externally (e.g., consent to share profile with agencies) or before
          field-education activities unlock." That is a consequence of SW's
          student-initiated placement model — the student, not the school, is the
          one contacting agencies via the Multi-Location Field Application Form,
          so consent-to-share has to be captured before they can act. PT/OT, where
          the school drives Share Profile, have no equivalent dependency.
      - element: "Academic and clinical integrity attestation (SLP), profile-level and course-level"
        type: "read-only rollup"
        data_shown: "Program expectations for academic and clinical conduct, and the process used to address violations, put in front of the student for acknowledgment"
        gates_on: []
        accreditation_citation: >
          CAA Standard 3.0B, Standard 3.10B (content/accreditation/caa-asha.yaml,
          element_id "Standard 3.0B, Standard 3.10B" — "Students know program
          expectations for academic and clinical integrity"), whose required
          behavior is "a policy library students must actively acknowledge, with
          the acknowledgment retained as a timestamped, per-student record; plus
          a structured, retrievable log of conduct violations." caa-asha.yaml
          rates this "Configure" and names the two-tier attestation model
          explicitly — profile-level via Students > Set-up > Attestations,
          course-level via Courses > Course Offering > Attestation > Set-up —
          with the timestamped record retained in Profile > Academics (step 6).
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no reviewed teardown documents a checkbox-attestation item type as distinct from a document upload."
        gap_severity: "configure-needed"
        gap_note: >
          The mechanism is shipped and is a clean fit; what is configure-work is
          the pairing. 3.10B is a two-part standard — the acknowledgment AND "a
          structured, retrievable log of conduct violations and the process steps
          taken in response" — and per caa-asha.yaml's own gap_notes the second
          half lands on Interventions (step 11), which "has NO dedicated
          Interventions report... For a self-study exhibit proving 'policies are
          applied consistently,' a program needs a queryable intervention
          register, not a dashboard bucket." So an SLP program can prove
          distribution cleanly and cannot prove consistent enforcement cleanly.
      - element: "Clinical-education requirements disclosure attestation (PT/PTA): travel expectations to clinical sites, required health information, drug testing and criminal background check requirements, health and professional liability insurance requirements, and responsibility for the cost of emergency services during off-campus experiences"
        type: "read-only rollup"
        data_shown: "The enumerated CAPTE 5B disclosure set, distributed as acknowledged policy rather than as a handbook PDF"
        gates_on: []
        accreditation_citation: >
          CAPTE Standard 5, Element 5B (content/accreditation/capte.yaml,
          element_id "Standard 5, Element 5B" — "Information Provided to
          Prospective and Enrolled Students"). capte.yaml rates 5B "Gap" overall
          but splits it explicitly in its gap_notes: "the disclosure/attestation
          side is a Configure on Compliance Management today; the
          outcomes-publication side is a hard Gap." THIS element is the
          Configure half — capte.yaml's rationale names "Compliance Management's
          two-tier attestations (general profile level and course-specific, each
          retained with a timestamp in the student's Profile > Academics tab)"
          plus the PT playbook's convention of sharing Handbooks, Policies and
          Evaluation & Grading as cohort Resources.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no reviewed teardown documents an acknowledgment-tracked policy distribution mechanism."
        gap_severity: "configure-needed"
        gap_note: >
          Two things worth carrying to a PT/PTA conversation. (1) The PT and OT
          playbooks both record what programs ACTUALLY attest today, and it is
          narrower than 5B: "Profile verification and Profile update request are
          generally set up (with due dates), shared with all cohorts/students"
          (PT playbook, "Students" section; the OT playbook records the same two
          plus placement-detail acceptance). Nothing in either playbook records a
          5B-style clinical-education-requirements attestation being configured,
          so this is a real, specific configuration recommendation rather than a
          description of current practice. (2) capte.yaml flags a near-miss worth
          repeating: "travel expectations to clinical sites is an interesting
          near-miss — Placement Assist already computes distance-based scoring
          from school-to-location or student-address-to-location, so the data to
          substantiate a travel-expectations disclosure exists but is never
          surfaced as a published expectation."
      - element: "Profile-verification and profile-update attestations with due dates (PT/PTA, OT/OTA convention)"
        type: "read-only rollup"
        data_shown: "Student confirmation that their profile data is accurate and current, and acceptance of placement details once received and reviewed"
        gates_on: []
        accreditation_citation: >
          ACOTE Standard A.3.5 (content/accreditation/acote.yaml, element_id
          "Standard A.3.5" — "Student Advising by Faculty") — indirectly, and
          stated as indirect. A.3.5 requires documented advisement covering
          "conduct and responsibilities to enter the profession, student progress
          and academic standing, fieldwork education"; a dated, acknowledged
          profile/placement-acceptance record is a supporting artifact for the
          fieldwork-education strand rather than the standard's own required
          behavior, which acote.yaml frames as the Communications/Interventions
          record types (step 11). No ACOTE or CAPTE element requires a
          profile-accuracy attestation as such.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Shipped and in routine production use, and included because it is the
          documented BASELINE the expansion-domain attestation story should be
          scoped against: for PT and OT the attestation item type is already a
          normal part of a program's setup, with due dates, shared to all
          cohorts. Confirmed in
          PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical
          Therapy (PT) Playbook.md ("Attestations: Profile verification and
          Profile update request are generally set up (with due dates), shared
          with all cohorts/students") and
          .../Occupational Therapy (OT) Playbook.md ("Attestations: Can be added
          to verify profile accuracy and confirm acceptance/completion of
          placement details once received and reviewed"). Note the OT variant —
          acknowledging PLACEMENT DETAILS — is a distinct use of the item type
          that no other discipline's source records, and it makes the attestation
          part of the placement handshake rather than a policy formality. OT also
          ships an Attestation Report (OT playbook, "Student Reports") showing
          per-student completion of placement/program-expectation attestations,
          which is the reporting surface the general attestation model otherwise
          lacks.
