# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 3
# ("Student organization & onboarding").
#
# SCOPE NOTE: this is PRODUCT ONBOARDING, not clinical workflow. The subject is a
# brand-new program administrator on day one of owning a Prism tenant, standing up
# the student side of the system for the first time: the taxonomy students get
# filed under (cohorts, groups, enrollment/graduation terms, categories, campuses),
# the two ways students get into the tenant (single add, bulk import), the
# invitation/account-activation loop that actually turns a row in a grid into a
# logged-in user, and the student-profile + student-experience configuration that
# determines what the student sees when they arrive. Compliance-document setup,
# course setup, and placement setup are adjacent stages and are NOT modeled here
# except where this stage's elements gate them.
#
# PRIMARY SOURCE for nearly every element below is the general admin-tutorial
# transcript at /Users/romitsoley/Downloads/exxat_transcripts.md — specifically
# "2/16 Setting up Students in Exxat Prism" (lines 73-157) and "3/16 Managing
# Students Profiles in Exxat Prism" (lines 159-265). Where the shipped UI has moved
# past the video (notably "Student View" being superseded by "Student Experience
# Settings" with a Profile Fields sub-page), the help-center mirror is cited
# alongside the transcript and the divergence is called out in gap_note rather
# than smoothed over.
#
# SCHEMA v2: accreditation_citation / competitor_equivalent / gap_severity /
# gap_note live on each ELEMENT. Most elements in this stage are honestly
# accreditation-agnostic platform mechanics and are honestly undocumented by
# competitor teardowns — those verdicts are stated explicitly rather than padded
# with a forced comparison.

flow_name: "Student Roster Standup and First Invitation"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 3"
persona: >
  Program Administrator, new to the platform (primary — owns Students > Setup end
  to end and is the only role that can create cohorts, run bulk import, and send
  invitations). Secondary: Clinical Coordinator / DCE / Program Coordinator (see
  ../personas/role-clinical-coordinator.yaml — inherits the taxonomy this stage
  creates and lives in the resulting student grid daily); Faculty Advisor
  (secondary, read-mostly — appears in this stage only as an assignable value in
  the student profile's Associated Staff and Faculty section, per transcript
  3/16). The student is the downstream recipient, not an actor, until the
  invitation email lands.

steps:

  - screen: "Students > Setup > Student Organization > Cohort"
    navigation_path: "Dashboard or upper-left hamburger menu > Students > Setup tab (lands on Cohort by default) > Add Cohort"
    action: >
      The new admin creates the first cohort(s) — the root object of the entire
      student taxonomy — and adds any groups that subdivide students inside a
      cohort. Nothing else in this stage can proceed: cohort is a mandatory field
      on both the single-add drawer and the bulk-import template, and the
      bulk-import template will reject any cohort/group value that does not
      already exist here.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students in Exxat Prism"
      (lines 79-83): "click on the Students section from your dashboard or upper left-hand hamburger
      menu and select the Setup tab. You will automatically be taken to the cohort section... To add a
      new cohort, click on the Add Cohort button. You will then be able to enter the cohort's name and
      add groups to the cohort." Mirror: PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/
      Help for Program Administrators/Step-by-Step Guides (How-tos)/Students/Organizing Students.md
      ("Managing Cohorts").
    elements:
      - element: "Add Cohort button"
        type: "button (opens cohort drawer)"
        data_shown: "Opens a drawer with a cohort Name field and an inline group-builder; on Save the new cohort is appended to the cohort list."
        gates_on:
          - "Cohort is a mandatory field on Add Student and on the bulk-import template — no student can be created before at least one cohort exists."
          - "Course Offerings are tied to Cohort + Term + Academic Year, so cohort creation precedes course setup as well."
        accreditation_citation: >
          COCA Standard 11, Element 11.9 (partial — the annual/mid-cycle report is
          reported by entering class, so the cohort object is the unit COCA's
          report fields are keyed to, but this screen only names the unit; it does
          not produce the report); CODA Standard 1, Element 1-2 (partial — same
          relationship: institutional-effectiveness evidence is aggregated by
          class year, and cohort is that aggregation key).
        gap_severity: "none"
        gap_note: >
          The transcript explicitly supports BOTH program shapes on this one
          screen: "Lock-step programs typically name their cohorts by graduation
          year... For example, class of 2025. In contrast to this, non-lock-step
          programs may use cohorts to group students by other criteria, such as a
          specialization or enrollment term and year. For example, entry-level BSN
          or Spring 2024 Family Nurse Practitioner." That is a free-text name
          field doing the work of a program-structure model — flexible, and the
          reason cohort-naming convention is the single most consequential
          irreversible decision a new admin makes in this stage.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research. content/competitors/core-elms.yaml references "competency
          records per student cohort" and emedley.yaml references "cohort/individual
          compliance reports," but both describe cohort as a reporting filter on
          shipped output, not an admin-created setup object with its own creation
          screen — the comparison cannot be made element-for-element from their
          public docs.

      - element: "Group name text box + Add button (inside the cohort drawer)"
        type: "input field + inline list-builder"
        data_shown: "Free-text group names attached to the cohort being created; multiple groups per cohort."
        gates_on:
          - "A group value in the bulk-import template must already exist under its parent cohort or the import row errors."
        accreditation_citation: "None — this is a platform-mechanics element with no direct accreditor tie. Groups are an internal convenience taxonomy, not an evidence object."
        gap_severity: "configure-needed"
        gap_note: >
          Groups are flat strings scoped to one cohort. Per the transcript they
          exist "to categorize students within a cohort. For example, you could
          create groups for the students' enrollment term if there are multiple
          enrollment cycles for a cohort and if a group of students have
          additional compliance requirements." Real programs push more structure
          through this than it holds: the OT playbook records per-campus groups
          ("Los Angeles Campus / Brooklyn Campus"), the PT playbook records
          delivery-mode groups ("Hybrid, Residentials, Online"), and the SW
          playbook records academic-track groups ("Foundation Year, Advanced
          Standing, Clinical Practice, Macro Practice, Behavioral Health, School
          Social Work"). None of these carry a faculty owner, a capacity, or a
          separate compliance profile — a group is a label, so a dental-school
          clinic pod or a DO branch-campus track has no first-class home here.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research — no file in content/competitors/ describes a sub-cohort
          grouping construct at all.

      - element: "Cohort list (post-save)"
        type: "read-only list"
        data_shown: "All cohorts created for the program; the selection source for every cohort dropdown elsewhere in the tenant (announcements, resources, attestations, program requirements, additional profile details, course offerings)."
        gates_on:
          - "Announcements, Student Resources, Attestations, Program Requirements, and Additional Profile Details questions are all assigned per-cohort or to 'all cohorts' from this list."
        accreditation_citation: "None directly — this is the read-back of the element above; the accreditation relevance lives on cohort creation, not on the list rendering."
        gap_severity: "none"
        gap_note: >
          There is no visible cohort archive/inactivate state in the transcript —
          cohorts accumulate. For a program in year 6 of a 4-year curriculum this
          list is a growing dropdown, and the transcript documents no way to hide
          graduated classes from the selectors that consume it.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

  - screen: "Students > Setup > Student Organization > Enrollment Term / Graduation Term / Student Category / Campus"
    navigation_path: "Students > Setup > Student Organization > (Enrollment Term | Graduation Term | Student Category | Campus) > pencil icon"
    action: >
      The admin populates the four secondary student attributes. All four behave
      identically — a pencil icon opens an editable list, values are typed and
      Added one at a time, existing rows are editable in place, a trash-bin icon
      deletes, and Save commits. The transcript explicitly makes this step
      deferrable: "You can either set these attributes while importing your
      students or later after inviting them."
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students" (lines 83-89):
      "Click on the Enrollment Term option to provide student enrollment terms and dates. An
      enrollment term is the first term in which the student enrolled in your academic program...
      The graduation term is the last term in which the student is enrolled in your program...
      Student categories are an additional way to group students... The last option for student
      organization is their campus." Mirror: Exxat-Help-Guides/.../Students/Organizing Students.md
      ("Managing Enrollment & Graduation Calendar," "Managing Student Categories," "Managing Campus Details").
    elements:
      - element: "Enrollment Term field + optional Enrollment Date field"
        type: "input field pair (list-builder)"
        data_shown: "Term label (e.g. 'Spring 2025') with an optional date. Transcript: 'You must enter the enrollment term, but the enrollment date is optional.'"
        gates_on:
          - "Must exist before a bulk-import row can carry an Enrollment Calendar value (term + date)."
        accreditation_citation: >
          COCA Standard 11, Element 11.9 (partial — entering-class enrollment
          counts are a COCA annual-report field, and this is where the entering
          term is defined; the element does not itself produce a count). Otherwise
          accreditation-agnostic.
        gap_severity: "cosmetic"
        gap_note: >
          The date being optional means a program can end up with terms that sort
          alphabetically rather than chronologically ('Fall 2024' before 'Spring
          2024'). No validation is described in the transcript. For non-lockstep
          programs with several entry points a year — the Nursing and Social Work
          shapes — this is the field carrying the real program structure, and it
          carries it as unvalidated text.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Graduation Term field + optional Graduation Date field"
        type: "input field pair (list-builder)"
        data_shown: "Term label for the last term the student is enrolled. Transcript: 'This page functions similarly to the enrollment section.'"
        gates_on:
          - "Feeds the Academics tab's graduation term, which is what admins edit when a student decelerates."
        accreditation_citation: >
          COCA Standard 11, Element 11.5 (partial — the 4-year PGY-1 placement
          rate is computed against a graduating class, so graduation term is the
          denominator's key; Prism does not compute the rate, per
          ../accreditation/coca.yaml which rates 11.5 'Gap'); CODA Standard 1,
          Element 1-2 (partial — graduation/attrition rates by class are core
          institutional-effectiveness evidence).
        gap_severity: "configure-needed"
        gap_note: >
          Attrition and deceleration are the actual reason this field gets edited,
          and the PT playbook names the workaround directly: "mark students
          'decelerated' on the student profile (and move their cohort) to keep AAR
          headcounts accurate." There is no first-class deceleration/LOA status —
          it is a category or tag plus a manual graduation-term edit plus a cohort
          move, three separate actions with no linkage between them.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Student Category list (pencil icon > name > Add)"
        type: "input field (list-builder)"
        data_shown: "Category names used as an additional grouping axis. Transcript warns: 'student categories can be viewed by the student, so keep this in mind when creating student categories.'"
        gates_on:
          - "Student-visible. The transcript routes anything the student must not see to Tags instead: 'If you would like to manage students by a criterion they cannot view, you can use tags for this.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          The student-visible/internal split between Category and Tag is a real,
          deliberate design line and is documented clearly in the transcript. Worth
          noting because a new admin who files 'Probation' or 'Remediation' as a
          Category has published it to the student.
        competitor_equivalent: >
          Directionally comparable to content/competitors/leo-davinci.yaml's
          "FERPA-scoped advisor visibility (advisors see only their own advisees)"
          in that both vendors draw an explicit visibility boundary around student
          metadata — but Leo's boundary is role-based access to a whole record,
          not a student-visible-vs-internal split on a taxonomy field, so this is
          an analogy, not an element-for-element match.

      - element: "Campus list (pencil icon > name > Add)"
        type: "input field (list-builder)"
        data_shown: "Campus names for programs delivered at more than one location. Transcript: 'If your academic program has multiple campuses, this is a good way to group students based on the location they attend.'"
        gates_on:
          - "Assignable at single-add, in the bulk-import template, on the Academics tab, and via Bulk Update — the transcript's own example of Bulk Update is a campus change."
        accreditation_citation: >
          LCME Standard 8, Element 8.7 (Comparability of Education/Assessment —
          comparability across instructional sites/campuses is the standard's
          literal subject, and campus is the field that would have to carry the
          split for any comparability cut); COCA Standard 6, Element 6.11
          (Comparability Across Clinical Education Sites — same relationship,
          partial: this element stores the campus label, it does not produce the
          comparability statistics 6.11 asks for).
        gap_severity: "configure-needed"
        gap_note: >
          Campus is a flat student attribute, not a program-structure object. The
          OT playbook flags the consequence on the other side of the system:
          "If a school has multiple campuses, only the main campus address should
          be entered — Prism takes only 1 address to calculate distance on the
          map," while also noting a school "can enter different mission/vision
          statements per campus." So campus is modeled inconsistently across the
          product, and this stage's version of it is the thinnest one. For DO
          branch campuses and PA distant campuses (which ARC-PA requires be
          reported in advance, per the PA playbook's E-series notes) that thinness
          is a real limitation, not a cosmetic one.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research. content/competitors/medhub.yaml documents DO-specific
          positioning and LCME support, but nothing in its public docs describes a
          campus/site attribute on the learner record at this level.

  - screen: "Students > Add Student > +Add Single Student (drawer)"
    navigation_path: "Students tab > Add Student button > +Add Single Student"
    action: >
      The admin creates one student manually. This is the path used for a late
      admit, a transfer, or a one-off correction after the bulk import has already
      run; it is also the path a brand-new admin uses to create a single test
      student before trusting the import.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students" (lines 89-95):
      "To add individual students, navigate to the Students tab and click the Add Student button.
      A drawer will open for you to fill the information. You must enter the student's name, school
      email address, and cohort to save the information... If your school uses single sign-on
      accounts, you can also provide the student with an SSO key in this window... If you would like
      to automatically register the student in all of the course offerings of the selected cohort,
      check the corresponding box at the bottom of the page." Mirror: Exxat-Help-Guides/.../Students/
      Managing Student Access and Attributes.md ("Add Individual Students").
    elements:
      - element: "First name / Last name / School email address fields"
        type: "input fields (mandatory)"
        data_shown: "Student identity. The school email address is the invitation destination and, per the Exxat One transcript section, the key used to auto-match students when schedules are processed in from Exxat One ('student auto-matched by email similarity')."
        gates_on:
          - "Invitation delivery — the transcript's troubleshooting for a failed invitation is 'you may have entered an invalid email address.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: ""
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Cohort dropdown (with search box)"
        type: "searchable single-select (mandatory)"
        data_shown: "The cohorts created in step 1. Searchable because the list is unbounded and never archived."
        gates_on:
          - "Determines which announcements, resources, attestations, program requirements, and additional-profile-details questions the student receives."
          - "Determines which course offerings the auto-register checkbox will enroll the student into."
        accreditation_citation: "None at the point of assignment — the accreditation weight sits on the cohort object itself (see step 1)."
        gap_severity: "none"
        gap_note: >
          Choosing the wrong cohort here is not a simple edit later: it requires
          the separate Update Cohort workflow (step 7) with its documented list of
          impact areas. That asymmetry — one dropdown to set, a multi-screen
          migration to change — is worth flagging to a day-one admin.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Single Sign-On (SSO) Key field (+ icon; editable later via pencil)"
        type: "input field (conditional)"
        data_shown: "The institutional SSO identifier for this student. Transcript: 'if you assign an SSO key to a student, this student will be provided with an SSO login when you invite them.'"
        gates_on:
          - "Determines the account type the invitation creates — standard username/password vs. SSO. This is a per-student decision made at record-creation time, not a tenant-level setting."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "configure-needed"
        gap_note: >
          Account type is a per-row attribute rather than a program-level
          authentication policy. A tenant can therefore end up half SSO and half
          standard-password with no screen that reports the split, and a missing
          SSO key silently downgrades a student to a password account at
          invitation time rather than blocking the invite. The help-center mirror
          is explicit that the key must be present *before* the invite: "ensure
          the student's SSO Key is configured when adding the student individually
          or through the bulk import template."
        competitor_equivalent: >
          content/competitors/medhub.yaml is the one teardown with a directly
          comparable public claim: "128-bit STRONG Encryption SSL, Multifactor
          authentication, FERPA compliance, SOC 2 compliance" plus
          "SAML/Shibboleth SSO" — i.e. MedHub markets SSO as a federated
          institution-level protocol integration. core-elms.yaml, by contrast, is
          documented as describing "only generic SSO/LTI standards support... with
          no specific LMS/SIS integration partners named publicly." Prism's
          per-student SSO Key field is a third shape again (a stored per-learner
          identifier). The three are comparable at the capability level; none of
          the competitor docs are granular enough to compare field-for-field.

      - element: "'Register student in all course offerings of the selected cohort' checkbox"
        type: "toggle (checked by default)"
        data_shown: "Auto-enrolls the new student into every course offering already attached to the chosen cohort."
        gates_on:
          - "Course registration, which in turn gates whether the student sees course-level learning activities, forms, and placements."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          The transcript names the exact scenario this exists for: "This could be
          useful for when a cohort is already in progress and a new student joins
          the cohort." The help-center mirror confirms the default is ON and must
          be actively unchecked. Reasonable default; worth knowing it is a default,
          because unchecking it is the fix for a student who is joining a cohort
          but not taking its in-flight courses.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

  - screen: "Students > Setup > Student Management > Bulk Import (3-step drawer)"
    navigation_path: "Students > Add Student > Add Students in Bulk — OR — Students > Setup > Student Management > Bulk Import > + icon"
    action: >
      The admin loads the whole incoming class at once. This is the load-bearing
      day-one action of the entire stage: download template, fill offline,
      re-upload, resolve validation, confirm with a typed number, watch the import
      instance complete.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students" (lines 95-103):
      "click on the Setup tab, click on the Student Management dropdown in the left-hand menu, and
      select the Bulk Import option... Click on the download template icon to download the import
      template... Any columns containing an asterisk will need this information to add the students.
      Make sure you do not make any changes to the columns of this template. Also, to enter a cohort,
      group, enrollment, graduation, student category, and campus, you must first set up these
      categories in the system under the Student Organization section... The system will then display
      any relevant issues with your Excel file. Important issues are called errors and require making
      changes to the uploaded template to import these students. Less important issues are called
      warnings." Mirror (Excel-formatting gotchas not in the video):
      Exxat-Help-Guides/.../Students/Managing Student Access and Attributes.md ("Add Students in Bulk").
    elements:
      - element: "Download template icon"
        type: "button (file download)"
        data_shown: "An .xlsx template whose columns are fixed; asterisked columns are required. Per the help-center mirror the required set is first name, last name, email address, cohort, and SSO key if applicable."
        gates_on:
          - "Column structure is immutable — transcript: 'Make sure you do not make any changes to the columns of this template.'"
          - "Per the help-center's Student Experience Settings page, the template is DYNAMIC with respect to required fields: 'if a field is marked as required, it becomes mandatory in the import template, and any missing values will trigger validation errors. For example, if Date of Birth (DOB) is required, the system will display an error such as \"DOB should not be empty\".'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "configure-needed"
        gap_note: >
          The template couples to the Profile Fields configuration (step 9), which
          a new admin has almost certainly not visited yet at the moment they
          download this template. Sequencing hazard: configure Profile Fields
          BEFORE downloading the import template, or re-download after.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this
          research. The nearest documented competitor behaviour is a different
          shape entirely: content/competitors/medhub.yaml claims MedHub
          "integrates AAMC ERAS resident demographic data" — i.e. roster ingest
          from an ecosystem source rather than an admin-authored spreadsheet. That
          is a genuine architectural contrast worth carrying into positioning, but
          it is not an equivalent to this button.

      - element: "Prerequisite-value validation (cohort, group, enrollment calendar, graduation calendar, student category, campus)"
        type: "server-side validation on upload"
        data_shown: "Errors on any row whose cohort/group/term/category/campus value does not already exist in Student Organization."
        gates_on:
          - "Hard dependency on step 1 and step 2 being complete first. Help-center mirror: 'Some fields require information to exist in the system before you can associate it with any students. If you provide details for an item that does not exist in your database, the system will not be able to process it.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          This is the single most common day-one failure mode in the stage and it
          is a *correct* design (referential integrity over silent value creation)
          — but it means the taxonomy decisions in steps 1-2 must be final before
          the import runs, which is exactly backwards from how a new admin
          naturally works (import first, organize later).
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Error / warning grid with red-cell and yellow-cell alert icons, counts, and a filter icon"
        type: "validation review grid"
        data_shown: "Per-cell error (red, blocking) and warning (yellow, non-blocking) markers with hover text; error/warning counts in the top-left; a filter to show only rows with errors or warnings."
        gates_on:
          - "Errors block the import. Warnings do not — transcript: 'You can still import the list of students if there are warnings detected. However, we advise resolving any warning messages before you import the students.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "cosmetic"
        gap_note: >
          There is no in-grid editing: the documented remedy is to fix the source
          .xlsx and re-upload ("If you need to make changes, click Previous and
          re-upload the import template once done making edits"). For a 200-row MD
          or PharmD class with scattered errors this is a multi-round-trip loop.
          The help-center also documents two Excel-side data-integrity traps the
          video does not mention: leading zeros stripped from Student ID unless
          the column is formatted as Text, and date fields (DOB, enrollment date,
          graduation date) corrupted unless formatted as Text in MM/DD/YYYY.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Type-the-number import confirmation"
        type: "confirmation gate"
        data_shown: "A displayed number the admin must re-type to commit the import."
        gates_on:
          - "Commit of the whole batch."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          The same friction pattern appears on Bulk Update (per the OT playbook's
          Capstone workflow: 'a confirmation step requiring the admin to re-type a
          displayed number before it commits') — a consistent product convention
          for irreversible bulk writes, which is a point in Prism's favour for a
          day-one admin.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Bulk Import Instances table (Title, Initiated By, Initiated On, Status, source file download, refresh icon)"
        type: "read-only audit table"
        data_shown: "Every prior import: name, the administrator who ran it, timestamp, status (In Progress / complete), and the exact Excel file used, re-downloadable. Sortable by Title and Initiated On."
        gates_on: []
        accreditation_citation: >
          None directly. Worth noting for a compliance-minded reader that this is
          a genuine who-did-what-when audit trail over roster changes, which is the
          kind of artifact FERPA-adjacent institutional audits ask for — but no
          named element in ../accreditation/ (COCA, CODA, ACPE, LCME) requires it,
          so citing one would be a fabrication.
        gap_severity: "none"
        gap_note: >
          Retaining the source file for re-download is stronger than a bare status
          log and is the recovery path when an import produces surprises.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

  - screen: "Students > Setup > Student Management > Invite Students"
    navigation_path: "Students > Setup > Student Management dropdown > Invite Students"
    action: >
      The admin selects students and sends the account-activation invitation —
      the step that converts roster rows into logged-in users. This is a 3-step
      drawer: recipients, email template, send-now-or-schedule.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students" (lines 103-111):
      "Click on the Setup tab, then click on the Student Management dropdown, and select Invite
      Students... Please note that if you have assigned a valid SSO key to a student you have
      selected, this student will be provided with an SSO login account when you invite them...
      You can select our pre-made standard template or any other template you have created... Be sure
      to use the merge fields displayed in the upper right-hand corner of the page... Please note you
      will need to include the invitation link merge field when you send an invitation to a student,
      otherwise, the student would not be able to set up their account... You can then choose to send
      the invitation now or schedule it to be sent later." Mirror (override-recipient / reply-to /
