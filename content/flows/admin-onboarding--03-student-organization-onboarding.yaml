  - screen: "Students tab — the main student grid"
    navigation_path: "Dashboard or hamburger menu > Students (Students tab)"
    action: >
      The admin works the roster: finds students, reshapes the grid to the columns
      their program actually cares about, exports, applies attribute changes across
      many students at once, and removes bad rows.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students" (lines 111-121):
      "The table will display the student's name, student ID, school email address, status, cohort,
      et cetera. If you would like to edit the columns of the table, click on the wrench icon...
      The column setup is sticky... To reset the columns to their default settings, click on the
      column icon, then select the Reset All hyperlink... Please note that these filters are sticky
      as well... However, unlike the column setup, when you log out and log back in, these filters
      will reset to default... To bulk update student attributes, select multiple students and click
      the Bulk Update button... Please note that if a student has learning activity data saved or
      submitted in their courses, the system will not let you delete them."
    elements:
      - element: "Column wrench (reorder via arrows or drag handle, remove, Add a Column, Reset All)"
        type: "grid configuration control"
        data_shown: "The visible column set for the student grid."
        gates_on:
          - "Column setup is sticky ACROSS SESSIONS — it survives logout. This is per-user persistence, not a program-level default."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "cosmetic"
        gap_note: >
          Sticky-per-user with no shareable/program-default saved view means every
          new coordinator rebuilds the same grid layout by hand, and two admins
          looking at 'the student list' may be looking at different columns —
          a small but real onboarding tax for a multi-admin program.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Filter icon (multi-category faceted filter, Show More, per-facet X, Apply)"
        type: "report filter"
        data_shown: "Facets across student attributes including Tags (the transcript's worked example filters the grid by the 'married' tag)."
        gates_on:
          - "Filters are sticky within a session but RESET on logout — deliberately different persistence from columns."
          - "Filters applied here also scope the left-hand student picker inside an individual student's profile, and must be cleared via a 'clear all' hyperlink there."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "cosmetic"
        gap_note: >
          The filter-persists-into-the-profile-navigator behaviour is genuinely
          surprising on day one — an admin who filtered to one cohort and then
          opened a student will find most of the program missing from the side
          navigator until they notice the clear-all link.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Export icon (Excel download of the student list)"
        type: "button (export)"
        data_shown: "The current student list as .xlsx, honouring the configured columns and applied filters."
        gates_on: []
        accreditation_citation: >
          None directly at this element. Note for context: the discipline
          playbooks route accreditation headcount/demographic asks to a different,
          purpose-built report — the PT and OT playbooks both name
          Students > Reports > "Race, Gender, Age & Ethnicity," filtered by cohort,
          as the CAPTE/ACOTE annual-report source, not this generic export.
        gap_severity: "none"
        gap_note: ""
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Bulk Update button (select students > choose attribute > choose value > Update > confirm)"
        type: "bulk-write action"
        data_shown: "One attribute at a time applied to the whole selection. Transcript's example: moving multiple students from one campus to another."
        gates_on:
          - "Requires a multi-row selection; commits behind a confirmation step."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "configure-needed"
        gap_note: >
          One attribute per pass. The OT playbook documents the real-world usage
          precisely — "filter students by Cohort, select them, and use Bulk Update
          to set Student Category = Capstone in one pass (with a confirmation step
          requiring the admin to re-type a displayed number before it commits)."
          Critically, Cohort is NOT one of the bulk-updatable attributes: cohort
          changes go through the separate per-student Update Cohort workflow
          (step 7), so a program moving a group of decelerated students must do it
          one at a time.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Delete Student (from the student profile, upper right) + reason field + Proceed confirmation"
        type: "destructive action with impact preview"
        data_shown: "A drawer enumerating the data that would be lost, a mandatory free-text reason, and a two-step confirmation."
        gates_on:
          - "HARD BLOCK: 'if a student has learning activity data saved or submitted in their courses, the system will not let you delete them.' Removal in that case requires prism-support@exxat.com."
        accreditation_citation: >
          None as an accreditor requirement, but the block is the correct behaviour
          for evidence integrity: deleting a student who has submitted patient
          logs, timesheets, or evaluations would destroy the very records that
          LCME Standard 8, Element 8.6 (monitoring completion of required clinical
          experiences) and CODA Standard 2, Element 2-5 rely on. Cited as
          rationale, not as a standard this element satisfies.
        gap_severity: "none"
        gap_note: >
          Showing the impact preview before the destructive act, requiring a
          written reason, and hard-blocking on submitted learning-activity data is
          the strongest safety design in this stage.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

  - screen: "Student profile > Academics tab (+ student banner and tags)"
    navigation_path: "Students > click a student name > Overview tab > Academics tab"
    action: >
      The admin maintains one student's institutional record: internal tags, the
      academic attribute set, internal vs. student-shared notes, faculty advisor
      assignment, program-requirement status, and — when a student decelerates or
      switches track — the cohort migration.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "3/16 Managing Students Profiles" (lines 165-191):
      "Think about tags as E post-it notes on individual students. Tags are useful because they're only
      for internal use and therefore the student cannot view these. For example, tags like new parent or
      needs public transport allow you to consider the needed accommodations while making placements...
      Click on the pencil icon in the academic section to make changes to their status. Academic standing,
      enrollment term, graduation term, group, campus and student category... students will be able to
      view notes added to the notes shared with students section... Notes added to the internal use only
      section cannot be viewed by students... To change the student's cohort, click on the update cohort
      button. A description of the impact areas of moving a student from one cohort to another will be
      displayed... Please note that the role selected is for information purposes only. The role of the
      faculty member does not affect their permitted access in the system."
      Tag cap confirmed in Exxat-Help-Guides/.../Students/Organizing Students.md ("Managing Students Tags").
    elements:
      - element: "Add Tag (name + colour; edit via pencil; filterable from the student grid)"
        type: "internal label (multi-select, colour-coded)"
        data_shown: "Program-defined internal labels attached to a student. Explicitly not student-visible."
        gates_on:
          - "Capped at 10 tags per student (help-center mirror: 'You can only have a maximum of 10 tags for a student')."
          - "Feeds the Tags facet on the student-grid filter."
        accreditation_citation: >
          None as a requirement. Contextually relevant to placement equity/
          accommodation decisions — the transcript's own examples are 'new parent'
          and 'needs public transport,' i.e. placement-constraint data — but no
          COCA/CODA/ACPE/LCME element in ../accreditation/ names anything this
          element satisfies.
        gap_severity: "configure-needed"
        gap_note: >
          Tags are the de facto home for accommodation, hardship, and
          risk-flag data — sensitive information stored as a free-text colour
          label with no defined access scope beyond 'not student-visible,' no
          expiry, and a hard cap of 10. A program that needs both accommodation
          flags and cohort-management flags will run out. There is a stronger
          adjacent primitive in the product (the capability map records
          "Sensitive records (e.g. advisement/intervention notes) restricted to
          assigned faculty/advisors only") but it is not documented as applying to
          tags.
        competitor_equivalent: >
          content/competitors/leo-davinci.yaml documents "FERPA-scoped advisor
          visibility (advisors see only their own advisees)" — the same underlying
          concern (who can see sensitive learner metadata) solved at the
          role-permission layer rather than with an internal-vs-visible field
          split. A real design contrast, but Leo's public docs are not granular
          enough for a field-for-field comparison.

      - element: "Academic section pencil (Status, Academic Standing, Enrollment Term, Graduation Term, Group, Campus, Student Category)"
        type: "input field set (edit drawer)"
        data_shown: "The per-student values drawn from the Student Organization lists built in steps 1-2."
        gates_on:
          - "Values are constrained to what exists in Student Organization — the same referential integrity as the bulk-import validation."
        accreditation_citation: >
          COCA Standard 11, Element 11.9 and CODA Standard 1, Element 1-2 (both
          partial — enrollment/graduation/standing by class are the raw inputs to
          the annual and institutional-effectiveness reporting those elements
          require; this screen stores them per student, it does not aggregate or
          submit them).
        gap_severity: "none"
        gap_note: >
          The OT playbook confirms this is where day-to-day maintenance happens:
          "Academics Profile: Displays enrolled term, graduation term, status,
          campus, and student requirements. Lets admins update cohort info, check
          attestation requirements, and associate faculty/staff with specific
          students."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Notes — 'Shared with students' vs. 'Internal use only' (+ icon, text area, document attachment)"
        type: "dual-visibility note log with attachments"
        data_shown: "Two separate note streams on one student, each with attachments; the visibility boundary is the section, not a per-note toggle."
        gates_on:
          - "Anything typed into 'Shared with students' is published to the student — transcript: 'make sure you do not include any information you would like to hide from students.'"
        accreditation_citation: >
          CODA Standard 2, Element 2-2 (partial — 'documentation that when a
          student fails to meet published didactic, behavioral, and/or clinical
          criteria, an individual evaluation was performed leading to a decision
          made in accordance with institutional due-process policy'). Internal
          notes are where the transcript says behavioural concerns go ('track
          student behavioral issues or suspected plagiarism'), but a free-text
          note log is not the timestamped decision trail 2-2 asks for — see the
          Interventions tab element below, which is closer.
        gap_severity: "configure-needed"
        gap_note: >
          Two note streams with a section-level visibility boundary is easy to
          get wrong under time pressure, and the OT playbook shows both being used
          on the same student ("a positive-feedback note shared with the student
          vs. an internal note about needing more challenging placements").
          Deleting a note is also non-obvious: pencil icon, then vertical
          ellipsis, then Delete.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Update Cohort button (impact-areas disclosure > current-vs-new cohort > confirm > async migration)"
        type: "guarded migration workflow"
        data_shown: >
          A pre-migration disclosure of exactly what changes: announcements,
          resources, attestations, program requirements, and additional profile
          details assigned per-cohort are lost/gained; items assigned to 'all
          cohorts' are unaffected; course registrations are NOT affected;
          compliance documents are carried over for requirements configured
          identically in both cohorts; placement and learning-activity data are
          unaffected; subscriptions should be unaffected (with a support escalation
          if they are not). Runs asynchronously.
        gates_on:
          - "The only supported way to change a student's cohort — Cohort is not available in Bulk Update."
        accreditation_citation: >
          None as a standard, but this is the mechanism behind a documented
          accreditation-reporting practice: the PT playbook instructs programs to
          "mark students 'decelerated' on the student profile (and move their
          cohort) to keep AAR headcounts accurate" for CAPTE annual reporting —
          i.e. cohort integrity is what makes class-level accreditation counts
          correct.
        gap_severity: "configure-needed"
        gap_note: >
          Best-in-stage transparency (the impact disclosure is unusually explicit
          and honest, including the hedge that subscriptions "should be"
          unaffected) wrapped around a one-student-at-a-time workflow. The PT and
          OT playbooks both record that "cohort movement is common when students
          withdraw and later return, go on leave, fail experiences," so this is a
          routine action, not an edge case — and there is no bulk path for it, no
          undo described, and no dry-run.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Associated Staff and Faculty (faculty/staff dropdown + multi-select Role + notes icon)"
        type: "assignment control"
        data_shown: "Faculty advisors assigned to this student, each with one or more informational roles."
        gates_on:
          - "Assignment grants advisor visibility into the student's Academics, coursework, placements, and learning activities (view-only)."
          - "It does NOT grant compliance review — transcript: 'Student advisors do not have access to review student compliance, but they can be given the ability to view compliance status if you provide them with this ability' (configured in Faculty setup, not here)."
          - "It does NOT grant learning-activity review — 'student advisors cannot review learning activities, but they can view them.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie. (Advising-quality standards exist in most accreditors' student-services sections but no such element is loaded in ../accreditation/, so citing one would be re-deriving rather than tracing.)"
        gap_severity: "gap"
        gap_note: >
          The Role dropdown is decorative: "the role selected is for information
          purposes only. The role of the faculty member does not affect their
          permitted access in the system." Real permissions live in a different
          module (Faculty setup), so a day-one admin who assigns 'Clinical
          Advisor' here reasonably but wrongly believes they have granted
          something. This is the clearest instance in the stage of a control that
          looks like access management and is not.
        competitor_equivalent: >
          content/competitors/leo-davinci.yaml is the only teardown documenting a
          comparable construct — "FERPA-scoped advisor visibility (advisors see
          only their own advisees)" — and it is documented as an actual access
          scope, which is precisely what Prism's Role field here is not. This is a
          rare case where a competitor's public doc is specific enough to support
          a genuine, unfavourable comparison at element granularity.

      - element: "Program Requirements section (Pending / Placed / Completed)"
        type: "read-only rollup with manual override"
        data_shown: "Graduation requirements assigned to this student by cohort, bucketed: Pending (not yet met), Placed (will be met by a current placement), Completed."
        gates_on:
          - "Requirements can be satisfied automatically by placement completion when a requirement is attached to the placement, or marked complete manually from the student profile."
        accreditation_citation: >
          LCME Standard 8, Element 8.6 (Monitoring of Completion of Required
          Clinical Experiences — 'a centrally-overseen system that monitors and
          ensures every medical student completes all required clinical
          experiences... and that remedies any identified gaps before graduation';
          ../accreditation/lcme.yaml rates this the strongest Prism fit of any
          LCME element). ACPE Standard 3, Key Elements 3.1.b and 3.2.b/3.2.d
          (partial — required practice settings and minimum clock hours are
          exactly the kind of per-student requirement this section tracks, though
          hour minimums live in the timesheet layer, not here).
        gap_severity: "none"
        gap_note: >
          The PT playbook confirms the accreditation-facing usage directly: "For
          each setting, schools may set up a requirement to track completion —
          e.g. Rural, Underserved, School-based, Integrated Clinical
          Experience-Acute." The three-state model (including 'Placed' as a
          distinct forward-looking state) is more useful than a binary
          met/not-met.
        competitor_equivalent: >
          Directionally comparable to content/competitors/new-innovations.yaml's
          Procedure Logger with ACGME case-log import and
          content/competitors/medhub.yaml's "session-level exposure reporting for
          accreditation documentation," both of which track required-experience
          completion — but neither vendor's public docs describe a per-student
          Pending/Placed/Completed requirement ledger, so the comparison holds at
          capability level only.

  - screen: "Student profile > Profile tab, Share Profile menu, View As, and Email History"
    navigation_path: "Students > student name > Profile tab; Share Profile dropdown (top right); View As button; vertical ellipsis > Email History"
    action: >
      The admin verifies what the student actually filled in, checks the account
      from the student's own seat before the class arrives, packages the profile
      for site personnel, and audits what the system has emailed this student.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "3/16 Managing Students Profiles" (lines 191-219):
      "Most of the time students are supposed to fill out all the information in the student profile
      tab. You do have the ability to add and edit information on behalf of the student, but we advise
      you have you students fill it out initially. This section of the student profile is important
      because there is information on this page that sites will use in determining whether to accept
      them for a clinical placement... When sharing a student's profile, the link you send will
      automatically contain their full name, preferred pronouns, school, email address, areas of
      professional interest, resume, educational history, work experience, skills and accomplishments,
      and the summary section... To view what a specific student's [Exxat] login looks like, click on
      the view as button... you will not be able to make changes, add or delete information on behalf
      of the student when you are in view as mode."
    elements:
      - element: "Profile tab section set (Demographic, Personal Contact, Emergency Contact, Additional Profile Details, Summary, Areas of Professional Interest, Resume, Education, Work Experience, Membership, Licensure, Skills & Accomplishments)"
        type: "student-authored input field set (admin-editable on behalf)"
        data_shown: "The student's own record. Each section has +/pencil/ellipsis-delete affordances for admins acting on behalf."
        gates_on:
          - "Site acceptance decisions — 'there is information on this page that sites will use in determining whether to accept them for a clinical placement.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie. (The Licensure section is the closest to accreditation-relevant, but student licensure is not a named element in any of the four loaded accreditor files; preceptor licensure is, and that lives in a different journey.)"
        gap_severity: "none"
        gap_note: >
          The product's stated posture is student-authored-first with admin
          override — correct for data quality, and the reason the attestation
          pattern below exists (PT and OT playbooks both record 'Profile
          verification' and 'Profile update request' attestations set up with due
          dates, shared with all cohorts, purely to force students to keep this
          tab current).
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Share Profile > Share Profile (recipient/CC, inclusion checkboxes, notes, attachments, Preview, Send)"
        type: "outbound share workflow"
        data_shown: >
          An always-included core (full name, preferred pronouns, school email,
          areas of professional interest, resume, education, work experience,
          skills & accomplishments, summary) plus opt-in blocks: contact
          information (personal / address / emergency, individually selectable),
          completed program requirements, completed placements (selectable
          individually, showing course, location, experiential supervisor, dates,
          setting), and compliance documents (selectable individually).
        gates_on:
          - "Optional blocks render only if populated — 'the data will only be displayed if there is information populated in these fields.'"
          - "Optional one-time-password protection on shared compliance information is NOT self-serve: it must be enabled by Exxat support (prism-support@exxat.com), after which the site contact must enter an OTP sent to the same address the link was mailed to (including CC/BCC recipients)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie. The privacy posture is FERPA-adjacent but no loaded accreditor element governs student-profile disclosure to sites."
        gap_severity: "configure-needed"
        gap_note: >
          Granular per-block consent design is strong, but the protection that
          actually matters — OTP-gating the compliance/health data — is off by
          default and requires a support ticket to enable. A brand-new admin
          sharing a profile on day one is, by default, emailing an unauthenticated
          link to student health documents. That default is the single most
          defensible criticism in this stage.
        competitor_equivalent: >
          No competitor teardown in this research documents a no-login,
          site-facing student profile share at this granularity. The nearest
          documented posture is content/competitors/medhub.yaml's platform-level
          security claims (FERPA compliance, SOC 2, multifactor authentication) —
          which describe authentication for platform users, not a link-based
          share to a non-user, so the two are not comparable element-for-element.
          Prism's own capability map records the related
          @StudentProfileWithComplianceAndLocationRequirementsLink merge field as
          giving "site personnel a no-login link to a student's compliance +
          location requirements," confirming this is an intentional product
          pattern rather than an oversight.

      - element: "Share Profile > Generate Profile URL / Download Profile (PDF)"
        type: "link generator / export"
        data_shown: "Same inclusion checkboxes as the email share; produces either a copyable URL for out-of-band sharing or a PDF."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "configure-needed"
        gap_note: >
          A generated URL leaves the system's tracking entirely: Profile Share
          History (below) records emailed shares, and the transcript describes no
          expiry, revocation, or access log for a manually generated URL. It is
          the same payload as the emailed share with less accountability.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Profile Share History (recipient name, email, status with hover explanation, timestamp)"
        type: "read-only audit table"
        data_shown: "Every emailed profile share for this student."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie, though it is the disclosure log an institutional FERPA audit would ask for."
        gap_severity: "none"
        gap_note: "Covers emailed shares only; see the Generate Profile URL gap above."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "View As button (+ 'switch back' hyperlink)"
        type: "impersonation (read-only)"
        data_shown: "The full student dashboard as that student sees it. Explicitly read-only: 'you will not be able to make changes, add or delete information on behalf of the student when you are in view as mode.'"
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          The single most valuable verification tool in this stage for a brand-new
          admin — the transcript frames it exactly that way ("At some point you
          might want to verify if you've completely set up the student account as
          intended"). Every step-9 configuration (announcements, resources,
          attestations, visibility toggles) is only checkable from here. It should
          be the last action of this stage, and read-only impersonation is the
          right safety choice.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes a read-only view-as-learner mode."

      - element: "Email History drawer (Sent / Scheduled tabs; category, subject, status, timestamp; date-range filter)"
        type: "read-only audit table"
        data_shown: "Every system email to this student, including scheduled-but-unsent items; click the subject to read the message body."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "cosmetic"
        gap_note: >
          This is the self-serve answer to 'did the invitation actually reach
          them?' and it is per-student only — there is no program-wide email
          delivery log described anywhere in the two tutorials, so diagnosing a
          class-wide delivery problem means opening students one at a time.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

  - screen: "Student profile > Communications tab and Interventions tab"
    navigation_path: "Students > student name > Communications tab | Interventions tab > + icon"
    action: >
      The admin sets up (and begins using) the two parallel logs that record
      everything notable said to or done for a student. Configured in this stage
      because the distinction between them is a program policy decision a new
      admin must make before either log has any analytic value.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "3/16 Managing Students Profiles" (lines 229-245):
      "Communications are typically notable conversations with the student, which are neutral.
      Interventions are notable conversations with students to help them overcome various academic,
      personal, and professional challenges. In terms of functionality, both the communication and
      intervention sections function similarly, but this distinction allows you to keep track of these
      two different types of interactions with students. By keeping intervention separate, it makes it
      significantly easier for your school's academic review committee to keep track of struggling
      students... After completing your documentation, you can enable this toggle to publish the
      intervention to the student. This toggle is turned off by default and must be enabled for the
      student to view the intervention and its follow up."
      Mirror: Exxat-Help-Guides/.../Students/Adding Interventions and Communications.md.
    elements:
      - element: "Communication entry card (mode, initiator, subject, description, date, attachment, follow-up plan/actual date + description)"
        type: "log entry with follow-up scheduling"
        data_shown: "One card per logged communication, visible to all admins and faculty, never to students. Overdue planned follow-ups render in red."
        gates_on: []
        accreditation_citation: "None — this log is the neutral half of the pair by design; the accreditation weight sits on Interventions below."
        gap_severity: "none"
        gap_note: >
          The neutral/concerning split is a policy decision disguised as two tabs.
          A new admin who logs everything as a Communication has quietly emptied
          the object their academic review committee is supposed to read.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Intervention entry (method, initiator, related course/rotation/site, subject, description, date, Open/Closed status, attachment, multiple follow-ups)"
        type: "case record with open/closed lifecycle"
        data_shown: "Open and Closed sections; per-intervention follow-up counts (total, completed, next planned date, overdue in red); attachable remediation or academic-improvement plans; linkage to the specific course/rotation/site where the issue arose."
        gates_on:
          - "Status (Open/Closed) is the lifecycle state an academic review committee reads."
        accreditation_citation: >
          CODA Standard 2, Element 2-2 (Individual evaluation and due process for
          students not meeting criteria) — this is the closest shipped object in
          Prism to what 2-2 requires: 'a workflow that flags a student falling
          below a defined didactic/clinical threshold, opens a case record, and
          tracks the remediation/due-process decision trail with timestamps and
          outcomes.' ../accreditation/coda.yaml rates 2-2 'Configure' and notes 'a
          formal due-process case-management trail distinct from a compliance
          checklist item is not confirmed in the capability map' — this element is
          the strongest candidate to satisfy it, and it is manually initiated, not
          threshold-triggered.
        gap_severity: "configure-needed"
        gap_note: >
          Has the case-record shape (open/closed, dated follow-ups, attached
          remediation plan, course/site linkage) but not the trigger: nothing
          automatically opens an intervention when a student falls below a
          competency threshold or fails a rotation. It is an excellent manual
          ledger awaiting an automated flag.
        competitor_equivalent: >
          content/feature-map/dentistry.yaml states directly, for the Compliance
          Management pillar under CODA, that "the individual-evaluation/due-process
          trail (2-2) and a faculty-facing evaluation workflow (3-4) are white
          space — nobody, including Prism, ships either today," and names "a
          student due-process case log" as "unclaimed by any vendor in the set."
          That prior finding should be revised on the strength of this transcript:
          Prism does ship a manual due-process case log here. No competitor
          teardown documents an equivalent.

      - element: "'Publish to student' toggle on an intervention (default OFF)"
        type: "visibility toggle"
        data_shown: "Whether the student can see the intervention and its follow-ups."
        gates_on:
          - "Off by default — 'must be enabled for the student to view the intervention and its follow up.'"
        accreditation_citation: >
          CODA Standard 2, Element 2-2 (partial — due process implies the student
          is informed of the evaluation and decision; this toggle is the mechanism
          for informing them, and its OFF default means informing the student is
          an affirmative act, not automatic).
        gap_severity: "none"
        gap_note: >
          Default-off is the right default for draft documentation, but it means
          nothing in the product ensures a student was ever notified of an
          intervention affecting their progression. That is a policy gap the
          program must close outside the software.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

  - screen: "Students > Setup > student-experience configuration (Announcements, Student Resources, Attestations, Program Requirements, Areas of Professional Interest, Additional Profile Details, Student Experience Settings)"
    navigation_path: "Students > Setup tab > left-menu sections below Student Organization / Student Management"
    action: >
      The admin configures everything the student will encounter on first login.
      This is the half of the stage that is invisible until the invitation is
      accepted, and the reason View As (step 8) is the correct final verification.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "2/16 Setting up Students" (lines 123-155):
      "This includes communicating with students via announcements, providing resources to cohorts of
      students, collecting signatures for attestations, assigning program requirements to students,
      setting up areas of professional interest for students to indicate their preference for,
      collecting additional information from your students via the additional profile details section,
      customizing the view ability of placement information, and allowing students to change their
      profile picture... You will not be able to change the title or content of an attestation if
      students have already agreed to the statement... In the Student View section, you can enable and
      disable bits to show or hide various placement details from student view."
      The shipped UI has since superseded "Student View" with "Student Experience Settings"
      (Actions & Permissions + Profile Fields) — confirmed in
      Exxat-Help-Guides/.../Students/Key Features of Student Management and Administration.md
      ("Managing Student Experience Settings").
    elements:
      - element: "Announcements (Add Announcement: start/end datetime, title, description, attachment, cohort targeting, 'notify students via email when the announcement goes live')"
        type: "scheduled broadcast with cohort targeting"
        data_shown: "Upcoming / current / former announcements on the student dashboard, windowed by start and end time."
        gates_on:
          - "The email-on-go-live checkbox appears only when the start date is in the future."
          - "Cohort targeting defaults to all cohorts (checkbox pre-checked)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          Both the PT and OT playbooks record the same real-world usage —
          announcements "typically shared with all cohorts (e.g. welcome messages,
          new-class announcements, meeting sign-up reminders)" (PT) and "set up
          for student compliance completion and profile completion... flu-shot
          documentation reminders" (OT) — i.e. the cohort targeting exists but is
          rarely used, which suggests the all-cohorts default is well chosen.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Student Resources (category manager via pencil; Add Resource: type = document | link | video | FAQ, category, name, description, upload/URL/Q&A, 'Show to Student' toggle, cohort targeting, Reorder)"
        type: "content library with staged publication"
        data_shown: "Categorised resources filterable by type and by cohort, including a 'Shared with All Cohorts' view; drag-to-reorder."
        gates_on:
          - "'Show to Student' gates visibility — resources can be staged before release."
        accreditation_citation: >
          CODA Standard 2, Element 2-1 (partial — 'written information provided to
          students in advance of each course covering goals/requirements, content,
          method(s) of evaluation, and how grades and competency are determined').
          The PT playbook records exactly this content living here: "Handbooks,
          Policies, Evaluation & Grading are usually shared with students." Note
          ../accreditation/coda.yaml routes 2-1 to the Curriculum Mapping pillar
          for syllabus-level publication; this element covers the program-level
          document half, not the per-course half, and has no versioning.
        gap_severity: "configure-needed"
        gap_note: >
          No version control or acknowledgement. A handbook uploaded here is a
          file, not a versioned policy — pairing it with an Attestation (below) is
          the only way to evidence that students received it, and nothing in the
          product links the two objects.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Attestations (Add Attestation: title [required], description, assign-to-all-students toggle, due date, show-to-students toggle)"
        type: "signature collection with lock-on-signature"
        data_shown: "Attestation list plus, on the student profile, per-student status and the exact date/time the student agreed."
        gates_on:
          - "HARD LOCK: 'You will not be able to change the title or content of an attestation if students have already agreed to the statement.' Only the due date, assigned cohorts, and active state remain editable after the first signature."
        accreditation_citation: >
          CODA Standard 2, Element 2-1 (partial — the acknowledgement half of
          'written information provided to students in advance': the attestation
          timestamp is the evidence the student received and accepted the policy,
          which the resource upload alone cannot show).
        gap_severity: "none"
        gap_note: >
          Lock-on-signature is correct and consequential — it means attestation
          wording is effectively immutable from the first signature onward, so a
          day-one admin must get the text right before publishing. Both the PT and
          OT playbooks record the same two canonical attestations ("Profile
          verification and Profile update request... generally set up (with due
          dates), shared with all cohorts/students"), which is the practical
          answer to keeping the Profile tab current.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Program Requirements (Add Program Requirement: title, description, fulfilling Settings, cohort assignment)"
        type: "graduation-requirement definition"
        data_shown: "Requirement title, the settings that fulfil it, and the cohorts it applies to."
        gates_on:
          - "Fulfilment is either automatic on completion of a placement the requirement is attached to, or a manual mark from the student profile."
        accreditation_citation: >
          LCME Standard 8, Element 8.6 (Monitoring of Completion of Required
          Clinical Experiences — this is the definition side of the per-student
          ledger cited in step 7); ACPE Standard 3, Key Elements 3.2.b & 3.2.d
          (the four required APPE practice settings map directly onto
          setting-fulfilled requirements).
        gap_severity: "none"
        gap_note: >
          Defining requirements by Setting is the mechanism that makes the PT
          playbook's list workable ("Rural, Underserved, School-based, Integrated
          Clinical Experience-Acute") and would carry ACPE's four required APPE
          settings for pharmacy without new construction. Requirements are
          cohort-scoped, so a curriculum change means new requirements on the new
          cohort rather than a versioned requirement.
        competitor_equivalent: >
          Directionally comparable to content/competitors/new-innovations.yaml's
          "Continuity" tracking and content/competitors/medhub.yaml's
          required-experience/exposure reporting, but neither vendor's public docs
          describe an admin-authored requirement object with setting-based
          auto-fulfilment, so this cannot be compared element-for-element.

      - element: "Areas of Professional Interest (name + colour, list-builder)"
        type: "student-selectable taxonomy"
        data_shown: "Colour-coded practice areas (transcript examples: private practice, pediatrics, geriatrics) that the student picks from on their Profile tab."
        gates_on:
          - "Always included in a shared profile — the transcript lists areas of professional interest in the always-sent core of the profile share, so this taxonomy is site-facing by default."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          The PT playbook's settings list (Acute, SNF, TCU, Neuro IP/OP, OP Mix,
          OP Peds, EDS, Wound Care, etc.) shows how discipline-specific this
          vocabulary is — it is program-authored free text, which is the right
          call, but it means nothing is pre-seeded for a new domain and the list
          must be built from scratch on day one.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Additional Profile Details (Add Question: content, mandatory toggle, 'include when sharing profile' toggle, cohort assignment, active toggle, Reorder)"
        type: "program-authored questionnaire"
        data_shown: "An ordered question list, filterable by cohort; answers surface in the student's Profile tab and, if flagged, in the shared profile sent to sites."
        gates_on:
          - "The 'include in shared profile' toggle is per-question — 'By including this in the shared student's profile, you will have the ability to share this information collected from the student with sites.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "none"
        gap_note: >
          This is the product's designated escape hatch for anything the fixed
          profile schema does not model, and the transcript is candid about how
          broadly it gets used: "Some schools use the Additional Profile Details
          section to collect student standardized exam scores. Others use the
          section as a survey to collect student T-shirt sizes or career
          preferences." Free-text questions with no answer typing means exam
          scores collected here are strings, not analysable numbers.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Student Experience Settings > Actions and Permissions toggles (Housing and Parking; Add Clinical Instructor + 'Show List of Clinical Instructors to Students'; Contract Documents; Other Students Placed Here; Profile Picture Upload; Additional Documents)"
        type: "visibility / capability toggles"
        data_shown: "Per-feature ON (visible/permitted) or OFF (hidden/restricted) for all students."
        gates_on:
          - "Contract Documents OFF hides site contract documents from students."
          - "Add Clinical Instructor ON lets students add an experiential supervisor to their own placement — a genuine write permission, not just a visibility flag."
        accreditation_citation: >
          None as a requirement. Contextually: allowing students to self-add a
          clinical instructor has downstream consequences for preceptor
          credentialing evidence (ACPE Standard 3, Key Element 3.3.a; COCA
          Standard 5, Element 5.4), because a student-entered supervisor still has
          to be verified somewhere. Cited as a consequence, not as a standard this
          toggle satisfies.
        gap_severity: "configure-needed"
        gap_note: >
          Program-wide only — no per-cohort or per-course override, so a program
          that trusts third-years to add their own CI but not first-years cannot
          express that. The video's "Student View" naming is superseded by
          "Student Experience Settings" in the shipped UI, and the newer page adds
          two toggles the video never mentions (Show List of Clinical Instructors
          to Students, Additional Documents) — a documentation drift a day-one
          admin following the tutorial will hit.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."

      - element: "Student Experience Settings > Profile Fields (per-field Visible/Hidden, Required/Optional, Editable-by-student)"
        type: "schema configuration matrix"
        data_shown: "Every student-profile field with three independent configuration axes."
        gates_on:
          - "'Only optional fields can be marked as mandatory: When a field is set as Required, it must remain visible and editable by students, and the option to hide the field is automatically disabled.'"
          - "'Fields populated via a data feed are read-only for students... the editable option remains disabled, and the required setting—if enabled—is locked.'"
          - "'Bulk import templates dynamically adjust based on field configuration: If a field is marked as required, it becomes mandatory in the import template.'"
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        gap_severity: "gap"
        gap_note: >
          Two findings here. (1) SEQUENCING: this screen retroactively changes the
          bulk-import template, so it belongs BEFORE step 4, yet it sits at the
          bottom of the Setup left-menu and is absent from the video tutorial
          entirely — a new admin following the tutorial will import first and
          discover the coupling later. (2) DATA FEED: the phrase "fields populated
          via a data feed" is the only evidence anywhere in this stage's sources
          that an automated SIS/roster feed exists at all. It is referenced purely
          as a downstream consequence (such fields become read-only) — no source
          in this research documents how a feed is configured, what systems it
          connects to, its cadence, or who sets it up. For MD/DO/PharmD programs
          with 150-200+ per class and an institutional Banner/Colleague SIS, that
          undocumented path is the difference between a day-one spreadsheet ritual
          and a solved problem, and it is the largest open question in this stage.
        competitor_equivalent: >
          The data-feed gap is where a competitor comparison is genuinely
          available and genuinely unfavourable at the capability level:
          content/competitors/medhub.yaml documents MedHub integrating "AAMC ERAS
          resident demographic data" and importing ACGME survey/case-log/milestone
          data — named, ecosystem-specific roster and outcome feeds. By contrast
          content/competitors/core-elms.yaml is documented as naming "no specific
          LMS/SIS integration partners... publicly (Canvas, Banner, etc.) — only
          generic SSO/LTI standards support," i.e. the same opacity as Prism. The
          per-field Visible/Required/Editable matrix itself is not documented at
          this granularity by any competitor teardown in this research.

