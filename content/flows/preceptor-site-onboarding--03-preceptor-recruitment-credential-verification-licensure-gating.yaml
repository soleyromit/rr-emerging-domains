# Element-level ground truth underneath preceptor-site-onboarding.yaml, stage 3
# ("3. Preceptor recruitment, credential verification & licensure gating").
# Every confirmed_by citation below is a real file in the help-center mirror, a discipline
# playbook, the capability map, or an accreditation standard file — never re-derived from the
# journey's own narrative. Note: a sibling flow,
# rotation-lifecycle--02-preceptor-site-faculty-credentialing-orientation-calibration.yaml,
# traces the same underlying Personnel/Placement-Clearance/Faculty-Compliance screens for a
# different journey's orientation-and-calibration angle (ACPE 3.3.c, CODA 2-6); this file
# re-verifies those same screens specifically against this stage's licensure-GATING question
# (ACPE 3.3.a, COCA 6.10, LCME 9.3/3.1) and should not be read as a duplicate.
#
# SCHEMA v2 (2026-08-24): accreditation_citation / competitor_equivalent / gap_severity /
# gap_note now live on each ELEMENT rather than on the step. Where the underlying research did
# not distinguish between sibling elements, the same verdict is stated identically on each
# rather than inventing artificial precision.
flow_name: "Preceptor Recruitment, Credential Verification & Licensure Gating"
maps_to_journey: "preceptor-site-onboarding.yaml, stage 3"
persona: >
  Clinical / Experiential Education Coordinator (role-clinical-coordinator.yaml) doing the
  day-to-day preceptor data entry and clearance monitoring, with a Compliance/Accreditation
  Liaison (role-compliance-accreditation-liaison.yaml) pulling roster-level reports ahead of a
  self-study or site visit.
steps:
  - screen: "Sites > Personnel > Add Personnel wizard (Professional Details + Clinical Instructor toggle)"
    navigation_path: "Sites > Personnel tab > Add Personnel"
    elements:
      - element: "Will this person serve as Clinical Instructor?"
        type: "toggle (Yes/No)"
        data_shown: "Marks the personnel record as a preceptor/CI, distinct from a generic site contact; toggling Yes is what later exposes the Slots and Placements tabs on that person's profile (step 2)."
        gates_on: ["Whether Slots/Placements tabs appear on the personnel profile"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (a preceptor profile/credentialing record linked to every placement a preceptor supervises) — this toggle is specifically where the preceptor-vs-generic-contact distinction is made."
        competitor_equivalent: "New Innovations' 'Credentialling Module' (new-innovations.yaml) and MedHub's 'Automated Credentials Monitoring' (medhub.yaml) are documented only at marketing-page granularity — neither publishes a screen-level add-personnel wizard, so no field-by-field comparison is possible from available sources."
        gap_severity: "none"
        gap_note: >
          This toggle is the single element that RESOLVES the entity-existence half of this stage's
          core hedge ("unclear whether Compliance Management natively models preceptors as a
          trackable entity today versus only students," repeated verbatim in both acpe.yaml's 3.3.a
          gap_notes and coda.yaml's 2-6 gap_notes). Because it is load-bearing — it changes what
          tabs exist downstream — the preceptor is a first-class Personnel entity, not a cosmetic
          label. Both accreditation-file gap_notes predate the capability-map's own later correction
          ("this pillar gates on more than student items... Prism already gates on site, contract,
          and preceptor entities today"); this element confirms that correction is accurate.
      - element: "Professional Details section"
        type: "input field set"
        data_shown: "Degree, Practice Settings (multi-select), Designation, National Provider Identifier (NPI), Credentials (free text)."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (the credentialing detail carried on the preceptor record itself)."
        competitor_equivalent: "New Innovations' 'Credentialling Module' (new-innovations.yaml) and MedHub's 'Automated Credentials Monitoring' (medhub.yaml) are documented only at marketing-page granularity — neither publishes a screen-level add-personnel wizard, so no field-by-field comparison is possible from available sources."
        gap_severity: "none"
        gap_note: >
          Confirms the preceptor entity carries its own structured degree/credential fields,
          structurally distinct from a Student record and from a generic site contact — the data
          half of the entity-existence hedge above. Note that Credentials here is free text while
          Degree is structured; only the Degree field is reportable downstream (step 6).
      - element: "Site and Location Association tab"
        type: "input field set"
        data_shown: "Which site(s)/location(s) the preceptor is attached to, plus Practice Setting/Designation per location and a Primary Site flag."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (linking the preceptor record to the site(s) where they supervise)."
        competitor_equivalent: "New Innovations' 'Credentialling Module' (new-innovations.yaml) and MedHub's 'Automated Credentials Monitoring' (medhub.yaml) are documented only at marketing-page granularity — neither publishes a screen-level add-personnel wizard, so no field-by-field comparison is possible from available sources."
        gap_severity: "none"
        gap_note: >
          Establishes the preceptor-to-site relationship that the Slots/Placements grids (step 2)
          and the Placement Clearance Dashboard (step 4) read against. No open question at this
          element — the association is explicit and multi-site capable, with a Primary Site flag.
    action: >
      Coordinator creates a Personnel record for a newly recruited preceptor, marks "Will this
      person serve as Clinical Instructor?" = Yes, records their Degree/NPI/Credentials, and
      associates them to the site(s)/location(s) where they will supervise.
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Managing Personnel.md; corroborated by PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Add or Edit CI - Preceptor Information.md"

  - screen: "Personnel profile > Slots and Placements tabs (Experiential Supervisor gating)"
    navigation_path: "Sites > Personnel > [preceptor name] > Slots tab / Placements tab"
    elements:
      - element: "Slots tab"
        type: "read-only grid, conditionally visible"
        data_shown: "Location, Site, Rotation, Start/End Dates, Associated Experiential Supervisor, Cohort, Setting, Offered/Available/Placed counts, Slot Status, Slot Type, Supervision Type (Direct/Indirect/other)."
        gates_on: ["Tab visibility is gated on the personnel record being marked a Preceptor — a non-preceptor's profile has no Slots or Placements tab at all"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a; ACPE 3.3.e (2:1 student-to-preceptor ratio — this grid's Offered/Available/Placed counts are the raw data a ratio query would run against)."
        competitor_equivalent: "Not comparable at element level — no competitor teardown in content/competitors documents a personnel-record-scoped slots grid."
        gap_severity: "none"
        gap_note: >
          Second, independent confirmation that the preceptor is architecturally first-class: the
          product conditionally reveals/hides this whole tab based on the Preceptor flag, which is
          stronger evidence than a data field existing — it shows the entity type is load-bearing in
          the UI. The capacity counts here are the ratio ingredient for 3.3.e, though this grid is a
          per-preceptor view, not a computed program-wide ratio.
      - element: "Placements tab"
        type: "read-only grid, conditionally visible"
        data_shown: "Placement ID, Student, Site, Location, Academic Information (course offering, rotation, setting), Schedule, Preceptors (with email), Notes, Audit Information."
        gates_on: ["Same Preceptor-designation gate as the Slots tab"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (the preceptor-to-placement link the standard requires); supplies the preceptor↔student↔rotation join COCA 6.10 depends on (see step 6)."
        competitor_equivalent: "Not comparable at element level — no competitor teardown in content/competitors documents a personnel-record-scoped placements grid."
        gap_severity: "none"
        gap_note: >
          Same conditional-visibility evidence as the Slots tab: the tab exists only for
          Preceptor-flagged personnel, confirming the entity type is load-bearing. This grid is
          also the specific place the preceptor-to-placement link lives, which step 6 relies on when
          assessing COCA 6.10 — the link exists here; what does not exist is any rollup over it.
    action: >
      Coordinator or accreditation liaison opens a specific preceptor's profile to see every
      slot and student placement that preceptor is currently tied to, across sites and locations.
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Managing Personnel.md ('Manage Slots Associated to Personnel' and 'Managing Placements Associated to Personnel' sections)"

  - screen: "Personnel profile > Licensure and Certification sections (+ CV upload)"
    navigation_path: "Sites > Personnel > [preceptor name] > About/Licensure/Certification tabs"
    elements:
      - element: "Licensure section"
        type: "repeatable entry list (+Add / pencil-edit)"
        data_shown: "License number and related details per entry, per preceptor."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a."
        competitor_equivalent: "CORE ELMS names 'preceptor license tracking' as a line item (core-elms.yaml) and MedHub/E*Value's public page claims 'Immunization and certification record tracking' — both are stage-level marketing claims with no published field list, so this entry list cannot be compared field-for-field."
        gap_severity: "none"
        gap_note: >
          RESOLVES the "license number" component of the stage hedge directly — the PA Playbook is
          explicit that this is entered "for placement-clearance purposes," tying data capture here
          to the gate in step 4. Caveat specific to THIS element: the help-center source does not
          show an expiration-date field on the Licensure entry UI, only downstream reporting
          language referring to "expiring" licenses (step 5). Whether expiration is a structured
          date field on this entry, versus inferred/derived at the report layer, is not resolved by
          this screen alone.
      - element: "Certification section"
        type: "repeatable entry list (+Add / pencil-edit)"
        data_shown: "Board/other certification details, plus supporting documents, per preceptor."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a."
        competitor_equivalent: "MedHub/E*Value's public page claims 'Immunization and certification record tracking' (medhub.yaml, e-value.yaml) — a stage-level marketing claim with no published field list, so this cannot be compared entry-for-entry."
        gap_severity: "none"
        gap_note: >
          Confirmed present and named explicitly in the PA Playbook's personnel data best practices
          ("Certification (Preceptor/Clinical Preceptor)"), and it accepts supporting documents, not
          just text. Same unresolved expiration question as the Licensure entry above: no expiration
          field is visible on the entry UI in the source material.
      - element: "CV document upload"
        type: "document field"
        data_shown: "Curriculum vitae file, per preceptor."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (documented preceptor qualifications on file)."
        competitor_equivalent: "Not comparable — no competitor teardown in content/competitors documents a per-preceptor CV document field."
        gap_severity: "none"
        gap_note: >
          Straightforward document field, confirmed by both the help-center guide and the PA
          Playbook ("preceptor certification, license number, and CV must be entered for
          placement-clearance purposes"). Unlike the Licensure and Certification entries, no
          expiration question attaches to it — a CV has no expiry state to model.
    action: >
      Coordinator (or, per step 6, the preceptor via self-service) enters license number and
      certification details and uploads a CV to the preceptor's Personnel record.
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Managing Personnel.md; corroborated by PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md ('Personnel: preceptor certification, license number, and CV must be entered for placement-clearance purposes' and 'Personnel data best practices: Certification (Preceptor/Clinical Preceptor)... License (Preceptor/Clinical Preceptor): add license number details')"

  - screen: "Placements > Course > Placement Clearance Dashboard — Preceptor CV / License / Certification columns"
    navigation_path: "Placements > [Course or Placement Group] > Placement Clearance"
    elements:
      - element: "Preceptor License column"
        type: "read-only rollup (three-state)"
        data_shown: "Missing / Exists / NA, evaluated per preceptor assigned to a placement in the selected course or group."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (documented quality criteria applied at recruitment, with a license record gating eligibility to supervise)."
        competitor_equivalent: "eMedley's public docs don't state whether compliance items gate placement start/continuation at all (../competitors/emedley.yaml); New Innovations and MedHub market a standalone credentialing tracker without describing a placement-blocking dependency on it. Among the reviewed competitor set, Prism is the only one whose own documentation (corroborated by an internal playbook, not just marketing copy) names preceptor-license validity as an explicit placement-clearance requirement."
        gap_severity: "configure-needed"
        gap_note: >
          RESOLVES the "gates their eligibility to supervise" half of the stage hedge in Prism's
          favor at the requirements-definition level: this column's underlying check is named, by
          name, as one of four enumerated Placement Clearance Requirements alongside student
          compliance, site documents, and active contracts — not a lesser-tier check. What stays
          open, matching the caveat reached on the equivalent screen in rotation-lifecycle--02: the
          source documents this as a monitoring/flagging view checked on a 6-8-week cadence, not a
          system-enforced block with a stated expiration-driven state transition (unlike Contract
          Status, which explicitly flips to "Needs Attention when a contract expires before
          placement end"). Whether "Missing" here prevents a placement from being published, versus
          only flagging it, is not stated either way.
      - element: "Preceptor Certification column"
        type: "read-only rollup (three-state)"
        data_shown: "Missing / Exists / NA."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (board certification specific to the preceptor's specialty, as named in the PA Playbook's clearance requirements)."
        competitor_equivalent: "eMedley's public docs don't state whether compliance items gate placement start/continuation at all (../competitors/emedley.yaml); New Innovations and MedHub market a standalone credentialing tracker without describing a placement-blocking dependency on it. No competitor publishes a certification-status column at this granularity."
        gap_severity: "configure-needed"
        gap_note: >
          Carries the same verdict as the Preceptor License column, and for the same reason: the PA
          Playbook's fourth enumerated clearance requirement is "validity of the assigned
          preceptor's license/board certification specific to their specialty," covering this column
          and the License column jointly. Same open question — flagging is documented, enforcement
          is not stated either way, and no expiration-driven state transition is described.
      - element: "Preceptor CV column"
        type: "read-only rollup (three-state)"
        data_shown: "Missing / Exists / NA."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (visibility of documented preceptor qualifications ahead of a rotation)."
        competitor_equivalent: "Not comparable — no competitor teardown documents a CV-status column on a placement-clearance view."
        gap_severity: "configure-needed"
        gap_note: >
          Weaker evidentiary standing than its sibling License and Certification columns: CV is
          surfaced on this dashboard, but unlike license/board-certification validity it is NOT one
          of the four enumerated Placement Clearance Requirements in the PA Playbook. So the
          documentation supports it as a monitoring signal only, with even less basis than the
          License column for claiming it participates in a gate.
      - element: "Filter panel"
        type: "report filter"
        data_shown: "Filters the whole dashboard by Preceptor CV, Preceptor License, and Preceptor Certification status, among student- and site-side fields."
        gates_on: []
        accreditation_citation: "No standard's evidence lives on this element itself; it is the retrieval mechanism over the columns above."
        competitor_equivalent: "Not comparable — no competitor teardown documents the filter set on an equivalent clearance view."
        gap_severity: "none"
        gap_note: >
          Unlike the three status columns, no open question attaches here. The documented need — let
          a coordinator isolate placements whose preceptor is Missing a license or certification on
          a 6-8-week cadence — is exactly what this filter does. The unresolved enforcement question
          is a property of the columns' semantics, not of this filter.
    action: >
      Coordinator monitors this dashboard starting 6-8 weeks before rotations begin (Exxat's
      documented best practice), following up on any placement whose assigned preceptor shows
      Missing on License or Certification before the rotation start date.
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Placements/Placement Clearance Dashboard.md; corroborated by PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md ('Placement Clearance Requirements: 1. Student compliance status. 2. Site/location-specific documents. 3. Active contracts. 4. Validity of the assigned preceptor's license/board certification specific to their specialty.')"

  - screen: "Sites > Reports > Personnel Reports (Comprehensive Personnel Report, Licensure Entered/Missing, Board Certification Entered/Missing)"
    navigation_path: "Sites > Reports > Personnel [report category]"
    elements:
      - element: "Comprehensive Personnel Report"
        type: "exportable grid report"
        data_shown: "Personnel's basic and professional details, including the Degree column, filterable/sortable with edit-columns support."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (roster-level reporting on the licensed-pharmacist share of a student's assigned preceptors)."
        competitor_equivalent: "MedHub/E*Value's 'Automated Credentials Monitoring' claims real-time state/DEA/Controlled-Substances license tracking with GME-office alerts (medhub.yaml) — a comparable concept at the marketing-page level, but their public docs don't name specific reports, so no report-for-report comparison is possible."
        gap_severity: "configure-needed"
        gap_note: >
          This specific report RESOLVES the "expiration" component of the hedge that step 3 left
          open: the OT Playbook confirms in plain language that the Comprehensive Personnel Report
          "tracks missing/expiring licenses" — expiration is a real, reportable state, not just
          Missing/Exists. What remains a genuine gap on this element: ACPE 3.3.a's ask is not "who's
          missing a license" but a computed MAJORITY ratio — the percentage of a given student's
          assigned preceptors who are U.S.-licensed pharmacists. This report does not compute that;
          a program would export it alongside placement-roster data and calculate outside Prism, or
          have Exxat build a custom report. A configuration/custom-report gap, not a
          data-availability gap.
      - element: "Licensure Entered / Licensure Missing reports"
        type: "exportable grid report"
        data_shown: "Which preceptors have licensure details on file vs. missing."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (evidence that licensure is tracked across the full preceptor roster)."
        competitor_equivalent: "MedHub/E*Value's 'Automated Credentials Monitoring' claims real-time license tracking with GME-office alerts (medhub.yaml), and CORE ELMS lists 'preceptor license tracking' (core-elms.yaml) — both at marketing-page level only, with no named reports to compare against."
        gap_severity: "configure-needed"
        gap_note: >
          Answers the completeness question ("who has licensure on file") cleanly at roster level.
          Same unmet ask as the Comprehensive Personnel Report: a binary entered/missing split is
          not the licensed-pharmacist MAJORITY ratio ACPE 3.3.a asks for, and nothing in the source
          material computes that ratio per student. Custom-report/configuration gap.
      - element: "Board Certification Entered / Board Certification Missing reports"
        type: "exportable grid report"
        data_shown: "Which preceptors have board-certification details on file vs. missing."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (supporting evidence of documented preceptor qualifications at roster level)."
        competitor_equivalent: "MedHub/E*Value claim certification record tracking at marketing-page level (medhub.yaml, e-value.yaml) with no named reports published, so no report-for-report comparison is possible."
        gap_severity: "none"
        gap_note: >
          Fully delivers what is asked of it at roster level. The unresolved ACPE 3.3.a ratio gap
          documented on the two licensure-side reports above is specifically about licensed-
          pharmacist share and does not implicate board certification, so no gap is carried here.
    action: >
      Compliance/accreditation liaison runs these roster-level reports ahead of an ACPE self-study
      or site visit to demonstrate, across a program's full preceptor roster, what proportion
      hold current licensure and what the Degree distribution looks like (physician/PA vs. other).
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Sites/View Site- Location- and Personnel Reports.md; corroborated by PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md ('Comprehensive Personnel Report... The Degree column lets programs show that most preceptors are practicing physicians and PAs. Licensure Details and Certification Details are tracked per preceptor.') and PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational Therapy (OT) Playbook.md ('Ongoing Monitoring — the Comprehensive Personnel Report tracks missing/expiring licenses and educator qualification status.')"

  - screen: "Sites > Reports > Comprehensive Personnel Report — Degree column, applied to COCA 6.10's DO-supervision predicate"
    navigation_path: "Sites > Reports > Personnel > Comprehensive Personnel Report"
    elements:
      - element: "Degree column"
        type: "read-only report column"
        data_shown: "Each preceptor's degree (e.g. MD, DO, PA), confirmed as a reportable field distinguishing physician preceptor types from other licensed clinicians."
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.10 (de-identified, system-generated proof each student had ≥1 rotation under an osteopathic physician's supervision, ≥1 alongside GME residents, and >1 inpatient)."
        competitor_equivalent: "Not comparable — no competitor teardown documents a per-preceptor degree field feeding a rotation-supervision report."
        gap_severity: "gap"
        gap_note: >
          PARTIALLY narrows, but does not resolve, COCA 6.10. The raw ingredient the standard needs —
          a structured "what degree does this preceptor hold" field, joinable to the placement/rotation
          that preceptor supervises — is confirmed to exist (this column, plus the
          preceptor-to-placement link confirmed in step 2). What is NOT confirmed anywhere in the
          source material is the specific deliverable COCA 6.10 requires: a de-identified,
          system-generated, PER-STUDENT completion checklist rolling up "≥1 DO-supervised rotation,"
          "≥1 rotation alongside GME residents," and ">1 inpatient rotation" automatically before
          fourth-year clerkships begin. No report in the View Site/Location/Personnel Reports catalog,
          the Playbooks, or the capability map performs that three-condition rollup — a coordinator
          today would join this column to the Placements grid (step 2) and a Setting field per
          rotation, per student, by hand. A real gap, not a configuration nicety — consistent with
          coca.yaml 6.10's "Configure" fit rating, and it does not tighten it to "Transfer."
    action: >
      A DO-program coordinator could, in principle, cross-reference this report's Degree column
      against a rotation's assigned preceptor to identify which rotations were DO-supervised.
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md ('The Degree column lets programs show that most preceptors are practicing physicians and PAs')"

  - screen: "Preceptor Module (self-service portal, instructor.exxat.com) — Preceptor Profile"
    navigation_path: "instructor.exxat.com login > Preceptor Profile"
    elements:
      - element: "Preceptor Profile fields"
        type: "input field set, preceptor-facing"
        data_shown: "Personal details, contact information, practice settings, and documents including CV, licenses, and certifications."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a."
        competitor_equivalent: "Not comparable — no competitor teardown in content/competitors describes a dedicated self-service preceptor portal with this feature set."
        gap_severity: "gap"
        gap_note: >
          A confirmed, real limitation surfaced by the source itself, not a hedge: the setup guide
          states outright that "Currently the information updated by the preceptor on their profiles
          will not be mapped to the preceptor profile on the program's end." A preceptor
          self-reporting a license renewal through these fields does NOT flow into the Personnel
          record the Placement Clearance Dashboard (step 4) actually reads — the program-side record
          stays exactly as stale as it was until a coordinator manually re-enters what the preceptor
          submitted. A genuine gap in the licensure-currency loop this stage depends on, distinct
          from the "is the entity trackable at all" question the stage's original hedge focused on.
    action: >
      A preceptor who has been added as site personnel and associated with at least one student's
      placement logs in directly at instructor.exxat.com and self-maintains their own profile,
      including uploading license/certification documents.
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Preceptor Module/Preceptor Module Setup Guide.md"

  - screen: "Faculty Compliance > Setup > Requirements (expiration-aware licensure tracking, parallel to Personnel)"
    navigation_path: "Faculty Compliance > Setup tab > Requirements > Requirement edit drawer"
    elements:
      - element: "Requirement edit drawer — 'requirement has an expiration date' toggle"
        type: "toggle + date-configuration panel"
        data_shown: "Whether a given compliance requirement (e.g. a license) carries an expiration, with configurable expiration settings."
        gates_on: ["Whether the requirement drives Expiring/Expired auto-notifications"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (an expiration-aware licensure record is a stronger evidentiary fit than the Missing/Exists/NA model in step 4)."
        competitor_equivalent: "New Innovations' Credentialling Module claims 'expiration alerts' at a similar conceptual level on its marketing page (new-innovations.yaml), but its public docs don't expose setup-level mechanics to compare against Prism's Requirement/Requirement-Group structure."
        gap_severity: "configure-needed"
        gap_note: >
          This toggle is where the SECOND, more date-aware mechanism for this stage's need actually
          lives — genuinely good news the original hedge didn't anticipate, and a better fit for
          3.3.a than step 4's three-state model. The open question it raises in place of the old
          one: the Nursing Playbook treats "Faculty Compliance" as covering preceptor licensure
          directly, while the PA and OT playbooks route the identical need through the Personnel
          entity's Licensure/Certification fields (steps 1-4). Nothing states whether "Faculty" here
          is the same population as a Personnel-tracked off-site preceptor — so which mechanism a
          new Pharmacy/Dentistry/Medicine/DO program would use is an open implementation decision,
          not a missing capability.
      - element: "Auto-Notifications — Document Status rules"
        type: "notification rule builder"
        data_shown: "Triggers on Not Approved, Expiring, and Expired document states."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.a (proactive currency of the licensure record, which step 4's monitoring-cadence model relies on humans to supply)."
        competitor_equivalent: "New Innovations' Credentialling Module claims 'expiration alerts' at a similar conceptual level on its marketing page (new-innovations.yaml), and MedHub markets GME-office license alerts (medhub.yaml) — both marketing-page level, with no published rule-builder mechanics to compare against."
        gap_severity: "configure-needed"
        gap_note: >
          Supplies the automated push that the Placement Clearance Dashboard (step 4) does not
          document — Expiring/Expired are real trigger states here, not just report language. Same
          unresolved population question as the expiration toggle above: whether these notifications
          can be pointed at off-site preceptors tracked as Personnel, or only at an internal faculty
          population, is not stated in the source material. Configuration decision, not a missing
          capability.
    action: >
      A Faculty Compliance Administrator can configure a licensure requirement with a stated
      expiration date and automated Expiring/Expired notifications, and assign it to a
      Requirement Group covering instructional personnel.
