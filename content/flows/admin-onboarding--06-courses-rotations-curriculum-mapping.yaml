# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 6
# ("Courses, rotations & curriculum mapping").
#
# SCOPE NOTE — this is PRODUCT ONBOARDING, not the clinical lifecycle. The four
# existing journeys (rotation-lifecycle, preceptor-site-onboarding,
# competency-verification, accreditation-self-study) all assume Prism is already
# configured. This file traces what a brand-new Program Administrator actually
# clicks in week 1-6 to bring the course catalog, course offerings, and the
# curriculum grid into existence — the substrate every one of those four
# journeys silently depends on. Where it overlaps
# competency-verification--01-define-the-competency-framework-and-map.yaml, the
# overlap is deliberate and the angle is different: that file asks "can this
# model a competency framework?", this one asks "what does the person setting it
# up from an empty tenant have to do, in what order, and what can they
# irreversibly get wrong on day one?"
#
# PRIMARY SOURCE for every step below is the general admin-tutorial transcript at
# exxat_transcripts.md — specifically the sections
# "## 8/16 Setting Up Courses in Exxat Prism" (lines 655-805),
# "## 14/16 Performing Curriculum Mapping in Exxat Prism" (lines 1497-1611), and
# "## Heatmap Report in Exxat Prism (Curriculum Mapping)" (lines 1735-1745).
# Help-center articles are cited ONLY where they add a field the transcript does
# not narrate (e.g. Map with Leo, Bloom's Taxonomy auto-suggest), never as a
# paraphrase substitute for transcript content.
#
# SCHEMA v2: accreditation_citation / competitor_equivalent / gap_severity /
# gap_note are per ELEMENT, not per step.

flow_name: "Course Catalog, Offerings & Curriculum Grid Build-Out"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 6"
persona: >
  Program Administrator, new to the platform (primary — owns Courses > Setup,
  the course catalog, course offerings, and builds the first curriculum grid).
  Secondary: Curriculum/Assessment Director or curriculum-committee chair (owns
  the standards library in Program Details > Standards and signs off on the
  mapping taxonomy before mapping starts); Course Faculty (secondary, and only
  if the admin grants it — Program Details > Faculty Dashboard Configuration has
  a discrete "curriculum grids" access toggle that is off-able, per
  exxat_transcripts.md line 1187: "if you'd like to keep curriculum mapping
  limited to administrators simply turn off access to curriculum grids for
  faculty"). See ../personas/.

steps:

  # ---------------------------------------------------------------- STEP 1
  - screen: "Courses > Setup > Course Organization"
    navigation_path: "Dashboard or upper-left hamburger menu > Courses > Setup tab > Course Organization section"
    action: >
      Before a single course exists, the admin defines the academic calendar
      vocabulary the whole tenant will inherit: terms, professional years,
      academic years, and (optionally) an additional course identifier. The
      transcript is explicit that this is step one of a four-step workflow —
      "First, you will set up course organization options, add courses to the
      course catalog, create course offerings using these courses, then set up
      the course information for each course offering" (line 659).
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 659-669"
    elements:
      - element: "Terms (pencil icon > Term text box > Add), with drag-handle (double-ellipses) and up/down reorder arrows"
        type: "ordered list editor"
        data_shown: "Term names, in program-defined sequence (e.g. Fall / Winter / Spring / Summer for a quarter-system school)."
        gates_on:
          - "Term order literally controls curriculum-grid column order — 'The order of these terms affect the way that courses are displayed on the curriculum grid, therefore, make sure these terms are entered sequentially' (transcript line 663)."
          - "A term cannot be deleted once any course offering is associated with it (line 665)."
        accreditation_citation: "None directly — but this is the upstream dependency for CODA Standard 2, Element 2-8 (curriculum management plan) and ACPE Standard 2, Key Element 2.2.d evidence, because sequencing is the axis on which both accreditors read a curriculum map. Miskeyed term order silently produces an out-of-sequence crosswalk."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. one45.yaml documents 'version control and audit trail' on the curriculum repository, which is the closest analogue to getting sequencing wrong and needing to see when it changed — Prism's term list has no documented version history."
        gap_severity: "configure-needed"
        gap_note: "Order is load-bearing and set by drag-and-drop with no validation, no preview, and no undo. A new admin has no way to see the downstream grid consequence until a curriculum grid exists — which is four steps later."
      - element: "Professional Years (pencil icon in Professional Years card)"
        type: "ordered list editor, optional"
        data_shown: "Year-level labels (Year 1, Year 2, ...) assigned to course offerings."
        gates_on:
          - "Optional per transcript line 665; meaningful only for lockstep programs. 'You can always add another professional year titled Non-Lockstep for courses which are offered to students regardless of their professional year.'"
        accreditation_citation: "COCA Standard 6, Element 6.4 — the osteopathic core-competency curriculum map has to show progression (introduce/reinforce/demonstrate) across the program, and professional year is the only field in this screen that carries program-stage semantics."
        competitor_equivalent: "new-innovations.yaml documents defining curriculum objectives 'across MD/DO program stages' — a directionally equivalent concept, but their public docs do not describe a configurable year-label list, so this is not comparable element-for-element."
        gap_severity: "none"
        gap_note: "The explicit lockstep/non-lockstep escape hatch (a literal 'Non-Lockstep' year value) is a workable convention, though it is a naming convention rather than a modeled program type."
      - element: "Academic Years (pencil icon in Academic Year section)"
        type: "ordered list editor"
        data_shown: "Calendar-year spans, e.g. '2024 to 2025'."
        gates_on:
          - "Only one Academic Calendar can be created per academic year (line 673)."
          - "Editing an academic-year value propagates to every course offering already assigned it (line 663)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Additional Course Identifier (activation bit + free-text title, e.g. 'Section')"
        type: "toggle + input field"
        data_shown: "A custom disambiguation axis so two offerings of the same course in the same term/academic year/professional year can coexist."
        gates_on:
          - "Without it, the system HIDES an already-created course from the add-offering picker for that same term/AY/PY combination — 'we do this to ensure that two course offerings are not created indistinguishably from one another' (lines 693-695). The identifier is the only documented unlock."
        accreditation_citation: "LCME Standard 8, Element 8.7 (Comparability of Education/Assessment) — where the same course runs as parallel sections or on parallel campuses, this field is the only structural handle Prism has for telling those instances apart, which is the precondition for any comparability claim."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. medhub.yaml documents UME 'course enrollment/waitlists/lottery scheduling' via eValue, which implies a section concept, but no public MedHub doc describes a configurable section-identifier field."
        gap_severity: "configure-needed"
        gap_note: "This is a day-one decision with silent late consequences: a program that does not switch this on before creating offerings hits an unexplained 'the course disappeared from the list' behavior later, and the transcript's own explanation of that behavior arrives ~30 lines after the toggle."

  # ---------------------------------------------------------------- STEP 2
  - screen: "Courses > Setup > Course Management, Academic Calendar, and Learning Activity"
    navigation_path: "Courses > Setup tab > Course Management dropdown / Academic Calendar section / Learning Activity section"
    action: >
      Still pre-catalog, the admin seeds three shared taxonomies that later
      screens can only consume, never create: course measure categories (the
      container for every learning objective the curriculum map will use),
      program-wide course policies, and the term-level start/end date calendar.
      They also configure timesheet categories here.
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 669-677"
    elements:
      - element: "Course Measure Categories (Course Management > Course Measure Categories)"
        type: "taxonomy list"
        data_shown: "The named buckets a program's objectives live in — the transcript notes programs call these different things: 'Some schools call their course measures course objectives, others may call them instructional and lecture objectives' (line 1515)."
        gates_on:
          - "Nothing can be mapped that is not first a category here. The curriculum-grid setup drawer can only activate/deactivate from this list (line 1531)."
          - "System blocks duplicates automatically (line 1515)."
        accreditation_citation: "ACPE Standard 2, Key Element 2.2.d (content breadth and depth — curriculum mapping to educational outcomes); CODA Standard 2, Element 2-8 (curriculum management plan); COCA Standard 6, Element 6.4. All three require a named objective taxonomy as the mapping source, and this is the screen that creates it."
        competitor_equivalent: "one45.yaml documents 'standardized vocabularies aligned to CanMEDS and AAMC competency frameworks' as a shipped part of One45 Curriculum Management — i.e. one45 ships pre-standardized vocabularies where Prism ships an empty list the admin names themselves. elentra.yaml documents 'tag management/mapping' as the equivalent mechanism. Both are real, comparable competitor capabilities at this element's granularity."
        gap_severity: "configure-needed"
        gap_note: "Prism's own tutorial warns about the failure mode rather than preventing it: 'We recommend having a distinct and minimal list of course measures added here as curriculum mapping can get confusing if you use interchangeable terms' (line 1515). No pre-seeded discipline vocabulary is confirmed for this list the way accreditation standards are pre-seeded in Program Details > Standards — that asymmetry is the single highest-leverage day-one advisory moment in this stage."
      - element: "Course Policies (+ icon > Policy Name / description text area / Browse to Upload)"
        type: "input field set + file upload"
        data_shown: "Program-wide policies inherited by every course (transcript's own example: 'students need to attend at least 80% of their courses', line 671)."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-1 (Instruction — advance course information): written information to students in advance of each course covering goals/requirements, content, evaluation method, and how grades and competency are determined. Program-wide policy text is one component of that written packet."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file in content/competitors/ describes a program-wide policy inheritance object."
        gap_severity: "none"
        gap_note: "Course-specific policies are added separately at the offering level and coexist with the inherited program-wide ones (line 729), which is the right shape for CODA 2-1."
      - element: "Academic Calendar (Add New > select academic year > per-term start/end dates > 'update these new start dates and end dates for the existing course offerings' option)"
        type: "date matrix + propagation toggle"
        data_shown: "One start/end date pair per term per academic year; feeds course-offering date pre-population."
        gates_on:
          - "One calendar per academic year, hard limit (line 673)."
          - "Pre-populates course-offering start/end dates at creation time (line 691)."
          - "BLOCKED after mapping: 'if this course offering has been used in curriculum mapping, you will not be able to make changes to the academic calendar options for this course offering' (line 701)."
        accreditation_citation: "None directly — platform-mechanics element. Indirectly upstream of ACPE Standard 3, Key Element 3.1.b (IPPE minimum clock hours by practice setting), since term dates bound the windows those hours accrue in."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "The mapping lock is the sharpest onboarding trap in this whole stage: the admin does the calendar work first, maps second, then discovers the calendar is frozen and the documented remedy is a support ticket — 'please reach out to our support team at prism-support@exat.com and they can make these changes on your behalf' (line 703). For a first-year program still moving its calendar around, this converts a self-serve edit into a vendor dependency."
      - element: "Learning Activity > Timesheet (pencil icon; single-select vs. multi-select radio, category alias, comma-separated category list)"
        type: "radio + input field set"
        data_shown: "The categories students pick from when logging timesheet entries; transcript examples are 'simulation or direct contact' (mutually exclusive → single-select) vs. 'new patient and evaluative practice' (→ multi-select) (lines 675-677)."
        gates_on:
          - "Set here once, program-wide; the course-level timesheet activity consumes it."
        accreditation_citation: "ACPE Standard 3, Key Element 3.1.b (IPPE duration — minimum clock hours BY PRACTICE SETTING) — the single/multi-select decision determines whether hours can be attributed cleanly to one setting, which is exactly what 3.1.b's per-setting minimum requires. A multi-select configuration makes per-setting hour totals ambiguous."
        competitor_equivalent: "medhub.yaml documents 'timesheet-based duty-hour tracking with auto-alerts for violations' — a shipped, comparable capability, though MedHub's public docs describe threshold alerting rather than a configurable category taxonomy, so the comparison holds on the tracking half and not on the configuration half."
        gap_severity: "configure-needed"
        gap_note: "Comma-separated free text in a single box is a fragile input for a taxonomy that later drives hour-attribution reporting; there is no documented validation, no per-category metadata, and no documented way to retire a category without editing the string."

  # ---------------------------------------------------------------- STEP 3
  - screen: "Courses > Course Catalog"
    navigation_path: "Courses > Course Catalog tab > Add Course / Upload Courses"
    action: >
      The admin populates the master course list — either one course at a time
      or via a four-column CSV. This is the 'comprehensive master list of all
      courses' that the help center names as curriculum-mapping prerequisite #1.
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 677-689"
    elements:
      - element: "Course Number (free-text)"
        type: "input field"
        data_shown: "Program's own course code, transcript example 'PA233' — 'a letter code signifying the domain of your program, followed by a number code' (line 679)."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "Uniqueness is explicitly NOT enforced: 'keep in mind the course numbers already in use, because our system does not prevent you from adding multiple courses with the same course number' (line 679). On day one, with a bulk CSV, this is how a tenant acquires silent duplicates that later produce two indistinguishable rows in every mapping report."
      - element: "Course Name (free-text)"
        type: "input field"
        data_shown: "Display name used across offerings, grids, and every mapping report."
        gates_on:
          - "Renaming the catalog course does NOT propagate automatically — 'When you change a course name and number, this change does not automatically reflect existing course offerings offered from this course' (line 687)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "one45.yaml documents 'version control and audit trail' on the curriculum repository — the specific thing that would make a name change safe and traceable. Prism's documented behavior is a confirm-by-typing-a-number dialog with no version history."
        gap_severity: "configure-needed"
        gap_note: "Propagation is opt-in via a 'do you want to apply the change to course offering' checkbox plus a per-offering selection table (line 703) — sound design, but it means catalog and offering names can legitimately diverge, and nothing surfaces that divergence."
      - element: "Requires Placement (Yes/No)"
        type: "radio, immutable after save"
        data_shown: "Whether the course is a placement/rotation course or purely didactic."
        gates_on:
          - "Didactic offerings cannot have students placed and are restricted in learning-activity types: 'Forms and evaluations can be set up in didactic courses, but patient logs, timesheets, and time off cannot be set up' (line 803)."
          - "Surfaces later as the brown 'P' indicator on the curriculum grid (line 1539)."
        accreditation_citation: "ACPE Standard 3, Key Elements 3.1.a/3.2.b (IPPE/APPE structure and required practice settings) and COCA Standard 6, Element 6.9 (Clinical Education) — this flag is what separates the experiential half of the curriculum from the didactic half, and both accreditors' evidence packets are structured on exactly that split."
        competitor_equivalent: "leo-davinci.yaml documents mapping 'every session in every course — didactic or clinical', i.e. Leo/DaVinci carries the same didactic/clinical distinction at finer (session) granularity than Prism's course-level flag. That is a real, sourced comparison at this element's granularity."
        gap_severity: "gap"
        gap_note: "Irreversible: 'it is not possible to change a placement-related course to a didactic course, or vice versa' (line 687). A new admin makes this call before they have seen what either mode does, and the only remedy is delete-and-recreate — which is itself blocked once an offering exists (line 689) or once mapping exists (line 705)."
      - element: "Upload Courses > Download CSV Template (4 columns: serial number, course number, course name, requires placement)"
        type: "bulk import"
        data_shown: "Post-upload analysis screen with success/fail counts and per-row 'duplicate' or 'fields missing' text indicators; rows can be deselected before commit (lines 681-683)."
        gates_on:
          - "Duplicate and incomplete rows are rejected, not imported."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "one45.yaml documents a 'Canvas Alignment Tool that syncs LMS learning-event and facilitator data to keep curriculum maps current' — a genuine architectural difference at exactly this element's granularity: one45 has a documented live LMS sync where Prism's documented path is a four-column CSV. core-elms.yaml notes no named SIS/LMS integration partners (Canvas, Banner) are public, 'only generic SSO/LTI standards support' — so CORE is at parity with Prism here, one45 is ahead."
        gap_severity: "gap"
        gap_note: "No SIS/LMS course-catalog integration is documented anywhere in the admin transcript or the help-center Courses folder. For a large multi-track program (the Nursing case: a separate grid per ADN/BSN/MSN/DNP/specialty track), the day-one catalog build is manual CSV work with no upstream system of record."
      - element: "Course Catalog table (course number, course name, requires placement, last updated, updated by) + sort, search, export icon"
        type: "table with sort/search/export"
        data_shown: "Full catalog, sortable on any of the three data columns; searchable by number or name; exportable to Excel (line 685)."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "'Last updated' + 'updated by' is the only change-tracking in this stage's screens — useful, but it is a last-write stamp, not the audit trail one45 documents."

  # ---------------------------------------------------------------- STEP 4
  - screen: "Courses > Course Offerings > Add Course Offering"
    navigation_path: "Courses > Course Offerings tab > Add Course Offering"
    action: >
      The admin instantiates catalog courses into the actual term/year the
      program will run them in — 'Course offerings are instances of courses
      offered to students. A single course can be used to create multiple course
      offerings' (line 689). This is the object every downstream journey
      (placements, wishlists, learning activities, mapping) actually attaches to.
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 689-705"
    elements:
      - element: "Cohort selector (lockstep programs only) + auto-register-the-cohort confirmation"
        type: "dropdown + confirmation dialog"
        data_shown: "Cohort assigned to the offering; on save the system offers to register every student in that cohort at once."
        gates_on:
          - "Only appears for lockstep programs — 'If your program is not lockstep, you will not have the option to select a cohort' (line 691)."
        accreditation_citation: "None directly — platform-mechanics element. Downstream it is what makes CODA Standard 2, Element 2-6 and LCME 8.7 comparability queries answerable by cohort."
        competitor_equivalent: "elentra.yaml documents 'filtering by cohort, course, or objective set' inside Curriculum Explorer/Search — cohort as a first-class filter dimension is confirmed at parity. The auto-registration-on-create behavior has no documented competitor equivalent at this granularity."
        gap_severity: "none"
        gap_note: "The lockstep/non-lockstep branch is handled honestly here (field hidden rather than shown-and-ignored), which matters for Social Work and Nursing where non-lockstep and multi-track structures are the norm."
      - element: "Term / Academic Year / Professional Year selectors + auto-populated Start Date / End Date"
        type: "dropdown set + date fields"
        data_shown: "Dates pre-populate from the Academic Calendar configured in step 2 and can be overridden per offering (line 691)."
        gates_on:
          - "Values must already exist in Course Organization; they cannot be created inline."
          - "After mapping, the academic-calendar options are frozen (line 701)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Strict no-inline-create discipline is correct for data hygiene but punishing on day one: an admin mid-build who realizes they need a fifth term has to leave the wizard, go to Setup, add it, and come back."
      - element: "Course multi-select table (filtered to the chosen term/cohort/AY; already-created combinations hidden)"
        type: "multi-select table"
        data_shown: "Catalog courses eligible for this term/AY/PY combination."
        gates_on:
          - "Already-used combinations are hidden, not disabled with an explanation — the unlock is the Additional Course Identifier from step 1 (lines 693-695)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Hiding rather than disabling-with-reason is the specific interaction that makes the Additional Course Identifier feel like an undocumented prerequisite."
      - element: "Course Offerings table + wrench icon (column reorder via double-ellipses / remove via trash / Add a Column) + filter icon + export icon"
        type: "configurable table"
        data_shown: "Course number, course name, academic year, professional year, term, additional course identifier, cohort (lockstep only), assigned faculty/staff, registered-student count (line 695). Filterable by course, cohort, academic year, professional year, online/on-campus, term, placement requirement, start date, end date (line 697)."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. Configurable-column grids are table stakes and no competitor teardown in content/competitors/ documents them field-by-field."
        gap_severity: "none"
        gap_note: "The registered-student count column is quietly the best day-one QA signal in this stage — a zero there after cohort assignment means registration silently did not happen."
      - element: "All / Completed / Ongoing / Upcoming tabs"
        type: "date-derived view tabs"
        data_shown: "Offerings bucketed by end date in past / end date future & start date past / start date future (line 699). Default landing is All."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Delete course offering (trash icon > data-loss preview popup > type-the-number confirmation)"
        type: "destructive action with typed confirmation"
        data_shown: "A popup enumerating the types of information that will be lost before deletion (line 705)."
        gates_on:
          - "HARD BLOCK if used in curriculum mapping: 'If this course is used in curriculum mapping, it cannot be deleted. To delete courses with curriculum mapping data associated, please reach out to our support team' (line 705)."
        accreditation_citation: "CODA Standard 2, Element 2-8 (curriculum management plan — ongoing review and evaluation) reads on this in an unusual way: the mapping lock is arguably CORRECT accreditation behavior, since it prevents silent destruction of the crosswalk a program is accountable for maintaining."
        competitor_equivalent: "one45.yaml's documented 'version control and audit trail' is the alternative design — preserve history rather than hard-block the delete. That is a genuine, sourced architectural contrast at this element's granularity."
        gap_severity: "gap"
        gap_note: "Right instinct, wrong escape hatch. Blocking is defensible; routing every legitimate correction through prism-support@exat.com is not, and it lands squarely on new programs who are most likely to need to undo an early mistake."

  # ---------------------------------------------------------------- STEP 5
  - screen: "Courses > Setup > Course Management > Import Course Offerings"
    navigation_path: "Courses > Setup tab > Course Management dropdown > Import Course Offerings > + icon"
    action: >
      For a full-program build, the admin bulk-imports offerings through a
      three-step wizard (prepare/download template → name the instance and
      upload → resolve validation errors and import), then confirms with a
      typed number.
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 707-711; supplemented for the wizard's three named steps and the student-registration caveat by PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Courses/Course Setup.md, 'Import Course Offerings'"
    elements:
      - element: "Download Template (asterisked mandatory columns)"
        type: "template download"
        data_shown: "Columns for term, academic year, start date, end date, professional year, cohort, course; mandatory columns marked with an asterisk."
        gates_on:
          - "'you will need to have set up these term, academic year, start date, end date, professional year, and cohort values in the course organization section before you can add them here, meaning you cannot add any of these values if they have not already been set up in the system. Additionally, you cannot add new courses here' (line 709)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; none of the nine competitor files documents a bulk-import template's column contract."
        gap_severity: "configure-needed"
        gap_note: "The import is a pure join against pre-existing lookup values, which makes steps 1-3 hard prerequisites. Nothing in the wizard tells the admin that before they have already filled the spreadsheet."
      - element: "Import instance Title + Browse to Upload"
        type: "input field + file upload"
        data_shown: "Named import job appearing in the bulk-import instances history table."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Named, retained import instances with a downloadable original file (line 711) is genuinely good onboarding hygiene — it makes a botched day-one import diagnosable."
      - element: "Validation analysis screen (red boxes on values not present in the system)"
        type: "read-only validation rollup"
        data_shown: "Per-cell error highlighting; 'If there are any red boxes, this will alert you that the entered value is not already added in the system. You will either need to edit the template or add the values from the template to the system in order to proceed' (line 711)."
        gates_on:
          - "Import button is gated behind resolving every flagged value."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Pre-commit validation with in-place error display is stronger than the catalog CSV's post-hoc success/fail counts — the two bulk paths in this same stage have inconsistent error UX."
      - element: "Bulk import does NOT register students"
        type: "documented behavioral limit"
        data_shown: "n/a — stated constraint: 'Bulk importing course offerings does not automatically register students to those offerings. Students must be registered separately after the import is complete.'"
        gates_on:
          - "Student registration must be run separately per offering (see step 7)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "Asymmetric with the single-offering path, where selecting a cohort offers to auto-register everyone (line 691). A program that bulk-imports 60 offerings then has 60 separate registration tasks — the exact scale at which they chose bulk."

  # ---------------------------------------------------------------- STEP 6
  - screen: "Course Offering > About"
    navigation_path: "Courses > Course Offerings > click a course offering name > About"
    action: >
      The admin fills in the syllabus-grade metadata for each offering: course
      details, grading scheme, requisites, textbooks, evaluation criteria,
      course policies, attributes, and faculty/staff assignment — then can emit
      it as a Word syllabus or jump straight to mapping.
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 711-733"
    elements:
      - element: "Description text area"
        type: "input field"
        data_shown: "Course description — 'can be viewed and edited by course faculty, and it can be viewed by students on their course page' (line 713)."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-1 (Instruction — advance course information): CODA requires written information to students in advance of each course covering goals/requirements, content, evaluation methods, and how grades and competency are determined. This field plus Evaluation Criteria plus Course Policies plus Grading Scheme are collectively the Prism surface where that packet lives, and it IS student-visible."
        competitor_equivalent: "emedley.yaml documents 'auto-generated curriculum websites' from eCurriculum — a student-facing publication surface for the same content, which is a step beyond a student-visible field on a course page. Sourced and comparable."
        gap_severity: "none"
        gap_note: "Student visibility is confirmed, which is the part CODA 2-1 actually needs."
      - element: "Credits"
        type: "input field (numeric)"
        data_shown: "Credit count — 'This number of credits will be displayed on a curriculum grid if the course is added to a curriculum grid' (line 713)."
        gates_on: []
        accreditation_citation: "None directly — platform-mechanics element. It is the grid-visible weight that makes a curriculum grid legible as a program of study."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Duration (weeks/months), Hours, Clock Hours"
        type: "input field set"
        data_shown: "Clock hours defined in-product as 'the total number of hours per week a student spends attending class or participating in other instructional activities that count toward the student's completion of the program' (line 717)."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.1.b (IPPE duration — minimum clock hours by practice setting) and Key Elements 3.2.b/3.2.d (APPE duration) — clock hours are the literal unit ACPE counts. SLP's 400-hour CFCC requirement runs through the clinical-log side rather than this field, but the same accounting need is present."
        competitor_equivalent: "medhub.yaml documents timesheet-based duty-hour tracking with violation alerts; new-innovations.yaml documents ACGME case-log import. Both are hour-ACCRUAL systems. This Prism field is a declared-hours attribute on the course, not accrual — the two are related but not equivalent, and no competitor teardown documents a declared-clock-hours course attribute."
        gap_severity: "configure-needed"
        gap_note: "Three overlapping duration fields (Duration, Hours, Clock Hours) with one in-product definition between them. For ACPE programs this is exactly where a per-setting hour claim has to reconcile against logged hours, and nothing here links declared to actual."
      - element: "Nature dropdown"
        type: "dropdown, extensible only by vendor"
        data_shown: "Course nature classification."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "'if you would like other nature options, you can always ask our support team at prism-support@exat.com to add new options to this list' (line 715). Same pattern as the Requisite dropdown (line 725): a taxonomy the customer cannot extend themselves. For four brand-new domains whose course natures are not the incumbent disciplines', this is a predictable early support-ticket generator."
      - element: "Core vs. Elective indicator, Department, Field of Study"
        type: "radio + input fields"
        data_shown: "Classification metadata carried onto the syllabus and grid."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-24 (minimum competencies within the scope of general dentistry) — core-vs-elective is the structural marker distinguishing what every graduate must complete from what some do, which is the boundary 2-24 is drawn around."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Share course information with sites (Site Resources page toggle)"
        type: "toggle"
        data_shown: "Exposes course name, rotation dates, and any course resource with its own 'Share with Sites' bit to the Site Resources page (line 717)."
        gates_on:
          - "Two-level gate: the course-level toggle must be on AND the resource-level 'Show on Site Resources page' bit must be on (line 737)."
        accreditation_citation: "ACPE Standard 3, Key Element 3.3.c (preceptor education and development) and COCA Standard 6, Element 6.9 (Clinical Education) — site-visible course expectations are part of how a program evidences that clinical sites know what students are there to achieve."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. No competitor file documents a site-facing course-information surface with a two-level share gate."
        gap_severity: "none"
        gap_note: "The two-level gate is a real support question waiting to happen (resource shared, course not, nothing appears) but is documented explicitly in the transcript."
      - element: "Grading Scheme (pencil icon; letter grade / pass-fail / neither)"
        type: "dropdown set"
        data_shown: "Course-level scheme that 'will automatically apply to all graded learning activities, and the final weighted score for the course will also follow this grading scheme' (line 721)."
        gates_on:
          - "Specific schemes must first be created in Program Details > Setup (line 723) — another pre-existing-lookup dependency."
          - "Per-activity overrides live in Learning Activities Setup, not here (line 721)."
        accreditation_citation: "CODA Standard 2, Element 2-1 ('how grades and competency are determined' must be given to students in advance) and LCME Standard 9, Element 9.8 (Fair and Timely Summative Assessment)."
        competitor_equivalent: "elentra.yaml documents 'gradebook integration for flexible grade scales' inside its Assessment & Evaluation module — a comparable shipped capability at this granularity."
        gap_severity: "none"
        gap_note: ""
      - element: "Attributes section (upper right; pencil icon)"
        type: "multi-select, curriculum-scoped"
        data_shown: "Course-level attribute values (Lifespan, Instructional Methods, SCPE settings, Client System Levels, etc.) — the transcript defers it: 'The Attributes section in the upper right-hand corner of the screen is used for curriculum mapping' (line 717), and 'The attributes you are able to select from here are contingent upon which attributes you activated in the system for that curriculum' (line 1541)."
        gates_on:
          - "Only attributes activated for THIS curriculum are selectable — so a course not yet in a curriculum grid has an effectively empty attributes panel."
        accreditation_citation: "COCA Standard 6, Element 6.4 (osteopathic core competencies incl. OPP/OMM as a taggable course attribute); ACPE Standard 2, Key Element 2.2.d (breadth and depth). CODA Standard 2, Element 2-9 (adequate patient experiences) reads on population/lifespan attributes specifically."
        competitor_equivalent: "elentra.yaml documents 'tag management/mapping' as the mechanism connecting sessions/objectives to standards — structurally the same idea. leo-davinci.yaml documents 'cross-course themes, diagnoses, and procedures tied to patient encounter logs', which is ahead of Prism here: their tags link forward into encounter data, where Prism's course attributes are reporting dimensions only."
        gap_severity: "configure-needed"
        gap_note: "Ordering trap: the Attributes panel appears on the course About screen from day one but only becomes usable after a curriculum grid exists and has activated attributes. A new admin working screen-by-screen will hit an empty dropdown with no explanation of why."
      - element: "Faculty and Staff (+ / pencil; faculty dropdown + multi-role dropdown)"
        type: "assignment widget"
        data_shown: "Faculty/staff assigned to the offering with one or more roles each; removable via trash icon (line 719)."
        gates_on:
          - "Faculty must already exist in the system (Tutorial 11/16 Setting up Faculty)."
          - "Downstream, Program Details > Faculty Dashboard Configuration decides whether those faculty can see 'your program's curriculum grids' at all (line 1187)."
        accreditation_citation: "CODA Standard 3, Element 3-4 (faculty evaluation process) and ACPE Standard 3, Key Element 3.3.a (preceptor criteria) both need a defensible record of who was responsible for what instruction; this assignment is that record on the didactic side."
        competitor_equivalent: "one45.yaml documents the Canvas Alignment Tool syncing 'learning-event and facilitator data' — i.e. one45 can populate faculty-to-session assignment from the LMS rather than by hand. Sourced and comparable; Prism's path is manual."
        gap_severity: "none"
        gap_note: "Multi-role-per-faculty is supported, which matters in small programs where one person is course director, lecturer, and advisor."
      - element: "Generate Syllabus (checkbox picker > Download, Word .docx output)"
        type: "document generator"
        data_shown: "Per-section checkboxes selecting what goes into the syllabus; output is a Microsoft Word document (line 731). The OT playbook enumerates the configurable columns: school logo, course details, pre/co-requisites, textbooks/resources, faculty & staff, attributes, evaluation criteria, course policies, measures, event schedule, grading scheme."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-1 (advance written course information to students) — most directly. ACOTE C.1.x-equivalent syllabus requirements are documented in the OT playbook as satisfied by this exact feature. CODA Standard 2, Element 2-8 also reads on it as the artifact a curriculum-review cycle inspects."
        competitor_equivalent: "emedley.yaml documents 'auto-generated curriculum websites' — a live, always-current publication surface versus Prism's point-in-time Word export. That is a real capability difference at this element's granularity, and the direction favors eMedley for anything students consume continuously."
        gap_severity: "configure-needed"
        gap_note: "Word export means the syllabus is a snapshot: it does not update when the underlying course or mapping changes, and there is no documented version stamp on the generated file. For CODA 2-1's 'in advance of each course' obligation a program has to manage regeneration cadence themselves."
      - element: "Go to Mapping button (upper right)"
        type: "navigation button, conditional"
        data_shown: "Jumps to this course's curriculum-mapping page."
        gates_on:
          - "Appears only 'If this course has been associated with a curriculum' (line 731)."
        accreditation_citation: "None — navigation element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "The conditional appearance is the clearest in-product signal a new admin gets that curriculum-grid membership is a prerequisite for mapping."

  # ---------------------------------------------------------------- STEP 7
  - screen: "Course Offering > Student Registration"
    navigation_path: "Course offering page > left-side menu > Student Registration"
    action: >
      The admin populates the roster — either by filtering and selecting
      students in-app, or by uploading an Excel list keyed on email address.
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 745-759"
    elements:
      - element: "Select to Register (left-side filters: student name, cohort, group, tag, enrollment term, graduation term, campus, student category > Search Record > select > Register)"
        type: "filtered multi-select"
        data_shown: "Filtered student table (name, cohort, group, enrollment term, graduation term, campus, student category) with select-all checkbox."
        gates_on:
          - "Depends entirely on student records and cohort/group/tag taxonomy created in the earlier onboarding stage (Tutorial 2/16 Setting up Students)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "medhub.yaml documents UME 'course enrollment/waitlists/lottery scheduling' via eValue — a materially richer enrollment model (waitlists, lotteries) than Prism's select-and-register. Sourced and comparable at this element's granularity."
        gap_severity: "none"
        gap_note: ""
      - element: "Upload List to Register (Excel template: serial number, first name, last name, email address)"
        type: "bulk import"
        data_shown: "Post-upload table showing located vs. not-located students, with not-located rows grayed out (line 755)."
        gates_on:
          - "Match is on email address only — 'the student's name is unimportant to the import process. It is most important that you add the student's email address in the address column correctly' (line 753)."
          - "Students must already exist AND be status Active — 'If the student is assigned the inactive or graduated status, they will not be registered successfully' (line 753)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Email-as-primary-key with a silent gray-out for misses is a quiet data-quality risk on a first-year bulk load: a typo produces a student who looks registered on the roster spreadsheet and is not registered in Prism."
      - element: "Unregister (action column) with data-loss warning and typed-number confirmation"
        type: "destructive action"
        data_shown: "'Unregistering a student removes their access to the course page and all their placement data and saved or submitted learning activity data' (line 759)."
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.9 and CODA Standard 1, Element 1-2 both assume the program retains its outcome record; destroying submitted learning-activity data on unregistration is in tension with that retention expectation."
        competitor_equivalent: "one45.yaml's documented 'version control and audit trail' is the design that avoids this. Sourced and comparable."
        gap_severity: "gap"
        gap_note: "Hard-delete of submitted student work on unregistration, guarded only by a typed-number dialog. A new admin cleaning up a mis-registered roster in week 3 can destroy real submissions with no recovery path documented anywhere in the transcript."

  # ---------------------------------------------------------------- STEP 8
  - screen: "Course Offering cloning (Actions > Clone, and Clone From on the course page)"
    navigation_path: "Courses > Course Offerings > Actions column > Clone  |  Course offering page > Clone From (upper right)"
    action: >
      Rather than rebuilding each term, the admin clones a configured offering
      forward — either forward (Clone, prefilled from source, change cohort/AY)
      or backward (create empty offerings first, then Clone From a populated
      sibling of the same parent course).
    confirmed_by: "exxat_transcripts.md, '8/16 Setting Up Courses in Exxat Prism', lines 791-801"
    elements:
      - element: "Clone drawer, step 1: prefilled attribute fields requiring change"
        type: "prefilled form"
        data_shown: "All source-offering fields prefilled; 'Since two core offerings cannot have identical details, you will be required to update certain attributes' (line 793)."
        gates_on:
          - "Same uniqueness constraint as manual creation — term/AY/PY (+ additional identifier) must differ."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Clone drawer, step 2: import selectors (About, Course Measures, Resources, Learning Activities, Attestations)"
        type: "checkbox set"
        data_shown: "Which sections of the source offering are copied (line 795)."
        gates_on:
          - "Cloned attestation due dates are NOT copied — 'you will need to add a date to these attestations if you choose to clone them' (line 801)."
        accreditation_citation: "CODA Standard 2, Element 2-8 (curriculum management plan) — cloning course measures forward is how a program preserves an approved objective set across cycles rather than re-typing it, which is the maintenance behavior 2-8 wants evidence of."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; no competitor file documents an offering-level clone with per-section import selectors."
        gap_severity: "cosmetic"
        gap_note: "The silently-dropped attestation due date is a documented papercut, not a structural gap — but it is exactly the kind of thing a first-time admin discovers when a student complains an attestation never came due."
      - element: "Clone From: red alert icon on sections that already have data"
        type: "inline warning"
        data_shown: "'if you see this red alert icon, this means that the course you are cloning to already has information populated in the selected sections. This means that this previously added course information will be lost if you complete the cloning process' (line 799)."
        gates_on:
          - "Both offerings must share the same parent course (line 797)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Overwrite is warned pre-commit at section granularity, which is better than the unregister flow's blanket warning."

  # ---------------------------------------------------------------- STEP 9
  - screen: "Program Details > Standards"
    navigation_path: "Dashboard or upper-left menu > Program Details > Standards tab"
    action: >
      The admin (usually with the curriculum committee) activates the
      pre-loaded accreditation/professional standard set for their domain and
      adds any program-specific standard set — PLOs, SLOs, program goals — that
      the curriculum will also be mapped against.
    confirmed_by: "exxat_transcripts.md, '14/16 Performing Curriculum Mapping in Exxat Prism', lines 1503-1513; cross-referenced to line 49 of the same transcript ('You can add standards to be mapped to course measures in the Curriculum Mapping section')"
    elements:
      - element: "Accreditation and Professional Standards list (pre-loaded, expandable parent > child > grandchild hierarchy)"
        type: "read-only hierarchical library"
        data_shown: "'We will preload the latest version of standards relevant to your domain' (line 1503); arbitrary-depth nesting — 'There may be additional children standards within a child standard.'"
        gates_on:
          - "Only activated sets become selectable as mapping targets in the curriculum grid setup."
        accreditation_citation: "This is THE element where the accreditor taxonomy itself lives: COCA Standard 6, Element 6.4; ACPE Standard 2, Key Element 2.2.d; CODA Standard 2, Element 2-8; LCME Standard 9, Element 9.4. Per prior work in content/journeys/competency-verification.yaml stage 8, this same Standards library plus the Heatmap Report is the evidence base cited for COCA Element 11.9 (annual/mid-cycle reports) and CODA Element 1-2 (institutional effectiveness) — this file does not re-derive that, it inherits it."
        competitor_equivalent: "elentra.yaml is the strongest documented comparison: Elentra's Accreditation feature page names LCME/COCA/CACMS/ACPE/CODA/ARC-PA as supported standard sets and claims >40% CACMS DCI coverage, and Elentra is an AAMC Curriculum Inventory participating vendor with native MedBiquitous support. emedley.yaml and new-innovations.yaml also document direct AAMC Curriculum Inventory submission. Prism has no documented AAMC CI or MedBiquitous story anywhere in this corpus — a concrete, sourced deficit at exactly this element."
        gap_severity: "gap"
        gap_note: "Pre-loading is CONFIRMED only for ARC-PA (PA playbook: 'ARC-PA accreditation standards come pre-loaded'), ACOTE 2023 across all four degree levels plus NBCOT (OT playbook), the AACN Essentials plus accreditor standards (Nursing playbook: 'come pre-populated'), and CAA/CFCC (SLP playbook). It is UNCONFIRMED for all four expansion domains — no source in this corpus shows COCA, CODA, ACPE, or LCME standards pre-loaded. The screen supports adding them by hand; that is not the same product experience."
      - element: "Activate button / Activate Standard toggle (per set, via pencil icon)"
        type: "toggle, destructive on deactivate"
        data_shown: "Active vs. inactive state of a whole standard set."
        gates_on:
          - "'if this standard has been mapped, curriculum mapping data related to this standard will be lost' (line 1505)."
        accreditation_citation: "Same set as above — activation is what makes a standard a legal mapping target, so it gates every downstream COCA 6.4 / ACPE 2.2.d / CODA 2-8 / LCME 9.4 evidence artifact."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — competitor materials describe which standard sets are supported, never an activate/deactivate control with documented data-loss semantics."
        gap_severity: "gap"
        gap_note: "Irreversible data loss behind a single toggle, with the warning delivered in narration rather than (per the transcript) a typed-number confirmation like the ones guarding course deletion. Standards get toggled during accreditor version transitions — exactly the moment mapping history matters most."
      - element: "Standard Name text box (editable) + export icon (Excel)"
        type: "input field + export"
        data_shown: "Editable display name for a pre-loaded standard set; Excel export 'for offline access' (line 1505)."
        gates_on: []
        accreditation_citation: "None directly — but renaming a pre-loaded accreditor set is a traceability risk against COCA 6.4 / CODA 2-8 evidence, since the exported crosswalk will carry the local name, not the accreditor's."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Editable accreditor-standard names with no 'as-published' original retained is a small integrity gap in an otherwise well-structured library."
      - element: "Program Specific Standards (+ icon > set name > Add Standard > standard code / Standard Description / Annotations; nested children via + to the left of a standard)"
        type: "hierarchical input field set"
        data_shown: "Arbitrary-depth custom standard trees — transcript examples are 'program learning outcomes, student learning outcomes, and program goals' (line 1507). Codes are alphanumeric and the system appends the trailing period; the convention for children is parent code + identifier (1 → 1A)."
        gates_on:
          - "A set that has been mapped cannot be deleted (line 1513)."
        accreditation_citation: "CSWE EPAS AS 3.1.1 / 3.1.2 (nine generalist competencies) and AS M3.2.1/M3.2.2 (specialized practice) per the Social Work playbook — CSWE's generalist-plus-specializations structure is implemented in Prism precisely as one custom standard set per framework here. Also ACPE 2.2.d, where COEPA outcomes beyond ACPE's own 2.1.a-m live."
        competitor_equivalent: "one45.yaml documents 'standardized vocabularies aligned to CanMEDS and AAMC competency frameworks' — pre-built frameworks rather than a custom-set builder. Prism's builder is more open; one45's is more turnkey. Both directions are sourced."
        gap_severity: "none"
        gap_note: "This is the strongest element in this stage for the four expansion domains: even without a pre-loaded COCA/CODA/ACPE/LCME set, the custom-set builder demonstrably carries a real accreditor hierarchy (CSWE's is already run this way in production per the SW playbook). The gap is pre-load convenience, not capability."

