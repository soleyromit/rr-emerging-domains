      attaching mapping-level attributes, tags, rationale notes, and evidence
      documents to each standard association.
    confirmed_by: "exxat_transcripts.md, '14/16 Performing Curriculum Mapping in Exxat Prism', lines 1561-1575"
    elements:
      - element: "Measure-category left rail with mapped-count badges"
        type: "read-only progress rollup"
        data_shown: "'Each course measure category will have a helpful count displaying how many measures have been mapped' (line 1563)."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element. It is the in-course progress signal that aggregates into the Mapping Summary's program-level progress view."
        competitor_equivalent: "leo-davinci.yaml documents an 'Insights Dashboard' showing 'real-time mapping-completion status (green checkmarks for finished mappings, flags for gaps)' — the same need, solved at program level rather than in-course. Sourced and comparable."
