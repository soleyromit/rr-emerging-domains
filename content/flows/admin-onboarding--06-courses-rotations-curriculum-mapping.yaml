  # ---------------------------------------------------------------- STEP 11
  - screen: "Curriculum Mapping > Attributes"
    navigation_path: "Upper-left hamburger menu > Curriculum Mapping > Attributes (left-hand menu)"
    action: >
      The admin builds the two attribute taxonomies that make a map
      interpretable rather than merely complete: Course and Measure Attributes
      (what the content IS) and Mapping Attributes (what the student DOES with
      it). Optional in the product's own words, and the single biggest
      determinant of whether the resulting reports answer an accreditor.
    confirmed_by: "exxat_transcripts.md, '14/16 Performing Curriculum Mapping in Exxat Prism', lines 1517-1525; Bloom's/Leo details from PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping/Managing Bloom-s Taxonomy using Leo-AI.md"
    elements:
      - element: "Course and Measure Attributes (+ icon > category name > Active toggle; horizontal ellipses > Add Child > option name)"
        type: "two-level taxonomy builder"
        data_shown: "Transcript's worked example is Lifespan → infants, children, adolescents, adults, older adults (line 1523). 'We will provide some default attributes for you which are specific to your discipline' (line 1519). Confirmed live per discipline: Lifespan / ARC-PA Themes / SCPE settings / Interprofessional Education / Instructional Methods / Assessment Methods (PA playbook); population tagging by age group (OT playbook); Client System Levels — Individuals, Families, Groups, Organizations, Communities (SW playbook); lifespan, assessment methods, teaching tools (Nursing video, line 31 of NursingTutorialsTranscripts.md)."
        gates_on:
          - "Attributes must exist here before a curriculum grid can select them, and must be selected into a grid before a course can assign values (line 1541)."
        accreditation_citation: "COCA Standard 6, Element 6.4 (osteopathic core competencies — OPP/OMM as a course attribute); CODA Standard 2, Element 2-9 (adequate patient experiences — population/lifespan coverage); ACOTE A.5.1 per the OT playbook (lifespan and setting breadth is evidenced by attribute-usage reports); CSWE EPAS AS M3.2.1/M3.2.4/AS 5.0.1(a) per the SW playbook (Client System Levels cross-referenced across three standards)."
        competitor_equivalent: "elentra.yaml documents tag management as its mapping mechanism and 'searching within attached files'; leo-davinci.yaml documents 'cross-course themes, diagnoses, and procedures' as mappable dimensions tied to encounter logs. Both are sourced and comparable; Leo/DaVinci's are ahead because their tags reach into patient-encounter data, where Prism's course/measure attributes are curriculum-side only."
        gap_severity: "configure-needed"
        gap_note: "Discipline-default attributes are confirmed for PA, OT, SW, and Nursing and unconfirmed for DO, Pharmacy, Dentistry, and Medicine. The taxonomy builder is domain-agnostic, so this is a content-seeding gap, not an engineering one — but it is the difference between a new DO program starting from a populated Lifespan/OPP taxonomy and starting from an empty screen."
      - element: "Mapping Attributes (same builder, separate section)"
        type: "two-level taxonomy builder"
        data_shown: "Assigned at the moment a standard is mapped, not to the course itself. Transcript's example: Knowledge → introduce, reinforce, demonstrate (line 1523). PA playbook confirms the production shape: 'mapping attributes classify content as knowledge-based, skill-based, or behavior-based, and define instructional level (beginner/intermediate/advanced).'"
        gates_on:
          - "Selected per mapping instance in the curriculum grid's Select Standards for Mapping step (line 1535)."
        accreditation_citation: "COCA Standard 6, Element 6.4 — a curriculum map showing WHERE each competency is taught and assessed implies depth, which is what introduce/reinforce/demonstrate encodes. ACPE Standard 2, Key Element 2.2.d ('breadth AND DEPTH'). CODA Standard 2, Element 2-8 (surfacing redundancy requires knowing at what level a topic recurs)."
        competitor_equivalent: "leo-davinci.yaml documents mapping to 'multiple competency sets and Entrustable Professional Activities (EPAs)' with an Insights Dashboard flagging gaps; elentra.yaml documents objective/competency/session mapping to standards. Neither competitor file documents a separate mapping-time attribute layer distinct from the tag itself — this two-layer design (what it is vs. how deeply it is taught) appears to be a genuine Prism differentiator, though the absence of a documented competitor equivalent may reflect their marketing depth rather than a real absence."
        gap_severity: "none"
        gap_note: "This is the mechanism behind the crosswalk report accreditors like — the Nursing video describes exactly this output: 'Each cell represents whether the content taught is knowledge based, skill-based, or behavior based. It also identifies whether the concept is introduced, reinforced, or demonstrated in that course.'"
      - element: "Bloom's Taxonomy as a configured attribute + Leo-AI level suggestion"
        type: "attribute category + AI suggestion"
        data_shown: "Leo reads the action verbs in a measure and suggests the Bloom's level; with multiple verbs it suggests the highest. Suggestions appear only if Bloom's is configured AND enabled as a mappable attribute; they refresh when measure text is edited, a curriculum is cloned, or the Bloom's setup changes; and they never auto-apply."
        gates_on:
          - "Requires Bloom's set up under Curriculum Mapping > Attributes > Course and Measure Attributes."
          - "Requires the Map with Leo consent flow (Program Details > AI Consent; toggled at Program Details > Setup > AI Features Hub)."
        accreditation_citation: "Per the Nursing playbook, Auto-Suggest Bloom's Taxonomy is used as COA Standard E.6 evidence ('helping programs write more rigorous, measurable objectives')."
        competitor_equivalent: "No competitor teardown in content/competitors/ documents AI-assisted curriculum mapping or Bloom's-level suggestion at all. one45.yaml's 'standardized vocabularies' and elentra.yaml's tag management are both manual. This is a documented Prism-ahead element — and the only one in this stage where Prism leads every competitor in this research."
        gap_severity: "none"
        gap_note: "Human-in-the-loop by design ('Leo tracks suggestions in the background, but never applies them without your action'), with withdrawable consent and a data-deletion right — the correct posture for a feature touching accreditation evidence. Note the onboarding cost: two separate prerequisites (attribute configured + consent granted) before a new admin sees any suggestion."

  # ---------------------------------------------------------------- STEP 12
  - screen: "Curriculum Mapping > Add Curriculum (4-step wizard)"
    navigation_path: "Curriculum Mapping > Add Curriculum > Details > Course selection > Mapping Setup > Curriculum Grid preview"
    action: >
      The admin assembles the actual grid: names it, selects which offerings
      belong to it, declares which measures are in play, chains measures/courses
      to standard sets, picks the attributes to capture, previews the grid, and
      saves. This is the object every mapping report runs against.
    confirmed_by: "exxat_transcripts.md, '14/16 Performing Curriculum Mapping in Exxat Prism', lines 1525-1539"
    elements:
      - element: "Curriculum Name + Description"
        type: "input field set"
        data_shown: "Naming convention guidance is in the transcript: 'lockstep schools commonly use the name of the cohort for the curriculum name'; non-lockstep programs 'use curriculum to keep track of groups of courses within an academic year' (lines 1525-1527)."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "The constraint that makes naming strategic is stated once, in passing: 'You will be able to run reports across a curriculum grid, but you cannot run reports on multiple grids simultaneously. Please keep this in mind while you are creating a curriculum grid' (line 1525). The Nursing playbook shows the cost — programs configure 'a separate grid per degree/track (ADN/BSN/MSN/DNP/specialty)', which by this rule means no single report spans the school's whole curriculum. Same problem for CSWE generalist-plus-specializations and for any DO/PharmD program with dual tracks."
      - element: "Course selection (search by number/name; filter by academic year, professional year, section, term, cohort > Search Record > multi-select table)"
        type: "filtered multi-select"
        data_shown: "Course number, course name, academic schedule, assigned cohort (line 1529)."
        gates_on:
          - "Only existing course offerings are selectable — steps 3-5 are hard prerequisites."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "elentra.yaml documents filtering 'by cohort, course, or objective set' in Curriculum Explorer — parity at this granularity."
        gap_severity: "none"
        gap_note: ""
      - element: "Select Course Measures (Add or Edit Course Measures; per-measure activation bit; reorder arrows/drag; Attributes dropdown)"
        type: "toggle list + multi-select"
        data_shown: "Every active program-wide measure, all initially on; deactivate per curriculum. 'The order of these course measures is reflected in the measures section within courses and the mapping page of courses' (line 1531)."
        gates_on:
          - "The Attributes dropdown here chooses WHICH TYPES of attributes measures can carry, not values — 'you are not assigning specific attributes to specific measures here' (line 1533)."
        accreditation_citation: "ACPE Standard 2, Key Element 2.2.d; CODA Standard 2, Element 2-8; COCA Standard 6, Element 6.4 — this is the screen that scopes what the map is capable of expressing before any mapping happens."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "The type-vs-value distinction is genuinely confusing and the transcript has to stop and disclaim it. A new admin who under-selects here silently caps what every downstream report can show, and correcting it means editing the curriculum after mapping has begun."
      - element: "Select Standards for Mapping (Mapping From: course or course measure | Mapping To: an activated standard set | Attributes) > Add, repeatable"
        type: "mapping-chain builder"
        data_shown: "A table of mapping instances; multiple chains supported — the transcript walks through mapping the entire course to two different standard sets as separate entries (line 1535)."
        gates_on:
          - "Mapping To offers only standard sets activated in Program Details > Standards (step 9)."
          - "Mapping From = course is the macro level, = course measure is the micro level: 'by mapping standards to the entire course, you can track student progress at a more macro level, and mapping standards to course objectives is a detailed method' (line 1533)."
        accreditation_citation: "This element is where a program decides the GRAIN of its accreditation evidence. COCA Standard 6, Element 6.4 and ACPE Standard 2, Key Element 2.2.d are answerable at either grain but far more credibly at measure grain; CODA Standard 2, Element 2-8's redundancy detection effectively requires measure grain; LCME Standard 9, Element 9.4 (all students held to the same objectives) requires it."
        competitor_equivalent: "leo-davinci.yaml documents mapping 'every session in every course' — SESSION grain, finer than Prism's course-or-measure choice. elentra.yaml documents mapping 'course objectives, competencies, and individual teaching sessions'. Both competitors document a finer default grain than Prism's coarsest option, which is a real, sourced difference at this element."
        gap_severity: "none"
        gap_note: "Supporting both grains simultaneously, with multiple standard sets per grain, is genuinely strong — it is what lets one grid answer an accreditor, a licensure blueprint, and internal SLOs at once (the Cumulative Report's whole premise)."
      - element: "Select Attributes for Courses (+ icon at bottom of Mapping Setup)"
        type: "multi-select"
        data_shown: "Which course-level attribute categories this grid captures — transcript example: lifespan and assessment methods (line 1537)."
        gates_on:
          - "Determines what the course About page's Attributes panel offers (line 1541) — resolving the empty-dropdown trap noted in step 6."
        accreditation_citation: "ACOTE A.5.1 per the OT playbook (lifespan/setting breadth evidence); COCA Standard 6, Element 6.4; CSWE AS M3.2.1 (Client System Levels)."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Curriculum Grid preview (courses grouped by academic year and professional year, then by term)"
        type: "read-only preview"
        data_shown: "The final sequence before save; back-navigation to any prior step is supported (line 1537)."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-8 and CSWE AS 3.1.1 (per the SW playbook, the Curriculum Grid is cited directly as the 'term-by-term sequencing view' evidence artifact)."
        competitor_equivalent: "elentra.yaml documents a 'Curriculum Matrix' tool — the closest named competitor equivalent to this grid, and sourced."
        gap_severity: "none"
        gap_note: "This preview is the first moment a new admin sees whether the term ordering they set in step 1 actually produces a legible program of study — roughly two to four weeks after they set it."
      - element: "Brown 'P' indicator next to course names in the saved grid"
        type: "read-only indicator"
        data_shown: "'This brown P indicates that the course is placement related' (line 1539)."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Elements 3.1.a/3.2.b/3.2.d (IPPE/APPE structure, duration, required settings) and COCA Standard 6, Element 6.9 — the experiential subset of the curriculum is what these standards are drawn around, and this indicator is how it reads off the grid."
        competitor_equivalent: "leo-davinci.yaml documents mapping sessions 'didactic or clinical' as a first-class distinction. Sourced and comparable."
        gap_severity: "cosmetic"
        gap_note: "A single-letter color-coded indicator carrying a meaningful distinction is a small accessibility concern; the transcript documents no legend or text alternative."

  # ---------------------------------------------------------------- STEP 13
  - screen: "Course page (within a curriculum) > Attributes / Event Schedule / Measures"
    navigation_path: "Curriculum Mapping > select a curriculum > click a course name"
    action: >
      Per course, and the transcript is blunt that this is per course with no
      shortcut — 'You will need to complete this setup individually for all of
      the courses in the curriculum' (line 1541) — the admin assigns attribute
      values, optionally builds an event schedule, and enters the actual
      objective text with codes, attributes, tags, evidence documents, child
      measures, and cross-links.
    confirmed_by: "exxat_transcripts.md, '14/16 Performing Curriculum Mapping in Exxat Prism', lines 1541-1561"
    elements:
      - element: "Attributes section (pencil icon > per-category value dropdowns)"
        type: "multi-select per category"
        data_shown: "Values from the categories the grid activated — transcript example: 'if students will work with infants and children in this course, select the Lifespan dropdown and select the Infants and Children values' (line 1543)."
        gates_on:
          - "Selectable set is 'contingent upon which attributes you activated in the system for that curriculum' (line 1541)."
        accreditation_citation: "ACOTE A.5.1 (OT playbook: 'Population Tagging — course measure attributes tagged by population group... to demonstrate breadth of exposure'); CODA Standard 2, Element 2-9; COCA Standard 6, Element 6.4."
        competitor_equivalent: "elentra.yaml tag management; leo-davinci.yaml cross-course themes. Both sourced and comparable, both operating at session rather than course grain."
        gap_severity: "none"
        gap_note: ""
      - element: "Event Schedule (Add Event: title, date, start/end time, faculty multi-select, location, Browse to Upload reference materials + notes)"
        type: "scheduling table + file upload"
        data_shown: "Course calendar of lectures/topics/exams. 'Events added to the event schedule can be linked with measures to keep track of how the two are related' (line 1543)."
        gates_on:
          - "'Students cannot view the event schedule. This section is mainly used for your own reference or for collaborating with course faculty' (lines 1543-1545)."
        accreditation_citation: "CODA Standard 2, Element 2-1 (advance course information to students) is NOT satisfied by this element specifically, because it is explicitly not student-visible — the syllabus generator, not this, carries that obligation. It does support CODA Standard 2, Element 2-8's evidence of what was actually delivered."
        competitor_equivalent: "one45.yaml documents the Canvas Alignment Tool syncing 'learning-event and facilitator data' from the LMS — i.e. one45 populates the equivalent of this schedule automatically from where faculty already work. Prism's is hand-entered. Sourced, and a real difference."
        gap_severity: "configure-needed"
        gap_note: "Hand-entered, non-student-visible, and duplicative of whatever the institution's LMS already holds. Realistically the first thing a busy new admin skips — which then costs them the measure-to-event linking and the Measure Linking Report downstream."
      - element: "Measures section (+ per category: Code, Description, Notes, attribute dropdowns, Tags, Browse to Upload related document)"
        type: "input field set + file upload"
        data_shown: "Code and Description are both required before save (line 1551). Related document is 'an artifact or evidence that supports the mapping of attributes and standards to this measure' (line 1555)."
        gates_on:
          - "Attribute dropdowns shown here are only those the curriculum's measure-attribute setup selected."
        accreditation_citation: "ACPE Standard 2, Key Element 2.2.d; COCA Standard 6, Element 6.4; CODA Standard 2, Element 2-5 (evaluation methods must measure DEFINED competencies — this is where they are defined); ARC-PA 6th ed. B1.01 a-d / B1.02 per the PA playbook."
        competitor_equivalent: "one45.yaml's 'centralized repository linking objectives, sessions, and assessments' is the closest sourced equivalent. No competitor teardown documents per-objective evidence-file attachment, which is a Prism-ahead detail at this granularity."
        gap_severity: "gap"
        gap_note: "No bulk import for measures is documented anywhere in the admin transcript or the help-center Curriculum Mapping folder — yet the Nursing CBE video claims objectives 'can either be entered directly into the system or imported in bulk to save time' (NursingTutorialsTranscripts.md line 31). That contradiction is unresolved in this corpus and matters enormously: hand-entering every objective for every course in a DO or PharmD curriculum is the single largest labor item in this entire onboarding stage. FLAG FOR VERIFICATION with product before repeating either claim externally."
      - element: "Tags on a measure (+ icon > select tag / Add New Tag with name + color picker)"
        type: "tag picker + creator"
        data_shown: "Internal workflow tags — transcript's worked example is a curriculum-committee review loop: a faculty member assigns a 'Needs Review Measure' tag, 'You can generate a report to view all the Needs Review Measure tags, view the tags that need review, and change the status of these tags once they are reviewed' (line 1553)."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-8 (curriculum management plan — 'ongoing curriculum review process with input from faculty/students/administration') — this tag-plus-report loop is the closest thing in shipped Prism to an in-product curriculum-review workflow, which is exactly what 2-8 asks a program to evidence."
        competitor_equivalent: "one45.yaml's 'version control and audit trail' addresses the same governance need through history rather than through workflow tags. leo-davinci.yaml's Insights Dashboard flags mapping gaps but is not documented as a review-assignment mechanism. Both sourced; neither is the same shape."
        gap_severity: "configure-needed"
        gap_note: "It is a tagging convention, not a workflow: no assignee, no due date, no state machine, no notification. It satisfies CODA 2-8 as a paper trail only if the program disciplines itself into using it consistently."
      - element: "Child measures (horizontal ellipses > Add Child) and measure/event Linking (link icon)"
        type: "hierarchy + cross-reference"
        data_shown: "Sub-measures under a measure; links from a measure to course events and to measures in OTHER categories — 'Measures cannot be linked with other measures added to the same category' (line 1559)."
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-8 (surfacing gaps and redundancies across the map benefits directly from an explicit outcome→objective→event chain); COA Standard E.5 sequencing evidence per the Nursing playbook."
        competitor_equivalent: "one45.yaml's objectives-sessions-assessments repository is the sourced equivalent for the objective→event half. No competitor teardown documents a cross-category measure-to-measure link."
        gap_severity: "none"
        gap_note: "The transcript's rationale is exactly right: 'if you have a specific learning outcome which has objectives and events which helped you achieve that particular outcome' (line 1559) — this is how a program shows an outcome is actually delivered, not merely declared."
      - element: "Reorder button / Delete All per measure category"
        type: "bulk action, destructive"
        data_shown: "Drag or arrow reordering; category-wide delete."
        gates_on:
          - "'if you have performed curriculum mapping on any measure in this measure category, this mapping data will be lost' (line 1561)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "one45.yaml's version control and audit trail is the sourced counterexample."
        gap_severity: "gap"
        gap_note: "A 'Delete All' button sitting next to 'Reorder', destroying mapping data, guarded (per the transcript) by narration alone rather than the typed-number confirmation used for lesser deletions elsewhere in the same product. Inconsistent destructive-action guarding is a real onboarding risk."

