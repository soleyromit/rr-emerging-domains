        gates_on:
          - "Only available if 'you... have selected standards to be mapped to courses when setting up the curriculum' (line 1563)."
        accreditation_citation: "COCA Standard 6, Element 6.4 and ACPE Standard 2, Key Element 2.2.d are both answerable at this grain, less credibly than at measure grain."
        competitor_equivalent: "elentra.yaml and leo-davinci.yaml both document finer default grain (course objectives and individual sessions respectively). Sourced."
        gap_severity: "none"
        gap_note: ""
      - element: "Standard picker (+ icon per standard set; expand parents; parent checkbox selects all children; multi-select)"
        type: "hierarchical multi-select"
        data_shown: "The activated standard hierarchy from step 9; 'To select all the children standards of a parent standard at the same time, select the checkbox next to that parent standard' (line 1567)."
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.4; ACPE Standard 2, Key Element 2.2.d; CODA Standard 2, Element 2-8; LCME Standard 9, Element 9.4; ARC-PA 6th ed. B1.01/B1.02; CSWE AS 3.1.1/3.1.2; AACN Essentials domains/competencies/sub-competencies per the Nursing video. This element IS the crosswalk every one of those standards asks for."
        competitor_equivalent: "elentra.yaml (tag-based standard linkage, >40% CACMS DCI coverage, AAMC CI vendor), emedley.yaml (LCME standards + AAMC CI vendor), new-innovations.yaml (direct submission to the AAMC Curriculum Inventory portal), e-value.yaml (AAMC Curriculum Survey + MedBiquitous alignment, CIR integration). Four separate competitors document standards-mapping WITH a documented external submission or interchange path. Prism's documented output is Excel/Word export. That is the sharpest sourced competitive deficit in this stage."
        gap_severity: "gap"
        gap_note: "The mapping itself is at parity or better; the interchange is not. For MD/DO specifically, a program that must feed the AAMC Curriculum Inventory has a named, shipped path with Elentra, eMedley, New Innovations, and E*Value, and a manual export with Prism."
      - element: "Parent-standard select-all checkbox"
        type: "bulk-select shortcut"
        data_shown: "Selects every child standard of a parent in one click (line 1567)."
        gates_on: []
        accreditation_citation: "Same set as the standard picker — but with an integrity caveat: bulk-claiming every child of a parent is precisely the over-mapping pattern a site visitor probes, and CODA Standard 2, Element 2-8's redundancy-detection duty cuts against it."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "A speed feature that makes over-mapping one click cheaper than accurate mapping. No documented warning, and the Heatmap will happily render the inflated counts as dark cells."
      - element: "Per-mapping pencil: mapping-level attributes, Tags, Notes, Browse to Upload related document"
