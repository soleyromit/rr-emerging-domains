        accreditation_citation: "CSWE EPAS AS 3.1.1 and AS M3.2.1 per the SW playbook (Cumulative Report named directly as competency-coverage evidence); ACPE Standard 2, Key Element 2.2.d; COCA Standard 6, Element 6.4. The Nursing playbook adds that this report is 'modeled directly on AACN's own Essentials Toolkit crosswalk template' — and the Nursing video invites the comparison explicitly (NursingTutorialsTranscripts.md line 39)."
        competitor_equivalent: "e-value.yaml documents curriculum mapping 'explicitly aligned to the AAMC Curriculum Survey and MedBiquitous Curriculum Standards' with CIR integration — an equivalent multi-framework crosswalk WITH a named external interchange target. Prism's is an Excel file. Sourced, and the gap is interchange, not content."
        gap_severity: "none"
        gap_note: "Multi-framework-in-one-view (accreditor + licensure blueprint + SLOs + attributes simultaneously) is the payoff for the multi-chain mapping setup in step 12 and is the report discipline playbooks reference most."
      - element: "Per-standard tab: Mapped Standards bar, All Standards / Unmapped Standards dropdown, per-standard course list, Narrative (+ icon), Customize Your View, export to Word/Excel with child-standard inclusion option"
        type: "report with editable narrative + configurable export"
        data_shown: "Standards used out of total; courses per standard; expandable to course objectives. Narrative is authored in-report: 'This narrative can be helpful when meeting with your accreditation body' (line 1591)."
        gates_on:
          - "'Please note that the data populated in the exported file will depend on how you customize the report. So make sure you configure the report to your preferences before you export' (line 1593)."
        accreditation_citation: "COCA Standard 6, Element 6.4 submission; ACPE Standard 2, Key Element 2.2.d; CODA Standard 2, Element 2-8; CAA/CFCC standards per the SLP playbook ('Mapped Standards Report highlights standards that are insufficiently covered'); COA Standard E.2 per the Nursing playbook (Standards-Based plus Unmapped Standards as a paired gap check)."
        competitor_equivalent: "leo-davinci.yaml flags gaps on an Insights Dashboard; emedley.yaml provides 'gap-and-overlap analysis'; core-elms.yaml sells gap assessment as the CompMS add-on. All three sourced. None of the three documents an in-report authored narrative field, which is a Prism-ahead detail — narrative-next-to-evidence is exactly the self-study shape."
        gap_severity: "none"
        gap_note: "The Unmapped Standards view is the single most useful screen in this stage for a NEW admin: it is the only place that answers 'am I done?' with a list rather than a feeling."
      - element: "Mapping Level Attribute report / crosswalk (Standards picker, Courses picker, Attributes picker, view selector: With Assigned and Unassigned / Only Assigned / Only Unassigned > export icon)"
        type: "multi-axis configurable Excel export"
        data_shown: "Rows = standards, columns = courses broken down into measures, cells = whether mapped and which attributes were selected. 'Courses are organized by academic schedule so that earlier courses appear on the left and newer courses appear on the right... This report is used to demonstrate that student learning level, knowledge, skills, or other attributes graduate in complexity and depth over the course of their academic career' (lines 1599-1601)."
        gates_on:
          - "Column order derives from the academic-schedule values set in step 1 — term ordering resurfaces here as report semantics."
        accreditation_citation: "COCA Standard 6, Element 6.4 (progression of competency depth across the program); ACPE Standard 2, Key Element 2.2.d ('breadth AND depth'); CODA Standard 2, Element 2-8; LCME Standard 9, Element 9.4. The Nursing playbook and video both call this the accreditation crosswalk ('Each row is an Essential, and each column is a course or a course objective')."
        competitor_equivalent: "e-value.yaml documents 'representations of standards coverage'; emedley.yaml documents gap-and-overlap analysis. Neither public source documents a spiral-progression crosswalk with an assigned/unassigned view selector at this granularity, so the comparison is directional rather than element-for-element."
        gap_severity: "none"
        gap_note: "The Only Unassigned view is the QA counterpart to the Unmapped Standards list — it finds mapped-but-unattributed instances, which are invisible in every other report."
      - element: "Heatmap Report (Mapping Reports > ARC-PA 6th Edition 2025 B/C/D Sections Mapping > Other Report > Heatmap Report; X-axis = standards, Y-axis = course offering name/number, cell = count of mapped measures, hover detail, min-max color legend)"
        type: "visualization report"
        data_shown: "'Each cell shows how many course measures are mapped to a specific standard for a given course offering. When you hover over any cell, you will see additional details, including the standard code, course details, and the total number of mapped measures for that combination... Darker colors indicate a higher number of mappings, while lighter colors indicate fewer mappings' (exxat_transcripts.md lines 1743-1745). Opens in a new tab."
        gates_on:
          - "ENTRY POINT IS PA-ONLY: 'Keep in mind that this option appears only for PA programs using the ARC-PA sixth edition mapping' (line 1741)."
        accreditation_citation: "ARC-PA 6th edition B/C/D sections directly. Per prior work in content/journeys/competency-verification.yaml stage 8, the Heatmap is one of the three shipped artifacts cited as the 'not starting from zero' evidence for COCA Element 11.9 and CODA Element 1-2 — but note that citation rests on the report's SHAPE being portable, not on a COCA/CODA-scoped heatmap existing today."
        competitor_equivalent: "leo-davinci.yaml's Insights Dashboard (real-time completion status with gap flags) and emedley.yaml's gap-and-overlap analysis are the sourced functional equivalents. Neither is documented as accreditor-version-scoped the way Prism's ARC-PA-6th-edition entry point is — Prism's is more specific and less general."
        gap_severity: "gap"
        gap_note: "Two compounding gaps at one element. (1) Domain lock: the entry point is documented as appearing only for PA programs on ARC-PA 6th edition, so DO/Pharmacy/Dentistry/Medicine have no confirmed heatmap today — the visual an accreditation-readiness conversation opens with. (2) No export: the PA playbook states flatly that this report 'cannot be downloaded — advise programs to screenshot it to extract data.' A screenshot is not a self-study appendix. Both are narrow, high-visibility fixes."
      - element: "Curriculum dropdown scoping on every report in this family"
        type: "report filter"
        data_shown: "Selects which single curriculum grid the report runs against."
        gates_on:
          - "'you cannot run reports on multiple grids simultaneously' (line 1525)."
        accreditation_citation: "ACEN 4.5 and CCNE III-B/C/D per the Nursing playbook, where each degree/track is configured as its own grid — meaning a school with five tracks produces five separate report sets with no product-supported union view. CSWE AS 3.1.1 vs. AS M3.2.1 has the same shape (generalist grid vs. specialization grids)."
        competitor_equivalent: "elentra.yaml documents Curriculum Explorer/Search filtering 'by cohort, course, or objective set' without a documented single-grid restriction, and claims coverage of >40% of the CACMS DCI — which implies program-wide, not grid-scoped, reporting. Sourced, and Elentra is ahead at this element."
        gap_severity: "gap"
        gap_note: "The most consequential structural limit in this stage, and it is stated once in narration during grid creation rather than surfaced where it bites. Any program whose curriculum legitimately spans multiple grids (multi-track Nursing, CSWE generalist + specializations, dual-degree DO/PharmD tracks) cannot produce a single program-level coverage report from Prism."

  # ---------------------------------------------------------------- STEP 16
  - screen: "Curriculum Mapping > Clone Curriculum"
    navigation_path: "Curriculum Mapping > select curriculum > Clone Curriculum"
    action: >
      Rather than rebuilding stage 6 every year, the admin clones the finished
      curriculum forward for the next cohort — creating a new set of course
      offerings with a shifted academic schedule and copying the course setup
      and mapping setup along with it.
    confirmed_by: "exxat_transcripts.md, '14/16 Performing Curriculum Mapping in Exxat Prism', lines 1601-1609"
    elements:
      - element: "Clone Curriculum: new name, description, Cohort selector (lockstep)"
        type: "input field set + dropdown"
        data_shown: "'Cloning a curriculum creates a new set of course offerings with the academic schedule specified by you' (line 1603). 'The process of cloning a curriculum is different between lockstep and non-lockstep programs.'"
        gates_on:
          - "Newly cloned courses inherit the selected cohort."
        accreditation_citation: "CODA Standard 2, Element 2-8 (curriculum management plan across review cycles) — year-over-year continuity of the map is what makes a review cycle demonstrable rather than a one-time snapshot."
        competitor_equivalent: "one45.yaml's 'version control and audit trail' is the alternative approach to year-over-year continuity — versioning one curriculum rather than cloning into a new one. Genuinely different data models, both sourced."
        gap_severity: "configure-needed"
        gap_note: "Cloning creates a sibling, not a version. There is no documented lineage link from clone to parent, so 'what changed between the 2025 and 2026 map' is not a question Prism answers — it is exactly the question CODA 2-8 and COCA 11.9 review cycles ask."
      - element: "Academic-year and term remapping (pencil per academic-year group; pencil per term group; per-course exclusion checkboxes)"
        type: "bulk remap + exclusion"
        data_shown: "Shift a whole academic-year group forward ('you can change the academic year from 2024 to 2025 to 2025 to 2026 for all the courses originally assigned the academic year of 2024 to 2025'), or move a term group (fall → spring). Individual courses can be excluded (lines 1605-1607)."
        gates_on:
          - "'you will not be able to change the academic years for individual courses' — group-level only (line 1605)."
        accreditation_citation: "None — platform-mechanics element with no direct accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Group-only academic-year shifting is a sensible guardrail, but a program that genuinely moves one course a year later has to clone, exclude, and hand-build that one offering."
      - element: "Clone content selectors (course details, prereqs/coreqs, textbooks, evaluation criteria, course policies, faculty & staff, course events, course measures setup, mapping setup)"
        type: "checkbox set"
        data_shown: "All checked by default; unchecking omits that content from the new curriculum (lines 1607-1609)."
        gates_on: []
        accreditation_citation: "ACPE Standard 2, Key Element 2.2.d and CODA Standard 2, Element 2-8 — carrying the mapping setup forward is what makes the second year's evidence comparable to the first's."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "That 'mapping setup' is clonable is the single largest labor saver across the whole stage — it means the expensive taxonomy work in steps 9-12 is a one-time cost, not an annual one."

