        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.4 (submission requires the map itself); CODA Standard 2, Element 2-8; ACPE Standard 2, Key Element 2.2.d. The Notes field is where a program's mapping RATIONALE lives — 'if you would like to provide a rationale for this mapping instance, you could do so here' — which is the qualitative half of every self-study narrative built on a map."
        competitor_equivalent: "No competitor teardown in content/competitors/ documents per-mapping-instance evidence attachment or rationale notes. Elentra's documented 'searching within attached files' implies file attachment somewhere in its curriculum tools, but not at mapping-instance granularity. Prism appears ahead here; the caveat is that competitor marketing depth, not competitor capability, may be what is missing."
        gap_severity: "none"
        gap_note: "Artifact-at-the-mapping-instance is the strongest single element in this stage for accreditation defensibility — it is the difference between asserting coverage and showing the assignment that produced it."
