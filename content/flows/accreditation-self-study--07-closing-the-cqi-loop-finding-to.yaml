# Element-level ground truth for accreditation-self-study.yaml, stage 7
# ("Closing the CQI loop — finding to action to evidence (continuous)").
# See _TEMPLATE.yaml for field meanings. Every accreditation_citation and
# competitor_equivalent below traces to a real source file in confirmed_by.
# SCHEMA v2 (2026-08-24): analysis fields are per-element, not per-step.
flow_name: "Closing the CQI Loop — Finding to Action to Evidence"
maps_to_journey: "accreditation-self-study.yaml, stage 7"
persona: "Compliance / Accreditation Liaison (see ../personas/role-compliance-accreditation-liaison.yaml); Program Administrator and Faculty perform the underlying logging steps"
steps:
  - screen: "Forms/Evaluations Setup — Low Score Threshold & Auto Notifications"
    navigation_path: "Learning Activities > Forms/Evaluations > [Form] > Setup"
    elements:
      - element: "Low score threshold field"
        type: "input field (numeric, per form)"
        data_shown: "Overall-score cutoff below which a submitted form is flagged"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (\"a workflow that flags a student falling below a defined didactic/clinical threshold\" — this field is where that threshold is literally defined)"
        competitor_equivalent: "New Innovations names \"Annual Program Evaluations (APE): Cross-program performance review with trend analysis and citation/concern tracking\" as a shipped ACGME-side feature, but its public product page (new-innovations.yaml, sourced from new-innov.com/pub/gme_details.html) is a marketing bullet, not documentation of an actual threshold field — not granular enough to compare against this field."
        gap_severity: "none"
        gap_note: "Admin-editable directly on the form's Setup screen per the help guide — this half is self-service and complete."
      - element: "Low score notification (overall form score)"
        type: "toggle, activated via Support ticket, not self-service"
        data_shown: "Auto-emails placement faculty (if assigned) plus designated individuals when a submitted form's overall score drops below the threshold"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (this toggle is the flag firing — it turns the threshold above into an actual notification event)"
        competitor_equivalent: "New Innovations' APE bullet (new-innovations.yaml, sourced from new-innov.com/pub/gme_details.html) claims \"citation/concern tracking\" but its public product page never documents a notification mechanism or its recipients — not granular enough to compare against this toggle."
        gap_severity: "configure-needed"
        gap_note: "The trigger mechanism is real and shipped, but activation requires an Exxat Support ticket rather than an admin self-service toggle — a real implementation dependency for a program trying to stand this up before a self-study."
      - element: "Response-based notification (question-level threshold)"
        type: "toggle, activated via Account Manager/Configuration team, not self-service"
        data_shown: "Auto-emails when a specific question's response fails a configured criterion, across all question types incl. single-/multi-select"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (finer-grained variant of the same flag — fires on a single failed question rather than an overall score)"
        competitor_equivalent: "No competitor source in this research set documents question-level response criteria at field level; New Innovations' APE page (new-innovations.yaml) is marketing-granularity only."
        gap_severity: "configure-needed"
        gap_note: "Same activation dependency as the overall-score notification, one step deeper: this one routes through the Account Manager/Configuration team, so the criterion itself is not admin-editable after setup."
      - element: "Configured-notifications list"
        type: "read-only summary"
        data_shown: "Shown at the bottom of the Forms/Evaluations setup screen for visibility into which thresholds/recipients are active"
        gates_on: []
        accreditation_citation: "Not where CODA 2-2 evidence lives — this element only displays which flags the Support/Account Manager team has activated; the flag itself lives in the threshold field and notification toggles above."
        competitor_equivalent: "Not comparable — no competitor source in this research documents a configured-notification inventory surface at field level."
        gap_severity: "none"
        gap_note: "Read-only display of state configured elsewhere; nothing missing at this element, though its existence is a symptom of the fact that admins cannot set that state themselves."
    action: "Admin sets a numeric low-score threshold on a form, then contacts Exxat Support/Account Management to activate the notification and name recipients (not self-service)."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Planned Communications/Track low scores for timely interventions.md"

  - screen: "Student 360 Dashboard — Interventions tab"
    navigation_path: "Students > [Student Name] > Student 360 Dashboard > Interventions tab"
    elements:
      - element: "+ (Add) icon"
        type: "button"
        data_shown: "Opens the Interventions drawer form"
        gates_on: []
        accreditation_citation: "Not where CODA 2-2 evidence lives — this is the entry point to the case record, not a field the standard is satisfied by."
        competitor_equivalent: "Not comparable at element level — no competitor teardown in this research set (e-value.yaml, new-innovations.yaml, core-elms.yaml, leo-davinci.yaml, emedley.yaml) documents an individual student case-record screen, so there is no equivalent affordance to compare."
        gap_severity: "none"
        gap_note: "Shipped and self-service; opens the drawer described below."
      - element: "Make this intervention visible to student (toggle)"
        type: "toggle"
        data_shown: "Whether the record publishes to the student; confirmation prompt fires on save when ON"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (partial — due process requires the student be informed; this toggle is the only documented mechanism by which the record reaches the student)"
        competitor_equivalent: "Not comparable at element level — no competitor source in this research documents student-facing visibility control on a case record."
        gap_severity: "none"
        gap_note: "Shipped, with an explicit save-time confirmation; the notification half of due process is genuinely covered here."
      - element: "Mode / Initiated By / Course, Rotation, Site selectors / Subject / Description"
        type: "input fields (dropdowns + free text)"
        data_shown: "Who raised the concern, through what channel, tied to which course/rotation/site, and a free-text description of the concern"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (individual evaluation when a student falls below published criteria — this field group is where the evaluation itself is recorded)"
        competitor_equivalent: "Not comparable at element level — competitor public accreditation-feature pages (e-value.yaml, new-innovations.yaml, core-elms.yaml, leo-davinci.yaml, emedley.yaml) describe program-level tracking (APE, CLER, NAS dashboards), not an individual student due-process object with fields like these."
        gap_severity: "configure-needed"
        gap_note: "This is the specific element where CODA 2-2's remaining gap sits: there is no structured field capturing \"decision made per institutional due-process policy.\" That decision, if made, has to be typed into the free-text Description — recoverable by a human reviewer, not queryable or reportable."
      - element: "Status"
        type: "dropdown"
        data_shown: "Open or Closed"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (evidence that the case reached a resolution, though not what the resolution was)"
        competitor_equivalent: "Not comparable at element level — no competitor source in this research documents case-status tracking on a student-level record."
        gap_severity: "none"
        gap_note: "Shipped. Open/Closed shows THAT a case closed; the outcome and its policy basis are not captured here (see the Description field group above)."
      - element: "Follow-Up block"
        type: "input fields, added via a nested + icon"
        data_shown: "Planned Follow-Up Date, Actual Follow-Up Date (edited in on completion), and a free-text follow-up description/notes"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (documents that follow-up was planned and actually occurred — planned vs. actual dates are exactly the evidence pair the element asks for)"
        competitor_equivalent: "Not comparable at element level — no competitor source in this research documents planned-vs-actual follow-up date fields on a student case record."
        gap_severity: "none"
        gap_note: "Shipped and structured. This resolves the journey's prior hedge — a genuine timestamped follow-up trail exists and chains directly off the low-score trigger in step 1."
      - element: "Supporting document upload"
        type: "file attachment"
        data_shown: "Up to 25MB per file; PDF/DOC/DOCX/JPG/JPEG/PNG/HEIC/XLS/XLSX/CSV/PPT family/RTF/BMP/GIF/TIFF/MP4"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (the de facto home for a signed due-process letter or policy citation, since no structured field exists for it)"
        competitor_equivalent: "Not comparable at element level — no competitor source in this research documents attachment support on an individual student case record."
        gap_severity: "configure-needed"
        gap_note: "Shipped and generous on file types, but it is a workaround rather than a fit: a due-process decision stored as an attached document is not a structured, reportable field, so a self-study reviewer must open files one by one."
    action: "Admin or faculty opens a timestamped case record documenting an academic/professionalism/compliance concern for one student, and edits it over time (status Open to Closed, follow-up dates filled in) as the case is worked."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Students/Adding Interventions and Communications.md"

  - screen: "Course-level Communications & Interventions"
    navigation_path: "Courses > [Course Offering] > Students > Communications & Interventions > [select student]"
    elements:
      - element: "Student list"
        type: "list/selector"
        data_shown: "All students enrolled in the course offering"
        gates_on: []
        accreditation_citation: "Not where CODA 2-2 evidence lives — this is a roster selector that scopes the case log, not a field the standard is satisfied by."
        competitor_equivalent: "Not comparable at element level — no competitor source in this research documents course-scoped case logging, so there is no equivalent roster surface to compare."
        gap_severity: "none"
        gap_note: "Shipped. Its value is workflow efficiency — managing several students' records from one page instead of navigating to each Student 360 profile."
      - element: "Add Intervention button"
        type: "button"
        data_shown: "Opens the same drawer form as the Student Profile Interventions tab, pre-scoped to this course/placement"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (course/placement-contextual variant of the same due-process trigger)"
        competitor_equivalent: "Not comparable at element level — see prior step; no competitor source in this research documents field-level course-scoped case logging."
        gap_severity: "configure-needed"
        gap_note: "Inherits the drawer form wholesale, and with it the same structural gap: a real, working entity-scoped case log with no due-process-policy-citation field."
    action: "Faculty logs a placement- or course-specific incident from within the course, using the identical Interventions form, so multiple students' records can be managed from one page instead of navigating to each Student 360 profile."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Students/Adding Interventions and Communications.md"

  - screen: "Student Reports — Communication and Intervention Report; Ask Leo query"
    navigation_path: "Students > Reports > Communication and Intervention Report; and the floating Ask Leo assistant, available from any screen"
    elements:
      - element: "Communication and Intervention Report"
        type: "read-only rollup report"
        data_shown: "All communication/intervention activity across students, positioned by the OT playbook to support retention/placement oversight and end-of-term performance-review meetings"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (documents that follow-up occurred, at cohort scale)"
        competitor_equivalent: "Not comparable — no competitor source in this research documents an equivalent cohort-level case-log rollup at field level."
        gap_severity: "cosmetic"
        gap_note: "Useful for self-study evidence gathering but does not itself supply the due-process-decision structure CODA 2-2 wants; it surfaces existing case records, it doesn't add the missing field."
      - element: "Ask Leo query box"
        type: "natural-language query input"
        data_shown: "Structured result table answering questions like \"Are there any follow-ups for student intervention and communication?\", with per-answer source citations and an AI disclaimer"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (surfaces open follow-ups on demand; the per-answer source citations make the result traceable back to the underlying case records)"
        competitor_equivalent: "Not comparable — no competitor source in this research documents a conversational-AI query surface over case records at field level."
        gap_severity: "cosmetic"
        gap_note: "Same limitation as the report: it reads existing case records rather than adding the missing due-process-decision structure, and its AI disclaimer means output is a prep aid, not submissible evidence on its own."
    action: "Admin pulls a cohort-level rollup of intervention activity, or asks Ask Leo directly for open follow-ups, to prep for an end-of-term review or self-study evidence gathering."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational Therapy (OT) Playbook.md"

  - screen: "Program Details — Standards — Program-Specific Standards"
    navigation_path: "Program Details > Standards > Program Specific Standards"
    elements:
      - element: "Standard name field"
        type: "input field (free text), set inside a drawer"
        data_shown: "Program-defined goal/outcome name (e.g. program learning outcome), separate from Accreditation Standards"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (Program Assessment); COCA Standard 11, Element 11.2; LCME Standard 1, Element 1.1; ACPE Standard 7, Key Element 7.5.a"
        competitor_equivalent: "Not evaluated — no competitor source in this research documents an equivalent program-standards editor at field level."
        gap_severity: "gap"
        gap_note: "This is the element where the program-level half of the loop breaks: editing a standard overwrites it in place (per the guide's Edit/Delete flow), with no revision history or version log, so there is no way to show what an outcome said before a review finding changed it."
      - element: "Subcategories"
        type: "input fields (free text), nested under a standard"
        data_shown: "Sub-goals/sub-sections under a program standard"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (Program Assessment); COCA Standard 11, Element 11.2; LCME Standard 1, Element 1.1; ACPE Standard 7, Key Element 7.5.a"
        competitor_equivalent: "Not evaluated — no competitor source in this research documents an equivalent nested sub-goal editor at field level."
        gap_severity: "gap"
        gap_note: "Same overwrite-in-place behavior as the parent standard, and the same absence of any link field connecting a sub-goal to the review finding or programmatic change made because of it."
      - element: "Tags"
        type: "configurable tag picker"
        data_shown: "Custom labels used to flag/track items for a review committee"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (Program Assessment); COCA Standard 11, Element 11.2; LCME Standard 1, Element 1.1; ACPE Standard 7, Key Element 7.5.a"
        competitor_equivalent: "Not evaluated — no competitor source in this research documents an equivalent committee-tracking tag facility at field level."
        gap_severity: "gap"
        gap_note: "The nearest thing on this screen to a review-committee workflow, but tags are unversioned labels: nothing in the help-center documentation for this screen or the adjacent Curriculum Mapping guides shows an audit trail of when a tag was applied or which finding prompted it."
    action: "Admin defines and edits the program's own outcomes/goals as static text records, with tags for committee tracking."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Program Details/Managing Program Standards.md"

  - screen: "Curriculum Mapping Reports — Heatmap Report / B2 Instructional Objectives Mapping Report"
    navigation_path: "Curriculum Mapping > [Curriculum] > Mapping Reports > Heatmap Report (or B2 Instructional Objective Report, PA/ARC-PA only)"
    elements:
      - element: "Heatmap grid"
        type: "read-only visualization (X = standards, Y = course offerings)"
        data_shown: "Count of mapped course measures per course-offering/standard cell, with hover detail (standard code, course, total measures mapped) and a color legend by mapping density"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (partial — coverage evidence only, not the \"concrete examples of changes made as a direct result of review\" the element also requires)"
        competitor_equivalent: "Not comparable — CORE's CompMS \"continuous improvement tools\" and Leo's Insights Dashboard (core-elms.yaml, leo-davinci.yaml) are named at marketing-page granularity only; neither publicly documents a coverage visualization at this level of detail."
        gap_severity: "gap"
        gap_note: "Shows WHAT the curriculum currently covers, not evidence that a finding produced a CHANGE — the grid renders current state only, with no prior-version comparison or diff view."
      - element: "B2 Instructional Objective Report (Excel export)"
        type: "downloadable report, one tab per ARC-PA standard"
        data_shown: "Standard, Course Name and Number, Instructional Objective — one row per instructional-objective-to-standard mapping"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (partial — coverage evidence only); ARC-PA B2 series, as the report's per-standard tab structure is built for that submission"
        competitor_equivalent: "Not comparable — no competitor source in this research documents a per-standard mapping export at row level; CORE and Leo (core-elms.yaml, leo-davinci.yaml) name continuous-improvement tooling in marketing copy only."
        gap_severity: "gap"
        gap_note: "A clean point-in-time snapshot, but there is no report run history retained anywhere in this documentation, so two exports taken a year apart cannot be compared inside the product — COCA 11.1's \"concrete examples of changes made as a direct result\" and 11.2's evaluation-to-improvement flowchart remain unaddressed."
    action: "Admin generates a point-in-time snapshot of curriculum-to-standard coverage for a curriculum review or self-study submission."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Curriculum Mapping Reports/Heatmap Report.md and Instructional Objectives Mapping Report (ARC-PA Standards).md"

  - screen: "Learning Activities — Reports — Create New Report (Custom Reports)"
    navigation_path: "Learning Activities > Reports > Custom > Create New Report"
    elements:
      - element: "Data Source picker"
        type: "dropdown, 10 fixed sources"
        data_shown: "Timesheet, Time Off, Placements, Slot, Sites, Locations, Contracts, Personnel, Faculty, Forms and Evaluations — no patient-record, chart-audit, or deficiency-coding source among them"
        gates_on: []
        accreditation_citation: "CODA Standard 5, Element 5-3 (continuous quality improvement for the patient-care program — root-cause analysis and corrective measures)"
        competitor_equivalent: "Not comparable — no competitor source in this research documents a chart-audit or deficiency-coding data source either; all named competitor accreditation features (APE, CLER, NAS dashboards) are described at marketing-page granularity, not at the level of an enumerable source list."
        gap_severity: "gap"
        gap_note: "This single dropdown is where CODA 5-3 fails at element level: its 10 fixed sources contain no patient-care/chart record, deficiency code, or corrective-action-tracking object — there is nothing to build a chart-audit report FROM, independent of whether the report builder itself is capable."
      - element: "Raw Data / Pivot Report toggle"
        type: "report-mode selector"
        data_shown: "Raw grid vs. row/column pivot with Sum/Average/Earliest-Latest-date aggregation"
        gates_on: []
        accreditation_citation: "Not where CODA 5-3 evidence lives — the aggregation mode is analytically sufficient for root-cause work; the standard fails upstream at the data source, not here."
        competitor_equivalent: "Not comparable — no competitor source in this research documents report-mode or aggregation options at field level."
        gap_severity: "none"
        gap_note: "The report engine itself is real and self-service; pivoting with Sum/Average/date aggregation would support a chart-audit analysis if a suitable data source existed."
      - element: "Filters (basic/advanced)"
        type: "report filter"
        data_shown: "User-defined field-level filters on the chosen data source"
        gates_on: []
        accreditation_citation: "Not where CODA 5-3 evidence lives — filtering is capable enough; the standard fails upstream at the data source, not here."
        competitor_equivalent: "Not comparable — no competitor source in this research documents report filter capability at field level."
        gap_severity: "none"
        gap_note: "Shipped and self-service, but bounded by the chosen data source — filters can only reach fields the 10 fixed sources expose."
    action: "Admin builds a self-service cross-tab report over one of the 10 supported data sources for program-quality analysis."
    confirmed_by: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Learning Activities/Generating and Managing Custom Reports.md"

