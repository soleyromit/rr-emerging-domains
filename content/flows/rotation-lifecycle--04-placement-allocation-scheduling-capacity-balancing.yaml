  - screen: "Slots Dashboard / Managing Slots by Placements"
    navigation_path: "Placements > [Course or Placement Group] > Slots"
    elements:
      - element: "Slots by Setting / by Rotation / by Type / by Status (bar & pie charts)"
        type: "read-only rollup, clickable-to-filter"
        data_shown: "Count of open capacity broken out by clinical setting, rotation, slot type, and status."
        gates_on: []
        accreditation_citation: >
          COCA Standard 6, Element 6.9 (site capacity feeds the 3-year rolling-average
          calculation) — this rollup aggregates capacity by setting/rotation/type/status, but no
          time-series or rolling-average dimension exists in it anywhere in the sourced docs.
          EXISTING-DISCIPLINE CLAUSE: the same "counts, not adequacy" shortfall recurs verbatim
          for four served disciplines. CAPTE Standard 2, Element 2D8 wants number AND variety of
          sites against required capacity, including a forward-looking 150%-of-charter-class-size
          projection for developing programs. ARC-PA Standard A1, Element A1.10 a-b wants
          confirmed capacity per setting per cohort, filterable by geography. CCNE Standard II,
          Key Element II-C wants a periodically-run sufficiency process, not a snapshot.
          COA Standard F.1 with Standard A.10 (both CRITICAL) wants sufficiency of clinical
          resources for the size and scope of the program.
        competitor_equivalent: >
          Not comparable at element level — CORE ELMS and one45 marketing pages describe
          slot/site management only in generic terms ("centralized site/student/preceptor
          management"), with no dashboard-level breakdown to compare against. Note that CORE ELMS
          sells that same generic claim into PT, OT, PA, nursing, social work, pharmacy and
          dental (content/competitors/core-elms.yaml), so the disciplines overlap head-to-head
          even though the evidence does not.
        gap_severity: "configure-needed"
        gap_note: >
          A read-only aggregation of the current capacity number only; the COCA 6.9 3-year
          rolling-average adequacy view is not one of the documented breakouts, and neither is
          CAPTE 2D8's required-vs-contracted projection. Per ../accreditation/arc-pa.yaml the
          honest summary for PA is that "sufficiency is asserted by eyeballing offered-vs-used per
          setting in Excel, not computed" — which is the same verdict, reached independently, for
          a discipline Prism has served for years.
      - element: "+ Add Slot drawer — Site, Location, # of offers per rotation"
        type: "input fields"
        data_shown: "The raw supply-side capacity number a site is making available for a given rotation."
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.9 (site capacity feeds the 3-year rolling-average calculation) — this is the element where the underlying capacity number is actually captured, so it is the input any rolling-average computation would have to be built on. Also the capture point ARC-PA Standard A1, Element A1.10 a-b depends on: that standard's evidence is 'the number of students each site can accommodate,' which is literally this field."
        competitor_equivalent: "Not comparable at element level — CORE ELMS and one45 marketing pages describe slot/site management only in generic terms, with no field-level slot-entry detail to compare against."
        gap_severity: "configure-needed"
        gap_note: "Captures a plain per-rotation capacity number, not a rolling-average adequacy figure — COCA 6.9's specific 3-year computation would need to be built on top of this data, not just read off it."
      - element: "Supervision Type selector on the slot (student-to-supervisor ratio)"
        type: "single-select drawn from a program-editable controlled vocabulary"
        data_shown: >
          The declared supervision ratio for the capacity being offered. Value sets are
          discipline-shaped: the OT production value set is fixed at 1 Student:1 CI, 1 Student:2
          CIs, 2 Students:1 CI, 2 Students:2 CIs; PT/OT programs edit their own labels under
          Sites and Locations > Setup > Slot Setup.
        gates_on:
          - "Selected per slot, carried onto every placement made from that slot, and exposed as a filter on the site-facing slot-offering form."
          - "Does NOT gate the placement action itself — nothing computes a live ratio from it or blocks on it."
        accreditation_citation: >
          This one field is the sole ratio capture point for three separate served disciplines,
          and it satisfies none of them the same way.
          ACOTE Standard C.1.7 (ratio of fieldwork educators to students) is the closest to
          satisfied: per ../accreditation/acote.yaml, Exxat's own ACOTE guide names C.1.7 against
          exactly this field plus the Placements by Educator report, and the OT playbook confirms
          the pairing (Sites > Location > Slots > Supervision Type).
          COA Standard F.7 (CRITICAL) is not satisfied: it caps supervision at a hard 2:1 and its
          unit of enforcement is preceptor-shift, not slot.
          CCNE Standard II, Key Element II-F is not satisfied either: its recommended 1:8
          faculty-to-student ratio for indirect NP-track supervision is a faculty-workload figure
          that never touches a slot record at all.
          ACPE Standard 3, Key Element 3.3.e (Pharmacy, an expansion domain) fails for the same
          structural reason as COA F.7.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research, and the
          absence is symmetric and worth stating as such: none of the nine competitor files
          (CORE ELMS, one45, Elentra, eMedley, MedHub, E*Value, LEO/DaVinci, New Innovations,
          axiUm) documents a supervision-ratio field on a capacity record, and none documents a
          ratio constraint inside its matching engine. This looks like an industry-wide gap
          rather than a Prism-specific deficit — which is a genuine product opportunity, not
          merely a defensive talking point.
        gap_severity: "gap"
        gap_note: >
          The ratio is descriptive metadata, not a constraint, and the failure mode is concrete:
          a program can label a slot "1 Student:1 CI" and then place three students against that
          same supervisor through three separate slots without the system objecting. For OT this
          is survivable because ACOTE C.1.7 asks for evidence the ratio "enables proper
          supervision" rather than a numeric cap; for CRNA it is disqualifying, because COA F.7
          states a hard number and flags the standard critical. Two secondary defects carry over
          from ../accreditation/acote.yaml: the Placements by Educator report explicitly EXCLUDES
          placements with no assigned educator (so incomplete educator assignment silently shrinks
          the denominator and under-reports the program's own ratios), and planned Supervision
          Type and realized ratio live in two views with no reconciliation, so nothing flags a
          slot set up as 1:1 that actually ran 2:1.
      - element: "Slot Type = First Come First Serve (FCFS), and the early-publication practice built on it"
        type: "controlled-vocabulary label on the slot"
        data_shown: >
          Marks capacity that is claimed on a first-come basis rather than held for the
          program's allocation run. Shipped default Slot Type set (confirmed identically in the
          OT playbook): FCFS, Resume Required, Interview Required, Must Be Filled, Requested By
          Student — the OT playbook adds that "schools typically don't change these."
        gates_on:
          - "Usable as a weighted priority inside Placement Assist, and as a filter on the student-facing wishlist."
        accreditation_citation: "None directly — a market-timing label, not accreditor evidence. Indirectly upstream of CAPTE Standard 2, Element 2D8 and ARC-PA Standard A1, Element A1.10 a-b, since FCFS slots claimed early are still capacity that must appear in the sufficiency count."
        competitor_equivalent: >
          Partially comparable, and only for this one value. LEO/DaVinci's Clerkship Lottery
          documents an "optional first-come-first-serve mode" as a LOTTERY-LEVEL setting
          (content/competitors/leo-davinci.yaml) — a mode the whole allocation run operates in.
          Prism instead models FCFS as a per-slot label the allocator can weight, which is the
          finer grain and the one PT's actual practice needs, since a single M1M response mixes
          reserved and FCFS slots. No other competitor file documents an FCFS primitive at all.
        gap_severity: "none"
        gap_note: >
          PT-specific and strategically significant: the PT playbook records that "the % of slots
          offered as FCFS is climbing" and that PT schools respond by publishing FCFS slots to
          students early "to avoid 'losing out' on these slots to other schools competing for
          them" — i.e. a share of capacity is deliberately routed AROUND the allocation engine as
          a competitive response. Any claim that Placement Assist governs PT allocation should be
          qualified accordingly: it governs the reserved half.
      - element: "Slot Status: Confirmed / Tentative / Cancelled"
        type: "radio + conditional cancellation-attribution fields"
        data_shown: "Whether the offered capacity is actually committed by the site, and — when cancelled — whether the school or the site cancelled it."
        gates_on:
          - "Wishlist setup exposes Confirmed and Tentative as separate include-checkboxes, so status decides what students can rank."
          - "Placement Assist can be configured to weight slots by status (see the Advanced Options step)."
        accreditation_citation: "COCA Standard 6, Element 6.9 (contingency planning for lost rotation capacity) and CCNE Standard II, Key Element II-C (a defined, periodically-run process for determining site availability, and the modifications made as a result) — the Cancelled + cancelled-by-Site combination is the closest structured lost-capacity event in the product, and it is exactly what a contingency narrative is written against."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          Lost-capacity events are recorded but not aggregated — no documented report counts
          site-initiated cancellations per site per year. PT practice puts a sharper point on it:
          the PT playbook treats confirming a slot (a confirmation email to the site contact and
          CI the moment a slot is received, BEFORE any student is placed) and releasing an unused
          slot back to the market as the two operationally critical moves of the season, because
          an unreleased slot is capacity a competing program cannot use and goodwill the program
          loses. Neither move is modelled as a tracked event here; both are email conventions.
    action: "Admin (or site personnel via a delegated Slot Request link) records how many placement openings exist, at what declared supervision ratio, broken out by setting/rotation/type — the supply side that allocation later consumes."
    confirmed_by: >
