          Where each candidate agency stands in the student's search. Student-maintained and
          self-service until a placement is created. Placement Accepted is terminal AND exclusive:
          only one suggestion per student can hold it.
        gates_on:
          - "The single-Accepted constraint is the allocation invariant of this whole workflow — it is what prevents a student from holding two agency offers, and it is the SW analogue of the overlapping-rotation guard in Placement Assist."
          - "When a Placement Accepted suggestion exists, the Create Placement flow skips location selection entirely and goes straight to placement details."
        accreditation_citation: "CSWE AS 3.3.5 (orienting, placing, monitoring, safety protocols, and evaluating students in field) — the interview record is the documented placement trail that standard's evidence rests on, and per ../accreditation/cswe.yaml the centralized placement record plus the Comprehensive Placement Report is the named artifact."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor's public materials model an interview outcome as a placement precursor state."
        gap_severity: "none"
        gap_note: >
          Worth reading as a design pattern with cross-discipline reuse value rather than an SW
          curiosity: it is the same problem PT solves informally when pre-matching students into
          interview-required slots ahead of match day (see the Manual/Direct Placement step), and
