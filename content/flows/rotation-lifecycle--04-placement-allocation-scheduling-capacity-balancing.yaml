  - screen: "Placement Capacity & Utilization Reports"
    navigation_path: "Placements > [Course or Placement Group] > Reports; plus Sites > Reports for the discipline-specific sufficiency reports"
    elements:
      - element: "Distribution of Slots Across Settings / Number and Variety of Clinical Sites (Standard 2C)"
        type: "report, weekly refresh"
        data_shown: "Slots offered vs. filled, by rotation/setting. (Report name itself embeds a discipline-specific accreditor standard label — 'Standard 2C' — for the OT/PT audience it is built for, which is direct evidence Prism has precedent for standard-labeled reports, though no equivalent named report exists for ACPE/COCA/LCME standards today.)"
        gates_on: []
        accreditation_citation: >
          Ships against an OT/PT "Standard 2C" label — direct precedent for accreditor-named
          reports — but not against ACPE Standard 3, Key Element 3.3.e (real-time student-to-
          preceptor ratio) or COCA Standard 6, Element 6.9 (3-year rolling-average adequacy),
          neither of which is confirmed to exist as a report here.
          CORRECTION FLAGGED BY THE PT/CAPTE RESEARCH, and it is a live product defect rather than
          an analysis note: per ../accreditation/capte.yaml the sites/slots content now lives at
          CAPTE Standard 2, Element 2D8, and there IS NO Standard 8 in the 2024 PT or PTA documents
          (they stop at Standard 7), while 2024's "2C" is program assessment, not sites. The "2C"
          and "8F" labels on these two shipped reports are 2016 numbering that has not been
          renumbered, even though Prism's other five CAPTE reports already carry dual "2024 X /
          2016 Y" labels. Fix before a 2024-cycle self-study.
        competitor_equivalent: "Not comparable at element level, and notably not a Prism-specific competitive gap: no competitor source in this research (CORE ELMS, one45, Elentra, eMedley, MedHub, E*Value, LEO/DaVinci, New Innovations) publicly documents a ratio-compliance or rolling-average report either."
        gap_severity: "gap"
        gap_note: >
          Offered-vs-filled counts refreshed weekly — the right shape for a standard-labeled report,
          but no equivalent exists for the four target domains' accreditors, a weekly refresh cannot
          satisfy a real-time ratio requirement, and the standard label on the report itself is two
          editions out of date. Separately, per ../accreditation/capte.yaml, CAPTE 2D8's
          150%-of-charter-class capacity projection for developing programs has no shipped
          equivalent: "Placement Assist allocates against actual slots, it does not model required-
          versus-contracted capacity ahead of a cohort existing."
      - element: "Distribution of Slots Across Locations / Number and Variety of Clinical Slots (Standard 8F)"
        type: "report, weekly refresh"
        data_shown: "Slots offered per rotation, broken out by location. Has a checkbox to include cancelled slots."
        gates_on: []
        accreditation_citation: "Same OT/PT-labeled precedent ('Standard 8F') and the same two-edition numbering defect described on the sibling element — the 2024 home for this content is CAPTE Standard 2, Element 2D8. Does not address ACPE 3.3.e (real-time ratio) or COCA 6.9 (3-year rolling average), neither of which is confirmed to exist as a report in this list. Also serves ARC-PA Standard B3, Element B3.01 a-e sufficiency claims: per the PA playbook both Distribution reports run from Placements > Placement Group > Reports and are named as direct evidence for B3.01a-e, complementing rather than duplicating the SCPE Details report."
        competitor_equivalent: "Not comparable at element level — and, as above, the accreditor-specific computed-adequacy report looks like an industry-wide gap across all researched vendors rather than something a competitor already ships and Prism lacks."
        gap_severity: "gap"
        gap_note: "Location-level offered counts on a weekly refresh; no ratio and no rolling-average computation is layered on them."
      - element: "SCPE Details report (Sites > Reports > SCPE Details) — PA"
        type: "report shaped to mirror an external accreditor portal"
        data_shown: >
          Cohort, site name, affiliation status, setting, slots offered, and slots used — filterable
          by "Written Agreements = Yes" and comparable offered-vs-used per setting. Deliberately
          mirrors the ARC-PA Entry Level Program Portal's own SCPE data-entry screen so a program
          can diff Prism against the portal line by line.
        gates_on:
          - "Slot Request responses populate 'true slots offered' automatically, so the number is site-attested rather than an admin estimate — even where some slots are still collected manually."
        accreditation_citation: >
          ARC-PA Standard A1, Element A1.10 a-b — the program must document the number of written
          affiliation agreements, the method used to confirm site availability, and the number of
          students each site can accommodate; and under 6e, any site or preceptor outside the United
          States may be used only for ELECTIVE rotations. Per the PA playbook the 6e portal
          requirement is that confirmed slots per location/setting are updated on an ONGOING basis,
          not just annually.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research, and this is
          the strongest single competitive artifact in the stage: no competitor's public materials
          describe a report shaped to an accreditor's own data-entry screen for reconciliation
          purposes. CORE ELMS and MedHub/E*Value both sell into PA, and neither names an ARC-PA
          portal reconciliation report.
        gap_severity: "configure-needed"
        gap_note: >
          Per ../accreditation/arc-pa.yaml the honest limit: "sufficiency is asserted by eyeballing
          offered-vs-used per setting in Excel, not computed. No shipped pillar produces a pass/fail
          'is capacity sufficient for this cohort' verdict, and A1.10b's non-U.S.-elective-only rule
          is enforced only by a manual state/country filter." The named fix is small and concrete —
