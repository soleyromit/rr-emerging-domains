          Since that IS the social-work workflow, either their public materials understate what
          they do for the discipline, or SW customers are being sold a med-ed-shaped matcher.
        gap_severity: "none"
        gap_note: >
          Genuinely strong, and the clearest evidence in this stage that Prism models discipline
          variance rather than papering over it. The SW playbook records what this replaced:
          before Multi-Location Field Application Forms existed, programs requiring multi-agency
          interviews tracked interview activity via TEMPORARY PLACEMENTS or outside spreadsheets —
          and the troubleshooting guidance still names that as a live anti-pattern ("use Interview
          Statuses to track interview progress instead of creating temporary placements"). One
          availability caveat carried from ../flows/admin-onboarding--07-wishlists-slot-requests-placement-assist.yaml:
          the Field Application Form wishlist type is "configured by the Exxat Prism team and is
          not available for self-setup."
      - element: "Interview Status lifecycle (Interview Pending > Interview Scheduled > Placement Offered > Placement Accepted / Placement Not Offered / Placement Declined)"
        type: "student-maintained state machine, reportable as a column"
