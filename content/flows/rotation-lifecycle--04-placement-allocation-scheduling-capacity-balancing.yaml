      semantics, shared-rotation per-cohort deduction) by
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md
      ("Max Placement Limit (Slot Cap) — PA-Exclusive Feature"); ratio standards from
      ../accreditation/coa.yaml (Standard F.7) and ../accreditation/acote.yaml (Standard C.1.7).

  - screen: "Wishlist Setup"
    navigation_path: "Placements > [Course or Placement Group] > Wishlist > + Create wishlist"
    elements:
      - element: "Wishlist type selector"
        type: "dropdown / radio selection"
        data_shown: "One of nine documented types: Slot, Location, Setting, Location Area, Questionnaire, Address Preference, My Request, Rotation Preference, and Setting-and-Rotation-Preference [Nested]; plus a distinct ExxatOne Availability-Based type for PT/OT/Nursing, and a support-configured Field Application Form type used by Social Work."
        gates_on:
          - "Type is IMMUTABLE after save — changing it means deleting and rebuilding the wishlist (confirmed in ../flows/admin-onboarding--07-wishlists-slot-requests-placement-assist.yaml against the admin tutorial transcript)."
        accreditation_citation: "None directly — this is preference intake, not an accreditor evidence requirement."
        competitor_equivalent: >
          One45 markets three named allocation methods (Stream Lottery, Rotation Lottery,
          Randomized Stream Lottery); MedHub's UME module offers "Schedule Lottery: create
          lotteries based on custom rules and preferences" plus course waitlists; LEO/DaVinci's
          Clerkship Lottery lets students rank-order course preferences with a random tiebreak;
          Elentra advertises a "leading edge lottery system"; eMedley's eduSched is
          "preference-, lottery-, track/path-based"; New Innovations offers a rotation lottery for
          3rd/4th-year medical students. Every one of these ranks a SINGLE object type — courses
          or rotations. None documents ranking against slots, locations, settings, location areas,
          addresses, or nested setting-then-rotation. Prism's own help documentation is more
          granular here than any competitor's public materials, which is a real but asymmetric
          comparison (we cannot see behind any competitor's login wall). One directional caution:
          five of those six competitors are med-ed-first products, so their single-object model
          may reflect their market rather than their ceiling.
        gap_severity: "none"
        gap_note: "This element alone resolves the journey's prior 'no preference-ranking... engine is documented' language — a documented, multi-type preference system exists and feeds directly into Placement Assist."
      - element: "Discipline-default wishlist type mapping (a practice convention, NOT a product feature)"
        type: "absent — configuration knowledge that lives only in the playbooks"
        data_shown: >
          Nothing in-product. The type-to-discipline mapping the playbooks record:
          PT — slot-based most common, location-based (reverse wishlist) as the documented
          fallback "for schools that don't receive enough slots offered in their M1M," MyRequest
          used sparingly (e.g. one student-recommended new site per program).
          OT — Level I: slot-based or location-based; Level II: typically location-based (reverse)
          or setting-based; Capstone: questionnaire-based plus MyRequest to gather site details.
          PA — slot-based for Core courses, setting-based for Electives, location-based rarely.
          Social Work — Multi-Location Field Application Form (support-configured), My Requests,
          and course-specific Wishlist Questionnaires; SW's playbook explicitly frames this as
          "location/agency-based rather than reserved-slot-based."
          SLP, Nursing, Teacher Education — no documented wishlist pattern exists in any source.
        gates_on: []
        accreditation_citation: "None — preference-instrument selection carries no accreditor evidence requirement in any of the twelve standards files in ../accreditation/."
        competitor_equivalent: "Not applicable — this element documents an absence in Prism, not a feature, so there is nothing for a competitor to be compared against."
        gap_severity: "gap"
        gap_note: >
          The gap is the combination of (a) twelve unfamiliar wishlist types, (b) an immutable
          type choice, and (c) discipline defaults that exist in internal playbooks but nowhere in
          the product. A new PT program picks among twelve types with no in-product guidance and
          cannot change its mind after save. Explicitly logged as an absence for SLP: the SLP
          playbook's own gap list states there is "no SLP-specific slot-request cycle, wishlist
          pattern, or Placement Assist usage notes" and flags this as a DOCUMENTATION gap rather
          than a confirmed product gap — that distinction should be preserved and not quietly
          upgraded into a product claim in either direction. Same for Nursing, whose playbook
          gap list names "slot-request cadence/seasonality (Nursing's equivalent of PT's March 1
          M1M), wishlist behavior, Placement Assist adoption" as undocumented.
      - element: "Min/Max selections, Open/Close/View-only dates"
        type: "input fields"
        data_shown: "How many preferences a student must submit and the submission window."
        gates_on: []
        accreditation_citation: "None directly — submission-window administration, not an accreditor evidence requirement."
        competitor_equivalent: "Not comparable at element level — neither one45's lottery documentation nor CORE ELMS's SmartMatch marketing exposes preference-count or submission-window configuration fields."
        gap_severity: "none"
        gap_note: >
          The window is where discipline cadence actually lives, and the two documented cadences
          are almost opposites. PT runs an annual industry-synchronized cycle: the M1M slot
          request goes out March 1 for the FOLLOWING calendar year, and the wishlist follows the
          responses. PA's playbook recommends the opposite compression — open the wishlist 2-4
          months before the first rotation start date but keep it open only briefly (its worked
          example is Friday to Monday) to force a decision. Neither cadence is expressible as a
          template or a default; both are typed in by hand every cycle.
      - element: "Student-facing rank UI (up/down arrows or drag-and-drop; Reason for Selection field)"
        type: "ranking control"
        data_shown: "Ordered preference list a student builds before allocation runs."
        gates_on: []
        accreditation_citation: "None directly — this is preference intake, not an accreditor evidence requirement."
        competitor_equivalent: "Both one45's lottery methods and CORE ELMS's SmartMatch imply some rank-order or preference intake upstream, and LEO/DaVinci explicitly documents student rank-ordering with a random tiebreak, but no competitor's public materials document the student-side ranking control itself, so the comparison is asymmetric rather than element-to-element."
        gap_severity: "none"
        gap_note: "The concrete rank-order mechanism the journey's earlier hedge said was undocumented; it produces the ordered list Placement Assist consumes."
    action: "Admin configures which preference-collection instrument to use; students rank locations, settings, slots, or rotations before Placement Assist runs."
