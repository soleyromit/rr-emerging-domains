  - screen: "Max Placement Limit (Slot Cap) — Slot Offering Drawer, step 2"
    navigation_path: "Site/Delegator slot-offering link, or Placements > Slots > Offer Availability > (edit pencil) — step 2 of the Slot Offering Drawer"
    elements:
      - element: "Placement Limit field (per Location + Setting + Cohort)"
        type: "input field"
        data_shown: "Maximum total student intake for a Location/Setting/Cohort combination, independent of how many individual monthly/weekly slots are listed as offered (e.g. 12 slots offered, intake capped at 7)."
        gates_on:
          - "Must be explicitly enabled in Slot Request Configuration to expose the limit field on the site/delegator-side slot-offering link; if disabled, site personnel never see a limit option."
          - "If a slot is created without an assigned Setting, the limit falls back to the Location + Cohort level."
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.3.e (2:1 student-to-preceptor cap) — this field is the
          closest confirmed capacity-cap mechanism anywhere in the sourced material, and it
          resolves (not just re-hedges) the prior "neither is confirmed to exist" language: a real
          cap exists, but its unit of account is Location+Setting+Cohort, not the individual
          precepting person. The same unit mismatch defeats COA Standard F.7 (CRITICAL) for CRNA
          and ACOTE Standard C.1.7 for OT.
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe an equivalent configurable intake-cap field at this granularity. The nearest public claim is Elentra's 'learner-driven elective selection within admin-set capacity rules' (content/competitors/elentra.yaml), which is the same shape — self-service bounded by an admin cap — but exposes no field-level detail."
        gap_severity: "gap"
        gap_note: >
          Delta (1) from ACPE 3.3.e: the cap is scoped to Location+Setting+Cohort, not to an
          individual preceptor's concurrent caseload across placements. Also, as documented,
          PA-exclusive and available only for lockstep-based domains today — extending it to
          Pharmacy (or any of the four new domains) would itself require product work, not just
          configuration. EXISTING-DISCIPLINE CONSEQUENCE, and it is the sharpest availability
          finding in this stage: the lockstep restriction excludes Social Work (whose playbook
          documents enrollment-date or practicum-start-date cohorts plus full-time/part-time
          Categories rather than a lockstep progression) and most of Nursing, including CRNA —
          the one discipline in this entire research set whose accreditor states a hard numeric
          supervision cap and flags the standard critical. The only shipped intake cap is
          unavailable to the discipline that needs a cap most.
      - element: "Shared-rotation, per-cohort slot deduction with independent limits"
        type: "documented allocation behavior of the limit field"
        data_shown: >
          When one physical rotation slot is shared across cohorts (the playbook's worked example:
          an overlapping rotation slot serving both Class of 2024 and Class of 2025), slots
          offered and slots available are tracked and deducted SEPARATELY per cohort, and each
          cohort's placement limit stays fully independent of the other's and of the shared-slot
          consumption.
        gates_on:
          - "Cohort is the partition key for both the availability count and the cap; the two cohorts do not compete for a shared pool."
        accreditation_citation: >
          ARC-PA Standard A1, Element A1.10 a-b — that standard's evidence is "the number of
          students each site can accommodate, per setting and per cohort," and per-cohort is
          exactly the partition this behavior implements. Also relevant to COCA Standard 6,
          Element 6.9, whose rolling-average computation is inherently multi-cohort.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor's public materials describe cohort-partitioned capacity accounting on a shared rotation."
        gap_severity: "none"
        gap_note: >
          Genuinely subtle and correct behavior, and the strongest single piece of evidence that
          Prism's capacity model is more than a counter — it is the kind of thing that only gets
          built after a real customer hit the cross-cohort double-count bug. Worth surfacing in
          the four-domain pitch, since every one of those domains runs overlapping cohorts. Note
          the reporting consequence recorded in the PA playbook: a single Location/Cohort/Setting
          combination can span MULTIPLE rows in the Slots List View (differing rotation or
          preceptor), so the "Limit Exists" LABEL — not the row — is the unit that maps to the
          limit. An admin reading the grid row-by-row will miscount.
      - element: "\"Limit Exists\" label (Slots List View)"
        type: "read-only rollup"
        data_shown: "Flags which rows in Placements > Slots / Sites > Slots / Locations > Slots carry a configured limit."
        gates_on: []
        accreditation_citation: "None directly — this is a passive indicator that a limit was configured elsewhere; no ACPE 3.3.e evidence lives here."
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe a slot-list indicator of this kind."
        gap_severity: "none"
        gap_note: "A read-only surfacing element; neither of the two documented ACPE 3.3.e deltas (wrong cap unit, advisory-not-blocking) originates here, though it inherits the same PA-exclusive availability as the field it reflects."
      - element: "Warning banner (Location-view Select Student screen; Make Placement drawer — Place Individually and Place as a Group; Student-view placement)"
        type: "non-blocking alert"
        data_shown: "Shown once the limit is reached or exceeded at the point of placement."
        gates_on: ["informational only — does not gate or block the placement action"]
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.3.e (required to be a *blocking* check) — this is the
          enforcement point for the cap, and it is documented as advisory rather than blocking.
          EXISTING-DISCIPLINE CLAUSE: advisory-not-blocking is survivable under ACOTE Standard
          C.1.7, which asks for evidence the ratio "enables proper supervision" rather than a hard
          number, but not under COA Standard F.7, whose text is "at no time does the number of
          students directly supervised by one clinical preceptor exceed 2:1" and which permits
          exceedance only with a documented extenuating-circumstance justification and a
          contingency record. A soft warning produces neither the block nor the exception record.
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe an equivalent soft-cap warning mechanism at this granularity."
        gap_severity: "gap"
        gap_note: "Delta (2) from ACPE 3.3.e: it warns rather than blocks, so a non-compliant assignment can still be completed. Same PA-exclusive, lockstep-only availability as the limit field itself."
    action: "Site or admin caps total student intake for a location/setting/cohort combination; staff are warned but not stopped when a placement would exceed that cap."
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Discipline Specific Guides/PA Discipline/Max Placement Limit (MAX Slot Limit).md;
