  - screen: "Placement Assist — Results & Batch Review"
    navigation_path: "Placements > [Course or Placement Group] > Placement Assist > Run Placement Assist > History tab > View Results"
    elements:
      - element: "Summary tab — Run Setup, Run Outcome, Match Distribution, Preference Match Analysis"
        type: "read-only rollup"
        data_shown: "What % of students got their 1st/2nd/3rd/4th wishlist choice, and how many students were matched vs. unmatched."
        gates_on: []
        accreditation_citation: "None directly — run-quality statistics, not accreditor evidence."
        competitor_equivalent: "Not comparable at element level — neither CORE ELMS nor one45 publishes match-quality or preference-satisfaction reporting from their allocation runs."
        gap_severity: "none"
        gap_note: ""
      - element: "Results tab — per-student Place button; bulk 'select students + Create placements'"
        type: "button / bulk action"
        data_shown: "Converts an algorithm-suggested match into a real placement record; the Action column shows 'Placement Created' once done."
        gates_on: ["suggestions are never auto-committed — an admin must explicitly convert each one"]
        accreditation_citation: "None directly."
        competitor_equivalent: "Directional contrast only, not element-level: CORE ELMS's public marketing describes 'instant results, eliminating wait times,' which reads as a more automated/less human-review-gated flow than this explicit suggest-then-admin-commits button — but CORE ELMS's own admin screens are not documented publicly, so this is a marketing-language contrast, not a screen-by-screen one."
        gap_severity: "none"
        gap_note: "The human-in-the-loop commit step is where the contrast with CORE ELMS's 'instant results' framing actually lives; it is a deliberate control, not a missing capability."
      - element: "Staged multi-batch run sequencing (scarcity-first), configured as placement groups rather than as a run setting"
        type: "operating procedure built on Placement Groups, not a shipped run mode"
        data_shown: >
          The documented PA best practice: identify the courses/settings with the fewest slots
          offered, create placement groups around which courses must be placed FIRST, run
          Placement Assist for the hard-to-place courses, commit those placements, then move to
          the next group. The scarce capacity is consumed before the abundant capacity is
          allocated against it.
        gates_on:
          - "Sequencing is entirely manual — the admin decides the order, runs each batch, and commits between batches. Nothing computes which courses are scarce."
        accreditation_citation: "None directly — an allocation-quality technique. Upstream of ARC-PA Standard A1, Element A1.10 a-b and CAPTE Standard 2, Element 2D8 only in the sense that a badly sequenced run wastes scarce contracted capacity the sufficiency evidence depends on."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. No competitor's public materials describe multi-batch or scarcity-first allocation sequencing at all."
        gap_severity: "configure-needed"
        gap_note: >
          Real, effective, and entirely tribal knowledge — it lives in the PA playbook, not in the
          product, and the scarcity ranking that drives it is eyeballed. The same underlying
          problem is documented independently for PT as a market condition rather than a
          technique: "national competition for IP and Acute care slots (industry problem, not
          necessarily an Exxat problem)." A shipped scarcity metric (offers vs. demand per
          course/setting, computed) would convert the PA best practice into a default and would
          serve PT's hardest allocation problem directly.
      - element: "No accreditor-coverage verdict on the committed result set"
        type: "absent — negative finding"
        data_shown: >
          The run reports preference satisfaction (1st/2nd/3rd/4th choice percentages) and
          matched-vs-unmatched counts. It does not report whether the committed matches leave any
          student short of a required setting, system level, or exposure category.
        gates_on: []
        accreditation_citation: >
          ARC-PA Element B3.04 a-d (all four SCPE settings per student), ACPE Key Elements
          3.2.b/3.2.d (all four APPE settings), CSWE AS 3.3.1 (all five system levels for ALL
          students), CAPTE Element 6H (required experiences FOR EACH STUDENT), ACOTE Standard
          C.1.11 (comparable Level I experiences for all students), CAEP Component R2.3 (every
          candidate in diverse settings). Six accreditors, six served or expansion disciplines,
          one shared question the results screen does not answer.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor publishes any post-run reporting at all, let alone a compliance verdict on a run."
        gap_severity: "gap"
        gap_note: >
          A high-preference-satisfaction run and an accreditation-compliant run are different
          things, and this screen only measures the first. The gap is narrow and tractable: the
          per-student cap rule builder already knows how to reason about required setting quotas,
          so the same rule definitions could be evaluated against the committed set and rendered
          as a per-student coverage column beside the preference column. That would close the
          forward-looking half of the exposure gap recorded on the Advanced Options step without
          building a new constraint engine.
    action: "Admin reviews the algorithm's proposed matches and preference-satisfaction statistics, then selectively (or in bulk) converts suggestions into real placements — typically one scarcity-ordered batch at a time."
    confirmed_by: >
