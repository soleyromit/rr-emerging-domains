  # NEW STEP (2026-08-25): an availability-FIRST matching mechanic, structurally inverted
  # from the request-then-wait slot model, and available only to PT/PTA and OT/OTA.
  - screen: "Exxat One Availability-Based Wishlist & Import Schedules (PT/PTA, OT/OTA)"
    navigation_path: "Placements > [Course offering] > Wishlist tab > Create Wishlist > 'Exxat One Availability Based Wishlist' — then Exxat One's View and Track Request screen, then Placements > Import Schedules"
    elements:
      - element: "Availability-based wishlist setup — rotation scope, state / experience-type / specialization filters, required min-max number of ranked availabilities"
        type: "wishlist type with an external data source"
        data_shown: >
          Students rank REAL Exxat One partner availabilities rather than program-held slots or
          abstract location preferences. Setup fields: name, view date, close date, type selection,
          rotation, the three filters, min and max availabilities a student must rank, instructions
          text, student selection (with an option to auto-add newly registered students), and
          open / 24-hours-before-close / closed notifications.
        gates_on:
          - "Discipline-gated: documented as designed for PT, PTA, OT and OTA programs, and requires Exxat One access."
          - "Type is immutable after save, like every other wishlist type."
        accreditation_citation: >
          None directly — preference intake carries no accreditor evidence requirement. Upstream of
          CAPTE Standard 2, Element 2D8 and ACOTE Standard C.1.5 in that availabilities ranked here
          become placements that must appear in the sufficiency count and must carry a valid written
          agreement.
        competitor_equivalent: >
          The competitive frame here is not the med-ed vendors at all — it is the third-party slot
          marketplaces the PT playbook names as direct competitors of Exxat One:
          myClinicalExchange (mCE), Clinician Nexus, ACEMAPP, and CastleBranch Bridges. The playbook
          records two facts that matter more than any feature comparison: those vendors "require
          student account registration and payments for slot requests or onboarding," and "these
          competitors will not integrate with us." So the competition at this element is over who
          owns the availability marketplace, not over who has the better ranking UI — and the
          integration door is closed by the counterparty, not by Prism.
        gap_severity: "none"
        gap_note: >
          Structurally inverted from every other mechanic in this file: demand-first / availability-
          driven instead of request-then-wait. Debuted March 2024 and, unlike the PT M1M cycle, can
          be run year-round with no March 1 restriction — which is a direct answer to the seasonal
          bottleneck the PT playbook describes. Also the documented remedy when an M1M underdelivers
          (the other being a location-based reverse wishlist).
      - element: "Student ranking flow — routed into Exxat One, privacy-policy acceptance for non-SSO users"
        type: "cross-system student workflow"
        data_shown: "Students reach it from the Prism dashboard's Needs Attention section, are routed into Exxat One (accepting its privacy policy if they are not SSO users), rank their choices, and submit back."
        gates_on:
          - "A non-SSO student who declines the Exxat One privacy policy cannot complete the wishlist — a consent gate with no in-Prism fallback documented."
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. The named marketplace competitors go further in the same direction — mCE, Clinician Nexus, ACEMAPP and CastleBranch Bridges are documented as requiring student ACCOUNT REGISTRATION AND PAYMENT, where Exxat One requires consent but no student payment."
        gap_severity: "cosmetic"
        gap_note: "The consent gate is the only student-facing friction documented in the flow, and it is a real one for a lockstep cohort where a single unsubmitted wishlist stalls a batch. No documented admin remedy short of placing that student manually."
      - element: "Admin Request Slot against a specific availability (slot count, specialization, graduation date, message to site)"
        type: "outbound request form scoped to one ranked availability"
        data_shown: "Reviewing submitted rankings in Prism shows 'View Request' before submission and 'Request Slot' after; requesting opens the availability detail page where the admin enters slot count, specialization, graduation date, and a message, then clicks Request Now."
        gates_on:
          - "The request is made against a specific ranked availability, so the student's ranking is the input to the ask — the inverse of ranking against capacity the program already holds."
        accreditation_citation: "None directly. The graduation-date and specialization fields are the same attributes CAPTE Element 6H and ACOTE Standard C.1.11 care about downstream, captured here as a request parameter rather than as a placement attribute."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Notable as the only mechanic in this stage where a student preference directly parameterises an outbound capacity request rather than being consumed by an internal allocator."
      - element: "Track Request on Exxat One, then Import Schedules back into Prism as placements"
        type: "cross-system status tracking + bulk import"
        data_shown: "Admins track request status on Exxat One's View and Track Request screen; once a site approves and schedules, the Import Schedules feature pulls the approved slot back into Prism as a placement."
        gates_on:
          - "Import Schedules is the documented mechanism that avoids manual re-entry; without it the approved schedule would be re-keyed by hand."
        accreditation_citation: "ACOTE Standard C.1.5 and CAPTE Standard 2, Element 2D9 — an imported placement is still subject to the same written-agreement requirement, and the imported record must land on a location whose contract is valid for the placement dates."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file describes importing externally negotiated schedules back into the system of record."
        gap_severity: "configure-needed"
        gap_note: >
          Nothing in the sourced documentation states whether Import Schedules enforces contract
          validity at the destination location, or whether an imported placement can land at a
          location with no executed agreement — which matters because Exxat One partners are
          sourced outside the program's own contracting process. Flag as a question to verify
          rather than a confirmed gap; it is the one place in this stage where placements enter
          Prism without passing through a documented program-side gate.
    action: "Students rank real partner availabilities; the admin converts a ranking into a targeted slot request to that partner, tracks it in Exxat One, and imports the approved schedule back into Prism as a placement."
