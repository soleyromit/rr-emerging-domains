        gap_severity: "none"
        gap_note: >
          NEW 2026-08-25 from a full read of the SW playbook. Recorded because it is the concrete
          mechanism behind a claim this file already made in the abstract ("When a Placement
          Accepted suggestion exists, the Create Placement flow skips location selection entirely")
