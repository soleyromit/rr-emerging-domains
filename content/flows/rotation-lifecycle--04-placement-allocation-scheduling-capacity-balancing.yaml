  - screen: "Placement Assist — Setup"
    navigation_path: "Placements > [Course or Placement Group] > Placement Assist"
    elements:
      - element: "Basic Setup — Courses, Rotations/Advanced Schedules, Wishlist(s) to include"
        type: "multi-select checkboxes"
        data_shown: "Scopes which population and which submitted wishlist(s) the algorithmic run will consider."
        gates_on: []
        accreditation_citation: "None directly at this element."
        competitor_equivalent: "Not comparable at element level — CORE ELMS and one45 public pages describe outcomes (\"instant results\", named lottery types) but not a run-scoping screen with this level of field detail."
        gap_severity: "none"
        gap_note: "Full self-service access to Placement Assist is documented as limited to PT-PTA and OT-OTA programs today (per content/prism/capability-map.yaml, itself sourced from this same help-center doc); every other discipline — including all four target domains (Pharmacy, DO, Dentistry, Medicine) — must contact Exxat support to have it enabled, and the docs describe 'limited functionality' outside PT/OT. The sourced docs do not distinguish this element from its sibling on that point."
      - element: "Select Students (#) drawer — filter by Placement Assignment Status / Wishlist Submission status"
        type: "filterable student picker"
        data_shown: "Which registered students are included in this run; students can be run even without a wishlist (randomized placement into open slots)."
        gates_on: []
        accreditation_citation: "None directly at this element."
        competitor_equivalent: "Not comparable at element level — CORE ELMS and one45 public pages describe outcomes (\"instant results\", named lottery types) but not a student-selection workflow with this level of field detail."
        gap_severity: "none"
        gap_note: "Same discipline-specific rollout limitation as the Basic Setup element: full self-service Placement Assist is documented for PT-PTA and OT-OTA only, with support enablement and 'limited functionality' elsewhere. This is a real rollout gap distinct from the matching algorithm's own capability, and the docs apply it to the feature as a whole rather than to individual fields."
      - element: "Placement-mode selection is upstream of this screen and varies WITHIN a discipline"
        type: "absent — a decision made by convention before the run is scoped"
        data_shown: >
          Nothing in-product. The documented reality is that Placement Assist is one of several
          co-existing placement modes and is not the default for most experience types even in
          the two disciplines that have full self-service access.
          OT states the split explicitly: "For Level II, schools prefer direct and slot-based
          placements. For capstone, direct placement is preferred. For Level I, schools prefer
          Placement Assist." So within ONE discipline the algorithmic run governs one of three
          experience types.
          PT records four co-existing modes: wishlist + Placement Assist (very common); early
          FCFS publication outside the run (very common); pre-matching students to
          application/interview sites ahead of the school's common match day (common); and
          location-based wishlist + direct placement + Email>Publish slot requests (fairly common).
          PA runs it, despite not having self-service access, via a documented staged-batch
          strategy (see the Advanced Options and Results steps).
        gates_on: []
        accreditation_citation: "None — mode selection carries no accreditor evidence requirement."
        competitor_equivalent: >
          Directionally comparable and unflattering to the marketing framing on both sides. CORE
          ELMS sells SmartMatch as the way students get matched ("automated student-site-preceptor
          matching... with instant results, eliminating wait times"), into the same PT, OT, PA,
          nursing and social work market. The observed Prism reality is that the algorithm handles
          a minority of experience types even where it is fully available. Whether CORE ELMS's
          customers behave differently is unknowable from marketing copy — but the honest read is
          that "we have a matching engine" is a weaker claim than either vendor's materials imply,
          for structural reasons (FCFS competition, interview-mediated placements, capstones)
          rather than product ones.
        gap_severity: "configure-needed"
        gap_note: >
          Worth carrying into the four-domain plan as a scoping correction: enabling Placement
          Assist for Pharmacy/DO/Dentistry/Medicine does not mean those programs will run their
          placements through it. The PT and OT evidence says a large share of capacity is routed
          around the allocator for reasons the allocator cannot fix.
