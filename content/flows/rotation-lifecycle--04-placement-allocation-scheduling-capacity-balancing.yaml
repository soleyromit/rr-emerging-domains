  - "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social Work (SW) Playbook.md — READ IN FULL 2026-08-25 (previously consulted per-stage). Lines cited in this file: 26-28 (Field Application Form / Placement Suggestion / Learning Contract terminology), 41-50 (the two cohort-naming conventions and the Groups/Campuses/Categories value sets), 63-67 (the three course-setup models), 84-127 (the whole Field Application Forms, Interview Statuses and Placement Creation section — the ten-suggestion ceiling, the six workflow steps, the status lifecycle, the mapping rules, the three Create Placement branches, My Requests and course-specific Wishlist Questionnaires, the navigation path and the best-practice list), 183 (the Download Raw Response export with Interview Status and Schedule Date as added columns), 185-189 (the temporary-placement anti-pattern this workflow replaced), 197 (expect Field Application Forms and My Requests to be used more heavily and iteratively than a single-wishlist PT/OT slot process)."
  - "/Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Teacher Education (TE) Playbook.md — READ IN FULL 2026-08-25 (73 lines). It is the thinnest discipline source in this corpus and its own line 12 says why: TE has no dedicated internal help-center playbook article and no CSS discipline playbook PDF, so the note is built from ONE program-administrator video tutorial covering the GoReact/Echo360 LTI integration, transcribed from auto-generated Vimeo captions. Substantive content: lines 19-26 (LTI integration with GoReact, now part of Echo360; assignments, student submissions and scores/status updates sync automatically; described as a genuinely connected two-way workflow in which administrators are not expected to recreate assignments in GoReact), 28-31 (activation is discipline/program-gated — if the Learning Tool Interoperability section is absent from Learning Activities > Setup the feature is not activated, and activation requires an Exxat support ticket), 33-45 (the administrator setup sequence: create at Learning Activities > Setup > Learning Tool Interoperability > +, configure LTI tool, title, description, placement-based vs. didactic, publish and due dates, grading and score settings and faculty visibility; activate and save; Prism auto-creates the matching GoReact activity on first save; GoReact-specific settings are then configured in GoReact and the activity marked Done, at which point the assignment becomes available to students), 47-52 (student workflow from My Coursework: redirect into GoReact, record directly, upload a video file, or submit other supported media, with status syncing back), 54-57 (faculty/reviewer workflow: timestamped comments, feedback, evaluations and scores, syncing back with no reconciliation step), 61 (further GoReact-side configuration is documented in GoReact's help centre, not Exxat's), and 63-73 (the Open Gaps list — TE terminology, program/setup patterns, compliance, placement and slot workflows, standard evaluation forms and reports, accreditor standards, and pain points are ALL explicitly unpopulated, with a standing instruction not to treat field-standard TE terms or CAEP standard numbers as Exxat-specific until confirmed against a TE-specific source). EVERY TE claim in this file that is not about the LTI integration is therefore reasoned from ../accreditation/caep.yaml and carries that caveat inline. In THIS file the load-bearing lines are 67 (TE terminology — the Rotation/Placement, Cohort and cooperating-teacher equivalents — is unconfirmed for Exxat and must not be treated as Exxat-specific) and 70 (placement and slot workflows, incl. how TE placement requests, wishlists and confirmations compare to PT/OT/PA patterns, are explicitly unavailable), which together are why every element in the TE placement step is marked inferred."
