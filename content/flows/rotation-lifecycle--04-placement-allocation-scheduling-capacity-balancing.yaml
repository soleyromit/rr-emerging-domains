  - screen: "Placement Assist — Advanced Options"
    navigation_path: "Placements > [Course or Placement Group] > Placement Assist > Setup > Advanced Option"
    elements:
      - element: "Set Maximum Placements per Student for Courses/Rotations/Settings — Add Rule (Rule Application Type: IN EACH / IN COMBINED; Apply Limit To: Course/Rotation/Setting)"
        type: "rule builder"
        data_shown: "A per-student cap, applied individually per selection (IN EACH) or shared across a selected group (IN COMBINED) — e.g. capping a student to exactly one of four elective courses, or preventing placement in two consecutive rotation terms."
        gates_on: ["students exceeding the configured max are excluded from that rule's slots in the run"]
        accreditation_citation: >
          ACPE Standard 3, Key Elements 3.2.b/3.2.d (all four required APPE settings per student)
          — the "IN EACH"/"IN COMBINED" rule is a directly applicable mechanism for enforcing a
          fixed required-setting quota per student.
          EXISTING-DISCIPLINE CLAUSE: the identical mechanism maps cleanly onto ARC-PA Standard
          B3, Element B3.04 a-d, which names four required SCPE settings (emergency department,
          inpatient, outpatient, operating room) — the same shape of requirement as ACPE's four
          APPE settings, for a discipline Prism already serves. It maps less cleanly onto CSWE
          Accreditation Standard 3.3, AS 3.3.1, which requires opportunities across five SYSTEM
          LEVELS (individuals, families, groups, organizations, communities) — per
          ../accreditation/cswe.yaml, system-level tagging "currently rides on generic
          placement/agency tags rather than a first-class CSWE system-level field," so the rule
          builder has no clean attribute to constrain on.
        competitor_equivalent: >
          Not comparable at element level in the direction that matters most: this is the single
          richest piece of element-level evidence in the entire research set, and it directly
          contradicts the journey's prior framing of Prism as "behind on building" an allocation
          engine — capability-map.yaml explicitly flags this as a correction to an earlier reading
          of the competitive research. But the comparison is asymmetric: CORE ELMS's SmartMatch
          ("customizable rules and preferences"), one45's three lottery types, MedHub's "lotteries
          based on custom rules and preferences," and New Innovations' "rule-based templates" are
          known only from marketing pages that do not expose rule-builder-level detail. The one
          third-party signal available cuts Prism's way and is worth citing carefully: a competing
          scheduling vendor's comparison blog characterizes New Innovations' scheduling as
          requiring manual work and being rule-based rather than constraint-solved
          (content/competitors/new-innovations.yaml) — a self-interested source, but the only
          non-marketing read on any competitor's allocator in this research.
        gap_severity: "none"
        gap_note: "The mechanism ships; the specific four-setting ACPE taxonomy (or ARC-PA's four SCPE settings, or CSWE's five system levels) would still need to be configured into the rules. This element is the concrete resolution of the journey's 'no constraint-solving engine is documented' hedge."
      - element: "Restrict Placements in Overlapping Rotations (toggle)"
        type: "toggle + auto-generated overlap-group list"
        data_shown: "System-detected groups of rotations with overlapping dates; a student can be placed in only one rotation per overlap group."
        gates_on: ["prevents double-booking a student into date-clashing rotations"]
        accreditation_citation: >
          None directly — schedule-integrity enforcement, not an accreditor evidence requirement
          in the sourced standards. Architecturally significant for CRNA all the same: per
          ../accreditation/coa.yaml (Standard F.7), this toggle is "already a concurrency check,
          just on the wrong axis" — it detects two placements colliding on ONE STUDENT'S calendar,
          where COA F.7 needs the same detection on ONE PRECEPTOR'S calendar. It is named there as
          one of two adjacent precedents worth reusing rather than rebuilding.
        competitor_equivalent: "Not comparable at element level — neither CORE ELMS's nor one45's public materials describe an overlap-detection or double-booking-prevention control, though one45's 'multi-layered concurrent schedules' claim (content/competitors/one45.yaml) implies some concurrency model exists behind it."
        gap_severity: "none"
        gap_note: "A genuine hard constraint (it excludes, not merely down-weights), and one of the rules that makes this a real constraint solver rather than a preference sorter. The concurrency machinery for a preceptor-side ratio check therefore already exists in some form — the missing piece is the axis, not the algorithm."
      - element: "Pair courses with program clinical settings (toggle)"
        type: "toggle + mapping"
        data_shown: "Restricts a course's eligible slots to only those tagged with the linked setting(s)."
        gates_on: []
        accreditation_citation: >
          ACPE Standard 3, Key Elements 3.2.b/3.2.d (all four required APPE settings per student)
          — setting-pairing is the eligibility half of enforcing a required-setting mix.
          COCA Standard 6, Element 6.10 (rotation records need discrete, filterable attributes
          queryable before clerkships begin) — this mapping is exactly that kind of pre-clerkship
          scheduling input, not after-the-fact metadata.
          EXISTING-DISCIPLINE CLAUSE, and this is the highest-value multi-discipline element on
          the screen because setting eligibility is the ONE accreditor-shaped constraint the
          allocator can actually enforce at match time. It is the enforcement half of ARC-PA
          Element B3.04 a-d (four required SCPE settings; the PA best practice is to tag locations
          with exactly those four), of CAPTE Standard 6, Element 6H (experiences across practice
          settings representative of PT practice — the PT playbook's live taxonomy is Acute, SNF,
          TCU, Neuro IP/OP, OP Mix, OP Peds, Pediatrics, EDS, Wound Care and more), of CAA
          Standard 3.0B/3.6B (variety of settings, populations and age groups for SLP), and of
          CAEP Standard R2, Component R2.3's "Breadth" attribute (variety of settings observed and
          practiced in).
        competitor_equivalent: >
          Not comparable at element level — CORE ELMS's SmartMatch and one45's lottery marketing
          do not expose setting-eligibility mapping, so no element-to-element claim can be made in
          either direction. MedHub's UME page mentions "site eligibility verification"
          (content/competitors/medhub.yaml), which is the nearest named public analogue, but with
          no indication whether it is a match-time constraint or a pre-flight check.
        gap_severity: "configure-needed"
        gap_note: >
          The accreditor taxonomies must be configured as program clinical settings before this
          mapping can enforce anything, and the configuration is not one-to-one for every
          discipline. ARC-PA's four settings map cleanly. CAPTE 6H does not: per
          ../accreditation/capte.yaml the shipped 6H evidence is retrospective and self-reported
          (derived from the student's PTSE 1 answers AFTER an experience ends), while the
          forward-looking gap view lives in Program Requirements — "a separate object with a
          separate taxonomy," reconciled by hand. CAEP R2.3 is worse: its Breadth and Diversity
          attributes are partly properties of the PARTNER SCHOOL'S student body, and per
          ../accreditation/caep.yaml Prism's site/location record has no confirmed field for
          partner-school demographics.
      - element: "Consider Distance for Placements (toggle; student address vs. school address)"
        type: "toggle + scoring input"
        data_shown: "Weights closer-distance slots more favorably in the match."
        gates_on: []
        accreditation_citation: >
          None directly — a student-experience optimization, not an accreditor evidence
          requirement. Adjacent for two served disciplines: CCNE Standard II, Key Element II-C
          names ACCESSIBILITY as one of the four properties a program must periodically evaluate
          its clinical sites on, and CAEP Standard R2, Component R2.1 frames clinical arrangements
          as co-constructed with geographically bounded district partners.
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe a distance-weighting input for matching."
        gap_severity: "none"
        gap_note: >
          A soft weighting, not a constraint — it biases the match rather than excluding slots.
          Discipline note worth recording: for Social Work this weight applies to the wrong
          workflow entirely, because SW students travel to agency INTERVIEWS before any placement
          exists (see the Field Application Form step), and the interview travel burden is
          invisible to a weight applied at match time.
      - element: "Customization based on Slot Type / Slot Settings / Slot Status (weighted checklists)"
        type: "weighted inclusion/exclusion list"
        data_shown: "Per-category custom weightings (higher number = higher priority) and the ability to exclude a category from the run entirely."
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.10 (discrete, filterable rotation attributes usable before clerkships begin) — the per-category weightings and exclusions are pre-clerkship scheduling inputs against exactly those discrete attributes."
        competitor_equivalent: "Not comparable at element level, and asymmetric in the same way as the rule builder: per capability-map.yaml and the PA Playbook, runs execute in staged batches with weighted difficulty scores on hard-to-fill specialties (Women's Health = 10, Pediatrics = 9) so scarce slots are placed first — no competitor's public marketing exposes weighting behavior at all, so it cannot be said whether CORE ELMS or one45 does more or less behind their login walls."
        gap_severity: "none"
        gap_note: "Weights are documented as manually configured per category; the staged-batch difficulty scoring is described as a best practice to set up, not an automatically derived scarcity metric."
      - element: "No supervision-ratio constraint anywhere in the rule set"
        type: "absent — negative finding, verified against the full documented Advanced Options list"
        data_shown: >
          Nothing. The documented rule set is: per-student max placements (IN EACH / IN COMBINED),
          overlapping-rotation exclusion, course-to-setting pairing, distance weighting, and
          slot-type/setting/status weighting. Supervision Type — captured on every slot — appears
          nowhere among the constraints or the weights.
        gates_on: []
        accreditation_citation: >
          ACOTE Standard C.1.7 (fieldwork-educator-to-student ratio), COA Standard F.7 (CRITICAL;
          hard 2:1 cap, enforced per preceptor per moment), CCNE Standard II, Key Element II-F
          (recommended 1:8 faculty-to-student for indirect NP-track supervision), and ACPE
          Standard 3, Key Element 3.3.e (2:1, Pharmacy). Four accreditors across three served
          disciplines and one expansion domain state a supervision-ratio expectation; the
          allocation engine consumes none of them.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research, and the
          absence is genuinely symmetric — no competitor file describes a ratio constraint in a
          matching engine either. State this as an industry gap rather than a Prism deficit, and
          note the strategic read: because the ratio field ALREADY EXISTS on the Prism slot and
          the concurrency machinery ALREADY EXISTS in the overlapping-rotation guard, Prism is
          closer to shipping this than any competitor's public materials suggest they are.
        gap_severity: "gap"
        gap_note: >
          Per ../accreditation/coa.yaml this should be scoped as a new derived object —
          "supervision assignment (preceptor x date x students)" sitting between Slot and
          Placement — plus a structured exception log (date, reason, contingency action, approver)
          to satisfy F.7's documented-exceedance allowance. Explicitly NOT as a slot-capacity
          validation: a slot cap constrains how many students a SITE takes over a rotation,
          whereas F.7 constrains how many students one PERSON supervises at one moment, and a site
          with ample slots can still breach F.7 on a short-staffed day. The two reusable
          precedents named there are both in this file: the overlapping-rotation guard (already a
          concurrency check, wrong axis) and the geolocated Faculty Timesheet (already ties a
          named supervising faculty member to a time-bounded clinical shift).
      - element: "No per-student exposure/coverage balancing weight (setting, population, age group, system level)"
        type: "absent — negative finding"
        data_shown: >
          Nothing. Course-to-setting PAIRING restricts which slots a course may draw from, and
          slot-setting WEIGHTING biases the pool, but neither reads a given student's
          already-completed exposure history to steer them toward a category they still lack.
        gates_on: []
        accreditation_citation: >
          CAA Standard 3.0B/3.6B is the clearest statement of the requirement: per
          ../accreditation/caa-asha.yaml the required software behavior is a per-student
          distribution view showing "where a student's exposure is thin BEFORE the student
          graduates — not a retrospective total." The same forward-looking framing appears in
          CAPTE Standard 6, Element 6H ("how the program MONITORS that each student has the
          required experiences"), ARC-PA Element B3.04 a-d ("gaps can be spotted mid-clinical-year
          while there is still time to re-place a student, not at graduation"), CSWE AS 3.3.1 (all
          five system levels for ALL students), ACOTE Standard C.1.11 (all students get comparable
          Level I experiences), and CAEP Component R2.3 (Breadth and Diversity per candidate).
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. CORE ELMS's 'customizable rules' and MedHub's 'lotteries based on custom rules and preferences' could in principle include a coverage rule; nothing public says whether they do."
        gap_severity: "gap"
        gap_note: >
          This is the single most repeated multi-discipline finding in this stage: six accreditors
          across six served disciplines all ask the same forward-looking question, and in every
          case Prism answers it retrospectively, from a REPORT built on completed experiences,
          rather than as an INPUT to the next allocation run. The data exists (clinical logs,
          setting tags, patient-log aggregates); it simply does not flow back into the matcher.
          Two operational caveats from ../accreditation/caa-asha.yaml worth carrying if this is
          ever pitched as real-time: the SLP Statistics tab refreshes only at 6am EST daily, and
          reports cap at 50 course offerings per run.
      - element: "No duty-hour or rest-period feasibility check in the rule set"
        type: "absent — negative finding, CRNA-specific"
        data_shown: >
          Nothing. Rotation dates and sub-blocks are the only temporal objects the allocator
          reasons about, and the only temporal rule is the student-level overlap exclusion.
        gates_on: []
        accreditation_citation: >
          COA Standard F.9 (CRITICAL) — student time commitment must not exceed 64 hours per week
          summed across class AND clinical hours, AVERAGED OVER 4 WEEKS; students must have a
          10-hour rest period between scheduled clinical duty periods; and at no time may a
          student provide direct patient care for longer than 16 continuous hours.
        competitor_equivalent: >
          The one place in this stage where competitors are demonstrably ahead in a NAMED,
          shipped capability. MedHub ships GME duty-hour tracking with "auto-alerts for
          violations" on a timesheet interface (content/competitors/medhub.yaml); one45 ships
          "duty-hours and leave-time tracking at the event level" for accreditation reporting
          (content/competitors/one45.yaml); LEO/DaVinci documents duty-hour logging in detail
          (content/competitors/leo-davinci.yaml). All three are ACGME-shaped rather than
          COA-shaped, and all three are RETROSPECTIVE violation detection rather than a scheduling
          constraint — no competitor is documented as refusing to build a schedule that would
          breach a rest rule. So the honest comparison is: three competitors detect violations
          after the fact, Prism does not detect them at all, and nobody prevents them at
          allocation time.
        gap_severity: "gap"
        gap_note: >
          Per ../accreditation/coa.yaml, F.9 needs a duty-hour ENGINE, not a timesheet total —
          every rule it states is a temporal-adjacency computation (rest gap between shifts,
          continuous-span ceiling, 4-week rolling average), and the shipped custom report builder
          only aggregates by Sum/Average over a date range. The didactic half is harder still:
          class hours live in Courses and clinical hours in Timesheet/CCE log, and nothing sums
          across the two into the single figure F.9 caps. That file's own recommendation is to
          scope it once as a reusable rules layer over timestamped duty periods, since Medicine
          and any GME-adjacent product need the same engine — which makes this a CRNA-triggered
          build with four-domain payoff rather than a one-discipline feature.
