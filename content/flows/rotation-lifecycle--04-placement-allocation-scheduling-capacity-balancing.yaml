      - element: "Location and supervisor mapping rules (admin-side reconciliation of student free-text entries)"
        type: "admin mapping form with hard uniqueness constraints"
        data_shown: >
          Admin maps each manually entered location and supervisor onto an existing Prism record.
          Documented rules: a location can be mapped ONLY ONCE and is thereafter unavailable to
          other submissions; supervisor mapping requires the location to be mapped first; and the
          admin may edit or correct a student's typed response (the playbook's example: an
          abbreviated agency name) before mapping.
        gates_on:
          - "Create Placement is unavailable for an unmapped suggestion. Mapping is therefore the real gate on this workflow, and it is manual work proportional to how many students typed rather than picked."
        accreditation_citation: "CSWE AS 3.3.4 — the vetting/approval process the standard requires is enforced here by construction: a student-proposed agency cannot become a placement until an admin has resolved it onto an approved Agency record."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          The mapping burden is the discipline's real operational cost at this stage, and the SW
          playbook's stated best practices are all mitigations for it: encourage students to
          select existing locations rather than typing, review manual entries promptly, monitor
