  # NEW STEP (2026-08-25): CRNA's binding constraint is not slot capacity but a
  # per-preceptor, per-moment supervision ratio, plus a duty-hour ceiling. Neither is
  # a matching input today. Distinct from stage 2's credentialing angle on the same
  # preceptor record.
  - screen: "Ratio- and Duty-Hour-Constrained Assignment (CRNA / Nurse Anesthesia)"
    navigation_path: "Sites > [site] > Locations > [location] > Slots (ratio capture) — then Placements > [Course or Placement Group] > Make Placement (the assignment the ratio should constrain)"
    elements:
      - element: "Sites > Slots supervision-ratio entry as the only COA F.7 input"
        type: "declared value on a capacity record"
        data_shown: >
          The Nursing playbook names this path explicitly: \"Sites > Slots — for CRNA programs,
          this is where the student-to-preceptor supervision ratio is assigned and monitored
          against COA's hard 2:1 cap (Standard F.7, critical).\" It is a number an admin or site
          types against a location's capacity offer for a rotation.
        gates_on:
          - "Nothing. It is monitored by reading, not enforced by the system."
        accreditation_citation: >
          COA Standard F.7 (CRITICAL) — at no time may the number of students directly supervised
          by one clinical preceptor exceed 2:1 (no more than 2 students to 1 CRNA, or 2 students
          to 1 physician anesthesiologist if no CRNA is involved), and the ratio must additionally
          account for anesthetic/surgical complexity, the student's knowledge and ability, and
          patient comorbidities. Brief exceedances are tolerated only for extenuating circumstances
          and only with a demonstration that the event was rare AND that contingency plans existed.
          The program must also show students know who is supervising them at any given time.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. Worth
          being precise about the market: none of the nine competitor files documents a
          CRNA-specific capability at all, and the two that name nurse anesthesia adjacently
          (MedHub/E*Value's 24-discipline list includes nursing; CORE ELMS's 15+ list includes
          nursing) describe generic nursing placement, not COA-shaped supervision accounting. The
          conclusion is symmetric: nobody in this research ships COA F.7 compliance.
        gap_severity: "gap"
        gap_note: >
          The unit of account is wrong, and per ../accreditation/coa.yaml the mismatch is
          load-bearing rather than cosmetic: a slot count constrains how many students a SITE takes
          over a rotation; F.7 constrains how many students one PERSON supervises at one moment. A
          site with ample slots can still breach F.7 on a short-staffed day, and a program with a
          perfectly configured slot ratio has no record that would detect it. Prism holds every
          input (preceptor entity, credential check, capacity field) and computes none of the
          output — that file's verdict is "Build," not "Configure."
      - element: "No supervision-assignment object (preceptor x date x students) between Slot and Placement"
        type: "absent — negative finding, the core COA F.7 gap"
        data_shown: >
          Nothing. A placement associates a student with a location and dates; the preceptor
          appears on the placement and on the CCE/patient log, but no record answers "which named
          supervising CRNA is responsible for which students on which clinical day."
        gates_on: []
        accreditation_citation: >
          COA Standard F.7 (CRITICAL), whose required software behavior per ../accreditation/coa.yaml
          is four-part: (1) record per clinical day which named supervising CRNA or physician
          anesthesiologist is responsible for which students; (2) compute the OBSERVED concurrent
          ratio from that assignment data rather than trusting a declared capacity number; (3)
          block or hard-warn at assignment time when a third student would land on the same
          preceptor on the same day; and (4) provide a structured exception record (date, reason,
          contingency action taken, approver) that aggregates into the "this is rare and planned
          for" narrative COA demands. Because supervision is also capped to credentialed
          CRNAs/anesthesiologists under COA Standard F.5 (CRITICAL), the preceptor referenced by
          the ratio must be the same credentialed personnel record the clearance gate validates —
          which is where this stage meets rotation-lifecycle stage 2.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. The nearest structural analogue anywhere in the competitor set is New Innovations' GME 'Daily Schedule Management' and on-call scheduling (content/competitors/new-innovations.yaml), which does model per-day staffing — but for residents' own duty schedules, not for supervisor-to-learner ratio enforcement, and with no public evidence of a ratio rule."
        gap_severity: "gap"
        gap_note: >
          The two reusable precedents named in ../accreditation/coa.yaml both live in this same
          flow: the Placement Assist overlapping-rotation guard (already a concurrency check, just
          on the student axis instead of the preceptor axis) and the geolocated Faculty Timesheet
          (already ties a named supervising faculty member to a time-bounded clinical shift). That
          file also cross-references ../journeys/preceptor-site-onboarding.yaml, which reached the
          same conclusion independently — that the declared "# of offers" count is the only
          evidence for a live 2:1 standard, and PA's Max Placement rule is the only match-time
          surfacing mechanism in the product. Since Max Placement Limit is lockstep-only and
          PA-exclusive, CRNA cannot use even that.
      - element: "CRNA program-administrator tutorials contain no placement, scheduling, or capacity content"
        type: "absent — sourcing finding, recorded so the absence is not mistaken for coverage"
        data_shown: >
          All three published CRNA administrator videos were read end to end. Video 1 (lines 15-37)
          is the Daily Clinical Evaluation Report. Video 2 (lines 43-89) is the Clinical Case
          Experience / Patient Log — its only preceptor mention is as a log REVIEWER ("you must
          specify whether a preceptor should review the student's patient log", line 67), and its
          reporting walkthrough aggregates by STUDENT ("select the Student Activity Insights
          report", line 83), never by preceptor. Video 3 (lines 95-117) is the Echo360/GoReact LTI
          integration. Zero mentions of slots, wishlists, Placement Assist, capacity, allocation,
          matching, or duty hours across all three.
        gates_on: []
        accreditation_citation: "None — this element records a source-coverage fact, not a product behavior. It is the evidentiary basis for treating COA F.7 and F.9 as Build rather than Configure: there is no CRNA placement documentation that could contain an undiscovered mechanism."
        competitor_equivalent: "Not applicable — an absence in the source set, not a product surface."
        gap_severity: "none"
        gap_note: >
          Stated explicitly to prevent a false inference in either direction. The absence of CRNA
          placement tutorials does NOT prove CRNA programs lack placement functionality — they use
          the same generic Placements module as everyone else. It proves only that no
          CRNA-SPECIFIC placement mechanic is documented, which is why the COA F.7 and F.9 verdicts
          rest on the standards text and the Nursing playbook rather than on a CRNA product surface.
          Same treatment the SLP and Nursing playbooks apply to their own gap lists.
      - element: "No duty-hour feasibility check at assignment time"
        type: "absent — negative finding; see the parallel Advanced Options element"
        data_shown: >
          Nothing at the point of assignment. Timesheets exist for CRNA programs (confirmed present
          alongside Forms and Evaluations and Patient Logs in Learning Activities > Setup,
          /Users/romitsoley/Downloads/CRNAVideosTranscripts.md line 103), and the CCE log captures
          anesthesia time and clinical hours per encounter — but both are retrospective capture, and
          neither is consulted when a placement is created.
        gates_on: []
        accreditation_citation: >
          COA Standard F.9 (CRITICAL) — 64 hours per week summed across class AND clinical hours and
          averaged over 4 weeks; a 10-hour rest period between scheduled clinical duty periods; and
          no direct patient care exceeding 16 continuous hours. Total clinical hours must also be
          greater than or equal to total anesthesia time for the same student.
        competitor_equivalent: >
          Three competitors ship duty-hour tracking and all three are retrospective: MedHub
          ("intuitive timesheet interface with auto-alerts for violations"), one45 ("duty-hours and
          leave-time tracking at the event level"), and LEO/DaVinci (duty-hour logging documented in
          detail). None is documented as a scheduling CONSTRAINT that refuses to build a violating
          schedule, and all three are ACGME-shaped rather than COA-shaped. So competitors detect
          after the fact, Prism does not detect, and nobody prevents at allocation time.
        gap_severity: "gap"
        gap_note: >
          Per ../accreditation/coa.yaml this is the closest thing in the four-domain workstream to
          ACGME duty-hour tracking and is a genuinely reusable build — Medicine and any GME-adjacent
          product need the same engine. Scope it once as a rules layer over timestamped duty
          periods, not as a CRNA report. Note the architectural constraint that file names: F.9's
          figure spans didactic AND clinical, so the engine cannot live wholly inside the placement
          module.
    action: "Coordinator assigns CRNA students to sites and preceptors using the generic placement machinery, with the 2:1 supervision cap and the duty-hour ceiling enforced by human vigilance rather than by the system."
    confirmed_by: >
