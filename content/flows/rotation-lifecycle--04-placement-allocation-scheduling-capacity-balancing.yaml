  - screen: "Multi-Location Field Application Form & Interview-Status-Driven Placement Creation (Social Work)"
    navigation_path: "Dashboard/hamburger > Process Field Application Forms > All Requests tab > View by Rotations: Upcoming and Current > [Submitted] > View"
    elements:
      - element: "Placement suggestion rows (up to 10 per form) — Location, Supervisor/Preceptor, Interview Status, interview schedule, student comments"
        type: "student-submitted repeating record set"
        data_shown: >
          Each row is one candidate agency the student intends to interview with, carrying its own
          interview status and schedule. Ten suggestions per form is the documented ceiling. This
          replaces the slot-ranking model entirely: there is no reserved capacity to rank, because
          the placement does not exist until an agency offers it.
        gates_on:
          - "Locations selected directly from Prism records need no mapping; manually typed locations must be mapped by an admin before a placement can be created from them."
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.4 requires documented processes for identifying,
          approving, and engaging with field education settings — a student-proposed agency is
          exactly the case that process exists to govern. CSWE AS 3.3.1 (with M3.3.2) requires
          opportunities across all five system levels for ALL students, which is a property of the
          resulting placement MIX and therefore of what these suggestions collectively produce.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research, and the
          absence is meaningful rather than merely unproven: both CORE ELMS and MedHub/E*Value
          explicitly sell into social work (content/competitors/core-elms.yaml,
          content/competitors/e-value.yaml), and both describe their clinical-placement capability
          purely in matching-engine terms (SmartMatch; "evaluation-driven rotation/site/educator
