# Element-level ground truth underneath rotation-lifecycle.yaml, stage 4.
# Every accreditation_citation and competitor_equivalent claim below traces to a real
# source file in confirmed_by — see content/flows/_TEMPLATE.yaml for the contract.
# SCHEMA v2 (2026-08-24): analysis fields live on each element, not on the step.
#
# SCOPE EXTENSION (2026-08-25): this file originally covered only the four EXPANSION
# domains (DO/COCA, Pharmacy/ACPE, Dentistry/CODA, Medicine/LCME). It now also covers the
# eight disciplines Exxat/Prism ALREADY serves today — PT/PTA, OT/OTA, PA, SLP, Nursing,
# Social Work, Teacher Education, and CRNA — because placement allocation is the one stage
# where "we already serve this discipline" and "we satisfy this discipline's accreditor"
# come apart most sharply. Discipline-specific material is either a new element, a new step,
# or a clause explicitly flagged with the discipline name; nothing in the original
# four-domain analysis was deleted.
#
# COMPETITOR-COMPARISON NOTE, and it materially changes the honesty of this file: for the
# four expansion domains, the recurring "not comparable at element level" verdict is
# unavoidable, because no competitor publishes admin-side screens. For these EIGHT existing
# disciplines the situation is different in one specific way — the competitors are provably
# selling into the SAME disciplines, not adjacent ones. CORE ELMS markets SmartMatch across
# "15+ disciplines including pharmacy, dental, nursing, PT, OT, PA, veterinary, social work,
# and undergraduate medicine" (content/competitors/core-elms.yaml), and MedHub/E*Value
# markets across "24+ named disciplines (GME, UME, nursing, PT/OT, pharmacy, dentistry,
# osteopathic medicine, PA, athletic training, social work, and more)"
# (content/competitors/e-value.yaml). So the comparison is head-to-head on MARKET even where
# it remains asymmetric on EVIDENCE: we can read Prism's own tutorials and only competitors'
# marketing pages. Every competitor_equivalent below says which of those two things it is.
flow_name: "Placement Allocation, Scheduling & Capacity Balancing"
maps_to_journey: "rotation-lifecycle.yaml, stage 4"
persona: >
  Primary: Clinical Coordinator / Program Administrator
  (see ../personas/role-clinical-coordinator.yaml, ../personas/role-program-admin.yaml).
  Discipline title varies and the variance is not cosmetic — it changes who owns the
  allocation decision. PT: Director of Clinical Education (DCE) / ADCE, with an SCCE on the
  site side who receives slot requests and assigns the CI after the student is placed.
  OT: same DCE-equivalent, with Fieldwork Educators (Level I/II) and Site Mentors (capstone).
  PA: program admin working against a site-based OR preceptor-based slot model.
  Social Work: Director of Field Education / Field Placement Coordinator, whose real job at
  this stage is tracking student-run agency interviews rather than running an allocator.
  Teacher Education: placement coordinator working against district partners and
  school-based cooperating teachers (CAEP's "clinical educators").
  CRNA: CRNA Program Administrator, whose binding constraint is a per-preceptor supervision
  ratio rather than a per-site slot count.
steps:
  - screen: "Rotation Setup"
    navigation_path: "Placements > [Course or Placement Group] > Rotation Setup > + Add rotation"
    elements:
      - element: "Title, Start Date, End Date"
        type: "input fields"
        data_shown: "Rotation identity and the calendar window it occupies."
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.1.a (IPPE structure/sequencing) — the dated rotation shell is the structural unit that sequencing would be built on top of; sequence order itself is not expressed here, only the window each rotation occupies."
        competitor_equivalent: "Not comparable at element level — no competitor's public docs expose a rotation-setup screen with this field-level detail (start/end date granularity); comparison would require a competitor demo environment or admin-side screenshots, neither of which exist in the current source set."
        gap_severity: "none"
        gap_note: ""
      - element: "Minimum recommended duration / Time Segment"
        type: "input field + toggle (weeks/days/hours)"
        data_shown: "The minimum attendance threshold a placement inside this rotation must meet, expressed in the unit the program chooses."
        gates_on: []
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.1.a (IPPE structure) — this is the duration-floor half
          of the structural unit, not the sequencing half; it sets a minimum-hours/weeks
          threshold but does not itself carry a required-hours accreditor figure.
          EXISTING-DISCIPLINE CLAUSE, and this is where the four-domain reading understates the
          problem: for six of the eight served disciplines the accreditor DOES publish a hard
          numeric floor that this exact field is the natural home for, and in every case the
          floor is conditional on something the field cannot see. CAPTE Standard 6, Element 6A
          requires a minimum of 30 weeks of FULL-TIME clinical education at a minimum of 32
          hours/week, which means only terminal experiences count and Integrated Clinical
          Experience (ICE) weeks must be excluded. ACOTE Standard C.1.12 sets 24 weeks full-time
          Level II for OT (doctoral/master's) but 16 weeks for OTA (baccalaureate/associate) —
          one standard number, two thresholds, split by degree level. ACOTE Standard D.1.5 sets a
          third figure for the OTD doctoral capstone: 14 weeks at a minimum of 32 hours/week.
          CSWE Accreditation Standard 3.3, AS 3.3.3 sets 400 hours (BSW) / 900 hours (MSW).
          CAA Standard 3.0B/3.1B sets the 400 supervised clinical practice hours for SLP.
          CCNE Standard III, Key Element III-H sets DNP 1,000 hours and NP 500 direct hours.
          COA Standard E.2.3 sets 2,000 clinical hours plus roughly 60 case-category thresholds
          for CRNA.
        competitor_equivalent: "Not comparable at element level — no competitor's public docs expose a duration-floor field with a selectable time-segment unit at this granularity. Worth stating plainly that this is a documentation asymmetry rather than a demonstrated Prism advantage."
        gap_severity: "configure-needed"
        gap_note: >
          The field holds one number with no notion of what the number is FOR. Per
          ../accreditation/capte.yaml (Element 6A) there is no "counts toward the CAPTE
          full-time minimum" flag on rotation setup, so the ICE-vs-terminal split rides entirely
          on naming convention; per ../accreditation/acote.yaml (C.1.12) nothing enforces the
          degree-level-conditional 24-vs-16-week threshold, which matters because one university
          commonly runs OTD/MSOT and OTA in the same Prism tenant; and per the same file (D.1.5)
          the 14-week/32-hour capstone rule is a two-part rule (duration AND weekly intensity)
          that no report evaluates. In every case the rollup is a report an admin reads, not a
          rule the system checks.
      - element: "Setup Advanced Schedule (slider)"
        type: "toggle + sub-block form"
        data_shown: "Splits one rotation into smaller dated sub-blocks (e.g. AM/PM shifts, or specific weekdays); slots and placements can then be managed at the sub-block level."
        gates_on: []
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.1.a (IPPE structure/sequencing) — sub-blocks are the
          finest structural grain the rotation shell supports, and are the level at which shift-
          or weekday-level sequencing would be built.
          EXISTING-DISCIPLINE CLAUSE: this is the mechanism three served disciplines depend on
          for their part-time experience types. PT's Integrated Clinical Experience is explicitly
          "part of a day, one day a week for several weeks"; OT's Level I fieldwork runs in short
          bursts alongside didactic work; and CAEP Standard R2, Component R2.3 requires a
          sequenced multi-experience model (early field observation hours -> practicum ->
          culminating student teaching) rather than a single terminal placement, which is the
          same sub-block shape at semester scale.
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe sub-block/advanced-schedule decomposition of a rotation at this granularity."
        gap_severity: "none"
        gap_note: >
          PT-specific operational pain point recorded verbatim in the PT playbook's own Pain
          Points list: \"Management of slot request, wishlist, and Placement Assist for 'split'
          terminal rotations.\" So the sub-block primitive exists, but the allocation machinery
          built on top of it is documented as hard to use for exactly the case sub-blocks were
          meant to serve. That is a usability gap inside a shipped capability, not a missing
          capability.
      - element: "Linked course + cohort scope (lockstep vs. non-lockstep program model)"
        type: "picker + inherited program-model constraint"
        data_shown: >
          Which course offering and which cohort the rotation belongs to. Not a cosmetic
          association: the program's lockstep-vs-non-lockstep model, set far upstream, decides
          which allocation features are even available at this stage.
        gates_on:
          - "The PA-exclusive Max Placement Limit (see the Max Placement Limit step) is documented as available only to LOCKSTEP-based domains — so this upstream program model, not a per-rotation setting, is what gates the only shipped intake cap."
        accreditation_citation: >
          None directly — program-structure modelling carries no accreditor evidence requirement
          of its own. Indirectly relevant to ACOTE Standard C.1.12 and CAPTE Standard 6, Element
          6A, since both thresholds are per-cohort progressions that only make sense inside a
          declared cohort model.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. The
          nearest public analogue is eMedley's eduSched, described as "track/path-based"
          scheduling (content/competitors/emedley.yaml) — the same idea of a program-model
          dimension above the rotation — but with no field-level detail to compare.
        gap_severity: "configure-needed"
        gap_note: >
          Confirmed lockstep disciplines: PT ("PT programs are always Lock Step") and OT ("OT
          programs are always Lock Step") per their playbooks; PA per the Max Placement Limit
          documentation. Social Work is explicitly NOT modelled that way — its playbook gives two
          competing cohort conventions (by student enrollment date, or by practicum start date)
          and adds Groups/Campuses/Categories for Foundation Year, Advanced Standing, and
          full-time/part-time tracks. Nursing configures a separate Curriculum Grid per
          degree/track (ADN/BSN/MSN/DNP/APRN certificate/CRNA), so one Nursing tenant can hold
          several structurally different progressions at once. The practical consequence is
          concrete and worth naming: the only shipped intake cap in this stage is unavailable to
          Social Work and to most of Nursing, including CRNA — the discipline with the single
          hardest capacity cap in this entire research set (COA Standard F.7).
      - element: "Rotation-level visibility toggles: 'show other students placed' and 'show on the Site Resources page'"
        type: "two toggles on the rotation record"
        data_shown: "Whether students placed in this rotation can see who else is placed there, and whether the rotation appears on the site-facing Site Resources page"
        gates_on:
          - "The first decides whether a cohort can self-organise around a placement (housing, carpooling, peer support) or discovers their co-placements only on arrival."
          - "The second decides whether the site sees the rotation at all on the surface Prism gives site personnel."
        accreditation_citation: >
          ACOTE Standard C.1.2 (../accreditation/acote.yaml) — student access to fieldwork site
          information. The Site Resources toggle is the same surface rotation-lifecycle--02
          documents as the preceptor-facing handbook/orientation library, so this toggle is what
          puts a rotation in front of the audience that standard cares about.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research — no
          competitor's public materials describe per-rotation visibility controls, in either the
          student or the site direction.
        gap_severity: "none"
        gap_note: >
          ADDED 2026-08-25 from a full read of the PT playbook, whose rotation-setup field
          enumeration (Physical Therapy (PT) Playbook.md line 71) is the only source in this corpus
          that lists these two options: "option to show other students placed, option to show on the
          Site Resources page." Small and worth having because both are silent-by-default decisions
          with downstream consequences this journey documents elsewhere. The Site Resources toggle
          in particular connects a scheduling screen to the under-adoption finding
          ../accreditation/acote.yaml records against Site Resources ("CSS is told to proactively
          promote it") — a program that never turns this on has a Site Resources page with nothing
          rotation-specific on it, which is part of why the surface is hard to find.
      - element: "Special-case rotation types: Integrated Clinical Experience, Directed Practice Experience, and residency/fellowship"
        type: "ordinary rotation records used for three structurally different experience types; no dedicated type field"
        data_shown: >
          Per Physical Therapy (PT) Playbook.md lines 73-77 three special cases are set up as
          rotations. INTEGRATED CLINICAL EXPERIENCE (ICE): part-time, completed early in the program
          during didactic learning (year 1 or 2), typically at local sites such as the institution's
          partner hospital, "often in short bursts (part of a day, one day a week for several weeks)."
          DIRECTED PRACTICE EXPERIENCE (DPE): "exposure to a specialty area of practice beyond
          entry-level exposure/knowledge a student would ordinarily receive," typically occurring
          during a terminal clinical experience. RESIDENCIES & FELLOWSHIPS: recorded as an active
          pilot with Mercer University's Residency & Fellowship Programs, with forms, workflows and
          placement requirements still being analysed.
        gates_on: []
        accreditation_citation: >
          CAPTE Standard 6, Element 6A (../accreditation/capte.yaml) — the 30-weeks-of-full-time
          minimum at 32 hours/week counts terminal experiences and must EXCLUDE ICE weeks, so the
          ICE-versus-terminal distinction is the load-bearing one and capte.yaml records that
          rotation setup has no "counts toward the CAPTE full-time minimum" flag to express it.
          The APTA-side body for the third case is ABPTRFE (American Board of PT Residency &
          Fellowship Education, named at PT playbook line 37), which has no registry file in
          ../accreditation/ — recorded as a coverage gap rather than cited as though it did.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. Adjacent
          and worth noting: five of the nine competitor files are GME-first products
          (content/competitors/new-innovations.yaml, medhub.yaml, e-value.yaml, one45.yaml,
          leo-davinci.yaml), i.e. post-graduate residency IS their native market — so on the third
          case specifically, the competitive set is stronger than Prism and this repo's teardowns
          are aimed at the wrong half of their product to prove it either way.
        gap_severity: "gap"
        gap_note: >
          ADDED 2026-08-25. This file already documented ICE in passing on the Advanced Schedule
          element; naming all three together turns a scheduling note into a structural finding.
          Three experience types with three different accreditation consequences ride on ONE
          undifferentiated rotation record: ICE must be excluded from the CAPTE 6A count, DPE is
          explicitly ABOVE entry level and therefore should not be evidencing an entry-level
          competency standard at all, and residency/fellowship sits under a different accrediting
          body entirely. Nothing in rotation setup distinguishes them, so the distinction lives in
          the rotation's NAME — which is exactly the naming-convention dependency capte.yaml flags
          for the ICE/terminal split, generalised to three cases instead of two.
          The residency/fellowship pilot is worth carrying for a separate reason: it is the only
          confirmed instance in this corpus of Prism being trialled for POST-graduate experiential
          education, which is the segment every GME-first competitor in ../competitors/ already
          occupies. Recorded as a pilot, not as a capability — the playbook itself says forms,
          workflows and requirements are still being analysed.
      - element: "Off-track and cohort-moving students within a lockstep program"
        type: "absent as a modelled state — handled by cohort reassignment and remediation rotations"
        data_shown: >
          Per Physical Therapy (PT) Playbook.md lines 49-53: PT programs "are always Lock Step";
          cohort movement "is common when students withdraw and later return, go on leave, fail
          experiences, etc."; and students "can also fall off-track with clinical experiences and
          still maintain their original cohort — via remediation experiences, retaking failed
          clinicals, or completing clinical experiences out of sequence." The playbook's stated best
          practice is that "if the student is NOT changing cohorts and NOT completing a special
          remediation experience, recommend their placements be made in the original course/rotation
          with the rest of their cohort."
        gates_on:
          - "Cohort is the partition key for the Max Placement Limit and for shared-rotation slot deduction, so moving a student between cohorts moves them between two independent capacity pools."
        accreditation_citation: >
          CAPTE Standard 1, Element 1C2 (../accreditation/capte.yaml) — the graduation-rate
          computation, whose denominator control is the "decelerated" student flag the PT playbook
          documents at line 232 and which capte.yaml calls "precisely the denominator control an
          ultimate-pass-rate calculation needs." CAPTE Standard 2, Element 2D4 also reads on this,
          since a retaken failed clinical is the mechanism a program uses when CI assessment
          suggests less than entry-level performance.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research — no
          competitor file describes cohort reassignment, deceleration, or an out-of-sequence
          placement. one45's "multi-layered concurrent schedules" claim
          (content/competitors/one45.yaml) implies some tolerance for learners on divergent paths
          but publishes nothing about how a learner leaves and rejoins a lockstep progression.
        gap_severity: "configure-needed"
        gap_note: >
          ADDED 2026-08-25. The lockstep model is already recorded on the element above; what was
          missing is that lockstep programs routinely contain students who are NOT in step, and
          that Prism handles them by convention rather than by structure. Three distinct situations
          share one mechanism (put them in a different cohort, or place them in a different
          rotation) and each carries a different downstream meaning: a student on leave, a student
          repeating a failed clinical, and a student taking clinicals out of sequence are not the
          same case, but the placement record cannot tell them apart. The playbook's own best
          practice is a mitigation for exactly that ambiguity — keep the student in the original
          course/rotation UNLESS they genuinely changed cohorts or are on a remediation experience,
          precisely so the cohort roster stays a meaningful denominator.
          The connection to rotation-lifecycle--08 is direct and worth making: the AAR pull sequence
          depends on the decelerated flag being set correctly, and this element is where that flag's
          correctness is actually determined — at the moment a coordinator decides whether an
          off-track student moves cohorts or stays put. That decision is made in a placement screen
          and consumed in an accreditation report, with nothing joining the two.
      - element: "Course-container model choice — the three documented Social Work course-setup patterns"
        type: "absent as a product affordance — a documented implementation decision with no in-product guidance"
        data_shown: >
          Nothing in-product. The SW playbook records three named models a program chooses between
          at implementation (Social Work (SW) Playbook.md lines 63-67): a COMBINED course covering
          multiple practicum pathways, "useful when combining a Learning Contract & Evaluation
          across terms"; ONE COURSE OFFERING PER ACADEMIC YEAR with rotations for each student
          pathway; and ONE COURSE PER TERM, "ideal for schools using automated student-registration
          feeds."
        gates_on:
          - "Which rotation/cohort scoping is even expressible downstream — a combined course spanning terms cannot carry per-term rotation dates, and a per-term course cannot carry one Learning Contract across the year."
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.3 (../accreditation/cswe.yaml) — the 400 BSW /
          900 MSW minimum is a PROGRAM total accrued across every field experience, so whether
          field hours live in one course or in three decides whether the accrual rollup is a
          single report or a manual merge. Also CSWE Accreditation Standard 5.0, AS 5.0.1(b),
          which requires outcomes broken out for each program option AND in aggregate — the
          per-option/aggregate collision recorded in rotation-lifecycle--08 originates in exactly
          this choice.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. CORE ELMS
          and MedHub/E*Value both sell into social work (content/competitors/core-elms.yaml,
          content/competitors/e-value.yaml) but neither publishes a course-container model at all,
          so there is nothing to compare three named patterns against.
        gap_severity: "gap"
        gap_note: >
          NEW 2026-08-25, from a full read of the SW playbook rather than a per-stage sample. This
          is the same shape of finding already recorded for wishlist types on the next step —
          discipline defaults documented in an internal playbook and absent from the product — but
          it bites harder, because the course-container decision is made ONCE at implementation and
          determines what every later stage of this journey can express. The playbook's own third
          option is explicitly conditional on an infrastructure fact ("ideal for schools using
          automated student-registration feeds"), i.e. the right answer depends on whether the
          school has a banner/SIS feed, which is not a question the rotation-setup screen asks.
          Read together with the cohort-naming element below and the Learning Contract split model
          in rotation-lifecycle--07, Social Work is the discipline where the largest share of the
          real configuration decisions live in a playbook and none of them live in the UI.
      - element: "Cohort-naming convention (two named Social Work options, neither defaulted)"
        type: "absent as a product affordance — a documented naming convention"
        data_shown: >
          Per Social Work (SW) Playbook.md lines 41-44 there is no single house standard for SW,
          "unlike PT's graduation-year default." Option 1 names cohorts BY STUDENT ENROLLMENT DATE
          (e.g. "Traditional Fall 2025", "Advanced Standing Fall 2025") and suits schools with a
          banner/automated data feed; Option 2 names them BY PRACTICUM START DATE (e.g. "Generalist
          Fall 2025", "Specialization Spring 2026") and suits schools that manually upload student
          data. Groups carry the academic track (Foundation Year, Advanced Standing, Clinical
          Practice, Macro Practice, Behavioral Health, School Social Work), Campuses carry
          Main/Satellite/Online/Regional, and Categories carry Full-Time, Part-Time, Traditional,
          Advanced Standing, Behavioral Science Track, Child Welfare Specialization (lines 48-50).
        gates_on:
          - "The cohort is the partition key for the Max Placement Limit and for shared-rotation slot deduction (see the Max Placement Limit step) — but SW is excluded from that feature anyway on lockstep grounds, so for SW the cohort's practical role is reporting segmentation."
        accreditation_citation: >
          CSWE Accreditation Standard 5.0, AS 5.0.1(b) (../accreditation/cswe.yaml) — outcomes
          reported for each PROGRAM OPTION and in aggregate. Whether "Generalist" and
          "Specialization" are Cohorts, Groups, or Categories decides whether that break-out is a
          filter or a rebuild, and ../accreditation/cswe.yaml already records that this "is a
          configuration decision made months before anyone reads AS 5.0.1(b)."
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research — no
          competitor file describes a cohort-naming or program-option segmentation model.
        gap_severity: "configure-needed"
        gap_note: >
          SHARPENED 2026-08-25: this file previously recorded that SW "gives two competing cohort
          conventions" without naming them or citing where. Both are now named with line-level
          citations, and the operative detail is the one the summary lost — the choice is driven by
          whether the school has an automated registration feed, not by pedagogy. Practical
          consequence for this stage: Option 2 (by practicum start date) makes the cohort a
          placement-season object and therefore aligns cleanly with rotation scoping; Option 1 (by
          enrollment date) makes it an admissions object, and a program on Option 1 running
          part-time and full-time tracks will have students from one cohort placed across two
          practicum seasons. Nothing in rotation setup warns about that.
      - element: "CEU Credits / thank-the-supervisor-with-credit-for-hours (fixed hours or approved-timesheet hours)"
        type: "numeric input + source toggle"
        data_shown: "Continuing-education credit the site supervisor earns for taking the student, either as a fixed figure or derived from approved timesheet hours."
        gates_on: []
        accreditation_citation: "None — supervisor incentive/recognition mechanics carry no accreditor evidence requirement in any of the twelve standards files in ../accreditation/."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor's public materials describe supervisor CEU crediting as a rotation-setup field."
        gap_severity: "none"
        gap_note: >
          PT/OT-specific and included here because it is a real capacity lever the four-domain
          reading missed: in a market where the PT playbook records \"national competition for IP
          and Acute care slots\" as an industry-level problem, CEU credit is part of what keeps a
          site offering slots at all. Both the PT and OT playbooks record the same operational
          wrinkle — CEUs vary by state, so many programs deliberately leave the CEU total blank
          and list supervision hours instead, letting the CI/educator or their state APTA or
          IACET chapter do the conversion.
    action: "Admin defines the rotation shell (dates, duration floor, optional sub-blocks, cohort scope) that supply (slots) and demand (students) will later be matched into."
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help for Program Administrators/Step-by-Step Guides (How-tos)/Placements/Adding and Deleting Rotations.md;
      discipline-specific rotation-setup fields and lockstep model from
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical Therapy (PT) Playbook.md
      — read IN FULL 2026-08-25; lines 43 (the PT settings taxonomy), 45-53 (cohort by graduation
      year, "PT programs are always Lock Step", cohort movement on withdrawal/leave/failure, the
      off-track-but-same-cohort cases, and the keep-them-in-the-original-rotation best practice),
      55-60 (Groups, Student Categories, Announcements, Resources, Attestations, and per-setting
      Program Requirements), 68-71 (placement course names and the full rotation-setup field list
      incl. the two visibility toggles and the CEU/thank-the-CI options), 73-77 (the three special
      cases: ICE, DPE, and the Mercer residency/fellowship pilot), 115-123 (placement-notification
      lead times, the student-contacts-CI-at-2-3-months convention, and the
      schools-provide-documentation norm), 182-188 (Pain Points) and
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational Therapy (OT) Playbook.md
      (sections 9-10, "Cohort", "Rotation Setup"); cohort/track variance from
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social Work (SW) Playbook.md
