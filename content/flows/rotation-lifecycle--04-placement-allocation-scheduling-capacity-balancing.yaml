      - element: "Create Placement — the three documented conversion scenarios"
        type: "branching commit flow off a mapped suggestion"
        data_shown: >
          Per Social Work (SW) Playbook.md lines 107-111 the Create Placement action behaves three
          different ways depending on the state of the student's suggestions. ONE MAPPED LOCATION:
          location and supervisor auto-populate. MULTIPLE MAPPED LOCATIONS: the admin is prompted
          to choose which mapped location to use. A "PLACEMENT ACCEPTED" SUGGESTION EXISTS: the
          location-selection step is skipped entirely and the flow goes straight to placement
          details.
        gates_on:
          - "The third branch is the one that makes Interview Status load-bearing rather than decorative: the terminal, exclusive Placement Accepted state is what suppresses the location picker, so a student who never updates their status forces the admin through a manual choice they did not need to make."
        accreditation_citation: >
          CSWE Accreditation Standard 3.3, AS 3.3.5 (../accreditation/cswe.yaml) — the documented
          placement trail. The branch that matters for evidence is the second one: where the admin
          picks among several mapped locations, the reason for that choice is not captured anywhere,
