  - screen: "Manual / Direct Placement"
    navigation_path: "Placements > [Course] > Location view (Slots > Students Interested drawer) or Student view > Make Placement drawer"
    elements:
      - element: "Interested Students drawer — Send interest to location / Place button"
        type: "list + action buttons"
        data_shown: "Students who expressed interest in a location outside the algorithmic run."
        gates_on: []
        accreditation_citation: "None directly."
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe an interest-expression or manual-placement fallback list in this detail."
        gap_severity: "none"
        gap_note: ""
      - element: "Make Placement drawer — Place / Place and Publish Now (Place Individually or Place as a Group)"
        type: "buttons"
        data_shown: "Commits a manual placement; 'Publish' is a distinct, separate action from creating the match itself."
        gates_on: ["Max Placement Limit warning banner surfaces here if configured (non-blocking, per the Max Placement Limit step above)"]
        accreditation_citation: "None directly at this element, though it is one of the surfaces where the ACPE 3.3.e-adjacent Max Placement Limit warning appears — and, as documented there, the warning does not block this button."
        competitor_equivalent: "Not comparable at element level — no competitor's public docs describe a manual-placement commit action, or a separate publish step, in this detail."
        gap_severity: "none"
        gap_note: "Publish is a distinct action from creating the match, so a created placement is not necessarily student-visible. Any cap non-compliance surfaced here is advisory only — see the Max Placement Limit warning-banner element."
      - element: "Placement-notification lead time and the student-to-CI contact convention (PT/PTA)"
        type: "operating convention on top of the Publish action; no lead-time field or reminder exists"
        data_shown: >
          Nothing in-product. The documented PT practice (Physical Therapy (PT) Playbook.md lines
          115-123) is that placement notifications go to sites "several months ahead of a clinical
          experience (more than 1 year in advance is quite common)"; Share Profile may be used at
          that point; STUDENTS typically contact the CI themselves 2-3 MONTHS ahead of the
          experience; compliance documents and site/location-required documents may be included;
          it is "more common for schools to provide documentation than students"; and onboarding
          and orientation information is conveyed to the student at this time.
        gates_on: []
        accreditation_citation: >
          ACOTE Standard C.1.10 (../accreditation/acote.yaml) requires the Level I educator be
          informed of the curriculum and fieldwork design PRIOR TO the start of the experience, and
          ACPE Standard 3, Key Element 3.3.c requires preceptor orientation "before accepting a
          student" — both of which are lead-time requirements that this convention satisfies in
          practice and that nothing in the product measures. CAPTE Standard 4, Element 4P's "how
          clinical education sites are INFORMED of those expectations" clause reads on the same
          moment.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. Directly
          relevant, though, is the model the four unresearched marketplace competitors use: per the
          PT playbook (line 184) mCE, Clinician Nexus, ACEMAPP and CastleBranch Bridges require
          STUDENT account registration and payment for onboarding, i.e. in their model the
          student-to-site onboarding handshake is a product surface rather than an email
          convention. None of the four has a teardown in content/competitors/, so this is recorded
          as the sharpest place the missing research would change the analysis.
        gap_severity: "configure-needed"
        gap_note: >
          ADDED 2026-08-25 from a full read of the PT playbook. Three findings, none of them
          previously in this file. (1) The lead times are extreme by the standards of every other
          discipline documented here — notifications more than a YEAR ahead are called "quite
          common," which means a PT placement record is created, published and acted on long before
          the compliance and contract states this journey's stage 3 evaluates are anywhere near
          current. The 6-8-week-before-start Placement Clearance monitoring cadence documented in
          rotation-lifecycle--03 is therefore a SECOND, much later checkpoint over a placement that
          has been live for a year, not the first look at it. (2) The student contacts the CI
          directly 2-3 months out — a real, expected, out-of-product interaction that no placement
          record captures, so a program cannot tell which students have actually made contact. (3)
          The documentation-provision norm cuts against the self-service framing used elsewhere in
          this repo: it is "more common for schools to provide documentation than students," which
          is the opposite of the student-registers-with-the-vendor model the competing marketplaces
          run on, and is worth stating in any positioning conversation about who bears onboarding
          burden.
