      - element: "Pivot Rows / Columns / Values configurator with nesting-by-selection-order and aggregation dropdown (Sum / Average / Minimum / Maximum / Count / Distinct Count)"
        type: "pivot configurator"
        data_shown: "Transcript's worked example: rows = student name + course name + program clinical settings, columns = timesheet status, values = Sum of Duration"
        gates_on: ["what question the report answers"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.2.b/3.2.d (a settings-by-student hours pivot is the direct APPE-settings evidence artifact); ACPE Standard 3, Key Element 3.3.e (an hours-by-preceptor pivot supports the 2:1 ratio narrative)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "The distinct-count explanation in the transcript is unusually clear and worth reusing in onboarding material: three Pending Review timesheets give a count of 3 and a distinct count of 1."
      - element: "Advanced Filters tab (student / placement / learning activity information; plus a Custom option with operator + value and a + to add alternatives; date filters offering specific Date Range or Relative Range in days/months/years)"
        type: "filter builder"
        data_shown: "Transcript example: operator = equals, value = 'direct patient care', + another for 'simulation'"
        gates_on: ["reusable filtering after save"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Sharp-edged design the transcript warns about twice: 'make sure that you add all the advanced filters you would like to use when running the report' — a filter dimension not declared at build time cannot be used later without editing the report definition. A new admin building their first report will under-declare and have to rebuild."
      - element: "Basic Filters accordion (cohort, academic year, professional year, term, course, rotations, settings, locations, sites, students) > Apply"
        type: "runtime filter set"
        data_shown: ""
        gates_on: ["this run's scope"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Inconsistent persistence across data sources in the same transcript: for timesheet/time-off reports, 'If you would like to save the basic filters for future use, click on the Edit button, apply the basic filters... These basic filters will then be saved as default'; for the student data source, 'when you save this report, these basic filters will not be saved for future use.' Two behaviors, one control."
      - element: "Preview window / Run / Save and Run / Edit / export icon"
        type: "action buttons"
        data_shown: "Live preview of the report before running"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Saved-report list controls — star (Favorites tab) / pencil (edit config) / trash / name hyperlink to re-run"
        type: "row action controls"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "No documented sharing model: nothing in the transcript says whether a saved custom report is visible to other administrators or private to its creator. For a multi-admin program standing Prism up, that is an unanswered day-one governance question."

  - screen: "Competency Management — Setup tab, Add New framework wizard"
    navigation_path: "Dashboard > Competency Management > Review tab > Configure Now — or Setup tab > Add New"
    action: >
      Admin creates the competency framework that turns assessment scores into
      competency evidence. First-run onboarding is explicit: "If this is your first time
      setting up Competency Management, a short notification will notify you that your
      competencies are not yet configured for mapping. Click the Configure Now button."
    confirmed_by: "exxat_transcripts.md, '15/16 Setting Up Competency Management in Exxat Prism' (lines 1617-1639)"
    elements:
      - element: "'Configure Now' first-run prompt on the empty Review tab"
        type: "empty-state call to action"
        data_shown: "Notice that competencies are not yet configured for mapping"
        gates_on: ["entry into the setup wizard"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "One of the few purpose-built onboarding affordances anywhere in this stage — worth calling out precisely because the rest of the module assumes prior configuration."
      - element: "Standards/competencies picker (lists all standards in the system)"
        type: "single-select picker"
        data_shown: "The standard sets loaded in Program Details > Standards (an earlier stage). Nursing example in the transcript uses AACN-style parent/sub/child-most structure."
        gates_on: ["what the framework can measure"]
        accreditation_citation: "COCA Standard 6, Element 6.4 (the seven osteopathic core competencies as a tracked taxonomy); LCME Standard 9, Element 9.4 (assessment against program objectives); CODA Standard 2, Element 2-5 (evaluation methods must measure DEFINED competencies)"
        competitor_equivalent: "CORE ELMS's CompMS 'maps competencies to accreditation standards/domains/sub-domains' (core-elms.yaml, rated 'ahead'); one45 ships 'standardized vocabularies aligned to CanMEDS and AAMC competency frameworks' with version control (one45.yaml); LEO/DaVinci supports 'competency sets and Entrustable Professional Activities (EPAs)' (leo-davinci.yaml). This is the most competitively contested element in the stage."
        gap_severity: "none"
        gap_note: "Depends entirely on the standards library being populated first — a cross-stage dependency a new admin will hit if they attempt competency setup before standards setup."
      - element: "'You will only be able to set up one competency framework at a time. However, you can create multiple frameworks for the same set of standards.'"
        type: "system constraint"
        data_shown: ""
        gates_on: ["setup sequencing"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Serialization of the wizard, not a cap on frameworks — but the phrasing is ambiguous enough that a new admin may believe they are limited to one framework."
      - element: "Framework type selector — Experiential / Didactic / Both"
        type: "radio"
        data_shown: "Experiential maps competencies to assessment QUESTIONS on forms; Didactic maps competencies to COURSES; Both reports them in a single framework"
        gates_on: ["which mapping surfaces and scoring sources are available"]
        accreditation_citation: "LCME Standard 9, Element 9.4 (a centralized system 'employing a variety of measures' — the Both option is the closest thing in the product to that centralization); COCA Standard 11, Element 11.1"
        competitor_equivalent: "eMedley's eCurriculum maps to 'physician competencies, EPA competencies, the USMLE Step 1 Content Outline, and program objectives' (emedley.yaml); CORE CompMS does curriculum gap assessment across courses (core-elms.yaml). Both handle didactic mapping; neither publicly documents an experiential/didactic/both framework-type switch."
        gap_severity: "none"
        gap_note: "The Both option is a real strength — but note the scoring stays segregated downstream: 'None of the student scores on the experiential assessment questions are taken into account in the didactic framework.'"
      - element: "Experiential path — form/evaluation multi-select ('you can only choose from scored forms or evaluations'; multi-term forms flagged by banner)"
        type: "multi-select picker with eligibility constraint"
        data_shown: "Only scored forms are eligible; multi-term forms are banner-identified"
        gates_on: ["what evidence can feed competency scores"]
        accreditation_citation: "CODA Standard 2, Element 2-5 (assessment instruments that measure 'not just factual recall but skills, behaviors, and attitudes' — narrative-only instruments are excluded by this constraint); LCME Standard 9, Element 9.4"
        competitor_equivalent: "one45 ships 'EPAs/WBAs' and 'question tagging' on customizable forms (one45.yaml); eMedley ships 'EPA entrustment ratings with growth-curve reporting' (emedley.yaml). Both document entrustment-scale (non-numeric-score) competency evidence, which is what Prism's scored-forms-only rule excludes."
        gap_severity: "gap"
        gap_note: "Scored-forms-only is the hard boundary of the competency module. Narrative evaluations, procedural sign-offs and pass/fail checklists cannot feed a framework — which lands directly on dentistry (faculty sign-off on individual procedural steps, per content/domains/dentistry.yaml) and on nursing exposure logging, where the Nursing transcript itself insists 'student exposure to the Essentials is not the same as achievement' and that qualitative assessment matters."
      - element: "Didactic path — scoring source selector (final course grades vs question-level scores) + course-offering picker ('you will only be able to use didactic courses which have a grade book configured')"
        type: "radio + multi-select with eligibility constraint"
        data_shown: ""
        gates_on: ["didactic competency score computation"]
        accreditation_citation: "COCA Standard 11, Element 11.1 (outcomes assessment across the curriculum, not just clinical years); ACPE Standard 7, Key Element 7.5.b"
        competitor_equivalent: "CORE CompMS 'performs curriculum gap assessments (which courses address which competencies, and to what degree)' (core-elms.yaml) — comparable didactic-side mapping, rated 'ahead' of Prism in that file."
        gap_severity: "configure-needed"
        gap_note: "Gradebook-configured courses only — which chains back to the weightage-summing and manual-score-entry burden two steps earlier. A program that skipped gradebook setup silently loses didactic competency reporting."
      - element: "Scoring scale — default 1-5 with cross-form normalization, or custom scale (min/max + Apply, with real-time recalculation of ranges and threshold)"
        type: "radio + numeric inputs"
        data_shown: "'If there are multiple scoring scales in the forms or evaluations you selected, they will be normalized to a one to five scale.' Letter grades map A=5 down to F=1 on the didactic side. The transcript distinguishes response scale (what the evaluator sees) from scoring scale (the numeric value assigned)."
        gates_on: ["comparability of scores across differently-scaled instruments"]
        accreditation_citation: "COCA Standard 6, Element 6.11 / CODA Standard 2, Element 2-6 (comparable assessment across sites — normalization is what makes two differently-scaled forms comparable); LCME Standard 8, Element 8.7"
        competitor_equivalent: "Elentra documents 'flexible grade scales' in gradebook integration (elentra.yaml); CORE ELMS documents 'automated grade calculation/conversion' (core-elms.yaml). Neither publishes a cross-instrument normalization rule, so Prism's documented normalization is at least as specific as anything found."
        gap_severity: "none"
        gap_note: "Genuinely sophisticated and under-marketed. The response-scale/scoring-scale distinction is a concept a new admin must grasp before mapping, and nothing on screen teaches it besides this prose."
      - element: "Competency threshold score (plus/minus icons or slider; default 70%; auto-adjusts when a custom scale is applied; set separately for experiential and didactic)"
        type: "slider/stepper"
        data_shown: "'This threshold helps you identify students who fall below the expected level'"
        gates_on: ["red-cell flagging on the Review grid and the red cutoff lines on the student dashboard"]
        accreditation_citation: "CODA Standard 2, Element 2-2 (individual evaluation and due process for students not meeting criteria — the threshold IS the criterion); LCME Standard 9, Element 9.7 (early identification for remediation); COCA Standard 11, Element 11.1"
        competitor_equivalent: "CORE ELMS ships 'low-score alerts' (core-elms.yaml) — same concept at instrument level rather than competency level. New Innovations' CCC Milestone Review aggregates to competency spider graphs (new-innovations.yaml) without a documented threshold control."
        gap_severity: "configure-needed"
        gap_note: "A threshold is a flag, not an alert. Nothing in the transcript routes a below-threshold competency score into a notification, an intervention record, or a task — the admin has to come look at the grid. Contrast the OT FWPE flow, which DOES have low-score notifications but only via a support request."
      - element: "Summary step — framework name + review of competencies, scale, threshold, associated assessments > Save (Previous to revise)"
        type: "review/confirm step"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Competency Management — Map (experiential question mapping and didactic course mapping)"
    navigation_path: "Competency Management > Setup > [framework] > Map > Experiential — or Map > Didactic"
    action: >
      Admin performs the one-time mapping that lets the system compute competency scores.
      Per the Nursing transcript: "This is a one-time activity that enables the system to
      calculate student competency achievement each time they get evaluated by their
      preceptors, clinical instructors or faculty."
    confirmed_by: "exxat_transcripts.md, '15/16 Setting Up Competency Management' (lines 1639-1647); framing confirmed in NursingTutorialsTranscripts.md 'Streamline Transition to Competency-Based Education'"
    elements:
      - element: "Assessments list (left rail) > question list > Add Mapping > competency picker"
        type: "mapping interface"
        data_shown: "Selected forms on the left; that form's assessment questions in the working area"
        gates_on: ["every competency score in the module"]
        accreditation_citation: "CODA Standard 2, Element 2-5 (assessment instruments mapped to defined competencies — this screen IS that mapping); LCME Standard 9, Element 9.4; COCA Standard 6, Element 6.4"
        competitor_equivalent: "one45 documents 'question tagging' on customizable forms (one45.yaml) — the closest documented question-to-competency mechanic. CORE CompMS maps at course/competency level rather than question level per public materials (core-elms.yaml), so Prism appears finer-grained on the experiential side."
        gap_severity: "none"
        gap_note: "Question-level (not form-level) mapping is a real architectural strength: it is what makes 'identify students who are struggling in a specific area' possible rather than only 'this student scored low overall'."
      - element: "Child-most-level mapping rule"
        type: "system constraint"
        data_shown: "'You can only map the standards from the child most level. If you select a parent standard, all child standards will be assigned to the question.'"
        gates_on: ["rollup arithmetic"]
        accreditation_citation: "COCA Standard 6, Element 6.4 (the 7-competency taxonomy with sub-levels); ACPE Standard 7, Key Element 7.5.b"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Parent selection cascades to every child — a fast path that quietly inflates the denominator in the rollup average. A new admin doing bulk mapping this way will get mathematically valid but pedagogically meaningless parent scores."
      - element: "Save as Draft vs Apply Changes"
        type: "two-stage commit"
        data_shown: "Per-mapping confirmation message on add/delete; Apply Changes publishes the mapping so reports can run"
        gates_on: ["report readiness — 'You are now ready to run reports based on this competency mapping setup'"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Draft/apply separation is the right shape for a long mapping session that spans days."
      - element: "X icon to remove a competency from a question mapping"
        type: "destructive row control"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Configure button (edit framework config) with destructive-reconfiguration warning"
        type: "button with stated side effect"
        data_shown: "'If you change the selected forms or evaluations or scoring scale, you will lose the mapping you previously set up, and you will need to map the competencies to questions once again.'"
        gates_on: ["whether a framework can evolve"]
        accreditation_citation: "COCA Standard 11, Element 11.1 (evidence of outcomes assessment 'over the past 3 academic years' — a framework that cannot be revised without losing its mapping makes multi-year continuity fragile); LCME Standard 1, Element 1.1 (CQI)"
        competitor_equivalent: "one45 explicitly documents 'version control and audit trail' on its curriculum/competency mapping (one45.yaml) — a direct, named capability Prism's transcript describes the absence of."
        gap_severity: "gap"
        gap_note: "No versioning and no migration. Adding one new evaluation form to an existing framework destroys the entire question mapping. This is the reason a new admin should be coached to finalize their form set BEFORE mapping — and it is the same 'no revision history' pattern already recorded against the standards library in competency-verification--08's flow file, recurring one layer down."
      - element: "Didactic mapping — per-course sections, course name/number search, Add Mapping > competency picker > Save as Draft > Apply Changes"
        type: "mapping interface (course-level)"
        data_shown: "One section per course associated with the framework"
        gates_on: ["didactic competency scores"]
        accreditation_citation: "COCA Standard 11, Element 11.1; ACPE Standard 2, Key Element 2.2.d (curriculum mapping to educational outcomes)"
        competitor_equivalent: "CORE CompMS maps courses to competencies and produces 'curriculum-effectiveness reports tying student outcomes back to the map' (core-elms.yaml) — the closest documented equivalent, and rated 'ahead' in that file."
        gap_severity: "none"
        gap_note: "Distinct from Curriculum Mapping (tutorial 14/16), which maps course MEASURES to standards for coverage evidence. Competency Management's didactic mapping maps courses to competencies for ACHIEVEMENT scoring. Two mapping surfaces with overlapping vocabulary is a genuine onboarding confusion risk."
      - element: "Trash-bin icon (delete framework)"
        type: "destructive control"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Competency Management — Review tab (cohort grid) and Student Competency Dashboard"
    navigation_path: "Competency Management > Review > [framework tab] > View Report (per student)"
    action: >
      Admin reads competency achievement at cohort level, drills into a student, and
      decides whether to publish scores to students. This is the output the whole stage
      exists to produce.
    confirmed_by: "exxat_transcripts.md, '15/16 Setting Up Competency Management' (lines 1647-1681)"
    elements:
      - element: "Cohort grid (students in rows, parent-level competencies in columns, average competency score per cell)"
        type: "read-only matrix"
        data_shown: "Average competency score = mean of all scores on questions mapped to child-most standards beneath that parent; column headers show parent-level competencies only"
        gates_on: ["intervention decisions"]
        accreditation_citation: "COCA Standard 6, Element 6.4 (osteopathic core competencies tracked per student); LCME Standard 9, Element 9.4; ACPE Standard 7, Key Element 7.3.c (student achievement — APPE-ready / Practice-ready / Team-ready); CODA Standard 2, Element 2-5"
        competitor_equivalent: "New Innovations' 'CCC Milestone Review: Evaluation data aggregation with competency spider graphs' (new-innovations.yaml) and eMedley's 'EPA entrustment ratings with growth-curve reporting' (emedley.yaml) are the two closest shipped equivalents; both are ACGME-milestone-shaped rather than program-defined-standard-shaped."
        gap_severity: "none"
        gap_note: "The Nursing transcript describes the identical artifact in its own vocabulary — 'Our competency tracker provides a bird's eye view... Each row is a student and each column is an Essentials domain' — confirming the grid is standard-agnostic and reused across disciplines."
      - element: "Red cell / subpar-performance flagging + threshold display in the table's upper right"
        type: "conditional formatting + read-only threshold indicator"
        data_shown: "Cell marked red when the student's score is below the framework threshold"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-2 (identification of students not meeting criteria); LCME Standard 9, Element 9.7"
        competitor_equivalent: "CORE ELMS 'low-score alerts' (core-elms.yaml) is the nearest named equivalent, at instrument rather than competency level."
        gap_severity: "configure-needed"
        gap_note: "Same limitation as the threshold itself: red is passive. No route from a red cell into the Interventions record the custom-report builder can filter on ('number of open interventions'), so the loop from detection to documented action is manual."
      - element: "Experiential / Didactic view dropdown"
        type: "view switch"
        data_shown: "Didactic side aggregates converted letter grades from mapped courses; upper-left shows count of associated course offerings and the didactic cutoff"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.1 (outcomes assessment spanning the curriculum)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "Two separate views rather than one blended score — defensible methodologically (the transcript is explicit that the sides do not mix), but it means no single number answers 'is this student competent?'"
      - element: "Search box / filter icon (by student information) / export icon"
        type: "search, filter, export"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Student dashboard — 'Score overview per competency' bar chart (blue experiential, purple didactic, red threshold lines)"
        type: "visualization"
        data_shown: "Average score per competency for both sides against their thresholds"
        gates_on: []
        accreditation_citation: "ACPE Standard 7, Key Element 7.3.c; LCME Standard 9, Element 9.4"
        competitor_equivalent: "New Innovations competency spider graphs (new-innovations.yaml); LEO/DaVinci 'Insights Dashboard' (leo-davinci.yaml)."
        gap_severity: "none"
        gap_note: ""
      - element: "Student dashboard — 'Score overview per course' longitudinal line chart (experiential and didactic tabs, chronological left-to-right, per-competency lines, hover-to-focus)"
        type: "time-series visualization"
        data_shown: "Slope interpretation stated in the transcript: positive = improving, flat = stagnating, negative = declining over the academic career"
        gates_on: ["remediation decisions"]
        accreditation_citation: "LCME Standard 9, Element 9.7 (formative feedback early enough to allow remediation); COCA Standard 11, Element 11.1 (three-year outcomes trend)"
        competitor_equivalent: "eMedley's 'EPA entrustment ratings with growth-curve reporting' (emedley.yaml) is the closest documented match — a growth curve is exactly this chart."
        gap_severity: "none"
        gap_note: "The Nursing transcript names the same artifact: 'Longitudinal views allow you to track student progress for each Essential domain as the student moves from one course to another.'"
      - element: "Student dashboard — 'Student vs class average' radar chart (experiential and didactic tabs)"
        type: "visualization"
        data_shown: "Class average = mean of all students' average competency scores; a student line closer to the origin indicates underperformance versus cohort"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.11 / CODA Standard 2, Element 2-6 (comparability framing, applied student-vs-cohort rather than site-vs-site)"
        competitor_equivalent: "New Innovations competency spider graphs (new-innovations.yaml) — same chart form, ACGME-milestone context."
        gap_severity: "none"
        gap_note: ""
      - element: "Student dashboard — 'Score summary per competency' expandable table (physician icon = experiential, notebook icon = didactic; green above / red below threshold)"
        type: "expandable read-only table"
        data_shown: "Parent and child competency scores with the computation rules stated per level"
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-5; LCME Standard 9, Element 9.4"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Student dashboard — bottom table of experiential courses and evaluations x competencies, expandable by course row"
        type: "drill-down matrix"
        data_shown: "Per-evaluation and per-course average competency scores for that student"
        gates_on: []
        accreditation_citation: "LCME Standard 8, Element 8.7 (comparability of education/assessment — per-evaluation traceability)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Download Comprehensive Report' dropdown (Experiential Report / Didactic Report)"
        type: "export control"
        data_shown: "Exported experiential report includes competencies x courses/evaluations, red cells for below-threshold scores, and a 'Number of Times Evaluated' column"
        gates_on: ["accreditation evidence packaging"]
        accreditation_citation: "COCA Standard 11, Element 11.9 and Element 11.1 (the annual/self-study evidence artifact); ACPE Standard 7, Key Element 7.3.c; CODA Standard 1, Element 1-2"
        competitor_equivalent: "The PA help-center guide positions the equivalent Prism output against ARC-PA B3.03/B3.04 explicitly ('Competency Management > Review > Select competency > ArcPA B3.03/B3.04 outcomes'); no competitor teardown in this research documents a per-student competency export at field level. one45's LCME case study (one45.yaml) is the nearest evidence of a competitor's competency data surviving a site visit."
        gap_severity: "configure-needed"
        gap_note: "'Number of Times Evaluated' alongside the score is exactly the evidence-density column an accreditor asks for — but the export is per student and per side, so assembling a cohort-level submission is a manual concatenation job."
      - element: "'Not Published' dropdown > Publish / Unpublish (green indicator on the framework tab; published state also visible on the Setup tab)"
        type: "publish toggle"
        data_shown: "'All students who have competency scores assigned to them in this set of competencies will be able to view their scores'"
        gates_on: ["student-facing competency tracker"]
        accreditation_citation: "CODA Standard 2, Element 2-2 (due process — students seeing the criteria they are judged against); LCME Standard 9, Element 9.7 (feedback must reach the student to enable remediation)"
        competitor_equivalent: "one45 documents 'real-time student access to longitudinal feedback' as shipped (one45.yaml); LEO/DaVinci documents student self-reflection access (leo-davinci.yaml). Both make student visibility a default rather than an admin-gated publish action."
        gap_severity: "none"
        gap_note: "All-or-nothing per framework, with no per-student or per-cohort staging. A new admin publishing for the first time should be warned it is immediately visible to every scored student — the transcript flags this ('Please keep in mind...') but the control itself is a two-click dropdown."

sources:
  - "exxat_transcripts.md — PRIMARY. '13/16 Managing Learning Activities in Exxat Prism' (lines 1289-1495); '15/16 Setting Up Competency Management in Exxat Prism' (lines 1613-1681); standalone 'Comprehensive Report for Placement Based Forms (Forms/Evaluations)' (lines 1721-1733); 'Hours Summary by Week Report in Exxat Prism (Timesheet)' (lines 1747-1757); 'Configuring Custom Reports' (lines 1759-1855); 'Forms/Evaluations Workflows in Exxat Prism' (lines 1967-1987); grading-scheme prerequisite in '1/16 Administrator Navigation in Exxat Prism' (line 41)"
  - "PTPTAVideosTranscripts.md — 'How to use the CIET v2.0 Form' (multi-term workflow, school-specific benchmarks, prerequisite training quiz, concurrent blinded student/CI completion, four-row raw report shape)"
  - "OTOTAVideosTranscripts.md — 'Fieldwork Performance Evaluation in Exxat Prism' (AOTA FWPE form family, response-based and low-score notifications requiring a Prism support request, OT 111 / OTA 91 cutoffs, four FWPE report types, 'send only to the fieldwork educator added by school')"
