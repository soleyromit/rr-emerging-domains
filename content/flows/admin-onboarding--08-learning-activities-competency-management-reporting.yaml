# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 8
# ("Learning activities, competency management & reporting"). See _TEMPLATE.yaml
# (schema v2) for field meanings: accreditation_citation / competitor_equivalent /
# gap_severity / gap_note live on each ELEMENT, not on the step.
#
# SOURCING NOTE (important — this file exists to fix a prior sourcing defect):
# the primary source here is the raw general admin-tutorial transcript at
# exxat_transcripts.md, cited by section heading and
# line range. Earlier work in this repo laundered the same content through
# help-center paraphrases; every step below cites the transcript directly wherever
# the transcript covers the step, and only reaches for the help-center mirror or a
# discipline transcript where the general transcript is genuinely silent.
#
# This is the PRODUCT-SETUP journey: what a brand-new program administrator does on
# day one to stand Prism up, not the clinical-rotation lifecycle that runs afterward.
# Where a screen below also appears in rotation-lifecycle--05/--07 or
# competency-verification--01/--02/--06, the lens here is deliberately different:
# "can a new admin configure this without a support ticket?", not "does the clinical
# workflow work?". That question is where most of the gap_severity values come from.

flow_name: "Learning Activities, Competency & Reporting Setup"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 8"
persona: >
  Primary: Program Administrator, new to the platform
  (../personas/role-program-admin.yaml) — owns Learning Activity setup per course,
  the Gradebook, the competency framework, and the report library.
  Secondary: Clinical Coordinator (../personas/role-clinical-coordinator.yaml) —
  runs day-to-day form distribution, log/timesheet review and reminders once setup
  is done; and Compliance / Accreditation Liaison
  (../personas/role-compliance-accreditation-liaison.yaml) — consumes the report and
  competency output as accreditation evidence. Prerequisite from earlier stages:
  course offerings, cohorts, students, faculty, sites and placements must already
  exist — "before you can set up learning activities, you will first need to have set
  up placement-related or didactic course offerings."

steps:

  - screen: "Learning Activity — Course Offerings (module landing table)"
    navigation_path: "Dashboard or hamburger menu > Learning Activity > Course Offerings"
    action: >
      New admin opens the Learning Activity module for the first time and orients on
      the inventory of course offerings that can carry learning activities, before
      configuring anything.
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities in Exxat Prism' (lines 1293-1298)"
    elements:
      - element: "Course offerings table (course number, course name, learning activities activated, academic schedule, cohort, additional course identifier)"
        type: "read-only rollup table"
        data_shown: "One row per course offering; the 'learning activities activated' cell is the only at-a-glance signal of which courses are already configured"
        gates_on: ["everything downstream in this stage — a course with no offering cannot carry a learning activity"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — competitor files describe evaluation/log capability (one45 'Assessment and Evaluation', emedley 'eValuate'), not their admin-side course-inventory landing table."
        gap_severity: "none"
        gap_note: ""
      - element: "Search box with type-switch dropdown (course number / course name)"
        type: "search control"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Filter icon (cohort / academic year / term)"
        type: "report filter"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Filter set is cohort/year/term only — no filter for 'has no learning activity configured yet', which is exactly the view a day-one admin needs to work a setup backlog."

  - screen: "Learning Activity — Add Group (learning activity group wizard)"
    navigation_path: "Learning Activity > Add Group > [Name/Description] > [Select Courses] > [Overview] > Save"
    action: >
      Admin creates a learning activity group to bundle course offerings so reports can
      be run across the whole group. Per the transcript, "lockstep programs typically
      group course offerings together by cohort... Non-lockstep programs may use learning
      activity groups to group together courses of the same academic year, graduation
      term, or area of focus." This is the single highest-leverage setup decision in the
      stage: report scope is defined by group membership.
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities' (lines 1299-1307); report-scoping consequence at lines 1443-1447"
    elements:
      - element: "Group name text box"
        type: "input field"
        data_shown: ""
        gates_on: ["group-level reporting"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Group description text area"
        type: "input field"
        data_shown: "Admin-only — 'This description can only be viewed by you and other program administrators'"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Course selection step (search by course number/name; filter by academic year, professional year, term, cohort, additional course identifier; select-all checkbox)"
        type: "multi-select picker with filters"
        data_shown: "Courses matching search criteria after clicking Search"
        gates_on: ["which courses appear in every group-scoped report"]
        accreditation_citation: "none directly, but this is the mechanism by which a program later assembles cohort-scoped evidence — e.g. ACPE Standard 3, Key Element 3.1.b (IPEC minimum clock hours by setting) is only reportable if the IPPE courses are grouped so an hours report can span them"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. CORE ELMS's CompMS markets cohort-level competency reporting (core-elms.yaml) but public materials do not describe a user-built report-scope grouping object."
        gap_severity: "configure-needed"
        gap_note: "Group membership is a static hand-picked list, not a saved query — a new cohort's courses do not join an existing group automatically, so a day-one admin who builds 'Class of 2027' must re-edit it every term."
      - element: "Overview step with per-course trash-bin removal + previous-section tabs"
        type: "review/confirm step"
        data_shown: "Selected courses pending save"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Group Courses / Rotations / Reports tabs (post-save)"
        type: "navigation tabs with per-row hyperlinks"
        data_shown: "Courses tab: each activated learning activity as a hyperlink into its review section, plus academic schedule and Setup/Reports hyperlinks. Rotations tab: all rotations for the added courses. Reports tab: report runner pre-scoped to the group."
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "The Courses tab's per-row Setup hyperlink is the practical entry point into per-course configuration — worth noting because a new admin who navigates via Courses > [course] > Learning Activities > Setup instead never discovers the group."

  - screen: "Learning Activity Setup (per course offering)"
    navigation_path: "Learning Activity > [group] > Courses > Setup hyperlink — or Courses > [course offering] > Learning Activities > Setup"
    action: >
      Admin opens one course's setup surface and sees the four learning-activity types
      plus Gradebook and Reports tabs. Per the transcript, setup is strictly per-course:
      "You will need to set up learning activities for each course individually."
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities' (lines 1307-1312)"
    elements:
      - element: "Forms & Evaluations / Patient Log / Timesheet / Time Off sections"
        type: "configuration section headers with add (+) or edit (pencil) affordances"
        data_shown: "Which of the four activity types are configured for this course"
        gates_on: ["student-facing availability of each activity type"]
        accreditation_citation: "none at this container level; the individual activity configurations below carry the accreditor ties"
        competitor_equivalent: "eMedley splits the equivalent surfaces across separate named modules — eCLAS for case logs, eValuate for evaluations (emedley.yaml); Prism co-locates all four on one per-course screen. Comparable at module level, not at field level from public materials."
        gap_severity: "none"
        gap_note: ""
      - element: "Placement-based vs didactic course type constraint"
        type: "system-enforced availability rule"
        data_shown: "In didactic/non-placement courses only non-placement forms and evaluations can be set up — 'you cannot set up patient logs, timesheets, or time off learning activities'"
        gates_on: ["which activity types can be activated"]
        accreditation_citation: "ACPE Standard 3, Key Element 3.1.b and 3.2.b/3.2.d (clock-hour minimums are only capturable on placement-based courses, so a program that mis-types a course as didactic loses its hours evidence)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "The course-type decision was made back in course setup (an earlier stage) and silently determines what is configurable here; a new admin discovers the constraint only when the Patient Log/Timesheet sections do not appear."
      - element: "'Design' toggle (new design / old design)"
        type: "toggle"
        data_shown: "Defaults to the new design on every navigation into learning activities; disabling reverts to the legacy design"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: "A live old/new design toggle means a day-one admin's screen may not match half the help content or the tutorial video they were pointed at — a real onboarding friction, not a functional gap."
      - element: "Gradebook tab and Reports tab"
        type: "navigation tabs"
        data_shown: "Gradebook: per-student scores and final weighted score. Reports: all reports for the configured activities."
        gates_on: []
        accreditation_citation: "none at tab level"
        competitor_equivalent: "CORE ELMS ships 'automated grade calculation/conversion' inside its evaluation module (core-elms.yaml); Elentra ships 'gradebook tasks... and gradebook integration for flexible grade scales' (elentra.yaml). Comparable in kind, but neither vendor's public material is granular enough to compare a tab-level layout."
        gap_severity: "none"
        gap_note: ""

  - screen: "Forms & Evaluations — activate an existing form"
    navigation_path: "Learning Activity Setup > Forms and Evaluations > + icon > [select form]"
    action: >
      Admin picks a form from the program's configured form list and sets its publish
      timing, review columns and faculty visibility. Critically for onboarding, the admin
      is CHOOSING from a pre-built list, not authoring: standard forms (CIET, PT SE) "can
      be activated by reaching out to our support team, your account manager, or your CSS
      agent" and are non-editable; custom forms are "those which you decide the workflow
      for and information collected by" but are built by Exxat — "please reach out to your
      CSS agent or account manager for more information on how to get custom forms
      configured."
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities' (lines 1313-1321); form-type taxonomy in the standalone 'Forms/Evaluations Workflows in Exxat Prism' section (lines 1971-1986)"
    elements:
      - element: "Form picker list + search box"
        type: "single-select picker"
        data_shown: "Forms currently configured for the program (standard + program's custom forms)"
        gates_on: ["what can be activated in this course"]
        accreditation_citation: "CODA Standard 2, Element 2-5 (student evaluation methods must measure defined competencies via assessment instruments mapped to competencies); LCME Standard 9, Element 9.4 (a centralized assessment system using a variety of measures)"
        competitor_equivalent: "New Innovations ships an admin-facing 'Evaluations Builder: Customizable form creation with multiple question types and real-time editing capabilities' (new-innovations.yaml); Elentra ships a 'customizable form/item bank' in its Assessment & Evaluation module (elentra.yaml); one45 ships 'customizable forms/scales with question tagging' (one45.yaml). All three document self-service form authoring by the program; Prism's transcript routes custom form authoring through a CSS agent."
        gap_severity: "gap"
        gap_note: "This is the sharpest onboarding gap in the stage: a new admin cannot author a form. Standard forms need a support ticket to appear in this list; custom forms need a CSS-agent engagement to build. Everything else in Learning Activities is self-service; the instrument itself is not. Three named competitors document self-service form builders."
      - element: "'Who will be filling the form' summary box"
        type: "read-only rollup"
        data_shown: "Which stakeholders are in the form's workflow (e.g. preceptor, admin, student)"
        gates_on: []
        accreditation_citation: "LCME Standard 9, Element 9.3 (clinical supervision) — indirectly, since this box is where an admin verifies a supervisor is actually in the evaluation loop"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Workflow Details' summary box"
        type: "read-only rollup"
        data_shown: "The series of steps from initiation to completion the form passes through"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: "Read-only. The admin can SEE the workflow but not change it — changing who fills what and in what order requires the CSS agent. For a new program still deciding whether the preceptor or the student initiates, this is a hard dependency on the vendor."
      - element: "Form name hyperlink (preview the form)"
        type: "button / preview link"
        data_shown: "The rendered form as respondents will see it"
        gates_on: []
        accreditation_citation: "COCA Standard 11, Element 11.2 (programs must produce 'copies of the evaluation forms used' as self-study evidence — this preview is where an admin retrieves them)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Does this form require a placement?' yes/no"
        type: "radio / toggle"
        data_shown: ""
        gates_on: ["whether the form appears against a placement or as a didactic assignment", "which report family the form is eligible for"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "This flag has a non-obvious downstream consequence the setup screen does not surface: placement-based and didactic forms cannot be reported on together (transcript line 1447), so getting it wrong forces a separate learning activity group later."
      - element: "Publish timing — 'Event Anchored' (days + before/after + anchor) vs 'Specific Date'"
        type: "conditional input group (all three anchored fields required)"
        data_shown: "Publish date computed relative to a placement event, or a fixed calendar date"
        gates_on: ["when the form becomes visible to the student/respondent"]
        accreditation_citation: "LCME Standard 9, Element 9.7 (formative feedback at least at the midpoint of each required experience) — the midterm anchor is the mechanism that makes 9.7 auditable; LCME Standard 9, Element 9.8 (fair and timely summative assessment) via an end-date-anchored due date"
        competitor_equivalent: "eMedley documents the same primitive — 'assignments/evaluations scheduled N days' relative to a rotation (emedley.yaml); one45 documents 'automated distribution of in-training evaluations tied to the master schedule' (one45.yaml). eMedley is the closest true element-level match found."
        gap_severity: "none"
        gap_note: "Strongest single element in this stage — anchor-relative publishing maps almost one-to-one onto LCME 9.7's midpoint-feedback requirement (see content/accreditation/lcme.yaml, which rates that element 'Transfer')."
      - element: "'Customize Columns' control (evaluation-review column set)"
        type: "column configurator"
        data_shown: "Which columns appear when reviewing submissions of this form"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Faculty role assignment — 'can view and make changes' + optional view-only role"
        type: "role picker (two tiers)"
        data_shown: ""
        gates_on: ["which faculty can review/edit this form's submissions"]
        accreditation_citation: "CODA Standard 2, Element 2-2 (individual evaluation and due process — who may alter a student's evaluation record is a due-process question)"
        competitor_equivalent: "LEO/DaVinci documents FERPA-scoped advisor visibility ('advisors see only their own advisees') as its comparable access control (leo-davinci.yaml) — the same concern, expressed as a scope rule rather than a per-form role picker."
        gap_severity: "none"
        gap_note: "Note the interaction with the review scope rule at transcript line 1357: 'Course faculty can review learning activities for all the students registered in the courses they oversee, while placement faculty can only review learning activities for the specific student placements they are assigned.' The picker sets the role; the role's scope is fixed by the system."
      - element: "Save / Back buttons"
        type: "button"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Forms & Evaluations — Add Assignment (self-service simple form)"
    navigation_path: "Learning Activity Setup > Forms and Evaluations > + icon > Add Assignment"
    action: >
      The one instrument a new admin CAN build alone. Per the transcript: "It is also
      possible to configure simple forms on your own called Assignments. Assignments can
      be used to collect any student written assignments, for example, a midterm
      reflection essay."
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities' (lines 1325-1329)"
    elements:
      - element: "Title text area + Instructions text area"
        type: "input fields"
        data_shown: ""
        gates_on: []
        accreditation_citation: "CODA Standard 2, Element 2-1 (advance course information to students — instructions delivered with the assignment)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Requires student placement?' yes/no"
        type: "radio"
        data_shown: ""
        gates_on: ["whether the assignment attaches to a placement"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Applicable for other course offerings in the program?' yes/no"
        type: "radio"
        data_shown: "If Yes, the assignment joins the program-wide form list for one-click activation in any course"
        gates_on: ["reusability across courses"]
        accreditation_citation: "CODA Standard 2, Element 2-6 / COCA Standard 6, Element 6.11 (comparability of instruction and assessment across sites — reuse of one instrument is the mechanism by which comparability is achieved)"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "This is the closest thing to a template library a new admin gets without vendor involvement — and it is a one-way flag set at creation time, not a library the admin manages."
      - element: "Scored? + 'Out Of' score + low score indicator"
        type: "conditional input group"
        data_shown: ""
        gates_on: ["gradebook contribution", "low-score alerting"]
        accreditation_citation: "LCME Standard 9, Element 9.4 (assessment system) — partial; a scored assignment is one measure feeding the centralized picture"
        competitor_equivalent: "CORE ELMS documents 'low-score alerts' as a shipped evaluation-module feature (core-elms.yaml) — a direct, element-level match for the low score indicator."
        gap_severity: "none"
        gap_note: ""
      - element: "Gradebook weightage contribution / publish date / due date / assigned faculty"
        type: "input fields, same pattern as form activation"
        data_shown: ""
        gates_on: ["final course score calculation"]
        accreditation_citation: "LCME Standard 9, Element 9.8 (fair and timely summative assessment — due-date mechanics)"
        competitor_equivalent: "CORE ELMS documents 'due-date reminders' and 'automated grade calculation/conversion' (core-elms.yaml)."
        gap_severity: "none"
        gap_note: ""
      - element: "School Templates upload section"
        type: "file upload (documented file types + size limits)"
        data_shown: "Downloadable template the student fills and re-uploads"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Active toggle"
        type: "toggle"
        data_shown: ""
        gates_on: ["student visibility"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Learning Activities — Auto-Notifications setup"
    navigation_path: "Learning Activities > (left menu) Auto-Notifications > Add Notification"
    action: >
      Admin configures automatic reminder notifications for evaluation forms so that
      chasing submissions is not a manual weekly task. Per the transcript: "With
      configurable timing, frequency, and stop conditions, auto-notifications help ensure
      that evaluation forms are completed on time and without sending unnecessary
      reminders after submission."
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities' (lines 1321-1325)"
    elements:
      - element: "Notification title"
        type: "input field"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Notification Type selector"
        type: "dropdown"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Recipient Type (students or preceptor)"
        type: "dropdown"
        data_shown: "Two recipient classes only"
        gates_on: ["who is reminded"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "LEO/DaVinci documents 'completion/reminder tracking reports' for administrators (leo-davinci.yaml); eValue markets 'automate reminder notifications for students' (e-value.yaml); CORE ELMS documents 'due-date reminders' (core-elms.yaml). All three are comparable in kind at this element."
        gap_severity: "configure-needed"
        gap_note: "Recipient type is student-or-preceptor. Site/location contacts and placement faculty are addressable in manual distribution (transcript line 1365) but not, per this transcript, in auto-notifications — so the roles most likely to go silent on a form are the ones you can auto-chase, and the rest still need manual reminders."
      - element: "Form multi-select ('select one or more forms')"
        type: "multi-select picker"
        data_shown: ""
        gates_on: ["which forms trigger this reminder"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Reminder frequency (Just Once / Daily / Weekly / Every X days) + 'When to Send' fields"
        type: "radio group + conditional inputs"
        data_shown: ""
        gates_on: ["reminder cadence"]
        accreditation_citation: "LCME Standard 9, Element 9.8 (timely summative assessment — reminder cadence is the operational lever on grade turnaround)"
        competitor_equivalent: "eValue markets automated reminder notifications tied to hours/evaluations (e-value.yaml) but public materials do not enumerate a frequency option set, so this is comparable in kind but not at field level."
        gap_severity: "none"
        gap_note: ""
      - element: "Summary & Confirmation step > Save"
        type: "review/confirm step"
        data_shown: "The configured notification before commit"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Notification list row controls — edit icon / delete icon / active-inactive toggle"
        type: "row action controls"
        data_shown: "Toggle 'turns off reminders without deleting the setup'"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Patient Log setup (per course)"
    navigation_path: "Learning Activity Setup > Patient Log > pencil icon"
    action: >
      Admin configures and activates patient-encounter logging for placed students.
      Per the transcript, the naming varies by discipline: "Different domains may use
      different names for patient logs. SLP programs call them clinical logs, and CRNA
      programs call them case logs."
    confirmed_by: "exxat_transcripts.md, '13/16 Managing Learning Activities' (lines 1329-1338). Discipline confirmation: PAVideosTranscripts.md 'Physician Assistant: Setting up and Managing Patient Logs' and SLPVideosTranscripts.md 'Setting up and Reviewing Clinical Logs'"
    elements:
      - element: "Patient log template dropdown + eye icon preview (PA transcript: 'Preview Layout' button)"
        type: "single-select picker with preview"
        data_shown: "The log layout students will fill"
        gates_on: ["what encounter data the program can ever report on"]
        accreditation_citation: "CODA Standard 2, Element 2-24 (adequate patient experiences to achieve competency — the log is the evidence); LCME Standard 6, Element 6.2 and Standard 8, Element 8.6 (required clinical experiences and monitoring of their completion); COCA Standard 6, Element 6.10"
        competitor_equivalent: "eMedley's eCLAS is the closest documented equivalent: 'mobile iOS/Android case-log tracking of patient encounters, diagnoses/ICD-10, procedures/CPT, competency mastery, preceptor time-approval' (emedley.yaml). eValue documents 'case logs for tracking competencies/interventions/encounters' and 'mobile procedure logging' (e-value.yaml). Both are comparable in capability; neither documents an admin-side template-selection control at field level."
