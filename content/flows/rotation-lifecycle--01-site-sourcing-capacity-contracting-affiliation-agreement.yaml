      - element: "Field Instructor orientation-certificate status (Social Work)"
        type: "read-only rollup, sourced from the Certification section of the Agencies > Personnel record"
        data_shown: "Whether an assigned Field Instructor / Task Supervisor has a CV, licensure, and an orientation-completion certificate on file"
        gates_on: ["nothing — same display-only posture as every other column on this dashboard"]
        accreditation_citation: "CSWE Accreditation Standard 3.3, AS 3.3.4 (documented processes for orienting and engaging with field instructors); CSWE Accreditation Standard 3.3, AS B3.3.6 / M3.3.6 (Field Instructor degree plus two years' post-degree practice)"
        competitor_equivalent: >
