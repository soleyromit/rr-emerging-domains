        type: "select — Fully Executed / Awaiting Signoff / Draft / Finalized / In Development / On Hold / Terminated"
        data_shown: "Where an agreement sits in its execution lifecycle, distinct from the program-level Active/Inactive Status field above"
        gates_on: ["not confirmed — no source ties these values to the Placement Clearance Contract Status computation"]
        accreditation_citation: "CAPTE Standard 2, Element 2D8 (developing programs must confirm FULLY EXECUTED written agreements and site-specific Letters of Intent); COA Standard F.2 with Standard A.3 ('legally binding' contract); COCA Standard 6, Element 6.9 ('executed' affiliation agreement)"
