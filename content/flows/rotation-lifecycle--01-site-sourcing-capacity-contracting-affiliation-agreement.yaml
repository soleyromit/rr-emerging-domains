  - screen: "Process Field Application Forms — location & supervisor mapping (Social Work); MyRequest / questionnaire wishlist (PT, OT capstone, PA)"
    navigation_path: "Dashboard/hamburger > Process Field Application Forms > All Requests > View by Rotations: Upcoming and Current > [Submitted] > View  |  Placements > Wishlist / MyRequest for the PT/OT/PA variants"
    elements:
      - element: "Student-entered location & supervisor, and the admin Map action"
        type: "review-and-map control: admin maps a manually-entered agency/supervisor onto an existing Prism Location/Personnel record, or corrects the student's text first"
        data_shown: "Up to 10 placement suggestions per Multi-Location Field Application Form, each with location info, supervisor info, interview status, schedule, and student comments"
        gates_on: ["a placement cannot be created from a suggestion until its location is mapped; supervisor mapping requires the location to be mapped first; a location can be mapped ONLY ONCE and already-mapped locations become unavailable to other submissions"]
        accreditation_citation: "CSWE Accreditation Standard 3.3, AS 3.3.4 (the documented process for identifying and APPROVING field education settings — student-proposed agencies are the population that process exists to police)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents student-proposed site
          intake or a mapping/dedup step. CORE ELMS's SmartMatch is documented as matching students
          to EXISTING sites (../competitors/core-elms.yaml), which is a different problem, so the
          comparison would be misleading rather than merely thin.
        gap_severity: "none"
        gap_note: >
          A genuinely different site-sourcing model from anything the four expansion domains do, and
          the reason this step exists. In Social Work "many SW programs require students to interview
          with multiple agencies before securing a placement," historically tracked "via temporary
          placements or outside spreadsheets" (Social Work (SW) Playbook.md lines 86, 189) — so the
          directory grows from the student side, and the mapping step is the approval gate that keeps
          it from filling with duplicates and free text. The map-only-once rule is the dedup
          mechanism and is a real constraint worth noting, not a detail: it means two students cannot
          independently introduce the same agency.
          Relevant to this stage specifically because a student-proposed agency arrives with NO
          contract, no assessment, and no personnel credentials — it enters at the top of this file
          rather than at the end. The SW playbook's own best-practice list reflects that: "encourage
          students to select existing locations rather than manual entry, to avoid mapping delays"
          and "review manually entered locations promptly" (lines 122-126).
          DISCIPLINE-SPECIFIC (OT capstone): the same student-proposes-a-site pattern, different
          mechanism — "students may propose their own site/location, via a questionnaire-based
          wishlist and MyRequest-based wishlist to gather site details," with direct placement the
          preferred capstone mode (Occupational Therapy (OT) Playbook.md lines 386, 393). ACOTE
          D.1.5 requires a valid written agreement in effect before and throughout the capstone plus
          an individualised capstone plan signed by all parties, and ../accreditation/acote.yaml
          confirms the multi-party signed agreement runs as a custom form with a real documented
          workflow (OTD Capstone Memorandum of Understanding: Student > Site Mentor Review > Faculty
          Review > Admin Review). So OT's capstone agreement is a FORM, not a Contract record — a
          second, parallel agreement mechanism inside the same product that this file's Contracts
          steps do not cover.
          DISCIPLINE-SPECIFIC (PT and PA): both use MyRequest for the same purpose at much lower
          volume — PT "typically limited (e.g. a school may allow students to recommend one new
          clinical site during their time in the program)" (Physical Therapy (PT) Playbook.md lines
          91, 108), PA "depends on the program's process" (Physician Assistant (PA) Playbook.md line
          86). Recorded so the SW-shaped workflow is not read as SW-only.
      - element: "Employment-based placement flag (student's own employer as the site)"
        type: "ABSENT — 'employment-concurrent placement' is not a placement or site attribute"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "CSWE Accreditation Standard 3.3, AS 3.3.7 (written policy on field placement at a student's place of employment; how field supervision is kept DISTINCT from employment supervision even when the same person provides both; and how the program helps a student continue or change field education if the job ends mid-placement)"
        competitor_equivalent: >
