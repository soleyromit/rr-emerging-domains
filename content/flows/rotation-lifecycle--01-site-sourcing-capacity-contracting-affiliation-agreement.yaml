        gap_severity: "gap"
        gap_note: >
          Included in this stage rather than a placement stage because AS 3.3.7 governs whether a
          given agency may be used as a field site AT ALL for a given student — a site-eligibility
          rule, which is this stage's subject. ../accreditation/cswe.yaml rates it a Gap and is
          specific about why: Prism "can approximate the flag with a placement tag and the separation
