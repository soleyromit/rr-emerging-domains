        gap_severity: "none"
        gap_note: >
          A materially more capable status model than the four-domain baseline in this file
          documents, and it comes from an OT source: the OT playbook records the institutional-level
          Contract Status vocabulary as "Fully Executed, Awaiting Signoff, Draft, Finalized, In
