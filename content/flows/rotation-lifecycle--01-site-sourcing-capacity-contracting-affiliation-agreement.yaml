      - element: "Required-clause content of the agreement"
        type: "ABSENT — the agreement's clauses are stored only inside the uploaded PDF; no structured field or checklist asserts what the document says"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2D9 (five enumerated clauses every agreement must address); ARC-PA Standard B3, Element B3.01 a-e (agreements must explicitly name PA students); ACOTE Standard C.1.5 (agreements must document the responsibilities of the sponsoring institution and each site); COA Standard F.2 (expectations and responsibilities of both parties); ACEN Standard 4, Criterion 4.9 (agreements must specify expectations for all parties for the protection of the student); CAEP Standard R2, Component R2.1"
        competitor_equivalent: >
          Not comparable at element level, and the absence is almost certainly category-wide rather
          than Prism-specific: CORE ELMS, eMedley (eKeeper) and E*Value all market affiliation-
          agreement tracking as document storage plus expiry alerting
          (../competitors/core-elms.yaml, emedley.yaml, e-value.yaml lines 42, 51), and none claims
          to model agreement CONTENT. Stated as an unbenchmarkable gap rather than a competitive
          weakness, because no competitor source is granular enough to prove either way.
        gap_severity: "gap"
        gap_note: >
          The single highest-leverage cross-discipline finding this extension adds, and it is the
          same hole seen from six accreditors at once. Prism's contract object is excellent at
          WHETHER and WHEN and silent on WHAT. ../accreditation/capte.yaml puts it plainly: "The
          gate is on dates and existence, not on CONTENT. CAPTE 2D9 enumerates five clauses every
          agreement must address; Prism stores the document but does not assert or track
          clause-level completeness. A 'required clauses present' checklist on the contract object
          would convert this from a document library into actual 2D9 evidence, and would generalize
          to every accreditor in this workstream."
          DISCIPLINE-SPECIFIC (PA — this is not theoretical): ARC-PA is the discipline where the
          missing capability already costs programs citations. The PA playbook records that 6e
          B3.01 a-e requires agreements to "explicitly state they apply to PA students," that
          "broad institution-wide agreements covering 'all learners' without naming PA students
          specifically are no longer sufficient," that multi-campus institutions must identify which
          campuses/programs are covered, that "generic university-wide language has been a common
          source of accreditation citations," and that renewals must continue to restate PA-student
          inclusion (Physician Assistant (PA) Playbook.md lines 141-152). A PA program cannot answer
          "which of my 300 agreements name PA students?" from Prism today — it is a PDF-by-PDF read.
          The remediation the playbook describes (an addendum reading "All learners in this
          agreement include Physician Assistant students") also has no home: it is a second document
          amending the first, and the contract record's file upload with archive treats documents as
          versions of one agreement rather than as a base plus amendments.
          DISCIPLINE-SPECIFIC (Teacher Education): CAEP R2.1 is the inverse problem — the MOU is
          explicitly NOT the evidence CAEP wants. ../accreditation/caep.yaml: "the evidence CAEP
          wants is the RELATIONSHIP record, not just the signed document," naming co-construction
          meeting decisions, agenda topics, and advisory-board activity as the required proof that
          partners co-constructed clinical arrangements. Standing TE caveat applies (no Exxat TE
          source confirms any of this).
