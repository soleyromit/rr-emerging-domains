  # ---------------------------------------------------------------------------
  # NEW STEP (2026-08-25, from a full read of the PT playbook rather than a
  # per-stage sample). The OUTBOUND half of site sourcing. Every other step in
  # this file documents what happens to a site record once Prism knows about it;
  # this one documents the mass-email machinery that produces the slot offers and
  # the site-data updates in the first place. It exists because PT's sourcing
  # model is a single annual blast (the March 1 "M1M") to hundreds of SCCEs, and
  # the failure modes are therefore deliverability failures, not data failures.
  # No four-domain source describes this screen at all.
  # ---------------------------------------------------------------------------
  - screen: "Sites > Emails — M1M slot-request and site-update blast operations"
    navigation_path: "Sites > Emails > Email Dashboard (delivery triage, Status filter) | Sites > Emails > recipient filters and template selection (composition) | Placements > [Course/Group] > Email & Publish for the placement-notification variant"
    elements:
      - element: "Email Dashboard — Status filter = Failed (delivery triage)"
        type: "report filter over outbound email delivery state"
        data_shown: "Which slot-request or site-update emails failed to deliver, per recipient"
        gates_on: ["Whether a site was actually ASKED for slots at all — an undelivered M1M is indistinguishable from a site that declined to respond, unless someone checks this screen"]
        accreditation_citation: "ARC-PA Standard A1, Element A1.10 a-b ('the method used to confirm site availability' is explicitly part of what a program must document — a documented method whose failures are invisible is not a method); CCNE Standard II, Key Element II-C (evidence of how the program is responsible for OBTAINING clinical placements, which is the outbound half of the sufficiency process); CAPTE Standard 2, Element 2D8"
        competitor_equivalent: >
          Not comparable at element level, and this is one of the places where the missing
          teardowns matter most. The four vendors the PT playbook names as the real competitive
          set for slot sourcing — myClinicalExchange (mCE), Clinician Nexus, ACEMAPP and
          CastleBranch Bridges (Physical Therapy (PT) Playbook.md line 184) — invert this model
          entirely: they make the SITE the account holder, so a slot request is a portal
          transaction rather than an email, and deliverability is not a failure mode they have.
          None of the four has a teardown file in ../competitors/, so the honest position is that
          this repo cannot say whether email-based sourcing is a weakness or simply a different
          bet. Recorded as a research hole, not as a verdict.
        gap_severity: "configure-needed"
        gap_note: >
          NEW 2026-08-25. The single most operationally consequential screen in PT's sourcing
          season and it had no representation in this file. The PT playbook enumerates the
          documented failure causes and the documented fixes (lines 265-267): failures come from
          "address typos, invalid/retired addresses, firewalls, full mailboxes," and the fixes are
          to correct the address, to send Exxat's WHITELIST LETTER from a personal account, or to
          resend from a personal account "to route around firewall blocks."
          Two things worth stating plainly. First, two of the three documented remedies involve the
          coordinator sending mail from OUTSIDE Prism, which means the system of record loses the
          audit trail for exactly the sites that were hardest to reach — and those are
          disproportionately the large hospital systems whose firewalls block bulk senders, i.e.
          the acute and inpatient sites the same playbook records as the nationally scarcest
          (line 186). Second, this is a diagnostic screen a human must remember to open. Nothing
          described in any source pushes a "your M1M did not reach 40 of your 300 sites" summary,
          so the sourcing season's largest silent failure mode has the same posture as the Contract
          Status column documented earlier in this file: computed, displayed, not escalated.
      - element: "Recipient targeting filters, including 'No Areas/Tags/Categories/Settings Assigned'"
        type: "report filter over the site/location directory, used as an email audience selector"
        data_shown: "Which sites and locations receive the blast, filterable by the same attribute taxonomy configured on the Site/Location records — plus an explicit inverse filter for records MISSING that attribute data"
        gates_on: ["Which sites are in the audience at all"]
        accreditation_citation: "ARC-PA Standard A1, Element A1.10 a-b; CCNE Standard II, Key Element II-C"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents audience selection
          for site-directed communication, because no cited competitor documents site-directed
          mass communication.
        gap_severity: "none"
        gap_note: >
          The inverse filter is the interesting half and is a genuinely good piece of design: per
          the PT playbook (line 268) the filter set "now includes 'No Areas/Tags/Categories/Settings
          Assigned' so sites missing attribute data aren't silently excluded from a blast." That is
          a direct fix for a failure mode this file documents from the other direction on the
          Site/Location Categories element — a program-authored taxonomy that nobody finished
          populating. Without the inverse filter, a site with no Setting tag would fall out of every
          setting-filtered blast and simply stop being asked for slots, which reads downstream as
          declining capacity rather than as a data-hygiene problem. Worth carrying to the four
          expansion domains verbatim, because they are the programs most likely to have
          half-populated taxonomies in year one.
      - element: "Custom site-update template requirement — the @Request Link merge field"
        type: "template validation requirement (documented convention, enforcement unconfirmed)"
        data_shown: "A custom site-update request template must contain the @Request Link merge field, or the recipient has no way to submit updates; recipients should additionally be filtered to Site/Location Status = Active before sending"
        gates_on: ["Whether the site can respond at all — a template missing the merge field produces an email with no action available in it"]
        accreditation_citation: "ARC-PA Standard A1, Element A1.10 a-b (the confirm-availability method); ARC-PA Standard B3, Element B3.02 a-c (ONGOING evaluation of every SCPE site — a site-update request is the lightweight recurring touch that keeps site data current between formal assessments)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents a merge-field
          contract on an outbound template.
        gap_severity: "gap"
        gap_note: >
          NEW 2026-08-25, and rated a gap rather than configure-needed for a specific reason: the
          PT playbook states the requirement as INSTRUCTION ("custom site-update templates must
          include the `@Request Link` merge field or the recipient has no way to submit updates",
          line 269), and no source read states that the product validates it. A template author
          can therefore ship a blast to several hundred site contacts in which the call to action
          is missing, and the observable symptom is silence — which is indistinguishable from
          sites choosing not to respond. That is the same class of failure as the delivery problem
          two elements up, and the same class of fix: a pre-send validation, not a documentation
          note. Small, cheap, and it protects the one annual event PT's entire capacity pipeline
          depends on.
      - element: "Selective field exposure in a site-update request (Notes, Requirements, Housing, Parking, Personnel)"
        type: "per-blast field-visibility selector; basic site info is always visible"
        data_shown: "Which parts of the site record the recipient can see and edit when responding to an update request — the playbook names Notes, Requirements, Housing, Parking and Personnel as the selectively-exposable set, with basic info always visible"
        gates_on: ["What a site contact can self-serve versus what the coordinator must maintain by hand"]
        accreditation_citation: "ARC-PA Standard B3, Element B3.02 a-c (documented ONGOING site evaluation — self-reported site data is one of its inputs); CSWE Accreditation Standard 3.3, AS 3.3.4 (engaging with field education settings); ACOTE Standard C.1.2 (student access to fieldwork site information — Housing and Parking are literally the student-facing fields this standard is about)"
        competitor_equivalent: >
          Not comparable at element level. Worth one directional note that is supportable: the four
          unresearched marketplace competitors (PT playbook line 184) are built on the site holding
          its own account, which makes site self-service their default rather than a per-blast
          permission. If those teardowns are ever built, this element is the one to compare — the
          question is not whether sites can update their own data but whether they must register to
          do it.
        gap_severity: "none"
        gap_note: >
          NEW 2026-08-25 (PT playbook line 270). Included because it resolves, in Prism's favour, a
          question the rest of this file leaves open: site records are not purely coordinator-
          maintained — there is a documented, granular, per-request mechanism for letting the site
          maintain its own Requirements, Housing, Parking and Personnel. That last one matters for
          rotation-lifecycle--02: Personnel is exposable here, which is a second path to preceptor
          data alongside the Experiential Supervisor Intake Form, and unlike the PIF it is not
          one-supervisor-at-a-time. Note the tension with the site-sharing carve-out documented in
          the Institutional Level step of this file, where Personnel is described as never
          auto-shared across programs; exposing Personnel outward to the site and sharing it
          sideways between programs are different operations, but no source reconciles the two.
      - element: "Exxat version of the CSIF (Clinical Site Information Form) distributable outside LAM"
        type: "ABSENT — named as a roadmap enhancement, not a shipped capability"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2D8 (sufficiency, quality, quantity and variety of clinical sites — the CSIF is the APTA profession's own standard instrument for capturing exactly that site profile); ACOTE Standard C.1.2 (student access to fieldwork site information); ARC-PA Standard B3, Element B3.02 a-c"
        competitor_equivalent: >
          Not comparable at element level, and genuinely unknowable from this repo: the CSIF is an
          APTA-ecosystem artifact and the products that host it are the PT-specific slot
          marketplaces (mCE, Clinician Nexus, ACEMAPP, CastleBranch Bridges) that have no teardown
          in ../competitors/. Recorded as a research hole. What can be said is that Prism's own
          documented ambition here is to REACH SITES OUTSIDE ITS OWN NETWORK, which is a
          distribution question rather than a feature question.
        gap_severity: "gap"
        gap_note: >
          NEW 2026-08-25, and recorded as a confirmed absence-with-intent rather than an
          unconfirmed one, because the PT playbook lists it in its own enhancements section:
          "Create an Exxat version of the CSIF (Clinical Site Information Form) that can be
          distributed to sites outside of LAM" (line 197). The CSIF is the standardised site-profile
          instrument PT programs already exchange with sites, so this is not a novel object — it is
          the profession's existing form, absent from the product.
          Why it belongs in THIS stage rather than in a backlog note: this file already documents a
          self-service Site Assessment form builder (see the Site/Agency Assessments step) and
          records that its weakness is the absence of shipped, standard-shaped starter instruments —
          "nothing ships a B3.02-shaped template." The CSIF is the PT-specific instance of exactly
          that gap, and it is the strongest available evidence that the shipped-starter-instrument
          recommendation is a real customer ask rather than an analyst's inference.
    action: >
      Ahead of and during the March 1 slot-request season the coordinator composes the M1M and its
      follow-up site-update requests, targets them across the site directory (including sites with
      missing attribute data), confirms the template carries the response link, chooses which parts
      of the site record the recipient may update, and then triages delivery failures on the Email
      Dashboard — because an undelivered request and a declined request look identical downstream.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical
      Therapy (PT) Playbook.md — read IN FULL 2026-08-25. Lines 265-270 are the whole of this step
      (failed-delivery triage at Sites > Emails > Email Dashboard with Status filter = Failed, the
      four documented failure causes and three documented fixes including Exxat's whitelist letter;
      the "No Areas/Tags/Categories/Settings Assigned" recipient filter; the @Request Link merge-field
      requirement and the Site/Location Status = Active recipient filter; and the selectively
      exposable Notes/Requirements/Housing/Parking/Personnel fields with basic info always visible).
      Line 197 for the absent Exxat CSIF; lines 79-85 for the M1M cycle this machinery serves;
      line 184 for the four unresearched marketplace competitors; line 186 for the national
      competition for IP and acute-care slots. ../accreditation/arc-pa.yaml (Element A1.10 a-b,
      Element B3.02 a-c); ../accreditation/nursing.yaml (CCNE Key Element II-C);
      ../accreditation/capte.yaml (Element 2D8); ../accreditation/acote.yaml (Standard C.1.2)

  - screen: "Site — About tab (Payment Details section) and Site Payment Report"
    navigation_path: >
      Sites > [Site] > About tab > Payment Details (+); report at Placements > [Placement Group] >
      [Course] > Reports > Site Payment Report
    elements:
      - element: "Payee"
        type: "multi-select (site, location, and/or personnel/preceptor)"
        data_shown: "Who is being paid for hosting/supervising students"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          eMedley's eKeeper module is marketed as pairing affiliation-agreement tracking with
          "preceptor pay automation" (../competitors/emedley.yaml, emedley.com/student-documents) —
          the closest named competitor claim to this element — but eMedley's public docs do not
          describe which payee types their equivalent supports, so the site/location/preceptor
          breadth confirmed here cannot be compared.
        gap_severity: "none"
        gap_note: >
          Supports paying the site, the location, or the individual preceptor, which is what makes
          this usable for Medicine's preceptor-pay dynamic and not just institutional invoicing.
          Not an accreditation-standard evidence field.
      - element: "Rate / Rate Unit"
        type: "input + select (Per Week / Per Rotation)"
        data_shown: ""
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — eMedley claims "preceptor pay automation"
          (../competitors/emedley.yaml) but publishes no rate-unit mechanics, so it is unknown
          whether their equivalent supports the same Per Week / Per Rotation basis.
        gap_severity: "none"
        gap_note: >
          Directly informs the journey's domain_variance claim that Medicine's pay-pressure dynamic
          "turns the agreement record into a financial instrument, not just a legal one" — this is
          the confirmed, site-linked rate field for exactly that instrument, contrary to any
          assumption it would need to be built from scratch. It is stored on the Site, not on the
          Contract, and is not confirmed to be integrated with Contract Status.
      - element: "Vendor ID"
        type: "input field (site payee only)"
        data_shown: ""
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents a finance-system
          vendor identifier.
        gap_severity: "none"
        gap_note: >
          Available only when the payee is a site; the obvious hook for reconciling against a
          university finance system, though no integration is documented in the sources.
      - element: "Payment Notes"
        type: "free text"
        data_shown: ""
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — free-text notes are not documented by any cited
          competitor.
        gap_severity: "none"
        gap_note: >
          Unstructured; nothing computes against it.
      - element: "Site Payment Report"
        type: "report"
        data_shown: "Detailed record of school payments to sites, locations, or supervisors/preceptors per placement"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — eMedley's "preceptor pay automation" claim
          (../competitors/emedley.yaml) implies some reporting output, but no report-level detail is
          published to compare against, and it is not confirmed whether Prism's Payment Details is
          integrated with Contract Status the way "automation" implies eKeeper's is.
        gap_severity: "none"
        gap_note: >
          The reconciliation output for the fields above, resolved per placement. Reporting only —
          no payment execution or finance-system posting is documented.
    action: >
      Coordinator records the negotiated pay rate for a site/preceptor directly on the Site
      record when the affiliation requires compensation, and can later pull the Site Payment
      Report for reconciliation.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Adding and Managing Sites.md
      ("Adding Payment Details" / "Site Payments Report" sections)

  # ---------------------------------------------------------------------------
  # NEW STEP (2026-08-25). The discipline-named site/slot sufficiency report
  # family. This is the screen the four-domain version of this file was missing
  # when it recorded "no confirmed rolling-average capacity math": the reports
  # DO exist, per discipline, in accreditor-shaped form — they just do not
  # compute a verdict. Rated honestly rather than as either a win or a hole.
  # ---------------------------------------------------------------------------
  - screen: "Sites > Reports and Placements > [Placement Group] > Reports — discipline-named site & slot sufficiency exports"
    navigation_path: "Sites > Reports > SCPE Details (PA)  |  Sites > Reports > Slot Sufficiency Report (Nursing, a Custom report)  |  Placements > Placements for Group > Reports > Number and Variety of Clinical Sites / Clinical Slots (PT/PTA)  |  Placements > Placement Group > Reports > Distribution of Slots Across Settings / by Location (PA)"
    elements:
      - element: "SCPE Details report (PA)"
        type: "report, mirrors the ARC-PA Entry Level Program Portal's own SCPE data-entry format"
        data_shown: "Cohort, site name, affiliation status, setting, slots offered, slots used — filterable by 'Written Agreements = Yes' and by state"
        gates_on: []
        accreditation_citation: "ARC-PA Standard A1, Element A1.10 a-b (Self-Study Report Appendix 11a, filtered by state); ARC-PA Standard B3, Element B3.01 a-e (SSR Appendix 11a, filtered by Written Agreements = Yes)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents an accreditor-portal-
          shaped capacity export, and none names ARC-PA at all. CORE ELMS's accreditation claims are
          documented as uneven across disciplines with explicit ACPE claims and no discipline-specific
          accreditor naming on other pages (../competitors/core-elms.yaml lines 103, 153), which is
          the closest thing to a comparison available and is a point in Prism's favour rather than a
          parity finding.
        gap_severity: "configure-needed"
        gap_note: >
          The strongest capacity artifact in the product, and it is worth understanding exactly what
          makes it strong: the numbers are not an admin's estimate. Per the PA playbook, "the Slot
          Request feature lets programs directly request confirmed slot availability from site
          partners (by rotation and setting); site responses populate into the SCPE report
          automatically ('true slots offered' data)," against an ARC-PA requirement that programs
          "update confirmed slots per location/setting on an ongoing basis, not just annually"
          (Physician Assistant (PA) Playbook.md lines 168-180). ../accreditation/arc-pa.yaml calls
          this "already built and named for this standard."
          Rated configure-needed, not none, because of the workflow the playbook itself prescribes:
          "ensure site/location names in Prism exactly match the ARC-PA portal ('gold in, gold out')
          ... download both the SCPE report from Prism and the ARC-PA portal's slots report ...
          compare them side by side in Excel, line by line, to spot mismatches." A manual
          line-by-line Excel diff against an external portal is the actual customer workflow, and
          name-matching hygiene is a precondition nothing in Prism enforces. The registry's verdict
          on the analytic half stands: "Sufficiency is asserted by eyeballing offered-vs-used per
          setting in Excel, not computed."
      - element: "Slot Sufficiency Report (Nursing)"
        type: "Custom report under Sites > Reports"
        data_shown: "Total Slots Offered / Total Placements / Completed Placements, by site"
        gates_on: []
        accreditation_citation: "CCNE Standard II, Key Element II-C (documentation of the sufficiency and availability of clinical sites, plus evidence of a DEFINED, periodically-run determination process); ACEN Standard 4, Criterion 4.9; COA Standard F.1 with Standard A.10 — BOTH CRITICAL (*)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents an offered-versus-
          placed-versus-completed rollup, and neither CORE ELMS nor E*Value names CCNE, ACEN or COA
          in the material captured in ../competitors/.
        gap_severity: "configure-needed"
        gap_note: >
          Named in the Nursing playbook as the CCNE II-C evidence source: "Slot Sufficiency Report
          (a Custom report under Sites > Reports) — Total Slots Offered / Total Placements /
          Completed Placements by site, used as ongoing, data-driven evidence of clinical-site
          adequacy" (Nursing Playbook.md line 70). The three-column shape is smarter than it looks —
          offered-versus-placed exposes over-solicitation and placed-versus-completed exposes
          attrition, which are different problems.
          Two documented limits. ../accreditation/nursing.yaml: "the report shows volume, not a
          judgment of adequacy against a defined threshold — the 'defined process' narrative and the
          modifications-made record are still assembled by hand outside the product." And the label
          "Custom report" is itself the configure-needed finding: unlike PT's and PA's, this one is
          not a shipped standard report.
          DISCIPLINE-SPECIFIC (CRNA — where volume genuinely cannot answer the question): COA F.1
          asks whether resources are sufficient for graduates to INDIVIDUALLY meet requirements, and
          ../accreditation/coa.yaml spells out why per-site volume misses it — "a program with enough
          total slots can still fail if no site offers, say, enough open-heart or pediatric-under-2
          cases for every student to hit the Appendix minimums," and "no shipped report crosses site
          capacity with the Appendix CASE-CATEGORY minimums." Prism holds both halves of that join
          (site capacity here, case categories in the CCE/Patient Log) and does not join them. Both
          F.1 and A.10 are asterisked critical. This is the sharpest capacity gap in the file after
          the supervision-ratio finding, and the two are the same discipline.
      - element: "Number and Variety of Clinical Sites / Number and Variety of Clinical Slots (PT/PTA)"
        type: "two shipped reports, run by selecting Group & Rotation and clicking Download Report; the slots report carries an include-cancelled-slots checkbox"
        data_shown: "Count and categorical variety of contracted sites, and of clinical slots, scoped to a rotation"
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2D8 (the 2024 home of this requirement — see gap_note for the labelling defect)"
        competitor_equivalent: >
          Not comparable at element level, and this is the clearest capability-level advantage in the
          stage: no competitor file in ../competitors/ documents any report named after an
          accreditation standard for any discipline. CORE ELMS's own material is characterised as
          having "accreditation-body coverage... uneven across disciplines"
          (../competitors/core-elms.yaml line 153). Stated as an advantage in KIND rather than a
          field-level comparison, because there is no competitor artifact to compare against.
        gap_severity: "cosmetic"
        gap_note: >
          Rated cosmetic because the DATA is right and only the printed citation is stale — but it is
          a label defect with real downstream cost, so the rating should not be read as "ignore it."
          ../accreditation/capte.yaml records it as an "IMPORTANT VERSION HAZARD": the two reports are
          labelled "Standard 2C" and "Standard 8F", which is 2016 numbering, and "there IS no
          Standard 8 in the 2024 PT or PTA documents (they stop at Standard 7), and 2024's 2C is
          program assessment, not sites. The sites/slots content now lives at 2D8." The registry also
          notes the fix is a known shape, because "Prism's other five CAPTE reports already carry
          dual '2024 X / 2016 Y' labels; these two have not been renumbered." CAPTE expects programs
          to meet the 2024 standards as of Jan 1 2026, so this is live now. The wider point the
          registry draws is worth keeping: this is "the concrete argument for making the edition
          crosswalk a first-class field in Accreditation Management" — a problem every accreditor in
          this repo will have (ARC-PA's 5e-to-6e renumbering is the same shape, and the PA playbook
          carries a whole crosswalk section for it).
      - element: "150%-of-charter-class capacity projection for developing programs (PT/PTA)"
        type: "ABSENT — no forward-looking required-versus-contracted capacity model"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "CAPTE Standard 2, Element 2D8 (developing programs must confirm fully executed written agreements and site-specific Letters of Intent covering clinical placements for 150% of the charter class size — e.g. 60 experiences for a charter class of 40 — plus a plan for obtaining more)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents capacity modelling
          ahead of an enrolled cohort. Unbenchmarked rather than absent-in-market.
        gap_severity: "gap"
        gap_note: >
          Kept as its own element because it is the one capacity requirement in this file that must
          be answered BEFORE any student exists, which makes every report on this screen structurally
          incapable of serving it — they all read placements and slots that have already happened.
          ../accreditation/capte.yaml states the gap plainly: "the 150%-of-charter-class capacity
          projection for developing programs has no shipped equivalent — Placement Assist allocates
          against actual slots, it does not model required-versus-contracted capacity ahead of a
          cohort existing."
          Directly relevant to this repo's purpose rather than only to PT: a brand-new program in ANY
          discipline is in exactly this position, and the four expansion domains are, by definition,
          programs standing up from zero. CAPTE is simply the accreditor that wrote the requirement
          down with a number attached, and it also names the artifact that fills the gap for a site
          with no agreement yet — the site-specific Letter of Intent, which is a pre-contract
          instrument the Contract object does not model (the closest available value would be
          "In Development" or "Draft" from the OT-documented status set, which is not the same
          thing).
      - element: "Distribution of Slots Across Settings / Distribution of Slots by Location (PA)"
        type: "two reports under Placements > Placement Group > Reports; select a rotation and download"
        data_shown: "Slots filled versus offered per setting; total slots and locations used per cohort"
        gates_on: []
        accreditation_citation: "ARC-PA Standard B3, Element B3.01 a-e (sufficiency evidence, complementing rather than duplicating SCPE Details)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents setting-level slot
          distribution reporting.
        gap_severity: "none"
        gap_note: >
          Included because filled-versus-offered per SETTING is the cut that matters for a discipline
          with mandated core settings, and it is a different question from SCPE Details' per-site
          view. The PA playbook names both reports and is explicit that they complement rather than
          duplicate the SCPE report (Physician Assistant (PA) Playbook.md line 297). ARC-PA's seven
          core settings (Emergency Medicine, General Surgery, Pediatrics, Family Medicine, Behavioral
          Health, Women's Health/OB-GYN, Internal Medicine — playbook line 116) are the rows that
          make it readable, which is the same structural point ACPE's four mandatory APPE settings
          make for Pharmacy: the Settings taxonomy configured back in the site/location records is
          what determines whether this report can answer the standard at all.
    action: >
      Ahead of a self-study, annual report, or accreditor-portal update, the compliance liaison pulls
      the discipline's named site/slot sufficiency export, then assembles the sufficiency ARGUMENT by
      hand — comparing offered against used in Excel, diffing against the accreditor's own portal
      where one exists, and writing the narrative the standard actually asks for. Every report on
      this screen produces volume; none produces a verdict.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician
      Assistant (PA) Playbook.md (lines 116, 166-180 SCPE Details and the gold-in-gold-out workflow;
      lines 284-297 the SSR appendix table and the two Distribution of Slots reports);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing
      Playbook.md (lines 68-70 — Sites database, Contracts, Slot Sufficiency Report; lines 116-118
      CCNE Standard II and COA Standard F mappings);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physical
      Therapy (PT) Playbook.md (lines 210-232 — the seven CAPTE-mapped reports including "Number and
      Variety of Clinical Sites (Standard 2C)" and "Number and Variety of Clinical Slots (Standard
      8F)", and the AAR five-pull sequence); ../accreditation/capte.yaml (Element 2D8, the version
      hazard and the 150% finding); ../accreditation/arc-pa.yaml (Element A1.10 a-b);
      ../accreditation/nursing.yaml (CCNE Key Element II-C); ../accreditation/coa.yaml (Standard F.1
      with Standard A.10)

