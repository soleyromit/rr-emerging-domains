# Element-level ground truth underneath rotation-lifecycle.yaml, stage 1.
# See _TEMPLATE.yaml for field meanings (SCHEMA v2: analysis fields live per element).
# Every accreditation_citation and competitor_equivalent claim below traces to a real
# source file in confirmed_by — never to this journey's own narrative.
#
# SCOPE EXTENSION (2026-08-25): this file was originally built covering only the four
# EXPANSION domains (DO, Medicine, Dentistry, Pharmacy). It now also covers the eight
# disciplines Exxat/Prism ALREADY serves — PT/PTA, OT/OTA, PA, SLP, Nursing, Social Work,
# Teacher Education, and CRNA (nurse anesthesia) — bringing this stage to the same
# 11-to-12-discipline breadth as admin-onboarding--05. Discipline-specific findings are
# carried two ways, matching the convention in admin-onboarding--05: as their own ELEMENT
# where the discipline exercises a distinct field, control, or report that the four-domain
# baseline never touched, and as an explicitly-flagged clause inside an existing element's
# gap_note where the SAME control simply means something different for that discipline.
# Three new steps were added for workflows with no four-domain equivalent at all:
# Site/Agency Assessments (site vetting BEFORE contracting), the discipline-named site/slot
# sufficiency report family, and student-sourced site entry.
#
# COMPETITIVE FRAME SHIFTS FOR THESE EIGHT. For the four expansion domains, the cited
# competitor set (CORE ELMS, eMedley, MedHub, E*Value, Elentra, one45, New Innovations,
# axiUm, Leo/DaVinci) is largely aspirational overlap. For PT/OT/PA/Nursing/SW the overlap
# is direct and current: CORE ELMS markets to "15+ disciplines including pharmacy, dental,
# nursing, PT, OT, PA, veterinary, social work" (../competitors/core-elms.yaml lines 27,
# 113-114) and E*Value to "24+ named disciplines (GME, UME, nursing, PT/OT, pharmacy,
# dentistry, osteopathic medicine, PA, athletic training, social work, and more)"
# (../competitors/e-value.yaml lines 26-28). That makes their affiliation-agreement claims
# same-buyer claims rather than adjacent ones — but it does NOT make them element-level
# comparable, because neither publishes a contract-screen field list. Separately, the PT
# playbook names a site-sourcing competitive set that has NO teardown file in this repo at
# all: myClinicalExchange (mCE), Clinician Nexus, ACEMAPP, and CastleBranch Bridges, which
# it describes as "third-party vendors that require student account registration and
# payments for slot requests or onboarding — direct competitors of Exxat/Exxat One" that
# "will not integrate with us" (Physical Therapy (PT) Playbook.md line 184). For the
# site-sourcing half of this stage those four are the real competitors for PT/OT and this
# repo has never researched them; that is recorded here as a known research hole, not
# papered over with a comparison to CORE ELMS.
flow_name: "Site Sourcing, Capacity Contracting & Affiliation-Agreement Execution"
maps_to_journey: "rotation-lifecycle.yaml, stage 1"
persona: >
  Primary: Clinical/Experiential Education Coordinator (../personas/role-clinical-coordinator.yaml)
  — creates/maintains the Site and Location records, executes and links contracts, configures
  expiration alerts, and monitors the Placement Clearance Dashboard's Contract Status column.
  Secondary: Compliance/Accreditation Liaison (../personas/role-compliance-accreditation-liaison.yaml)
  — pulls the Contracts report ("Sites Missing Contracts") and the Site Payment Report ahead of a
  self-study or site-visit request.

steps:
  - screen: "Sites — Add Site drawer"
    navigation_path: "Sites (left menu/dashboard) > + Add Site"
    elements:
      - element: "Name / Alias Name"
        type: "input fields"
        data_shown: "Official site name (mandatory) plus one optional alternate/short name"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.9; LCME Standard 1, Element 1.4; ACPE Standard 3, Key Element 3.5.b; CODA Standard 4, Element 4-6; CAPTE Standard 2, Element 2D9; ACOTE Standard C.1.5; ARC-PA Standard B3, Element B3.01 a-e; CAA Standard 3.0B, Standard 3.9B; ACEN Standard 4, Criterion 4.9; COA Standard F.2 with Standard A.3; CSWE Accreditation Standard 3.3, AS 3.3.4; CAEP Standard R2, Component R2.1"
        competitor_equivalent: >
          Not comparable at element level — CORE ELMS's and eMedley's public pages (see
          ../competitors/core-elms.yaml, emedley.yaml) describe "centralized site/student/preceptor
          management" at a marketing-feature level, with no screen-by-screen field list for site
          creation to compare a name/alias field against. For the eight existing disciplines the
          buyer overlap is closer but the evidence is no better: CORE ELMS explicitly sells the same
          module into "nursing, PT, OT, PA... social work" (../competitors/core-elms.yaml line 27)
          and E*Value into 24+ disciplines including social work and athletic training
          (../competitors/e-value.yaml lines 26-28), yet neither publishes a site-creation field
          list either, so the comparison stays at "both have a site directory."
        gap_severity: "none"
        gap_note: >
          This is the named entity every standard's "each clinical site" language attaches to.
          Per "Understanding Site vs. Location," a Site is defined as "the group or entity with
          which a contractual relationship is established" — so the site name is the anchor the
          Contract object later hangs off, not an arbitrary label. Resolves part of the journey's
          prior object-model hedge directly: the model is not ambiguous.
          DISCIPLINE-SPECIFIC (terminology, same field): OT and Social Work both rename this object
          rather than use it differently. The OT playbook maps "Sites -> Agencies" outright and
          Preceptor -> Fieldwork Educator / Site Mentor (Occupational Therapy (OT) Playbook.md
          lines 53-56); Social Work uses "Agency" consistently as its term for Site/Location and
          reaches the same records through an Agencies module (Social Work (SW) Playbook.md
          lines 25, 131). Neither is a different data model — the same Site record carries the same
          contract — which is why the Alias Name field matters more for them than for the four
          expansion domains.
          DISCIPLINE-SPECIFIC (the name is not sufficient evidence, PA): ARC-PA 6e B3.01 a-e is the
          one standard in this file where naming the SITE correctly does not satisfy the standard,
          because the agreement must also name the PROGRAM. The PA playbook is explicit that
          "whether institution-wide or site-specific, the agreement must explicitly state 'Physician
          Assistant students'," that broad "all learners" university agreements are "no longer
          sufficient," that programs remediate this with an addendum reading "All learners in this
          agreement include Physician Assistant students," and that for institutions with multiple
          PA programs/campuses the agreement "should identify which campuses/programs are included —
          generic university-wide language has been a common source of accreditation citations"
          (Physician Assistant (PA) Playbook.md lines 141-152). Nothing on this screen or the
          Contract screens models that; see the dedicated clause-content element in the Contracts
          step.
          DISCIPLINE-SPECIFIC (Teacher Education, inferred not confirmed): a school district is the
          natural Site and its schools the Locations, and ../accreditation/caep.yaml calls the
          chain-linked contract model "a near-exact structural match for a district MOU covering
          many school locations." That structural read is this repo's, from the CAEP 2022 standards
          workbook — NOT from any Exxat TE source. The TE playbook explicitly warns that TE
          terminology and placement workflows are "NOT confirmed for Exxat" and that CAEP standard
          numbers should not be treated as Exxat-specific "until confirmed against a TE-specific
          source" (Teacher Education (TE) Playbook.md lines 12, 67-72). TE is therefore the one
          discipline in this file whose fit is reasoned from the accreditor registry rather than
          observed in a product source, and every TE clause below carries that caveat.
      - element: "Active toggle"
        type: "toggle"
        data_shown: "Whether the site is available for new placements; inactive sites remain in the system but cannot receive new placements"
        gates_on: ["eligibility for new placement/slot creation"]
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents an active/inactive
          site flag or what it gates.
        gap_severity: "none"
        gap_note: >
          Confirmed to gate new placement/slot creation, but it is a manually-set flag on the Site
          record — nothing in the sources ties its state to contract validity. It is not itself an
          accreditation evidence field; it is the one confirmed hard gate on this screen.
      - element: "Address / Phone / Fax / Website / EIN"
        type: "input fields"
        data_shown: "Address is mandatory; the rest are optional contact/identifier fields"
        gates_on: []
        accreditation_citation: "COCA Standard 6, Element 6.9; LCME Standard 1, Element 1.4; ACPE Standard 3, Key Element 3.5.b; CODA Standard 4, Element 4-6"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file publishes a field list for
          site demographics to compare address/EIN capture against.
        gap_severity: "none"
        gap_note: >
          Mandatory Address is what makes a Site identifiable as a physical clinical site in the
          document library each of these standards asks for; the remaining fields are optional
          contact detail and carry no evidentiary weight on their own.
      - element: "Programs"
        type: "multi-select (only visible/editable if the tenant has site-sharing enabled)"
        data_shown: "Which other programs at the same university can see this site"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents cross-program site
          visibility controls.
        gap_severity: "none"
        gap_note: >
          Tenant-conditional: only appears when site-sharing is enabled (see the Site Sharing Model
          setting in the Institutional Level step). Relevant to multi-program positioning, not to
          any single standard's evidence requirement.
      - element: "Site/Location Categories"
        type: "tag select, values configured centrally in Sites > Setup"
        data_shown: "Program-defined grouping labels on the Site/Location record"
        gates_on: ["filtering on the Contracts report and the site/location grids"]
        accreditation_citation: "ACOTE Standard C.1.5 (the selection process and criteria for choosing fieldwork sites, evidenced per level); ACOTE Standard C.1.2 (student access to fieldwork site information); CSWE Accreditation Standard 3.3, AS 3.3.1 (agency setting type, population served, and services as structured fields)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents a site-categorisation
          taxonomy or what it drives. CORE ELMS's "centralized site/student/preceptor management"
          claim (../competitors/core-elms.yaml) is the nearest, and is not granular enough to
          compare a configurable category vocabulary against.
        gap_severity: "configure-needed"
        gap_note: >
          Invisible in the four-domain baseline because those domains have no per-level site
          taxonomy, but for OT this field is how the whole ACOTE C.1.5 selection-criteria argument
          is expressed. The OT playbook records a live, production category vocabulary — "Contract
          Organization, Direct Patient Care 101, Level I, Level II, Observation Only" — alongside
          Personnel Categories (Established / New) and a Location Area tag set used for geography
          (Occupational Therapy (OT) Playbook.md lines 227-229), and states that OT sites are
          categorised as Level I Fieldwork Sites, Level II Fieldwork Sites, and Capstone Project
          Sites (line 221). Because C.1.5 requires the written-agreement test to be applied
          separately across Level I (including field trips, observation, and service-learning) and
          Level II, a site's category is what makes "which agreement rule applies here" answerable.
          Rated configure-needed rather than none because the vocabulary is program-authored: none
          of these values ships, so a new OT program gets the mechanism and none of the meaning.
          DISCIPLINE-SPECIFIC (Social Work): CSWE AS 3.3.1 wants agency "setting type, population
          served, and services" as structured fields so a program can prove field opportunities
          across all five system levels; ../accreditation/cswe.yaml records that system-level
          tagging "currently rides on generic placement/agency tags rather than a first-class CSWE
          system-level field," which is this element doing double duty as a taxonomy it was not
          designed for.
      - element: "'Contract not required' site flag"
        type: "ABSENT — no such flag exists on the Site record"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "ACOTE Standard C.1.5 (written agreements required 'for every entity outside the academic program,' including field trips, observation, and service-learning — which is precisely the population where programs argue no agreement is needed)"
        competitor_equivalent: >
          Not comparable at element level, and honestly not knowable: no cited competitor file
          documents whether their site record can be exempted from a contract requirement, so it is
          unknown whether this false-positive problem is Prism-specific or category-wide. Recorded
          as an open question rather than a Prism-only weakness.
        gap_severity: "gap"
        gap_note: >
          The sharpest OT-specific finding in this stage, and a true confirmed absence rather than
          an unconfirmed one. The OT playbook records it as a named pain point with a named ask:
          "Not all sites require a contract, but the system assumes a contract is required when a
          site is added, so it flags missing contracts even when none is needed. Schools have
          requested a way to mark a site as 'contract not required' so it isn't flagged as
          missing/incomplete" (Occupational Therapy (OT) Playbook.md line 424).
          ../accreditation/acote.yaml carries the same finding against C.1.5 and draws the
          consequence out: "without it, the C.1.5 clearance view carries permanent false positives
          that erode trust in the dashboard." This compounds the Placement Clearance Dashboard
          finding later in this file in a specific way — that column is already display-only rather
          than enforcing, and here it is also emitting known-wrong warnings, so the failure mode is
          not just "a coordinator has to go look at it" but "a coordinator learns to ignore it."
          Note the standard cuts against the ask: ACOTE C.1.5 requires agreements in effect for
          every entity outside the academic program including field trips and observation, so the
          right shape is probably a documented, auditable exemption reason on the site rather than a
          silent suppression toggle.
      - element: "Partner-school demographic profile (Teacher Education)"
        type: "ABSENT — no confirmed field on the Site/Location record"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "CAEP Standard R2, Component R2.3 (Diversity: evidence every candidate had clinical experiences with diverse P-12 students, disaggregated and shown across three cycles of data)"
        competitor_equivalent: >
          Not comparable at element level — none of the nine competitor teardowns in this repo
          covers Teacher Education at all (../competitors/ files address health-sciences and GME
          products), so there is no competitor to benchmark a P-12 partner-school attribute against.
          This is an honest coverage hole in the repo, not a finding about the market.
        gap_severity: "gap"
        gap_note: >
          CAEP's diversity attribute is a property of the partner SCHOOL's student body, not of the
          placement or the candidate — which is why it has to live on the site/location record and
          nowhere else. ../accreditation/caep.yaml states the consequence directly: "Prism's
          site/location record has no confirmed field for partner-school demographics, so
          demographic-diversity evidence would today be a manual crosswalk against state
          report-card data." Carrying the standing TE caveat: no Exxat TE source in this corpus
          confirms or denies this, because the only TE product source available is a single video
          tutorial on the GoReact/Echo360 LTI integration (Teacher Education (TE) Playbook.md
          lines 12-16), which touches nothing in this stage. Rated a gap on the strength of the
          registry's negative finding, with the absence of a TE product source stated rather than
          hidden.
    action: >
      Coordinator creates the Site record before any Location, Slot, or Contract can be attached
      to it. A Site is explicitly the entity that carries the contractual relationship — a
      Location is an address under it — per "Understanding Site vs. Location": "A 'Site' is best
      described as the group or entity with which a contractual relationship is established.
      Just as a contract may cover one or many physical locations, a 'site' may include one or
      many physical locations."
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Adding and Managing Sites.md;
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Sites/Understanding Site vs.
      Location.md;
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Occupational
      Therapy (OT) Playbook.md (lines 221, 227-229 site categories; line 424 the contract-not-
      required pain point); /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/
      Playbooks/Social Work (SW) Playbook.md (lines 25, 131 Agencies module);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician
      Assistant (PA) Playbook.md (lines 141-152 PA-student naming requirement);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Teacher
      Education (TE) Playbook.md (lines 12, 67-72 — the explicit "not confirmed for Exxat" caveat);
      ../accreditation/acote.yaml (Standard C.1.5); ../accreditation/caep.yaml (Component R2.3)

  # ---------------------------------------------------------------------------
  # NEW STEP (2026-08-25). Site VETTING before contracting. No four-domain source
  # required this screen — COCA 6.9, LCME 1.4, ACPE 3.5.b and CODA 4-6 all ask
  # for an executed agreement, not for a documented site-selection process. Five
  # of the eight existing disciplines' accreditors ask for the process itself,
  # which makes this a step the original file could not have had.
  # ---------------------------------------------------------------------------
  - screen: "Sites — Site/Agency Assessments (Setup > Form Setup, and per-site Assessments tab)"
    navigation_path: "Sites > Setup (ribbon) > Form Setup  |  Sites > [Site] > Assessments  |  Agencies > [Agency] > Assessments (Social Work labelling)"
    elements:
      - element: "Form Setup — self-service site-assessment form builder"
        type: "form builder, 11 question types including attestation and e-signature"
        data_shown: "Program-authored site-visit and site-vetting instruments"
        gates_on: []
        accreditation_citation: "ARC-PA Standard B3, Element B3.02 a-c (documented INITIAL and ONGOING evaluation of every SCPE site and preceptor, covering facilities, patient populations, and supervision); CSWE Accreditation Standard 3.3, AS 3.3.4 (documented process for identifying, approving, and engaging with field education settings); CAA Standard 3.0B, Standard 3.9B (written policies describing how the program determines whether a site has the appropriate clinical population and personnel); COA Standards F.4 and F.6; CCNE Standard II, Key Element II-C (a DEFINED, periodically-run process for determining site currency, availability, accessibility and adequacy)"
        competitor_equivalent: >
          Not comparable at element level. CORE ELMS's compliance module is marketed for
          "accreditation and audits" (../competitors/core-elms.yaml) and E*Value for onboarding
          document collection (../competitors/e-value.yaml lines 42, 51), but neither publishes
          anything about a site-assessment instrument builder, so a question-type count or an
          e-signature capability has nothing to compare against.
        gap_severity: "configure-needed"
        gap_note: >
          This is where the four-domain and eight-discipline pictures diverge most cleanly. The
          expansion domains' standards care that an agreement EXISTS; five of these eight care how
          the site was CHOSEN and how often it is re-checked. ../accreditation/arc-pa.yaml describes
          the required behaviour as "a self-service form builder producing two distinct instruments
          (pre-placement site visit and in-rotation site visit) with the three required access
          dimensions as explicit questions," and confirms Prism ships the builder at Sites > Setup >
          Form Setup with 11 question types including attestation and e-signature.
          Rated configure-needed for a reason stated in the registry: "the three sub-standards
          (facilities / patient populations / supervision) are conventions the program has to
          remember to build into its own custom form — nothing ships a B3.02-shaped template." Same
          for CSWE and CAA. A shipped, standard-shaped starter instrument per accreditor is a small
          build with disproportionate value here, and there is precedent for it: the OT playbook
          records that an "Exxat Standard Assessment Form" already coexists with school-specific
          forms (Occupational Therapy (OT) Playbook.md line 235), so the pattern of shipping a
          default instrument exists and simply has not been pointed at these standards.
      - element: "'Initial Site Visit' / 'Ongoing Site Visit' form pair"
        type: "two program-authored instruments (PA documented best practice), with student tagging for who was on rotation during a visit"
        data_shown: "Pre-placement vetting findings and in-rotation monitoring findings, attributable to a named site/location/preceptor"
        gates_on: []
        accreditation_citation: "ARC-PA Standard B3, Element B3.02 a-c (SSR Appendix 15); CSWE Accreditation Standard 3.3, AS 3.3.4; COA Standards F.4 and F.6"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents distinct
          pre-placement versus in-rotation site instruments.
        gap_severity: "gap"
        gap_note: >
          The instruments exist; the RECURRENCE obligation they serve does not. PA's documented
          practice is to build exactly two forms — "Use Prism's Site Assessment Form Setup
          self-service feature to build two custom forms — 'Initial Site Visit' and 'Ongoing Site
          Visit'" (Physician Assistant (PA) Playbook.md lines 154-160) — and OT's practice is to
          revisit each site on a 5-10 year cycle tracked via the Assessment Details report
          (Occupational Therapy (OT) Playbook.md line 291). Both are cadences, and
          ../accreditation/arc-pa.yaml names the gap precisely: "nothing detects that a site has no
          ONGOING assessment on record within a defined interval. 'Initial and ongoing' is a
          recurrence obligation; the form builder has no recurrence semantics." So a program can
          prove it assessed a site and cannot prove — or be warned — that it has stopped. That is
          the same structural shape as the Contract Status finding: the artifact is captured, the
          obligation is not monitored.
          DISCIPLINE-SPECIFIC (CRNA/Nursing): the one place recurrence IS partially handled. The
          Nursing playbook records "Site Assessments — structured site-visit tracking (date, mode,
          type, custom assessment form) with follow-up dates pushed to the Program Calendar (COA
          F.4)" (Nursing Playbook.md line 72). A follow-up date on the calendar is a per-visit
          reminder rather than a per-site interval rule, so it mitigates the gap for a diligent
          coordinator without closing it.
      - element: "Site-assessment capture requires connectivity (no offline mode)"
        type: "ABSENT — assessments cannot be logged offline"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: "ACOTE Standard C.1.5 (the site-selection process evidence a site visit produces); ARC-PA Standard B3, Element B3.02 a-c"
        competitor_equivalent: >
          Not comparable at element level — offline capture is not addressed by any cited competitor
          source, so it is unknown whether this is a Prism-specific limitation or a category norm.
          Recorded as unbenchmarked.
        gap_severity: "gap"
        gap_note: >
          A small, concrete, field-reported product limitation that only shows up once a discipline
          with real site-visit volume is in scope. The OT playbook: site and location assessment
          "cannot be logged offline — schools without internet access at a site take paper notes and
          must re-enter data later, duplicating effort" (Occupational Therapy (OT) Playbook.md line
          287). Worth carrying because it is the mechanism by which the recurrence gap above becomes
          a real data gap — double entry is the step that gets skipped, and a skipped ongoing
          assessment is invisible per the previous element. Note the contrast with the student-facing
          mobile app, which the Nursing and PA playbooks both confirm exists (Nursing Playbook.md
          line 103; Physician Assistant (PA) Playbook.md line 358): the mobile surface was built for
          the student side, not for the coordinator standing in a hospital corridor.
      - element: "Self-service authorship of assessment forms — SLP carve-out"
        type: "support-gated for SLP: new custom forms require a prism-support@exxat.com ticket"
        data_shown: "n/a"
        gates_on: ["whether an SLP program can author its own site-suitability instrument at all"]
        accreditation_citation: "CAA Standard 3.0B, Standard 3.9B (written policies and procedures describing how the program determines whether a clinical site has the appropriate clinical population and personnel)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents which of its
          configuration surfaces are self-service versus support-gated, which is itself a notable
          blind spot given how much of the real cost of ownership sits there.
        gap_severity: "gap"
        gap_note: >
          The SLP-specific finding in this stage, and it is a permissions finding rather than a
          feature one — the capability documented two elements up simply is not available to this
          discipline on the same terms. The SLP playbook records the dependency three times and
          flags it as a pattern: creating new forms is "not self-service — programs must contact
          prism-support@exxat.com, a heavier CSS/support dependency than PT's largely self-serve
          standard-form model" (Speech-Language Pathology (SLP) Playbook.md line 98), the same for
          min/max hour thresholds (line 67) and notification rules (line 118), and the playbook's own
          gap list calls it "worth flagging to CX/Product as a possible self-service gap for SLP
          specifically" (line 149). ../accreditation/caa-asha.yaml draws the accreditation
          consequence against 3.9B: "an SLP program cannot author its own 3.9B site-suitability
          instrument without support involvement, unlike PT." Since 3.9B's site-suitability policy
          is the SLP-specific half of the standard (the agreements half is served well by the
          Contracts object), this is the point where SLP's stage-1 story is weakest.
      - element: "Comprehensive Site Assessment report / Assessment Details report"
        type: "report (Sites > Reports > Comprehensive Assessment Report > Select Form; Agencies > Reports > Assessment Details for Social Work)"
        data_shown: "All responses across site visits for a selected form, readable as a cross-site trend rather than a stack of individual forms"
        gates_on: []
        accreditation_citation: "ARC-PA Standard B3, Element B3.02 a-c (Self-Study Report Appendix 15); ARC-PA Standard B3, Element B3.04 a-d; CSWE Accreditation Standard 3.3, AS 3.3.4; ACOTE Standard C.1.5"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents a cross-site
          assessment rollup, named or otherwise.
        gap_severity: "none"
        gap_note: >
          The output that makes the whole step count as evidence rather than as filing. PA's guide
          maps it to B3.02 a-c and places it at SSR Appendix 15 (Physician Assistant (PA)
          Playbook.md lines 194-196, 288); SW reaches the same capability as Agencies > Reports >
          Assessment Details (Social Work (SW) Playbook.md lines 132, 179); OT reaches it as
          Assessment Details showing "where a site was previously assessed" (Occupational Therapy
          (OT) Playbook.md line 291). Three disciplines, three names, one report — which is a good
          illustration of the repo's cross-discipline thesis and also a reminder that discipline-
          named reports are largely a labelling exercise over shared machinery.
          The honest limit is the one ../accreditation/cswe.yaml records against AS 3.3.4(iii):
          site and instructor EFFECTIVENESS evaluation — the leg that supports a documented
          renew/re-approve/sunset decision — is "assembled by hand from Interventions &
          Communications and Learning Activities reports," because what is missing is longitudinal,
          agency-scoped and instructor-scoped trending rather than any single report.
    action: >
      Before (and periodically after) an agreement is signed, the coordinator vets the site: builds
      or selects a site-assessment instrument, logs an initial site visit, repeats it on an ongoing
      cadence during placements, and pulls the cross-site assessment report as self-study evidence.
      For the four expansion domains this step is optional practice; for PA, OT, Social Work, SLP
      and CRNA the process itself is what their accreditor asks to see.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician
      Assistant (PA) Playbook.md (lines 154-165 Site/Location Assessment and the two-form best
      practice; lines 194-196 Comprehensive Assessment Report; line 288 SSR Appendix 15);
