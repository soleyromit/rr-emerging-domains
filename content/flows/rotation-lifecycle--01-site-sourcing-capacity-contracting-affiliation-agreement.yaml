          caa-asha.yaml) independently record that Prism's Placement Clearance Contract Status check
          does evaluate this window against the PLACEMENT's own dates and distinguishes "expires
          before placement end" from "missing" — which is a materially harder test than any
          competitor claim in this repo asserts. The caveat is one this file already establishes at
          the dashboard: the test computes, it does not enforce.
