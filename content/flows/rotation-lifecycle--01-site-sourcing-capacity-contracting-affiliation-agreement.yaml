          one, which is why it is rated none rather than configure-needed.
          DISCIPLINE-SPECIFIC (PT/PTA — this is the industry's actual sourcing rhythm): the PT
          playbook records the annual slot-request cycle as March 1 ("M1M"), where an M1M sent March
          1 2025 requests slots for calendar year 2026, and SCCEs "respond to the M1M by offering a
          mix of reserved or First Come First Serve (FCFS) slots," with the FCFS share "climbing" and
          schools advertising those to students immediately to avoid "losing out... to other schools
          competing for them" (Physical Therapy (PT) Playbook.md lines 79-84, 104). The four
          expansion domains in this file have no equivalent seasonality documented, so FCFS-vs-
          reserved is a distinction that only becomes load-bearing once PT/OT are in scope. Exxat One
          (debuted March 2024) is documented as the year-round alternative to the M1M cycle for both
          PT and OT (PT playbook line 85; Occupational Therapy (OT) Playbook.md line 380).
          DISCIPLINE-SPECIFIC (PA): PA has "no fixed date for sending slot request emails (unlike
          PT's M1M)" and runs two structurally different sourcing models — Site Based, where the
          location provides slots, and Preceptor Based, where the preceptor provides them and "all
          locations associated with a preceptor are published to the student" (Physician Assistant
          (PA) Playbook.md lines 18-33, 99-102). Preceptor Based inverts the object that owns
          capacity, which is why the PA-only cap element below is scoped to Location rather than to
          the preceptor.
      - element: "Max Placement Limit (PA-exclusive slot cap)"
        type: "numeric cap on a Location + Setting + Cohort combination, set from the Slot Offering Drawer (step 2) by either the site delegator or an admin; surfaced in the Slots Grid and Slots List View with a 'Limit Exists' label"
        data_shown: "How many students a site will actually accept, independently of how many slots it listed as offered"
        gates_on: ["SOFT ONLY — warns at location-view student selection, at the Make Placement drawer for both Place Individually and Place as a Group, and at student-view placement; staff can proceed anyway"]
        accreditation_citation: "ARC-PA Standard A1, Element A1.10 a-b (programs must document 'the number of students each site can accommodate'); ARC-PA Standard B3, Element B3.01 a-e"
        competitor_equivalent: >
          eMedley is the only cited competitor whose public material names the concept: its eSchedule
          module is described as "scheduling with site capacity management"
          (../competitors/emedley.yaml line 16), and Elentra as "learner-driven elective selection
          within admin-set capacity rules" (../competitors/elentra.yaml line 14). Both are real
          capacity claims at feature level, so "competitors also cap capacity" is supportable — but
          neither publishes the scoping (location vs. site vs. preceptor), the enforcement strength
          (hard block vs. soft warning), or the cohort semantics, which are exactly the three things
          that make Prism's version distinctive. Comparison stands at concept level only.
        gap_severity: "configure-needed"
        gap_note: >
          The most substantive capacity capability in this stage, and it exists for exactly one
          discipline. Per the PA playbook it is "a discrete, PA-only capability (only available to
          lockstep-based domains — not configurable for non-lockstep clients)" that "caps how many
          students a site can actually accept, independent of how many slots it lists as offered" —
          the worked example being a preceptor who lists 12 monthly slots across a year but caps
          total intake at 7 students (Physician Assistant (PA) Playbook.md lines 323-334).
          Mechanics that matter: the limit is scoped to Location + Setting + Cohort and falls back to
          Location + Cohort when a slot has no Setting; it is NOT available at the site level, only
          the location level; it must be explicitly enabled in Slot Request Configuration or site
          personnel never see the field; and when a rotation is shared across cohorts, "each cohort's
          placement limit stays fully independent of the other's and of the shared-slot consumption."
          Why this belongs in this file rather than a placement-stage file: it is the direct answer
          to the Number of Offers gap above. Number of Offers is what a site SAID; Max Placement
          Limit is what a site will DO, and ARC-PA A1.10 a-b asks for the second — "the number of
          students each site can accommodate." It is also the only element anywhere in this stage
          that intervenes at assignment time at all.
          Rated configure-needed, not none, for three reasons, each documented rather than inferred:
          it is a SOFT cap ("staff can still proceed with the placement despite the warning"), which
          leaves this stage with zero hard gates end to end; it is off unless enabled in Slot Request
          Configuration; and it is PA-and-lockstep-only, so the OT, SW, and SLP programs whose
          accreditors ask materially the same capacity question cannot have it. Note the tension with
          the Preceptor Based sourcing model documented above: PA capacity is often offered BY a
          preceptor, but the cap is enforceable only at Location + Setting + Cohort, so a preceptor
          who works across three locations cannot be capped as a preceptor.
