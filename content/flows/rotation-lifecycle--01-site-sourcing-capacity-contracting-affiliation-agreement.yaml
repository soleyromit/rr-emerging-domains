  - screen: "Placement Clearance Dashboard — Contract Status column"
    navigation_path: "Placements > [Course/Placement Group] > Placement Clearance"
    elements:
      - element: "Contract Status column"
        type: "read-only rollup, computed per student/placement row against the associated Location's contract(s)"
        data_shown: >
          Valid Contract (contract fully executed, active, and valid through the placement dates
          or open-ended) vs. Needs Attention (missing, invalid, or expiring before the placement
          ends); a distinct 'Needs Attention (Missing Contracts)' state when no contract exists
          for the Location; multi-contract Locations get an additional 'multiple contracts
          associated' label and use an at-least-one-valid-contract rule
        gates_on: ["nothing downstream — this is diagnostic display only, confirmed not to block scheduling; see gap_note"]
        accreditation_citation: "COCA Standard 6, Element 6.9; LCME Standard 1, Element 1.4 (required_software_behavior explicitly asks for 'the ability to block new placements at a site whose agreement has lapsed'); ACOTE Standard C.1.5 (agreements in effect through the duration of fieldwork, 'with the result blocking or flagging the placement before it begins'); ACEN Standard 4, Criterion 4.9 (an automated check so 'current' is enforced rather than asserted); CAPTE Standard 2, Element 2D9; CAA Standard 3.0B, Standard 3.9B; COA Standard F.2; CSWE Accreditation Standard 3.3, AS 3.3.4"
        competitor_equivalent: >
          Not comparable at element level — CORE ELMS and eMedley both claim expiration alerting in
          their compliance modules, but neither public source documents whether their own placement/
          scheduling flow enforces a hard block on a lapsed site the way LCME 1.4's
          required_software_behavior asks for, so this cannot be benchmarked competitor-to-competitor
          either, only against the standard's own language.
        gap_severity: "configure-needed"
        gap_note: >
          This element confirms, rather than merely asserts, the journey's "silent failure mode"
          pain point: Contract Status is a diagnostic rollup a coordinator has to go look at, not an
          enforcement gate. Nothing in this column or in the Add Slot flow (next step) blocks a new
          placement from being created against a Location whose contract already shows Needs
          Attention — the status is informational only. LCME 1.4's required_software_behavior
          explicitly names this blocking capability; it is confirmed absent here, not merely
          unconfirmed. The computation itself (per Location, at-least-one-valid rule, expiring-
          before-placement-end detection) is sound — what is missing is enforcement, not logic.
          DISCIPLINE-SPECIFIC (the most consequential correction this extension makes): the existing
          discipline sources describe this column in language stronger than the element-level
          evidence supports, and that discrepancy should not be quietly inherited. The OT playbook
          says the "Placement Clearance Dashboard ... verifies students are placed only at sites with
          active contracts" (Occupational Therapy (OT) Playbook.md line 435); the Nursing playbook
          calls it "the gating checkpoint that consolidates preceptor CV/license/certification
          status, contract validity, and (for CRNA) ACLS/PALS student certifications before a
          placement is finalized" (Nursing Playbook.md line 71); ../accreditation/acote.yaml
          summarises the required behaviour as the result "blocking or flagging the placement before
          it begins" and ../accreditation/nursing.yaml describes ACEN 4.9's test as "computed rather
          than reviewed by hand." All of that is true of the COMPUTATION and false of the
          ENFORCEMENT. Verified against the help-center sources in confirmed_by, nothing on this
          dashboard or in the Add Slot flow prevents a placement being created against a Location
          showing Needs Attention. "Verifies," "gating checkpoint," and "blocking" are therefore
          overstatements of a real and genuinely good diagnostic, and any customer-facing claim
          built on the playbooks' wording would not survive a demo. The accurate claim is: Prism
          computes contract validity against each placement's own dates — which is harder than an
          expiry-date check and more than any competitor source in this repo documents — and then
          shows the result to a human.
          DISCIPLINE-SPECIFIC (OT, compounding): per the 'contract not required' element in the
          first step, OT programs also see known-false Needs Attention rows for sites that
          legitimately require no agreement. A display-only column that a coordinator must scan
          manually AND that emits false positives is the worst combination of the two findings.
          DISCIPLINE-SPECIFIC (CRNA/Nursing): the ACLS/PALS certifications the Nursing playbook
          names here are student compliance items surfaced on the same row (see the compliance-column
          element below), mapping to COA Standard C.5 with D.12, which requires them before a student
          begins clinical activities. Same posture: displayed, not enforced.
          DISCIPLINE-SPECIFIC (SLP): the SLP playbook states affiliation agreements are "stored,
          viewed, and monitored in the Sites module" (Speech-Language Pathology (SLP) Playbook.md
          line 48), which is CAA 3.9B's documented answer and is notably the WEAKER of the two
          claims — "monitored" is exactly right for what this column does, and is the wording other
          disciplines' guides should probably borrow.
      - element: "Requirement Upload Status / Compliance Status columns"
        type: "read-only rollups"
        data_shown: "Student-side document and compliance-item status, run in parallel to Contract Status on the same row"
        gates_on: []
        accreditation_citation: ""
        competitor_equivalent: >
          Not comparable at element level — student compliance rollups exist in CORE ELMS and
          eMedley marketing material, but not at column-level granularity.
        gap_severity: "none"
        gap_note: >
          Student-side, not site-contract evidence — included here only because they share the row
          with Contract Status. They inherit the same display-only posture: informational columns
          on a dashboard, not gates.
          DISCIPLINE-SPECIFIC (CRNA): these are the columns carrying the ACLS and PALS certification
          check the Nursing playbook names as part of CRNA placement clearance (Nursing Playbook.md
          lines 71, 101), which maps to COA Standard C.5 with D.12 — certification required BEFORE
          beginning clinical activities. A pre-condition standard being served by a display-only
          column is the same structural finding as Contract Status, one row over.
          DISCIPLINE-SPECIFIC (Social Work): SW's third-party compliance integrations run through
