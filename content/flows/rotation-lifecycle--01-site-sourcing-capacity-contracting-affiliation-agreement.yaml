          Offers below.
      - element: "Number of Offers"
        type: "input field (mandatory), locked after the slot is edited once a student is placed"
        data_shown: "A single static integer for how many students this slot batch can take"
        gates_on: ["how many students Placement Assist or manual placement can assign against this slot"]
        accreditation_citation: "COCA Standard 6, Element 6.9 (3-year rolling average of students eligible for first-time/repeat/off-cycle rotations matched against demonstrated site capacity)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents a capacity field or
          any rolling-average capacity computation, so it is not knowable whether this gap is
          Prism-specific or category-wide.
        gap_severity: "gap"
        gap_note: >
          This is the field the journey's "no confirmed rolling-average capacity math" hedge was
          about, and this pass does not resolve it — it confirms the hedge is correct. Number of
          Offers is a manually-entered, static per-slot-batch count. Nothing found anywhere in the
          help-center mirror, the discipline playbooks, or capability-map.yaml computes a rolling
          average of students against demonstrated site capacity, or compares that average to
          anything resembling a threshold. COCA 6.9's specific "3-year rolling average... matched
          against demonstrated capacity" evidence would have to be assembled outside Prism today —
          most plausibly by exporting Placement Reports and Slot data and doing the math in a
          spreadsheet, the same workaround the journey's pain_or_gap already describes. Compounding
          this: capacity is added by creating a new slot rather than editing an existing offer
          count, so total demonstrated capacity is itself a sum across slot rows.
          DISCIPLINE-SPECIFIC NUANCE ADDED 2026-08-25 — the hedge survives, but it needs qualifying.
          The eight existing disciplines DO have shipped, standard-mapped reports reading this field:
          PA's SCPE Details (Sites > Reports), Nursing's Slot Sufficiency Report (a Custom report
          under Sites > Reports), PT/PTA's "Number and Variety of Clinical Slots," and PA's
          Distribution of Slots Across Settings / by Location. Those are enumerated as their own
          elements in the new "Sites — discipline-named site & slot sufficiency reports" step below.
          So the corrected claim is narrower and stronger than the original: capacity is REPORTED,
          per discipline, in accreditor-shaped exports — but no report in any discipline computes a
          rolling average, and none returns a sufficiency VERDICT. Every registry reaches the same
          conclusion independently: ../accreditation/arc-pa.yaml ("Sufficiency is asserted by
          eyeballing offered-vs-used per setting in Excel, not computed. No shipped pillar produces
          a pass/fail 'is capacity sufficient for this cohort' verdict"); ../accreditation/
          nursing.yaml on CCNE II-C ("the report shows volume, not a judgment of adequacy against a
          defined threshold"); ../accreditation/coa.yaml on F.1/A.10 ("no shipped report crosses
          site capacity with the Appendix CASE-CATEGORY minimums, which is what F.1's
          'individually' wording actually demands"); ../accreditation/capte.yaml on 2D8 (the
          150%-of-charter-class projection "has no shipped equivalent"). COCA 6.9's rolling-average
          math is therefore not an expansion-domain-specific hole — it is the same missing analytic
          layer twelve disciplines share, which makes it a platform investment rather than a
          go-to-market blocker for any one domain.
      - element: "Supervision Type"
        type: "select on the slot record (Sites > Location > Slots > Supervision Type)"
        data_shown: "The planned student-to-supervisor ratio for this slot batch; the OT value set in production is 1 Student:1 CI, 1 Student:2 CIs, 2 Students:1 CI, 2 Students:2 CIs"
        gates_on: ["nothing confirmed — no source describes the value being validated against actual assignments"]
        accreditation_citation: "ACOTE Standard C.1.7 (fieldwork-educator-to-student ratio must enable proper supervision, protect consumers, permit role modelling and frequent assessment); COA Standard F.7 — CRITICAL (*) (no more than 2 students directly supervised by 1 clinical preceptor AT ANY TIME); ACPE Standard 3, Key Element 3.3.e (2:1 cap, already cited elsewhere in this repo); CCNE Standard II, Key Element II-F (recommended 1:8 faculty-to-student ratio for indirect NP-track supervision)"
        competitor_equivalent: >
          Not comparable at element level — no cited competitor file documents a supervision-ratio
          field on a capacity record. Elentra's Clinical Experience Management module is documented
          as supporting "learner-driven elective selection within admin-set capacity rules"
          (../competitors/elentra.yaml line 14), which is the closest published concept, but a
          capacity rule is not a supervision ratio and the source is not granular enough to tell
          whether Elentra models supervisor load at all.
        gap_severity: "gap"
        gap_note: >
          A first-class field the four-domain baseline of this file never surfaced, and the single
          most important capacity element for two of the eight disciplines. Confirmed by the OT
          playbook twice: as a setup-reference value list, "Supervision Type: 1 Student:1 CI, 1
          Student:2 CIs, 2 Student:1 CI, 2 Student:2 CIs" (Occupational Therapy (OT) Playbook.md
          line 237), and as the named ACOTE C.1.7 mechanism, "Supervision Ratio Tracking (Sites >
          Location > Slots > Supervision Type) — enter/monitor supervision ratio when adding student
          slots," paired with a Placements by Educator report for the realized ratio (line 403).
          The Nursing playbook points CRNA programs at the same place: "Sites -> Slots — for CRNA
          programs, this is where the student-to-preceptor supervision ratio is assigned and
          monitored against COA's hard 2:1 cap (Standard F.7, critical)" (Nursing Playbook.md line
          73).
          RATED A GAP DESPITE THE FIELD EXISTING, for two documented reasons, and the severity is
          driven by CRNA rather than OT. (1) Planned versus realized never reconcile:
          ../accreditation/acote.yaml records that "planned Supervision Type and realized ratio live
          in two different views with no reconciliation, so nothing flags a slot set up as 1:1 that
          actually ran 2:1," and that the Placements by Educator report "explicitly EXCLUDES
          placements with no assigned educator, so a program with incomplete educator assignment
          silently under-reports its own ratios — the denominator quietly shrinks." On that basis
          ACOTE C.1.7 is rated Configure. (2) COA F.7 is rated BUILD in ../accreditation/coa.yaml,
          and the reasoning is the important part: "The unit of enforcement is preceptor-shift, not
          placement," requiring per-clinical-day records of which named CRNA or anesthesiologist is
          responsible for which students, an OBSERVED concurrent ratio computed from that assignment
          data "rather than trusting a declared slot capacity number," a hard warn when a third
          student would land on the same preceptor the same day, and a structured exception record
          (date, reason, contingency action, approver) because COA permits brief exceedance only
          with documented justification. A slot-level Supervision Type select is a DECLARATION about
          a batch; F.7 asks a question about a shift. The field cannot answer it, and F.7 is
          asterisked critical — failure is treated as a matter of critical concern in the
          accreditation decision. This is the clearest example in this stage of a capability that
          reads as parity on a feature grid and is not parity against the standard.
