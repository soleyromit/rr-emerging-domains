        gap_severity: "none"
        gap_note: >
          Capacity in the eight existing disciplines is not a plain integer — it is an integer plus
          the terms attached to it, and this select is where the terms live. Confirmed in the OT
          playbook's setup reference: "Slot Type: FCFS, Resume Required, Interview Required, Must Be
