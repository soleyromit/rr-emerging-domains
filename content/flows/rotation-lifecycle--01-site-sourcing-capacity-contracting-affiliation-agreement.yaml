        gates_on: ["Contract Status computation on the Placement Clearance Dashboard (see later step)"]
        accreditation_citation: "COCA Standard 6, Element 6.9 (executed affiliation agreement per contracted clinical site); LCME Standard 1, Element 1.4; CAPTE Standard 2, Element 2D9 (agreements must be CURRENT); ACOTE Standard C.1.5 (valid agreements 'in effect prior to the onset and through the duration' of fieldwork); ACEN Standard 4, Criterion 4.9 (current written agreements); COA Standard F.2 with Standard A.3; CAA Standard 3.0B, Standard 3.9B; CAEP Standard R2, Component R2.1 (MOU term/expiry)"
        competitor_equivalent: >
          The closest element-level parity claim in this flow. CORE ELMS's "affiliation agreement
          tracking with expiration alerts" (../competitors/core-elms.yaml) and eMedley's eKeeper
          (../competitors/emedley.yaml) both imply a stored expiration date, so "both track a
          contract record with an expiration date" is supportable — but neither publishes the
          field-level view needed to confirm mandatory-vs-optional, date semantics, or open-ended
          handling. That framing gets sharper, not weaker, for the eight existing disciplines: CORE
          ELMS sells the identical compliance module into nursing/PT/OT/PA/social work
          (../competitors/core-elms.yaml lines 27, 113-114), so the differentiator cannot be "we
          track expiry" — it has to be the placement-date-relative evaluation described below, which
          no competitor source in this repo documents either way.
        gap_severity: "none"
        gap_note: >
          Mandatory, and the input that everything downstream in this flow computes from: the
          Contract Status rollup, the "valid through the placement dates or open-ended" rule, and
          the Auto Notification lead-time all read this window.
          DISCIPLINE-SPECIFIC (why the date pair, not the alert, is the real claim): five of the
          eight existing disciplines' accreditors ask for a test that a calendar expiry date cannot
          answer. ACOTE C.1.5 requires agreements "in effect prior to the onset and through the
          duration" of fieldwork; ACEN 4.9 requires them "CURRENT" per environment; COA F.2 wants
          validity checked so "a placement extending past a contract's expiry is caught before
          students are on site rather than at audit"; CAA 3.9B wants "automated validity checking
          against actual placement date ranges (not just an expiry date on a calendar)"; CAPTE 2D9
