        gap_severity: "cosmetic"
        gap_note: >
          Destructive-by-checkbox: checking it silently drops prior group assignments for
          every selected faculty member. The transcript describes the behavior clearly but
          no undo, preview of affected assignments, or confirmation dialog is mentioned.

  - screen: "Faculty Compliance – Setup: Auto Notification scheduler"
    navigation_path: "Faculty Compliance > Setup > Auto Notification > Add Notification"
    action: >
      The admin creates one or more scheduled reminder campaigns for faculty, choosing
      frequency, date window, and which requirements each campaign covers — then can later
      deactivate, edit, or delete them.
    confirmed_by: >
      exxat_transcripts.md, section "Setting Up and Reviewing
      Faculty Compliance", lines 1957-1961 ("documents marked with statuses such as Get
      started, in progress, not approved, expiring, or expired will require an action from
      the faculty member... navigate to the setup section and click on the auto notification
      section... click on the add notification button... provide a title and description...
      enter a start date... select the frequency... For example, if you would like the
      notifications to be sent once a week on Mondays, select the one option, then week
      option, then select the Monday option. Lastly, provide an end date... select the
      requirements you would like to send notifications for... click on the create
      notification button. If you would like to deactivate a previously configured
      notification instance, deactivate the corresponding bit... trash bin icon... pencil
      icon").
    elements:
      - element: "Add Notification: Title + Description"
        type: "input field"
        data_shown: "Names a distinct notification campaign — multiple campaigns can coexist"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Frequency builder (every N + day/week + specific weekday) with Start and End dates"
        type: "input field"
        data_shown: "Arbitrary recurrence schedule, e.g. weekly on Mondays"
        gates_on: ["Cadence of faculty reminders"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          e-Value/MedHub (content/competitors/e-value.yaml, medhub.yaml) claim "automated
          alerts for expiring credentials" and "auto-alerts for late" items, but no
          competitor public source describes an admin-defined recurrence schedule. Not
          documented at this granularity by any competitor teardown in this research.
        gap_severity: "none"
        gap_note: >
          Strictly more capable than the student-side equivalent, which is fixed weekly with
          a single irreversible enable (step 6). Same product, two different notification
          engines with different power and different reversibility — the clearest internal
          inconsistency this stage exposes.
      - element: "Requirement selection step (searchable multi-select)"
        type: "input field"
        data_shown: "Which faculty requirements this campaign nags about"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Per-campaign requirement scoping has no student-side equivalent — student
          auto-notifications cover all enabled documents wholesale.
      - element: "Summary + Create Notification button"
        type: "button"
        data_shown: "Review of the configured campaign before commit"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Deactivate bit / pencil (edit) / trash bin (delete) on an existing campaign"
        type: "toggle"
        data_shown: "Full lifecycle control over a configured notification"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Faculty notifications are fully reversible in-product; student notifications
          require prism-support@exat.com to disable (step 6). Worth calling out explicitly in
          any onboarding checklist.

  - screen: "Vendor-gated setup requests (prism-support@exxat.com / Exxat Approve)"
    navigation_path: "Off-platform — email prism-support@exxat.com; Approve is a contracted service line"
    action: >
      The admin submits the setup decisions that cannot be self-served: marking specific
      documents sensitive (with the stakeholder hide-list), enabling one-time-password
      protection on externally shared compliance information, and — separately — contracting
      the Exxat Approve review service that Guidelines for Reviewers, Review Clarifications
      and the whole Faculty Compliance module depend on.
    confirmed_by: >
      exxat_transcripts.md, section "4/16 Managing Student
      Compliance in Exxat Prism", lines 289-293 ("we offer the ability to protect student
      compliance information sent within shared student profiles and when emailing compliance
      information to experiential supervisors... please reach out to our support team at
      prism-support@exat.com... they will be met with a screen asking them to enter the
      one-time password sent to their school email address"; "You will not be able to mark a
      document sensitive. If you would like to make a document sensitive, contact
      prism-support@exat.com and provide the name of the document... and the stakeholders you
      would like to hide the document from"), line 297 (disabling auto-notifications requires
      support), line 313 (Review Clarifications is an Approve-services surface), and section
      "Setting Up and Reviewing Faculty Compliance", line 1935 (Approve required for faculty
      compliance).
    elements:
      - element: "Sensitive-document request (document name + stakeholders to hide from)"
        type: "input field"
        data_shown: "Off-platform ticket contents; the resulting flag is read-only in the product"
        gates_on: ["Who can view the uploaded document", "Exclusion of the document from student downloads and bulk downloads"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          No competitor teardown in this research documents per-document visibility
          restrictions. The nearest competitor claims are platform-wide security posture
          rather than per-item: CORE ELMS "HIPAA-compliant environment"
          (content/competitors/core-elms.yaml), MedHub "FERPA compliance, SOC 2 compliance"
          (content/competitors/medhub.yaml), Elentra SOC 2 Type 2 / TX-RAMP
          (content/competitors/elentra.yaml). Different granularity entirely — not comparable
          element-for-element.
        gap_severity: "gap"
        gap_note: >
          A privacy-critical configuration with no admin UI at all. On a day-one setup the
          admin must anticipate which items are sensitive BEFORE publish, then wait on a
          vendor turnaround they cannot see or track in-product.
      - element: "One-time-password protection for externally shared compliance information"
        type: "toggle"
        data_shown: "Support-enabled tenant setting; the external recipient then verifies via an OTP emailed to the same address the link was sent to"
        gates_on: ["Security of every profile-share and every compliance email to an experiential supervisor", "Interacts with the per-requirement 'available in the shared profile link' toggle from step 3"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research —
          no competitor file describes an OTP-gated external view of student compliance
          records.
        gap_severity: "gap"
        gap_note: >
          Real differentiator, invisible by default: an admin who never emails support ships
          a tenant where shared compliance links are unauthenticated. Nothing in the Setup
          tab surfaces the setting's existence or current state.
      - element: "Exxat Approve service contract"
        type: "read-only rollup"
        data_shown: "Whether third-party document review is part of the tenant's services"
        gates_on: ["Guidelines for Reviewers (step 3)", "Review Clarifications thread on each document", "The entire Faculty Compliance module (step 8)", "Whether admins or the Approve team perform review at all"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Unique in this competitive set: none of the nine teardowns in content/competitors/
          documents an outsourced human document-review service. CORE ELMS, eMedley, New
          Innovations, e-Value/MedHub all sell software-only tracking; Elentra, one45,
          LEO/DaVinci and axiUm have no dedicated compliance-item module at all per their
          files. The honest comparison is that there is nothing to compare to.
        gap_severity: "none"
        gap_note: >
          Commercially the strongest asset in this stage and the least visible during
          onboarding: the transcript frames the alternative plainly — "If you are currently
          not signed up for our EXAT Approved service, program administrators and staff
          responsible for overseeing compliance will need to review the student's compliance
          documents" (line 271).

  - screen: "Institution-level Compliance Management (multi-program tenants)"
    navigation_path: "Institution Administrator tile > Compliance Management > Setup tab (Requirements / Auto-Notifications / Student Specific Due Date)"
    action: >
      On a tenant hosting several programs, the institutional administrator reviews — and
      can edit — the requirements, auto-notification schedules, and student-specific due
      dates defined by each individual program, plus a cross-program student status table.
    confirmed_by: >
      Not covered anywhere in exxat_transcripts.md — the 16-part
      admin tutorial series is written from a single-program administrator's seat and never
      shows the institution tile. Confirmed by
      PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Institutional Users/Step-by-Step Guides (How-tos)/Institution Level- Compliance
      Management.md (steps 1-9).
    elements:
      - element: "Cross-program student compliance table (student, program, cohort, per-item status) with funnel filter, wrench column editor, Export"
        type: "read-only rollup"
        data_shown: "Every student across every program on the tenant with current status for all compliance items"
        gates_on: []
        accreditation_citation: >
          none directly. Worth stating precisely because a reader will expect one: this
          screen carries no accreditor field, no standard mapping, and no evidence-binder
          semantics. The precedent for accreditation-aware records in this corpus is the
          Program Details > Accreditation record analyzed in
          ../flows/competency-verification--08-close-the-loop-external-validation-against.yaml
          (COCA Standard 11 Element 11.9 partial, CODA Standard 1 Element 1-2 background) —
          a different screen entirely, and even there it is rated a partial/status-only fit.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research.
          CORE ELMS's compliance module is described as institution-usable for
          "accreditation and audits" (content/competitors/core-elms.yaml) but no competitor
          source describes a distinct institution-vs-program administrative tier for
          compliance oversight.
        gap_severity: "none"
        gap_note: >
          For expansion-domain buyers this is a real day-one selling point (a dental school
          with predoc + hygiene + assisting programs, or an academic health center running
          MD and DO tracks), but it is undiscoverable from the tutorial corpus — no video
          covers it.
      - element: "Setup > Requirements (view and edit each program's per-cohort requirements)"
        type: "input field"
        data_shown: "The same requirement configuration from step 2/3, exposed across programs"
        gates_on: ["Institutional ability to enforce a common baseline across programs"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          The help guide says the institutional user can "see and edit the requirements
          defined by each program," but nothing documents a push-down/inherit model — an
          institution cannot define a mandatory baseline that programs inherit; it can only
          edit each program's configuration after the fact. For a multi-program day-one
          rollout that is the difference between one setup and N setups.
      - element: "Setup > Auto-Notifications (view/edit each program's notification config)"
        type: "input field"
        data_shown: "Per-program, per-cohort auto-notification settings"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          Unresolved against the transcript: student auto-notifications cannot be disabled by
          a program admin without support (line 297), yet this screen claims institutional
          edit rights over the same settings. Whether institutional users can actually
          reverse the toggle is unconfirmed in both sources.
      - element: "Setup > Student Specific Due Date (view/edit per-student due-date exceptions)"
        type: "input field"
        data_shown: "Individual due-date overrides set by each program"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Operational rather than setup-time; included because it is a Setup-tab surface the institutional admin inherits on day one."
      - element: "'Review Clarifications' and 'Approve' tabs"
        type: "read-only rollup"
        data_shown: "Present only when the tenant is signed up for Exxat's Approve service"
        gates_on: ["Institutional visibility into third-party review threads"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "No competitor teardown in this research documents a third-party review service, so no equivalent exists."
        gap_severity: "none"
        gap_note: >
          Same commercial gate as steps 3 and 8, reappearing a third time at the institutional
          tier — Approve is the hidden spine of this whole stage.

