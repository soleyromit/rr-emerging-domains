# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 4
# ("4. Compliance template setup").
#
# SCHEMA v2: accreditation_citation / competitor_equivalent / gap_severity / gap_note
# live on each ELEMENT, not on the step.
#
# SOURCING NOTE (deliberate, and the point of this file): every step below is
# confirmed_by the raw admin tutorial transcript at
# exxat_transcripts.md with a section title and line
# range, NOT by a help-center paraphrase of that transcript. Help-center guides are
# cited only where they document something the transcript does not narrate at all
# (External Trainings / ComplianceJunction vendor fields; the institution-level
# Compliance Management screen; the enumerated auto-notification trigger list).
#
# SCOPE NOTE: this is DAY-ONE PRODUCT SETUP — the admin building the compliance
# scaffolding before any student or faculty member has uploaded anything. Reviewing
# uploaded documents, the Placement Clearance gate, and per-student due-date
# exceptions belong to rotation-lifecycle.yaml stage 3
# (../flows/rotation-lifecycle--03-student-readiness-compliance-clearance-pre-rotation.yaml),
# not here. Where the same screen serves both, only the setup-time elements are
# modeled below.
flow_name: "Compliance Template Setup"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 4"
persona: >
  Primary: Program Administrator new to Prism (../personas/role-program-admin.yaml),
  doing first-time configuration of the Student Compliance and Faculty Compliance
  sections for a brand-new tenant. Secondary: Compliance / Accreditation Liaison
  (../personas/role-compliance-accreditation-liaison.yaml), who owns which items are
  mandatory and what the item taxonomy must contain; Institutional Administrator, on
  multi-program tenants, who reviews and can edit each program's requirements from the
  institution-level Compliance Management section; and two off-platform actors the
  setup genuinely depends on — the Exxat Approve review team (third-party document
  review) and prism-support@exxat.com, who alone can toggle sensitive-document
  protection, external-share OTP protection, and the disabling of auto-notifications.
  Students and faculty are downstream recipients here, not actors — nothing in this
  stage is visible to them until Publish.

steps:
  - screen: "Student Compliance – Setup tab: cohort selection and template application"
    navigation_path: "Dashboard (or hamburger menu) > Student Compliance > Setup tab > Cohort dropdown > Select Template dropdown"
    action: >
      The new admin picks the first cohort to configure, then decides the single most
      consequential thing in this stage: copy an existing cohort's compliance
      configuration via a template, or select None and build from scratch. On a day-one
      tenant there is by definition no prior cohort to copy from, so the first cohort is
      always built from scratch and thereafter becomes the template for every later
      cohort. Apply Template is confirmed once and cannot be re-applied to that cohort.
    confirmed_by: >
      exxat_transcripts.md, section "4/16 Managing Student
      Compliance in Exxat Prism", lines 275-279 ("To set up student compliance documents,
      click on the Student Compliance section on your dashboard, then click on the Setup
      tab. You will first need to select a cohort... A template is a pre-saved
      configuration of compliance documentation... These templates allow you to copy the
      compliance setup from one cohort to another... If this is the first cohort you are
      setting up with compliance documentation, you will need to start from scratch").
      One-way-door behavior of Apply Template ("You will not be able to apply a new
      template as a starting point for the selected Cohort's compliance setup once
      confirmed") is documented only in the help center:
      PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Student Compliance/Setup
      Student Compliance Section.md, "Select a Template to Copy From", step 5 Note.
    elements:
      - element: "Cohort dropdown"
        type: "input field"
        data_shown: "Cohorts previously created in Students > Setup > Cohort; compliance configuration is scoped per cohort, never program-wide"
        gates_on: ["Every other element on this screen — no requirement can be configured until a cohort is chosen", "Stage 2 of this journey (cohort/group creation) must be complete first"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research.
          content/competitors/core-elms.yaml, emedley.yaml, medhub.yaml and
          new-innovations.yaml all document compliance-item tracking as a capability, but
          none of their public sources state the scoping unit (cohort vs. program vs.
          student) for compliance configuration.
        gap_severity: "none"
        gap_note: >
          Worth naming for onboarding sequencing rather than as a product gap: cohort is a
          hard prerequisite, and per
          exxat_transcripts.md section "2/16 Setting up
          Students in Exxat Prism" line 81, groups within a cohort exist partly because "a
          group of students have additional compliance requirements" — but the Setup tab
          confirmed in this step selects a COHORT, not a group. Whether group-level
          differential requirements are actually configurable here is unconfirmed by the
          transcript.
      - element: "Select Template dropdown"
        type: "input field"
        data_shown: "Existing cohort compliance configurations available to copy, or None to build from scratch"
        gates_on: ["Whether the admin does a 10-minute copy or a multi-hour from-scratch build"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research —
          no competitor file in content/competitors/ describes a copy-forward template
          mechanism for compliance configuration.
        gap_severity: "none"
        gap_note: >
          Real day-one asymmetry rather than a defect: the template mechanism only pays
          off from the second cohort onward. A brand-new tenant's first admin gets zero
          benefit from it and no starter taxonomy — contrast the Faculty Compliance side
          (step 8), which ships pre-populated with commonly used requirements.
      - element: "Template preview status indicators (green check = activated, green star = mandatory, green review icon = requires review on upload, green share icon = shareable via share-profile)"
        type: "read-only rollup"
        data_shown: "Per-requirement preview of how each item will be configured if the template is applied, before committing"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Eye icon (per-requirement template detail preview)"
        type: "button"
        data_shown: "Full configuration of one individual compliance document inside the template being previewed"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Apply Template button (+ Confirm)"
        type: "button"
        data_shown: ""
        gates_on: ["Locks the template choice for this cohort — a different template cannot later be applied as a starting point"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          The irreversibility is real and is a classic new-admin trap, but it is disclosed
          only in the help-center note, not in the tutorial narration — the transcript
          reassures the opposite way ("Remember, you can change the way these compliance
          requirements are set up after applying the template", line 277), which is true of
          individual requirements but not of the template choice itself.

  - screen: "Student Compliance – Setup tab: category and requirement scaffolding"
    navigation_path: "Student Compliance > Setup tab > [cohort] > Add New Category / + icon on a category / Add a Requirement"
    action: >
      The admin builds the item taxonomy: adds categories, adds requirements inside
      categories, deletes requirements that do not apply to this program, and saves.
      This is the step where a discipline's actual compliance list (immunizations,
      background check, drug screen, liability insurance, licensure, attestations) gets
      typed in.
    confirmed_by: >
      exxat_transcripts.md, section "4/16 Managing Student
      Compliance in Exxat Prism", lines 279-281 ("If you would like to add a new
      compliance category, click on the Add New Category button. You can then provide the
      category with a name and add requirements to this new category... If you would like
      to delete any requirements, you can use the trash bin icon... To add new compliance
      documents to an existing category, click on the plus icon to the right of a category
      name... If you would like to add multiple requirements at one time, click on the Add
      a Requirement button... Once you are done, click the Save button"). The named default
      category set is not enumerated in the transcript; it is confirmed by
      PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Student Compliance/Setup
      Student Compliance Section.md, "Compliance Requirement Categories".
    elements:
      - element: "Add New Category button (name + initial requirements)"
        type: "button"
        data_shown: "Creates a new admin-defined grouping alongside the shipped categories (Health & Immunization, Certifications & Training, Verification / Identity Documents, Insurance & Liability, Memberships & Licensure, Attestations, Additional Documents)"
        gates_on: ["How requirements are grouped in every downstream student view, Summary table, and export"]
        accreditation_citation: >
          COCA Standard 5, Element 5.4 (../accreditation/coca.yaml lines 124-141) — the
          shipped "Attestations" category is the only place a supervision-policy
          acknowledgment item could live, and coca.yaml's own open question is precisely
          "Confirm Compliance Management supports document-acknowledgment item types, not
          just checklist/expiry items."
        competitor_equivalent: >
          eMedley (content/competitors/emedley.yaml, "Compliance Management" pillar) is the
          only competitor whose public docs enumerate a document taxonomy at all (MMR,
          Hepatitis, flu, PPD, Varicella, BLS/CPR/HIPAA, licenses), but that is a fixed
          vendor-defined list; nothing in emedley.yaml describes admin-created categories.
          Whether any competitor lets the admin invent a new category is not documented at
          this granularity by any competitor teardown in this research.
        gap_severity: "configure-needed"
        gap_note: >
          Mechanism ships; content does not. For the four expansion domains
          (DO/Medicine/Pharmacy/Dentistry) there is no seeded category set or requirement
          list anywhere in the corpus — the OT/PT playbooks supply a real starter taxonomy
          for their disciplines, the expansion domains have none.
      - element: "+ icon on an existing category (add single requirement, free-text name)"
        type: "input field"
        data_shown: "New requirement name inside the chosen category"
        gates_on: ["Whether the item exists at all for this cohort"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          Free-text naming means the requirement label is whatever the admin types, with no
          controlled vocabulary — so two cohorts (or two programs on one tenant) can end up
          with 'Hep B' and 'Hepatitis B (HepB)' as different objects. Nothing in the
          transcript describes a rename or merge path after the fact; line 281 confirms the
          opposite ("You will not be able to change the name of the compliance
          requirement", alias only).
      - element: "Add a Requirement button (bulk add multiple requirements at once)"
        type: "button"
        data_shown: "Multiple requirement names entered in one pass"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Trash bin icon (delete requirement)"
        type: "button"
        data_shown: ""
        gates_on: ["Removes the item from the cohort's configuration before publish"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          The transcript does not state what happens if a requirement is deleted after
          publish and after students have uploaded against it — it only says (line 295)
          that after publishing "there will be some configurations of specific documents
          which you will not be able to change," without enumerating which. Unconfirmed,
          and a question a day-one admin will hit.
      - element: "Save button"
        type: "button"
        data_shown: ""
        gates_on: ["Persists the category/requirement scaffolding; distinct from Publish, which is what exposes it to students"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Student Compliance – individual requirement configuration drawer (pencil icon)"
    navigation_path: "Student Compliance > Setup tab > [cohort] > [requirement] > pencil icon"
    action: >
      The admin configures one requirement in full: naming, activation, how much detail to
      collect, the expiration model, whether it is mandatory, whether it is reviewed,
      whether it can be shared externally, its due date, guidance text, and any
      downloadable template or sample. This drawer is repeated once per requirement — it
      is the bulk of the labor in this stage.
    confirmed_by: >
      exxat_transcripts.md, section "4/16 Managing Student
      Compliance in Exxat Prism", lines 281-293 (alias/short name, Enabled bit,
      detailed vs. simplified collection, start/expiration date checkboxes and aliases, up
      to two additional questions, Expires Automatically In / Expires Automatically On,
      Expiry Renews in Days, mandatory / shared-profile / review toggles, the sensitive
      flag and its support-only path, due date, Guidelines for Students, Guidelines for
      Reviewers, Template and Sample uploads, Save at top of page).
    elements:
      - element: "Alias Name and Short Name fields (original requirement name is immutable)"
        type: "input field"
        data_shown: "Display name shown to students in lieu of the system requirement name, plus a short label used in the compliance section"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          Transcript line 281 is explicit: "You will not be able to change the name of the
          compliance requirement, but you can set an alias name for it." So the underlying
          name typed in step 2 is permanent, and every downstream correction is a display
          alias layered over it — fine for one cohort, brittle for a tenant that will run
          this for a decade.
      - element: "Enabled bit (activate/deactivate the requirement)"
        type: "toggle"
        data_shown: "Whether this requirement is live for the cohort; the green vs. grey check indicator in the list reflects it"
        gates_on: ["Student visibility of the item", "Inclusion in auto-notifications — the help center confirms only enabled documents are included"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Detailed vs. Simplified collection selector"
        type: "toggle"
        data_shown: "Simplified collects only a start date and end date plus the document; Detailed opens document-type-specific sub-fields (the transcript demonstrates with COVID-19 vaccine)"
        gates_on: ["Which sub-fields and expiration options appear below it"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Closest is CORE ELMS (content/competitors/core-elms.yaml, "Compliance Management",
          rated at-parity) which publicly claims immunization/CPR/background-check/drug-check/
          HIPAA/licensing tracking with automated expiration reminders — but the public
          source does not describe a per-requirement detail-level switch, so this is not
          documented at this granularity by any competitor teardown in this research.
        gap_severity: "none"
        gap_note: >
          Transcript line 283 flags that available options "may vary depending on how each
          compliance document is configured" — i.e. the sub-field set is vendor-defined per
          document type, so a program cannot invent arbitrary structured fields, only up to
          two free-text questions (see next element).
      - element: "Start Date / Expiration Date checkboxes with Alias Name fields"
        type: "input field"
        data_shown: "Whether the student is asked for each date, and under what label"
        gates_on: ["Expiring/Expired statuses downstream", "The Expires Automatically In calculation"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "'Do you want to collect other details?' — up to two additional free-text questions"
        type: "input field"
        data_shown: "Program-authored questions asked alongside the uploaded document"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Hard cap of two, confirmed verbatim at line 285 ("It is possible to add up to two
          additional questions"), and they are free-text, not structured/filterable. Any
          program needing more than two structured attributes on a compliance item (e.g. a
          dentistry program capturing both a fit-test type and a respirator model and a
          date, or a DO program capturing an attestation version) has no configuration path
          — it becomes a support request or a workaround requirement.
      - element: "Expiration model: student-entered date | 'Expires Automatically In' (N days after start date) | 'Expires Automatically On' (fixed date)"
        type: "input field"
        data_shown: "How the expiration date for this item is derived"
        gates_on: ["Expiring / Expired statuses, which in turn drive auto-notifications (step 6) and the Expiring or expired requirements report"]
        accreditation_citation: >
          none directly. Adjacent but explicitly NOT this element: CODA Standard 4, Element
          4-6 and ACPE Standard 3, Key Element 3.5.b (../accreditation/coda.yaml lines
          215-234, ../accreditation/acpe.yaml lines 65-73) need expiry tracking on SITE
          affiliation agreements; coda.yaml's own gap_note says "Site-level (vs.
          student-level) compliance item tracking is unconfirmed," and this drawer confirms
          the mechanism exists only on student-level items.
        competitor_equivalent: >
          CORE ELMS (content/competitors/core-elms.yaml) and eMedley
          (content/competitors/emedley.yaml) both publicly claim "automated expiration
          reminders"/"automated expiration notifications", and New Innovations
          (content/competitors/new-innovations.yaml, Credentialling Module, rated ahead)
          claims "expiration alerts" for licenses/certifications/visas/immunizations —
          but none of their public sources describe a configurable derivation rule
          (start-date + N days vs. fixed date). At the rule level this is not documented at
          this granularity by any competitor teardown in this research.
        gap_severity: "none"
        gap_note: ""
      - element: "Expiry Renews in Days field"
        type: "input field"
        data_shown: "Number of days past expiration a newly uploaded replacement document is valid for (transcript example: 365)"
        gates_on: ["Prevents a fresh upload near expiry from immediately entering Expiring status"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research —
          no competitor file describes renewal-window behavior on re-upload at all. This is
          the most differentiated single field in the whole stage and the hardest to
          discover.
        gap_severity: "none"
        gap_note: >
          Genuinely subtle, and a new admin will not know to set it. Leaving it blank
          produces a specific, confusing downstream symptom the transcript names outright
          (line 287): documents uploaded near expiry drop straight into Expiring status.
      - element: "Mandatory toggle"
        type: "toggle"
        data_shown: "Whether this item is required (green star indicator) or optional (grey)"
        gates_on: ["Non-compliant status rollups", "Auto-notification inclusion — mandatory items in Get Started / In Progress trigger notifications", "Placement Clearance downstream (see rotation-lifecycle stage 3)"]
        accreditation_citation: >
          COCA Standard 5, Element 5.4 (../accreditation/coca.yaml lines 124-141) — for an
          attestation item, Mandatory is the field that turns "policy published" into
          "distribution to each student proven," which is the evidence COCA 5.4 asks for.
          coca.yaml already rates this pattern prism_fit "Configure" for exactly this
          reason.
        competitor_equivalent: >
          No competitor teardown in content/competitors/ documents a per-item
          mandatory/optional switch. eMedley's file explicitly notes the opposite kind of
          uncertainty — whether its compliance items GATE anything "is not stated on
          eMedley's public pages." Not documented at this granularity by any competitor
          teardown in this research.
        gap_severity: "none"
        gap_note: ""
      - element: "'Available in the shared profile link' toggle (green share icon)"
        type: "toggle"
        data_shown: "Whether this document is exposed when a student shares their profile link with a site/agency"
        gates_on: ["What a site contact can see via Profile Share", "What the OTP-protected external view exposes"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research.
          e-Value/MedHub (content/competitors/e-value.yaml, medhub.yaml) document
          credentials monitoring and FERPA/SOC 2 posture, but no competitor file describes
          a per-document external-sharing switch.
        gap_severity: "none"
        gap_note: >
          This is a privacy control that a new admin will treat as a convenience toggle.
          The Social Work playbook
          (PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
          Work (SW) Playbook.md, "Compliance") independently flags the same field as
          "a privacy control worth flagging to admins configuring compliance categories."
      - element: "'Requires review' toggle (green review icon)"
        type: "toggle"
        data_shown: "Whether an uploaded document enters Pending Review rather than auto-satisfying the requirement"
        gates_on: ["Whether the item ever reaches the admin's (or the Approve team's) review queue"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          eMedley (content/competitors/emedley.yaml) is the one competitor whose public docs
          name the equivalent choice — "manual or auto-approval workflows" — so this is a
          genuine element-for-element match: eMedley's auto-approval ≈ this toggle off,
          manual ≈ on. Depth beyond that (who reviews, reason codes) is not public.
        gap_severity: "none"
        gap_note: ""
      - element: "Sensitive-document indicator (read-only to the admin)"
        type: "read-only rollup"
        data_shown: "Whether a document is restricted so only specific stakeholders can view it; excluded from download"
        gates_on: ["Visibility of the uploaded document to faculty/site stakeholders", "Exclusion from bulk download"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Explicitly not self-serve: "You will not be able to mark a document sensitive. If
          you would like to make a document sensitive, contact prism-support@exat.com and
          provide the name of the document you would like to make sensitive and the
          stakeholders you would like to hide the document from" (transcript line 291). For
          a day-one setup this means the privacy design of the compliance taxonomy is a
          vendor ticket with an unknown turnaround, sitting on the critical path before
          Publish.
      - element: "Due Date picker"
        type: "input field"
        data_shown: "Cohort-level due date for this requirement (later overridable per student)"
        gates_on: ["Red calendar icon on the Summary table when passed", "Past-due auto-notification triggers"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Guidelines for Students text area"
        type: "input field"
        data_shown: "Program-authored instructions shown to the student on the requirement"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Guidelines for Reviewers text area"
        type: "input field"
        data_shown: "Instructions to the Exxat Approve review team on what makes this document acceptable"
        gates_on: ["Only meaningful if the program has purchased the Approve service"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: >
          No competitor in content/competitors/ documents an outsourced human
          document-review service at all, at any granularity — the closest analogues
          (CORE ELMS, eMedley, New Innovations) all describe software-only tracking. This
          field has no competitor equivalent to compare against, which is itself the
          finding.
        gap_severity: "none"
        gap_note: >
          Load-bearing for the Approve upsell: the quality of third-party review is a direct
          function of whether the day-one admin fills this in per requirement, and the
          transcript gates it on the service ("If you are using the EXAT Approve service",
          line 293).
      - element: "Template upload (Browse to Upload) and Sample upload"
        type: "input field"
        data_shown: "A blank form the student downloads, completes and re-uploads; and an example of a correctly completed submission"
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Save button (top of page)"
        type: "button"
        data_shown: ""
        gates_on: []
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  - screen: "Student Compliance – Setup tab: External Trainings (third-party vendor requirements)"
    navigation_path: "Student Compliance > Setup tab > [cohort] > External Trainings > pencil icon (e.g. HIPAA Training)"
    action: >
      The admin wires a vendor-delivered training in as a compliance requirement, so
      completion syncs back into Prism as a status rather than being tracked in a
      separate system. Configured per cohort, then published like any other requirement.
    confirmed_by: >
      Not narrated in exxat_transcripts.md — the 4/16 tutorial
      covers upload-based requirements only and never mentions External Trainings or a
      vendor integration. Confirmed instead by
      PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Student Compliance/Setup
      HIPAA Training for Students by ComplianceJunction.md (steps 4-8), with the
      discipline-side confirmation of which vendors are in play in
      PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Social
