      page, then toggle the Enable Auto Notifications option. Please note that once you
      enable auto-notifications, you will not be able to disable them on your own... You
      will then need to enter an end date... toggle the Disable Notifications for Optional
      Requirements bit"). The enumerated trigger list (Not Approved / Expiring / Expired /
      Past Due Date / Past Follow-up Date) and the "only enabled documents, only active
      students" constraints come from
      PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/Help
      for Program Administrators/Step-by-Step Guides (How-tos)/Student Compliance/Setup
      Student Compliance Section.md, "Set Up Auto-Notifications".
