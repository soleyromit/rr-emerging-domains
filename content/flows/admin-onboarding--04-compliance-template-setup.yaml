  - screen: "Student Compliance – Setup tab: Publish"
    navigation_path: "Student Compliance > Setup tab > [cohort] > Publish (and confirm)"
    action: >
      The admin publishes the finished configuration to every student in the cohort. This
      is the moment the stage's work becomes visible outside the admin's screen, and the
      moment some configuration choices become permanent.
    confirmed_by: >
      exxat_transcripts.md, section "4/16 Managing Student
      Compliance in Exxat Prism", line 295 ("Once you have completely configured your
      compliance requirements for this cohort, click on the Publish button. This will
      publish this set of documents to all the students within the selected cohort. After
      you have published compliance documents for a cohort, you can still make some changes
      to the published documents. However, there will be some configurations of specific
      documents which you will not be able to change").
    elements:
      - element: "Publish button"
        type: "button"
        data_shown: ""
        gates_on: ["Student visibility of every requirement configured in steps 2-4", "All downstream status, notification, review and reporting behavior"]
        accreditation_citation: >
          COCA Standard 5, Element 5.4 (../accreditation/coca.yaml lines 124-141) —
          publication is the act that makes an attestation item distributable to each
          student, which is the "proof those policies are distributed" half of the element.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research —
          no competitor file describes a draft/publish boundary on compliance configuration.
        gap_severity: "none"
        gap_note: ""
      - element: "Post-publish immutability (unnamed subset of configurations)"
        type: "read-only rollup"
        data_shown: "Which per-document settings are frozen after publish is never enumerated on-screen or in the tutorial"
        gates_on: ["Whether a configuration error found after publish is fixable in-product or becomes a support ticket"]
        accreditation_citation: "none, this is a platform-mechanics element with no direct accreditor tie"
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          The single largest day-one risk in this stage: a new admin is told some settings
          become uneditable at publish but is told neither which ones nor where to see
          them. Combined with the immutable requirement name (step 3) and the one-shot
          template application (step 1), a first cohort configured wrong is expensive to
          unwind.

