          notifications"), New Innovations ("expiration alerts"), and e-Value/MedHub
          ("automated alerts for expiring credentials", "auto-alerts for late...")
          — content/competitors/core-elms.yaml, emedley.yaml, new-innovations.yaml,
          e-value.yaml, medhub.yaml — all publicly claim automated compliance reminders, so
          the capability is at parity and commoditized. None of their sources describe the
