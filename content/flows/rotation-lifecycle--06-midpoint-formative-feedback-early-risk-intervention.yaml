# Element-level ground truth underneath rotation-lifecycle.yaml, stage 6.
# See _TEMPLATE.yaml for field meanings (SCHEMA v2: analysis fields live on each
# ELEMENT, not on the step). Every accreditation_citation and competitor_equivalent
# claim below traces to a real source file in confirmed_by — never to this journey's
# own narrative.
#
# COVERAGE NOTE (2026-08-25): this file was originally written against the four
# EXPANSION domains only (DO, Pharmacy, Dentistry, Medicine). It now also covers the
# eight disciplines Exxat/Prism serves in production today — PT/PTA, OT/OTA, PA, SLP,
# Nursing, Social Work, Teacher Education, and CRNA. Discipline-specific behavior is
# flagged inline with a leading "[PT/PTA]", "[OT/OTA]", "[PA]", "[SLP]", "[NURSING]",
# "[SW]", "[TE]", or "[CRNA]" tag on the element or in the gap_note, so a reader can
# tell at a glance which claims are cross-discipline primitives and which are bound to
# one discipline's named instrument. Untagged elements are the cross-discipline
# baseline that all twelve disciplines share.
#
# ONE STANDING COMPETITOR FINDING, stated once here rather than repeated per element:
# NO competitor teardown in ../competitors/ (axium, core-elms, e-value, elentra,
# emedley, leo-davinci, medhub, new-innovations, one45) documents anything at
# named-formative-instrument granularity. The deepest public claims found are
# e-value.yaml's "automated low-score alerts; forced comments on low scores;
# mid-point-to-end-of-rotation summary evaluations" (sourced to
# medhub.com/software/evalue) and core-elms.yaml's "low-score alerts, and due-date
# reminders" (sourced to a Capterra listing). Neither names an instrument (no CIET,
# no PTMACS, no AOTA FWPE), a threshold value, a trigger rule, or a configuration
# screen. Every element below that concerns a named instrument therefore carries an
# explicit "not comparable at element level" verdict, and that verdict is a real
# research finding, not a placeholder.
flow_name: "Midpoint Formative Feedback & Early-Risk Intervention"
maps_to_journey: "rotation-lifecycle.yaml, stage 6"
persona: >
  Primary: Clinical/Experiential Education Coordinator (../personas/role-clinical-coordinator.yaml)
  — configures the midpoint-anchored form and reminder, reviews delivery status, and opens
  Interventions when a score comes back low. Secondary: Preceptor/Site Faculty
  (../personas/role-preceptor.yaml) — receives the reminder and submits the midpoint
  evaluation form on the student. In the eight production disciplines this second persona
  carries discipline-specific titles that matter for who receives the link: Clinical
  Instructor (CI) in PT/PTA, Fieldwork Educator in OT/OTA, Preceptor in PA/Nursing/CRNA,
  Clinical Supervisor/Clinical Educator in SLP, Field Instructor in Social Work, and
  Cooperating/Mentor Teacher in Teacher Education (the TE title is unconfirmed — see the
  TE step's gap_note). Tertiary in PT/PTA and OT/OTA only: the STUDENT, who is a first-class
  actor in the midpoint instrument rather than only its subject (self-evaluation on CIET
  v2.0, PTMACS/PTAMACS, and the AOTA FWPE Student Self-Assessment forms).

steps:
  - screen: "Learning Activities Setup — Forms/Evaluations drawer"
    navigation_path: "Courses > [Course Offering] > Learning Activities > Setup > Forms/Evaluations (+) > [select midpoint evaluation form]"
    elements:
      - element: "Does this form require a placement?"
        type: "toggle"
        data_shown: "Whether the form is placement-scoped vs. a standalone assignment"
        gates_on: []
        accreditation_citation: >
          None at this element. It scopes the form to a placement, which is the
          precondition for the MID anchor below being computable at all, but no LCME 9.7
          evidence is captured here.
        competitor_equivalent: >
          Not comparable at element level — E*Value's public marketing page
          (medhub.com/software/evalue) describes midpoint evaluations as an outcome and
          says nothing about placement-scoping mechanics.
        gap_severity: "none"
        gap_note: >
          Complete as documented; a binary scoping flag with no gap against anything in
          this stage. [PT/PTA] The PT playbook records a discipline-specific hard rule on
          this same toggle for the site/CI evaluation family: "When configuring, always
          answer 'Yes' to 'Does this form require placement?'" for PTSE 1. [PT/PTA] For
          CIET v2.0 the CIET help guide states the answer defaults to "yes" and may be set
          to "No" if not applicable — so the same toggle carries opposite default guidance
          across two PT instruments, which is a real onboarding trap rather than a product
          gap.
      - element: "Does the form contribute to the student's final score?"
        type: "toggle"
        data_shown: "Grading inclusion flag"
        gates_on: []
        accreditation_citation: >
          None at this element — a grading-inclusion flag, not evidence for LCME 9.7's
          formative-feedback requirement.
        competitor_equivalent: >
          Not comparable at element level — not described in any cited competitor's
          public docs.
        gap_severity: "none"
        gap_note: >
          Complete as documented; a binary grading flag with no gap against anything in
          this stage. [OT/OTA] This flag is the root of the FWPE early-alert problem
          documented three steps below: because only the FINAL FWPE counts toward scoring,
          Exxat's own published best practice is to leave the Low Score Threshold OFF until
          all midterms are reviewed — meaning a grading-inclusion decision made here
          silently disables the midpoint alert.
      - element: "Publish date"
        type: "anchor-relative date offset (N days before/after placement start, mid, or end)"
        data_shown: "When students/preceptors can first see the form"
        gates_on: []
        accreditation_citation: >
          None at this element specifically — visibility timing supports, but is not
          itself, the LCME 9.7 mid-point delivery evidence, which lives on the Due date
          anchor below.
        competitor_equivalent: >
          Not comparable at element level — E*Value's public page does not describe
          configuration mechanics, so there is no basis for comparing form-visibility
          timing field-for-field.
        gap_severity: "none"
        gap_note: >
          The same anchor-relative primitive as the Due date, applied to visibility;
          confirmed working as documented. [OT/OTA] One documented exception that matters
          for this stage: the FWPE guide states flatly that "the Publish Date does not
          apply to Fieldwork Educator forms, as these forms are distributed directly by
          administrators to the Fieldwork Educators." So for the single most important OT
          midpoint instrument this element is inert, and timing is instead governed by the
          Send Form / Set up Automation step documented separately below. An OT coordinator
          who configures Publish date here and expects the educator to see the midterm FWPE
          on that date is configuring nothing.
      - element: "Due date"
        type: "anchor-relative date offset (N days before/after placement start, mid, or end)"
        data_shown: "Form due date, set relative to the placement's MID-date anchor for a midpoint evaluation"
        gates_on: ["form completion status downstream"]
        accreditation_citation: >
          LCME Standard 9, Element 9.7. Cross-discipline, the same anchor-relative
          primitive is the delivery mechanism behind ARC-PA Standard B4, Element B4.01 a-b
          (timely identification of deficiencies), CAA-ASHA Standard 5.0, Standard 5.2
          (formative and summative assessment), COA Standard H.1.1 and H.1.1.1 (formative
          and summative student evaluation), CCNE Standard III, Key Element III-K (and ACEN
          Standard 4, Criterion 4.10), and CSWE Accreditation Standard 3.3, AS 3.3.5
          (competency-aligned evaluation at midterm and final).
        competitor_equivalent: >
          E*Value's public marketing page (medhub.com/software/evalue) states it ships
          "mid-point-to-end-of-rotation summary evaluations," but the page does not describe
          configuration mechanics — it is not possible to confirm from public docs whether
          E*Value's midpoint trigger is anchor-relative (computed per placement instance, as
          Prism's is here) or a manually-set date per rotation. Treat this as parity on the
          user-facing outcome only, not a verified element-level comparison.
        gap_severity: "none"
        gap_note: >
          This is the confirmed anchor-relative scheduling primitive doing exactly what LCME
          9.7 asks of it: setting the anchor to "Middle of placement" (0 days after MID) makes
          the trigger fire per placement instance rather than being hand-dated per student.
          One limit sits on this element: the MID anchor is a single placement-level date, and
          the standard's "alternate method for experiences under four weeks" is not expressed
          here — there is no branch logic that swaps the anchor when a placement's duration
          falls under a threshold. [PT/PTA] The CIET v2.0 guide confirms this element splits
          into TWO named fields when a multi-term instrument is selected — "Due date for the
          mid form is" and "Due date for the Final form is" — each anchored independently
          (its worked example is 10 days AFTER Placement Mid Date). That is the cleanest
          in-production instance of a real midpoint anchor anywhere in the corpus.
          [OT/OTA] The FWPE guide describes the same split as "set the due dates for the mid
          and final form." [SW] The SW playbook (line 73) confirms the "split forms" model — "mid-term,
          final, Field Instructor rating, and student rating — completed independently" —
          which means an SW program configures FOUR separate anchored forms here rather than
          one multi-term instrument, multiplying the anchor configuration work by four with
          no product affordance binding them together as one assessment event.
      - element: "Workflow selector (multi-term instruments only)"
        type: "select"
        data_shown: >
          [PT/PTA] For CIET v2.0 the drawer exposes a WorkFlow dropdown with exactly two
          values — 'CIET v2.0 Midterm and Final' (student and CI each evaluate once at the
          midpoint and once at the end) and 'CIET v2.0 - Final' (one evaluation, at the end
          of the placement only)
        gates_on: ["whether a midpoint formative evaluation event exists at all for this course offering"]
        accreditation_citation: >
          CAPTE Standard 2, Element 2D4 — CAPTE's evidence demand is for entry-level
          performance "by the end of their last clinical education experience," plus a
          description of the mechanism used where CI assessment suggested less than
          entry-level performance. This selector is the single element that decides whether
          a program has any pre-final detection mechanism to describe.
        competitor_equivalent: >
          Not comparable at element level. No competitor file documents a per-instrument
          midterm-vs-final-only workflow switch. E*Value's "mid-point-to-end-of-rotation
          summary evaluations" claim (../competitors/e-value.yaml, sourced to
          medhub.com/software/evalue) asserts the outcome without describing whether the
          midpoint half is optional, defaulted on, or configurable at all.
        gap_severity: "configure-needed"
        gap_note: >
          [PT/PTA] Genuinely shipped and genuinely consequential: this is a one-dropdown
          decision that determines whether a PT program has a midpoint formative event.
          Selecting 'CIET v2.0 - Final' makes stage 6 a no-op for that course offering, and
          nothing in the documented configuration warns the admin of that. [PT/PTA] The PT
          playbook independently confirms the same optionality for the CI Details-adjacent
          instrument family — CIET "Completed at Midterm and Final — option exists to activate
          for Final only." [PA] The PA playbook lists "Mid-point evaluation (optional)" in its
          standard-course-activities inventory, i.e. PA's midpoint is not merely
          configuration-optional but is described as optional PRACTICE — which is the
          sharpest single-line risk in this whole file against ARC-PA B4.01's "timely"
          requirement. [SLP][NURSING][SW][TE] No equivalent named workflow selector is
          confirmed, because none of these four disciplines has a shipped standard
          multi-term instrument to attach one to (see the "no standard instrument" element
          below); they reach the same outcome by configuring two separate forms with two
          separate anchors, which is functionally equivalent but leaves no single object
          representing "this student's midterm-and-final assessment."
      - element: "Low score threshold"
        type: "numeric input (per-form score cutoff), configured on the Forms/Evaluations setup screen"
        data_shown: "The overall-form score below which a submission is treated as a low score"
        gates_on: ["red highlight of the form score on the review screen", "low score email notification (support-activated)"]
        accreditation_citation: >
          ARC-PA Standard B4, Element B4.01 a-b (identify and address student deficiencies
          in a timely manner); ACOTE Standard C.1.15 (escalate a failing or unsafe
          performance rating to the program immediately rather than at term end);
          CAA-ASHA Standard 4.0, Standard 4.3 (an early-warning signal fired from live
          performance data); CAPTE Standard 2, Element 2D4 (the exception path where CI
          assessment suggests less than entry-level performance).
        competitor_equivalent: >
          This is the ONE element in this stage where a genuine, if shallow, element-level
          comparison is possible. Both E*Value (../competitors/e-value.yaml, sourced to
          medhub.com/software/evalue: "automated low-score alerts; forced comments on low
          scores") and CORE ELMS (../competitors/core-elms.yaml, sourced to a Capterra
          listing: "low-score alerts") claim low-score alerting as a shipped feature. Two
          real differences are visible even at that resolution. First, E*Value additionally
          claims "forced comments on low scores" — a mechanism with no Prism equivalent
          found anywhere in this corpus, and a meaningful one, because a forced comment
          converts a bare low number into the narrative an accreditor can actually read.
          Second, neither competitor discloses a threshold VALUE, a per-instrument default,
          or whether configuration is self-service — so Prism's published per-instrument
          defaults ([OT/OTA] 111 for OT, 91 for OTA) are more specific than anything either
          competitor documents, while Prism's support-ticket dependency for the email half
          is a friction neither competitor is known to share or not share.
        gap_severity: "configure-needed"
        gap_note: >
          The threshold VALUE is self-service here; the EMAIL that fires off it is not.
          Per "Track low scores for timely interventions," setting the threshold on this
          screen produces the in-app red highlight on the review screen immediately, but
          turning on the outbound "low score notification" requires contacting support and
          naming the individual who should receive the emails. That split is the crux of
          this whole stage: detection is configurable, escalation is a services engagement.
          [PT/PTA] Confirmed for PTSE 1 and PTSE 2 — the PT playbook states admins can set a
          numeric score threshold at activation and that below-threshold submissions display
          in red, while automated low-score email notifications "isn't self-service and
          requires an Exxat support ticket to turn on." (The dedicated help-center article
          "Low score indicators for PTSE forms" exists in the vault mirror but contains only
          embedded images and no extractable text, so it corroborates nothing beyond the
          article's existence — noted here rather than cited as substance.)
          [OT/OTA] Confirmed for the AOTA FWPE with published values — OT students, total
          score 111 or below; OTA students, 91 or below — and with the damaging caveat that
          the threshold setting applies to BOTH midterm and final, so Exxat's own best
          practice is to hold it off until all midterms are submitted and reviewed. The
          alert is therefore recommended-off during precisely the window this journey stage
          exists to serve. That is not a configuration gap; it is a product design gap — a
          per-term threshold (or a midterm-only threshold) would resolve it outright and is
          the single highest-value fix identified in this file.
          [PA] The PA playbook locates the same configuration at "Learning Activity Group >
          Course > Forms and Evaluations > select form" and frames it explicitly as how PA
          programs avoid an ARC-PA citation under B4.01.
          [SLP] Support-gated end to end. Per the SLP playbook, question-based email
          notifications for early alerts are "configured by the Exxat Prism support team
          (prism-support@exxat.com), not self-service," as are min/max hour thresholds and
          new custom forms — the heaviest services dependency of any of the eight
          production disciplines, and caa-asha.yaml calls this "the clearest SLP-specific
          self-service gap in the whole file."
          [NURSING][CRNA][SW][TE] No discipline-specific threshold default is documented for
          any of these four, because none has a shipped standard instrument carrying a
          published scale to set one against; each program invents its own cutoff.
      - element: "Response-based (question-level) notification criteria"
        type: "support-gated configuration bound to a specific question on the form"
        data_shown: "The per-question response value(s) that trigger an alert on submission"
        gates_on: ["notification to placement faculty and any named additional recipients"]
        accreditation_citation: >
          ARC-PA Standard B4, Element B4.01 a-b (keyed to the specific evaluation question
          tied to a program learning outcome); ACOTE Standard C.1.15 (immediate escalation
          of a failing or unsafe rating); CAA-ASHA Standard 4.0, Standard 4.3.
        competitor_equivalent: >
          Not comparable at element level. Question-level (as opposed to form-level)
          trigger logic is not described in any competitor file. E*Value's and CORE ELMS's
          claims are both form-score-level ("low-score alerts"); neither public source
          describes firing on a single item's response, and neither describes severity
          tiering by item type. If the comparison were documented it would likely favor
          Prism, but it is not documented, so no claim is made here.
        gap_severity: "configure-needed"
        gap_note: >
          Per "Track low scores for timely interventions," this mechanism supports all
          question types including single-select and multi-select, and fires to placement
          faculty (if assigned) plus schools-designated individuals — but setting up the
          question-level thresholds requires the Account Manager and Configuration team,
          and activating the notification requires a separate support request naming
          recipients. Two tickets, two teams, for one behavior.
          [OT/OTA] This is where the FWPE gets genuinely instrument-aware, and it is the
          strongest early-risk logic anywhere in the product: the response-based alert fires
          by default on ANY rating of 1, and fires additionally on a rating of 1 OR 2 on
          three specific Fundamentals of Practice items — adherence to AOTA's Code of Ethics
          and applicable federal/state/facility regulations, compliance with safety
          regulations including accurate incident reporting and documentation, and ensuring
          safety for self and others by anticipating and preventing hazards. That is
          severity tiering by item semantics, not a flat numeric cutoff, and unlike the low
          score threshold it is NOT recommended-off at midterm. For OT specifically, the
          response-based alert is therefore the real midpoint safety net and the low-score
          threshold is the decoy.
          [PA] Confirmed as the PA mechanism of record — "when a student scores below a set
          threshold on a question tied to a program learning outcome, the response is
          red-highlighted and can trigger an automatic email alert, enabling real-time
          identification of struggling students during a rotation rather than only at
          rotation end."
          [PT/PTA][SLP][NURSING][CRNA][SW][TE] Available as the same cross-discipline
          primitive, but no discipline-specific default trigger set is documented for any of
          them. The OT default-trigger package is a content asset, not an engine feature,
          and shipping equivalent defaults for other disciplines' instruments is content
          work rather than engineering.
      - element: "Configured notifications list (bottom of Forms/Evaluations setup screen)"
        type: "read-only display of active notification rules"
        data_shown: "Which low-score and response-based notifications are active on this form, and to whom"
        gates_on: []
        accreditation_citation: >
          None at this element. It displays escalation configuration; it produces no
          student-performance evidence for any standard.
        competitor_equivalent: >
          Not comparable at element level — no competitor's public docs describe a
          visibility surface for their alert configuration.
        gap_severity: "cosmetic"
        gap_note: >
          A genuinely useful mitigation of the support-gating problem, and worth naming
          because it is easy to miss: "the configured notifications are visible at the
          bottom of the Forms/Evaluations setup screen for visibility." So the coordinator
          can at least SEE what support configured without filing a ticket to ask. It is
          read-only, so a stale recipient (the failure mode acote.yaml, arc-pa.yaml, and
          caa-asha.yaml all independently flag — a hand-maintained list of first name, last
          name, and email that goes stale as faculty turn over) is visible but not
          fixable here. Cosmetic rather than configure-needed only because the information
          is present and correct; the inability to act on it is scored on the two elements
          above.
      - element: "Refer to another activated form while filling this form"
        type: "select (points at a second activated form whose responses display alongside)"
        data_shown: "Prior-term or companion-form responses, surfaced inside the form being completed"
        gates_on: []
        accreditation_citation: >
          ARC-PA Standard B3, Element B3.03 a-c — arc-pa.yaml records that mid-point and
          end-of-rotation evaluations of the same student by the same preceptor must be
          substantively consistent, and that PA programs have been CITED when formative
          mid-point feedback contradicts the summative assessment. This element is the only
          confirmed product affordance anywhere in the corpus that puts the midpoint answers
          in front of the person writing the final.
        competitor_equivalent: >
          Not comparable at element level — no competitor file describes cross-form or
          cross-term response referencing during completion.
        gap_severity: "configure-needed"
        gap_note: >
          [PT/PTA] Confirmed as an explicit configuration step on the CIET v2.0 activation
          screen ("select if you want to refer to another activated form while filling this
          form"). [PT/PTA] The same behavior is native and non-optional inside the PTSE 2
          instrument — "Responses from Midterm are visible when completing Final."
          [OT/OTA] Native and non-optional in the FWPE — "Mid Term Evaluation responses and
          score will be visible while filling out Final Term form," confirmed from both the
          Fieldwork Educator help guide and the OT playbook.
          [PA] This is the gap. The consistency requirement that carries live ARC-PA
          citation risk is a PA requirement, and PA has no shipped standard multi-term
          instrument to inherit the native behavior from — a PA program has to reach this
          affordance through the generic referring-form configuration and know to do so.
          More importantly, in NO discipline does the product DETECT divergence: displaying
          the midpoint answers next to the final is a prompt to a human, not a check.
          Nothing computes "this preceptor rated this student 2 at midterm and 4 at final
          with no intervening intervention record" and surfaces it. arc-pa.yaml states this
          plainly — "nothing in the product detects that divergence" — and it is the single
          clearest unbuilt differentiator identified in this stage: a midpoint-to-final
          consistency check is computable from data Prism already holds, is citable to a
          named standard, and no competitor claims it.
      - element: "Course Faculty / Placement Faculty / Faculty Advisor access controls"
        type: "role-permission matrix"
        data_shown: "Who can edit vs. view the activated evaluation"
        gates_on: []
        accreditation_citation: >
          None at this element for the midpoint-delivery requirement — a role-permission
          matrix, not where LCME 9.7 evidence lives. It IS however the mechanism behind
          CCNE Standard III, Key Element III-K's structural demand (preceptor input routes
          to a faculty reviewer who renders the actual determination), which is evidenced
          on the review workflow rather than on this matrix itself.
        competitor_equivalent: >
          Not comparable at element level — no cited competitor's public docs describe
          per-role edit/view permissions on an evaluation form.
        gap_severity: "none"
        gap_note: >
          Complete as documented. Note the drawer as a whole has no short-rotation branch:
          a program needing the LCME 9.7 "alternate method" would configure a second,
          separate short-rotation form and apply a manual rule for which one to use.
          [PT/PTA][OT/OTA] Both the CIET v2.0 and FWPE guides confirm the same two-tier
          split on this element — "select the faculty role who can view and edit the form"
          and separately "select the faculty role who can only view the form."
          [NURSING] nursing.yaml identifies this matrix plus the three-tier faculty
          association model as what makes CCNE III-K satisfiable: it scopes a
          placement-level faculty reviewer to only their assigned students, putting faculty
          structurally last in the chain, which is what CCNE demands when it says faculty
          "may seek input from preceptors ... but ultimately faculty are responsible for
          evaluation of individual student outcomes."
      - element: "Availability of a shipped standard instrument to attach a midpoint to"
        type: "not a control — the contents of the form-selection list in this drawer"
        data_shown: "Which pre-built, non-editable Standard forms exist for this discipline vs. which must be custom-built"
        gates_on: ["whether midpoint configuration is a five-minute activation or a services engagement"]
        accreditation_citation: >
          CAA-ASHA Standard 5.0, Standard 5.2 (formative and summative assessment using a
          variety of techniques administered by multiple academic and clinical faculty);
          CCNE Standard III, Key Element III-K (and ACEN Standard 4, Criterion 4.10);
          CAPTE Standard 2, Element 2D4; ACOTE Standard C.1.15.
        competitor_equivalent: >
          Not comparable at element level, and the asymmetry is worth stating plainly: no
          competitor file in ../competitors/ names a single validated clinical instrument
          it ships. CORE ELMS claims breadth across "15+ disciplines including pharmacy,
          dental, nursing, PT, OT, PA, veterinary, social" and E*Value claims "24+ named
          disciplines," but both describe a customizable form BUILDER, not a library of
          named standard instruments. Prism's shipped instrument library (CIET v2.0, PTSE
          1, PTSE 2, PTMACS, PTAMACS, SCIPAI, PTA CIET, the five-form AOTA FWPE family) is
          therefore a differentiator that is invisible in competitor marketing because
          competitors do not compete on it publicly — but it is a real one, and it is
          exactly what makes PT/PTA and OT/OTA cheap to onboard and SLP, Nursing, SW, and
          TE expensive.
        gap_severity: "gap"
        gap_note: >
          This is the sharpest cross-discipline split in the file, and it is a stark
          two-tier world.
          [PT/PTA] Richest. The PT playbook inventories PTSE 1, PTSE 2, CI Details Form,
          Timesheets as standard forms; a Mid-Term Call Form and weekly planning form as
          "other" forms; and CIET v2, PTA CIET, SCIPAI, PTMACS, PTAMACS as assessments of
          student performance (with CPI 3.0 explicitly outside Exxat). SCIPAI is
          particularly relevant to THIS stage: the playbook notes most standard tools are
          "largely summative (Final and/or Midterm version only)" while SCIPAI "adds
          formative snapshots" filled at multiple points in time — the only confirmed
          instrument in the corpus designed for more than two capture points inside one
          placement.
          [OT/OTA] Nearly as rich, and deeper on notification logic. Five AOTA FWPE forms
          ship: Student Self-Assessment for OT, Student Self-Assessment for OTA, Fieldwork
          Educator for OT, Fieldwork Educator for OTA, and a Supplement form used when an
          educator leaves mid-session and a new educator takes over — a real mid-placement
          evaluator-handoff case that no other discipline's instrument set models.
          [PA] Middle tier. Standard patient-log templates exist and a Preceptor Evaluation
          of Student is standard practice, but the mid-point evaluation itself is listed as
          optional and no named validated PA midpoint instrument is confirmed.
          [SLP] Gap, and caa-asha.yaml states it directly: SLP has "NO free, validated,
          off-the-shelf standard instruments the way PT does (CIET v2, PTMACS/PTAMACS,
          SCIPAI) or OT does (AOTA FWPE family)." The documented SLP set (SLP Playbook lines
          90-96) is seven configured form types — KASA Summary Forms; Clinical Supervisor
          Evaluations, explicitly split MIDTERM & FINAL; Student Self-Assessments; Student
          Evaluations of Clinical Sites; Student Evaluations of Clinical Supervisors; Site
          Assessments "aligned to program goals and accreditation standards"; and additional
          custom forms — and creating new forms requires a prism-support@exxat.com ticket (line
          98). Two things follow that this file previously left implicit. First, SLP DOES have a
          named midpoint instrument in practice: "Clinical Supervisor Evaluations (Midterm &
          Final)" is the discipline's own convention, it just is not a shipped standard form, so
          the workflow-selector element above has nothing to attach to and the midterm becomes a
          separately-anchored form. Second, the SLP toolkit is the only one of the eight that
          bundles a SITE assessment into the same evaluation family as the student instruments,
          which is why CAA 3.9B site suitability and CAA 4.3 student early alert are configured
          against the same support ticket. Shipping a KASA Summary Form as a Standard form
          type is the obvious product gap to close for this discipline.
          [NURSING][CRNA] Same gap, same wording from a different registry: nursing.yaml
          records that "nursing has no shipped standard national instrument the way PT has
          CIET v2/PTSE and OT has the AOTA FWPE family — nursing programs build custom
          forms, and custom form creation is support-gated rather than self-service." The
          nursing playbook's confirmed instrument set (Preceptor Evaluation of Student,
