          Not comparable at element level — not documented for any cited competitor.
        gap_severity: "configure-needed"
        gap_note: >
          [CRNA] The transcript names this stage's purpose almost verbatim (line 33): "You can
          move through each student's report to review their evaluations, spot patterns, and
          identify areas where additional support or intervention may be needed." Recorded as
          configure-needed rather than none because it is a HUMAN reading a PDF. There is no
          confirmed low-score threshold, response-based notification, or automated flag
          operating over the daily evaluation stream — the two alerting mechanisms documented
          in step 1 fire on form submission against a threshold, and no source confirms they
          are configured or configurable for a daily instrument generating thousands of
          submissions per cohort. For the discipline with the highest formative volume in the
          product, early-risk detection is confirmed to be manual. That is the single largest
          unmet early-risk opportunity identified in this file.
    action: >
      [CRNA] The program administrator selects the daily clinical case log form, filters by
      student/rotation/course/status, chooses whether to include student responses, preceptor
      responses, or both, and downloads per-student PDFs — then reads through each student's
      accumulated daily evaluations looking for the pattern that warrants an Intervention.
    confirmed_by: >
      /Users/romitsoley/Downloads/CRNAVideosTranscripts.md (lines 15-37, 'Daily Clinical Evaluation Report for CRNA Program');
      /Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/accreditation/coa.yaml (Standard H.1.1 and H.1.1.1);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing Playbook.md (Evaluations & Forms — formative Daily/Midterm vs. Summative/Terminal)

  - screen: "[NURSING][CRNA] Student Activity Insights Report (color-coded mid-rotation pacing)"
    navigation_path: "Learning Activities > [Course] > Reports (Action column) > Student Activity Insights"
    elements:
      - element: "Color-coded completion cell per requirement category"
        type: "read-only grid with green/amber/red conditional formatting"
        data_shown: >
          Green = met or exceeded the minimum requirement (100% or more); yellow/amber =
          approaching the minimum (roughly 80-99%); red = 0% to below the minimum
        gates_on: []
        accreditation_citation: >
          COA Standard E.2.3 and Appendix (clinical experience minimums — 2,000 clinical
          hours and roughly 60 case-category thresholds); COA Standard C.4 (clinical
          experience logs, faculty-reviewed on a regular basis); CCNE Standard III, Key
          Element III-H (DNP 1,000-hour and NP 500-hour minimums); CAA-ASHA Standard 4.0,
          Standard 4.3 (an early-warning signal fired from live performance data — the SLP
          analogue runs on the Clinical Log Report, documented in the next step).
        competitor_equivalent: >
          Not comparable at element level. No competitor file documents an exposure-pacing
          view with banded thresholds. This is a distinct signal type from everything the
          competitors claim: E*Value's and CORE ELMS's low-score alerts fire on an EVALUATION
          RESULT, whereas this fires on ACCUMULATION SHORTFALL — a student can be rated
          perfectly well and still be red here. No competitor public material addresses that
          axis at all.
        gap_severity: "none"
        gap_note: >
          [NURSING][CRNA] Confirmed complete from two independent sources — the nursing
          playbook calls it "the core self-monitoring/early-intervention tool" and notes it is
          "repeatedly cited across the ACEN, COA, and student-facing CCE guides," and the CRNA
          transcript gives the exact band definitions and a worked example (transcript line
          87: "if the minimum requirement is 200 and the student has entered only 21, the cell
          will appear red"). Critically for this stage, the amber band is a genuine EARLY
          warning rather than a failure report: a student at 80-99% is flagged before they
          miss. [NURSING][CRNA] The playbook confirms availability to BOTH admins and students
          — the second confirmed student-facing early-risk surface in this file, alongside the
          Competency Tracker.
      - element: "Filters (rotation, program, clinical settings, site location, status, student) plus Generate Report"
        type: "report filters and action"
        data_shown: ""
        gates_on: []
        accreditation_citation: "COA Standard E.2.3 and Appendix; COA Standard C.4"
        competitor_equivalent: >
          Not comparable at element level — not documented for any cited competitor.
        gap_severity: "none"
        gap_note: >
          [CRNA] Complete as documented (transcript line 85), with download/export available.
      - element: "Absence of a push alert on a red or amber cell"
        type: "not a control — a documented absence"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: >
          COA Standard C.4; CCNE Standard III, Key Element III-H; ACPE Standard 3, Key
          Element 3.1.b (the same absence is recorded for Pharmacy in the next step).
        competitor_equivalent: >
          Not comparable — an absence, and none of the competitor files claim pacing alerts
          either, so no competitor is ahead here. Recorded because the absence is uniform
          across the market rather than a Prism-specific deficiency.
        gap_severity: "gap"
        gap_note: >
          [NURSING][CRNA] The report is a PULL surface: a coordinator sees a red cell only by
          generating the report. No source in this corpus confirms that a student crossing
          from green into amber, or amber into red, generates any notification to an advisor
          or to the student. The same absence is separately confirmed for [PHARMACY] hour
          thresholds in the next step and for [SLP] min/max log thresholds. Three disciplines,
          three different threshold mechanisms, and the same missing push. Recorded once here
          as a gap and cross-referenced rather than restated, because it is one product
          behavior and would be one build: a scheduled evaluation of existing configured
          thresholds that opens a notification when a student crosses a band. Every ingredient
          (the thresholds, the bands, the notification engine, the recipient model) is already
          shipped and confirmed elsewhere in this file.
    action: >
      [NURSING][CRNA] Mid-rotation, the coordinator generates the Student Activity Insights
      report for the course, scans for amber and red cells indicating students approaching or
      below the program's minimum per category, drills into the underlying logs, and opens an
      Intervention while there is still rotation time left to fix the shortfall.
    confirmed_by: >
      /Users/romitsoley/Downloads/CRNAVideosTranscripts.md (lines 81-87, 'Managing Clinical Case Experience Log in Exxat Prism' — Viewing the CCE log report);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Nursing Playbook.md (Student Activity Insights Report);
      /Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/accreditation/coa.yaml (Standards C.4 and E.2.3);
      /Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/accreditation/nursing.yaml (CCNE Standard III, Key Element III-H)

  - screen: "Clinical Log Report (hour-threshold and exposure-minimum configuration)"
    navigation_path: "Support-ticket/Account-Manager-gated configuration on the Clinical Log Report (not admin self-service)"
    elements:
      - element: "Per-participation-type hour threshold"
        type: "support-gated configuration, not a self-service screen element"
        data_shown: "Minimum/target hours per participation-type category (e.g. community vs. hospital/health-system for Pharmacy IPPE) against which cumulative logged hours are compared"
        gates_on: []
        accreditation_citation: "ACPE Standard 3, Key Element 3.1.b"
        competitor_equivalent: >
          Not comparable at element level — not documented for any cited competitor.
        gap_severity: "configure-needed"
        gap_note: >
          This directly resolves what was "unconfirmed" in acpe.yaml's gap_notes for 3.1.b: the
          Clinical Log Report does carry per-participation-type hour thresholds, so the
          setting-category aggregation ACPE needs is a real, named feature — but it is
          support-ticket/Account-Manager configuration, not admin self-service, and no source
          found confirms an automatic advisor-facing "off-pace" alert fires off that threshold
          before the IPPE window closes; that alerting behavior remains unconfirmed. See the
          Student Activity Insights step above, where the same missing push is recorded for
          [NURSING][CRNA] — it is one absence across three disciplines, not three absences.
      - element: "[SLP] Min/max hour thresholds per participation-type x mode-of-delivery combination"
        type: "support-gated configuration (prism-support@exxat.com), surfaced as red flagging in the Clinical Log Report"
        data_shown: "Under-logged students flagged red against configured minimum/maximum hour thresholds, per participation type crossed with mode of delivery"
        gates_on: []
        accreditation_citation: >
          CAA-ASHA Standard 4.0, Standard 4.3 (caa-asha.yaml names "low clinical-log hours"
          first in its list of live performance data an early-warning signal should fire from,
          and identifies these thresholds as the trigger side that exists today); CAA-ASHA
          Standard 3.0B, Standard 3.1B (the 400 supervised clinical practice hours the
          Clinical Clock Hours Report tracks cumulatively).
        competitor_equivalent: >
          Not comparable at element level — no competitor file documents hour-threshold
          flagging on a clinical log, in any discipline.
        gap_severity: "configure-needed"
        gap_note: >
          [SLP] Confirmed from the SLP playbook, which states the thresholds "are not
          self-service — programs must contact prism-support@exxat.com to configure them,
          same as new custom forms," and confirms the Clinical Log Report "supports configured
          min/max thresholds that flag under-logged students in red." The SLP case is the
          worst-compounded services dependency of the eight production disciplines and
          caa-asha.yaml says so directly: BOTH trigger mechanisms are support-gated for SLP
          (the min/max hour thresholds AND the question-based early-alert notifications),
          and combined with the unresolved Interventions-report question above, "the 'applied
          consistently across all students' proof for 4.3 is assemblable but not queryable
          today." Note also the SLP-specific dimensionality: the threshold is not a single
          number but a matrix over participation type (Intervention vs. Evaluation) crossed
          with mode of delivery, and the Clinical Log Report additionally breaks out
          distribution across the 9 KASA competencies by age group. That is a richer
          exposure model than any other discipline's hour threshold and it is entirely
          invisible to the program without a ticket.
      - element: "[PA] Diagnosis and procedure minimums configured on the Patient Log"
        type: "per-diagnosis and per-procedure minimum encounter counts, scoped to rotations and settings"
        data_shown: >
          Which diagnoses a student must encounter and how many times, and which procedures
          they must observe/assist/perform and how many times, per rotation and setting
        gates_on: ["the student's real-time patient-logging progress display"]
        accreditation_citation: >
          ARC-PA Standard B3, Element B3.03 a-c (SCPE learning outcomes for preventive, acute,
          and chronic patient encounters); ARC-PA Standard B3, Element B3.04 a-d (required SCPE
          settings); ARC-PA Standard B4, Element B4.01 a-b (timely identification of
          deficiencies — exposure shortfall being the deficiency here).
        competitor_equivalent: >
          Not comparable at element level — no competitor file documents diagnosis- or
          procedure-level minimums with per-rotation scoping.
        gap_severity: "none"
        gap_note: >
          [PA] Confirmed complete from the PA playbook, and it belongs in this stage rather
          than in the in-rotation-capture stage because the playbook frames it explicitly as
          an EARLY-RISK mechanism: once configured, "students track progress in real time,
          faculty/admins monitor completion status, gaps surface early (not just at rotation
          end), and interventions can happen while there's still time to fix exposure
          shortfalls." That is the clearest statement of this stage's purpose anywhere in the
          discipline sources. It is also the exposure-side complement to PA's evaluation-side
          question-level alerting: PA is the only discipline confirmed to have BOTH a
          question-level performance trigger and a granular exposure-minimum trigger, which
          makes it the strongest overall early-risk story of the eight production disciplines
          — and, given ARC-PA B4.01's timeliness test, the one where that strength is most
          directly citable.
    action: >
      For a short-rotation, hours-paced or exposure-paced signal rather than a midpoint-date
      signal — [PHARMACY] IPPE hours under ACPE 3.1.b, [SLP] clinical clock hours under
      CAA-ASHA 3.1B and 4.3, [PA] diagnosis and procedure minimums under ARC-PA B3.03/B3.04 —
      the coordinator needs thresholds configured before any pacing view can show a student
      falling behind. For Pharmacy and SLP that configuration is a support engagement; for PA
      the minimums are collected during patient-log setup.
    confirmed_by: >
      /Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/prism/capability-map.yaml (cross-cutting self-service-vs-support-gated configuration entry, listing 'per-participation-type hour thresholds on the Clinical Log Report' explicitly);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Speech-Language Pathology (SLP) Playbook.md line 67 (min/max hour thresholds per participation-type/mode-of-delivery combination, used to flag under-logged students red, NOT self-service — a prism-support@exxat.com request, "same as new custom forms"), line 128 (the Clinical Log Report as the surface those thresholds render on) and line 118 (question-based email notifications supporting real-time early-alert monitoring, also configured by the support team rather than by the program);
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Physician Assistant (PA) Playbook.md (Configuring Minimum Diagnosis & Procedure Requirements);
      /Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/accreditation/caa-asha.yaml (Standard 4.0, Standard 4.3)

  - screen: "[TE] Learning Tool Interoperability (GoReact/Echo360) — video-based formative feedback"
    navigation_path: "Learning Activities > Setup > Learning Tool Interoperability > + (new assignment); reviewer work happens inside GoReact, not in Prism"
    elements:
      - element: "LTI section visibility (discipline/program-gated)"
        type: "presence or absence of the Learning Tool Interoperability section on the setup page"
        data_shown: "Whether the feature is activated for this discipline and program at all"
        gates_on: ["access to the entire video-feedback workflow"]
        accreditation_citation: >
          CAEP Standard R3, Component R3.2 (documented performance reviews and support
          provisions with evidence that action is taken when a candidate's progression is at
          risk) and CAEP Standard R1, Component R1.3 (Instructional Practice) — video of a
          candidate teaching being the natural evidence for the latter. Both citations are
          the analyst's mapping of a confirmed Prism feature onto a confirmed CAEP standard;
          no Exxat source in this corpus names CAEP against this feature, and the TE playbook
          explicitly warns against citing CAEP standard numbers for TE "until confirmed
          against a TE-specific source." Flagged rather than asserted.
        competitor_equivalent: >
          Not comparable at element level — no competitor file documents an LTI integration
          with a video-feedback tool, or video-based formative assessment of any kind.
        gap_severity: "configure-needed"
        gap_note: >
          [TE] Confirmed from both the TE playbook and the CRNA transcript's third video
          (which covers the same integration generically): "If you do not see this section,
          it means this feature has not been activated for your discipline and program.
          Please create a ticket with Exxat support to activate this feature." So TE's only
          documented formative-feedback mechanism is behind a support ticket before a program
          can use it at all.
      - element: "Assignment configuration (LTI tool, title, description, placement-based vs. didactic, publish and due dates, grading and score settings, faculty visibility)"
        type: "form"
        data_shown: ""
        gates_on: []
        accreditation_citation: >
          None at this element — configuration fields mirroring the standard
          Forms/Evaluations drawer.
        competitor_equivalent: >
          Not comparable at element level — not documented for any cited competitor.
        gap_severity: "none"
        gap_note: >
          [TE] Complete as documented, and notably it reuses the same publish/due-date and
          placement-based/didactic vocabulary as the Forms/Evaluations drawer in step 1 — so
          a TE program CAN anchor a video assignment to a placement midpoint. Auto-creation of
          the matching GoReact activity on first save is confirmed and removes a real
          duplicate-setup burden.
      - element: "Timestamped comments, feedback, evaluations and scores — all authored inside GoReact"
        type: "external review surface"
        data_shown: "Reviewer watches the recording, leaves timestamped comments, completes evaluations, assigns scores; scores and status sync back to Prism"
        gates_on: []
        accreditation_citation: >
          CAEP Standard R1, Component R1.3; CAEP Standard R3, Component R3.2. Same flagged
          caveat as above — this is an analyst mapping, not an Exxat-sourced claim.
        competitor_equivalent: >
          Not comparable at element level — not documented for any cited competitor.
        gap_severity: "gap"
        gap_note: >
          [TE] This is the substantive TE finding of the whole stage, and it is a real
          structural gap rather than a documentation thinness. What syncs back into Prism is
          "scores and status updates" — the transcript and playbook both list exactly that.
          The FORMATIVE CONTENT — the timestamped comments, the narrative feedback, the thing
          that actually constitutes midpoint feedback to a teacher candidate — lives in
          GoReact. Three consequences follow. (1) The low-score threshold and response-based
          notification mechanisms documented in step 1 are Forms/Evaluations features; no
          source confirms they operate on LTI activities, so TE's primary feedback channel is
          very likely outside Prism's early-risk detection entirely. (2) An accreditation
          evidence pull for CAEP R1.3 would have to reach into a second vendor's system for
          the qualitative record, or rely on the numeric score alone. (3) The
          midpoint-to-final consistency question that carries live citation risk for PA is
          not even askable for TE, because the narrative halves are not in Prism to compare.
          Scored a gap on all three counts.
      - element: "Absence of any confirmed TE-specific midpoint instrument, terminology, or accreditor mapping"
        type: "not a control — a documented absence in the source corpus"
        data_shown: "n/a"
        gates_on: []
        accreditation_citation: >
          None assertable. The TE playbook states plainly that CAEP "is general industry
          knowledge, not something named in the current source material; do not cite specific
          CAEP standard numbers in customer conversations until confirmed against a
          TE-specific source." This flow file honors that instruction: every CAEP citation
          above is marked as an analyst mapping.
        competitor_equivalent: >
          Not comparable — an absence in Exxat's own source material, not a competitive
          finding.
        gap_severity: "gap"
        gap_note: >
          [TE] Recorded because a reader of this file should not mistake sparse coverage for
          verified simplicity. The TE playbook is explicit that Teacher Education "does not
          currently have a dedicated internal help-center playbook article or a CSS discipline
          playbook PDF," and lists as unfilled gaps: TE terminology (the
          cooperating-teacher/university-supervisor role names used in this file's persona
          block are the playbook's own unconfirmed guesses and are flagged there as such),
          program setup patterns, compliance patterns, placement workflows, standard
          evaluation forms and reports, accreditor standards, and pain points. Of the eight
          production disciplines, TE is the only one for which this research pass could not
          confirm a single discipline-specific midpoint or early-risk behavior beyond the
          GoReact integration. That is a finding about the source corpus, and the honest
          verdict for TE in this stage is: baseline-like by default, with one genuinely
          distinctive but externally-hosted feedback channel, and a real risk that the
          discipline's actual midpoint practice is simply undocumented rather than absent.
    action: >
      [TE] The program configures a video-based teaching-demonstration assignment via LTI,
      anchored to the placement like any other learning activity; the candidate records or
      uploads from My Coursework and is redirected into GoReact; faculty review inside GoReact
      with timestamped comments and scores, and only the score and status return to Prism.
    confirmed_by: >
      /Users/romitsoley/Downloads/PRISM-Expansion-Vault/99-Assets/documents/Playbooks/Teacher Education (TE) Playbook.md
      (read in full 2026-08-25; lines 54-57 for the timestamped-comment review mechanic inside
      GoReact, and lines 63-73 for the Open Gaps list confirming that no TE-specific evaluation
      instrument, report, pain point or accreditor mapping exists in any Exxat source);
      /Users/romitsoley/Downloads/CRNAVideosTranscripts.md (lines 95-117, 'Setting Up and Managing Echo360 (GoReact) Assignments in Exxat Prism');
      /Users/romitsoley/Documents/GitHub/rr-emerging-domains/content/accreditation/caep.yaml (Standard R3, Component R3.2 — mapping flagged as analyst inference, not an Exxat-sourced claim)

