          - "Student-address mode depends on student address data, which for many programs is collected via the Address Preference wishlist type — a type this same engine cannot otherwise consume."
        accreditation_citation: "None — no accreditor in ../accreditation/ prescribes geographic considerations in placement allocation."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file documents distance-weighted allocation."
        gap_severity: "none"
        gap_note: >
          Real differentiator versus every lottery-based competitor, and a nice closure of the loop with the
          Address Preference wishlist type: that type's data is useful here even though its rankings are not.
      - element: "Set Maximum Placements per Student for Courses, Rotations and Settings (bit) > Add Rule (IN EACH vs IN COMBINED; Course | Rotation | Setting; value)"
        type: "rule builder"
        data_shown: >
          Per-student caps. Transcript's worked example: IN EACH + Rotation + [FNP Clinical Practicum, FNP
          Rotation Part Two] + 1 places a student once in each. IN COMBINED sets a shared limit across the
          selection instead.
        gates_on:
          - "Students at their cap are excluded from that rule's slots for the run."
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.2 (APPE four required setting categories) — the Setting dimension of
          this rule builder is the closest existing mechanism to enforcing a required-setting distribution,
          but it expresses maxima, not minima. ACPE requires students to complete each of four categories;
          this can cap a category, not require one.
        competitor_equivalent: >
          Elentra documents "learner-driven elective selection within admin-set capacity rules" and CORE ELMS
          documents SmartMatch's "customizable rules" (content/competitors/elentra.yaml,
          content/competitors/core-elms.yaml). Both assert rule configurability; neither publishes a rule
          grammar, so the IN EACH / IN COMBINED distinction has no documented counterpart to compare against.
        gap_severity: "gap"
        gap_note: >
          Maxima-only is a genuine directional gap for Pharmacy and Medicine, where the accreditation-relevant
          constraint is a required minimum per category, not a ceiling. Expressing "every student must
          complete one ambulatory-care APPE" is not possible with this grammar.
      - element: "Restrict Placements in Overlapping Rotations (bit) + auto-detected overlap-group table with per-group opt-out"
        type: "toggle + system-generated group list + pencil override"
        data_shown: "System detects date-overlapping rotations and prevents a student from occupying two at once; specific rotations can be allowed to overlap."
        gates_on:
          - "Guards against double-booking within the run."
        accreditation_citation: "None — scheduling-integrity element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Per ../prism/capability-map.yaml this guard, paired with a per-course max-placement override, is also how split/combined rotation equivalences (one 6-month vs two 3-month blocks) are expressed."
      - element: "Pair Courses with Clinical Settings (bit) + per-course setting picker"
        type: "toggle + persistent mapping"
        data_shown: "Restricts a course to slots of specified settings. Transcript notes the mapping persists: \"these settings will be saved for future placement assist instances.\""
        gates_on:
          - "Only slots of the paired settings are eligible for that course in the run."
        accreditation_citation: >
          ACPE Standard 3, Key Elements 3.1.b and 3.2 (IPPE and APPE setting-category requirements) — this
          persistent course-to-setting mapping is the nearest existing structure to encoding a required-setting
          curriculum, though it constrains supply rather than verifying student attainment.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "The persistence is silent and cross-run — a mapping made once for a single group run quietly governs every later run, which is easy to forget and hard to notice."
      - element: "Customization Based on Slot Types / Slot Settings / Slot Status (three bits + weightage inputs)"
        type: "priority weighting"
        data_shown: >
          Higher weight means slots of that type, setting, or status are prioritized. The capability map's
          worked example is scarcity-driven weighting — Women's Health 10, Pediatrics 9 — so the hardest-to-fill
          specialties are allocated first.
        gates_on: []
        accreditation_citation: "None — allocation-policy element."
        competitor_equivalent: >
          No competitor teardown in this research documents attribute-level weighting. CORE ELMS' SmartMatch is
          the closest claim ("customizable rules and preferences"), and notably its documented weakness —
          reviewers report that "SmartMatch's extensive settings lack clear setup documentation/checklists"
          (content/competitors/core-elms.yaml, weaknesses) — is precisely the risk this screen carries too,
          which makes it the single most useful competitor datapoint in this stage for an onboarding narrative.
        gap_severity: "configure-needed"
        gap_note: >
          The weighting scale is undefined in the product: nothing states the range, whether weights are
          relative or absolute, or how the three dimensions combine. The Learn More hyperlink beside the
          max-placement rule builder is the only in-product explanation documented anywhere on this screen.
      - element: "Run Placement Assist button — and who is allowed to press it"
        type: "job trigger"
        data_shown: "Queues an asynchronous run; the admin lands on the History tab and may leave and return."
        gates_on:
          - "DISCIPLINE GATE: per ../prism/capability-map.yaml (sourced from Exxat help-center documentation), full self-service Placement Assist is limited to PT-PTA and OT-OTA programs; every other discipline must contact support to enable it, and the docs describe \"limited functionality\" outside those two."
        accreditation_citation: "None at the trigger itself."
        competitor_equivalent: >
          CORE ELMS markets SmartMatch across "15+ disciplines including pharmacy, dental, nursing, PT, OT, PA,
          veterinary, social work, and undergraduate medicine" with no discipline gating disclosed
          (content/competitors/core-elms.yaml). That is the sharpest competitive contrast in this entire stage.
        gap_severity: "gap"
        gap_note: >
          For all four expansion domains — Pharmacy, DO, Dentistry, Medicine — the most sophisticated feature
          in this stage is not self-service on day one. A new Pharmacy admin following the standard admin
          tutorial reaches this button and cannot press it without a support engagement, and the tutorial does
          not warn them.

  # ---------------------------------------------------------------------------
  - screen: "Placement Assist — Results and History"
    navigation_path: "Placements > [Course offering or Placement Group] > Placement Assist > History > View Results"
    action: >
      Admin evaluates the proposed allocation and decides which suggestions to commit. Suggestions are never
      auto-committed — the review-then-commit boundary is the defining behavior a new admin must understand.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 10/16 Managing Placements in Exxat Prism",
      lines 995 and 1009-1013 ("Placement Assist does not automatically place students in the proposed slots,
      so you can have the final say and make manual changes to the suggested placements").
    elements:
      - element: "Summary: distribution by course/rotation/setting, percentage receiving 1st/2nd/3rd/4th choice, distance histogram"
        type: "read-only analytics"
        data_shown: "Allocation quality of this run, expressed as preference satisfaction and geographic spread."
        gates_on: []
        accreditation_citation: >
          None directly, though this is the only place in the product where equity of placement outcomes is
          quantified — data adjacent to CODA Standard 2, Element 2-6 and COCA Standard 6, Element 6.9
          comparability arguments, but not framed or exportable as accreditation evidence.
        competitor_equivalent: >
          No competitor teardown in this research documents preference-satisfaction reporting. one45's claim
          is granular duty-hour and leave tracking "for accurate and simplified program and accreditation
          reporting" (content/competitors/one45.yaml) — reporting, but on a different subject entirely.
        gap_severity: "none"
        gap_note: >
          Strong artifact for the onboarding pitch: a new program can compare two configurations of the same
          run and see the preference-satisfaction difference before committing anything.
      - element: "Results table: student, suggested location, rank on their wishlist, course offering, rotation, supervisor, slot type, distance, result"
        type: "reviewable proposal list"
        data_shown: "Row per proposed placement, showing which ranked choice it satisfies."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Place (single) / select-all checkbox + Create Placement (bulk)"
        type: "explicit commit action"
        data_shown: "Nothing is written until pressed."
        gates_on:
          - "This is the human-in-the-loop boundary. The transcript is explicit that suggestions are proposals."
        accreditation_citation: >
          None directly — but the review-then-commit boundary is itself the control that keeps the algorithm
          from creating placements at sites with lapsed agreements or non-compliant students, given that the
          allocator's own constraint set (per step 20) contains no contract or compliance term.
        competitor_equivalent: >
          CORE ELMS' SmartMatch markets "instant results, eliminating wait times" (content/competitors/core-elms.yaml),
          which reads as auto-commit, but their public materials do not state whether a review step exists —
          so the comparison is suggestive, not documented.
        gap_severity: "none"
        gap_note: >
          Worth teaching explicitly during onboarding: Placement Assist proposes, the admin disposes, and runs
          are unlimited and non-destructive, so a new admin should be encouraged to run it repeatedly with
          different weightings before committing anything.
      - element: "View Setup of the Run"
        type: "configuration provenance"
        data_shown: "The exact option set used for that historical run."
        gates_on: []
        accreditation_citation: >
          None named in ../accreditation/, but this is the only reproducibility artifact for how a cohort's
          placements were allocated — the thing a site visit team would want if it ever questioned equity of
          placement assignment.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Quietly valuable and under-marketed: run configuration is retained per run, which makes the
          allocation decision auditable after the fact.

  # ---------------------------------------------------------------------------
  - screen: "Send Interest to Location (site-side input into the match)"
    navigation_path: "Placements > [Course offering] > Slots > (scroll right) Students Interested > [count hyperlink]"
    action: >
      Admin optionally gives sites a vote: share the interested students' contact details and resumes with
      the location, collect the site's ranking of those students, then place from the site's response. This is
      the third preference channel in the stage and a distinct program-policy decision at setup time.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 9/16 Managing Wishlists in Exxat Prism",
      lines 925-935.
    elements:
      - element: "Email Recipient pencil (at least one recipient required before sending)"
        type: "mandatory recipient picker"
        data_shown: "Which site personnel receive the student-interest link."
        gates_on:
          - "Send Interest to Location is unavailable until a recipient is selected."
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Interested-students table (student rows plus their submitted slot-wishlist data) + student multi-select"
        type: "selective disclosure control"
        data_shown: >
          Which students' information is shared. Transcript: \"locations can view student contact information
          and their resume\" and can then \"indicate their preference for the students interested in their
          available slots.\"
        gates_on: []
        accreditation_citation: >
          None in ../accreditation/. FERPA-adjacent rather than accreditor-driven: this shares identifiable
          student information with an external party. The comparable protection documented anywhere in the
          stage is the support-configured one-time-password gate over compliance data in placement emails
          (transcript lines 1139-1141), which does not apply here.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor file documents a site-side ranking channel."
        gap_severity: "configure-needed"
        gap_note: >
          Per-send selective disclosure with no standing policy control: nothing lets a program configure once
          what may be shared with sites; every send is an individual judgement call.
      - element: "Site's returned preference, visible back on the Students Interested view; then select students > Place"
        type: "external input surfaced inline, then commit"
        data_shown: "Placement options pre-fill from the slot the student expressed interest in."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: >
          Structurally this is a two-sided match (both student and site rank), which no competitor teardown in
          this research documents — every documented competitor mechanism (one45, MedHub, LEO/DaVinci, Elentra,
          New Innovations, eMedley) is one-sided learner ranking against admin-set capacity.
        gap_severity: "none"
        gap_note: >
          Genuine architectural differentiator worth surfacing in the onboarding narrative, but note it does
          not connect to Placement Assist: site preference informs a manual placement decision and is not an
          input the allocator can consume.

  # ---------------------------------------------------------------------------
  - screen: "Exxat One Schedules — processing external schedules into Prism slots and placements"
    navigation_path: "Dashboard > Exxat One section > Process Now  —  or Placements > Process Now  —  or left menu > Exxat One Schedules"
    action: >
      For programs on both products, the admin converts site-approved Exxat One schedules into Prism slots
      and placements, and maintains that link as schedules change. This is the terminal path of the
      availability-based wishlist introduced in step 14, and it is real setup work for PT/PTA and OT/OTA
      programs onboarding onto Prism with an existing Exxat One footprint.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, section "## Processing Schedules from Exxat One to
      Exxat Prism", lines 1897-1927; the wishlist-to-import loop is described end to end at
      /Users/romitsoley/Downloads/PTPTAVideosTranscripts.md lines 131-135 and
      /Users/romitsoley/Downloads/OTOTAVideosTranscripts.md lines 131-135.
    elements:
      - element: "Access gate: dual login required"
        type: "precondition"
        data_shown: "Transcript: \"you will only have access to the Exxat One / Exxat Prism linking section if you have login access to both Exxat One and Exxat Prism.\""
        gates_on:
          - "The entire section is invisible without dual access."
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: "Another day-one dependency that surfaces only by absence — the navigation entry simply is not there, with no explanation of why."
      - element: "Processing status tabs: To Be Added / Added to Prism / Requires Update"
        type: "queue segmentation"
        data_shown: "Where each Exxat One schedule stands relative to its Prism counterpart. Default date filter shows the next year; a Reset hyperlink clears it."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research; no competitor file documents a two-system schedule-reconciliation queue."
        gap_severity: "none"
        gap_note: ""
      - element: "Add to Prism drawer: link Site > link Location > select Rotation (nearest-dates recommendation) > slot details"
        type: "guided mapping wizard with reference pane"
        data_shown: >
          Left reference pane shows the Exxat One schedule's title, site, location, slot dates, slot details,
          and student. \"The rotation whose dates are closest to the schedule's dates is recommended.\" Location
          and rotation prefill from the mapping.
        gates_on:
          - "Site and location must be linked first if they were not linked previously."
        accreditation_citation: "None — data-migration mechanic."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research. This is the closest analog in the stage to a bulk-import comparison, and no competitor teardown documents import mechanics at field level."
        gap_severity: "none"
        gap_note: >
          Well-designed migration affordance — recommendation plus reference pane plus prefill — and the
          strongest onboarding-specific mechanic in the entire stage.
      - element: "Assign Student to Slot (bit)"
        type: "toggle governing slot-only vs slot-plus-placement import"
        data_shown: "Off imports a bare slot; on continues into student selection with the Exxat One student's email prefilled and the closest-matching Prism student recommended."
        gates_on:
          - "For group schedules: students may be left unassigned for some slots, but \"you need to place at least one student\" if the assign bit was enabled."
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Requires Update queue: eye-icon hover showing what changed; Update button"
        type: "change-detection queue"
        data_shown: >
          Three student-change types (assigned where none was, removed, replaced), two location-change types
          (assigned where none was, replaced), plus schedule cancellation. Last Updated column carries the
          timestamp.
        gates_on:
          - "Reconciliation is admin-driven — the system flags the divergence but does not resolve it."
        accreditation_citation: >
          None directly, though an unreconciled Requires Update row means the Prism placement record — the
          system of record for every accreditation report downstream — is knowingly stale.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          No documented alerting on this queue: a schedule can sit in Requires Update indefinitely with the
          Prism placement silently wrong, and nothing pushes the admin to look.
      - element: "Processed-from-schedule indicator on the resulting slot or placement"
        type: "provenance badge"
        data_shown: "Marks slots and placements that originated from an Exxat One schedule rather than being entered in Prism."
        gates_on: []
        accreditation_citation: >
          COCA Standard 6, Element 6.9 — same provenance logic as the Last Updated By column in step 8:
          externally-sourced capacity and internally-asserted capacity carry different evidentiary weight, and
          this badge is the only place the difference is recorded for imported records.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

