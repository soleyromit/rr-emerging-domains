# Element-level ground truth underneath admin-onboarding-product-setup.yaml, stage 7.
# SCHEMA v2: accreditation_citation / competitor_equivalent / gap_severity / gap_note live
# on each ELEMENT, not on the step.
#
# SOURCING NOTE (deliberate, and the reason this file exists in this form): every step below
# is confirmed directly against the raw admin-tutorial transcript at
# /Users/romitsoley/Downloads/exxat_transcripts.md, cited by section heading and line range,
# NOT against a help-center article that paraphrases the same video. Where a help-center doc
# or discipline playbook adds something the transcript does not say, it is cited as a named
# secondary source alongside the transcript, never in place of it.
#
# JOURNEY FRAMING: this is the day-one PRODUCT SETUP journey, not the live clinical cycle.
# The question at every screen is "what must a brand-new admin decide, configure, or be
# blocked on before this machinery can run at all?" — not "how do I place a student today."
# Where a step is unavoidably operational (running Placement Assist, reviewing a submission),
# it is included because a new admin must configure it correctly on day one or the first
# real cycle produces garbage.
flow_name: "Wishlists, Slot Requests & Placement Assist Setup"
maps_to_journey: "admin-onboarding-product-setup.yaml, stage 7"
persona: >
  Primary: Program Administrator new to the platform (see ../personas/role-program-admin.yaml).
  Secondary: Clinical Coordinator / DCE-DCE-equivalent, who inherits the slot-request calendar
  and wishlist cadence once setup is done (../personas/role-clinical-coordinator.yaml).
  Two non-login actors are configured-for but never onboarded here: site personnel, who
  respond to slot and location-update requests through a tokenized email link with no Prism
  account, and Exxat support, who is a hard gate on three separate setup paths in this stage
  (My Request form templates, the Field Application Form wishlist type, and Placement Assist
  self-service enablement outside PT/PTA and OT/OTA).

steps:
  # ---------------------------------------------------------------------------
  - screen: "Slot Setup — Slot Type & Supervision Type taxonomy"
    navigation_path: "Sites and Locations > Setup > Slot Setup"
    action: >
      Before any slot exists, the new admin edits the two controlled vocabularies that every
      downstream slot, wishlist filter, and Placement Assist weighting rule will reference:
      Slot Type (what kind of offer this is) and Supervision Type (the student-to-supervisor
      ratio). This is the true first action of the stage and is easy to skip — the transcript
      opens the Managing Slots tutorial here specifically because the defaults ship pre-populated
      and look finished.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, section "## 7/16 Managing Slots in Exxat
      Prism", lines 579-584 ("navigate to the sites and location section... click on the setup
      tab and select the slot setup section. The slot type identifier identifies slots which are
      unique from other ones... The supervision type slot identifier is typically used to indicate
      the ratio of experiential supervisors to students at the placement").
    elements:
      - element: "Slot Type list (pencil icon > editable label chips)"
        type: "controlled-vocabulary editor"
        data_shown: >
          The set of slot qualifiers a slot can carry. Transcript-confirmed shipped defaults, read
          off the Add Slot drawer: first come first served (FCFS), requires the student to submit a
          resume, requires the student to interview, needs to be filled, requested by the student.
          Admin may add program-specific types — the transcript's worked example is adding
          "GPA requirement" for slots with a minimum-GPA condition.
        gates_on:
          - "Slot Type values become selectable filters on the site-facing slot-request form (step 3), on the slot list, and as weightable priorities inside Placement Assist (step 13)."
        accreditation_citation: "None — this is a platform-mechanics taxonomy with no direct accreditor tie. Nothing in COCA, CODA, ACPE, or LCME prescribes how a program labels its own capacity offers."
        competitor_equivalent: >
          Partially comparable, and only for one value. LEO/DaVinci's Clerkship Lottery documents an
          "optional first-come-first-serve mode" as a lottery-level setting (content/competitors/leo-davinci.yaml,
          feature_teardown, Clinical & Experiential Education) — Prism instead models FCFS as a per-slot
          label that the allocator can weight. No competitor teardown in this research documents an
          admin-editable slot-qualifier vocabulary at all.
        gap_severity: "none"
        gap_note: >
          Real day-one trap rather than a product gap: the transcript notes the list order here is
          the exact dropdown order everywhere downstream, and that types are deactivated (not deleted)
          via the horizontal-ellipses "deactivate label" option. A new admin who never opens this
          screen inherits five defaults that may not match their program's actual offer types.
      - element: "Drag handle (double ellipsis) / up-down arrows on each type"
        type: "reorder control"
        data_shown: "Position in the list, which is the position in every Slot Type dropdown in the product."
        gates_on: []
        accreditation_citation: "None — presentation ordering, no accreditor tie."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Supervision Type list (pencil icon)"
        type: "controlled-vocabulary editor"
        data_shown: >
          Student-to-experiential-supervisor ratio labels. Transcript's worked example from the Add Slot
          drawer is "one student to two clinical instructors." Explicitly described as customizable:
          \"you can set up these supervision type indicators according to the needs of your program.\"
        gates_on:
          - "Selected per slot; carried onto every placement made from that slot; exposed as a filter on the site-facing offer form."
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.3.e (2:1 maximum student-to-preceptor ratio) — this is the only
          field in the entire stage where preceptor-ratio data is captured. But per
          ../accreditation/acpe.yaml, 3.3.e demands a real-time calculation across a preceptor's
          concurrently active placements that blocks or flags a violating assignment. This field is a
          free-text-ish descriptive label chosen by the admin, attached to a slot; nothing in the
          transcript computes a live ratio from it or blocks on it.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research — no competitor's public materials expose a supervision-ratio field on a capacity record."
        gap_severity: "gap"
        gap_note: >
          The ratio is descriptive metadata, not a constraint. A program can label a slot "1 student :
          1 CI" and then place three students against that supervisor through separate slots without the
          system objecting. For Pharmacy (ACPE 3.3.e) this is the difference between having the data and
          satisfying the standard. Related but distinct from the PA-only Max Placement Limit documented at
          ../flows/rotation-lifecycle--04-placement-allocation-scheduling-capacity-balancing.yaml, which
          caps Location+Setting+Cohort intake (and only warns), not per-preceptor caseload.

  # ---------------------------------------------------------------------------
  - screen: "Site Communications — Setup New Communication (step 1: what kind of ask is this)"
    navigation_path: "Sites and Locations > Emails > Setup New Communication"
    action: >
      Admin creates a reusable site-communication instance. The transcript is explicit that these
      "function much like templates. Once you add one, you can use it as many times as you want" —
      so this is genuine setup work, not a one-off send. Two independent bits decide what the
      instance is: request slots, request updated location information, both, or neither
      (neither = a plain informational email).
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 7/16 Managing Slots in Exxat Prism",
      lines 585-587 ("click on the setup new communication button... indicate if you would like to
      set up a general email, a slot request email, a location update request email, or both...
      If you want to set up a general informational email, leave both bits inactive").
    elements:
      - element: "Communication title"
        type: "input field"
        data_shown: "Label shown in the communications table and used to identify the instance when sending, tracking, and reading responses."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Request Slots (bit)"
        type: "toggle"
        data_shown: "Turns this instance into a capacity solicitation; unlocks the Request Slot configuration wizard (step 3)."
        gates_on:
          - "If inactive, the recipient's link contains no availability form at all."
        accreditation_citation: >
          COCA Standard 6, Element 6.9 — the standard requires demonstrating adequate capacity at each
          clinical site (a 3-year rolling average of students eligible against demonstrated site capacity,
          per ../accreditation/coca.yaml). This toggle is the mechanism by which capacity is actually
          solicited from sites, so it is upstream of the evidence, though it produces none itself.
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. eMedley's
          eduSched is described as including "site capacity management" (content/competitors/emedley.yaml)
          but its public materials do not describe a site-facing solicitation instrument, and no competitor
          file documents an outbound capacity-request campaign object.
        gap_severity: "none"
        gap_note: >
          This is a genuine Prism differentiator for the onboarding story: capacity arrives from the partner
          rather than being keyed in by staff. Worth noting it is the same toggle across all disciplines —
          nothing here is discipline-scoped.
      - element: "Request Updated Location Information (bit)"
        type: "toggle"
        data_shown: "Turns the instance into (or additionally into) a data-hygiene request asking the site to review its own record on file."
        gates_on:
          - "Unlocks the sub-checkbox set in step 4: Notes, Requirements, Housing and Parking Information Notes, Personnel."
        accreditation_citation: >
          None directly. Adjacent: LCME Standard 5, Element 5.5 (adequate clinical resources per site) and
          COCA 6.9 both depend on site records being current, but neither prescribes a periodic site-attested
          refresh, and this toggle produces no accreditor-facing artifact.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------------
  - screen: "Request Slot configuration (the slot-solicitation wizard)"
    navigation_path: "Sites and Locations > Emails > [communication] > Next > Request Slot"
    action: >
      Admin scopes exactly what the site is allowed to offer: which rotations, with what per-rotation
      instructions, and which setting / slot-type / supervision-type values the site may pick from.
      This is the highest-leverage configuration screen in the stage — it is where a program constrains
      partner input so the returned data is usable by Placement Assist later.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 7/16 Managing Slots in Exxat Prism",
      lines 587-599.
    elements:
      - element: "Choose Rotation (+ icon) — calendar-year filter, rotation multi-select, advanced-schedule sub-select"
        type: "modal multi-select picker"
        data_shown: "The upcoming rotations this request collects availability for; where a rotation has an advanced schedule, individual sub-blocks can be selected."
        gates_on:
          - "HARD PREREQUISITE, stated explicitly in the transcript: \"these future rotations need to be added and then select in this section.\" Rotation Setup (stage 6 territory) must be complete before a slot request can be composed at all."
        accreditation_citation: "None directly — scoping control."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          Day-one sequencing dependency that bites new admins: rotations must exist first. A program that
          onboards mid-cycle and wants to solicit capacity for next year cannot do so until it has built
          next year's rotation shells.
      - element: "Instruction Notes (+ icon, per rotation row) and rotation Notes hover icon"
        type: "per-row free-text note"
        data_shown: >
          Per-rotation guidance shown to site personnel on the response form (transcript example: \"you may
          want to leave a note if you only want slots of specific settings for that rotation\"). The separate
          hover icon surfaces internal rotation notes carried from Rotation Setup.
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Setting / Slot Type / Supervision Type dropdowns (deselect-to-exclude), plus Slot Type and Supervision Type enable bits"
        type: "constraint multi-selects + toggles"
        data_shown: >
          Which values the site may choose when offering. Transcript's worked example: deselect Inpatient so
          the site cannot offer inpatient slots. Turning the Slot Type or Supervision Type bit off entirely
          lets \"sites offer slots without specifying slot or supervision types.\"
        gates_on:
          - "Directly constrains the site-facing form's option set."
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.3.e again, obliquely: switching the Supervision Type bit off is the
          documented way to make ratio capture optional, which is a configuration choice a Pharmacy program
          would need to get right in the opposite direction (always required) to have any 2:1 data at all.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          Silent data-quality lever. A new admin who leaves supervision type optional gets slots with null
          ratios back, and no screen later flags them as incomplete.
      - element: "Auto-notification: Slot Confirmation (bit + linked email template)"
        type: "toggle + template editor with @-triggered merge fields"
        data_shown: "Auto-emails both the responding personnel and the school when a location submits availability. Template has separate Site and School tabs, subject and body, and a View Sample Email preview."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. No competitor file
          documents notification-template authoring with merge fields, which is the closest analog to a
          general 'notification templates' setup feature the brief anticipates.
        gap_severity: "cosmetic"
        gap_note: >
          Scoping gotcha the transcript calls out verbatim: \"changes to this email template will apply for
          all the configured slot requests.\" The template is global, not per-communication-instance, so a
          new admin editing wording for one campaign silently rewrites it for every campaign.
      - element: "Auto-notification: Contact Later for Slots (bit + template)"
        type: "toggle + template editor"
        data_shown: "Fires a reminder on the future date a site itself nominated when it chose \"contact me later\" on the response form."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: "Notable as a genuinely site-driven scheduling primitive — the partner sets the follow-up date, not the program."
      - element: "Allow site personnel to add slots at the site level (bit)"
        type: "toggle"
        data_shown: "Lets personnel offer capacity without naming a location — for sites that know they have room but not yet where."
        gates_on:
          - "Adds an extra site-level section to the responder's form."
        accreditation_citation: >
          COCA Standard 6, Element 6.9 — negatively relevant. Site-level slots are, by construction, not
          attributable to a specific clinical site record, so any per-site capacity-adequacy rollup will
          under-count or mis-attribute them until they are resolved to a location.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          Convenience toggle with a reporting cost. Turning it on for onboarding ease creates unlocated
          capacity that must be reconciled before per-site capacity evidence is trustworthy.
      - element: "School Contact Information section"
        type: "contact picker"
        data_shown: "Which school contacts receive the slot-confirmation notification, and whose contact details are exposed to the site."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Instructions and Documents (+ icon: notes textarea + Browse to Upload)"
        type: "rich note + file attachment"
        data_shown: "Material the site sees while responding. Transcript example: attach the clinical education schedule describing the curriculum for the requested rotations."
        gates_on:
          - "Subject to a stated supported-file-type and size limit shown below the control."
        accreditation_citation: "None directly — though this is where a program would attach curriculum context a site needs, which is adjacent to ACPE 3.5.b / COCA 6.9 partner-facing documentation practice rather than evidence for it."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------------
  - screen: "Request Updated Location Information configuration"
    navigation_path: "Sites and Locations > Emails > [communication] > Next > Request Updated Location Information"
    action: >
      Admin picks which slices of the location record the site is asked to verify. Anything not
      checked is simply not shown to the site, so this doubles as a scoping decision about how much
      partner attention to spend.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 7/16 Managing Slots in Exxat Prism",
      lines 601-603.
    elements:
      - element: "Notes / Requirements / Housing and Parking Information Notes / Personnel checkboxes"
        type: "checkbox set"
        data_shown: >
          Which categories of location data the site reviews. Transcript's worked example: request only
          housing-and-parking updates and leave the rest inactive when the other data is known-current.
        gates_on:
          - "Unchecked categories are absent from the site-facing update form; the transcript's stated workaround is to ask for anything else in free text via Instructions and Documents."
        accreditation_citation: >
          None directly. The Requirements category is the one with downstream accreditation weight — site
          requirements drive the student Requirement Upload gate visible in Placement Clearance and the
          Placement 360 dashboard — but the checkbox itself carries no standard.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Site-submitted response is notes-only, not a structured edit"
        type: "read-only behavior of the responder form"
        data_shown: >
          Transcript: \"The location's information will be displayed. The personnel can then review this
          information and provide notes in the notes text area.\" The site cannot change its own record;
          it describes the change in prose.
        gates_on:
          - "Admin must manually re-key the change on the Locations page, then return to the Response Report and click Mark as Updated."
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Asymmetry worth naming for the onboarding narrative: slot requests write structured data straight
          into the system, but location-update requests do not — they generate a prose to-do for a human.
          This is a hidden ongoing staffing cost a new admin does not see at setup time.

  # ---------------------------------------------------------------------------
  - screen: "Send Emails — recipient selection (Locations tab vs Personnel tab)"
    navigation_path: "Sites and Locations > Emails > [communication row] > Send Emails"
    action: >
      Admin chooses who receives the request — by location or by individual personnel — filters the list,
      and paginates through selecting recipients.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 7/16 Managing Slots in Exxat Prism",
      lines 605-613.
    elements:
      - element: "Locations table (name, site, personnel, settings, categories, last-request date and status)"
        type: "filterable multi-select table"
        data_shown: "Every location in the system with the outcome of the last request sent to it, so a new admin can see coverage at a glance."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Save Changes button while paginating"
        type: "button (explicit-save affordance)"
        data_shown: "Persists selections made on the current page."
        gates_on:
          - "Transcript's own warning: \"we recommend you click the save changes button as you navigate the pages to select the locations and not lose any of your selections.\""
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "cosmetic"
        gap_note: >
          Selection state is not durable across pagination without an explicit save — a documented
          UX sharp edge, and exactly the kind of thing that burns a first-time admin sending their
          first campaign to a few hundred locations.
      - element: "Personnel tab (designation, email, category, practice setting, experiential-supervisor flag, communication preferences, associated sites/locations, last emailed)"
        type: "alternate filterable multi-select table"
        data_shown: "Person-level targeting instead of location-level."
        gates_on:
          - "Switching tabs \"will clear any selected locations and filters\" and requires a Yes confirmation — the two modes are mutually exclusive per send."
          - "A personnel member with no associated site or location cannot be selected to receive slot or location-update requests at all."
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          Two setup dependencies converge here and both trace back to earlier onboarding stages: personnel
          must be associated to a site/location, and their Communication Preferences must permit slot or
          location requests. A new admin whose personnel import skipped either field finds recipients
          silently unselectable with no inline remediation path.
      - element: "Overview screen (count of sites/locations, count of personnel recipients, request type)"
        type: "read-only pre-send summary"
        data_shown: "Blast radius confirmation before composing."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------------
  - screen: "Compose Email — template library, merge fields, send-now vs schedule"
    navigation_path: "Sites and Locations > Emails > [communication] > Send Emails > Compose Email"
    action: >
      Admin selects or authors the outbound email template, previews the rendered message, and either
      sends immediately or schedules it for a future date. Template authoring here is the same control
      used for student, location-contact, and experiential-supervisor notifications elsewhere in the
      stage, so getting it right once pays off repeatedly.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 7/16 Managing Slots in Exxat Prism",
      lines 613-617; identical template mechanics restated for student notifications at lines 859-861
      and for placement notifications at lines 1121-1125.
    elements:
      - element: "Template list with Add Template / Edit / trash"
        type: "template CRUD"
        data_shown: "Template name, subject, header and footer layout, body."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. This is the
          nearest thing in the stage to the 'notification templates' comparison the brief anticipates, and
          the honest answer is that no competitor file in content/competitors/ documents template authoring.
        gap_severity: "none"
        gap_note: ""
      - element: "Merge fields (@-symbol picker)"
        type: "token inserter"
        data_shown: "Context-specific tokens (recipient first name, last name, and elsewhere Placement Table fields) resolved at send time."
        gates_on: []
        accreditation_citation: >
          None here, but note the related compliance-protection behavior documented at transcript lines
          1139-1141: when student compliance information is sent to a site contact via merge field, an
          optional support-configured one-time-password gate can be layered on. That protection is opt-in
          and requires contacting prism-support@exxat.com.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "configure-needed"
        gap_note: >
          The OTP protection over merge-fielded compliance data is not on by default and is not surfaced
          in the compose flow — a new admin building templates on day one would not know it exists.
      - element: "Send Now / Schedule (date picker) + left-pane live preview"
        type: "radio + date picker + preview pane"
        data_shown: "Rendered email as the recipient will see it."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""

  # ---------------------------------------------------------------------------
  - screen: "Email Dashboard — deliverability telemetry"
    navigation_path: "Sites and Locations > Emails > [communication row] > Email Dashboard icon"
    action: >
      Admin verifies the campaign actually landed. For a new program this is the first real feedback
      loop on the quality of the personnel email data imported in earlier onboarding stages.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 7/16 Managing Slots in Exxat Prism",
      lines 617-625.
    elements:
      - element: "Status column: In Progress / Dropped / Bounced / Delivered / Opened / Link Clicked / Scheduled, with per-status counts at top"
        type: "read-only rollup with refresh icon"
        data_shown: >
          Per-recipient delivery state. Transcript defines each: Delivered = sent not opened, Opened =
          opened but link not accessed, Link Clicked = request page reached, Dropped/Bounced = undeliverable
          (escalate to v4support@exxat.com after checking the address).
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: >
          Genuinely strong onboarding-feedback surface: a brand-new program can measure the quality of its
          imported site-contact data on day one from the bounce count, before any placement work depends on it.
      - element: "Wrench icon (column editor: drag-reorder, delete, Add a Column) and Export icon"
        type: "table personalization + Excel export"
        data_shown: "Same column-management control pattern repeated across every table in this stage."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Cancel a scheduled email (checkbox + X icon)"
        type: "destructive action"
        data_shown: "Withdraws a not-yet-sent scheduled campaign."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "View hyperlink (request link) — the site-facing response page"
        type: "preview of the external, no-login responder experience"
        data_shown: >
          A per-location section where personnel enter availability for the requested rotations, or choose
          \"contact me later\" with a date, or \"unable to accept students at this time.\" Sites can see and
          amend slots the school already entered for that location. If site-level slots were enabled, an extra
          unlocated section appears. If a location-update request was included, a separate Update Location
          Information tab appears per location.
        gates_on: []
        accreditation_citation: "None directly — but this is the origin point for the capacity data COCA 6.9 evidence would later be computed from."
        competitor_equivalent: >
          Not documented at this granularity by any competitor teardown in this research. No competitor file
          documents an unauthenticated, tokenized partner-facing capacity form — the closest adjacent claim is
