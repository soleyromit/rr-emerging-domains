      - element: "Compliance panel: Some Action Needed / View Compliance, Pending Review flags, expires-during-placement alert icon"
        type: "embedded compliance gate with inline review"
        data_shown: >
          Student compliance state surfaced inside the request, including an alert when a document expires
          during the proposed placement window. Documents are reviewable and updatable without leaving the page.
        gates_on:
          - "Advisory. Transcript: \"Ideally, before you make a placement, you want to make sure the student is fully compliant\" — ideally, not enforced. Create Placement is not documented as blocked."
        accreditation_citation: >
          COCA Standard 6 and CODA-adjacent student-readiness expectations, and per ../accreditation/coca.yaml
          and ../accreditation/coda.yaml, Compliance Management is described as gating placement
          start/continuation on student-level items. This screen surfaces the same data but the gate is
          advisory at the point of placement creation.
        competitor_equivalent: >
          CORE ELMS documents compliance tracking (immunizations, CPR, background checks, drug screens, HIPAA
          training, licensing, with expiration reminders) at parity with Prism (content/competitors/core-elms.yaml),
          but nothing in their public materials describes compliance state embedded in a student-request review
          screen, so the placement of this control is not comparable.
        gap_severity: "configure-needed"
        gap_note: >
          Compliance, contract, and preceptor are all visible and all advisory here. For the four expansion
          domains this is exactly the combination that makes the auto-approve setting in step 10 dangerous.
      - element: "Search Location > (found) Save | (not found) Add New Location > Add New Site cascade"
        type: "record-resolution workflow with inline creation"
        data_shown: >
          Resolves the student's free-text location to a real Prism record, creating site and location records
          inline if necessary. Transcript note: \"when you add a new site, the system automatically creates it
          as a location as well.\"
        gates_on:
          - "Location must be linked before a placement can be created from the request."
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.5.b and COCA Standard 6, Element 6.9 — this is the moment an unvetted,
          student-sourced facility enters the program's site inventory. The View Contract button beside it is
          the only contract check on the path, and it is a link, not a gate.
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "gap"
        gap_note: >
          Inline site creation with no contract prerequisite is the cleanest example in this stage of setup
          convenience trading against accreditation control. A new admin should be told explicitly that this
          path can populate the site inventory with facilities that have no executed agreement.
      - element: "Search Preceptor / Add Preceptor > document-mapping step (choose personnel profile sections for uploaded files)"
        type: "record resolution + file routing"
        data_shown: "Links the request to a personnel record and files the student's uploaded documents into named sections of that preceptor's profile."
        gates_on: []
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.3.a-d (preceptor credentialing: license number, status, expiration
          linked to every supervised placement, per ../accreditation/acpe.yaml) — this document-mapping step is
          where student-supplied preceptor credentials land in the credential record, which makes it an
          accreditation-relevant data path, not merely a filing convenience.
        competitor_equivalent: >
          eMedley's eKeeper and CORE ELMS both document preceptor credential/license tracking
          (content/competitors/emedley.yaml, content/competitors/core-elms.yaml), but neither documents
          student-submitted documents being routed into a preceptor profile, so this specific mechanic has no
          documented equivalent.
        gap_severity: "none"
        gap_note: "Genuinely clever: it turns a student-collected artifact into a durable credentialing record instead of a one-off attachment."
      - element: "Share Preceptor Form / Preceptor Form Share > Share Again; View Preceptor Form; Audit Log; Edit Student Response; Move Request; Delete"
        type: "form routing + audit + record maintenance controls"
        data_shown: >
          Two distribution models (auto-sent on student submission, or admin-initiated). Audit Log shows when
          and by whom the request was updated. Move Request relocates a submission to another course offering.
        gates_on:
          - "Move Request has two hard preconditions: the destination course offering must use the identical My Request form, and both offerings must derive from the same course in the course list."
          - "Share Again appears only for admin-distributed forms."
        accreditation_citation: "None directly — the Audit Log is the accreditation-adjacent element, providing change provenance on placement-origination decisions, but no standard in ../accreditation/ names it."
        competitor_equivalent: "Not documented at this granularity by any competitor teardown in this research."
        gap_severity: "none"
        gap_note: ""
      - element: "Four status dropdowns (student compliance / preceptor / contract / overall request) + Update, then Create Placement"
        type: "multi-status gate then commit"
        data_shown: "Overall status set to Placement Confirmed is the documented precondition for placing."
        gates_on:
          - "All four are admin-set values, not computed from the underlying records — the admin asserts the contract is approved, the system does not verify it."
        accreditation_citation: >
          ACPE Standard 3, Key Element 3.5.b; COCA Standard 6, Element 6.9 — a human-asserted contract status
          is weaker evidence than a system-verified link to an executed, in-date agreement, which is what both
          standards' evidence expectations describe.
        competitor_equivalent: >
          eMedley's eKeeper documents "affiliation agreement tracking with auto-expiration reminders" and
          CORE ELMS documents "affiliation agreement tracking with expiration alerts"
          (content/competitors/emedley.yaml, content/competitors/core-elms.yaml). Neither documents whether
          agreement state gates a placement action, so we cannot say whether their controls are computed or
          asserted either — the honest comparison is that both sides are undocumented at this depth.
        gap_severity: "gap"
        gap_note: >
          Four manually-asserted statuses standing in for four verifiable system facts. Note the mitigation
          that does exist elsewhere: the Placement 360 dashboard and the Placement Clearance list both compute
          real contract and requirement status after the fact (transcript lines 1093-1099, 1147-1161). The gap
          is that the computed check happens downstream of the decision, not at it.

