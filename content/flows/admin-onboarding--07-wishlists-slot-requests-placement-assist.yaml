      the preceptor agreement, and set four separate statuses before a placement can be created.
    confirmed_by: >
      /Users/romitsoley/Downloads/exxat_transcripts.md, "## 9/16 Managing Wishlists in Exxat Prism",
      lines 873-905.
    elements:
      - element: "Dashboard graphs: submitted requests by status, courses by My Request status, students by My Request status"
        type: "clickable read-only rollups"
        data_shown: "Queue shape; clicking a bar deep-links to the filtered All Requests table."
        gates_on: []
        accreditation_citation: "None — platform-mechanics element."
