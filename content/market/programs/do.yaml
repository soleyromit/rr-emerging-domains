  source_id: "crm-export-new-logo-grid-2026"
  sheet: "DO"
  extracted: "2026-09-12"
  row_count: 57
  pii_policy: >
    Contact names/emails/phone numbers are deliberately NOT mirrored here. The
    source spreadsheet remains the system of record for contact data; this file
    holds counts, status, and structure only so content/ stays shareable.

