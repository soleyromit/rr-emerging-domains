# DO — the per-program ground-truth registry under content/domains/do.yaml's
# market_sizing block. Level 1: every row cites Level 0 (the CRM export below)
# and nothing above it. See content/market/programs/_TEMPLATE.yaml for the
# field-by-field schema and content/market/programs/pharmacy.yaml for the sibling
# file this one follows.
#
# HOW THIS FILE WAS BUILT (2026-09-12), so a reader can re-derive it rather than
# trust it:
#   * Rows are the "DO" sheet of the new-logo-grid export, verbatim and in sheet
#     order. Its header sits on row 2, not row 1 (the same quirk the Pharmacy
#     sheet has), and there are 57 data rows: sheet rows 3-61, with rows 5 and 6
#     blank, then 104 entirely blank rows (62-165) that are not data. `locator`
#     on each row is the sheet cell its name came from.
#   * THE ROWS ARE TEACHING LOCATIONS, NOT INSTITUTIONS. 14 institutions repeat
#     across campuses (Edward Via 4, Lake Erie 4, Michigan State 3, Ohio 3,
#     Philadelphia COM 3, and 9 more with 2 each), so the 57 rows sit at 36
#     distinct institutions. Anything reading this file as a count of schools
#     must deduplicate on `institution` first.
#   * That 57 matches neither figure in do.yaml's own `market:` prose, which
#     cites AACOM for "48 accredited colleges ... at 75 teaching locations". The
#     discrepancy is stated, not resolved: this is a CRM sheet with its own
#     coverage, not an accreditor directory, and nothing in the export explains
#     the gap. Do not reconcile the two by arithmetic.
#   * institution / program_name: the sheet gives ONE name string per row. It is
#     split into the institution and the osteopathic program designation it
#     embeds ("Michigan State University" + "College of Osteopathic Medicine");
#     where the whole name IS the school and carries no separable institution
#     (e.g. "Lake Erie College of Osteopathic Medicine"), program_name is null
#     and the full name stays in `institution`. That is the case on 19 rows
#     file-wide, spread across 10 such institutions — it is NOT a count of any
#     one school's campuses (Lake Erie itself has 4 rows). The split is
#     hand-made per row, not regex-derived — "Arkansas College of Osteopathic
#     Medicine" has no institution prefix to strip, while "Ohio University
#     Heritage College of Osteopathic Medicine" does.
#   * slug is "{institution-slug}-do", with the sheet's City appended
#     ("{institution-slug}-{city}-do") on every row whose institution appears
#     more than once, since a bare institution slug would collide across
#     campuses. Those rows also carry the campus in `notes`, because the schema
#     has no city field and the teaching location is this domain's real unit.
#   * accreditation_status is "unknown" on ALL 57 rows. This is not a gap in the
#     extraction: the DO sheet HAS NO accreditation-status column at all, unlike
#     the Pharmacy sheet. What it has is a "Year of Accreditation" column
#     (column H, populated on all 57 rows, ranging 1892-2020) — a year, not a
#     current status, and this schema has no field for it. Reading "has a year"
#     as "accredited today" would be an inference the sheet does not make, so
#     the year is deliberately NOT mirrored; it stays one cell away from each
#     row's cited locator, at DO!H{row}.
#   * class_size is null on all 57 rows and exxat_since is null on all 57 — the
#     DO sheet carries neither column. Contact columns it DOES carry (contact
#     name, title, email) are deliberately not mirrored. See pii_policy.
#   * exxat_status maps the sheet's Client Y/N column: Yes -> client (2 rows),
#     No -> not-tracked (55). The value "Previous client" that the Pharmacy
#     sheet uses never appears on this sheet, so DO has ZERO churned rows —
#     an observed absence, not an unchecked field. A plain "No" is NOT read as
#     `prospect`; the sheet carries no signal distinguishing an actively
#     prospected school from a cold one.
#   * CROSS-SHEET CONFLICT, recorded rather than resolved. The master Logo Grid
#     sheet has its own "DO/Doctor of Osteopathic Medicine" column — column 30
#     (AD) — and across its 2751 data rows exactly 3 mark it "Yes":
#       - Logo Grid row 1773, "Des Moines University - Osteopathic Medical
#         Center" (IA) — agrees with this sheet's client row.
#       - Logo Grid row 2274, "Noorda College of Osteopathic Medicine" (UT) —
#         but THIS sheet's Client Y/N column says "No".
#       - Logo Grid row 1312, "Arkansas College of Health Education" — a name
#         the DO sheet does not carry at all. Note it is filed under state "AK",
#         not "AR", so a reader searching the grid by institution name or state
#         alone will miss it. Meanwhile the DO sheet's Arkansas College of
#         Osteopathic Medicine client row matched its own exact-name grid row,
#         Logo Grid row 1050 (filed under "CO"), which marks DO "No".
#     ACHE is plausibly ARCOM's parent on the same Fort Smith campus, which would
#     reconcile the Arkansas half — but neither sheet states that, so it was NOT
#     applied here. exxat_status follows the DO sheet, the domain's own tab, on
#     every row; the two conflicting rows say so in `notes`. A later pass with
#     CRM access should settle which sheet is stale — on the grid's reading there
#     would be 3 DO clients, not 2, and penetration 5.3% rather than 3.5%.
#   * other_disciplines_on_campus lists the disciplines the master "Logo Grid"
#     sheet marks "Yes" (i.e. already an Exxat client) for the SAME institution,
#     DO itself excluded. A discipline the grid marks "No", "N/A" or "-" is not
#     listed. Discipline labels follow Task 2.1's mapping: the grid's headers are
#     rewritten to this repo's canonical domain labels where one exists (PT ->
#     Physical Therapy, OT -> Occupational Therapy, PA -> Physician Assistant,
#     NURS -> Nursing, SLP -> Speech-Language Pathology, MD -> Medicine, SW ->
#     Social Work); columns with no canonical label keep the grid's own header
#     verbatim (CCS, AT, PTA, ...) rather than being expanded into a guess.
#   * Which grid row a program matched, where more than one named the same
#     institution, was decided by this ladder, applied by hand and recorded in
#     `notes` wherever the answer is not the obvious one: (1) a grid row naming
#     this program's own campus/city wins; (2) else a row whose State agrees with
#     the program's State; (3) else the row with evaluated discipline cells and
#     the most information. Rule (3) is what keeps the Liberty, Touro, Kansas
#     City, Rocky Vista and Incarnate Word rows off the grid's appended
#     COM-named duplicates, whose discipline cells are "#N/A" in 35 of 36
#     columns (see the caveat below).
#   * THE #N/A CAVEAT — read before aggregating. All 57 rows are
#     grid_matched: true; not one DO program is missing from the Logo Grid. But
#     11 of them (Edward Via x4, Lake Erie x4, Oklahoma State CHS x2, Idaho)
#     matched a grid row carrying the literal Excel error "#N/A" in 35 of its 36
#     discipline columns — an unevaluated lookup, not a checked "no". The 36th is
#     the DO column itself, which holds a real "No"; it is excluded from
#     other_disciplines_on_campus by definition (a program is not its own
#     cross-sell), not because it is unevaluated, so it rescues nothing. For
#     those 11 the empty
#     other_disciplines_on_campus list is UNKNOWN, exactly what grid_matched
#     exists to keep apart, and the boolean cannot say so because a row WAS
#     found. So: of the 24 rows with an empty list, 13 are confirmed negatives
#     and 11 are unknowns, and `grid_matched` alone will not separate them.
#     Every one of the 11 says so in `notes`, but prose is human context, not a
#     machine-checkable flag — an aggregate that needs the distinction must
#     exclude these 11 locators explicitly: DO!A12-A16, A19-A22, A40, A41.
#   * region comes only from the matched grid row's Region column, and only when
#     that grid row's own State agrees with the program's State. 17 rows have a
#     null region: the grid leaves Region blank on the appended COM rows (11 of
#     the 17), or it files the institution under a state this campus is not in
#     (Arkansas COM under CO, A.T. Still under AZ, NYIT's Jonesboro campus under
#     NY, PCOM's two Georgia campuses under PA, Rocky Vista's Utah campus under
#     CO). Those rows keep the institution's disciplines and drop the
#     contradicted region rather than mirror a wrong one.
#   * incumbent_vendor is "unknown" on all 57 rows and incumbent_evidence is null
#     to match. Nothing in this export says which competitor any individual
#     program runs; per-program incumbency is separate research, and "unknown" is
#     a real, countable answer.
#   * This file does NOT carry product gaps, competitor differentiation or a
#     feature matrix for DO. Those exist for Pharmacy because a domain-expert
#     session was held (2026-09-04); no such session exists for DO, and
#     content/dissection/do.yaml records that absence as the gap it is.

domain: "DO"

