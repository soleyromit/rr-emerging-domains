# Dentistry — the per-program ground-truth registry under
# content/domains/dentistry.yaml's market_sizing block. Level 1: every row cites
# Level 0 (the CRM export below) and nothing above it. See
# content/market/programs/_TEMPLATE.yaml for the field-by-field schema and
# content/market/programs/do.yaml for the sibling file this one follows.
#
# HOW THIS FILE WAS BUILT (2026-09-12), so a reader can re-derive it rather than
# trust it:
#   * Rows are the "Dentistry" sheet of the new-logo-grid export, verbatim and in
#     sheet order. Its header sits on row 2, not row 1 (the same quirk the
#     Pharmacy and DO sheets have), and there are 968 data rows: sheet rows
#     3-974, with rows 12-15 blank. `locator` on each row is the sheet cell its
#     institution name came from.
#   * THE SHEET IS THREE BLOCKS WITH DIFFERENT PROVENANCE, and the boundaries are
#     exact: rows 3-11 are a hand-kept client list (9 rows, every one "Yes");
#     rows 16-971 are a pasted CODA program-directory dump (956 rows, every one
#     "No", alphabetical by institution, every one of them carrying the program
#     director and accreditation-visit columns the client block leaves empty); rows
#     972-974 are a hand-kept churned list (3 rows, every one "Previous client").
#     Only row 8 sits in the client block WITH directory-style detail. Reading
#     the file as one uniform export will mislead: 956 of the 968 rows were never
#     a CRM judgment about a prospect, they are a directory paste.
#   * THE ROWS ARE PROGRAMS, NOT INSTITUTIONS. The sheet gives one row per
#     CODA-recognized program, so a dental school with a predoctoral program plus
#     five residencies is six rows. The 968 rows sit at 531 distinct institutions
#     (matched on a case/punctuation-normalized institution name). Anything
#     reading this file as a count of schools must deduplicate on `institution`
#     first.
#   * AND THEY ARE NOT ALL PREDOCTORAL DENTISTRY. By the sheet's own Discipline
#     Code column (28 distinct codes): 45 rows are PREDOC (the DDS/DMD program),
#     215 are Dental Hygiene, 174 Dental Assisting, 10 Dental Laboratory
#     Technology, 1 Dental Therapy, 512 are advanced/postdoctoral education
#     (GPR, AEGD, OMS, ORTHO, PERIO, ENDO, PROS, PEDDENT, DPH and the rest), and
#     11 carry no code at all. So this file's row count is NOT comparable to the
#     "77 CODA-accredited predoctoral programs" figure in dentistry.yaml's own
#     `market:` prose — that figure counts only what 45 of these rows are. The
#     two are different populations, and nothing here reconciles them.
#   * THE DIRECTORY BLOCK IS TRUNCATED — read before treating any count here as
#     national. Its 956 rows are alphabetical by institution name and run the
#     full A-to-Z ("A.T. Still" to "Zucker"), but its State column holds only 32
#     values, every one alphabetically at or before NY. Seventeen states have no
#     row ANYWHERE IN THIS BLOCK: ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VA,
#     VT, WA, WI, WV, WY. Read that as scoped to the 956-row block and not to the
#     file: two of the seventeen do appear elsewhere in the sheet, because the
#     hand-kept client and churned blocks are not subject to the same filter — OR
#     on row 4 and TX on rows 5, 9 and 972. Within the directory block itself the
#     absence is total: there is no Ohio State, no Temple, no Pittsburgh, no
#     University of Texas or Washington row. A state filter was evidently
#     applied to the source before it was pasted; the sheet does not say so, and
#     this file does not guess at what was dropped. Any national TAM built on
#     this count is short by whatever those 17 states hold.
#   * institution / program_name: unlike the DO sheet, this one has a dedicated
#     Branch column, so NO name-splitting was performed. `institution` is column
#     A verbatim (leading/trailing whitespace stripped — the directory block
#     prefixes every name with a space) and `program_name` is column B
#     ("Dental Hygiene", "Oral and Maxillofacial Surgery", "PREDOC", ...), or
#     null on the 9 rows where column B is blank. One consequence, left as the
#     sheet wrote it: the client row "University of Florida - Dentistry" carries
#     its program designation inside the institution string, and was not split.
#   * slug is "{institution-slug}-{discipline-code-slug}", falling back to the
#     Branch text and then to "dentistry" on the 11 rows with no discipline code.
#     That combination is unique across all 968 rows with no collisions, which is
#     why no city or campus suffix was needed (the DO file's slugs required one).
#   * accreditation_status maps the sheet's own Accreditation Status column:
#     "Approval without Reporting Requirements" (816) and "Approval with
#     Reporting Requirements" (34), plus their numbered "(1)"-"(6)" variants
#     (67 rows) -> accredited, 917 rows in total. "Initial Accreditation" and
#     "Initial Accreditation (2)" (22) -> candidate. "Discontinued" (11),
#     "(teach-out)" (5) and "(intent to withdraw)" (2) -> closing, 18 in total.
#     Blank (11) -> unknown. Two mapping judgments are recorded rather than
#     hidden: CODA's "Initial Accreditation" is the status of a program that has
#     not yet enrolled students, and this schema has no such value, so `candidate`
#     is the nearest neighbour, not a synonym; and the numbered suffixes are
#     unexplained anywhere in the workbook and were treated as the same status as
#     the unsuffixed text. Every row whose status text is not the plain baseline
#     carries that text verbatim in `notes`, so both judgments are reversible.
#   * class_size is null on all 968 rows and exxat_since is null on all 968 — the
#     sheet carries neither column. Contact and location columns it DOES carry
#     (Program Director, Email, Address 1/2, City, Zip Code, Website) are
#     deliberately not mirrored; note the Email column holds a phone number on
#     some rows. See pii_policy.
#   * exxat_status maps the sheet's Client Y/N column: Yes -> client (9 rows),
#     Previous client -> churned (3), No -> not-tracked (956). A plain "No" is
#     NOT read as `prospect` — and here that matters more than usual, because all
#     956 "No" values sit in the directory block (rows 16-971) and not one of them
#     sits anywhere else: they are a paste, not a CRM judgment about a prospect.
#   * THE 9 CLIENT ROWS SIT AT 8 INSTITUTIONS, and four of the twelve
#     client/churned rows contradict something else in this same sheet. All four
#     are recorded in `notes` and none is resolved here:
#       - Rows 3 and 8 are both Northern Arizona University, both "Yes". Row 8
#         adds the Dental Hygiene program detail; whether the two rows are one
#         program or two, the sheet does not say.
#       - Row 5 "The University of Texas Health Science Center at Houston" is a
#         client while row 972 "UTHealth Houston School of Dentistry" is churned.
#         By name these are the same university; the sheet never reconciles them,
#         and neither does this file.
#       - Row 6 "University of the Pacific" is a client while rows 886-890,
#         "University of the Pacific Arthur A. Dugoni School of Dentistry", are
#         all "No".
#       - Row 11 "University of Florida - Dentistry" is a client while rows 758
#         and 759 (University of Florida College of Dentistry/Seminole, and
#         University of Florida, Hialeah) are "No".
#       - A fifth oddity, of a different kind: FOUR of the client/churned
#         institutions have no row in the 956-row directory block at all, even
#         though their state IS covered by it, so the truncation above does not
#         explain the absence. They are Hinds Community College (MS, a state with
#         13 directory rows), University of Missouri at Kansas City (MO, 19),
#         MGH Institute of Health Professions (MA, 53) and Louisiana State
#         University Health Sciences Center - New Orleans (LA, 2). MGH IHP is the
#         starkest: it is carried as a churned Dentistry client while no CODA
#         dental program under that name appears anywhere in the sheet (the
#         directory's three "Massachusetts General Hospital" rows, 380-382, are a
#         different entity and are marked "No"). Whether these are CRM records
#         for programs the directory paste simply missed, or client rows attached
#         to the wrong institution, the sheet does not say and this file does not
#         guess. Northern Arizona University is NOT in this group: its directory
#         detail exists, it just sits on row 8 inside the client block.
#     exxat_status follows each row's own cell in every case. A later pass with
#     CRM access should settle whether the client count is 9 rows, 8
#     institutions, or fewer still once the Houston pair is merged.
#   * THE LOGO GRID HAS NO DENTISTRY COLUMN. Its 36 discipline columns are CCS,
#     PT, PTA, OT, OTA, PA, NURS, SLP, AT, SW, NUT, Public Health, Psychology,
#     Chiro, Teacher Education, Acupuncture, Art, Pathology Assistant, Audiology,
#     CLS, Medical Laboratory Science, Perfusion, Respiratory Care, DO, Health
#     Information Technology, MD, Ayurveda, Gerontology, MLSB, Pharmacy,
#     Therapeutic Recreation, Counseling, Business, Radiation Therapy, Genetic
#     Counseling and Radiation Tech — dentistry is not among them. So the
#     cross-sheet client-count conflict Task 3.1 found for DO (the grid's own DO
#     column disagreeing with the DO sheet) CANNOT recur here: there is no second
#     opinion to disagree with. This was checked, not assumed.
#   * other_disciplines_on_campus lists the disciplines the master "Logo Grid"
#     sheet marks "Yes" (i.e. already an Exxat client) for the SAME institution.
#     Nothing is excluded as "the domain's own column" because, per the point
#     above, dentistry has no column there. A discipline the grid marks "No",
#     "N/A" or "-" is not listed. Discipline labels follow the mapping Tasks
#     2.1/3.1 used: the grid's headers are rewritten to this repo's canonical
#     domain labels where one exists (PT -> Physical Therapy, OT -> Occupational
#     Therapy, PA -> Physician Assistant, NURS -> Nursing, SLP ->
#     Speech-Language Pathology, MD -> Medicine, SW -> Social Work,
#     DO/Doctor of Osteopathic Medicine -> DO); columns with no canonical label
#     keep the grid's own header verbatim (CCS, AT, PTA, NUT, ...) rather than
#     being expanded into a guess.
#   * HOW GRID MATCHING WAS DONE, AND WHY IT IS DELIBERATELY WEAK HERE. Pharmacy
#     (149 rows) and DO (57 rows) resolved name variants by hand. At 531
#     institutions that hand pass was not performed, so matching is
#     EXACT-NORMALIZED ONLY: lowercase, "&" spelled out, non-alphanumerics
#     collapsed to single spaces, then a literal equality test against the Logo
#     Grid's own Schools column. 234 institutions matched, covering 312 rows; the
#     other 297 institutions (656 rows) are `grid_matched: false`. That is a much
#     lower match rate than Pharmacy's 146-of-149, and many of the 656 are
#     near-certainly in the grid under a shorter name: 73 of the 297 unmatched
#     institutions have a name that BEGINS with a full Logo Grid school name
#     (this sheet's "Creighton University School of Dentistry", NE, against the
#     grid's "Creighton University", NE). Those 73 were still not merged, because
#     the same rule also pairs this sheet's "Carrington College - Mesa" (AZ) with
#     the grid's "Carrington College" (ID) and the client row "University of
#     Missouri at Kansas City" with the grid's "University of Missouri" — a
#     campus question a name prefix cannot settle. The error direction is the
#     safe one: a missed
#     match sets grid_matched false, which the schema already defines as UNKNOWN,
#     so no unchecked campus is ever published as a confirmed no-cross-sell. It
#     is still a real gap, and closing it is a hand pass this task did not do.
#     Where a matched name resolved to more than one grid row (one institution,
#     NHTI Concord's Community College, rows 1104 and 2497), the row whose State
#     agrees was preferred, then the row with the most evaluated discipline
#     cells.
#   * THE #N/A CAVEAT — read before aggregating. Of the 312 grid-matched rows, 13
#     (at 11 institutions) matched a grid row carrying the literal Excel error
#     "#N/A" in 34-35 of its 36 discipline columns — an unevaluated lookup, not a
#     checked "no". Every one of those 11 grid rows sits in the grid's appended
#     tail (grid rows 2495-2687), the same shape Task 3.1 found for DO. For those
#     13 rows the empty other_disciplines_on_campus list is UNKNOWN even though
#     `grid_matched` is true, which is exactly the distinction that boolean
#     cannot carry. So, of the 928 rows with an empty list: 259 are confirmed
#     negatives, 13 are grid-matched but unevaluated, and 656 were never matched
#     at all. Each of the 13 says so in `notes`, but prose is human context, not
#     a machine-checkable flag — an aggregate that needs the distinction must
#     exclude these 13 locators explicitly: Dentistry!A32, A33, A210, A319, A393,
#     A394, A395, A396, A402, A420, A496, A520, A710. Only 40 of the 968 rows
#     carry a non-empty list at all.
#   * state and region come from the Dentistry sheet's OWN State and Region
#     columns, not from a matched grid row — this sheet has both, which the DO
#     sheet did not. 16 rows hold the literal "#N/A" in both and are recorded as
#     null: the 4 Alaska rows and the 12 District of Columbia rows, whose
#     state-to-region lookup evidently had no entry.
#   * incumbent_vendor is "unknown" on all 968 rows and incumbent_evidence is
#     null to match. Nothing in this export says which competitor any individual
#     program runs; per-program incumbency is separate research, and "unknown" is
#     a real, countable answer.
#   * This file does NOT carry product gaps, competitor differentiation or a
#     feature matrix for Dentistry. Those exist for Pharmacy because a
#     domain-expert session was held (2026-09-04); no such session exists for
#     Dentistry, and content/dissection/dentistry.yaml records that absence as
#     the gap it is.

