# Medicine (MD) — the per-program ground-truth registry under
# content/domains/medicine.yaml's market_sizing block. Level 1: every row cites
# Level 0 (the CRM export below) and nothing above it. See
# content/market/programs/_TEMPLATE.yaml for the field-by-field schema and
# content/market/programs/do.yaml and dentistry.yaml for the two sibling files
# this one follows.
#
# NOTE ON THE `domain:` VALUE BELOW. It is "Medicine", the app label — NOT "MD",
# the raw value content/domains/medicine.yaml's own `domain:` field carries. This
# family is the one that uses the label (check_content_density.py's
# check_market_programs_integrity validates it against DOMAIN_LABELS); the
# dissection manifest next door, content/dissection/medicine.yaml, is the family
# that uses the raw "MD". DO and Dentistry never had to notice the difference
# because their raw value and their label are the same string. Medicine's are
# not, and the two files disagreeing on purpose is correct here.
#
# HOW THIS FILE WAS BUILT (2026-09-12), so a reader can re-derive it rather than
# trust it:
#   * Rows are the "MD" sheet of the new-logo-grid export, verbatim and in sheet
#     order. Its header sits on row 2, not row 1 (the same quirk the Pharmacy, DO
#     and Dentistry sheets have), and there are 162 data rows: sheet rows 3-165,
#     with row 6 blank. `locator` on each row is the sheet cell its name came
#     from.
#   * THE SHEET IS TWO BLOCKS, not one list. Rows 3-5 are three hand-added rows,
#     all three marked Client "Yes" and all three missing the accreditation and
#     city cells the rest of the sheet carries. Row 6 is blank. Rows 7-165 are a
#     pasted LCME directory — 159 rows, sorted A-to-Z by state then school, with
#     the directory's own URL sitting in the header at MD!N2
#     (lcme.org/directory/accredited-u-s-programs/).
#   * SO THE ROW COUNT IS 162 BUT THE SCHOOL COUNT IS 160, and the two-row gap is
#     not rounding. Of the three hand-added rows:
#       - MD!A3 Thomas F. Frist, Jr. College of Medicine at Belmont University is
#         a real LCME school (Preliminary, 2023) that the pasted directory block
#         does NOT contain. It adds one: 159 + 1 = 160.
#       - MD!A5 University of North Carolina at Chapel Hill is the SAME school as
#         MD!A110 (University of North Carolina School of Medicine, city Chapel
#         Hill) in the directory block. It adds none — and the two rows
#         contradict each other on Client Y/N. See the conflicts section below.
#       - MD!A4 "University of Western States - NMD" is NOT AN MD PROGRAM. The
#         sheet's own suffix says NMD (naturopathic medicine); University of
#         Western States is a Portland, OR chiropractic and naturopathic
#         institution with no LCME accreditation, and the master Logo Grid's row
#         for it (LG!1291) marks only OT and Chiro. It is carried here because
#         the sheet carries it, flagged in its own `notes`, and it is one of the
#         three rows the client count rests on.
#     160 is what content/domains/medicine.yaml's own `market:` prose already
#     says ("159-161 LCME-accredited MD-granting medical schools ... ~160 as of
#     the 2025-2026 cycle"). Unlike Dentistry's 968-vs-77, the CRM sheet and the
#     prose anchor here agree to within a school; the 162 is the artifact, and
#     the two extra rows are named above rather than averaged away.
#   * IT IS ALSO NOT TRUNCATED. The directory block holds rows for 46 distinct
#     jurisdictions. The six with no row — AK, DE, ID, ME, MT, WY — are the six
#     that have no LCME-accredited MD school at all, so 46 is the whole country
#     plus DC and Puerto Rico, not a filtered slice. (Dentistry's equivalent
#     block was missing 17 states; this one is missing none.) One caution for
#     anyone parsing the State column: it holds full state names on 161 rows and
#     the bare abbreviation "NC" on MD!A5, so its 47 raw values are 46 places.
#   * ROWS ARE SCHOOLS, NOT CAMPUSES — the opposite of DO, whose 57 rows were 57
#     teaching locations at 36 institutions. Here the 162 rows sit at 156
#     distinct `institution` values, and the six repeats are six pairs of
#     SEPARATELY LCME-ACCREDITED programs at one parent, not one program's
#     campuses: University of Arizona (Phoenix, Tucson), Rutgers (New Jersey
#     Medical School, Robert Wood Johnson), NYU (Grossman, Grossman Long
#     Island), University of South Carolina (Columbia, Greenville), Texas Tech
#     University Health Sciences Center (Paul L. Foster, Lubbock), and University
#     of North Carolina — that last one being the duplicate described above, not
#     a second program. Deduplicating on `institution` gives 156; the real
#     distinct-school count is 156 as well, because the UNC pair is one school.
#   * The sheet has NO Discipline-Code-equivalent column. Dentistry's did, which
#     is how that file could say only 45 of its 968 rows were predoctoral. Here
#     there is nothing to separate program types by, because with the single
#     exception of MD!A4 there is only one program type on the sheet: the
#     directory block is LCME MD-granting schools and nothing else. No GME or
#     residency programs are listed as rows. (71 of the 162 rows DO carry a
#     contact title naming a residency role, mostly internal-medicine residency
#     coordinators, so the sheet's contacts lean GME even though its rows do not
#     — but that is a contact column, not a row, and no contact data is mirrored
#     here.)
#   * institution / program_name: the sheet gives ONE name string per row. It is
#     split by hand, per row, into the institution and the medical-school
#     designation it embeds — prefixed ("University of Alabama at Birmingham" +
#     "Marnix E. Heersink School of Medicine"), suffixed ("University of South
#     Alabama" + "Frederick P. Whiddon College of Medicine"), or "X at Y"
#     ("Quinnipiac University" + "Frank H. Netter MD School of Medicine"). Where
#     the whole name IS the school and carries no separable institution
#     ("Harvard Medical School", "Albany Medical College", "Medical College of
#     Wisconsin"), program_name is null and the full name stays in `institution`;
#     that is the case on 16 rows. The split is never regex-derived and never
#     renames: where the sheet writes "UCLA", "NYU", "TCU" or "UNLV", those are
#     what `institution` holds, because expanding them would be this file
#     inventing a name the source does not use.
#   * slug is "{institution-slug}-md" — "md", the domain file's own raw `domain:`
#     value and this sheet's own name, not the "medicine" file slug. On the six
#     institutions that appear twice the city is appended
#     ("{institution-slug}-{city}-md") since a bare institution slug would
#     collide; those rows also carry the campus in `notes`. The two UNC rows are
#     the exception: MD!A5 has no City cell at all, so it keeps the bare
#     "university-of-north-carolina-md" and MD!A110 takes
#     "university-of-north-carolina-chapel-hill-md".
#   * accreditation_status IS populated here, on all 162 rows — the first of the
#     three domains extracted in this phase where that was possible. The MD sheet
#     carries a real Accreditation Status column (column J), unlike the DO sheet,
#     which had only a year. LCME's own ladder is Applicant -> Candidate ->
#     Preliminary -> Provisional -> Full, and this schema has two pre-accredited
#     values, so the mapping compresses that ladder order-preservingly:
#       Full (150 rows)                    -> accredited
#       Full, on probation (2)             -> probation
#       Provisional, on probation (1)      -> probation
#       Provisional (2)                    -> candidate
#       Preliminary (5)                    -> precandidate
#       blank (2: MD!A4, MD!A5)            -> unknown
#     The verbatim sheet value always stays one cell from each row's cited
#     locator, at MD!J{row}. The adjacent "Initial Year of Accreditation" column
#     (K, populated on 160 rows — every row but MD!A4 and MD!A5 — ranging
#     "On or prior to 1942" to 2025) is a
#     year, not a status, and this schema has no field for it, so it is
#     deliberately NOT mirrored — same call do.yaml made about its own year
#     column.
#   * class_size is null on all 162 rows and exxat_since is null on all 162 — the
#     MD sheet carries neither column. Contact columns it DOES carry (Contact
#     Name, Title, Contact Email, Source Link, Next Survey Date) are deliberately
#     not mirrored. See pii_policy.
#   * exxat_status maps the sheet's Client Y/N column: Yes -> client (3 rows),
#     No -> not-tracked (159). The value "Previous client" that the Pharmacy and
#     Dentistry sheets use never appears on this sheet, so Medicine has ZERO
#     churned rows — an observed absence, not an unchecked field. A plain "No" is
#     NOT read as `prospect`; the sheet carries no signal distinguishing an
#     actively prospected school from a cold one.
#   * CONFLICTS, recorded rather than resolved. There are three, and they are of
#     two different kinds.
#     INTRA-SHEET (1). MD!A5 marks the University of North Carolina at Chapel
#     Hill a client; MD!A110, the same school in the directory block, marks it
#     "No". Both rows are carried, each follows its own cell, and both say so in
#     `notes`.
#     CROSS-SHEET (2), against the master Logo Grid's own "MD" column (column 32,
#     AF), which across its 2751 data rows marks exactly 3 rows "Yes":
#       - LG!456, "Belmont University" (TN) — agrees with this sheet's MD!A3
#         client row. (The grid ALSO holds an appended row LG!2737 for the same
#         school under its medical-school name, marking MD "No" across 35 "#N/A"
#         cells; the evaluated row was used.)
#       - LG!494, "University of North Carolina at Chapel Hill" (NC) — agrees
#         with MD!A5 and contradicts MD!A110. The grid therefore takes a side in
#         the intra-sheet conflict above, and it is the client side.
#       - LG!1952, "Charles R. Drew University of Medicine and Science" (CA) —
#         but THIS sheet's MD!A15 row for that school says "No". A genuine
#         cross-sheet disagreement, the same shape DO's Noorda row had.
#     And in the other direction: MD!A4's University of Western States, a client
#     on this sheet, has a Logo Grid row (LG!1291) whose MD cell is "-", i.e.
#     never evaluated — so the grid does not contradict it, it simply does not
#     know about it.
#     exxat_status follows the MD sheet, the domain's own tab, on every row; all
#     four affected rows say so in `notes`. On the grid's reading the client set
#     would be Belmont, UNC and Charles R. Drew — still 3, but a different 3, and
#     all three of those are real LCME schools where one of this sheet's three is
#     not. A later pass with CRM access should settle it.
#   * other_disciplines_on_campus lists the disciplines the master "Logo Grid"
#     sheet marks "Yes" (i.e. already an Exxat client) for the SAME institution,
#     MD itself excluded. A discipline the grid marks "No", "N/A" or "-" is not
#     listed. Discipline labels follow Task 2.1's mapping: the grid's headers are
#     rewritten to this repo's canonical domain labels where one exists (PT ->
#     Physical Therapy, OT -> Occupational Therapy, PA -> Physician Assistant,
#     NURS -> Nursing, SLP -> Speech-Language Pathology, SW -> Social Work);
#     columns with no canonical label keep the grid's own header verbatim (CCS,
#     AT, PTA, NUT, ...) rather than being expanded into a guess. No row's
#     matched grid row marks the DO column "Yes", so no Medicine row carries an
#     osteopathic cross-sell.
#   * THE GRID'S APPENDED MEDICAL-SCHOOL BLOCK — the single most important thing
#     to know before reading any empty list below. The Logo Grid has a tail block
#     at LG!2483-LG!2746 holding 66 rows that each carry a medical-school name,
#     "No" in the MD column, and the literal Excel error "#N/A" in 30 to 35 of
#     their 36 discipline columns — an unevaluated second paste of the same
#     directory, giving most MD schools a SECOND grid row under their
#     medical-school name. This is exactly the trap do.yaml documented for its
#     appended COM rows. Matching therefore used do.yaml's ladder, by hand,
#     recorded in `notes` wherever the answer is not the obvious one: (1) a grid
#     row naming this program's own campus/city wins; (2) else a row whose State
#     agrees with the program's State; (3) else the row with evaluated discipline
#     cells and the most information. Rule (3) is what does the work here: only
#     7 of the 162 rows ended on one of those 66 unevaluated twins, and the
#     other 155 sit on a real, evaluated grid row.
#   * THE #N/A CAVEAT — read before aggregating. All 162 rows are
#     grid_matched: true; not one MD program is missing from the Logo Grid. But
#     for six of them no evaluated row exists at all, so they matched an appended
#     row that is "#N/A" in 33-35 of 36 columns: Alice L. Walton, California
#     University of Science and Medicine, Kaiser Permanente Bernard J. Tyson,
#     Mayo Clinic, Universidad Central del Caribe, and Baylor College of
#     Medicine (which is independent of Baylor University, so that university's
#     evaluated row is not its). For those six the empty
#     other_disciplines_on_campus list is UNKNOWN, exactly what grid_matched
#     exists to keep apart, and the boolean cannot say so because a row WAS
#     found. So: of the 51 rows with an empty list, 45 are confirmed negatives
#     and 6 are unknowns, and `grid_matched` alone will not separate them. Every
#     one of the 6 says so in `notes`, but prose is human context, not a
#     machine-checkable flag — an aggregate that needs the distinction must
#     exclude these 6 locators explicitly: MD!A11, A14, A17, A75, A130, A142.
#     A seventh row, MD!A139 (University of Tennessee Health Science Center),
#     matched a row that is "#N/A" in 30 of 36 columns but holds 5 real "Yes"
#     cells; its list is non-empty and real, but may be short. It is called out
#     separately because it is not the same failure mode.
#   * region comes only from the matched grid row's Region column, and only when
#     that grid row's own State agrees with the program's State. 11 rows have a
#     null region: the six #N/A rows above plus MD!A139 have no Region value at
#     all on their appended grid rows; the grid's three DC rows (MD!A30, A31,
#     A32) carry the literal "#N/A" in the Region column itself; and MD!A15's
#     matched row has the string "Chatham University" sitting in its Region cell,
#     a corrupted row the grid never fixed. None of those is mirrored as a
#     region.
#   * incumbent_vendor is "unknown" on all 162 rows and incumbent_evidence is
#     null to match. Nothing in this export says which competitor any individual
#     program runs; per-program incumbency is separate research, and "unknown" is
#     a real, countable answer. Note that Medicine has more named incumbents in
#     content/competitors/ than any other domain in this repo (nine — see
#     content/dissection/medicine.yaml), which makes the absence of per-program
#     incumbency data here a bigger gap for Medicine than it was for DO or
#     Dentistry, not a smaller one.
#   * This file does NOT carry product gaps, competitor differentiation or a
#     feature matrix for Medicine. Those exist for Pharmacy because a
#     domain-expert session was held (2026-09-04); no such session exists for
#     Medicine, and content/dissection/medicine.yaml records that absence as the
#     gap it is.

