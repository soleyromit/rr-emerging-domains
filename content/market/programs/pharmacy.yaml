# Pharmacy — the per-program ground-truth registry under
# content/domains/pharmacy.yaml's market_sizing block. Level 1: every row cites
# Level 0 (the CRM export below) and nothing above it. See
# content/market/programs/_TEMPLATE.yaml for the field-by-field schema.
#
# HOW THIS FILE WAS BUILT (2026-09-11), so a reader can re-derive it rather than
# trust it:
#   * Rows are the "Pharmacy" sheet of the new-logo-grid export, verbatim and in
#     sheet order — 149 data rows (sheet rows 3-152; row 7 is blank). `locator`
#     on each row is the sheet cell its institution name came from.
#   * institution / program_name: the sheet gives ONE name string per row
#     ("University of Charleston School of Pharmacy"). It is split into the
#     institution and the program designation it embeds; where the name carries
#     no program designation (4 rows), program_name is null.
#   * accreditation_status maps the sheet's own Accreditation Status text:
#     Accredited -> accredited (135 rows), Candidate Status -> candidate (2),
#     Accredited with Probation -> probation (1), Discontinued -> closing (3),
#     Withdrawn+Program Closure -> closing (1). The sheet's one "Withdrawn"
#     accreditation APPLICATION and its one "No Status Awarded" map to unknown
#     rather than being read as precandidate, and the 5 rows whose accreditation
#     columns are blank are unknown. Every non-"Accredited" row carries the
#     sheet's verbatim text in `notes`, so the mapping is auditable.
#   * exxat_status maps the sheet's Client Y/N column: Yes -> client (4),
#     Previous client -> churned (1), No -> not-tracked (144). A plain "No" is
#     NOT read as `prospect`; the sheet carries no signal distinguishing an
#     actively-prospected school from a cold one, and inventing one here would
#     make a pipeline number out of a blank cell.
#   * other_disciplines_on_campus lists the disciplines that the master "Logo
#     Grid" sheet marks "Yes" (i.e. already an Exxat client) for the SAME
#     institution, Pharmacy itself excluded. This is the cross-sell field: a
#     pharmacy program on a campus that already runs Exxat for PT/OT/Nursing is
#     a different sale from a cold campus. A discipline the grid marks "No" is
#     not listed — the grid's "No" means tracked-but-not-a-client, which is not
#     what this field is for. 146 of 149 rows resolved to a Logo Grid row (109
#     by exact name; 37 by a hand-reviewed variant/former-name/same-campus-unit
#     match); Larkin University, Manchester University and South Carolina
#     College of Pharmacy have no Logo Grid row at all and are honestly empty.
#     An empty list therefore carries TWO meanings, which `notes` keeps apart:
#     on 146 matched rows it is a checked negative (the grid marks no other
#     discipline "Yes" for that campus), and on those 3 unmatched rows it is
#     unknown — each of the 3 says so in its own `notes`, so no later count can
#     read an unmatched row as a confirmed no-cross-sell.
#     Two universities in one system (UNC-Chapel Hill vs UNC-Charlotte, Texas
#     Tech vs TTU Health Sciences Center) were never merged.
#     Discipline labels: the grid's column headers are rewritten to this repo's
#     canonical domain labels where one exists (PT -> Physical Therapy, OT ->
#     Occupational Therapy, PA -> Physician Assistant, NURS -> Nursing, SLP ->
#     Speech-Language Pathology, MD -> Medicine, DO/Doctor of Osteopathic
#     Medicine -> DO, SW -> Social Work). Columns with no canonical label keep
#     the grid's own header verbatim (PTA, OTA, AT, NUT, CCS, CLS, MLSB, Chiro,
#     ...) rather than being expanded into a guess at what the abbreviation
#     means.
#   * region comes only from a matched Logo Grid row's Region column, and only
#     when that grid row's own State agrees with the program's State. 13 rows
#     have a null region: the grid leaves Region blank, or the grid files the
#     institution under a state this program is not in (it has Lebanese American
#     University under NY, USC under SC, Western University of Health Sciences
#     under OR, Thomas Jefferson under NJ, and PCOM under PA though the pharmacy
#     school is its GA campus). Those rows keep the institution's disciplines
#     and drop the contradicted region rather than mirror a wrong one.
#   * incumbent_vendor is "unknown" on all 149 rows and incumbent_evidence is
#     null to match. Nothing in this export says which competitor any individual
#     program runs; per-program incumbency is separate research, and "unknown"
#     is a real, countable answer.
#   * exxat_since is null on all 149 rows — the export states no start year.
#   * Contact columns in the sheet (dean name, title, email, address, phone,
#     fax) are deliberately not mirrored here. See pii_policy.

domain: "Pharmacy"

source_of_record:
  source_id: "crm-export-new-logo-grid-2026"
  sheet: "Pharmacy"
  extracted: "2026-09-11"
  row_count: 149
  pii_policy: >
    Contact names/emails/phone numbers are deliberately NOT mirrored here. The
    source spreadsheet remains the system of record for contact data; this file
    holds counts, status, and structure only so content/ stays shareable.

