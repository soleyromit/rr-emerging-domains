coverage_note: >
  Seven discipline playbooks exist and all seven are indexed here: PT, OT, PA, SLP, Nursing, Social
  Work, and Teacher Education. No playbook exists for DO, Pharmacy, Dentistry, or Medicine — that
  absence is verified, not assumed: content/flows/admin-onboarding--01-account-activation-login-
  navigation.yaml L920 cites a directory listing of 99-Assets/documents/Playbooks/ naming exactly
  those seven and stating none exists for the other four. Treat dissection content for DO,
  Pharmacy, Dentistry and Medicine as unable to cite a playbook until one is captured. Note that
  SLP and TE, while real, are materially thinner than the PA/OT/PT/Nursing four — see their caveats.
