# Level 0.5 — a corpus index of internal discipline playbooks, see content/ARCHITECTURE.md.
# Citations from content/*.yaml use {source_id, locator} where source_id is one of these ids and
# locator is the section or line range within the playbook (existing inline citations already do
# this, e.g. content/personas/discipline-crna.yaml cites Nursing Playbook.md lines 16, 19, 25, …).
#
# PROVENANCE — every path below is quoted verbatim from citations that already exist in
# content/personas/*.yaml, content/accreditation/*.yaml, content/flows/*.yaml and
# content/journeys/*.yaml. Re-verify with:
#   grep -rF "99-Assets/documents/Playbooks/" content/ --exclude-dir=sources
#
# These are the markdown playbooks the repo actually cites (~250 references across content/). They
# are NOT the three "FireShot Capture 002/003/004" Zendesk screen captures named in
# content/prism/capability-map.yaml's source list — nothing in content/ cites those by name, and
# whether they are the same material in another form is UNVERIFIED. See zendesk_capture: below.
#
# `accessed:` is the 2026-08-25 full read recorded in content/journeys/rotation-lifecycle.yaml
# L4970. No *capture* date is stated anywhere in the repo for any playbook, so no `captured:` field
# is recorded — an absent field beats an invented date.
