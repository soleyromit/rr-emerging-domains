# Level 0.5 ARTIFACT — NOT EVIDENCE. Exxat's own internal sales comparison chart,
# reproduced verbatim so it can be pointed at and argued with, never cited as fact.
#
# citable_as_fact: false means exactly this: no file anywhere in content/ may use an id
# from this file as a `source_id`. A Level 0.5 entry normally IS citable (see
# content/sources/registry.yaml, help-center.yaml, playbooks.yaml) — this file is the
# first one that is not, which is why the field exists. A Phase 1 integrity check
# (check_vendor_comparison_isolation) enforces the rule mechanically; until it lands the
# rule is this comment plus the field.
#
# WHY IT IS QUARANTINED, in the artifact's own numbers:
#   - EXXAT is marked X on 81 of 81 feature rows, on both sheets, with zero per-row
#     evidence of any kind. A chart on which the author never loses is a positioning
#     document, not a comparison.
#   - Its own two vendor sheets disagree with each other on 7 rows (known_contradictions
#     below), in BOTH directions — the masked sheet is sometimes the generous one.
#   - Nothing states when any cell was last checked against any competitor's product.
#
# HOW IT WAS TRANSCRIBED: mechanically, from the .xlsx named in transcribed_from below,
# via openpyxl — not retyped by hand. Cell values are whitespace-stripped (one label,
# `Document Status Tracker`, carries a trailing space in the source). Source typos are
# preserved verbatim and are NOT transcription errors: `Institutioanl-Level` (system-),
# `Placement Clearance Dashbaord` (placement-). row_id slugs follow the typo'd text so
# the id stays derivable from the row label.
#
# Every `sheet2:` value is either "X" (the cell is marked) or null (the cell is empty).
# Absence is the source's silence, not a researched finding of absence.
artifact:
  id: "sales-collateral-exxat-vendor-comparison-chart"
  type: "sales-collateral"
  origin: "first-party"
  access: "internal"
  title: "Exxat Vendor Comparison Chart"
  # path: is the canonical vault location as given in the task brief. It was NOT verifiable
  # from the machine that wrote this file (no PRISM-Expansion-Vault checkout present), so
  # treat it as the intended home, not a confirmed one. transcribed_from: is the local copy
  # actually parsed — note the ' 3' suffix: at least two downloaded revisions exist side by
  # side, and nothing in the workbook carries a version or date.
  path: "PRISM-Expansion-Vault/99-Assets/Exxat Vendor Comparison Chart.xlsx"
  path_status: "unverified"
  transcribed_from: "~/Downloads/Exxat Vendor Comparison Chart 3.xlsx"
  transcribed: "2026-09-11"
  citable_as_fact: false
  provenance_note: >
    Authored by Exxat sales. Exxat is marked present on all 81 feature rows with no
    per-row evidence, and Sheet1 (7 named vendors) contradicts Sheet2 (3 masked vendors)
    on 7 rows. Treat this as a record of what Exxat sales has been claiming, not of what
    is true.
  scope_note: >
    A generic clinical-education product comparison. Contains none of pharmacy's actual
    APPE-tracking incumbents (RxPreceptor, PharmAcademic, Influx, ExamSoft, eValue) — it
    compares against a different competitor set entirely (CastleBranch, Typhon, Core ELMS,
    Trajecsys, Experiential Learning Cloud, Project Concert).
  workbook:
    # Tab order as stored in the file. Sheet2 is first despite the name; Sheet1 is last.
    - { sheet: "Sheet2", position: 1, vendor_columns: 4, masked: true, transcribed_here: "sections[].rows[].sheet2" }
    - { sheet: "Module Based", position: 2, vendor_columns: 4, masked: true, transcribed_here: "module_grouping" }
    - { sheet: "Sheet1", position: 3, vendor_columns: 7, masked: false, transcribed_here: "known_contradictions only" }
  # Rows where Sheet2's four masked columns and Sheet1's four corresponding named columns
  # disagree outright — same vendor, same row, different answer. Computed exhaustively by
  # diffing the two sheets, not spot-checked. `kind: masked-columns-disagree`.
  #
  # Two further rows are recorded with `kind: unmasked-only-vendor`: the masked and named
  # columns agree, but Sheet1 credits a vendor Sheet2 has no column for. That class is NOT
  # exhaustive here — 46 of the 81 rows have marks from Sheet1-only vendors, which is a
  # property of the masked sheet's narrower scope rather than a contradiction. These two
  # are listed because the planning brief called them out by name.
  #
  # Field semantics, identical for both kinds so the two values are always like-for-like:
  #   sheet2:               who is marked in Sheet2's 4 masked columns
  #   sheet1:               who is marked in the 4 Sheet1 columns those masks resolve to
  #   sheet1_extra_vendors: who else Sheet1 marks in its 3 unmasked-only columns, or null
  known_contradictions:
    - row_id: "learning-activity-management-surveys"
      row: "Surveys"
      sheet2: "EXXAT"
      sheet1: "EXXAT, Typhon, Core ELMS"
      sheet1_extra_vendors: "Trajecsys, Experiential Learning Cloud, Project Concert"
      kind: "masked-columns-disagree"
    - row_id: "learning-activity-management-competency-tracking"
      row: "Competency Tracking"
      sheet2: "EXXAT, Vendor 3"
      sheet1: "EXXAT, Typhon, Core ELMS"
      sheet1_extra_vendors: "Trajecsys, Experiential Learning Cloud, Project Concert"
      kind: "masked-columns-disagree"
    - row_id: "learning-activity-management-customizable-reports"
      row: "Customizable reports"
      sheet2: "EXXAT, Vendor 3"
      sheet1: "EXXAT, Typhon, Core ELMS"
      sheet1_extra_vendors: "Trajecsys, Experiential Learning Cloud, Project Concert"
      kind: "masked-columns-disagree"
    - row_id: "student-performance-tracking-skills-checklist"
      row: "Skills Checklist"
      sheet2: "EXXAT, Vendor 3"
      sheet1: "EXXAT"
      sheet1_extra_vendors: null
      kind: "masked-columns-disagree"
    - row_id: "student-performance-tracking-early-risk-identification-low-score-indicators-notifications"
      row: "Early Risk Identification (Low Score Indicators & Notifications)"
      sheet2: "EXXAT, Vendor 3"
      sheet1: "EXXAT"
      sheet1_extra_vendors: null
      kind: "masked-columns-disagree"
    - row_id: "support-onboarding-white-glove-implementation"
      row: "White Glove Implementation"
      sheet2: "EXXAT, Vendor 3"
      sheet1: "EXXAT, Typhon, Core ELMS"
      sheet1_extra_vendors: "Experiential Learning Cloud, Project Concert"
      kind: "masked-columns-disagree"
    - row_id: "support-onboarding-free-importing-of-data-into-system"
      row: "Free Importing of Data into system"
      sheet2: "EXXAT"
      sheet1: "EXXAT, CastleBranch, Typhon, Core ELMS"
      sheet1_extra_vendors: "Experiential Learning Cloud"
      kind: "masked-columns-disagree"
    - row_id: "security-soc2-type-ii-certified"
      row: "SOC2 Type II Certified"
      sheet2: "EXXAT, Vendor 2"
      sheet1: "EXXAT, Typhon"
      sheet1_extra_vendors: "Experiential Learning Cloud"
      kind: "unmasked-only-vendor"
    - row_id: "support-onboarding-annual-user-conference"
      row: "Annual User Conference"
      sheet2: "EXXAT"
      sheet1: "EXXAT"
      sheet1_extra_vendors: "Experiential Learning Cloud"
      kind: "unmasked-only-vendor"
# Sheet1 row 2 maps Sheet2's masked labels onto real vendor names. sheet2_label: null
