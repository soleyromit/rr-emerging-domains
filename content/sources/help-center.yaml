# Level 0.5 — a corpus index, not a registry entry per se. See content/ARCHITECTURE.md.
# Citations from content/*.yaml use {source_id, locator} where source_id is one of this file's
# article ids and locator is optional extra detail (an anchor/subsection within the article).
#
# Seeded 2026-09-11 from the inline "CONFIRMED via Exxat help-center documentation:" strings that
# already exist in content/prism/capability-map.yaml (26 of them) and content/flows/*.yaml (1).
# This file is a starting index, NOT a complete conversion of those inline citations — converting
# them is a later, mechanical pass. Nothing cites these ids yet.
#
# path: is written the way existing inline citations already write it — relative to the vault's
# `99-Assets/documents/`, i.e. starting with `Exxat-Help-Guides/`. Prepend `PRISM-Expansion-Vault/
# 99-Assets/documents/` (see mirror_root, minus its trailing `Exxat-Help-Guides/`) to resolve.
#
# path_status: "confirmed" — the path is quoted verbatim from an existing inline citation in this
# repo. "inferred" — the ARTICLE is real (an existing inline citation asserts its content) but the
# exact filename/folder was reconstructed from the mirror's naming convention and has NOT been
# checked against the vault. Do not treat an "inferred" path as resolvable until someone opens it.
