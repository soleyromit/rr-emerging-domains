# Level 0.5 — a corpus index, not a registry entry per se. See content/ARCHITECTURE.md.
# Citations from content/*.yaml use {source_id, locator} where source_id is one of this file's
# article ids and locator is optional extra detail (an anchor/subsection within the article).
#
# PROVENANCE — read before citing any id here.
#
# Every `path:` below is quoted VERBATIM from a help-center path that already appears in
# content/flows/*.yaml or content/journeys/*.yaml. None is reconstructed or inferred. Re-verify any
# one of them with:  grep -rF "<the path>" content/ --exclude-dir=sources
#
# KNOWN LIMITATION — these entries are derived from in-repo assertions, NOT from the articles.
# `title:` is the article's own filename, but `what_it_supports:` restates what an in-repo Level-1
# (content/prism/capability-map.yaml) or Level-3 (content/flows/*.yaml) file asserts the article
# says. Nobody has re-opened the Level-0 article in the vault to confirm it. Consequences:
#   - Do NOT use an id here to corroborate the very file its `what_it_supports` was derived from.
#     Citing `help-center-*` back at capability-map.yaml would launder a Level-1 claim into a
#     Level-0.5 badge without adding evidence.
#   - Treat `what_it_supports` as "what the repo believes this article says," not as a reading of
#     the article. Upgrade an entry by opening the vault file and rewriting the field from it.
#
# path: is written the way existing inline citations write it — relative to the vault's
# `99-Assets/documents/`, i.e. starting with `Exxat-Help-Guides/`. Prepend `PRISM-Expansion-Vault/
# 99-Assets/documents/` (see mirror_root, minus its trailing `Exxat-Help-Guides/`) to resolve.
#
# path_status: "confirmed" — the path is quoted verbatim from an existing in-repo citation. All 9
# entries are currently `confirmed`. The value exists so a future entry added from a topic with no
# verbatim path in the repo must mark itself "inferred" rather than passing as attested.
corpus:
  id_prefix: "help-center-"
  mirror_root: "PRISM-Expansion-Vault/99-Assets/documents/Exxat-Help-Guides/"
  origin: "first-party"
  access: "internal"
  # content/ARCHITECTURE.md states 322 files for this mirror; content/prism/capability-map.yaml's
  # source list states 399 articles. Using ARCHITECTURE.md's number per the task brief; the
  # discrepancy is real and unresolved (322 may be post-dedup files vs. 399 published articles).
  article_count: 322
  # No explicit mirror date is stated anywhere; this is ARCHITECTURE.md's document-level
  # "Last updated" date, which is also capability-map.yaml's `last_updated`.
  mirrored: "2026-08-24"
  coverage_note: >
    A deliberate 9-of-322 seed, not a complete index. content/ contains 114 distinct verbatim
    help-center paths across 437 references; these 9 are the ones that both back a specific
    capability claim and are cited often enough to be worth an id today. Converting the remaining
    inline citations is a later mechanical pass. Nothing cites these ids yet.

