# Normalized citation registry — Level 0.5, citable by any file, cites nothing
# itself. Built 2026-09-09 alongside the standards x competitor x persona
# crosswalk research pass (see content/lenses/standards-competitor-ratings.yaml
# and content/trends/*.yaml) specifically so a webinar citation can carry
# publisher/date/type metadata a bare `source:` string can't.
#
# Sparse by design, same convention as content/lenses/*.yaml: only add an
# entry after actually finding and checking a real, live source. Reference it
# elsewhere by `id` (e.g. `sources: [{source_id: "webinar-core-elms-acpe-2025"}]`
# in a standards-competitor-ratings.yaml entry or a trends/*.yaml entry) rather
# than duplicating title/url/publisher inline every time it's cited.
#
# id convention: "<type>-<competitor-or-topic-slug>-<short-topic>-<year>"
#
# Fields on every entry: id, title, url, type, origin, access, publisher, date,
# what_it_supports, accessed.
#
# type: — the medium/genre of the source, kept deliberately separate from
# `origin` (whose document it is) and `access` (who can open it). 24 values:
#   doc, product-page, analyst, press, newsletter, video, webinar, review,
#   interview, other, research-paper, dataset, program-page, conference,
#   podcast, support-ticket, rfp, sales-call, help-center-article, playbook,
#   roadmap-doc, crm-export, sales-collateral, exxat-site-update
# Notes on the values that are easy to confuse:
#   analyst        an industry/market-research report only. A peer-reviewed
#                  journal article is `research-paper` (15 entries were
#                  re-typed analyst -> research-paper on 2026-09-11).
#   conference     agenda/session/abstract/proceedings. Replaces the retired
#                  `event` type (1 entry migrated 2026-09-11); do not reuse
#                  `event`.
#   dataset        a numeric table (AACP vital statistics, IPEDS) rather than
#                  a narrative document.
#   product-page   a vendor's own page; one school's program/experiential page
#                  is `program-page`.
#   help-center-article, playbook
#                  indexed in their own files (content/sources/help-center.yaml,
#                  content/sources/playbooks.yaml), not duplicated here.
#   sales-collateral  comparison charts and one-pagers — NOT citable as fact.
#                  Indexed in its own file (content/sources/vendor-comparison-
#                  chart.yaml), not here, and carrying `citable_as_fact: false`.
#
# citable_as_fact: — absent on every entry in THIS file, because everything here is
# citable by definition; that is what the registry is for. The field is written
# explicitly, and only as `false`, on a Level 0.5 source home whose ids must never
# appear as a `source_id` anywhere in content/ (so far: vendor-comparison-chart.yaml,
# Exxat sales' own vendor chart). Read it as a quarantine marker, not a confidence
# score: it says "this artifact is a record of what someone claimed," never "this
# claim is weak." A Phase 1 integrity check enforces the rule mechanically.
#
# origin: "first-party" (Exxat's own material) | "third-party" (everyone
# else's). access: "public" | "internal" | "confidential" — as a rule, an entry
# without a real public `url:` is not "public".
# Both fields were backfilled onto all 90 pre-existing entries on 2026-09-11 as
# third-party/public, which was true of every one of them except
# `interview-vishaka-pharmacy-understanding-2026-09-04` — an internal
# first-party interview with no url, corrected to first-party/internal on
# 2026-09-11. That session now also has a full record with its own front-matter
# at content/interviews/2026-09-04-vishaka-ruchi-pharmacy-understanding.md,
# which reuses this same id so there is one canonical id for the session.
#
# An entry's `id` is frozen once written, even when its `type` is corrected
# later: other files cite these ids, so a few ids carry a stale type prefix
# (e.g. `analyst-bmc-...`, `event-aacp-...`). Follow the id, not the prefix.
sources:
