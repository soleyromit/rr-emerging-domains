open_questions:
  - "Does the Patient Log threshold model support COA's multi-parent counting ('count all that apply' on Anatomical Categories; alternative-technique intubations counting in two rows), or does one encounter increment exactly one threshold?"
  - "Can Patient Log minimums and Competency Management frameworks be scoped to a matriculation cohort? Required for both the seven dagger Graduate Standards and the three dagger Appendix rows effective January 1, 2026."
  - "Does the CRNA daily clinical evaluation instrument's questions map into Competency Management against D.1-D.50, or does the Daily Clinical Evaluation Report stop at response counts and percentage distributions? Determines whether H.1.1.1's terminal evaluation is Configure or Build."
  - "Does the Personnel record distinguish INSTITUTIONAL credentialing/privileging at a clinical site (COA F.5) from state licensure, or do both collapse into a document upload?"
  - "Is form/survey authoring self-service for the CRNA discipline, or support-gated as it is for SLP? Determines the effort to port the PT PTSE1/PTSE2 pattern to satisfy H.1.2."
  - "Mine the COA Accreditation Policies and Procedures Manual (rev. June 2026) for the actual annual-report and self-study field taxonomy — the ./coca.yaml lesson is that Accreditation Management should be scoped to an accreditor's real report structure, and for COA that structure lives in the Manual, not the Standards."

