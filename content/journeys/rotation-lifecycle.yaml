          2D8's "fully executed" test expressible at all), a Contract Organization format field (Old / New /
          Universal), a real routing checklist (Date Signed by Dean, Date Signed by Provost, Copy Sent to
          Dept), Contract Templates cited by ACOTE C.1.5 as consistency evidence, and a documented live
          auto-notification setting of "2 months within contract end date... repeats weekly." Honest limit
          carried forward: no source reconciles OT's institutional-level seven-value status set with the
          program-level Active/Inactive Status field on the Add Contract drawer — whether they are one field
          at two scopes or two fields is unconfirmed. The slot record carries a Supervision Type select
          (OT's production values: 1 Student:1 CI, 1 Student:2 CIs, 2 Students:1 CI, 2 Students:2 CIs),
          which ACOTE C.1.7 accepts as a Configure — its defect being that planned and realized ratios live
          in two views that never reconcile, and that the Placements by Educator report explicitly excludes
          placements with no assigned educator, so the denominator quietly shrinks. OT's capstone runs the
          same student-proposes pattern through a questionnaire/ MyRequest wishlist and then executes its
          ACOTE D.1.5 agreement as a multi-party custom FORM (Student > Site Mentor Review > Faculty Review
          > Admin Review) — a second, parallel agreement mechanism living entirely outside the Contract
          object.
      - subject: "PA"
        detail: >-
          The eight existing disciplines do not just add volume to this stage — they add three whole steps
          the four-domain version of the flow file could not have had, because COCA 6.9, LCME 1.4, ACPE
          3.5.b and CODA 4-6 all ask only that an executed agreement EXIST, while five of these eight
          accreditors ask how the site was CHOSEN and how often it is re-checked. That is the Site/Agency
          Assessments step: a self-service form builder at Sites > Setup > Form Setup with 11 question types
          including attestation and e-signature, serving ARC-PA B3.02 a-c, CSWE AS 3.3.4, CAA 3.0B/3.9B, COA
          F.4/F.6 and CCNE II-C, with PA's documented practice being to build exactly two instruments
          ("Initial Site Visit" and "Ongoing Site Visit") and OT's being a 5-10 year revisit cycle read off
          the Assessment Details report. The shared defect is recurrence: the builder has no interval
          semantics, so a program can prove it assessed a site and cannot prove — or be warned — that it has
          stopped, and arc-pa.yaml names that as the B3.02 gap directly. The defensible claim is real and
          specific: Prism evaluates contract validity against each placement's own dates and distinguishes
          "expires before placement end" from "missing," which is harder than the expiry-date check CORE
          ELMS and eMedley market and more than any competitor source in this repo documents. PA is where
          contract CONTENT becomes a live citation risk rather than a theoretical gap. ARC-PA 6e B3.01 a-e
          requires agreements to explicitly name "Physician Assistant students"; broad institution-wide "all
          learners" language is no longer sufficient, multi-campus institutions must identify which campuses
          are covered, and the playbook records generic university-wide language as "a common source of
          accreditation citations." Prism stores the PDF and asserts nothing about its clauses, so "which of
          my 300 agreements name PA students?" is a PDF-by-PDF read — and the chain-icon
          link-one-contract-to-many-sites control, which is a clean win for CAEP's district MOU shape and
          for COA F.2's one-hospital-many-nursing-tracks case, makes the risky pattern one click cheaper for
          PA. The documented remediation (an addendum reading "All learners in this agreement include
          Physician Assistant students") also has no home, because the contract's file upload treats
          documents as versions of one agreement rather than as a base plus amendments. This is the
          highest-leverage cross-discipline finding in the stage: CAPTE 2D9's five enumerated clauses, ACOTE
          C.1.5's both-parties responsibilities, COA F.2's expectations-of-both-parties, ACEN 4.9's
          student-protection clauses and CAEP R2.1 all want the same "required clauses present" checklist,
          and the absence is very likely category-wide — no competitor claims to model agreement content
          either. PA has no fixed sourcing date and splits into Site Based versus Preceptor Based models,
          and owns the only assignment-time capacity control anywhere in the stage — Max Placement Limit, a
          soft warning scoped to Location + Setting + Cohort, off unless enabled in Slot Request
          Configuration, and lockstep-only, which means the preceptor who offers the capacity cannot be
          capped as a preceptor, and OT/SW/SLP programs whose accreditors ask materially the same question
          cannot have it at all.
      - subject: "SLP"
        detail: >-
          SLP's support-gating — new custom forms require a prism-support@exxat.com ticket, so an SLP
          program cannot author its own CAA 3.9B site-suitability instrument on the same terms PT can, which
          is where SLP's stage-1 story is weakest. SLP's own playbook wording — agreements are "stored,
          viewed, and monitored in the Sites module" — is the accurate one and the phrasing the others
          should borrow.
      - subject: "Nursing"
        detail: >-
          Nursing/CRNA is the only partial mitigation, pushing site-visit follow-up dates onto the Program
          Calendar; note that coa.yaml's own audit says this repo's habit of attributing site visits to COA
          F.4 needs correcting — a Site Assessment form is how a program EVIDENCES F.4, not a visit F.4
          requires. The most useful correction the eight disciplines make to the four-domain reading is
          about capacity REPORTING. Stage 1's standing hedge — "no rolling-average capacity math exists" —
          survives, but it is not an expansion-domain hole: PA has SCPE Details (shaped like the ARC-PA
          Entry Level Program Portal's own data-entry format, populated automatically from site slot-request
          responses rather than admin estimates, and worked by a documented "gold in, gold out" line-by-line
          Excel diff against the portal), Nursing has a Slot Sufficiency Report (Total Slots Offered / Total
          Placements / Completed Placements by site — offered-vs-placed exposes over-solicitation,
          placed-vs-completed exposes attrition), PT/PTA has Number and Variety of Clinical Sites and
          Clinical Slots, and PA additionally has Distribution of Slots Across Settings and by Location.
          Every one produces volume; none produces a verdict, and arc-pa.yaml, nursing.yaml, coa.yaml and
          capte.yaml each reach that conclusion independently. So the missing analytic layer is a shared
          twelve-discipline platform investment, not a go-to-market blocker for any one domain.
      - subject: "Social Work"
        detail: >-
          Social Work inverts the whole stage: agencies enter the directory FROM STUDENTS through
          Multi-Location Field Application Forms (up to 10 suggestions per student, each an interview),
          arriving with no contract, no assessment and no personnel credentials, policed only by an admin
          mapping step whose map-only-once rule is the dedup mechanism; CSWE AS 3.3.7's
          employment-based-placement policy has no model at all and is the only site-eligibility rule found
          across twelve disciplines that turns on a fact about the STUDENT.
      - subject: "Teacher Education"
        detail: >-
          Teacher Education is the one discipline whose fit here is reasoned rather than observed: the
          chain-linked contract is a near-exact structural match for a district MOU spanning many school
          locations (CAEP R2.1), but CAEP wants the RELATIONSHIP record — co-construction meeting decisions,
          agenda topics, advisory-board activity — not the signed document, and the partner-school
          demographic attribute R2.3 needs has no field, so diversity evidence is a manual crosswalk against
          state report-card data. The TE playbook warns outright that TE terminology and placement workflows
          are "NOT confirmed for Exxat," so every TE clause above carries that caveat.
      - subject: "CRNA"
        detail: >-
          Capacity is where CRNA becomes the severity outlier. COA F.7 is a different animal: rated Build,
          asterisked CRITICAL, and scoped to preceptor-shift rather than to placement — never more than 2
          students to 1 supervising CRNA or anesthesiologist AT ANY TIME, with brief exceedances permitted
          only against a documented rarity-plus- contingency record. A slot-level Supervision Type is a
          declaration about a batch; F.7 asks a question about a shift, and the field cannot answer it. This
          is the clearest case in the stage of something that reads as parity on a feature grid and is not
          parity against the standard, and personas/discipline-crna.yaml carries it as job 4 with the same
          conclusion reached independently. COA A.3 compounds it: the institution-to-institution
          joint-governance agreement that is the ORDINARY case for a university/anesthesia-practice CRNA
          program has no home at all, because Prism's Contract object is location-linked by design — and A.3
          is critical-flagged while F.2 is not, so the weaker coverage sits on the more severe standard.
          Note also that all three CRNA video transcripts contain zero mentions of sites, contracts,
          capacity or slots: every CRNA claim in this stage traces to the Nursing playbook and coa.yaml, not
          to a CRNA product source. Two discipline-specific sharpenings: for CRNA, COA F.1/A.10 (both
          critical) ask whether resources suffice for each graduate INDIVIDUALLY, and no report crosses site
          capacity with the Appendix case-category minimums — Prism holds both halves of that join and does
          not join them.
    key_findings:
      - subject: "OT/OTA"
        headline: "No 'contract not required' flag, so exempt sites alarm forever"
        severity: "gap"
        detail: >-
          Sites that legitimately need no agreement — Level I observation, field trips,
          service-learning, the ACOTE C.1.5 population — cannot be marked exempt, so each emits a
          permanent false-positive Needs Attention on the Placement Clearance Dashboard until
          coordinators learn to ignore it.
      - subject: "Nursing"
        headline: "Playbooks call the Clearance Dashboard a gating checkpoint; nothing blocks a placement"
        severity: "gap"
        detail: >-
          The Nursing playbook calls it "the gating checkpoint" while acote.yaml requires blocking
          the placement before it begins. Nothing on the dashboard or in Add Slot prevents a
          placement against a Location showing Needs Attention — true of the computation, false of
          the enforcement.
      - subject: "PA"
        headline: "ARC-PA B3.01 requires agreements naming PA students; Prism models no clause content"
        severity: "gap"
        detail: >-
          B3.01 a-e requires agreements to explicitly name Physician Assistant students and identify
          which campuses are covered. Prism stores the PDF and asserts nothing about its clauses, so
          "which of my 300 agreements name PA students?" is a PDF-by-PDF read.
      - subject: "CRNA"
        headline: "COA F.7's 2:1 cap is answered by a slot-level string, not a shift"
        severity: "gap"
        detail: >-
          Exxat's own COA Support Guide points F.7 at Sites > Slots > Supervision Type, whose values
          ("2 Students:1 CI") are labels the system cannot do arithmetic on — and F.7 is asterisked
          critical and scoped to the preceptor-shift, not the slot.
      - subject: "Pharmacy"
        headline: "Contracts carry no per-state dimension though state boards license the facilities"
        severity: "gap"
        detail: >-
          ACPE's licensure layer means multi-campus and distance programs routinely cross state
          lines, and the state boards license the practice facilities themselves. No per-state
          licensure field is confirmed anywhere on the Site or Contract record today, so that
          dimension remains unconfirmed and unbuilt.
      - subject: "Medicine"
        headline: "The pay-to-host agreement is already recordable via Payment Details and its report"
        severity: "none"
        detail: >-
          44% of AAMC-surveyed schools report moderate-to-severe pressure to pay physicians and
          clinics to host students. Prism's Sites module already ships Payment Details (payee, rate,
          rate unit of Per Week or Per Rotation, vendor ID) plus a Site Payment Report.
      - subject: "Social Work"
        headline: "Agencies enter the directory from students, arriving with no contract or credentials"
        severity: "gap"
        detail: >-
          Multi-Location Field Application Forms let each student suggest up to ten agencies, which
          land in the directory with no contract, no assessment and no personnel credentials,
          policed only by an admin mapping step whose map-only-once rule is the whole dedup
          mechanism.
      - subject: "PT/PTA"
        headline: "M1M send failures are computed on the Email Dashboard and never escalated"
        severity: "gap"
        detail: >-
          PT's whole sourcing year turns on a single March 1 mass slot request, and nothing pushes a
          "your M1M did not reach 40 of your 300 sites" summary. Two of the three documented fixes
          have the coordinator send from a personal account, losing the audit trail.
  - stage: "2. Preceptor / site-faculty credentialing, orientation & calibration"
    current_state_in_prism: >
      Clinical & Experiential Education already assigns a preceptor per placement, so the
      relationship exists in the data model. Element-level tracing
      (flows/rotation-lifecycle--02-preceptor-site-faculty-credentialing-orientation-
      calibration.yaml) now RESOLVES acpe.yaml's "unclear whether Compliance Management
      natively models preceptors as a trackable entity" hedge: Sites > Personnel is a
      first-class preceptor/CI entity (Managing Personnel.md), the Placement Clearance
      Dashboard carries dedicated Preceptor CV/License/Certification tracking columns
      (Placement Clearance Dashboard.md), and a separate Faculty Compliance module gives
      internal/didactic faculty mandatory, expiration-dated requirements with Requirement
      Groups (Setup Faculty Compliance.md) — narrowing coda.yaml's faculty-calibration hedge
      to a real module rather than an open question. What stays genuinely unconfirmed: whether
      "Faculty Compliance" faculty and Sites "Personnel" preceptors are the same population
      (Understanding User Roles in Exxat Prism.md lists them as separate role categories), and
      whether any of this is a validated, date-aware expiry check versus a static Missing/
      Exists/NA flag. Faculty-facing evaluation workflow (student-of-preceptor and vice versa)
      remains unconfirmed by anything found in this pass.
    pain_or_gap: >
      Every accreditor in scope requires that a preceptor be *qualified and oriented before*
      accepting a student — which is a gate, not a report. The entity-modeling half of this
      pain is now resolved: preceptor credentialing and an OT-discipline-confirmed "Preceptor
      Is Oriented" / "Preceptor Is Aware [of program expectations]" rollup both exist today
      (flows/rotation-lifecycle--02-...yaml, steps 1 and 7), so the "not confirmed" framing no
      longer holds for the entity itself. The assignment-safety pain is CONFIRMED rather than
      resolved, though: the documented Preceptor/Clinical Instructor dropdown on the actual
      placement-creation screen (Placing and Publishing Placements to Students.md) shows no
      visible validation against the Clearance Dashboard's credential status, so nothing in the
      public UI stops a coordinator from assigning a student to a preceptor flagged "Missing"
      elsewhere — the gate is a separate monitoring view a human must check, not a system-
      enforced block at the point of assignment. The coordinator therefore still reconstructs
      "who was oriented, when" from a report rather than relying on Prism to have refused an
      unsafe assignment in the first place.
    accreditation_link: >
      ACPE Standard 3, Key Element 3.3.a (quality criteria applied at recruitment; record that
      the majority of a given student's preceptors are U.S.-licensed pharmacists; performance
      evaluations on file) — Configure; the preceptor-as-entity question is now resolved (Sites
      > Personnel), leaving only expiry-validation depth open. 3.3.c (orientation to mission,
      syllabus expectations, and evaluation technique completed *before* accepting a student) —
      Configure; the OT-confirmed "Preceptor Is Oriented" rollup is the clearest evidence
      source found for this element, though it is a point-in-time report field, not a
      pre-assignment block. CODA Standard 2, Element 2-6 (documented ongoing faculty
      calibration across every site, calibration manuals, periodic monitoring, participation
      records) — Configure; Compliance Management's item taxonomy is no longer students-only —
      a dedicated Faculty Compliance module now ships mandatory, expiration-dated requirement
      tracking — but true multi-rater calibration agreement (not just training-completion
      tracking) is still unaddressed by anything found. CODA Standard 3, Element 3-4
      (objective faculty evaluation in teaching, patient care, scholarship, service) —
      Configure, unresolved by this pass. COCA Standard 5, Element 5.4 (published supervision
      policy distributed to and acknowledged by students, faculty and staff) — Configure;
      Attestation and E-signature ARE confirmed, shipped question types (Experiential
      Supervisor Intake Form and Custom Site Assessment form builder), resolving the
      document-acknowledgment mechanism question, though no accreditor-ready field is
      pre-built for it today — it would be manually added per program.
    competitor_comparison: >
      New Innovations ships a dedicated Credentialling Module covering licenses,
      certifications, visas and immunizations with expiration alerts (new-innov.com/pub/
      gme_details.html) and is rated "ahead" on this pillar. MedHub/E*Value ships Automated
      Credentials Monitoring for state, DEA and Controlled Substances licenses with GME-office
      change alerts (medhub.com/software/residency-management-software). CORE ELMS ships
      preceptor license tracking alongside student compliance. Conversely, Elentra, one45 and
      Leo/DaVinci show no public preceptor-credentialing module — leo-davinci.yaml rates
      Compliance "behind" and both one45.yaml and elentra.yaml name the absence of a dedicated
      compliance module as the specific wedge Prism should lead with in DO/MD conversations.
      The "only if the preceptor/faculty entity extension actually exists" condition on this
      wedge is now resolved in Prism's favor: element-level tracing confirms the entity, the
      Clearance Dashboard's credential columns, and a dedicated Faculty Compliance module all
      ship today (flows/rotation-lifecycle--02-...yaml), so this is a demonstrable wedge, not
      just a claim — with the caveat that none of the three competitor citations above are
      documented at screen/field granularity in their own public materials, so the comparison
      itself is necessarily depth-of-marketing-claim vs. Prism's confirmed screen-level detail,
      not element-for-element.
    domain_variance: >
      Pharmacy — the most prescriptive: preceptor licensure composition is measured per
      *student* (majority U.S.-licensed pharmacists), and orientation is a hard pre-assignment
      gate (ACPE 3.3.a/3.3.c). Dentistry — the requirement is not credential expiry but
      *calibration*: multiple faculty grading the same procedure must agree, evidenced by
      training manuals and participation records (CODA 2-6), and supervision is delivered by a
      "clinical practice unit" of roughly one lead plus one to two instructors per two-student
      team (domains/dentistry.yaml). Medicine — supervision is layered (attending → senior
      resident → intern → student), so the credentialed entity is a *team*, and LCME 3.1
      additionally requires capturing resident involvement as its own role. DO — the same
      layering applies where GME is present, plus a DO-specific attribute: COCA 6.10 requires
      proof of at least one rotation supervised by an osteopathic physician, so "supervisor is
      a DO" must be a structured field on the credential record, not free text.
    discipline_variance: >
      The four-domain reading of this stage treats preceptor credentialing as one workflow — Sites >
      Personnel plus the Experiential Supervisor Intake Form. The eight existing disciplines
      demonstrate that Prism actually ships FOUR structurally distinct credentialing workflows, and
      three of them exist only because an already-served discipline needed them: a course-scoped,
      STUDENT-submitted educator-details form living in Learning Activities (PT's CI Details, OT's
      Fieldwork Educator Details Form, Social Work's Field Instructor Information Form); a slot-level
      supervision-ratio declaration (Sites > Location > Slots > Supervision Type); and an
      instrument-calibration training quiz attached to a single standard form (PT's CIET v2.0). All
      eight vocabularies — DCE/ACCE over CI and SCCE in PT, Academic Fieldwork Coordinator over
      Fieldwork Educator and Site Mentor in OT, Preceptor in PA, Clinical Educator in SLP, Preceptor
      under Sites > Personnel in Nursing/CRNA, Field Instructor plus Task Supervisor in Social Work,
      and Cooperating/Mentor Teacher plus University Supervisor in TE (explicitly unconfirmed) — ride
      the same program-configurable Designation lookup. The consistent defect is that designation is
      a LABEL, not a RULE: nothing ties "Level II Fieldwork Educator" to ACOTE C.1.13's
      licensed-OT-plus-one-year bar, or "Task Supervisor" to CSWE's requirement that a qualified
      off-site Field Instructor exist on the same placement. Every role-conditional qualification
      rule across these disciplines is enforced by a human remembering it.
      PT/PTA is the reference implementation and produces the strongest preceptor-qualification
      artifact anywhere in the twelve disciplines: Total Qualifications of CIs, named in-product for
      CAPTE 2024 4P (2016 4O), COMPUTED from the CI Details form's education / clinical-experience /
      teaching-experience / evaluation-skills fields rather than typed by an evaluator, and the report
      the Annual Accreditation Report uses to answer "% credentialed CIs," "% with advanced
      certification," and "any CI with under one year of experience" — capte.yaml rates 4P Transfer
      and calls it the strongest existing proof point in the file. Its operating prerequisite is a
      Learning Activity Group per cohort/academic year, and its two limits are worth carrying: PTA
      Element 4N makes CI eligibility jurisdiction-conditional (a licensed PTA may serve "if
      permitted by the state practice act") and Prism has no state-practice-act rule layer, and the
      field source feeding it is a standard form programs cannot edit. PT also runs its ELIGIBILITY
      CHECK and licensure renewals on the CI Details form rather than on the Placement Clearance
      Dashboard, which means the check is activated per course offering — a program running Clinical
      Experience I/II/III activates it three times per cohort, and a missed activation silently
      produces a cohort with no CI qualification data and a hole in the 4P report. One pattern from
      PT should be copied outright by the expansion domains: the CI Details review path (Pending
      School Review, then either Reviewed or Un-submit to student) is a genuine reject-with-correction
      loop, where the Sites-module PIF's Save and Sync is one-way and irreversible with no reject path.
      OT/OTA runs the same instrument shape and hits the confirmed OT-specific failure mode: the
      Fieldwork Educator Details Form's CV and credential data does NOT sync to the Personnel record,
      so schools re-key it by hand — exactly the failure ACOTE C.1.13's "document and verify PRIOR TO
      the start of Level II fieldwork" language punishes. OT programs therefore run two credential
      stores that do not talk to each other, and the Placement Clearance gate reads only the second.
      OT also owns the only shipped, accreditor-named REALIZED-ratio report (Placements by Educator,
      ACOTE C.1.7) with two documented defects: it excludes placements with no assigned educator, so
      an incomplete roster quietly shrinks the denominator, and planned Supervision Type and realized
      ratio live in two views with no reconciliation, so nothing flags a slot set up 1:1 that ran 2:1.
      Social Work supplies the two strongest GATE patterns in the stage and both should transfer to
      the expansion domains verbatim. First, orientation: field-instructor orientation-completion
      certificates stored in Agencies > Personnel > Certification surface on the Placement Clearance
      Dashboard's Preceptor Certification column, making SW the only discipline of the twelve with a
      per-placement, pre-rotation orientation check at all — which is precisely the mechanism ACPE
      3.3.c and COCA 5.4 need, and cheaper than building one. Its weakness is that it is a convention
      riding on a general-purpose column: nothing distinguishes an orientation certificate from a
      board certification, so an LCSW who has never been oriented reads Exists and clears, and there
      is no expiry behaviour behind an annual re-orientation. Second, SW's student-led My Request
      workflow can make Field Instructor credential fields STRUCTURALLY MANDATORY at the moment a
      placement is proposed — the only place in twelve disciplines where supervisor credentials gate
      a placement request rather than being monitored on a dashboard afterwards — though the fields
      are free text, so the form can require that an answer exists without checking that it clears.
      SW is also the one discipline whose accreditor explicitly contemplates split supervision, and
      Prism models two typed supervisors on one placement as a first-class structure; the operational
      catch is that an adjunct faculty member serving as the off-site qualified FI must be hand-added
      as agency staff before their name appears in the Field Instructor / Task Supervisor dropdowns —
      a manual bridge between exactly the two entity stores this stage's central architectural finding
      is about.
      That finding is the population split, and the eight disciplines resolve it in one direction:
      preceptors are NOT faculty in Prism's data model, and they live in the weaker store. The
      Nursing playbook states it flatly ("Preceptor — clinical supervisor/evaluator at the site,
      stored under Sites > Personnel, NOT Faculty and Staff"), and the consequence is that off-site
      supervisors get the Placement Clearance tri-state (Missing / Exists / NA — a presence check)
      while internal faculty get Faculty Compliance's mandatory, expiration-dated, auto-notified,
      archive-on-reset requirements. Exxat's own guides demonstrate the confusion: the CCNE guide
      answers Key Element II-G (a PRECEPTOR qualification standard) with Faculty Profiles under
      Faculty and Staff, while the ACEN guide answers the parallel ACEN 2.9 with Sites > Personnel —
      two Exxat-authored guides routing the same question to two different modules. Nursing also
      resolves this stage's date-awareness hedge in a sharper form than the four-domain reading left
      it: the Licensure Entered, Licensure Missing and Board Certification Entered reports DO carry
      expiration dates, so the DATA is date-aware and the CLEARANCE GATE is not. A preceptor whose
      licence lapses mid-rotation shows Exists on the dashboard and expired in the report, and nothing
      reconciles the two — while Contract Status, one column over on the same grid, performs exactly
      that reconciliation. This is also the one place in the stage where a competitor claim is
      genuinely comparable and arguably ahead: CORE ELMS's preceptor license tracking with automated
      expiration reminders and MedHub/E*Value's automated credentials monitoring are alerts that find
      the human, where Prism's equivalent is a report a human must remember to run. The commercial
      framing that follows is stated independently in caa-asha.yaml, nursing.yaml, caep.yaml and
      coa.yaml: Faculty Compliance requires the paid Exxat Approve add-on, so the stronger machinery
      is a services attach rather than base product.
      CRNA is where that lands hardest, and it is the single most distinctive fact in this stage
      across all twelve disciplines. COA F.7 — "at no time does the number of students directly
      supervised by an individual clinical preceptor exceed 2:1" — is the only hard, numeric,
      critical-flagged supervision cap in any of the twelve accreditor registries, and Exxat's own COA
      Accreditation Standards Support Guide answers it with a single table row pointing at Sites >
      Slots > Supervision Type. That field is a STRING: "2 Students:1 CI" is a label the system cannot
      do arithmetic on. Same field, two accreditors, opposite verdicts — sufficient for ACOTE C.1.7,
      which asks only that a ratio be captured structurally and evidenced, and fatal for F.7, whose
      unit of enforcement is preceptor-shift (which named CRNA is responsible for which students on
      which clinical day), not slot and not placement. A CRNA site with ample slots, a correct
      Supervision Type on every one, and every licence showing Exists can still breach a critical
      standard on a short-staffed Tuesday, and nothing in the product would know. coa.yaml's scoping
      is carried here because it is actionable: a derived "supervision assignment (preceptor x date x
      students)" object between Slot and Placement, plus a structured exception log (date, reason,
      contingency action, approver) — the log is part of the standard, not decoration, because F.7
      permits brief exceedance only where the program can show the event was rare AND that contingency
      plans existed. Three precedents already exist to build on: Placement Assist's
      overlapping-rotation guard (a concurrency check on the wrong axis), the geolocated Faculty
      Timesheet (a named supervisor tied to a time-bounded shift), and PA's Max Placement Limit, which
      proves Prism CAN inject a supervisor-capacity check into the Place action — though it carries
      capacity rather than credential data, warns rather than blocks, is fenced to PA on lockstep
      clients, and is a PERIOD-TOTAL cap (a preceptor listing 12 monthly slots but capping intake at
      7 students) rather than the CONCURRENCY cap F.7 needs. Two further CRNA gaps: COA F.5, also
      critical, turns on institutional credentialing at the site rather than state licensure — "is
      this person credentialed BY THIS HOSPITAL to practise here" — and coa.yaml hedges honestly
      rather than asserting, noting only that no source names such a field and that it may collapse
      into a generic document upload; and F.3's named per-site CRNA coordinator, with its
      Council-approved five-year exception clock, has no confirmed home in Sites or Personnel either.
      Note that the three CRNA video transcripts mention the preceptor only as a reviewer/attester of
      student logs and as a response source on the Daily Clinical Evaluation Report — never as a
      supervision-capacity dimension — so every CRNA claim here traces to the Nursing playbook and
      coa.yaml, matching personas/discipline-crna.yaml's job 4 and its switching_trigger (3), "a
      paywall on a critical standard."
      Nursing carries a second, different numeric ratio that shows how many axes this problem has:
      CCNE II-F's recommended 1:8 faculty-to-student ratio for INDIRECT supervision on nurse
      practitioner tracks is a faculty-workload figure computed across an assignment, not a slot
      attribute. The three-tier faculty association model supplies both numerator and denominator and
      nothing computes or alerts on it — and because 1:8 is about Faculty and F.7 is about Personnel,
      a school running BSN/NP tracks alongside CRNA needs two different ratio computations over two
      different entity stores.
      Calibration proper is the finding that most changes the four-domain picture. That reading
      concluded CODA 2-6's substantive ask is unaddressed by anything in the product; that is now too
      strong. PT's CIET v2.0 ships a real, blocking, threshold-scored rater-training gate — 20
      questions, 15 to pass, unlimited retakes with wrong answers highlighted, its own live
      training-quiz report — and a CI who has neither passed nor attested cannot rate a student. No
      competitor teardown documents rater training, rater calibration, or any gate on who may complete
      an instrument at all; CORE ELMS and Elentra describe who RECEIVES a form, never who is qualified
      to FILL one. The product question for the expansion domains is therefore not "can Prism do
      calibration" but "can the CIET quiz mechanism be generalised to an arbitrary instrument," which
      no source answers. Two sharp edges on it: a pass persists once-ever across every course and
      placement, which is operationally sensible and exactly the wrong semantics for CODA 2-6's
      ONGOING calibration obligation — note the asymmetry that the module with expiry semantics
      (Faculty Compliance) has no training content and the mechanism with training content has no
      expiry semantics, and neither knows the other exists; and the CI attest-and-bypass toggle
      ("has the instructor taken the quiz earlier? Yes") is an unverified honour system, so a CAPTE
      reviewer asking how the program knows a CI was trained gets, for every bypassing CI, "they said
      so." No source confirms whether the training-quiz report shows who BYPASSED, which is the number
      4P actually needs. The nearest calibration analogue outside PT is the reviewer attestation on
      log approval used by SLP and CRNA — which makes a supervisor ACCOUNTABLE for the accuracy of a
      review without making them CALIBRATED, and which is disabled entirely when logs are set to
      auto-approve. That toggle carries a live contradiction between sources that should be resolved
      before it is used with a customer: the PA transcript describes the same Enable Attestation
      control as binding the STUDENT before submitting (an academic-integrity pledge), while the SLP
      and CRNA transcripts describe the CLINICAL EDUCATOR signing at review. All three share the
      auto-approval exclusion so this is one mechanism described three times, but the readings are not
      interchangeable — if PA's is accurate for PA, PA has no reviewer-accountability artifact
      anywhere in its log workflow, and the PA transcript separately states that auto-approval
      disables preceptor review outright.
      Orientation delivery and the two thinnest disciplines close the stage. The Site Resources page's
      Resources for Clinicians section answers five accreditors across four disciplines at once (CCNE
      II-G, ACEN 2.9, ACOTE C.1.10 and C.1.8, COA F.6, CSWE 3.3.4.a.ii) and is genuinely shipped — but
      it is documented as UNDER-ADOPTED, with the OT ACOTE guide advising administrators to paste the
      link into their email signatures, which is what you do when a surface is hard to find, and
      distribution is not acknowledgment: publishing a preceptor handbook proves availability, not
      that any named preceptor read it, and nothing links a Site Resources document to an attestation
      on a person's record. The supported preceptor-notification path (Placements > Email & Publish)
      is bulk-capable but fires off an EXISTING placement, so the orientation message reaches the
      preceptor AFTER the student has been assigned to them — the wrong side of ACOTE C.1.10's "prior
      to the start," ACPE 3.3.c's "before accepting a student," and CCNE II-G alike. That is the same
      gap the Place Student drawer shows from the credentialing side, where the Preceptor/CI dropdown
      still carries no visible validation against the Clearance Dashboard's own credential columns.
      The asymmetry worth naming: Prism can bulk-EMAIL preceptors and cannot bulk-CREDENTIAL them —
      the Experiential Supervisor Intake Form sends one supervisor at a time, which caep.yaml,
      nursing.yaml and caa-asha.yaml each independently call a real operational problem, and which is
      worst for Teacher Education, where an EPP places an entire cohort with a different cooperating
      teacher each, in a new set of schools, every semester. TE is also the hardest orientation ask of
      the twelve — CAEP R2.2 requires the EPP and its P-12 partners to jointly DESIGN AND DELIVER
      training to clinical educators and show three cycles of data on it, i.e. delivered training with
      CONTENT rather than a completion flag, with a co-owner Prism does not model; the closest
      confirmed analogue is the ComplianceJunction pattern (vendor Course Id plus Course Link tracked
      as a compliance item) repointed at EPP-authored training. And TE is the largest evidence hole in
      the twelve-discipline picture for this stage: TEVideosTranscripts.md is 37 lines and contains
      zero occurrences of "cooperating teacher," "mentor," "supervisor," "credential" or "orientation"
      (grep-verified), so whether the PIF's auto-generated per-discipline field set produces anything
      usable for TE is unconfirmed in either direction, and every TE rating here is reasoned from
      caep.yaml rather than observed. SLP is thin in a different, more specific way: Clinical Educator
      is a first-class filter across the entire SLP report suite but never the UNIT of a qualification
      rollup, so SLP is well served for supervision hours and poorly served for supervisor
      qualification. CAA 2.3 asks about all individuals providing clinical education both on-site and
      off-site; the operative CFCC V-E figure — direct supervision as a percentage of each student's
      total contact with each client — is not computed anywhere; CAA 2.3's separate workload-weighted
      "majority of academic content taught by doctoral faculty" composition calculation has no
      mechanism at all; and new custom forms require a prism-support@exxat.com ticket, so SLP cannot
      self-serve the instruments the other disciplines build. The shared fix across three of these
      disciplines is small and identical: promote the threshold-bearing facts to structured Personnel
      fields — an accredited-program boolean and a degree-conferral date for CSWE B3.3.6/M3.3.6, a
      years-of-full-time-practice field for ACOTE C.1.13, and a clean degree taxonomy for ARC-PA
      A2.15/A2.16d, whose majority-PA/physician test and 10% non-PA/MD ceiling are computed by hand in
      Excel today partly because Degree is free text and "MD," "M.D." and "Doctor of Medicine" are
      three different strings. With those fields in place, the Comprehensive Personnel Report that
      already ships for PA, SW and OT answers all three standards without new construction.
    discipline_notes:
      - subject: "PT/PTA"
        detail: >-
          PT/PTA is the reference implementation and produces the strongest preceptor-qualification artifact
          anywhere in the twelve disciplines: Total Qualifications of CIs, named in-product for CAPTE 2024
          4P (2016 4O), COMPUTED from the CI Details form's education / clinical-experience /
          teaching-experience / evaluation-skills fields rather than typed by an evaluator, and the report
          the Annual Accreditation Report uses to answer "% credentialed CIs," "% with advanced
          certification," and "any CI with under one year of experience" — capte.yaml rates 4P Transfer and
          calls it the strongest existing proof point in the file. Its operating prerequisite is a Learning
          Activity Group per cohort/academic year, and its two limits are worth carrying: PTA Element 4N
          makes CI eligibility jurisdiction-conditional (a licensed PTA may serve "if permitted by the state
          practice act") and Prism has no state-practice-act rule layer, and the field source feeding it is
          a standard form programs cannot edit. PT also runs its ELIGIBILITY CHECK and licensure renewals on
          the CI Details form rather than on the Placement Clearance Dashboard, which means the check is
          activated per course offering — a program running Clinical Experience I/II/III activates it three
          times per cohort, and a missed activation silently produces a cohort with no CI qualification data
          and a hole in the 4P report. One pattern from PT should be copied outright by the expansion
          domains: the CI Details review path (Pending School Review, then either Reviewed or Un-submit to
          student) is a genuine reject-with-correction loop, where the Sites-module PIF's Save and Sync is
          one-way and irreversible with no reject path. Calibration proper is the finding that most changes
          the four-domain picture. That reading concluded CODA 2-6's substantive ask is unaddressed by
          anything in the product; that is now too strong. PT's CIET v2.0 ships a real, blocking,
