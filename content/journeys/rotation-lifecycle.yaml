      - subject: "SLP"
        detail: >-
          SLP, Nursing, CRNA, Social Work and Teacher Education have no shipped standard instrument at all:
          caa-asha.yaml states SLP has "NO free, validated, off-the-shelf standard instruments the way PT
          does or OT does," and nursing.yaml says the same in near-identical words. Those five reach the
          same outcome by configuring two separately-anchored forms, which is functionally equivalent but
