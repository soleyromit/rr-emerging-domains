      - subject: "PA"
        detail: >-
          Before this is used in a PA conversation, confirm whether the PA drawer offers the supervisor-side
          variant at all, because the PA transcript separately establishes something stronger and one level
          up the chain: enabling auto-approval does not merely disable the attestation, it DISABLES
          PRECEPTOR REVIEW ITSELF ("if you select Yes, the option for preceptor review of the patient log
          will be disabled"). That turns the existing advice conflict into a serious one — the PA playbook
          recommends turning auto-approval on "for ease of approval/review," while coa.yaml concludes that
          for CRNA auto-approval "should be treated as configuration malpractice" — because both are
          advising on a toggle that silently removes the clinician from the workflow. A PA program following
          its own playbook's convenience advice produces patient logs no clinician ever saw, which is
          defensible for a low-stakes activity log and is not defensible as ARC-PA B3.03 evidence. PA's
          mechanics are the ones the expansion domains would inherit most directly. Diagnosis and Procedure
          Minimums let a program set per-rotation encounter floors so students see gaps in real time — no
          competitor file documents a configurable per-diagnosis or per-procedure minimum-count threshold at
          all — but they are not self-service: the program states them on separate tabs of an Excel intake
          sheet during requirements gathering and Exxat loads them. Patient Log TEMPLATES are usefully
          framed in the PA tutorial as "different patient log TYPES," so one-template-per-course is the
          mechanism for variety rather than a limit on it — but the support dependency covers CHANGES TO
          EXISTING templates as well as new ones, which is the sharper half, because for PA and CRNA the
          layout IS the accreditation evidence model, so an accreditor edition change (COA's January 2026
          Appendix, ARC-PA's 6th Edition) is a vendor ticket rather than an admin task. Two PA details that
          read favourably: patient-log reports can be generated while logs sit in Pending Review, which is
          what makes B3.04's "spot gaps while there is still time to re-place a student" behaviour actually
          possible; and the aggregate report's Group By supports a two-lens read both the PA and Nursing
          playbooks document independently — grouping BY STUDENT surfaces gaps in demographics, age groups,
          diagnoses and encounter types so placements can address deficiencies before graduation, grouping
          BY LOCATION identifies which locations provide stronger exposure to which populations. Same
          control, two different accreditation questions. On the Timesheet side PA carries a live
          configuration hazard with no guardrail: ARC-PA's 50% and 20% telehealth ceilings are only
          computable if Telehealth is a SINGLE-SELECT category, because hours tagged both "Telehealth" and
          "In-Person" make the percentage meaningless — the PA accreditation-reports guide states the
          correct answer outright, and the setup screen does not.
      - subject: "SLP"
        detail: >-
          SLP has the finest-grained capture model in the product and the least self-service control over
          it. Clinical Log is confirmed a genuine module split rather than a relabelled Patient Log —
          capability-map.yaml says so outright — which is why the whole SLP report family aggregates hours
          rather than case counts and why PA's diagnosis/procedure-minimum model does not transfer. Student
          Participation Type (Direct Contact vs Observation), Practice Type (Intervention vs Evaluation with
          the minutes split WITHIN one encounter), Mode of Delivery and Training Level are all first-class
          fields and first-class reporting axes, giving CAA's 400 / at-most-25-observation /
          at-least-325-graduate rule three separate measurable dimensions. What is missing is the composite:
          no view asserts "412 total, 18 observation, 340 graduate — PASS," and the min/max hour thresholds
          that would red-flag an under-logged student are confirmed support-configured only, so the
          discipline with the hardest numeric hour rule in this file is the discipline that cannot configure
          its own threshold. That same support-gated mechanic is independently named by nursing.yaml as what
          CCNE III-H needs and cannot have, and by cswe.yaml as what CSWE AS 3.3.3 needs — one discipline's
          support-gated feature is simultaneously two others' documented wish-list item, which argues for
          promoting it to a self-service cross-discipline threshold model. SLP also owns the most
          distinctive supervision-evidence artifact found on either side of this research: the Clock Hours
          report prints, at the bottom, "the attestations that supervisors have attested to AND THE NUMBER
          OF HOURS THEY REVIEWED." That reviewed-hours total sits on the same page as the student's accrued
          hours, which puts CFCC V-E's 25% direct-supervision floor one division away — the numerator and
          denominator are already printed together; what is missing is the arithmetic and a per-client
          breakdown, since CFCC states its floor per client and the report aggregates per student. Two
          smaller SLP findings worth carrying: the same report is reached under different row labels for
          different audiences (admins are told to click "Hours by Category," students to click "Clock
          Hours"), which is good product economics and bad discoverability and confirms SLP's headline
          clock-hour artifact is the SAME report every other discipline uses; and the SLP playbook's own
          stated gap that the corpus never enumerates the nine KASA service-delivery areas is now partially
          corrected — the administrator tutorial's worked example names "voice and resonance" as a live
          COLUMN HEADING in a shipped report, so at least one of the nine ships rather than being
          program-invented. The other eight remain unverified, and one screenshot of the Types of Service
          column set would settle it.
      - subject: "Nursing"
        detail: >-
          This is the most discipline-varied stage in the journey because the UNIT OF RECORD itself changes:
          PT/PTA and OT/OTA capture hours on a Timesheet (and PT essentially never uses an encounter log at
          all); PA captures encounters on a Patient Log plus hours for the ARC-PA telehealth ceilings; SLP
          captures TIME on a structurally separate Learning Activity type (Clinical Log), split
          intervention/evaluation and direct-contact/observation; Nursing captures hours by category plus
          Patient Log encounters; Social Work captures hours with break and time-off auto-deduction; CRNA
          captures cases AND anesthesia time AND procedures AND duty hours on one CCE log; and Teacher
          Education has no documented hour or encounter surface at all, only a GoReact/Echo360 LTI video
          assignment. Three cross-cutting objects do the accreditation work in every one of them — the
          per-log supervisor link, the preceptor-signed attestation at review time, and the threshold report
          — and each has a distinct defect. The sharpest single finding is a documented contradiction
          between three Exxat-authored sources about the same control. The Enable Attestation toggle on the
          log setup drawer is described in the SLP tutorial as "an attestation that CLINICAL EDUCATORS need
          to sign WHEN THEY REVIEW student submitted logs," in the CRNA tutorial as requiring "PRECEPTORS to
          acknowledge an attestation when reviewing logs," and in the PA tutorial as a statement "if you
          want STUDENTS to acknowledge a statement BEFORE SUBMITTING THEIR LOGS. For example, you can
          include an academic integrity statement." All three share the same auto-approval exclusion, so
          this is one mechanism described three times rather than two mechanisms — but the readings are not
          interchangeable as evidence: a student-signed integrity pledge is an academic-honesty artifact,
          while a supervisor-signed post-review statement is the supervision-accountability artifact CFCC
          Standard V-E and COA C.4 actually ask for.
      - subject: "Social Work"
        detail: >-
          Social Work's hour capture is well modelled and quietly configuration-dependent. The Timesheet
          carries date, activity description, site and Category (so CSWE's activity-description expectation
          is a named field for SW rather than a repurposed notes box, though nothing confirms it is
          mandatory or validates its content), logs both in-person and virtual hours, and auto-deducts break
          and time-off hours in a way the help guide explicitly ties to CSWE's rule that breaks do not count
          toward the 400 BSW / 900 MSW minimums. But the break behaviour is contested across sources and
          must not be stated flatly: the general Hours by Category report is documented as showing "total
          approved hours (including break time)," while the transcript's "total timesheet time excluding
          breaks" is a separate derived figure that exists only if break capture was required at setup — so
          a Social Work program in particular cannot assume the headline number is CSWE-clean. The
          in-person/virtual distinction rides on the program-authored Category taxonomy rather than a
          modelled attribute, which is a notable asymmetry inside Prism itself: SLP gets Mode of Delivery as
          a first-class field and a reporting axis, SW gets the same concept only if an admin thinks to
          encode it as a Category value — and if the program answered No to "do you want students to
          categorize each Timesheet entry?", the distinction does not exist for them at all. SW is also the
          one confirmed case where the student CHOOSES between two structurally different supervisor roles
          as their hours reviewer (Field Instructor or Task Supervisor), and no source confirms the
          resulting record distinguishes which role signed — which is exactly the distinction CSWE AS
          B3.3.6/M3.3.6 rests on. Because CSWE's minimum is a PROGRAM total across every field experience
          rather than a per-placement one, the Students > Overview cumulative dashboard is structurally the
          right artifact and the per-course report is the wrong shape; the threshold is still not asserted
          anywhere, and cswe.yaml confirms nothing red-flags a student tracking short of the floor.
      - subject: "Teacher Education"
        detail: >-
          Two absences close the stage. Teacher Education has no in-rotation capture surface that can be
          described from the available sources at all: the only documented TE workflow is the
          GoReact/Echo360 LTI video assignment, which is genuinely good (two-way sync, Prism auto-creates
          the matching GoReact activity on first save, reviewers leave timestamped comments and scores that
          flow back) but is discipline-gated behind a support ticket, and is performance-based evidence
          rather than the Duration or Breadth evidence CAEP R2.3 also demands. No TE hour category taxonomy,
          threshold, or hours report is documented anywhere, and early field hours plus a culminating
          student-teaching semester are two structurally different hour-capture problems in one program.
          CAEP's Diversity attribute is the deeper structural mismatch: in every health discipline the
          diversity dimension (age group, condition, setting) is a property of the ENCOUNTER and therefore
          capturable on a log, while CAEP's is a property of the partner SCHOOL's student body, which no
          log-shaped object can capture. And the Dentistry-facing gap this stage already recorded is
          confirmed rather than resolved from the discipline side: the only system-provided procedure-coding
          lookup category is CPT, not CDT — and the same absence pattern holds across the existing
          disciplines, since no source names an NBCRNA case-category set, an ASHA nine-service-delivery-area
          set, or a CSWE nine-competency set as a Standard lookup either. Every one of them is program- or
          support-loaded, which makes the shipped-taxonomy question, not the capture question, the real
          cross-discipline gap.
      - subject: "CRNA"
        detail: >-
          CRNA is the strongest discipline fit in the stage and simultaneously carries its most severe gaps.
          The CCE log's Encounter Details block puts Preceptor, Date of Service, Total Hours of Anesthesia
          Time, Total Clinical Log Hours, Total Cases and Procedure on ONE record, so a single entry carries
          case-count, hour and procedure evidence at once, and eight repeatable sub-sections map one-to-one
          onto COA's own Appendix families (Patient Physical Status; Patient Assessment; Special Cases;
          Anatomical Categories; Methods of Anesthesia; Arterial Technique; Central Venous Catheter;
          Pulmonary Artery Catheter). coa.yaml rates C.4 the strongest Transfer in its file, and the Student
          Activity Insights report renders progress with exactly the traffic-light semantics E.2.3 needs —
          green at or above minimum, amber approaching at roughly 80-99%, red below, with the tutorial's own
          worked example being a minimum of 200 against 21 entered. The NBCRNA Transcript Report is the
          single strongest discipline-fit artifact anywhere in this stage: a certification-body-formatted
          export derived from the same logs that serve accreditation, and the template for what an
          equivalent would look like in the expansion domains. Against that: the "+Add" repeatable model
          makes COA's "count all that apply" footnote mechanically possible but no source confirms the
          THRESHOLD engine counts one encounter twice rather than assigning it to one category; there is no
          actual-vs-simulated flag, which COA requires because certain rows cannot be satisfied by
          simulation alone; there are no cohort-conditional thresholds, so the dagger-marked rows binding
          only students matriculating on or after January 1 2026 mean one course offering must run two
          threshold sets; nothing validates the consistency rule COA's own glossary states (Total Clinical
          Log Hours must be greater than or equal to Total Hours of Anesthesia Time), even though the two
          fields sit adjacent on the same block; there is no Program-Administrator affirmation tier above
          preceptor approval, which is precisely where COA's Guidelines for Counting Clinical Experiences
          vests final quantification authority; and no CRNA report aggregates by PRECEPTOR at all — the
          preceptor is captured per case but treated purely as a reviewer, which is why F.7's observed 2:1
          ratio cannot be computed from log data.
      - subject: "CRNA"
        detail: >-
          Duty hours are worse still: F.9's three rules are all temporal-adjacency computations (a 10-hour
          rest gap between consecutive shifts, a 16-hour continuous-care ceiling, a four-week rolling
          64-hour average spanning class AND clinical time), and the only shipped control in the vicinity is
          a per-day maximum-hours integer. Two primitives already exist and are unconsumed — Start Time /
          End Time on every entry, and the Overnight toggle that already models a duty period crossing
          midnight — making the rest-gap rule the cheapest of the three to build. Worth stating precisely
          because it is a design trap: a four-week AVERAGE deliberately tolerates one heavy week, so
          shipping a naive per-week snapshot would produce false violations and is worse than shipping
          nothing. This is the sharpest direct competitor comparison in the whole file and Prism is behind:
          New Innovations ships Work Hours Monitoring with violation tracking, rule configuration and
          automated notifications; MedHub ships auto-alerts for violations; E*Value flags
          violation-triggering work hours; one45 and Leo/DaVinci both log duty hours. Five of nine
          competitor files name a duty-hour concept and three name a VIOLATION concept.
    key_findings:
      - subject: "PA"
        headline: "Three Exxat sources describe Enable Attestation three ways; auto-approval removes the clinician"
        severity: "gap"
        detail: >-
          The SLP and CRNA tutorials describe the clinical educator signing at review; the PA
          tutorial describes a student acknowledging an integrity statement. Worse, enabling
          auto-approval disables preceptor review itself — patient logs no clinician ever saw.
      - subject: "CRNA"
        headline: "The CCE log carries case, hour and procedure evidence on one record"
        severity: "none"
        detail: >-
          Encounter Details puts Preceptor, Date of Service, Total Hours of Anesthesia Time, Total
          Clinical Log Hours, Total Cases and Procedure on one record, with eight repeatable
          sub-sections mapping one-to-one onto COA's own Appendix families.
      - subject: "CRNA"
        headline: "COA F.9's duty-hour rules are temporal computations met by a per-day integer"
        severity: "gap"
        detail: >-
          A 10-hour rest gap between duty periods, a 16-hour continuous-care ceiling and a four-week
          rolling 64-hour average spanning class AND clinical time, against one per-day
          maximum-hours setting. Start Time, End Time and the Overnight toggle exist unconsumed.
      - subject: "SLP"
        headline: "Numerator and denominator for CFCC's 25% floor print on one page, unsummed"
        severity: "gap"
        detail: >-
          The Clock Hours report prints the attestations supervisors signed and the hours they
          reviewed on the same page as the student's accrued hours — one division from CFCC V-E,
          except CFCC states its floor per client while the report aggregates per student.
      - subject: "PT/PTA"
        headline: "PT satisfies a case-mix standard with retrospective survey answers, not encounters"
        severity: "gap"
        detail: >-
          PT essentially never uses encounter logging, and both reports named for CAPTE 6H source
          their data from PTSE 1 questions 7 and 3 — a student's survey AFTER the experience ends,
          so nothing shows mid-curriculum that a required setting is unmet.
      - subject: "Dentistry"
        headline: "The only system-provided procedure lookup is CPT, so CDT-coded steps have no home"
        severity: "gap"
        detail: >-
          CODA 2-24's roughly fifteen clinical categories are evidenced by procedure logs that are
          natively CDT-coded, tooth- and surface-level, and faculty-signed. No NBCRNA, ASHA or CSWE
          set ships as a Standard lookup either.
      - subject: "Medicine"
        headline: "The supervisor-to-encounter link ships; the role/level half is confirmed absent"
        severity: "gap"
        detail: >-
          LCME 9.3 wants a named supervisor with role and level tied to a named student per
          encounter. The per-log Experiential Supervisor field ships and is distinct from the
          placement-level assignment, but role and level are absent and no supervision chain is
          modelled.
      - subject: "Pharmacy"
        headline: "Simulation ships as an example category; auto-excluding it from a total is unconfirmed"
        severity: "configure-needed"
        detail: >-
          ACPE 3.1.b needs 300 IPPE clock hours including 75 community and 75 hospital with
          simulation EXCLUDED. Timesheet Category Configuration ships a nested taxonomy whose
          example list includes Simulation, but automatic exclusion from an aggregate is
          unconfirmed.
  - stage: "6. Midpoint formative feedback & early-risk intervention"
    current_state_in_prism: >
      The single cleanest fit in the entire accreditation research. lcme.yaml rates LCME 9.7
      **Transfer** and states it "maps almost one-to-one onto the confirmed anchor-relative
      scheduling primitive... a midpoint-formative-feedback trigger is exactly what that
      primitive was built for." Early-Risk Alerts and Competency Tracking sit in the
      intelligence layer as the escalation path once a low score lands.
    pain_or_gap: >
      Little gap on triggering; the gap is on *closing the loop*. Firing the midpoint form is
      solved; proving it was actually delivered for every student/rotation pair, and then
      tracking what happened when it was bad, is not. CODA 2-2 requires a documented
      individual-evaluation and due-process decision trail when a student falls below
      published criteria — coda.yaml notes Early-Risk Alerts can plausibly surface the
      trigger, but "a formal due-process case-management trail distinct from a compliance
      checklist item is not confirmed." So the alert exists and the case record does not.
      For rotations under four weeks (common in Pharmacy IPPE and dental specialty rotations)
      an alternate feedback method is required, which the midpoint anchor does not express.
    accreditation_link: >
      LCME Standard 9, Element 9.7 (formal formative feedback early enough to allow
      remediation, at least at the midpoint, with an alternate method for experiences under
      four weeks; plus compliance tracking of whether midpoint feedback was actually delivered
      for every student/rotation pair) — **Transfer**, the flagship fit for the anchor
      primitive. CODA Standard 2, Element 2-2 (individual evaluation and due-process decision
      trail with timestamps and outcomes, "not just the triggering data point") — Configure.
      ACPE Standard 3, Key Element 3.1.b (alert advisors when a student is off-pace *before*
      the IPPE window closes — a pacing alert, not an end-of-term finding). CODA Standard 2,
      Element 2-9 (pacing alerts when a student falls behind the patient-experience volume
      needed to graduate on schedule).
    competitor_comparison: >
      Genuine parity-to-slight-advantage for Prism, and the one stage where the anchor
      primitive is directly demonstrable. E*Value ships midpoint-to-end-of-rotation summary
      evaluations with automated low-score alerts and forced comments on low scores
      (medhub.com/software/evalue). CORE ELMS ships low-score alerts and due-date reminders.
      one45 gives students real-time access to longitudinal feedback. Leo ships on-demand
      evaluation links emailed to clinical faculty with no login required — a small but
      pointed UX advantage for community preceptors who will not maintain an account.
      Nobody is documented as doing anchor-relative scheduling of the trigger, and nobody is
      documented as tracking midpoint-delivery *compliance* as a reportable figure, which is
      literally what LCME 9.7 asks a program to prove. That reportable — "% of student/rotation
      pairs with midpoint feedback delivered on time" — is a small build on shipped data and a
      differentiated, standard-citable claim.
    domain_variance: >
      Medicine and DO — the midpoint anchor works as designed on 4-12 week clerkship blocks;
      this is the native case. Pharmacy — APPE rotations at 4-6 weeks fit the midpoint model,
      but IPPE placements are short and recurring, frequently under four weeks, triggering
      LCME-style alternate-method logic and shifting the useful signal from "midpoint feedback"
      to "cumulative hour pacing against the 300/75/75 thresholds." Dentistry — there is no
      rotation midpoint to anchor to at all for core clinical work; formative feedback is
      continuous and per-procedure (faculty sign-off at each step), so the anchor primitive
      has to be re-expressed as a threshold on quota progress rather than a date offset.
      DO adds a discipline-specific formative dimension: OMM/OMT skill assessment runs
      alongside clinical performance and is assessed separately (COCA 6.4's seventh
      competency, OPP/OMM).
    discipline_variance: >
      The four-domain reading of this stage is that the anchor-relative primitive solves
      midpoint feedback and only closing the loop is hard. Across the eight existing disciplines
      that holds for the SCHEDULING half and breaks in two other places: which discipline has a
      shipped instrument to anchor at all, and whether escalation is self-service. The
      instrument split is stark and two-tier. PT/PTA is richest — PTSE 1, PTSE 2, CI Details
      Form and Timesheets as standard forms, plus CIET v2, PTA CIET, SCIPAI, PTMACS and PTAMACS
      as performance assessments, with SCIPAI notable as the only instrument in the corpus
      designed for MORE than two capture points inside one placement. OT/OTA is nearly as rich
      and deeper on notification logic, shipping five AOTA FWPE forms including a Supplement
      form used when an educator leaves mid-session and a new one takes over — a real
      mid-placement evaluator-handoff case no other discipline models, and exactly the scenario
      in which midpoint feedback would otherwise be orphaned. PA sits in the middle: standard
      patient-log templates exist and a Preceptor Evaluation of Student is standard practice,
      but the mid-point evaluation itself is listed in the PA playbook as OPTIONAL — optional
      practice, not merely optional configuration — which is the single sharpest line-level risk
      in this stage against ARC-PA B4.01's "timely" test. SLP, Nursing, CRNA, Social Work and
      Teacher Education have no shipped standard instrument at all: caa-asha.yaml states SLP has
      "NO free, validated, off-the-shelf standard instruments the way PT does or OT does," and
      nursing.yaml says the same in near-identical words. Those five reach the same outcome by
      configuring two separately-anchored forms, which is functionally equivalent but leaves no
      single object representing "this student's midterm-and-final assessment" — and custom form
      creation is support-gated. That instrument library is a real differentiator invisible in
      competitor marketing, because no competitor file names a single validated clinical
      instrument it ships: CORE ELMS and E*Value both sell a form BUILDER across 15+ and 24+
      disciplines respectively, not a library. It is also exactly what makes PT/PTA and OT/OTA
      cheap to onboard and SLP, Nursing, SW and TE expensive.
      The crux of the stage, cross-discipline, is that detection is configurable and escalation
      is a services engagement. Setting a low-score threshold on the Forms/Evaluations setup
      screen produces the in-app red highlight on the review grid immediately; turning on the
      outbound low-score email requires a support ticket naming each recipient's first name,
      last name and email — as does the richer question-level response-based trigger, which
      additionally needs the Account Manager and Configuration team, so it is two tickets and two
      teams for one behaviour. SLP is the worst-compounded case and caa-asha.yaml calls it "the
      clearest SLP-specific self-service gap in the whole file": BOTH SLP trigger mechanisms are
      support-gated (min/max hour thresholds AND question-based early-alert notifications),
      alongside new custom forms. The consequence is that the hand-maintained recipient list goes
      stale as faculty turn over, visible on the read-only configured-notifications display at
      the bottom of the setup screen but not fixable there — a genuine mitigation worth naming,
      since the coordinator can at least SEE what support configured without filing a ticket.
      OT/OTA is the one discipline where the alerting is genuinely instrument-aware, and it is
      the strongest early-risk logic in the product: the FWPE response-based alert fires by
      default on ANY rating of 1, and additionally on a 1 OR 2 on three specific Fundamentals of
      Practice items — adherence to AOTA's Code of Ethics and applicable regulations, compliance
      with safety regulations including accurate incident reporting, and ensuring safety for self
      and others by anticipating and preventing hazards. That is severity tiering by item
      semantics rather than a flat numeric cutoff, and it arrives with the educator's own
      mandatory justification comment attached. But OT's published low-score threshold defaults
      (111 for OT, 91 for OTA) carry a damaging caveat: the threshold applies to BOTH midterm and
      final, so Exxat's own best practice is to hold it OFF until all midterms are submitted and
      reviewed — the alert is recommended-off during precisely the window this stage exists to
      serve. That is a product design gap rather than a configuration one, a per-term (or
      midterm-only) threshold would resolve it outright, and it is the single highest-value fix
      identified in the flow file. Note the corollary: for OT the response-based alert is the real
      midpoint safety net and the low-score threshold is the decoy. The OT default-trigger package
      is content, not engine — shipping equivalent defaults for other disciplines' instruments is
      content work rather than engineering.
      PT/PTA carries a design contradiction worth surfacing because a program inherits it without
      choosing it. CIET v2.0 runs PARALLEL and BLINDED — student and CI complete simultaneously
      via their own links and neither sees the other's ratings until both submit, explicitly to
      eliminate anchoring bias — while PTMACS/PTAMACS runs strictly SEQUENTIAL and deliberately
      NON-blinded, emailing the CI only after the student finishes and showing them the student's
      rating and comment per question as they enter their own. Two instruments, same product,
      same discipline, same midpoint, opposite bias-control philosophies, and nothing in the
      corpus explains the tradeoff to a program choosing between them. The blinding mechanism is
      the most defensible discipline-specific claim in this stage and is instrument-agnostic in
      principle: no competitor documents blinding, anchoring-bias control, or dual-perspective
      concurrency at all, and E*Value's nearest claim — "pre-populated evaluation results" — is
      arguably the opposite design choice. PT's structural fragility is the dispatch direction:
      the CI cannot receive the midterm CIET until the STUDENT selects them and clicks Send, so a
      disengaged or struggling student — exactly the population this stage exists to catch — is
      the one least likely to dispatch the form that would flag them, and no admin-side override
      to dispatch directly is documented. Contrast OT, where admin-side Send Form / Set up
      Automation pushes the FWPE at "Mid of placement" and removes the student from the critical
      path entirely. Two smaller PT findings: the admin can OVERRIDE a CI's evaluation on an
      accreditation-evidence instrument with no confirmed audit trail on CIET, where OT's SEFWE
      forms do carry an Audit Log with full change history — that asymmetry is the substantive
      weakness; and both PTMACS and PTAMACS state that "the system will not process any comments
      that are added once you pass the 10000-character limit," i.e. silent truncation of a CI's
      narrative about a struggling student, in the exact field carrying the qualitative evidence.
      The cap is generous, the silence is the defect. Also note the PT/PTA onboarding trap where
      the same "does this form require placement?" toggle carries opposite default guidance across
      two PT instruments (always Yes for PTSE 1; defaults to Yes but may be No for CIET).
      CRNA does not have a different midpoint FORM, it has a different midpoint MODEL, and that is
      the most genuinely distinct discipline finding in the stage. For nurse anesthesia the
      formative signal is continuous — a per-clinical-day evaluation that over a three-year
      doctoral program generates thousands of forms per cohort — so the load-bearing product
      problem is aggregation rather than scheduling. The Daily Clinical Forms/Evaluations Report
      exists for exactly that: select the daily instrument, filter by student/rotation/course/
      status, choose whether to include student responses, preceptor responses, or both (rendered
      side by side per question when both are included), and download one PDF per student or a ZIP
      for many. Dual-perspective rendering is a real early-risk surface — a systematic gap between
      a student's self-rating and their preceptor's is itself a risk signal, and this is the only
      place in the corpus that renders that comparison — and it serves COA H.1.2.7's separate
      requirement that students evaluate their own achievement. Three limits. It is an aggregation
      and EXPORT layer, not a competency computation: it reports response counts and percentage
      distributions per question where COA H.1.1.1 asks for achievement against Graduate Standards
      D1-D50, and bridging the two requires the daily instrument's questions to be mapped into
      Competency Management, which coa.yaml says should be verified rather than assumed. Nothing
      COMPUTES the student-versus-preceptor divergence. And the transcript states these per-student
      PDFs "can also be shared directly with clinical sites, giving preceptors and site
      coordinators visibility into student evaluation data" — a FERPA-adjacent disclosure path
      with no documented access control, and the artifact a struggling student would least want
      circulated. Most consequentially: no source confirms that a low-score threshold or a
      response-based notification is configured or configurable against a daily instrument
      generating thousands of submissions per cohort, so for the discipline with the highest
      formative volume in the product, early-risk detection is confirmed to be a human reading
      PDFs. That is the largest unmet early-risk opportunity in the file.
      A second signal type runs alongside performance scores and the four-domain reading misses it
      entirely: exposure pacing. Nursing/CRNA's Student Activity Insights report bands per-category
      completion green (met or exceeded the minimum), amber (approaching, roughly 80-99%) and red
      (below), with the CRNA tutorial's worked example being a minimum of 200 against 21 entered.
      This fires on ACCUMULATION SHORTFALL rather than on an evaluation result — a student can be
      rated perfectly well and still be red — and no competitor public material addresses that axis
      at all. The amber band is a genuine early warning rather than a failure report, and the
      playbook confirms availability to admins AND students, making it one of only two confirmed
      surfaces where a student sees their own early-risk signal without a coordinator mediating it
      (the other being Nursing's Competency Tracker). PA has the exposure-side complement in
      diagnosis and procedure minimums, framed by its own playbook as the early-risk mechanism —
      "gaps surface early (not just at rotation end), and interventions can happen while there's
      still time to fix exposure shortfalls" — which makes PA the only discipline confirmed to
      have BOTH a question-level performance trigger and a granular exposure-minimum trigger, and
      therefore the strongest overall early-risk story of the eight. Pharmacy's IPPE hour
      thresholds and SLP's min/max clinical-log thresholds are the same shape. But all of them
      share one absence: every one of these is a PULL surface. Nothing confirms that a student
      crossing from green into amber, or amber into red, generates any notification. Three
      disciplines, three different threshold mechanisms, one missing push — and it would be one
      build, since the thresholds, the bands, the notification engine and the recipient model are
      all already shipped and confirmed elsewhere in this same flow.
      The Communications-versus-Interventions split is the most cross-cutting element in the stage,
      cited by six accreditor registries, and it is where Prism's real advantage sits: every
      competitor claim here is about DETECTION (low-score alerts) and none is about the
      case-management object the detection is supposed to open. Discipline detail sharpens it in
      three directions. OT's playbook is the only source naming PROBATION as a captured state,
      which is evidence of real demand for a due-process-stage field the two-state Open/Closed
      model does not provide. Social Work's playbook describes Interventions as capturing
      "concerns/support activity, NOT NECESSARILY DISCIPLINARY" and records both tabs as read-only
      to students — so for SW an early-risk Intervention opened off a low midpoint score is a
      SUPPORT record the student cannot see unless the visibility toggle is set, the opposite of
      the escalation posture the four-domain framing implies, and it sits awkwardly beside the
      "make visible to student" toggle in a way no source reconciles. And CAEP explicitly warns
      against stretching Interventions to cover TE's complaint register, while R3.2's demand for
      three cycles of remediation data disaggregated by race/ethnicity is defeated by the fact that
      the remediation plan is an opaque attachment rather than structured data — though a
      Students > Reports > Race, Gender, Age & Ethnicity report does exist for PT, so this is a
      join that is absent rather than data that is missing, and materially cheaper to fix than it
      first appears. Two structural gaps recur regardless of discipline: nothing links an
      intervention record back to the evaluation score that prompted it, so ARC-PA B4.01's
      "identified and addressed in a timely manner" is provable only if a human remembers the
      sequence, and CAA-ASHA 4.3's "applied CONSISTENTLY across all students identified as needing
      intervention" requires knowing which students were identified — a set that exists only as
      transient email alerts, since nothing persists the fact that an alert fired. That missing
      alert-to-intervention link is the same underlying absence as the missing delivery artifact
      on Auto Notifications, and closing it once would serve LCME 9.7, ARC-PA B4.01 and CAA-ASHA
      4.3 together. This stage also carries an unresolved internal contradiction that should be
      settled before any of five standards is claimed as served: acote.yaml, arc-pa.yaml,
      caa-asha.yaml, cswe.yaml and caep.yaml all state flatly that there is NO dedicated
      Interventions report and that the only follow-up view is the Sites/Locations Dashboard on a
      24-hour refresh, while the PA playbook gives a concrete path (Students > Reports >
      Interventions and Communications) and the OT playbook names a Communication and Intervention
      Report. The likely reading is that a report exists but is not a follow-up TRIAGE surface —
      it lists interventions, it does not answer "which are overdue" — but that is inference, and
      a corpus this size should not disagree with itself about whether a named report ships.
      Two findings correct or sharpen the four-domain reading directly. First, the "no cross-student
      view" framing was too strong: Learning Activities > Review > Forms/Evaluations Summary does
      show every registered student's status for one form, confirmed independently from the CIET
      configuration guide and the FWPE guide, so the verdict is configure-needed at course scope
      escalating to a genuine gap at PROGRAM scope — what is still missing is the cross-course,
      cross-rotation rollup expressing "% of student/rotation pairs with midpoint feedback
      delivered on time," and acote.yaml (C.1.15's "chase stragglers") and arc-pa.yaml (B4.01's
      "whole test is timeliness") are asking for it alongside LCME 9.7. Related risk on the same
      screen: Review All produces the same Reviewed status, and the same apparent compliance
      record, whether or not any human read the red-highlighted row three lines above it — a
      confirmation surfacing "3 of these 24 forms are below threshold" would turn a
      compliance-theater risk into a triage moment. Second, the OT FWPE ships the one primitive
      that would most cheaply close the delivery-artifact gap for every discipline: a required
      "Student was informed of this review" attestation checkbox. Every other midpoint instrument
      in the corpus records the RATING; only the FWPE records, as a discrete required field, that
      the rating was DISCUSSED with the student — which is what "formative" actually means and
      what LCME 9.7, ARC-PA B4.01, COA H.1.1 and CAA-ASHA 5.2 all care about. Promoting it from
      an instrument field to a Forms/Evaluations engine option would give every discipline a
      delivery artifact.
      Two smaller structural notes and one honest absence. The one-active-notification-per-form
      constraint bites hardest where one assessment is split across forms: an SW program running
      the documented four-way split (mid-term, final, Field Instructor rating, student rating, all
      completed independently) needs four Auto Notification records to nudge one midpoint event,
      where PT and OT running a single multi-term instrument need one — an incidental advantage of
      the multi-term archetype that no source names as a reason to prefer it. The
      midpoint-to-final consistency risk is inverted across disciplines: ARC-PA B3.03 is the
      standard that names it and PA programs have been CITED when formative midpoint feedback
      contradicts the summative assessment, yet native carry-forward ships in OT (FWPE midterm
      responses and score visible while completing Final) and PT (PTSE 2, and CIET's configurable
      referring-form option) and NOT in the discipline carrying the citation risk, which has to
      reach the affordance through generic configuration and know to do so. And in NO discipline
      does the product DETECT divergence — displaying the midpoint answers beside the final is a
      prompt to a human, not a check. Nothing computes "this preceptor rated this student 2 at
      midterm and 4 at final with no intervening intervention record," and arc-pa.yaml says so
      plainly. That is the clearest unbuilt differentiator in this stage: computable from data
      Prism already holds, citable to a named standard, and claimed by no competitor. Finally,
      Teacher Education is the honest absence. Its only documented formative-feedback path is the
      GoReact/Echo360 LTI integration, which is behind a support ticket and discipline-gated, and
      what syncs back into Prism is scores and status — the timestamped comments and narrative
      feedback that actually constitute midpoint feedback to a teacher candidate live in GoReact.
      Three consequences: the low-score and response-based mechanisms are Forms/Evaluations
      features and no source confirms they operate on LTI activities, so TE's primary feedback
      channel is very likely outside Prism's early-risk detection entirely; a CAEP evidence pull
      would have to reach into a second vendor's system for the qualitative record; and the
      midpoint-to-final consistency question is not even askable for TE, because the narrative
      halves are not in Prism to compare. The TE playbook is explicit that no TE-specific
      instrument, report, terminology or accreditor mapping exists in any Exxat source and warns
      against citing CAEP standard numbers until confirmed, so the honest verdict for TE here is
      baseline-like by default, with one genuinely distinctive but externally-hosted feedback
      channel, and a real risk that the discipline's actual midpoint practice is undocumented
      rather than absent.
    discipline_notes:
      - subject: "PT/PTA"
        detail: >-
          The four-domain reading of this stage is that the anchor-relative primitive solves midpoint
          feedback and only closing the loop is hard. Across the eight existing disciplines that holds for
          the SCHEDULING half and breaks in two other places: which discipline has a shipped instrument to
          anchor at all, and whether escalation is self-service. The instrument split is stark and two-tier.
          PT/PTA is richest — PTSE 1, PTSE 2, CI Details Form and Timesheets as standard forms, plus CIET
          v2, PTA CIET, SCIPAI, PTMACS and PTAMACS as performance assessments, with SCIPAI notable as the
          only instrument in the corpus designed for MORE than two capture points inside one placement.
          PT/PTA carries a design contradiction worth surfacing because a program inherits it without
          choosing it. CIET v2.0 runs PARALLEL and BLINDED — student and CI complete simultaneously via
          their own links and neither sees the other's ratings until both submit, explicitly to eliminate
          anchoring bias — while PTMACS/PTAMACS runs strictly SEQUENTIAL and deliberately NON-blinded,
          emailing the CI only after the student finishes and showing them the student's rating and comment
          per question as they enter their own. Two instruments, same product, same discipline, same
          midpoint, opposite bias-control philosophies, and nothing in the corpus explains the tradeoff to a
          program choosing between them. The blinding mechanism is the most defensible discipline-specific
          claim in this stage and is instrument-agnostic in principle: no competitor documents blinding,
          anchoring-bias control, or dual-perspective concurrency at all, and E*Value's nearest claim —
          "pre-populated evaluation results" — is arguably the opposite design choice. PT's structural
          fragility is the dispatch direction: the CI cannot receive the midterm CIET until the STUDENT
          selects them and clicks Send, so a disengaged or struggling student — exactly the population this
          stage exists to catch — is the one least likely to dispatch the form that would flag them, and no
          admin-side override to dispatch directly is documented. Two smaller PT findings: the admin can
          OVERRIDE a CI's evaluation on an accreditation-evidence instrument with no confirmed audit trail
          on CIET, where OT's SEFWE forms do carry an Audit Log with full change history — that asymmetry is
          the substantive weakness; and both PTMACS and PTAMACS state that "the system will not process any
          comments that are added once you pass the 10000-character limit," i.e. silent truncation of a CI's
          narrative about a struggling student, in the exact field carrying the qualitative evidence. The
          cap is generous, the silence is the defect. Also note the PT/PTA onboarding trap where the same
          "does this form require placement?" toggle carries opposite default guidance across two PT
          instruments (always Yes for PTSE 1; defaults to Yes but may be No for CIET).
      - subject: "OT/OTA"
        detail: >-
          OT/OTA is nearly as rich and deeper on notification logic, shipping five AOTA FWPE forms including
          a Supplement form used when an educator leaves mid-session and a new one takes over — a real
          mid-placement evaluator-handoff case no other discipline models, and exactly the scenario in which
          midpoint feedback would otherwise be orphaned. OT/OTA is the one discipline where the alerting is
          genuinely instrument-aware, and it is the strongest early-risk logic in the product: the FWPE
          response-based alert fires by default on ANY rating of 1, and additionally on a 1 OR 2 on three
          specific Fundamentals of Practice items — adherence to AOTA's Code of Ethics and applicable
          regulations, compliance with safety regulations including accurate incident reporting, and
          ensuring safety for self and others by anticipating and preventing hazards. That is severity
          tiering by item semantics rather than a flat numeric cutoff, and it arrives with the educator's
          own mandatory justification comment attached. But OT's published low-score threshold defaults (111
          for OT, 91 for OTA) carry a damaging caveat: the threshold applies to BOTH midterm and final, so
          Exxat's own best practice is to hold it OFF until all midterms are submitted and reviewed — the
          alert is recommended-off during precisely the window this stage exists to serve. That is a product
          design gap rather than a configuration one, a per-term (or midterm-only) threshold would resolve
          it outright, and it is the single highest-value fix identified in the flow file. Note the
          corollary: for OT the response-based alert is the real midpoint safety net and the low-score
          threshold is the decoy. The OT default-trigger package is content, not engine — shipping
          equivalent defaults for other disciplines' instruments is content work rather than engineering.
