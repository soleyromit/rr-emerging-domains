          SLP-specific self-service gap in the whole file": BOTH SLP trigger mechanisms are support-gated
          (min/max hour thresholds AND question-based early-alert notifications), alongside new custom
          forms. The consequence is that the hand-maintained recipient list goes stale as faculty turn over,
          visible on the read-only configured-notifications display at the bottom of the setup screen but
          not fixable there — a genuine mitigation worth naming, since the coordinator can at least SEE what
          support configured without filing a ticket.
