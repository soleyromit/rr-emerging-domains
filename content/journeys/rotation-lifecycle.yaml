      - subject: "OT/OTA"
        detail: >-
          The consistent defect is that designation is a LABEL, not a RULE: nothing ties "Level II Fieldwork
          Educator" to ACOTE C.1.13's licensed-OT-plus-one-year bar, or "Task Supervisor" to CSWE's
          requirement that a qualified off-site Field Instructor exist on the same placement. Every
          role-conditional qualification rule across these disciplines is enforced by a human remembering
          it. OT/OTA runs the same instrument shape and hits the confirmed OT-specific failure mode: the
          Fieldwork Educator Details Form's CV and credential data does NOT sync to the Personnel record, so
          schools re-key it by hand — exactly the failure ACOTE C.1.13's "document and verify PRIOR TO the
          start of Level II fieldwork" language punishes. OT programs therefore run two credential stores
          that do not talk to each other, and the Placement Clearance gate reads only the second. OT also
          owns the only shipped, accreditor-named REALIZED-ratio report (Placements by Educator, ACOTE
          C.1.7) with two documented defects: it excludes placements with no assigned educator, so an
          incomplete roster quietly shrinks the denominator, and planned Supervision Type and realized ratio
          live in two views with no reconciliation, so nothing flags a slot set up 1:1 that ran 2:1.
          Orientation delivery and the two thinnest disciplines close the stage. The Site Resources page's
          Resources for Clinicians section answers five accreditors across four disciplines at once (CCNE
          II-G, ACEN 2.9, ACOTE C.1.10 and C.1.8, COA F.6, CSWE 3.3.4.a.ii) and is genuinely shipped — but
          it is documented as UNDER-ADOPTED, with the OT ACOTE guide advising administrators to paste the
          link into their email signatures, which is what you do when a surface is hard to find, and
          distribution is not acknowledgment: publishing a preceptor handbook proves availability, not that
          any named preceptor read it, and nothing links a Site Resources document to an attestation on a
          person's record. The supported preceptor-notification path (Placements > Email & Publish) is
