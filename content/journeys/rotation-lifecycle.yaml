      - subject: "CRNA"
        detail: >-
          CRNA does not have a different midpoint FORM, it has a different midpoint MODEL, and that is the
          most genuinely distinct discipline finding in the stage. For nurse anesthesia the formative signal
          is continuous — a per-clinical-day evaluation that over a three-year doctoral program generates
          thousands of forms per cohort — so the load-bearing product problem is aggregation rather than
          scheduling. The Daily Clinical Forms/Evaluations Report exists for exactly that: select the daily
          instrument, filter by student/rotation/course/ status, choose whether to include student
          responses, preceptor responses, or both (rendered side by side per question when both are
          included), and download one PDF per student or a ZIP for many. Dual-perspective rendering is a
          real early-risk surface — a systematic gap between a student's self-rating and their preceptor's
          is itself a risk signal, and this is the only place in the corpus that renders that comparison —
          and it serves COA H.1.2.7's separate requirement that students evaluate their own achievement.
          Three limits. It is an aggregation and EXPORT layer, not a competency computation: it reports
          response counts and percentage distributions per question where COA H.1.1.1 asks for achievement
          against Graduate Standards D1-D50, and bridging the two requires the daily instrument's questions
          to be mapped into Competency Management, which coa.yaml says should be verified rather than
          assumed. Nothing COMPUTES the student-versus-preceptor divergence. And the transcript states these
          per-student PDFs "can also be shared directly with clinical sites, giving preceptors and site
          coordinators visibility into student evaluation data" — a FERPA-adjacent disclosure path with no
          documented access control, and the artifact a struggling student would least want circulated. Most
