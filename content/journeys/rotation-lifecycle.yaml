          behind it, and no source confirms how it maps into the three-state Requirement Upload Status
          column; and the ComplianceJunction account binds permanently to the student's university email
          with no documented remediation path if it is set up under the wrong address. But SW's own playbook
          also records the sharpest finding against its rating: as COMMON PRACTICE, SW programs collect
          vaccination records, accommodations and background-check details in Additional Profile Details — a
          customizable profile section used "in place of a traditional field application form" — and data
          captured there has no status model, no expiry, no review routing and no exemption taxonomy, does
          not reach the Placement Clearance gate at all, and is not governed by the Included-in-Profile-Link
          privacy control that covers compliance items. A student can read All Docs Approved while their
          background-check detail sits unreviewed in a profile field. That workaround exists because SW has
          no first-class field-application intake, and its cost is the readiness gate itself. SW is also the
          only discipline where an attestation gates something other than the compliance rollup —
          consent-to-share must clear before a student can approach an agency or before field-education
          activities unlock — which follows directly from SW's student-initiated placement model, where the
          student rather than the school contacts agencies and therefore is the one exposing their own
          health and background-check records. SW runs the same intake pattern without its playbook stating
          whether it syncs, so do not assume symmetry.
      - subject: "Teacher Education"
        detail: >-
          The same hazard exists for Teacher Education under a different regulator, where a state
          fingerprint clearance is likewise non-exemptible. Teacher Education is a requirements-modelling
          problem rather than an accreditation-mapping one, and this is the stage where that shows. Per
          caep.yaml, no component of the 2022 Initial-Licensure standards imposes a background-check
          requirement on candidates, yet state fingerprint-based criminal-history checks and district
          clearances are absolute placement blockers — so for TE the compliance burden is state- and
          district-driven while the evidence burden is accreditor-driven, and requirement SETS have to be
          modelled per state and per partner district rather than once per program. The Setup tab scopes
          configuration to a COHORT and the closest shipped scoping mechanism is per-SETTING Program
          Requirements, so a TE program placing candidates across twenty districts with twenty different
          clearance packets has no documented modelling path. The partial recovery is real and
          under-claimed: per-LOCATION Site/Location Requirements are supported, evaluated per placement,
          approvable directly from the dashboard and bulk-downloadable — no competitor file describes a
          site-specific document set evaluated per placement at all, and PT and OT practitioners treat "did
          the student upload the site's own documents" as a separate check from "is the student compliant."
          Universal Background Screening is specifically named as the FINGERPRINT vendor, so the mechanism
          TE needs already exists; nothing in the corpus confirms it is offered to TE programs, and the TE
          playbook's own compliance section is explicitly unpopulated, making this an evidence gap on top of
          a product gap. CAEP also asks for two record types Interventions cannot carry: a candidate
          complaint register including complaints made to CAEP itself — an externally-originated record with
          a regulator in the loop, which caep.yaml says explicitly should be scoped as its own object rather
          than stretched onto Interventions — and three cycles of remediation data disaggregated by
          race/ethnicity, which is not extractable because the only intervention-follow-up surface is the
          site-oriented Sites/Locations Dashboard on a 24-hour refresh.
      - subject: "CRNA"
        detail: >-
          CRNA owns the single highest-consequence finding in the stage, and it is a configuration hazard
          rather than a missing feature. COA C.5 requires proof every student holds ACLS and PALS
          certification BEFORE beginning clinical activities, and D.12 — critical-flagged — requires the
          graduate to still hold both, so this is the only per-student requirement in twelve disciplines
          that must be valid at two separate checkpoints and has no legitimate exemption path. Prism ships a
          four-code exemption taxonomy layered on top of Approved (Approved with Declination / Exception /
          Medical Exemption / Religious Exemption), which is correct and valuable for the immunization
          mandates that dominate PT/OT/PA/SLP/Nursing/SW compliance and would silently satisfy a
          clinical-safety precondition if applied to ACLS: the student reads fully clear on the composite
          rollup while holding no valid card. Nothing in the sources confirms the taxonomy can be disabled
          per item type, and capability-map.yaml describes it as a status property of an approval generally
          rather than a per-requirement configuration — verify before a CRNA program configures ACLS/PALS.
          Two more CRNA specifics: re-validation has to happen at each new placement rather than once at
          admission, because a two-year ACLS card lapsing between rotation 3 and rotation 4 is caught only
          if the expiry model and the 6-8-week monitoring cadence are both configured. Note the honest
          source position: the ACLS/PALS requirement is documented in the Nursing playbook, and the three
          CRNA video transcripts contain no ACLS, PALS, background-check, immunization or readiness-gate
          narration at all; the pre-clinical RN/APRN licensure item has no verified element_id in
          nursing.yaml or coa.yaml and should not be cited to a COA element until one is confirmed.
    key_findings:
      - subject: "CRNA"
        headline: "The four-code exemption taxonomy would silently clear a student holding no ACLS card"
        severity: "gap"
        detail: >-
          COA C.5 requires ACLS and PALS before clinical activities and critical-flagged D.12
          requires the graduate to still hold both, with no legitimate exemption path. Prism layers
          Declination / Exception / Medical / Religious Exemption on top of Approved regardless.
      - subject: "PT/PTA"
        headline: "CAPTE 4O readiness is a safety verdict Placement Clearance never reads"
        severity: "gap"
        detail: >-
          4O defines readiness as a defined skill set with per-skill pass/fail, a critical-safety
          severity flag, and a hard block on progression. Placement Clearance reads documents,
          contracts and preceptor credentials — competency results are not among its inputs.
      - subject: "Social Work"
        headline: "Common practice parks background checks in Additional Profile Details, outside the gate"
        severity: "gap"
        detail: >-
          With no first-class field-application intake, SW programs collect vaccination records,
          accommodations and background-check details in a customizable profile section with no
          status model, no expiry and no review routing, that never reaches Placement Clearance.
      - subject: "Teacher Education"
        headline: "Clearance packets vary per state and district; Setup scopes requirements to a cohort"
        severity: "gap"
        detail: >-
          No 2022 CAEP Initial-Licensure standard imposes a background check, yet state fingerprint
          checks and district clearances are absolute placement blockers. The Setup tab scopes
          requirements to a cohort, so per-state, per-district clearance packets have no modelling
          path.
      - subject: "Dentistry"
        headline: "Interventions is stretched across four accreditors and ends up proving none"
        severity: "gap"
        detail: >-
          CODA 2-2 wants a due-process case, CSWE AS 3.3.5 student-safety protocols, CAEP R3.2 a
          complaint register, ACOTE A.3.5 and CAA 4.6 a neutral Communications sibling. The SW
          playbook says Interventions captures concerns "not necessarily disciplinary."
      - subject: "Pharmacy"
        headline: "The APPE-ready gate now has a real engine but no ACPE-shaped taxonomy behind it"
        severity: "configure-needed"
        detail: >-
          Competency Tracking's parent-level domain scores are a pooled mean across child
          competencies' mapped questions with a configurable pass threshold, so ACPE 7.3.d has a
          real engine underneath it. Whether it configures against ACPE's 2.1.a-n taxonomy stays
          open.
      - subject: "OT/OTA"
        headline: "OT supplies the corpus's only written starter compliance taxonomy — institutional, not ACOTE"
        severity: "none"
        detail: >-
          COVID, flu, HepA, HepB, TB, CPR, physical exam and CBC under Health & Immunization;
          background check and drug screening under Verification/Identity; liability insurance under
          Insurance & Liability. No ACOTE element imposes any of it — the list is institutional.
      - subject: "SLP"
        headline: "CAA's attestation gates fit shipped mechanisms; the playbook has no compliance section"
        severity: "configure-needed"
        detail: >-
          CAA 3.8B's universal-precautions gate and 3.10B's integrity attestation are clean fits for
          the two-tier attestation model — profile-level under Students > Set-up, course-level under
          Course Offering, each retained timestamped in Profile > Academics.
  - stage: "4. Placement allocation, scheduling & capacity balancing"
    current_state_in_prism: >
      The confirmed architectural core, and — per element-level screen tracing in
      rotation-lifecycle--04-placement-allocation-scheduling-capacity-balancing.yaml — deeper
      than the earlier synthesis credited it for. Clinical & Experiential Education runs
      Courses → Learning Activities → Setup → Forms/Evaluations → Add Assignment, and
      capability-map.yaml records the load-bearing primitive: publish/due dates are set as
      ANCHORS — N days before/after a placement's start, mid, or end date — rather than fixed
      calendar dates, described as "a real, confirmed architectural fact... likely to transfer
      directly to any new domain's rotation model." The prior claim that "no lottery,
      preference-ranking, or constraint-solving engine is documented" does not survive
      screen-by-screen tracing: Placement Assist is a real, shipped constraint solver, fed by
      up to nine documented student wishlist/preference types, that runs staged batches with
      weighted difficulty scores for hard-to-fill specialties, per-course/rotation/setting
      placement caps ("IN EACH" vs. "IN COMBINED"), distance-based scoring, overlapping-
      rotation exclusion, and setting-to-course pairing — never auto-committing a match without
      admin review. What remains genuinely unconfirmed is narrower than before: no rolling-
      average or *blocking* real-time ratio-capacity check exists anywhere in the sourced
      docs. The closest analog found, Max Placement Limit, is a non-blocking warning scoped to
      Location+Setting+Cohort (not to an individual preceptor's caseload) and is documented as
      exclusive to the PA discipline on lockstep-based domains — none of the four target
      domains qualify today. Placement Assist itself is also documented as fully self-service
      only for PT-PTA and OT-OTA programs; every other discipline, including all four target
      domains, requires a support ticket to enable it.
    pain_or_gap: >
      The framing that Prism "is not documented as producing" the schedule is no longer
      accurate — Placement Assist screen-traces as a genuine algorithmic allocation engine, not
      a manual gap, which reframes this stage's largest risk away from "build a matching
      algorithm" and toward two narrower, now-precisely-scoped problems. First, discipline
      rollout: Placement Assist's full self-service form is documented for PT-PTA/OT-OTA only,
      so every one of the four target domains would need a support-enabled configuration pass,
      not a from-scratch build, before a coordinator could run it. Second, live capacity
      enforcement remains a real gap, but a more specific one than previously stated: ACPE's
      2:1 student-to-preceptor cap needs a *blocking* check against an individual preceptor's
      concurrent caseload, and the nearest shipped mechanism (Max Placement Limit) checks a
      different entity (Location+Setting+Cohort headcount) and only warns rather than blocks.
      COCA's 3-year rolling average is likewise still unconfirmed as a computed figure anywhere
      — the closest report is a weekly offered-vs-filled slot count, not a rolling adequacy
      calculation. Both remaining gaps are queries/extensions against data Prism already holds,
      not new architecture, but neither is a shipped report or blocking rule today.
    accreditation_link: >
      ACPE Standard 3, Key Element 3.3.e (no more than 2 students per precepting pharmacist,
      with documented exceptions; real-time ratio calculation blocking a non-compliant
      assignment) — rated **Transfer**: "a live ratio check is a query against existing
      assignment data, not new architecture." Element-level tracing found a structurally close
      but non-conforming precedent, Max Placement Limit (Location+Setting+Cohort intake cap,
      warning-only, PA-exclusive) — see the flow file for the exact gap between what it does
      and what 3.3.e requires. ACPE 3.1.a (IPPE structure and sequencing across the Pre-APPE
      curriculum, including exemptions and substitute placements) — Transfer, and now also
      directly evidenced by the confirmed Rotation Setup screen. ACPE 3.2.b/3.2.d (all four
      required APPE settings per student) — the Placement Assist "Pair courses with clinical
      settings" and per-setting max-placement rule are a directly applicable enforcement
      mechanism, though the four-setting taxonomy itself is still a configuration step, not
      out-of-the-box. COCA Standard 6, Element 6.9 (rolling-average students-per-rotation-type
      against each site's stated capacity) — still unconfirmed as a computed report. COCA
      Standard 6, Element 6.10 (rotation records need discrete, filterable attributes —
      residents present, supervising physician is a DO, inpatient/outpatient setting — that
      roll up into a per-student completion checklist queryable *before* clerkships begin,
      which makes them scheduling inputs, not just after-the-fact metadata) — the Placement
      Assist setting-pairing/weighting rules are themselves exactly this class of pre-clerkship
      scheduling input. LCME Standard 5, Element 5.5 (adequate patient numbers, acuity and case
      mix per site to support the required curriculum) — unchanged, still unconfirmed.
    competitor_comparison: >
      The prior "Prism's weakest competitive position on a shipped pillar" framing does not
      survive element-level tracing and should be retired: capability-map.yaml already flags
      this as a correction to an earlier reading of the competitive research that assumed
      Prism had no matching layer at all, and the flow file's screen-by-screen trace of
      Placement Assist confirms a mature, multi-rule, weighted constraint solver — materially
      deeper than a generic waitlist/lottery tool. CORE ELMS markets "SmartMatch" automated
      student-site-preceptor matching on customizable rules with instant results (Capterra
      reviewers independently confirm it "cut down matching time significantly"), and one45
      markets three named allocation algorithms (Stream Lottery, Rotation Lottery, Randomized
      Stream Lottery) — but both claims are known only at marketing-page granularity, not
      screen-level detail, so a true element-level comparison is not possible in either
      direction; it can be said that Prism's own documented capability is materially deeper
      than Prism's own public marketing (silent on Placement Assist) previously suggested, not
      that Prism now measurably beats either competitor's actual rule engine. Elentra ships a
      "leading edge lottery system," eMedley's eduSched offers preference-, lottery- and
      track-based scheduling, Leo ships a Clerkship Lottery, and New Innovations ships a UME
      rotation lottery — all at the same marketing-page granularity. What remains a genuine,
      precisely-scoped gap is narrower than "build an allocation engine": live blocking-ratio
      and rolling-average adequacy reporting. Notably, no traced competitor (CORE ELMS, one45,
      Elentra, eMedley) publicly documents a ratio-compliance or rolling-average report either
      — this increasingly looks like an industry-wide gap across researched vendors, not a
      point where a named competitor already ships and Prism lacks. Prism's other counter is
      the anchor-relative primitive itself, which leo-davinci.yaml and emedley.yaml both note
      has *no public equivalent* at any competitor. The highest-leverage remaining investment
      in this journey is not matching-algorithm parity but (a) extending Placement Assist's
      self-service availability beyond PT/OT to the four target domains and (b) building the
      blocking-ratio and rolling-average reports no vendor in this research has shown to exist.
    domain_variance: >
      Pharmacy — two structurally different allocations in one program: IPPE placements are
      short, recurring and *concurrent* with didactic coursework across the first two
      professional years, while APPE is a block allocation of roughly six to seven 4-6 week
      full-time rotations filling an entire coursework-free capstone year, constrained by four
      mandatory setting categories and the 2:1 ratio cap. DO — 22-ish four-week blocks across
      a 22-month OMS-3/4 sequence spread over a distributive independent-site network, with
      eight required core clerkships including OMM; allocation competes against MD programs
      for the same community slots. Medicine — core clerkships of ~4-12 weeks (~48 weeks total
      in year 3) at affiliated teaching hospitals, then year 4 sub-internships plus VSLO-
      coordinated away/audition rotations that are scheduled *outside* the home institution
      entirely (and which 54.9% of students report declining at least once on cost grounds) —
      an allocation Prism would not own but must record. Dentistry — the outlier: there is no
      cohort-wide block allocation to solve, because students hold a longitudinal patient panel
      in the school's own clinic; what is scheduled instead is chair/operatory time and
      patient appointments, layered with occasional specialty and extramural community
      rotations. axiUm owns exactly that chair-scheduling model, and Prism's placement engine
      does not map onto it — dentistry needs the panel/chair model, not the rotation model.
    discipline_variance: >
      This is the stage where "we already serve this discipline" and "we satisfy this
      discipline's accreditor" come apart most sharply, and the honest headline is that
      Placement Assist governs a minority of experience types even in the two disciplines that
      have full self-service access to it. OT states the split outright — Placement Assist for
      Level I, direct and slot-based placement for Level II, direct placement for the capstone —
      and PT runs four co-existing modes: wishlist plus Placement Assist (very common), early
      FCFS publication routed deliberately AROUND the allocator (very common), pre-matching
      students into application- or interview-gated sites ahead of the school's common match day
      (common), and location-based wishlist plus direct placement (fairly common). The FCFS
      leakage is strategic rather than accidental: the PT playbook records that the share of
      slots offered as FCFS is climbing and that schools publish them to students immediately
      "to avoid losing out to other schools competing for them," so a growing fraction of PT
      capacity is allocated by speed, not by algorithm. The scoping correction that follows
      matters for the four expansion domains: enabling Placement Assist for Pharmacy, DO,
      Dentistry or Medicine does not mean those programs will run their placements through it,
      because the reasons capacity routes around the allocator (external deadlines, interview
      gating, capstones, FCFS competition) are structural rather than product problems. It also
      cuts against CORE ELMS's SmartMatch marketing, which sells automated matching with
      "instant results" into this exact PT/OT/PA/nursing/social-work market — the honest read is
      that "we have a matching engine" is a weaker claim than either vendor's materials imply.
      Social Work is the clearest evidence in this stage that Prism models discipline variance
      rather than papering over it, because SW's allocation unit is not a slot at all. The
      Multi-Location Field Application Form lets a student submit up to ten candidate agencies,
      each carrying its own Interview Status (Interview Pending > Interview Scheduled >
      Placement Offered > Placement Accepted / Not Offered / Declined) and interview schedule.
      Placement Accepted is terminal AND exclusive — only one suggestion per student can hold it
      — which is the allocation invariant of the whole workflow and the SW analogue of Placement
      Assist's overlapping-rotation guard. Admin mapping of student free-text entries onto real
      Agency and Personnel records is the real gate: a location can be mapped only ONCE and is
      thereafter unavailable to other submissions, supervisor mapping requires the location
      first, and Create Placement branches three ways depending on how diligently the student
      maintained a self-service status field. What this replaced is worth carrying, because the
      SW playbook still names it as a live anti-pattern: programs used to track interview
      activity through TEMPORARY PLACEMENTS or outside spreadsheets. Neither CORE ELMS nor
      MedHub/E*Value describes an interview-mediated, student-run search despite both explicitly
      selling into social work — so either their materials understate what they do for the
      discipline, or SW customers are being sold a med-ed-shaped matcher. Two real limits: the
      Field Application Form wishlist type is configured by the Exxat Prism team and is not
      available for self-setup, and the Download Raw Response export (which does carry Interview
      Status and Schedule Date as added columns) is a raw dump, so the funnel question a Director
      of Field Education actually asks — how many interviews per secured placement, which
      agencies decline most, which students are stalled at Interview Pending — is an Excel
      exercise. That interview-per-placement ratio is the nearest thing SW has to a capacity
      signal, and nothing computes it; SW has no slot, capacity, or sufficiency report at all,
      which is arguably correct with no reserved slots but leaves CSWE AS 3.3.4's field-setting
      EFFECTIVENESS evaluation assembled by hand. SW also carries the one placement-eligibility
      rule in twelve disciplines that turns on a fact about the STUDENT: AS 3.3.7's
      employment-based placement policy, where "employment-concurrent placement" is not a
      placement attribute, nothing enforces the field-versus-employment supervision distinction
      the standard exists to police, and mid-placement transfer on job loss is unmodelled — made
      worse by the confirmed behaviour that deleting a placement sends no notification to student
      or preceptor.
      CRNA is the discipline whose binding constraint the allocator cannot see, and it is the
      sharpest availability finding in the stage. COA F.7 caps supervision at a hard 2:1 per
      preceptor per moment and is asterisked critical; Sites > Slots > Supervision Type is the
      only capture point, it is a declared string on a batch, and the documented negative finding
      is that supervision ratio appears nowhere in the Advanced Options rule set — not as a
      constraint and not as a weight. The failure mode is concrete: a program can label a slot "1
      Student:1 CI" and place three students against the same supervisor through three separate
      slots without the system objecting. Worse, the only shipped intake cap — PA's Max Placement
      Limit — is documented as available only to LOCKSTEP-based clients, which excludes Social
      Work and most of Nursing including CRNA. The one discipline whose accreditor states a hard
      numeric cap and flags it critical cannot use the only cap that ships, and even if it could,
      Max Placement Limit is a PERIOD-TOTAL cap scoped to Location + Setting + Cohort (a preceptor
      may list 12 monthly slots but cap intake at 7), which is precisely the axis F.7 does not
      need, and it warns rather than blocks. COA F.9 compounds it: 64 hours per week summed
      across class AND clinical, averaged over four weeks, a 10-hour rest gap between duty
      periods, and no more than 16 continuous hours of direct patient care — every one a
      temporal-adjacency computation, none of them a matching input, and the didactic half cannot
      live inside the placement module at all. This is the one place in the stage where
      competitors are demonstrably ahead in a named shipped capability: MedHub ships duty-hour
      tracking with auto-alerts for violations, one45 ships event-level duty-hours and leave
      tracking, LEO/DaVinci documents duty-hour logging — but all three are ACGME-shaped and all
      three are RETROSPECTIVE detection, so the accurate statement is that three competitors
      detect violations after the fact, Prism does not detect them, and nobody prevents them at
      allocation time. The build is reusable rather than CRNA-only (Medicine and any GME-adjacent
      product need the same engine), and two precedents already live in this same flow: the
      overlapping-rotation guard is already a concurrency check on the wrong axis (one student's
      calendar instead of one preceptor's), and the geolocated Faculty Timesheet already ties a
      named supervising faculty member to a time-bounded shift. Note the sourcing discipline
      here: all three CRNA administrator videos were read end to end and contain zero mentions of
      slots, wishlists, Placement Assist, capacity, allocation, matching or duty hours — which
      does not prove CRNA programs lack placement functionality (they use the same generic
      module) but does mean the F.7 and F.9 verdicts rest on the standards text and the Nursing
      playbook rather than on any CRNA product surface.
      The most repeated multi-discipline finding in the stage is a shared absence with six
      accreditors behind it: no per-student exposure or coverage balancing anywhere in the rule
      set. Course-to-setting pairing restricts which slots a course may draw from and slot
      weighting biases the pool, but neither reads a given student's already-completed exposure
      history to steer them toward a category they still lack. CAA 3.6B wants a per-student
      distribution view showing where exposure is thin BEFORE graduation, not a retrospective
      total; CAPTE 6H asks how the program MONITORS that each student got the required
      experiences; ARC-PA B3.04 a-d wants gaps spotted mid-clinical-year while there is still
      time to re-place a student; CSWE AS 3.3.1 wants all five system levels for ALL students;
      ACOTE C.1.11 wants comparable Level I experiences for all students; CAEP R2.3 wants Breadth
      and Diversity per candidate. In every case the data exists — clinical logs, setting tags,
      patient-log aggregates — and simply does not flow back into the matcher; the answer is a
      report built on completed experiences rather than an input to the next run. The same gap
      shows up one screen later as the absent accreditor-coverage verdict on a committed run: the
      Results screen reports 1st/2nd/3rd/4th-choice satisfaction and matched-versus-unmatched
      counts, and a high-preference-satisfaction run and an accreditation-compliant run are
      different things. The fix is unusually tractable — the per-student cap rule builder already
      reasons about required-setting quotas, so the same rule definitions evaluated against the
      committed set would render a per-student coverage column beside the preference column
      without a new constraint engine. Where setting eligibility CAN be enforced at match time
      (the Pair courses with clinical settings toggle), it is the single highest-value
      multi-discipline element on the screen: it is the enforcement half of ARC-PA B3.04's four
      required SCPE settings, of CAPTE 6H's practice-setting representativeness, of CAA 3.6B's
      settings/populations/age-group variety, and of CAEP R2.3's Breadth attribute. But the
      taxonomy mapping is not one-to-one everywhere — ARC-PA's four settings map cleanly, CAPTE
      6H's shipped evidence is retrospective and self-reported (derived from PTSE 1 answers AFTER
      an experience ends) with the forward-looking view living in Program Requirements, "a
      separate object with a separate taxonomy" reconciled by hand, and CSWE's five system levels
      have no first-class field at all, riding on generic placement/agency tags.
      Duration floors are the other place the four-domain reading understates the problem. Six of
      the eight served disciplines publish a hard numeric floor that the Minimum Recommended
      Duration field is the natural home for, and in every case the floor is conditional on
      something the field cannot see: CAPTE 6A's 30 weeks full-time at 32 hours/week counts only
      terminal experiences and must EXCLUDE Integrated Clinical Experience weeks; ACOTE C.1.12
      sets 24 weeks Level II for OT and 16 for OTA, one standard with two thresholds split by
      degree level, which matters because one university commonly runs OTD/MSOT and OTA in the
      same tenant; ACOTE D.1.5 sets a third figure for the OTD capstone (14 weeks at ≥32
      hours/week — a two-part rule no report evaluates); CSWE AS 3.3.3 sets 400 BSW / 900 MSW
      hours; CAA sets 400 supervised clinical hours; CCNE III-H sets DNP 1,000 and NP 500 direct
      hours; COA E.2.3 sets 2,000 hours plus roughly sixty case-category thresholds. The field
      holds one number with no notion of what the number is for, and there is no "counts toward
      the CAPTE full-time minimum" flag anywhere, so the ICE-versus-terminal split rides entirely
      on the rotation's NAME. PT sharpens that into a structural finding: three experience types
      with three different accreditation consequences — ICE (excluded from the 6A count), Directed
      Practice Experience (explicitly ABOVE entry level, so it should not be evidencing an
      entry-level competency standard), and residency/fellowship (a different accrediting body,
      ABPTRFE, which has no registry file in this repo) — all ride one undifferentiated rotation
      record. The Mercer residency/fellowship work is recorded as a pilot, not a capability, and
      is the only confirmed instance of Prism being trialled for POST-graduate experiential
      education, which is the segment every GME-first competitor already occupies.
      Configuration decisions that are made once and constrain everything downstream cluster in
      Social Work and are invisible in the product. Three course-container models are documented
      in the playbook and nowhere in the UI — a combined course spanning practicum pathways
      (useful when a Learning Contract runs across terms), one course offering per academic year
      with rotations per pathway, or one course per term ("ideal for schools using automated
      student-registration feeds") — and the right answer depends on whether the school has a
      banner/SIS feed, which is not a question the rotation-setup screen asks. Two competing
      cohort-naming conventions sit on the same fault line: by enrollment date (an admissions
      object) or by practicum start date (a placement-season object), the choice again driven by
      whether registration is fed or uploaded, and a program on the first convention running
      part-time and full-time tracks will have one cohort placed across two practicum seasons
      with nothing warning about it. Since whether "Generalist" and "Specialization" are Cohorts,
      Groups or Categories decides whether CSWE AS 5.0.1(b)'s per-program-option outcome
      break-out is a filter or a rebuild, this is a configuration decision made months before
      anyone reads the standard. Lockstep programs have the mirror-image problem: PT and OT are
      always lockstep and yet routinely contain students who are not in step, and three distinct
      situations — a student on leave, a student repeating a failed clinical, and a student taking
      clinicals out of sequence — share one mechanism and are indistinguishable on the placement
      record. The playbook's best practice (keep the student in the original course/rotation
      unless they genuinely changed cohorts or are on a remediation experience) exists precisely
      to protect the cohort roster as a denominator, and it is where CAPTE 1C2's decelerated-student
      flag is actually determined — a decision made in a placement screen and consumed in an
      accreditation report, with nothing joining the two.
      Two capacity artifacts are worth naming as genuine strengths and two as defects. On the
      strength side: shared-rotation per-cohort slot deduction, where one physical rotation slot
      serving two classes tracks offers, availability and limits independently per cohort, is
      subtle, correct, and the kind of behaviour that only gets built after a customer hit the
      cross-cohort double-count — every expansion domain runs overlapping cohorts and should hear
      about it. And PA's SCPE Details report is the strongest single competitive artifact in the
      stage: shaped to mirror the ARC-PA Entry Level Program Portal's own data-entry screen so a
      program can diff Prism against the portal line by line, with slot-request responses
      populating "true slots offered" automatically rather than as an admin estimate. No
      competitor's materials describe a report shaped to an accreditor's own data-entry screen,
      and CORE ELMS and MedHub/E*Value both sell into PA. On the defect side: PT's two shipped
      sites/slots reports are labelled "Standard 2C" and "Standard 8F," which is 2016 numbering —
      there is no Standard 8 in the 2024 PT or PTA documents and 2024's 2C is program assessment,
      not sites, with the content now at 2D8 — while Prism's other five CAPTE reports already
      carry dual 2024/2016 labels; fix before a 2024-cycle self-study. And OT's Placements by
      Educator, the only realized-ratio report in the product, explicitly excludes placements with
      no assigned educator, so an incomplete roster silently shrinks the denominator, while
      planned Supervision Type and realized ratio never reconcile. Across all of it the ratio and
      adequacy computations are an industry-wide gap rather than a Prism deficit — no competitor
      file documents a supervision-ratio constraint in a matching engine or a rolling-average
      adequacy report either — which, given that the ratio field already exists on the slot and
      the concurrency machinery already exists in the overlap guard, makes this a product
      opportunity rather than a defensive talking point.
      Two operational realities close the stage. PT's placement-notification lead times are
      extreme by every other discipline's standards — notifications to sites "several months
      ahead, more than 1 year in advance is quite common" — which means a PT placement is created,
      published and acted upon long before the compliance and contract states stage 3 evaluates
      are anywhere near current, and the 6-8-week clearance monitoring cadence is a second, much
      later checkpoint over a placement that has been live for a year. Students then contact the
      CI themselves 2-3 months out, an expected out-of-product interaction no placement record
      captures, and it is "more common for schools to provide documentation than students" — the
      opposite of the student-registers-and-pays model myClinicalExchange, Clinician Nexus,
      ACEMAPP and CastleBranch Bridges run on. Those four are named by the PT playbook as direct
      competitors of Exxat One that "will not integrate with us," and none has a teardown file in
      this repo; they are also the real competitive frame for the Exxat One Availability-Based
      Wishlist, which is available only to PT/PTA and OT/OTA, debuted March 2024, inverts the
      model to demand-first (students rank REAL partner availabilities, the admin issues a
      targeted Request Slot against the one they ranked, then pulls the approved schedule back via
      Import Schedules), and is the documented remedy when an M1M underdelivers. One question to
      verify rather than a confirmed gap: nothing states whether Import Schedules enforces contract
      validity at the destination location, which matters because Exxat One partners are sourced
      outside the program's own contracting process — it is the one path in this stage where
      placements enter Prism without passing a documented program-side gate. Finally, Teacher
      Education has no TE-specific placement documentation anywhere in this research: the TE
      playbook explicitly marks placement and slot workflows, terminology, and cohort structure as
      unavailable and warns against citing CAEP standard numbers until confirmed against a
      TE-specific source, so every TE element here is inferred from the accreditor registry. What
      can be said structurally: the chain-linked contract is a near-exact match for a district MOU
      spanning many partner schools, but CAEP R2.1 wants the RELATIONSHIP record (co-construction
      meetings, agenda topics, advisory-board activity) rather than the signed document, and there
      is no Interventions/Communications report to assemble it from; CAEP R2.3's Diversity
      attribute is a property of the partner SCHOOL's student body rather than of the placement or
      the candidate, so the setting-pairing rule cannot be repointed at it without a new
      location-level attribute and demographic evidence stays a manual crosswalk against state
      report-card data; and Prism's placement model is confirmed to DIVERGE by discipline (PT/OT/
      Nursing model a Course as a Timeframe with each rotation its own course, PA models a Course
      as the clinical Setting), while TE's early-field-hours-plus-a-semester-of-student-teaching
      shape matches neither cleanly and which variant TE tenants are provisioned on is undocumented.
      That is the first question to answer before scoping anything TE-specific here. Note also
      that no competitor in this research serves teacher education at all — CORE ELMS's 15+ and
      MedHub/E*Value's 24+ discipline lists are health-professions lists — so TE's actual
      competitive set is outside this research's scope, which is a stated limitation rather than
      a finding.
    discipline_notes:
      - subject: "PT/PTA"
        detail: >-
          PT runs four co-existing modes: wishlist plus Placement Assist (very common), early FCFS
          publication routed deliberately AROUND the allocator (very common), pre-matching students into
          application- or interview-gated sites ahead of the school's common match day (common), and
          location-based wishlist plus direct placement (fairly common). The FCFS leakage is strategic
          rather than accidental: the PT playbook records that the share of slots offered as FCFS is
          climbing and that schools publish them to students immediately "to avoid losing out to other
          schools competing for them," so a growing fraction of PT capacity is allocated by speed, not by
          algorithm. PT sharpens that into a structural finding: three experience types with three different
          accreditation consequences — ICE (excluded from the 6A count), Directed Practice Experience
          (explicitly ABOVE entry level, so it should not be evidencing an entry-level competency standard),
          and residency/fellowship (a different accrediting body, ABPTRFE, which has no registry file in
          this repo) — all ride one undifferentiated rotation record. The Mercer residency/fellowship work
          is recorded as a pilot, not a capability, and is the only confirmed instance of Prism being
          trialled for POST-graduate experiential education, which is the segment every GME-first competitor
          already occupies. On the defect side: PT's two shipped sites/slots reports are labelled "Standard
          2C" and "Standard 8F," which is 2016 numbering — there is no Standard 8 in the 2024 PT or PTA
          documents and 2024's 2C is program assessment, not sites, with the content now at 2D8 — while
          Prism's other five CAPTE reports already carry dual 2024/2016 labels; fix before a 2024-cycle
          self-study. Two operational realities close the stage. PT's placement-notification lead times are
          extreme by every other discipline's standards — notifications to sites "several months ahead, more
          than 1 year in advance is quite common" — which means a PT placement is created, published and
          acted upon long before the compliance and contract states stage 3 evaluates are anywhere near
          current, and the 6-8-week clearance monitoring cadence is a second, much later checkpoint over a
          placement that has been live for a year. Students then contact the CI themselves 2-3 months out,
          an expected out-of-product interaction no placement record captures, and it is "more common for
          schools to provide documentation than students" — the opposite of the student-registers-and-pays
          model myClinicalExchange, Clinician Nexus, ACEMAPP and CastleBranch Bridges run on.
      - subject: "OT/OTA"
        detail: >-
          This is the stage where "we already serve this discipline" and "we satisfy this discipline's
          accreditor" come apart most sharply, and the honest headline is that Placement Assist governs a
          minority of experience types even in the two disciplines that have full self-service access to it.
          OT states the split outright — Placement Assist for Level I, direct and slot-based placement for
          Level II, direct placement for the capstone — Lockstep programs have the mirror-image problem: PT
          and OT are always lockstep and yet routinely contain students who are not in step, and three
          distinct situations — a student on leave, a student repeating a failed clinical, and a student
          taking clinicals out of sequence — share one mechanism and are indistinguishable on the placement
          record. The playbook's best practice (keep the student in the original course/rotation unless they
          genuinely changed cohorts or are on a remediation experience) exists precisely to protect the
          cohort roster as a denominator, and it is where CAPTE 1C2's decelerated-student flag is actually
          determined — a decision made in a placement screen and consumed in an accreditation report, with
          nothing joining the two. And OT's Placements by Educator, the only realized-ratio report in the
          product, explicitly excludes placements with no assigned educator, so an incomplete roster
          silently shrinks the denominator, while planned Supervision Type and realized ratio never
          reconcile. Across all of it the ratio and adequacy computations are an industry-wide gap rather
          than a Prism deficit — no competitor file documents a supervision-ratio constraint in a matching
          engine or a rolling-average adequacy report either — which, given that the ratio field already
          exists on the slot and the concurrency machinery already exists in the overlap guard, makes this a
          product opportunity rather than a defensive talking point. Those four are named by the PT playbook
          as direct competitors of Exxat One that "will not integrate with us," and none has a teardown file
          in this repo; they are also the real competitive frame for the Exxat One Availability-Based
          Wishlist, which is available only to PT/PTA and OT/OTA, debuted March 2024, inverts the model to
          demand-first (students rank REAL partner availabilities, the admin issues a targeted Request Slot
          against the one they ranked, then pulls the approved schedule back via Import Schedules), and is
          the documented remedy when an M1M underdelivers. One question to verify rather than a confirmed
          gap: nothing states whether Import Schedules enforces contract validity at the destination
          location, which matters because Exxat One partners are sourced outside the program's own
          contracting process — it is the one path in this stage where placements enter Prism without
          passing a documented program-side gate.
      - subject: "PA"
        detail: >-
          The same gap shows up one screen later as the absent accreditor-coverage verdict on a committed
          run: the Results screen reports 1st/2nd/3rd/4th-choice satisfaction and matched-versus-unmatched
          counts, and a high-preference-satisfaction run and an accreditation-compliant run are different
          things. The fix is unusually tractable — the per-student cap rule builder already reasons about
          required-setting quotas, so the same rule definitions evaluated against the committed set would
          render a per-student coverage column beside the preference column without a new constraint engine.
          Where setting eligibility CAN be enforced at match time (the Pair courses with clinical settings
          toggle), it is the single highest-value multi-discipline element on the screen: it is the
          enforcement half of ARC-PA B3.04's four required SCPE settings, of CAPTE 6H's practice-setting
          representativeness, of CAA 3.6B's settings/populations/age-group variety, and of CAEP R2.3's
          Breadth attribute. But the taxonomy mapping is not one-to-one everywhere — ARC-PA's four settings
          map cleanly, CAPTE 6H's shipped evidence is retrospective and self-reported (derived from PTSE 1
          answers AFTER an experience ends) with the forward-looking view living in Program Requirements, "a
          separate object with a separate taxonomy" reconciled by hand, and CSWE's five system levels have
          no first-class field at all, riding on generic placement/agency tags. Two capacity artifacts are
          worth naming as genuine strengths and two as defects. On the strength side: shared-rotation
          per-cohort slot deduction, where one physical rotation slot serving two classes tracks offers,
          availability and limits independently per cohort, is subtle, correct, and the kind of behaviour
          that only gets built after a customer hit the cross-cohort double-count — every expansion domain
          runs overlapping cohorts and should hear about it. And PA's SCPE Details report is the strongest
          single competitive artifact in the stage: shaped to mirror the ARC-PA Entry Level Program Portal's
          own data-entry screen so a program can diff Prism against the portal line by line, with
          slot-request responses populating "true slots offered" automatically rather than as an admin
          estimate. No competitor's materials describe a report shaped to an accreditor's own data-entry
          screen, and CORE ELMS and MedHub/E*Value both sell into PA.
      - subject: "SLP"
        detail: >-
          The most repeated multi-discipline finding in the stage is a shared absence with six accreditors
          behind it: no per-student exposure or coverage balancing anywhere in the rule set.
          Course-to-setting pairing restricts which slots a course may draw from and slot weighting biases
          the pool, but neither reads a given student's already-completed exposure history to steer them
          toward a category they still lack. CAA 3.6B wants a per-student distribution view showing where
          exposure is thin BEFORE graduation, not a retrospective total; CAPTE 6H asks how the program
          MONITORS that each student got the required experiences; ARC-PA B3.04 a-d wants gaps spotted
          mid-clinical-year while there is still time to re-place a student; CSWE AS 3.3.1 wants all five
          system levels for ALL students; ACOTE C.1.11 wants comparable Level I experiences for all
          students; CAEP R2.3 wants Breadth and Diversity per candidate. In every case the data exists —
          clinical logs, setting tags, patient-log aggregates — and simply does not flow back into the
          matcher; the answer is a report built on completed experiences rather than an input to the next
          run.
      - subject: "Nursing"
        detail: >-
          The scoping correction that follows matters for the four expansion domains: enabling Placement
          Assist for Pharmacy, DO, Dentistry or Medicine does not mean those programs will run their
          placements through it, because the reasons capacity routes around the allocator (external
          deadlines, interview gating, capstones, FCFS competition) are structural rather than product
          problems. It also cuts against CORE ELMS's SmartMatch marketing, which sells automated matching
          with "instant results" into this exact PT/OT/PA/nursing/social-work market — the honest read is
          that "we have a matching engine" is a weaker claim than either vendor's materials imply. Duration
          floors are the other place the four-domain reading understates the problem. Six of the eight
          served disciplines publish a hard numeric floor that the Minimum Recommended Duration field is the
          natural home for, and in every case the floor is conditional on something the field cannot see:
          CAPTE 6A's 30 weeks full-time at 32 hours/week counts only terminal experiences and must EXCLUDE
          Integrated Clinical Experience weeks; ACOTE C.1.12 sets 24 weeks Level II for OT and 16 for OTA,
          one standard with two thresholds split by degree level, which matters because one university
          commonly runs OTD/MSOT and OTA in the same tenant; ACOTE D.1.5 sets a third figure for the OTD
          capstone (14 weeks at ≥32 hours/week — a two-part rule no report evaluates); CSWE AS 3.3.3 sets
          400 BSW / 900 MSW hours; CAA sets 400 supervised clinical hours; CCNE III-H sets DNP 1,000 and NP
          500 direct hours; COA E.2.3 sets 2,000 hours plus roughly sixty case-category thresholds. The
          field holds one number with no notion of what the number is for, and there is no "counts toward
          the CAPTE full-time minimum" flag anywhere, so the ICE-versus-terminal split rides entirely on the
          rotation's NAME.
      - subject: "Social Work"
        detail: >-
          Social Work is the clearest evidence in this stage that Prism models discipline variance rather
          than papering over it, because SW's allocation unit is not a slot at all. The Multi-Location Field
          Application Form lets a student submit up to ten candidate agencies, each carrying its own
          Interview Status (Interview Pending > Interview Scheduled > Placement Offered > Placement Accepted
          / Not Offered / Declined) and interview schedule. Placement Accepted is terminal AND exclusive —
          only one suggestion per student can hold it — which is the allocation invariant of the whole
          workflow and the SW analogue of Placement Assist's overlapping-rotation guard. Admin mapping of
          student free-text entries onto real Agency and Personnel records is the real gate: a location can
          be mapped only ONCE and is thereafter unavailable to other submissions, supervisor mapping
          requires the location first, and Create Placement branches three ways depending on how diligently
          the student maintained a self-service status field. What this replaced is worth carrying, because
          the SW playbook still names it as a live anti-pattern: programs used to track interview activity
          through TEMPORARY PLACEMENTS or outside spreadsheets. Neither CORE ELMS nor MedHub/E*Value
          describes an interview-mediated, student-run search despite both explicitly selling into social
          work — so either their materials understate what they do for the discipline, or SW customers are
          being sold a med-ed-shaped matcher. Two real limits: the Field Application Form wishlist type is
          configured by the Exxat Prism team and is not available for self-setup, and the Download Raw
          Response export (which does carry Interview Status and Schedule Date as added columns) is a raw
          dump, so the funnel question a Director of Field Education actually asks — how many interviews per
          secured placement, which agencies decline most, which students are stalled at Interview Pending —
          is an Excel exercise. That interview-per-placement ratio is the nearest thing SW has to a capacity
          signal, and nothing computes it; SW has no slot, capacity, or sufficiency report at all, which is
          arguably correct with no reserved slots but leaves CSWE AS 3.3.4's field-setting EFFECTIVENESS
          evaluation assembled by hand. SW also carries the one placement-eligibility rule in twelve
          disciplines that turns on a fact about the STUDENT: AS 3.3.7's employment-based placement policy,
          where "employment-concurrent placement" is not a placement attribute, nothing enforces the
          field-versus-employment supervision distinction the standard exists to police, and mid-placement
          transfer on job loss is unmodelled — made worse by the confirmed behaviour that deleting a
          placement sends no notification to student or preceptor.
      - subject: "Social Work"
        detail: >-
          Configuration decisions that are made once and constrain everything downstream cluster in Social
          Work and are invisible in the product. Three course-container models are documented in the
          playbook and nowhere in the UI — a combined course spanning practicum pathways (useful when a
          Learning Contract runs across terms), one course offering per academic year with rotations per
          pathway, or one course per term ("ideal for schools using automated student-registration feeds") —
          and the right answer depends on whether the school has a banner/SIS feed, which is not a question
          the rotation-setup screen asks. Two competing cohort-naming conventions sit on the same fault
          line: by enrollment date (an admissions object) or by practicum start date (a placement-season
          object), the choice again driven by whether registration is fed or uploaded, and a program on the
          first convention running part-time and full-time tracks will have one cohort placed across two
          practicum seasons with nothing warning about it. Since whether "Generalist" and "Specialization"
          are Cohorts, Groups or Categories decides whether CSWE AS 5.0.1(b)'s per-program-option outcome
          break-out is a filter or a rebuild, this is a configuration decision made months before anyone
          reads the standard.
      - subject: "Teacher Education"
        detail: >-
          Finally, Teacher Education has no TE-specific placement documentation anywhere in this research:
          the TE playbook explicitly marks placement and slot workflows, terminology, and cohort structure
          as unavailable and warns against citing CAEP standard numbers until confirmed against a
          TE-specific source, so every TE element here is inferred from the accreditor registry. What can be
          said structurally: the chain-linked contract is a near-exact match for a district MOU spanning
          many partner schools, but CAEP R2.1 wants the RELATIONSHIP record (co-construction meetings,
          agenda topics, advisory-board activity) rather than the signed document, and there is no
          Interventions/Communications report to assemble it from; CAEP R2.3's Diversity attribute is a
          property of the partner SCHOOL's student body rather than of the placement or the candidate, so
          the setting-pairing rule cannot be repointed at it without a new location-level attribute and
          demographic evidence stays a manual crosswalk against state report-card data; and Prism's
          placement model is confirmed to DIVERGE by discipline (PT/OT/ Nursing model a Course as a
          Timeframe with each rotation its own course, PA models a Course as the clinical Setting), while
          TE's early-field-hours-plus-a-semester-of-student-teaching shape matches neither cleanly and which
          variant TE tenants are provisioned on is undocumented. That is the first question to answer before
          scoping anything TE-specific here. Note also that no competitor in this research serves teacher
          education at all — CORE ELMS's 15+ and MedHub/E*Value's 24+ discipline lists are
          health-professions lists — so TE's actual competitive set is outside this research's scope, which
          is a stated limitation rather than a finding.
      - subject: "CRNA"
        detail: >-
          CRNA is the discipline whose binding constraint the allocator cannot see, and it is the sharpest
          availability finding in the stage. COA F.7 caps supervision at a hard 2:1 per preceptor per moment
          and is asterisked critical; Sites > Slots > Supervision Type is the only capture point, it is a
          declared string on a batch, and the documented negative finding is that supervision ratio appears
          nowhere in the Advanced Options rule set — not as a constraint and not as a weight. The failure
          mode is concrete: a program can label a slot "1 Student:1 CI" and place three students against the
          same supervisor through three separate slots without the system objecting. Worse, the only shipped
          intake cap — PA's Max Placement Limit — is documented as available only to LOCKSTEP-based clients,
          which excludes Social Work and most of Nursing including CRNA. The one discipline whose accreditor
          states a hard numeric cap and flags it critical cannot use the only cap that ships, and even if it
          could, Max Placement Limit is a PERIOD-TOTAL cap scoped to Location + Setting + Cohort (a
          preceptor may list 12 monthly slots but cap intake at 7), which is precisely the axis F.7 does not
          need, and it warns rather than blocks. COA F.9 compounds it: 64 hours per week summed across class
          AND clinical, averaged over four weeks, a 10-hour rest gap between duty periods, and no more than
          16 continuous hours of direct patient care — every one a temporal-adjacency computation, none of
          them a matching input, and the didactic half cannot live inside the placement module at all. This
          is the one place in the stage where competitors are demonstrably ahead in a named shipped
          capability: MedHub ships duty-hour tracking with auto-alerts for violations, one45 ships
          event-level duty-hours and leave tracking, LEO/DaVinci documents duty-hour logging — but all three
          are ACGME-shaped and all three are RETROSPECTIVE detection, so the accurate statement is that
          three competitors detect violations after the fact, Prism does not detect them, and nobody
          prevents them at allocation time. The build is reusable rather than CRNA-only (Medicine and any
          GME-adjacent product need the same engine), and two precedents already live in this same flow: the
          overlapping-rotation guard is already a concurrency check on the wrong axis (one student's
          calendar instead of one preceptor's), and the geolocated Faculty Timesheet already ties a named
          supervising faculty member to a time-bounded shift. Note the sourcing discipline here: all three
          CRNA administrator videos were read end to end and contain zero mentions of slots, wishlists,
          Placement Assist, capacity, allocation, matching or duty hours — which does not prove CRNA
          programs lack placement functionality (they use the same generic module) but does mean the F.7 and
          F.9 verdicts rest on the standards text and the Nursing playbook rather than on any CRNA product
          surface.
    key_findings:
      - subject: "Pharmacy"
        headline: "ACPE 3.3.e needs a blocking per-preceptor ratio check; nothing blocks anything"
        severity: "gap"
        detail: >-
          3.3.e caps students per precepting pharmacist at two with a real-time calculation that
          BLOCKS the assignment. Max Placement Limit checks a different entity (Location + Setting +
          Cohort headcount), warns rather than blocks, and is PA-exclusive on lockstep clients.
      - subject: "Dentistry"
        headline: "There is no cohort block allocation to solve; dentistry needs a chair model"
        severity: "gap"
        detail: >-
          Students hold a longitudinal patient panel in the school's own clinic, so what gets
          scheduled is chair/operatory time and patient appointments, with occasional specialty and
          extramural rotations layered on. axiUm owns exactly that chair-scheduling model, and
          Prism's placement engine does not map onto it.
      - subject: "CRNA"
        headline: "Supervision ratio appears nowhere in Placement Assist's rules, as constraint or weight"
        severity: "gap"
        detail: >-
          A program can label a slot "1 Student:1 CI" and still place three students against the
          same supervisor through three separate slots, while COA F.7 caps supervision at a hard 2:1
          per preceptor per moment and is asterisked critical.
      - subject: "Social Work"
        headline: "Placement Accepted is terminal and exclusive — the whole allocation invariant"
        severity: "none"
        detail: >-
          The Multi-Location Field Application Form carries up to ten candidate agencies per
          student, each with its own Interview Status ladder, and only one suggestion can hold
          Placement Accepted. No competitor describes an interview-mediated, student-run search.
      - subject: "PT/PTA"
        headline: "Placement Assist governs a minority of PT experiences; FCFS deliberately routes around it"
        severity: "configure-needed"
        detail: >-
          PT runs four co-existing modes — wishlist plus Placement Assist, early
          first-come-first-serve publication routed deliberately AROUND the allocator, pre-matching
          into interview-gated sites, and direct placement — with the FCFS share climbing.
      - subject: "PA"
        headline: "SCPE Details mirrors the ARC-PA portal's own data-entry screen, line for line"
        severity: "none"
        detail: >-
          True slots offered populate automatically from site slot-request responses rather than
          from admin estimates, and the report is shaped so a program can diff Prism against the
          Entry Level Program Portal. No competitor ships a report shaped to an accreditor's own
          screen.
      - subject: "SLP"
        headline: "No rule reads a student's completed exposure to steer their next placement"
        severity: "gap"
        detail: >-
          Course-to-setting pairing restricts which slots a course may draw from and slot weighting
          biases the pool, but nothing feeds a student's already-completed exposure history back
          into the matcher, which CAA 3.6B, CAPTE 6H and ARC-PA B3.04 all ask for.
      - subject: "Teacher Education"
        headline: "Which placement-model variant TE tenants run is undocumented, so nothing can be scoped"
        severity: "gap"
        detail: >-
          Prism's placement model DIVERGES by discipline — PT, OT and Nursing model a Course as a
          timeframe, PA models it as the clinical setting — and TE's
          early-field-hours-plus-student-teaching shape matches neither. The TE playbook marks those
          workflows unavailable.
  - stage: "5. In-rotation capture: hours, encounters, procedures & supervision attestation"
    current_state_in_prism: >
      Forms/Evaluations attached to placements as assignments is confirmed, and
      the anchor-relative primitive fires them at the right moment.
      Element-level tracing
      (rotation-lifecycle--05-in-rotation-capture-hours-encounters-procedures.yaml)
      resolves several of the stage-level hedges. Hour aggregation by a custom
      setting-category taxonomy is now confirmed shipped: the Timesheet
      Category Configuration screen lets admins build a nested,
      per-course-overridable category list, and Exxat's own documented example
      list literally includes "Simulation" as a category. Enforced
      sub-thresholds are also confirmed shipped, as "per-participation-type
      hour thresholds on the Clinical Log Report" (capability-map.yaml) — but
      gated behind a support ticket rather than admin self-service, and whether
      the underlying total can auto-exclude a Simulation-tagged category from a
      300-hour aggregate remains unconfirmed. Out-of-the-box "required patient
      encounter" tracking distinct from general placement completion is now
      confirmed: capability-map.yaml's "Patient Logging with configurable
      Diagnosis & Procedure Minimums" lets programs define minimum encounters
      per diagnosis/procedure per rotation, with real-time student progress and
      faculty gap-visibility before rotation end. Aggregate case-mix reporting
      across sites is confirmed shipped — the Patient Log Aggregate Report and
      a dedicated Optional Procedure Count Report both group by Site/Location —
      but "acuity" specifically, as a named field distinct from Age
      Group/Disease-and-Condition, is still not confirmed anywhere.
      Supervision-level/scope-of-practice attestation as a distinct structured
      field is now confirmed ABSENT under that name: the per-log Experiential
      Supervisor dropdown ties a named supervisor to a named encounter
      (confirmed shipped, distinct from the placement-level supervisor
      assignment), but the only object actually called "Attestation" in Prism
      is a static profile- or course-level checkbox acknowledgment of a written
      statement, not an encounter-scoped role/level field. Procedure-code-level
      logging remains a stated Gap (coda.yaml), now sharpened: the only
      system-provided procedure-coding lookup category confirmed in Prism is
      CPT, not CDT.
    pain_or_gap: >
      This is where the accreditors' evidence actually lives, and the picture
      is less uniformly thin than the stage-level synthesis first suggested.
      The Patient Log module is a genuinely separate, structured object from
      the Forms/Evaluations record — with configurable diagnosis/procedure
      lookups, per-diagnosis/procedure minimums, and aggregate reports — so
      "which specific conditions and procedures did this student encounter" and
      "how many hours, in which setting category" are now confirmed queryable
      today, not free-form. What remains genuinely unqueryable: "who supervised
      this encounter, at what level" (the supervisor-to-encounter link exists,
      but role/level does not), and dentistry's CDT-coded procedure step (the
      standard lookup is CPT, not CDT). The consequence is narrower than before
      but still real: hour- and encounter-volume gaps against required lists
      can now plausibly surface mid-rotation — closer to what LCME 8.6 wants —
      but supervision-level and CDT-procedure gaps would still surface only at
      graduation clearance or the self-study, because no structured field
      captures either one yet.
    accreditation_link: >
      ACPE Standard 3, Key Element 3.1.b (auditable student-level logs proving
      ≥300 IPPE clock hours including ≥75 community and ≥75
      hospital/health-system, with simulation hours *excluded* and off-pace
      alerting before the window closes) — Configure; the stage-5 flow file
      confirms the underlying mechanism (an admin-configurable, nestable
      timesheet-category taxonomy whose own documented example list includes
      "Simulation," plus support-ticket-gated per-participation-type hour
      thresholds on the Clinical Log Report), though automatic exclusion of a
      tagged category from a total is still unconfirmed. ACPE 3.2.b/3.2.d
      (≥1,440 APPE hours, each APPE ≥160 hours, all four required settings per
      student, plus an alternate assessed-equivalent record type for NTPD
      students) — Configure, same taxonomy mechanism, with the NTPD pathway
      still flagged as a likely small build (unconfirmed at element level).
      LCME Standard 6, Element 6.2 (defined, published set of patient
      types/conditions, skills, settings and expected level of student
      responsibility, plus evidence students actually met them) — Configure;
      now confirmed shipped at element level via "Patient Logging with
      configurable Diagnosis & Procedure Minimums" (capability-map.yaml), which
      tracks per-rotation minimum encounters with real-time student progress
      and faculty gap-visibility. LCME Standard 5, Element 5.5 (case-mix/acuity
      sufficiency per site) — Configure; cross-site aggregation is now
      confirmed shipped (the Patient Log Aggregate Report and Optional
      Procedure Count Report both group by Site/Location), but "acuity" as a
      distinct field is still not confirmed anywhere. LCME Standard 9, Element
      9.3 (supervision attestation per encounter or placement segment, tying a
      named supervisor with role/level to a named student) — Configure; the
      named-supervisor-to-named-encounter link is now confirmed shipped (a
      per-log Experiential Supervisor field, distinct from the placement-level
      assignment), but the role/level half is now confirmed ABSENT — the only
      object literally named "Attestation" in Prism is a static
      profile/course-level acknowledgment checkbox, not an encounter-scoped
      structured field. COCA Standard 6, Element 6.10 (discrete attributes:
      residents present, DO supervisor, inpatient setting) — Configure,
      unchanged; no new element-level evidence surfaced for
      rotation-record-level custom attributes beyond the Patient Log/Timesheet
      forms already traced. CODA Standard 2, Element 2-24 (~15 clinical
      categories a-o, each typically evidenced by procedure-level logs) — rated
      **Gap**, now more specifically so: the only system-provided
      procedure-coding lookup category confirmed in Prism is CPT, not CDT,
      reinforcing coda.yaml's call for a CDT-native build rather than a
      parallel taxonomy. CODA Standard 2, Element 2-9 (sufficient patient
      experience volume per student, with pacing alerts) — Transfer, the
      strongest CODA fit, now reinforced by a confirmed, dedicated Optional
      Procedure Count Report aggregating procedure volume across
      courses/rotations/students/sites/locations/settings.
    competitor_comparison: >
      The most crowded stage in the market. eMedley's eCLAS ships mobile
      iOS/Android case logging with ICD-10 diagnoses and CPT procedures,
      competency mastery and preceptor time approval. Leo's Patient Encounter
      Tracking logs diagnoses, procedures, observed conditions and duty hours
      per student, keeps encounter history accessible after a course closes,
      maps curriculum themes directly onto encounter logs, and exports duty
      hours. MedHub/E*Value ships case logs, mobile procedure logging, and hour
      tracking with automated reminders. New Innovations ships a Procedure
      Logger with supervision-level tracking and direct import from the ACGME
      Resident Case Log System. CORE ELMS ships timesheet/hours tracking with
      optional GPS, absence tracking, case logging and reflections. axiUm is
      the dentistry-specific benchmark and is structurally different: faculty
      inspect and sign off each clinical *step* chairside, tied to
      student-patient matching against graduation requirements. Element-level
      tracing sharpens both of the two openings named previously rather than
      erasing them. On quality: none of the competitor teardowns are granular
      enough to compare screen-level fields against Prism's own
      category-builder or patient-log lookup screens (axium.yaml itself rates
      its own comparison "depth_vs_prism: unknown"), so the quality-gap claim
      still rests on public user-review evidence, not a verified feature-parity
      gap. On taxonomy: Prism's own category builder is now confirmed to offer
      "Simulation" as a literal example category, so "no competitor is
      documented as enforcing ACPE's setting-category sub-thresholds" should
      not be read as "and Prism clearly does either" — Prism's taxonomy
      mechanism is confirmed, but automatic sub-threshold *enforcement* is
      confirmed only as a support-ticket-gated configuration, not a
      self-service one. And New Innovations' publicly marketed
      "supervision-level tracking" on its Procedure Logger cannot be verified
      against Prism's own per-encounter supervisor link — which is now
      confirmed to exist but to lack any role/level attribute — because New
      Innovations' only public source is a marketing page, not field-level
      documentation; the fair statement is that neither product's
      supervision-level claim is verifiable at element grain from public
      materials.
    domain_variance: >
      The stage that differs most by domain, and the reason "rotation
      lifecycle" is four journeys wearing one name. Pharmacy — the unit of
      evidence is the *clock hour*, bucketed by setting category with
      simulation excluded and hard sub-thresholds enforced (300/75/75 for IPPE;
      1,440/160 plus four settings for APPE); the category-taxonomy mechanism
      behind this is now confirmed shipped, with sub-threshold enforcement
      confirmed shipped-but-support-gated. DO — the unit is the *rotation with
      attributes* (residents present, DO supervisor, inpatient), plus 200-500
      additional hands-on OMM/OMT hours integrated into clerkships with no
      analog in any other domain; unchanged, no new element-level evidence
      found this pass. Medicine — the unit is the *required encounter*: a
      published list of conditions, skills, settings and expected
      responsibility levels (LCME 6.2), now confirmed trackable via
      configurable diagnosis/procedure minimums with real-time progress,
      captured under a layered attending→resident→intern supervision chain that
      requires modelling multiple supervisors per encounter — the
      single-supervisor-per-log link is confirmed, but the layered,
      multi-supervisor, role/level model is not. Dentistry — the unit is the
      *procedure step*: CDT-coded, tooth/surface-level, faculty-signed before
      the student may proceed, accumulating toward graduation quotas, with
      patient-sourcing shortfalls a documented cause of delayed graduation; now
      confirmed that Prism's only system-provided procedure-coding lookup is
      CPT, not CDT, sharpening rather than resolving this domain's gap. A
      single generic "log" object serves none of these four well; the
      transferable layer is the placement/assignment scaffold, and the
      domain-specific layer is the log schema hanging off it.
    discipline_variance: >
      This is the most discipline-varied stage in the journey because the UNIT OF RECORD itself
      changes: PT/PTA and OT/OTA capture hours on a Timesheet (and PT essentially never uses an
      encounter log at all); PA captures encounters on a Patient Log plus hours for the ARC-PA
      telehealth ceilings; SLP captures TIME on a structurally separate Learning Activity type
      (Clinical Log), split intervention/evaluation and direct-contact/observation; Nursing
      captures hours by category plus Patient Log encounters; Social Work captures hours with
      break and time-off auto-deduction; CRNA captures cases AND anesthesia time AND procedures
      AND duty hours on one CCE log; and Teacher Education has no documented hour or encounter
      surface at all, only a GoReact/Echo360 LTI video assignment. Three cross-cutting objects do
      the accreditation work in every one of them — the per-log supervisor link, the
      preceptor-signed attestation at review time, and the threshold report — and each has a
      distinct defect.
      The sharpest single finding is a documented contradiction between three Exxat-authored
      sources about the same control. The Enable Attestation toggle on the log setup drawer is
      described in the SLP tutorial as "an attestation that CLINICAL EDUCATORS need to sign WHEN
      THEY REVIEW student submitted logs," in the CRNA tutorial as requiring "PRECEPTORS to
      acknowledge an attestation when reviewing logs," and in the PA tutorial as a statement "if
      you want STUDENTS to acknowledge a statement BEFORE SUBMITTING THEIR LOGS. For example, you
      can include an academic integrity statement." All three share the same auto-approval
      exclusion, so this is one mechanism described three times rather than two mechanisms — but
      the readings are not interchangeable as evidence: a student-signed integrity pledge is an
      academic-honesty artifact, while a supervisor-signed post-review statement is the
      supervision-accountability artifact CFCC Standard V-E and COA C.4 actually ask for. Before
      this is used in a PA conversation, confirm whether the PA drawer offers the supervisor-side
      variant at all, because the PA transcript separately establishes something stronger and one
      level up the chain: enabling auto-approval does not merely disable the attestation, it
      DISABLES PRECEPTOR REVIEW ITSELF ("if you select Yes, the option for preceptor review of the
      patient log will be disabled"). That turns the existing advice conflict into a serious one —
      the PA playbook recommends turning auto-approval on "for ease of approval/review," while
      coa.yaml concludes that for CRNA auto-approval "should be treated as configuration
      malpractice" — because both are advising on a toggle that silently removes the clinician
      from the workflow. A PA program following its own playbook's convenience advice produces
      patient logs no clinician ever saw, which is defensible for a low-stakes activity log and is
      not defensible as ARC-PA B3.03 evidence.
      The second cross-disciplinary finding is quotable because it comes from Exxat's own
      tutorials rather than from analysis: two separate administrator videos, for two different
      disciplines and two different log types, both instruct the coordinator that if a student
      fails to attend to Needs Attention logs "you may need to remind them to resubmit them
      OUTSIDE OF THE EXXAT SYSTEM." Needs Attention is the one status in the whole workflow that
      requires a third party to act — Pending Review waits on a reviewer watching a queue,
      Approved is terminal, but Needs Attention waits on a student who thought they were finished
      — so it is the status most likely to strand, and it strands silently: those hours or
      encounters sit outside the approved totals every threshold report in this stage counts, so
      a student can appear under-logged for reasons unrelated to their clinical activity. The
      competitor comparison here is genuinely unfavourable at capability level: MedHub and E*Value
      document automated reminders on hour logging, CORE ELMS documents due-date reminders, and
      Prism's documented answer is the coordinator's own mail client. The fix is already patterned
      — auto-notifications fire on form status and Compliance Management fires on document status;
      nothing points either at log status — and note the asymmetry one surface over, where a Not
      Approved TIMESHEET entry does email the student at their Prism login address. Same journey,
      adjacent surfaces, one notifies and one does not.
      CRNA is the strongest discipline fit in the stage and simultaneously carries its most severe
      gaps. The CCE log's Encounter Details block puts Preceptor, Date of Service, Total Hours of
      Anesthesia Time, Total Clinical Log Hours, Total Cases and Procedure on ONE record, so a
      single entry carries case-count, hour and procedure evidence at once, and eight repeatable
      sub-sections map one-to-one onto COA's own Appendix families (Patient Physical Status;
      Patient Assessment; Special Cases; Anatomical Categories; Methods of Anesthesia; Arterial
      Technique; Central Venous Catheter; Pulmonary Artery Catheter). coa.yaml rates C.4 the
      strongest Transfer in its file, and the Student Activity Insights report renders progress
      with exactly the traffic-light semantics E.2.3 needs — green at or above minimum, amber
      approaching at roughly 80-99%, red below, with the tutorial's own worked example being a
      minimum of 200 against 21 entered. The NBCRNA Transcript Report is the single strongest
      discipline-fit artifact anywhere in this stage: a certification-body-formatted export
      derived from the same logs that serve accreditation, and the template for what an equivalent
      would look like in the expansion domains. Against that: the "+Add" repeatable model makes
      COA's "count all that apply" footnote mechanically possible but no source confirms the
      THRESHOLD engine counts one encounter twice rather than assigning it to one category; there
      is no actual-vs-simulated flag, which COA requires because certain rows cannot be satisfied
      by simulation alone; there are no cohort-conditional thresholds, so the dagger-marked rows
      binding only students matriculating on or after January 1 2026 mean one course offering must
      run two threshold sets; nothing validates the consistency rule COA's own glossary states
      (Total Clinical Log Hours must be greater than or equal to Total Hours of Anesthesia Time),
      even though the two fields sit adjacent on the same block; there is no Program-Administrator
      affirmation tier above preceptor approval, which is precisely where COA's Guidelines for
      Counting Clinical Experiences vests final quantification authority; and no CRNA report
      aggregates by PRECEPTOR at all — the preceptor is captured per case but treated purely as a
      reviewer, which is why F.7's observed 2:1 ratio cannot be computed from log data. Contrast
      OT, which has a Placements by Educator report, and SLP, where Clinical Educator is a report
      filter: the preceptor axis is reachable in two other disciplines and not in the one whose
      accreditor makes it CRITICAL. Duty hours are worse still: F.9's three rules are all
      temporal-adjacency computations (a 10-hour rest gap between consecutive shifts, a 16-hour
      continuous-care ceiling, a four-week rolling 64-hour average spanning class AND clinical
      time), and the only shipped control in the vicinity is a per-day maximum-hours integer. Two
      primitives already exist and are unconsumed — Start Time / End Time on every entry, and the
      Overnight toggle that already models a duty period crossing midnight — making the rest-gap
      rule the cheapest of the three to build. Worth stating precisely because it is a design
      trap: a four-week AVERAGE deliberately tolerates one heavy week, so shipping a naive
      per-week snapshot would produce false violations and is worse than shipping nothing. This is
      the sharpest direct competitor comparison in the whole file and Prism is behind: New
      Innovations ships Work Hours Monitoring with violation tracking, rule configuration and
      automated notifications; MedHub ships auto-alerts for violations; E*Value flags
      violation-triggering work hours; one45 and Leo/DaVinci both log duty hours. Five of nine
      competitor files name a duty-hour concept and three name a VIOLATION concept.
      SLP has the finest-grained capture model in the product and the least self-service control
      over it. Clinical Log is confirmed a genuine module split rather than a relabelled Patient
      Log — capability-map.yaml says so outright — which is why the whole SLP report family
      aggregates hours rather than case counts and why PA's diagnosis/procedure-minimum model does
      not transfer. Student Participation Type (Direct Contact vs Observation), Practice Type
      (Intervention vs Evaluation with the minutes split WITHIN one encounter), Mode of Delivery
      and Training Level are all first-class fields and first-class reporting axes, giving CAA's
      400 / at-most-25-observation / at-least-325-graduate rule three separate measurable
      dimensions. What is missing is the composite: no view asserts "412 total, 18 observation,
      340 graduate — PASS," and the min/max hour thresholds that would red-flag an under-logged
      student are confirmed support-configured only, so the discipline with the hardest numeric
      hour rule in this file is the discipline that cannot configure its own threshold. That same
      support-gated mechanic is independently named by nursing.yaml as what CCNE III-H needs and
      cannot have, and by cswe.yaml as what CSWE AS 3.3.3 needs — one discipline's support-gated
      feature is simultaneously two others' documented wish-list item, which argues for promoting
      it to a self-service cross-discipline threshold model. SLP also owns the most distinctive
      supervision-evidence artifact found on either side of this research: the Clock Hours report
      prints, at the bottom, "the attestations that supervisors have attested to AND THE NUMBER OF
      HOURS THEY REVIEWED." That reviewed-hours total sits on the same page as the student's
      accrued hours, which puts CFCC V-E's 25% direct-supervision floor one division away — the
      numerator and denominator are already printed together; what is missing is the arithmetic
      and a per-client breakdown, since CFCC states its floor per client and the report aggregates
      per student. Two smaller SLP findings worth carrying: the same report is reached under
      different row labels for different audiences (admins are told to click "Hours by Category,"
      students to click "Clock Hours"), which is good product economics and bad discoverability
      and confirms SLP's headline clock-hour artifact is the SAME report every other discipline
      uses; and the SLP playbook's own stated gap that the corpus never enumerates the nine KASA
      service-delivery areas is now partially corrected — the administrator tutorial's worked
      example names "voice and resonance" as a live COLUMN HEADING in a shipped report, so at
      least one of the nine ships rather than being program-invented. The other eight remain
      unverified, and one screenshot of the Types of Service column set would settle it.
      PT/PTA produces the most surprising finding in the stage: PT essentially does not use
      encounter logging at all. Its confirmed learning-activity inventory is PTSE 1, PTSE 2, CI
      Details Form and Timesheets, with CIET v2, PTMACS/PTAMACS and SCIPAI as assessments — and no
      patient or encounter log appears anywhere in it. Yet Prism ships two reports named after
      CAPTE 6H ("Patient Disease and Condition, Practice Across Lifespan and Continuum of Care"
      and "Practice Settings"), and BOTH source their data from PTSE 1 questionnaire answers
      (Questions 7 and 3), i.e. from a student's retrospective survey AFTER the experience ends
      rather than from encounters captured during it. So PT satisfies a case-mix standard with
      survey data while PA and CRNA satisfy structurally similar standards with logged encounters
      — the same standard shape, two entirely different evidence models, and only one of them
      supports mid-rotation intervention. capte.yaml names the consequence directly: a PT program
      cannot see mid-curriculum that a given student has not yet encountered a required setting or
      population, and the forward-looking gap view lives in Program Requirements, a separate
      object with a separate taxonomy that is reconciled by hand. That reconciliation problem
      generalises and is worth naming as a platform finding: a program can end up with setting
      categories on the Timesheet, setting tags on Locations, setting values on the log, and
      setting-named Program Requirements on the student profile — four taxonomies for one concept,
      none of which is documented as the system of record. PT and OT do share one genuinely
      distinctive, under-appreciated capability: approved timesheet hours feed CI/Fieldwork
      Educator CEU crediting and thank-you certificates, and because CEUs vary by state many
      programs deliberately leave the CEU total blank and list supervision hours instead, letting
      the educator or their state chapter convert. No competitor documents preceptor recognition
      derived from student-logged hours, and it is the strongest non-compliance argument in this
      stage for getting hour capture right — accurate timesheets have a direct site-relationship
      consequence, not just an accreditation one. OT's own reporting centre of gravity is the
      timesheet pair (Hours Summary by Week is named by acote.yaml as "the direct 24-week evidence
      artifact" for C.1.12, Raw Data Timesheet as the audit trail beneath it), and its defect is
      the familiar one: neither the 24-week OT nor the 16-week OTA threshold is enforced, the
      rollup is a report an admin reads rather than a rule the system checks, and the split is
      degree-level-conditional inside ONE standard number — which matters because a single
      university commonly runs an OTD/MSOT and an OTA program in the same tenant. OT also
      documents the practice most likely to weaken the audit trail: some schools skip category
      setup entirely and record hours by placement duration (e.g. weekly) rather than daily.
      PA's mechanics are the ones the expansion domains would inherit most directly. Diagnosis and
      Procedure Minimums let a program set per-rotation encounter floors so students see gaps in
      real time — no competitor file documents a configurable per-diagnosis or per-procedure
      minimum-count threshold at all — but they are not self-service: the program states them on
      separate tabs of an Excel intake sheet during requirements gathering and Exxat loads them.
      Patient Log TEMPLATES are usefully framed in the PA tutorial as "different patient log
      TYPES," so one-template-per-course is the mechanism for variety rather than a limit on it —
      but the support dependency covers CHANGES TO EXISTING templates as well as new ones, which
      is the sharper half, because for PA and CRNA the layout IS the accreditation evidence model,
      so an accreditor edition change (COA's January 2026 Appendix, ARC-PA's 6th Edition) is a
      vendor ticket rather than an admin task. Two PA details that read favourably: patient-log
      reports can be generated while logs sit in Pending Review, which is what makes B3.04's
      "spot gaps while there is still time to re-place a student" behaviour actually possible; and
      the aggregate report's Group By supports a two-lens read both the PA and Nursing playbooks
      document independently — grouping BY STUDENT surfaces gaps in demographics, age groups,
      diagnoses and encounter types so placements can address deficiencies before graduation,
      grouping BY LOCATION identifies which locations provide stronger exposure to which
      populations. Same control, two different accreditation questions. On the Timesheet side PA
      carries a live configuration hazard with no guardrail: ARC-PA's 50% and 20% telehealth
      ceilings are only computable if Telehealth is a SINGLE-SELECT category, because hours tagged
      both "Telehealth" and "In-Person" make the percentage meaningless — the PA
      accreditation-reports guide states the correct answer outright, and the setup screen does
      not.
      Social Work's hour capture is well modelled and quietly configuration-dependent. The
      Timesheet carries date, activity description, site and Category (so CSWE's
      activity-description expectation is a named field for SW rather than a repurposed notes box,
      though nothing confirms it is mandatory or validates its content), logs both in-person and
      virtual hours, and auto-deducts break and time-off hours in a way the help guide explicitly
      ties to CSWE's rule that breaks do not count toward the 400 BSW / 900 MSW minimums. But the
      break behaviour is contested across sources and must not be stated flatly: the general Hours
      by Category report is documented as showing "total approved hours (including break time),"
      while the transcript's "total timesheet time excluding breaks" is a separate derived figure
      that exists only if break capture was required at setup — so a Social Work program in
      particular cannot assume the headline number is CSWE-clean. The in-person/virtual
      distinction rides on the program-authored Category taxonomy rather than a modelled
      attribute, which is a notable asymmetry inside Prism itself: SLP gets Mode of Delivery as a
      first-class field and a reporting axis, SW gets the same concept only if an admin thinks to
      encode it as a Category value — and if the program answered No to "do you want students to
      categorize each Timesheet entry?", the distinction does not exist for them at all. SW is
      also the one confirmed case where the student CHOOSES between two structurally different
      supervisor roles as their hours reviewer (Field Instructor or Task Supervisor), and no
      source confirms the resulting record distinguishes which role signed — which is exactly the
      distinction CSWE AS B3.3.6/M3.3.6 rests on. Because CSWE's minimum is a PROGRAM total across
      every field experience rather than a per-placement one, the Students > Overview cumulative
      dashboard is structurally the right artifact and the per-course report is the wrong shape;
      the threshold is still not asserted anywhere, and cswe.yaml confirms nothing red-flags a
      student tracking short of the floor.
      Two absences close the stage. Teacher Education has no in-rotation capture surface that can
      be described from the available sources at all: the only documented TE workflow is the
      GoReact/Echo360 LTI video assignment, which is genuinely good (two-way sync, Prism
      auto-creates the matching GoReact activity on first save, reviewers leave timestamped
      comments and scores that flow back) but is discipline-gated behind a support ticket, and is
      performance-based evidence rather than the Duration or Breadth evidence CAEP R2.3 also
      demands. No TE hour category taxonomy, threshold, or hours report is documented anywhere,
      and early field hours plus a culminating student-teaching semester are two structurally
      different hour-capture problems in one program. CAEP's Diversity attribute is the deeper
      structural mismatch: in every health discipline the diversity dimension (age group,
      condition, setting) is a property of the ENCOUNTER and therefore capturable on a log, while
      CAEP's is a property of the partner SCHOOL's student body, which no log-shaped object can
      capture. And the Dentistry-facing gap this stage already recorded is confirmed rather than
      resolved from the discipline side: the only system-provided procedure-coding lookup category
      is CPT, not CDT — and the same absence pattern holds across the existing disciplines, since
      no source names an NBCRNA case-category set, an ASHA nine-service-delivery-area set, or a
      CSWE nine-competency set as a Standard lookup either. Every one of them is program- or
      support-loaded, which makes the shipped-taxonomy question, not the capture question, the
      real cross-discipline gap. Finally, the report inventory this stage touches is itself a
      finding — Patient Log Aggregate, Comprehensive Report Patient Log, Graphical Patient Log
      Summary, Optional/Required Procedure Count, Student Activity Insights, NBCRNA Transcript,
      Hours by Category / Clock Hours, four SLP Clinical Log variants, Clinical Log Raw Data,
      Timesheet Hours Summary by Week and Raw Data Timesheet: there is no single "did this student
      meet their requirements" view anywhere, and every program assembles the answer from several.
