# Rotation Lifecycle — cross-domain journey map (DO / Pharmacy / Dentistry / Medicine).
# Grounded in: ../prism/capability-map.yaml, ../accreditation/{coca,lcme,acpe,coda}.yaml,
# ../competitors/*.yaml, ../domains/{do,pharmacy,dentistry,medicine}.yaml.
#
# NOTE ON STAGE SHAPE: stages follow the _TEMPLATE.yaml keys exactly, plus one added
# key — `domain_variance` — because this journey is not structurally the same journey in
# all four domains (Dentistry in particular inverts it: the clinic comes to the student).
# Where a stage's Prism state is asserted, it is traced to a named pillar or to a named
# open question in capability-map.yaml; unconfirmed items are labelled as unconfirmed
# rather than assumed.
#
# NOTE ON THE SECOND VARIANCE KEY (added 2026-08-25): each stage now carries BOTH
# `domain_variance` AND `discipline_variance`, and they are deliberately different fields
# rather than a rename. `domain_variance` is unchanged and stays scoped to the four
# EXPANSION domains named in domain_scope above (DO / Pharmacy / Dentistry / Medicine) —
# the markets this journey was written to assess. `discipline_variance` is the new,
# additional field covering the EIGHT disciplines Exxat Prism already serves in
# production — PT/PTA, OT/OTA, PA, SLP, Nursing, Social Work, Teacher Education, and CRNA
# (nurse anesthesia) — following the precedent set by
# ../journeys/admin-onboarding-product-setup.yaml, which introduced `discipline_variance`
# for the same reason: the interesting question for an already-served discipline is not
# "would this journey work here" but "which discipline gets a shipped instrument, a
# standard-named report, or a seeded taxonomy, and which gets a support ticket." Keeping
# both keys is the point — a stage can be structurally different for Dentistry (the clinic
# comes to the student) AND operationally different for CRNA (the supervision cap is a
# per-preceptor, per-moment rule), and those are not the same finding.
# Every discipline_variance block below synthesizes the eight now-fully-researched
# element-level flow files listed in `sources`, which were extended on 2026-08-25 from
# four-domain coverage to twelve-discipline coverage against their real accreditor
# registries (capte, acote, arc-pa, caa-asha, nursing [CCNE/ACEN], coa, cswe, caep).
# Where a flow file recorded something as unconfirmed, contradicted between sources, or
# reasoned from an accreditor registry rather than observed in an Exxat product source
# (Teacher Education throughout), that uncertainty is carried into the narrative rather
# than resolved.

journey_name: "Rotation Lifecycle"
domain_scope: ["DO", "Pharmacy", "Dentistry", "Medicine"]
persona: >
  Primary: Clinical/Experiential Education Coordinator (see ../personas/_TEMPLATE_role.yaml —
  role-clinical-coordinator). This is the role that owns the placement engine day to day:
  contracting sites, credentialing preceptors, running the allocation, chasing evaluations,
  and assembling the roster tables an accreditor asks for. Secondary personas touched at
  specific stages: Compliance/Accreditation Liaison (stages 1, 3, 8), Preceptor/Site Faculty
  (stages 2, 5, 6, 7), Student (stages 3, 4, 5, 7), Assistant/Associate Dean for Clinical
  Education (stages 1, 4, 8).

stages:
  - stage: "1. Site sourcing, capacity contracting & affiliation-agreement execution"
    current_state_in_prism: >
      Clinical & Experiential Education (shipped) models sites and placements, so a site
      record exists and placements hang off it. Contract lifecycle is now confirmed at the
      element level, not merely the right "shape": Contracts is a distinct, first-class
      object living under Sites/Locations — Contract Name, auto-generated Contract Number,
      Tax ID, Start/Expiration Date, Contract Template, Status, initiator/primary contact,
      multi-site linking via a chain icon, per-program and per-location coverage, a routing
      checklist, document upload/archive, and template-based auto-generation — confirmed via
      the help-center "Managing Contracts" and "Understanding Site vs. Location" articles
      (the latter defines a Site itself as "the entity with which a contractual relationship
      is established"). A Placement Clearance Dashboard Contract Status column (Valid
      Contract / Needs Attention / Needs Attention (Missing Contracts), with distinct
      single- vs. multi-contract logic) and configurable Auto Notifications for expiring
      contracts (days/weeks/months-before lead time, Daily/Weekly/Monthly/Yearly cadence)
      are also confirmed shipped. See
      flows/rotation-lifecycle--01-site-sourcing-capacity-contracting-affiliation-agreement.yaml
      for the full element trace. What remains genuinely unconfirmed after this pass: no
      rolling-average capacity math exists anywhere in the source material — the "Number of
      Offers" field on a Slot is a manually-entered, static per-batch integer, not a computed
      3-year rolling average against demonstrated site capacity — and no artifact resembling
      a lost-capacity contingency plan appears anywhere in the help-center mirror, discipline
      playbooks, or capability-map.yaml.
    pain_or_gap: >
      The coordinator can now partially answer the first accreditor question from inside the
      product: the Contracts report surfaces "Sites Missing Contracts" directly, and the
      Placement Clearance Dashboard's Contract Status column flags "Needs Attention" for any
      site/location whose contract is unexecuted, expired, or expiring before a placement
      ends (confirmed via "Managing Contracts" and "Adding and Managing Sites" — see the new
      flow file). So the shared-drive-of-PDFs-plus-spreadsheet workaround is avoidable, not
      mandatory, for that question. The second question — does each site's demonstrated
      capacity cover the students intended to send — remains fully outside the product: the
      only capacity primitive found anywhere is "Number of Offers," a manually-entered static
      count per Slot batch, with no rolling-average math and no capacity-vs-demand comparison
      surfaced anywhere. The silent-failure claim is now confirmed rather than merely
      asserted: nothing in the Add Slot flow or the Placement Clearance Dashboard blocks new
      scheduling on a lapsed contract — Contract Status is diagnostic-only — so a coordinator
      who does not proactively check the dashboard (Exxat's own documented best practice is
      starting 6-8 weeks out) can still schedule a student at a site with no valid agreement.
      COCA's contingency-plan-for-lost-capacity requirement remains a confirmed gap — no
      artifact resembling it appears anywhere in the source material reviewed.
    accreditation_link: >
      COCA Standard 6, Element 6.9 (executed affiliation agreement per contracted clinical
      site; 3-year rolling average of students eligible for first-time/repeat/off-cycle
      rotations matched against demonstrated site capacity; contingency plan for lost
      capacity) — rated Configure in coca.yaml; its open gap note ("confirm whether
      Compliance Management's item-expiry tracking can be repointed at site-level contracts,
      or whether contract lifecycle needs a new object type") is now resolved: Contracts is
      confirmed as its own first-class object type under Sites/Locations, not a repointed
      student-compliance item (Managing Contracts; Understanding Site vs. Location — see the
      new flow file). The rolling-average capacity math and the contingency-plan artifact
      remain unbuilt, so Configure still holds, but for narrower, now-specific reasons. LCME
      Standard 1, Element 1.4 (written affiliation agreements naming authority over
      education/assessment, resource access, faculty appointment, occupational-exposure
      follow-up) — same resolution on the taxonomy caveat; LCME's required_software_behavior
      additionally asks for "the ability to block new placements at a site whose agreement
      has lapsed," which this pass confirms does NOT exist (Contract Status is
      diagnostic-only) — that specific piece is a genuine, now-precise build gap under the
      Configure rating. ACPE Standard 3, Key Element 3.5.b (executed current agreement per
      practice facility) — accreditation/acpe.yaml still rates this **Gap**, with a rationale
      ("no pillar today models site-level compliance/contract documents") that this pass
      shows is now out of date: a site-level contract/document repository does exist and
      ships today. That file's rating has not been revised as part of this pass, but its
      premise no longer holds — ACPE 3.5.b's real remaining shortfall is the same missing
      scheduling-block behavior (and an unconfirmed per-state licensure dimension) the other
      three accreditors also face, which argues for realigning it toward Configure rather
      than Gap in a follow-up pass on acpe.yaml itself. CODA Standard 4, Element 4-6 (written
      agreement for any site not owned by the sponsoring institution) — same resolution as
      COCA/LCME: Configure holds, caveat answered the same way.
    competitor_comparison: >
      This stage needed a correction: Prism is not behind CORE ELMS and eMedley on shipped
      function the way the prior synthesis assumed. CORE ELMS's affiliation-agreement
      tracking with expiration alerts (corehighered.com —
      "student-clinical-experential-education"; CORE claims 90% of U.S. pharmacy programs)
      and eMedley's eKeeper auto-expiration reminders (emedley.com/student-documents,
      clinical.emedley.com) both describe the same category of function this pass confirms
      Prism already ships — a per-site/location Contract record with expiration date, status,
      and a configurable alert cadence (Managing Contracts; Manage Contract Expirations
      Easily with Exxat Prism). Neither competitor's public documentation is granular enough
      — no field names, no screen-by-screen detail — to compare beyond this capability-level
      parity claim; the new flow file marks every competitor_equivalent entry for this stage
      as non-comparable at element level for that reason. Where Prism still plausibly trails
      is narrower than "shipped function": eMedley's eKeeper explicitly pairs contract
      tracking with preceptor *pay* automation, and while Prism's own Payment
      Details/Site Payment Report (Adding and Managing Sites) confirms site/location/
      personnel pay-rate and vendor-ID tracking, it is not confirmed to be integrated with
      Contract Status the way "automation" implies eKeeper's is. MedHub/E*Value still
      describes trainee-side credentials monitoring, not site contracts, unchanged from the
      prior read. The white space among Elentra, one45, Leo/DaVinci (elentra.com,
      acuityinsights.com, davinci-ed.com), and axiUm (not a multi-site placement product) is
      unchanged. The research's implied recommendation — "build contract lifecycle as a
      first-class site-level object, not a stretched student compliance item" — turns out to
      already be substantially built; the smallest remaining build to move ACPE 3.5.b toward
      Transfer is the scheduling-block behavior and the rolling-average capacity math, not
      the contract object itself.
    domain_variance: >
      DO — highest volume and highest stakes: COMs run a "distributive" model across a wide,
      geographically scattered network of independent community hospitals and practices that
      each COM recruits and credentials individually (domains/do.yaml), and site capacity is
      a documented, worsening bottleneck as community hospitals reserve slots for affiliated
      MD programs. Medicine — fewer, larger, university-affiliated systems, but 44% of
      AAMC-surveyed schools report moderate-to-severe pressure to *pay* community
      physicians/clinics to host students, which turns the agreement record into a financial
      instrument, not just a legal one; this pass confirms Prism's Sites module already has a
      Payment Details section (payee = site/location/personnel, rate, rate unit of Per
      Week/Per Rotation, vendor ID) and a Site Payment Report (Adding and Managing Sites), so
      recording that financial instrument against a site record is a confirmed existing
      capability, not something needing to be built from scratch. Pharmacy — contracts must
      carry a per-state dimension (state boards license the practice facilities, and
      multi-campus/distance programs routinely cross state lines per acpe.yaml's licensure
      layer); no confirmed per-state licensure field exists on the Site record today, so this
      dimension remains unconfirmed/unbuilt. Dentistry — structurally the smallest version of
      this stage: the core clinical experience happens in the school's own teaching clinic,
      so external agreements are needed only for extramural/community rotations and
      specialty placements (domains/dentistry.yaml, CODA 4-6).
    discipline_variance: >
      The eight existing disciplines do not just add volume to this stage — they add three
      whole steps the four-domain version of the flow file could not have had, because
      COCA 6.9, LCME 1.4, ACPE 3.5.b and CODA 4-6 all ask only that an executed agreement
      EXIST, while five of these eight accreditors ask how the site was CHOSEN and how
      often it is re-checked. That is the Site/Agency Assessments step: a self-service form
      builder at Sites > Setup > Form Setup with 11 question types including attestation and
      e-signature, serving ARC-PA B3.02 a-c, CSWE AS 3.3.4, CAA 3.0B/3.9B, COA F.4/F.6 and
      CCNE II-C, with PA's documented practice being to build exactly two instruments
      ("Initial Site Visit" and "Ongoing Site Visit") and OT's being a 5-10 year revisit
      cycle read off the Assessment Details report. The shared defect is recurrence: the
      builder has no interval semantics, so a program can prove it assessed a site and
      cannot prove — or be warned — that it has stopped, and arc-pa.yaml names that as the
      B3.02 gap directly. Nursing/CRNA is the only partial mitigation, pushing site-visit
      follow-up dates onto the Program Calendar; note that coa.yaml's own audit says this
      repo's habit of attributing site visits to COA F.4 needs correcting — a Site
      Assessment form is how a program EVIDENCES F.4, not a visit F.4 requires. Two
      discipline-specific defects sit on the same step: OT's confirmed inability to log an
      assessment offline (paper notes re-entered later, which is exactly the step that gets
      skipped), and SLP's support-gating — new custom forms require a prism-support@exxat.com
      ticket, so an SLP program cannot author its own CAA 3.9B site-suitability instrument
      on the same terms PT can, which is where SLP's stage-1 story is weakest.
      Terminology forks without forking the data model: OT renames Sites to Agencies and
      Preceptor to Fieldwork Educator / Site Mentor, Social Work reaches the same records
      through an Agencies module, and three disciplines reach one report under three names
      (PA's Comprehensive Assessment Report at SSR Appendix 15, SW's Agencies > Reports >
      Assessment Details, OT's Assessment Details) — which is a good reminder that
      discipline-named reporting here is largely a labelling exercise over shared machinery.
      The sharpest single finding is a confirmed absence with an OT name on it: there is no
      "contract not required" flag on the Site record, so every site that legitimately needs
      no agreement (field trips, observation, service-learning — precisely the population
      ACOTE C.1.5 covers) emits a permanent false-positive Needs Attention row. Combined
      with the display-only posture of the Contract Status column, the failure mode is not
      "a coordinator has to go look at it" but "a coordinator learns to ignore it." That
      column also forces the most consequential correction in this stage: the OT playbook
      says the Placement Clearance Dashboard "verifies students are placed only at sites
      with active contracts," the Nursing playbook calls it "the gating checkpoint," and
      acote.yaml describes the required behaviour as "blocking or flagging the placement
      before it begins" — all true of the COMPUTATION and false of the ENFORCEMENT. Nothing
      on the dashboard or in Add Slot prevents a placement against a Location showing Needs
      Attention, so a customer-facing claim built on the playbooks' wording would not
      survive a demo. SLP's own playbook wording — agreements are "stored, viewed, and
      monitored in the Sites module" — is the accurate one and the phrasing the others
      should borrow. The defensible claim is real and specific: Prism evaluates contract
      validity against each placement's own dates and distinguishes "expires before
      placement end" from "missing," which is harder than the expiry-date check CORE ELMS
      and eMedley market and more than any competitor source in this repo documents.
      PA is where contract CONTENT becomes a live citation risk rather than a theoretical
      gap. ARC-PA 6e B3.01 a-e requires agreements to explicitly name "Physician Assistant
      students"; broad institution-wide "all learners" language is no longer sufficient,
      multi-campus institutions must identify which campuses are covered, and the playbook
      records generic university-wide language as "a common source of accreditation
      citations." Prism stores the PDF and asserts nothing about its clauses, so "which of
      my 300 agreements name PA students?" is a PDF-by-PDF read — and the chain-icon
      link-one-contract-to-many-sites control, which is a clean win for CAEP's district MOU
      shape and for COA F.2's one-hospital-many-nursing-tracks case, makes the risky pattern
      one click cheaper for PA. The documented remediation (an addendum reading "All
      learners in this agreement include Physician Assistant students") also has no home,
      because the contract's file upload treats documents as versions of one agreement
      rather than as a base plus amendments. This is the highest-leverage cross-discipline
      finding in the stage: CAPTE 2D9's five enumerated clauses, ACOTE C.1.5's both-parties
      responsibilities, COA F.2's expectations-of-both-parties, ACEN 4.9's student-protection
      clauses and CAEP R2.1 all want the same "required clauses present" checklist, and the
      absence is very likely category-wide — no competitor claims to model agreement content
      either. The partial mitigations are OT-sourced and worth naming because the four-domain
      baseline never surfaced them: an institutional Contract Status vocabulary richer than
      Active/Inactive (Fully Executed / Awaiting Signoff / Draft / Finalized / In Development
      / On Hold / Terminated, which is what makes CAPTE 2D8's "fully executed" test
      expressible at all), a Contract Organization format field (Old / New / Universal), a
      real routing checklist (Date Signed by Dean, Date Signed by Provost, Copy Sent to
      Dept), Contract Templates cited by ACOTE C.1.5 as consistency evidence, and a
      documented live auto-notification setting of "2 months within contract end date...
      repeats weekly." Honest limit carried forward: no source reconciles OT's
      institutional-level seven-value status set with the program-level Active/Inactive
      Status field on the Add Contract drawer — whether they are one field at two scopes or
      two fields is unconfirmed.
      Capacity is where CRNA becomes the severity outlier. The slot record carries a
      Supervision Type select (OT's production values: 1 Student:1 CI, 1 Student:2 CIs,
      2 Students:1 CI, 2 Students:2 CIs), which ACOTE C.1.7 accepts as a Configure — its
      defect being that planned and realized ratios live in two views that never reconcile,
      and that the Placements by Educator report explicitly excludes placements with no
      assigned educator, so the denominator quietly shrinks. COA F.7 is a different animal:
      rated Build, asterisked CRITICAL, and scoped to preceptor-shift rather than to
      placement — never more than 2 students to 1 supervising CRNA or anesthesiologist AT
      ANY TIME, with brief exceedances permitted only against a documented rarity-plus-
      contingency record. A slot-level Supervision Type is a declaration about a batch;
      F.7 asks a question about a shift, and the field cannot answer it. This is the
      clearest case in the stage of something that reads as parity on a feature grid and is
      not parity against the standard, and personas/discipline-crna.yaml carries it as job
      4 with the same conclusion reached independently. COA A.3 compounds it: the
      institution-to-institution joint-governance agreement that is the ORDINARY case for a
      university/anesthesia-practice CRNA program has no home at all, because Prism's
      Contract object is location-linked by design — and A.3 is critical-flagged while F.2
      is not, so the weaker coverage sits on the more severe standard. Note also that all
      three CRNA video transcripts contain zero mentions of sites, contracts, capacity or
      slots: every CRNA claim in this stage traces to the Nursing playbook and coa.yaml, not
      to a CRNA product source.
      The most useful correction the eight disciplines make to the four-domain reading is
      about capacity REPORTING. Stage 1's standing hedge — "no rolling-average capacity math
      exists" — survives, but it is not an expansion-domain hole: PA has SCPE Details
      (shaped like the ARC-PA Entry Level Program Portal's own data-entry format, populated
      automatically from site slot-request responses rather than admin estimates, and worked
      by a documented "gold in, gold out" line-by-line Excel diff against the portal),
      Nursing has a Slot Sufficiency Report (Total Slots Offered / Total Placements /
      Completed Placements by site — offered-vs-placed exposes over-solicitation,
      placed-vs-completed exposes attrition), PT/PTA has Number and Variety of Clinical Sites
      and Clinical Slots, and PA additionally has Distribution of Slots Across Settings and
      by Location. Every one produces volume; none produces a verdict, and arc-pa.yaml,
      nursing.yaml, coa.yaml and capte.yaml each reach that conclusion independently. So the
      missing analytic layer is a shared twelve-discipline platform investment, not a
      go-to-market blocker for any one domain. Two discipline-specific sharpenings: for CRNA,
      COA F.1/A.10 (both critical) ask whether resources suffice for each graduate
      INDIVIDUALLY, and no report crosses site capacity with the Appendix case-category
      minimums — Prism holds both halves of that join and does not join them; and for PT,
      CAPTE 2D8's 150%-of-charter-class capacity projection for developing programs has no
      shipped equivalent, along with the site-specific Letter of Intent it depends on, which
      matters directly here because every new expansion-domain program is by definition in
      that pre-cohort position. PT also carries a live labelling defect: its two sites/slots
      reports are printed with 2016 numbering ("Standard 2C," "Standard 8F") when the content
      now lives at 2D8 and there is no Standard 8 in the 2024 documents — cosmetic in
      severity, but live since January 1 2026, and the concrete argument for making an
      edition crosswalk a first-class field.
      Sourcing rhythm is the last real fork. PT runs a single annual blast — the March 1
      "M1M," where an M1M sent March 1 2025 requests calendar-2026 slots and SCCEs respond
      with a mix of reserved and First Come First Serve capacity, the FCFS share climbing and
      schools racing to advertise it before competing programs take it. That makes PT's
      failure modes deliverability failures rather than data failures, which is why Sites >
      Emails > Email Dashboard with Status = Failed is the most operationally consequential
      screen in PT's year: documented causes are address typos, retired addresses, firewalls
      and full mailboxes, and two of the three documented fixes involve the coordinator
      sending from a personal account — losing the system-of-record audit trail for exactly
      the large hospital systems whose firewalls block bulk senders, i.e. the scarcest acute
      and inpatient sites. Nothing pushes a "your M1M did not reach 40 of your 300 sites"
      summary; like Contract Status, it is computed, displayed, and not escalated. The
      "No Areas/Tags/Categories/Settings Assigned" inverse recipient filter is the good half
      and should transfer verbatim to the expansion domains, whose taxonomies will be
      half-populated in year one. The @Request Link merge-field requirement is documented as
      instruction, not validation, so a blast can go to hundreds of contacts with no call to
      action and the symptom is silence. PA has no fixed sourcing date and splits into Site
      Based versus Preceptor Based models, and owns the only assignment-time capacity control
      anywhere in the stage — Max Placement Limit, a soft warning scoped to Location +
      Setting + Cohort, off unless enabled in Slot Request Configuration, and lockstep-only,
      which means the preceptor who offers the capacity cannot be capped as a preceptor, and
      OT/SW/SLP programs whose accreditors ask materially the same question cannot have it at
      all. Social Work inverts the whole stage: agencies enter the directory FROM STUDENTS
      through Multi-Location Field Application Forms (up to 10 suggestions per student, each
      an interview), arriving with no contract, no assessment and no personnel credentials,
      policed only by an admin mapping step whose map-only-once rule is the dedup mechanism;
      CSWE AS 3.3.7's employment-based-placement policy has no model at all and is the only
      site-eligibility rule found across twelve disciplines that turns on a fact about the
      STUDENT. OT's capstone runs the same student-proposes pattern through a questionnaire/
      MyRequest wishlist and then executes its ACOTE D.1.5 agreement as a multi-party custom
      FORM (Student > Site Mentor Review > Faculty Review > Admin Review) — a second,
      parallel agreement mechanism living entirely outside the Contract object. Teacher
      Education is the one discipline whose fit here is reasoned rather than observed: the
      chain-linked contract is a near-exact structural match for a district MOU spanning many
      school locations (CAEP R2.1), but CAEP wants the RELATIONSHIP record — co-construction
      meeting decisions, agenda topics, advisory-board activity — not the signed document,
      and the partner-school demographic attribute R2.3 needs has no field, so diversity
      evidence is a manual crosswalk against state report-card data. The TE playbook warns
      outright that TE terminology and placement workflows are "NOT confirmed for Exxat," so
      every TE clause above carries that caveat. Two research holes are recorded rather than
      papered over: the real slot-sourcing competitive set for PT/OT — myClinicalExchange,
      Clinician Nexus, ACEMAPP and CastleBranch Bridges, which invert the model by making the
      SITE the account holder and which the PT playbook says "will not integrate with us" —
      has no teardown file anywhere in this repo, and the PT-requested Exxat version of the
      CSIF is a named enhancement, not a shipped instrument.
