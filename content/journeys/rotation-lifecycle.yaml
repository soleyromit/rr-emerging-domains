          AFTER the student has been assigned to them — the wrong side of ACOTE C.1.10's "prior to the
          start," ACPE 3.3.c's "before accepting a student," and CCNE II-G alike. That is the same gap the
          Place Student drawer shows from the credentialing side, where the Preceptor/CI dropdown still
          carries no visible validation against the Clearance Dashboard's own credential columns.
      - subject: "PA"
        detail: >-
          All eight vocabularies — DCE/ACCE over CI and SCCE in PT, Academic Fieldwork Coordinator over
          Fieldwork Educator and Site Mentor in OT, Preceptor in PA, Clinical Educator in SLP, Preceptor
          under Sites > Personnel in Nursing/CRNA, Field Instructor plus Task Supervisor in Social Work, and
          Cooperating/Mentor Teacher plus University Supervisor in TE (explicitly unconfirmed) — ride the
          same program-configurable Designation lookup. That toggle carries a live contradiction between
          sources that should be resolved before it is used with a customer: the PA transcript describes the
          same Enable Attestation control as binding the STUDENT before submitting (an academic-integrity
          pledge), while the SLP and CRNA transcripts describe the CLINICAL EDUCATOR signing at review. All
          three share the auto-approval exclusion so this is one mechanism described three times, but the
          readings are not interchangeable — if PA's is accurate for PA, PA has no reviewer-accountability
          artifact anywhere in its log workflow, and the PA transcript separately states that auto-approval
          disables preceptor review outright. The shared fix across three of these disciplines is small and
          identical: promote the threshold-bearing facts to structured Personnel fields — an
          accredited-program boolean and a degree-conferral date for CSWE B3.3.6/M3.3.6, a
          years-of-full-time-practice field for ACOTE C.1.13, and a clean degree taxonomy for ARC-PA
          A2.15/A2.16d, whose majority-PA/physician test and 10% non-PA/MD ceiling are computed by hand in
          Excel today partly because Degree is free text and "MD," "M.D." and "Doctor of Medicine" are three
          different strings. With those fields in place, the Comprehensive Personnel Report that already
          ships for PA, SW and OT answers all three standards without new construction.
      - subject: "SLP"
        detail: >-
          The nearest calibration analogue outside PT is the reviewer attestation on log approval used by
          SLP and CRNA — which makes a supervisor ACCOUNTABLE for the accuracy of a review without making
          them CALIBRATED, and which is disabled entirely when logs are set to auto-approve. SLP is thin in
          a different, more specific way: Clinical Educator is a first-class filter across the entire SLP
          report suite but never the UNIT of a qualification rollup, so SLP is well served for supervision
          hours and poorly served for supervisor qualification. CAA 2.3 asks about all individuals providing
          clinical education both on-site and off-site; the operative CFCC V-E figure — direct supervision
          as a percentage of each student's total contact with each client — is not computed anywhere; CAA
          2.3's separate workload-weighted "majority of academic content taught by doctoral faculty"
          composition calculation has no mechanism at all; and new custom forms require a
          prism-support@exxat.com ticket, so SLP cannot self-serve the instruments the other disciplines
          build.
      - subject: "Nursing"
        detail: >-
          That finding is the population split, and the eight disciplines resolve it in one direction:
          preceptors are NOT faculty in Prism's data model, and they live in the weaker store. The Nursing
          playbook states it flatly ("Preceptor — clinical supervisor/evaluator at the site, stored under
          Sites > Personnel, NOT Faculty and Staff"), and the consequence is that off-site supervisors get
          the Placement Clearance tri-state (Missing / Exists / NA — a presence check) while internal
          faculty get Faculty Compliance's mandatory, expiration-dated, auto-notified, archive-on-reset
          requirements. Exxat's own guides demonstrate the confusion: the CCNE guide answers Key Element
          II-G (a PRECEPTOR qualification standard) with Faculty Profiles under Faculty and Staff, while the
          ACEN guide answers the parallel ACEN 2.9 with Sites > Personnel — two Exxat-authored guides
          routing the same question to two different modules. Nursing also resolves this stage's
          date-awareness hedge in a sharper form than the four-domain reading left it: the Licensure
          Entered, Licensure Missing and Board Certification Entered reports DO carry expiration dates, so
          the DATA is date-aware and the CLEARANCE GATE is not. A preceptor whose licence lapses
          mid-rotation shows Exists on the dashboard and expired in the report, and nothing reconciles the
          two — while Contract Status, one column over on the same grid, performs exactly that
          reconciliation. This is also the one place in the stage where a competitor claim is genuinely
          comparable and arguably ahead: CORE ELMS's preceptor license tracking with automated expiration
          reminders and MedHub/E*Value's automated credentials monitoring are alerts that find the human,
          where Prism's equivalent is a report a human must remember to run. The commercial framing that
          follows is stated independently in caa-asha.yaml, nursing.yaml, caep.yaml and coa.yaml: Faculty
          Compliance requires the paid Exxat Approve add-on, so the stronger machinery is a services attach
          rather than base product. Nursing carries a second, different numeric ratio that shows how many
          axes this problem has: CCNE II-F's recommended 1:8 faculty-to-student ratio for INDIRECT
          supervision on nurse practitioner tracks is a faculty-workload figure computed across an
          assignment, not a slot attribute. The three-tier faculty association model supplies both numerator
          and denominator and nothing computes or alerts on it — and because 1:8 is about Faculty and F.7 is
          about Personnel, a school running BSN/NP tracks alongside CRNA needs two different ratio
          computations over two different entity stores.
      - subject: "Social Work"
        detail: >-
          The four-domain reading of this stage treats preceptor credentialing as one workflow — Sites >
          Personnel plus the Experiential Supervisor Intake Form. The eight existing disciplines demonstrate
          that Prism actually ships FOUR structurally distinct credentialing workflows, and three of them
          exist only because an already-served discipline needed them: a course-scoped, STUDENT-submitted
          educator-details form living in Learning Activities (PT's CI Details, OT's Fieldwork Educator
          Details Form, Social Work's Field Instructor Information Form); a slot-level supervision-ratio
          declaration (Sites > Location > Slots > Supervision Type); and an instrument-calibration training
          quiz attached to a single standard form (PT's CIET v2.0). Social Work supplies the two strongest
          GATE patterns in the stage and both should transfer to the expansion domains verbatim. First,
          orientation: field-instructor orientation-completion certificates stored in Agencies > Personnel >
          Certification surface on the Placement Clearance Dashboard's Preceptor Certification column,
          making SW the only discipline of the twelve with a per-placement, pre-rotation orientation check
          at all — which is precisely the mechanism ACPE 3.3.c and COCA 5.4 need, and cheaper than building
          one. Its weakness is that it is a convention riding on a general-purpose column: nothing
          distinguishes an orientation certificate from a board certification, so an LCSW who has never been
          oriented reads Exists and clears, and there is no expiry behaviour behind an annual
          re-orientation. Second, SW's student-led My Request workflow can make Field Instructor credential
          fields STRUCTURALLY MANDATORY at the moment a placement is proposed — the only place in twelve
          disciplines where supervisor credentials gate a placement request rather than being monitored on a
          dashboard afterwards — though the fields are free text, so the form can require that an answer
          exists without checking that it clears. SW is also the one discipline whose accreditor explicitly
          contemplates split supervision, and Prism models two typed supervisors on one placement as a
          first-class structure; the operational catch is that an adjunct faculty member serving as the
          off-site qualified FI must be hand-added as agency staff before their name appears in the Field
          Instructor / Task Supervisor dropdowns — a manual bridge between exactly the two entity stores
          this stage's central architectural finding is about.
      - subject: "Teacher Education"
        detail: >-
          The asymmetry worth naming: Prism can bulk-EMAIL preceptors and cannot bulk-CREDENTIAL them — the
          Experiential Supervisor Intake Form sends one supervisor at a time, which caep.yaml, nursing.yaml
          and caa-asha.yaml each independently call a real operational problem, and which is worst for
          Teacher Education, where an EPP places an entire cohort with a different cooperating teacher each,
          in a new set of schools, every semester. TE is also the hardest orientation ask of the twelve —
          CAEP R2.2 requires the EPP and its P-12 partners to jointly DESIGN AND DELIVER training to
          clinical educators and show three cycles of data on it, i.e. delivered training with CONTENT
          rather than a completion flag, with a co-owner Prism does not model; the closest confirmed
          analogue is the ComplianceJunction pattern (vendor Course Id plus Course Link tracked as a
          compliance item) repointed at EPP-authored training. And TE is the largest evidence hole in the
          twelve-discipline picture for this stage: TEVideosTranscripts.md is 37 lines and contains zero
          occurrences of "cooperating teacher," "mentor," "supervisor," "credential" or "orientation"
          (grep-verified), so whether the PIF's auto-generated per-discipline field set produces anything
          usable for TE is unconfirmed in either direction, and every TE rating here is reasoned from
          caep.yaml rather than observed.
      - subject: "CRNA"
        detail: >-
          CRNA is where that lands hardest, and it is the single most distinctive fact in this stage across
          all twelve disciplines. COA F.7 — "at no time does the number of students directly supervised by
          an individual clinical preceptor exceed 2:1" — is the only hard, numeric, critical-flagged
          supervision cap in any of the twelve accreditor registries, and Exxat's own COA Accreditation
          Standards Support Guide answers it with a single table row pointing at Sites > Slots > Supervision
          Type. That field is a STRING: "2 Students:1 CI" is a label the system cannot do arithmetic on.
          Same field, two accreditors, opposite verdicts — sufficient for ACOTE C.1.7, which asks only that
          a ratio be captured structurally and evidenced, and fatal for F.7, whose unit of enforcement is
          preceptor-shift (which named CRNA is responsible for which students on which clinical day), not
          slot and not placement. A CRNA site with ample slots, a correct Supervision Type on every one, and
          every licence showing Exists can still breach a critical standard on a short-staffed Tuesday, and
          nothing in the product would know. coa.yaml's scoping is carried here because it is actionable: a
          derived "supervision assignment (preceptor x date x students)" object between Slot and Placement,
          plus a structured exception log (date, reason, contingency action, approver) — the log is part of
          the standard, not decoration, because F.7 permits brief exceedance only where the program can show
          the event was rare AND that contingency plans existed. Three precedents already exist to build on:
          Placement Assist's overlapping-rotation guard (a concurrency check on the wrong axis), the
          geolocated Faculty Timesheet (a named supervisor tied to a time-bounded shift), and PA's Max
          Placement Limit, which proves Prism CAN inject a supervisor-capacity check into the Place action —
          though it carries capacity rather than credential data, warns rather than blocks, is fenced to PA
          on lockstep clients, and is a PERIOD-TOTAL cap (a preceptor listing 12 monthly slots but capping
          intake at 7 students) rather than the CONCURRENCY cap F.7 needs. Two further CRNA gaps: COA F.5,
          also critical, turns on institutional credentialing at the site rather than state licensure — "is
          this person credentialed BY THIS HOSPITAL to practise here" — and coa.yaml hedges honestly rather
          than asserting, noting only that no source names such a field and that it may collapse into a
          generic document upload; and F.3's named per-site CRNA coordinator, with its Council-approved
          five-year exception clock, has no confirmed home in Sites or Personnel either. Note that the three
          CRNA video transcripts mention the preceptor only as a reviewer/attester of student logs and as a
          response source on the Daily Clinical Evaluation Report — never as a supervision-capacity
          dimension — so every CRNA claim here traces to the Nursing playbook and coa.yaml, matching
          personas/discipline-crna.yaml's job 4 and its switching_trigger (3), "a paywall on a critical
          standard."
    key_findings:
      - subject: "Pharmacy"
        headline: "ACPE 3.3.c wants orientation before assignment; the only bulk path fires after"
        severity: "gap"
        detail: >-
          The only bulk preceptor-notification path, Placements > Email & Publish, fires off an
          EXISTING placement, so orientation reaches the preceptor after the student is already
          assigned — the wrong side of ACPE 3.3.c's "before accepting a student."
      - subject: "DO"
        headline: "COCA 6.10 needs 'supervisor is a DO' as a structured credential field"
        severity: "configure-needed"
        detail: >-
          COCA 6.10 requires proof of a rotation supervised by an osteopathic physician, so the
          attribute must be structured and filterable. Sites > Personnel ships a
          program-configurable Designation lookup, but a designation is a LABEL, not a RULE —
          nothing enforces it.
      - subject: "Dentistry"
        headline: "CODA 2-6's ongoing calibration meets a once-ever quiz with an honour-system bypass"
        severity: "gap"
        detail: >-
          PT's CIET v2.0 is a real blocking rater-training gate (20 questions, 15 to pass) and the
          nearest thing in the product to CODA 2-6. But a pass persists once-ever across every
          course and placement, exactly the wrong semantics for an ONGOING obligation.
      - subject: "PT/PTA"
        headline: "Total Qualifications of CIs is computed, not typed, and named for CAPTE 4P"
        severity: "none"
        detail: >-
          The report derives percentage credentialed, percentage with advanced certification and any
          CI under one year of experience from the CI Details form's own fields rather than from an
          evaluator's typing, and capte.yaml rates 4P Transfer.
      - subject: "OT/OTA"
        headline: "Fieldwork Educator credential data never syncs to the Personnel record"
        severity: "gap"
        detail: >-
          The Fieldwork Educator Details Form collects CV, degrees, certifications and licensure
          from the educator, and none of it reaches Sites > Personnel — the store the Placement
          Clearance gate actually reads. OT runs two credential stores that never sync.
      - subject: "Social Work"
        headline: "SW is the only discipline with a per-placement, pre-rotation orientation check"
        severity: "none"
        detail: >-
          Orientation-completion certificates stored under Agencies > Personnel > Certification
          surface on the Placement Clearance Dashboard's Preceptor Certification column — precisely
          the mechanism ACPE 3.3.c and COCA 5.4 need, though nothing distinguishes one from a board
          certification.
      - subject: "Nursing"
        headline: "Preceptor licence expiry lives in the reports and not in the clearance gate"
        severity: "gap"
        detail: >-
          Licensure and Board Certification records carry expiration dates, so the DATA is
          date-aware while the Placement Clearance tri-state (Missing / Exists / NA) is only a
          presence check. A preceptor whose licence lapses mid-rotation still reads Exists on the
          dashboard.
      - subject: "CRNA"
        headline: "COA F.5's institutional credentialing at the site has no confirmed field"
        severity: "gap"
        detail: >-
          F.5 is critical-flagged and turns on whether this person is credentialed BY THIS HOSPITAL
          to practise there rather than on state licensure, so an Exists on the document tracker is
          necessary but not sufficient. coa.yaml notes no source names such a field.
  - stage: "3. Student readiness & compliance clearance (pre-rotation gate)"
    current_state_in_prism: >
      The strongest shipped stage in the journey, and screen-by-screen
      verification
      (rotation-lifecycle--03-student-readiness-compliance-clearance-pre-rotation.yaml)
      tightens it further rather than just re-asserting it. Compliance
      Management is explicitly described in capability-map.yaml as tracking
      student compliance items that gate placement start/continuation — exactly
      this stage's job — and it is one of only three shipped pillars. The
      item-taxonomy hedge resolves to a Configure-not-Gap finding: the Student
      Compliance Setup screen confirms a category-based, admin-defined,
      per-cohort and template-copyable requirement system (Health &
      Immunization, Certifications & Training, Verification/Identity Documents,
      Insurance & Liability, Memberships & Licensure, Attestations, Additional
      Documents) rather than a fixed list, so populating the right items for
      each new domain is configuration work, not an open capability question.
      The document-acknowledgment/attestation hedge is fully resolved:
      Attestations are a confirmed shipped item type — checkbox-based,
      available at both a general-profile tier and a course-specific tier, with
      a durable signed-and-timestamped audit trail in Profile > Academics —
      genuinely distinct from a document-upload item.
    pain_or_gap: >
      Two gaps remain, both narrower than before. First, *academic* readiness
      is still not the same as *documentary* readiness, but the gap has shrunk:
      Competency Tracking's aggregation mechanism is now confirmed in detail —
      parent-level domain scores are a pooled mean across all child
      competencies' mapped questions, not a naive average-of-averages, with a
      configurable pass threshold — so ACPE's individual-and-aggregate rollup
      has a real, specific engine underneath it. What's still open is narrower
      than "unconfirmed": whether that engine can be configured against ACPE's
      specific 2.1.a-n outcome taxonomy and
      APPE-ready/Practice-ready/Team-ready language, and standardized
      knowledge-assessment scoring behind the gate, which still depends on Exam
      Management (unchanged: roadmap Q2 2027, not shipped). Second, the
      policy-attestation gap is resolved outright — Attestations are a
      confirmed, shipped, checkbox item type distinct from document upload (see
      rotation-lifecycle--03-student-readiness-compliance-clearance-pre-rotation.yaml)
      — but element-level tracing surfaced two narrower gaps in its place: the
      Placement Clearance Report (distinct from the live Dashboard) is
      explicitly documented as NOT reflecting whether a student's profile has
      actually been shared with the site, a real blind spot for any program
      relying on the report rather than the dashboard; and CODA's due-process
      case trail has a confirmed primitive (Interventions, with Open/Closed
      status and structured Follow-Ups) but no confirmation it captures formal
      due-process-specific fields, and no dedicated Interventions report
      exists.
    accreditation_link: >
      ACPE Standard 7, Key Element 7.3.d (APPE-ready gate: evidence students
      are APPE-ready *before* entering APPEs, Practice-ready and Team-ready at
      graduation) — Configure, now with a confirmed aggregation mechanism
      (pooled per-domain competency mean, configurable threshold) underneath
      it, though standardized assessment behind the gate still depends on Exam
      Management (Q2 2027, not shipped). COCA Standard 5, Element 5.4
      (supervision policy distribution and acknowledgment by students and
      faculty) — the student-side acknowledgment mechanism is now confirmed
      shipped (Attestations: checkbox-based, signed audit trail); the
      faculty-side half runs through the parallel Faculty Compliance module and
      was not independently verified at element level. COCA Standard 6, Element
      6.10 (per-student completion checklist that must be satisfiable *before*
      fourth-year clerkships begin) — Configure, now directly traced to a real
      screen, the Placement Clearance Dashboard, rather than an inferred fit.
      CODA Standard 2, Element 2-2 (individual evaluation and documented due
      process when a student fails to meet published
      didactic/behavioral/clinical criteria) — Configure, with the open
      question narrowed: a case-management primitive (Interventions) is
      confirmed to exist, but whether it captures formal due-process-specific
      fields, and the absence of a dedicated Interventions report, remain open
      (see
      rotation-lifecycle--03-student-readiness-compliance-clearance-pre-rotation.yaml
      for both).
    competitor_comparison: >
      Prism's clearest competitive advantage in the whole journey, and
      element-level tracing
      (rotation-lifecycle--03-student-readiness-compliance-clearance-pre-rotation.yaml)
      did not surface anything to soften it. Elentra has no dedicated
      compliance feature page — compliance appears only as marketing-copy
      language (elentra.com) — and elentra.yaml names this as "a concrete,
      verifiable wedge in DO-program sales conversations where
      clinical-placement compliance gating is high-stakes." one45's only
      compliance-adjacent public feature is duty-hours/leave tracking inside
      scheduling (acuityinsights.com/products/one45/program-scheduling).
      Leo/DaVinci is rated "behind" outright. axiUm's "compliance" is
      HIPAA/FERPA/role-based access and audit trails, i.e. data governance, not
      placement gating. Only eMedley (Student Documents: MMR, Hepatitis, flu,
      PPD, Varicella, BLS/CPR/HIPAA, licenses), New Innovations (Credentialling
      Module) and CORE ELMS clearly match — and even eMedley's public pages
      still do not state that its items actually *gate* placement start, which
      is the specific behavior Prism's Placement Clearance Dashboard was just
      confirmed to perform at element level; New Innovations and CORE ELMS
      remain too thin in their public documentation to compare at screen/field
      level at all, so parity there is a category-level judgment, not an
      element-level one. Lead with this stage against Elentra, one45 and Leo;
      expect parity against eMedley, New Innovations and CORE.
    domain_variance: >
      Largely common across all four domains at the documentary layer
      (immunizations, background check, BLS/CPR, HIPAA, drug screen) — this is
      the most transferable stage in the journey. It diverges on the *academic*
      gate: Pharmacy has a formal, standards-named APPE-readiness gate (ACPE
      7.3.d), now confirmed to sit on a real, shipped scoring engine (pooled
      per-domain competency aggregation with a configurable threshold) rather
      than just a named standard with no mechanism behind it, and it carries a
      hard before/after boundary between the Pre-APPE curriculum and the
      capstone year; Medicine and DO gate on board-exam milestones sitting
      inside the pathway (USMLE Step 1/Step 2 CK; COMLEX-USA Level 1/2), which
      are external data Prism cannot ingest until Exam Management ships;
      Dentistry gates continuously rather than once — progression is quota- and
      competency-based, so "clearance" is a rolling state, not a one-time
      pre-rotation event.
    discipline_variance: >
      At the documentary layer the eight existing disciplines look like the four-domain
      baseline — immunizations, background check, BLS/CPR, HIPAA, drug screen — but three of
      them have readiness gates that are structurally NOT document gates, and that is the
      finding this stage turns on. PT/PTA is the sharpest case and it belongs to an existing
      customer base rather than an expansion domain: CAPTE Standard 4, Element 4O defines
      readiness as a competency-and-safety verdict — a defined skill set with per-skill
      pass/fail, a severity flag distinguishing critical-safety skills from ordinary ones, and
      a hard block on progression until it clears. Placement Clearance evaluates compliance
      documents, contracts and preceptor credentials; competency-framework results are not one
      of its inputs. So "All Docs Approved" on the Compliance Status column is not the
      readiness verdict 4O asks for, the nearest analogue (the Student Proficiency Distribution
      chart and its configurable pass threshold, default 70%) lives on a different screen, and
      nothing joins the two. Three of 4O's four asks are already met — per-student threshold
      classification, a remediation record in Interventions, and publication to students — and
      the two that are not are the hard block and critical-safety severity, which has no
      representation at all. capte.yaml notes the closest precedent anywhere in the corpus is
      COA's asterisk convention for critical standards, which is an accreditor's content
      convention Prism reflects, not a product primitive. Worth carrying the dependency it
      flags too: scoring a didactic course from final grades requires grading schemes enabled
      first, and the Grading Scheme module is explicitly record-keeping only and does not
      calculate grades.
      CRNA owns the single highest-consequence finding in the stage, and it is a
      configuration hazard rather than a missing feature. COA C.5 requires proof every student
      holds ACLS and PALS certification BEFORE beginning clinical activities, and D.12 —
      critical-flagged — requires the graduate to still hold both, so this is the only
      per-student requirement in twelve disciplines that must be valid at two separate
      checkpoints and has no legitimate exemption path. Prism ships a four-code exemption
      taxonomy layered on top of Approved (Approved with Declination / Exception / Medical
      Exemption / Religious Exemption), which is correct and valuable for the immunization
      mandates that dominate PT/OT/PA/SLP/Nursing/SW compliance and would silently satisfy a
      clinical-safety precondition if applied to ACLS: the student reads fully clear on the
      composite rollup while holding no valid card. Nothing in the sources confirms the
      taxonomy can be disabled per item type, and capability-map.yaml describes it as a status
      property of an approval generally rather than a per-requirement configuration — verify
      before a CRNA program configures ACLS/PALS. The same hazard exists for Teacher Education
      under a different regulator, where a state fingerprint clearance is likewise
      non-exemptible. Two more CRNA specifics: re-validation has to happen at each new
      placement rather than once at admission, because a two-year ACLS card lapsing between
      rotation 3 and rotation 4 is caught only if the expiry model and the 6-8-week monitoring
      cadence are both configured; and Nursing/CRNA are the only disciplines where the STUDENT
      already holds a professional licence that must itself be verified pre-clinically —
      everywhere else in this corpus the Memberships & Licensure category is a preceptor-side
      concern, and the licence is the outcome of the program rather than a prerequisite to it.
      Note the honest source position: the ACLS/PALS requirement is documented in the Nursing
      playbook, and the three CRNA video transcripts contain no ACLS, PALS, background-check,
      immunization or readiness-gate narration at all; the pre-clinical RN/APRN licensure item
      has no verified element_id in nursing.yaml or coa.yaml and should not be cited to a COA
      element until one is confirmed.
      OT/OTA is the only discipline in the corpus with a written, enumerable starter taxonomy —
      COVID test and vaccination, flu, HepA, HepB, TB, CPR, physical exam and CBC under Health
      & Immunization; background check and drug screening under Verification/Identity; health
      and professional liability insurance under Insurance & Liability — and the asymmetry is
      the point, because no ACOTE element imposes a student health requirement at all. For OT
      the taxonomy is institutional and site-driven; for PT it is the accreditor's own
      enumerated disclosure set, since CAPTE 5B names required health information, drug
      testing, criminal background checks and insurance as things the program must tell
      students. This is also the one place in the stage where competitor teardowns are granular
      enough for an item-for-item comparison and it is not favourable: CORE ELMS publicly names
      the identical list with automated expiration reminders, eMedley enumerates MMR /
      hepatitis / flu / PPD / varicella / BLS / CPR / HIPAA / licenses, and New Innovations
      claims licenses, certifications, visas and immunizations with expiration alerts. At the
      level of WHICH ITEMS ARE TRACKED this is commoditized; the differentiation is entirely in
      the gating behaviour, which none of the three states publicly. Note the PT playbook's own
      onboarding instruction — "ask the school where they are tracking compliance if they don't
      track it on Prism" — meaning even for PT, Prism is not assumed to be the system of record.
      Social Work is rated Transfer on CSWE AS 3.3.5 and is the only discipline with named
      third-party integrations behind the gate: Universal Background Screening and Cisive for
      fingerprint checks and drug screens, ComplianceJunction for HIPAA training, with School
      Pay versus Student Pay set per institution. This is a structurally different requirement
      type from everything else in the stage — the student never produces a document, they
      initiate an off-platform transaction and the requirement is satisfied by a status sync —
      and no competitor file describes initiating a vendor transaction from inside the platform.
      Three operational details matter: drug screening can only be ordered once the background
      check reaches In Process, so a serialized dependency sits on top of vendor lead time and
      the documented 6-8-week monitoring window can already be too late for a student who has
      not started; Cisive's status taxonomy includes "Complete – Under MRO Review," a state
      literally beginning with "Complete" that still has an open Medical Review Officer chain
      behind it, and no source confirms how it maps into the three-state Requirement Upload
      Status column; and the ComplianceJunction account binds permanently to the student's
      university email with no documented remediation path if it is set up under the wrong
      address. But SW's own playbook also records the sharpest finding against its rating: as
      COMMON PRACTICE, SW programs collect vaccination records, accommodations and
      background-check details in Additional Profile Details — a customizable profile section
      used "in place of a traditional field application form" — and data captured there has no
      status model, no expiry, no review routing and no exemption taxonomy, does not reach the
      Placement Clearance gate at all, and is not governed by the Included-in-Profile-Link
      privacy control that covers compliance items. A student can read All Docs Approved while
      their background-check detail sits unreviewed in a profile field. That workaround exists
      because SW has no first-class field-application intake, and its cost is the readiness gate
      itself. SW is also the only discipline where an attestation gates something other than
      the compliance rollup — consent-to-share must clear before a student can approach an
      agency or before field-education activities unlock — which follows directly from SW's
      student-initiated placement model, where the student rather than the school contacts
      agencies and therefore is the one exposing their own health and background-check records.
      Teacher Education is a requirements-modelling problem rather than an accreditation-mapping
      one, and this is the stage where that shows. Per caep.yaml, no component of the 2022
      Initial-Licensure standards imposes a background-check requirement on candidates, yet
      state fingerprint-based criminal-history checks and district clearances are absolute
      placement blockers — so for TE the compliance burden is state- and district-driven while
      the evidence burden is accreditor-driven, and requirement SETS have to be modelled per
      state and per partner district rather than once per program. The Setup tab scopes
      configuration to a COHORT and the closest shipped scoping mechanism is per-SETTING Program
      Requirements, so a TE program placing candidates across twenty districts with twenty
      different clearance packets has no documented modelling path. The partial recovery is
      real and under-claimed: per-LOCATION Site/Location Requirements are supported, evaluated
      per placement, approvable directly from the dashboard and bulk-downloadable — no
      competitor file describes a site-specific document set evaluated per placement at all,
      and PT and OT practitioners treat "did the student upload the site's own documents" as a
      separate check from "is the student compliant." Universal Background Screening is
      specifically named as the FINGERPRINT vendor, so the mechanism TE needs already exists;
      nothing in the corpus confirms it is offered to TE programs, and the TE playbook's own
      compliance section is explicitly unpopulated, making this an evidence gap on top of a
      product gap. CAEP also asks for two record types Interventions cannot carry: a candidate
      complaint register including complaints made to CAEP itself — an externally-originated
      record with a regulator in the loop, which caep.yaml says explicitly should be scoped as
      its own object rather than stretched onto Interventions — and three cycles of remediation
      data disaggregated by race/ethnicity, which is not extractable because the only
      intervention-follow-up surface is the site-oriented Sites/Locations Dashboard on a
      24-hour refresh.
      That Interventions overload is the cross-disciplinary finding of the stage: three
      accreditors want three different things from one record type. CODA 2-2 wants a
      due-process case; CSWE AS 3.3.5 wants student SAFETY PROTOCOLS — safety in a field
      agency, incident escalation, lone-visit protocols — which is a forward-looking protocol
      definition plus its escalation trail, not a case; CAEP R3.2 wants the complaint register
      above. Meanwhile OT's ACOTE A.3.5 and SLP's CAA 4.6 want the NEUTRAL sibling, the
      Communications record, as proof that routine advising happened on a regular basis
      including specifically on fieldwork preparation — and the SW playbook is the one source
      in the corpus that says outright that Interventions captures "concerns/support activity,
      NOT NECESSARILY DISCIPLINARY," which cuts against the CODA 2-2 reading the four-domain
      analysis is built on. Stretching one record type across all four is how it ends up
      proving none of them. There is also an unresolved contradiction to flag before it reaches
      a customer: acote.yaml and coda.yaml both record that no dedicated Interventions report
      exists (open follow-ups surface only via the Sites/Locations Dashboard or an Ask Leo
      query), while the OT playbook confirms a "Communication and Intervention Report" does.
      SLP's story here is verified from the accreditor side and unverified from the product
      side, and the distinction matters: CAA 3.8B's universal-precautions/infection-control
      training gate and CAA 3.10B's academic-and-clinical-integrity attestation are both clean
      fits for shipped mechanisms (the two-tier attestation model — profile-level at Students >
      Set-up > Attestations, course-level at Courses > Course Offering > Attestation > Set-up,
      each retained timestamped in Profile > Academics), but the SLP playbook contains no
      compliance section at all and states its own thin coverage is a documentation gap rather
      than necessarily a product gap. Two SLP-specific caveats worth keeping: HIPAA sits inside
      SLP's COMPETENCY framework (CAA 3.1B) rather than as a pre-rotation document item — a
      genuinely different placement of the same requirement — and 3.10B is a two-part standard
      whose second half (a structured, retrievable log of conduct violations) lands on the same
      un-reportable Interventions object, so an SLP program can prove distribution cleanly and
      cannot prove consistent enforcement cleanly. Separately, CAA 4.7/4.8 makes readiness a
      two-audience concept for SLP — readiness to enter a placement, and documented progress
      toward the CCC-SLP credential that the program must make available TO the student. The
      student-facing half ships (the Clinical Clock Hours Report by Student is explicitly
      student-accessible and PDF-exportable); what does not is a single per-student credentialing
      dossier combining coursework, hours and competency sign-off, and nothing confirms a
      graduate or non-completing attendee retains access to their own record — which is exactly
      when they need the hours verification.
      Two shipped mechanics deserve naming because they are easy to under-claim and they serve
      every discipline. Reset-as-versioning archives the superseded document rather than
      overwriting it, which is the load-bearing mechanic for every annually or biennially
      renewed item — the annual TB test, the seasonal flu documentation OT runs as a standing
      announcement, the two-year ACLS cycle — and it is precisely what COA's two-checkpoint
      C.5/D.12 pairing needs to evidence continuous currency across a renewal; no competitor
      source describes what happens to a superseded document at all. And the delegator merge
      field @StudentProfileWithComplianceAndLocationRequirementsLink gives a site a no-login
      view of a student's clearance state with optional OTP protection that sends a code to the
      recipient's own school email, so a forwarded link is inert. That is the direct structural
      answer to the model myClinicalExchange, Clinician Nexus, ACEMAPP and CastleBranch Bridges
      are built on — sites wanting to verify clearance themselves, solved by making the student
      register and pay an account with the vendor — and those four are named by the PT playbook
      as direct competitors that "will not integrate with us," with no teardown file anywhere in
      this repo. That is the single largest competitor-research gap for this stage, and it is
      compounded by the OTP being support-configured rather than self-serve, which matters most
      for Social Work, whose sharing is student-initiated and whose compliance set includes
      background checks and drug screens.
      Finally, two defects in the gate itself rather than in its inputs, both from OT. The
      Contract Status column carries permanent known-false Needs Attention rows because there is
      no way to mark a site as "contract not required," which bites OT hardest since Level I
      fieldwork routinely uses observation and service-learning settings — and OT cannot simply
      ignore the column either, because ACOTE C.1.5 requires written agreements for Level I and
      Level II alike. Its mirror image sits on the preceptor side: the Fieldwork Educator
      Details Form collects years of experience, degrees, certifications, licensure and CV from
      the educator and does NOT sync to the Personnel record, so the Missing/Exists/NA tracker
      reads Missing until someone re-keys data the program already holds, and a placement can be
      blocked by a transcription backlog rather than by an actual credential problem. SW runs the
      same intake pattern without its playbook stating whether it syncs, so do not assume
      symmetry. And the presence-versus-substance limit on that tracker is now three disciplines
      deep: ARC-PA 6e added "unrestricted and unencumbered" to A2.14, which turns a
      document-presence check into a document-STATUS check with no field for board action,
      probation or restriction; CSWE audits whether a degree is from a CSWE-accredited program
      and whether two years post-degree have elapsed, neither of which is a structured attribute;
      and COA F.5 requires institutional credentialing at the site, so an Exists is necessary but
      not sufficient for a CRNA placement to be genuinely clear. Separately, the Placement
      Clearance REPORT (as distinct from the live Dashboard) explicitly does not indicate whether
      a student's profile has actually been shared with the site — a program relying on the
      export can believe a placement is clear when the receiving site has never seen the
      student's compliance profile.
