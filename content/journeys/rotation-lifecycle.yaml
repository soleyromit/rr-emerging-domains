    key_findings:
      - subject: "Medicine"
        headline: "LCME 9.7 maps one-to-one onto the anchor primitive no competitor documents"
        severity: "none"
        detail: >-
          lcme.yaml rates 9.7 Transfer: a midpoint-feedback trigger is exactly what the
          anchor-relative scheduling primitive was built for. What nobody reports is
          midpoint-delivery COMPLIANCE — the on-time percentage 9.7 asks a program to prove.
      - subject: "OT/OTA"
        headline: "OT's low-score alert is recommended off during exactly the midterm window"
        severity: "gap"
        detail: >-
          The published low-score defaults (111 for OT, 91 for OTA) apply to BOTH midterm and final,
          so Exxat's own best practice holds the threshold off until all midterms are reviewed — the
          alert is recommended-off during the window this stage serves.
      - subject: "PT/PTA"
        headline: "The struggling student is the one who must dispatch the CIET that flags them"
        severity: "gap"
        detail: >-
          The CI cannot receive the midterm CIET until the student selects them and clicks Send,
          with no documented admin-side override — so the struggling student this stage exists to
          catch is the least likely to send it. OT pushes the FWPE admin-side.
      - subject: "PA"
        headline: "PA's own playbook lists the mid-point evaluation as optional practice"
        severity: "gap"
        detail: >-
          Optional practice, not merely optional configuration — the sharpest line-level risk in
          this stage against ARC-PA B4.01's "timely" test. PA is otherwise the strongest early-risk
          story, with both performance and exposure-minimum triggers.
      - subject: "CRNA"
        headline: "For the highest formative volume in the product, early-risk detection is reading PDFs"
        severity: "gap"
        detail: >-
          A per-clinical-day evaluation generates thousands of forms per cohort, and no source
          confirms a threshold or notification is configurable against a daily instrument. The Daily
          Clinical Forms Report shows student and preceptor answers side by side but computes
          nothing.
      - subject: "SLP"
        headline: "Both SLP trigger mechanisms are support-gated, alongside new custom forms"
        severity: "gap"
        detail: >-
          caa-asha.yaml calls this the clearest SLP-specific self-service gap in the file: min/max
          hour thresholds and question-based early alerts both need a ticket, and the response-based
          trigger additionally needs the Account Manager and Configuration team.
      - subject: "Nursing"
        headline: "Activity Insights bands green, amber and red — and notifies nobody on crossing"
        severity: "gap"
        detail: >-
          Per-category completion is banded against minimums, visible to students as well as admins,
          and fires on ACCUMULATION SHORTFALL rather than an evaluation result. But it is a PULL
          surface: nothing confirms that crossing a band notifies anyone.
      - subject: "Dentistry"
        headline: "There is no rotation midpoint to anchor to in a dental teaching clinic"
        severity: "gap"
        detail: >-
          Core clinical formative feedback is continuous and per-procedure, with faculty sign-off at
          each step, so the anchor primitive has to be re-expressed as a threshold on quota progress
          rather than a date offset — the CODA 2-9 pacing shape. CODA 2-2's due-process decision
          trail still has no case-management object behind the alert that would open it.

  - stage: "7. Summative evaluation, grading turnaround & completion verification"
    current_state_in_prism: >
      Split state, though less split than previously framed once traced screen
      by screen. Central oversight of rotation completion is rated **Transfer**
      and called "the strongest fit of any standard" in lcme.yaml — the
      placement engine exists precisely to give a program-wide (not per-site,
      not per-department) view of every student's required-rotation status, and
      this is now traceable to a named screen: the Program Requirements report
      under Students > Reports, which auto-updates per student off placement
      publish/completion and rolls the whole cohort into one filterable grid
      (rotation-lifecycle--07-summative-evaluation-grading-turnaround-completion-verification.yaml).
      The grade-due deadline can be anchored off each placement's end date via
      the score-contributing form's Due Date field, and automatic reminders as
      that deadline approaches are confirmed shipped (Auto Notifications) —
      though only to the student or experiential supervisor completing the
      form, not to faculty or coordinators directly, so SLA-compliance
      reporting on grading turnaround for program leadership is still not a
      confirmed, purpose-built feature, even though the raw
      Due-Date/Submitted-Date/Grade fields it would need already exist in
      Custom Reports. Program-objective-level competency rollup across all
      assessment types, previously flagged unconfirmed, is now confirmed
      shipped: Competency Management maps program-defined competencies to
      didactic course grades, experiential assessment scores, or both in one
      framework, aggregated per student across the whole curriculum —
      lcme.yaml's own LCME 9.4 gap_note predates this evidence and is out of
      date on this specific point. The *student's* evaluation of the clerkship,
      preceptor and site is also not, as previously framed, wholly blocked on
      an unshipped Surveys & Course Evaluations pillar: the same
      Forms/Evaluations engine already ships a validated,
      student-completes/site-reviews/school-reviews workflow in production
      today (PTSE 1/2), and a separate general-purpose Exxat Surveys module is
      shipped and already extended to PT and SLP. The Surveys & Course
      Evaluations pillar itself has also shipped (CORRECTED 2026-08-26 per
      Exxat PM confirmation, see ../prism/capability-map.yaml, Surveys &
      Course Evaluations pillar) — none of the three has a confirmed
      equivalent instrument built yet for DO, Pharmacy, Dentistry or Medicine.
    pain_or_gap: >
      The one-directional evaluation problem is less absolute than it first
      looked, but its harder half survives. Prism does ship a mechanism for the
      student to assess the rotation — PTSE 1/2 run the exact
      Student-Completes/Site-Reviews/School-Reviews workflow three of the four
      accreditors want, and a second, general-purpose Exxat Surveys module
      offers the same pattern outside the placement engine — but both are
      proven only for PT (and, for Surveys, SLP as of December 2025); nothing
      in the sourced material confirms an equivalent instrument for DO,
      Pharmacy, Dentistry, or Medicine, so those four programs sit where PT was
      before PTSE 1/2 existed — waiting on unbuilt discipline-specific forms,
      not on a missing platform capability. What stays a confirmed, harder gap
      regardless of which mechanism gets used: no evidence anywhere links
      evaluation results to a logged, auditable curricular-change record, which
      is the specific evidence LCME 8.5 and COCA 11.2 ask for beyond just
      collecting responses — that closes-the-loop piece has no shipped or
      roadmapped answer. Until a discipline-specific instrument exists,
      programs still likely need a parallel external survey tool and must
      manually reconcile it, which breaks the system-of-record claim at exactly
      the moment the evidence is being assembled. Separately, grade turnaround
      is a *deadline with a number attached* (six weeks) that leadership must
      be able to report on, not just be reminded of — automatic reminders as
      that deadline approaches are now confirmed shipped, but they reach the
      student or supervisor completing the form, not the coordinator who needs
      the compliance number, so the reporting half of that gap still stands.
    accreditation_link: >
      LCME Standard 8, Element 8.6 (centrally-overseen system monitoring that
      every student completes all required clinical experiences, remedying gaps
      before graduation) — **Transfer**, the strongest fit in lcme.yaml, now
      traceable to a named screen: the Program Requirements report under
      Students > Reports, auto-updating per student off placement completion.
      LCME Standard 9, Element 9.8 (fair and timely summative assessment; final
      grades within six weeks) — Configure; the grade-due deadline anchors off
      each placement's end date, and automatic deadline-approach reminders are
      confirmed shipped (Auto Notifications) — but only to the student or
      experiential supervisor completing the grade-bearing form, not
      faculty/coordinators, so turnaround-time SLA reporting for program
      leadership remains unconfirmed as a purpose-built feature even though its
      underlying Due-Date/Submitted-Date fields exist in Custom Reports. LCME
      Standard 9, Element 9.4 (centralized assessment system using varied
      measures including direct observation, all students held to the same
      objectives) — Configure, no longer hedged on the rollup itself:
      Competency Management is confirmed shipped, mapping program-defined
      competencies to didactic course grades, experiential assessment scores,
      or both, aggregated per student across the curriculum; only
      standardized-exam-instrument delivery into that same framework still
      depends on Exam Management, Q2 2027. ACPE Standard 3, Key Element 3.2.d
      (block or flag graduation clearance for any student missing a required
      setting category) — Configure, concretely: the same Program Requirements
      mechanism above already tracks "completing placements across specific
      settings" as a named requirement category, so ACPE's four-setting
      taxonomy is configuration on a proven mechanism, not new capability;
      whether it can hard-block clearance rather than just flag Pending is
      still unconfirmed. COCA Standard 11, Element 11.2 and LCME Standard 8,
      Element 8.5 (confidential student evaluations of courses, clerkships and
      faculty; a flowchart from evaluation data to curricular improvement) —
      still rated **Gap**, but for a narrower reason than "blocked on an
      unshipped Surveys & Course Evaluations pillar" (that pillar has itself
      shipped too — CORRECTED 2026-08-26 per Exxat PM confirmation, see
      ../prism/capability-map.yaml): the collection mechanism itself is proven
      in production via multiple shipped systems (PTSE 1/2, the
      general-purpose Exxat Surveys module, and the Surveys & Course
      Evaluations pillar), just not yet instantiated for the
      four new domains — and no mechanism anywhere links evaluation results
      back to a logged curricular-change record, which is the piece with no
      shipped or roadmapped answer. ACPE Standard 7, Key Element 7.5.a (CQI
      cycle using AACP standardized surveys) — Gap, same two-part reasoning;
      Exxat Surveys' Standard Survey library already accepts client-built
      validated instruments from outside Exxat, the exact mechanism a
      Pharmacy-specific AACP-style instrument would need, but no such
      instrument is confirmed to exist yet, so programs still need an external
      tool (AACP AAMS/PHARMS surveys) alongside Prism for now. CODA Standard 2,
      Element 2-5 (competency-linked assessment instruments measuring skills,
      behaviors and attitudes, not recall) — unchanged at Configure, with
      exam-grade delivery (e.g. proctored OSCE) overlapping Exam Management, Q2
      2027.
    competitor_comparison: >
      Surveys/course evaluations ship *today* at Elentra, one45, eMedley
      (eValuate+), Leo, MedHub/E*Value and CORE ELMS. This section previously
      rated all six "ahead" on that pillar for the single reason that Prism's
      was framed as a Q1 2027 roadmap item — that framing was wrong: Prism's
      Surveys & Course Evaluations pillar has shipped (CORRECTED 2026-08-26
      per Exxat PM confirmation, see ../prism/capability-map.yaml), alongside
      the Forms/Evaluations engine and Exxat Surveys module that already ship
      the same student-evaluates-site/instructor pattern these competitors are
      credited with. Element-level tracing still narrows the remaining gap to
      a build-out issue, not a from-zero platform gap: none of Prism's three
      mechanisms has a confirmed equivalent instrument instantiated yet for
      the four new domains, and depth against these named competitors'
      shipped instruments has not been re-verified since the correction — so
      "ahead" is no longer the accurate read, but neither is "Prism wins." eMedley additionally ships ExamN
      (question banks, lockdown browser, eProctor webcam proctoring,
      item-analysis psychometrics) and Leo ships point-biserial item analysis,
      against Prism's Q2 2027 Exam Management target. one45 carries a named,
      verifiable proof point on the evaluation side: Augusta University's
      Medical College of Georgia received full eight-year LCME accreditation
      with its One45-powered evaluation system "noted to be a strength of our
      program" — but one45's public product page is marketing-level copy, not
      granular enough to compare screen-for-screen against Prism's named PTSE
      1/2 workflow. Prism's defensible ground at this stage is the
      completion-verification half — the central, program-wide rollup of
      required-experience completion with gap flags (LCME 8.6), now traceable
      to the Program Requirements report and its per-requirement
      Pending/Placed-for/Completed status, plus graduation-clearance gating
      against required categories (ACPE 3.2.d) — where the placement engine is
      genuinely purpose-built, rather than the evaluation-instrument half where
      six competitors are shipping and Prism's build-out for the new domains
      has not yet happened.
    domain_variance: >
      Unchanged — no hedge words ("unconfirmed," "likely," "pending
      confirmation") appear in the existing domain_variance paragraph, so there
      was nothing for the newly-available element-level source material to
      resolve. It reads: Medicine — the six-week grading SLA is an explicit,
      numeric LCME requirement, and grades feed the MSPE, which must land on
      the AAMC/ERAS residency-application timeline (LCME 11.4), making
      turnaround a downstream-blocking dependency rather than an internal
      courtesy. DO — same clerkship-grade structure, plus COMLEX-USA Level 2
      sitting inside the window and the per-student COCA 6.10 checklist that
      must be satisfied before fourth-year clerkships. Pharmacy — completion
      verification is category arithmetic, not narrative: all four required
      settings plus the 1,440/160-hour minimums, with a non-standard "assessed
      equivalent" record type needed for NTPD-pathway students. Dentistry —
      completion is quota- and competency-exam-based rather than
      rotation-based, and CODA 2-2's due-process trail carries more weight
      because failing a clinical competency exam has an individual adjudication
      attached; there is also a second, external clinical licensure exam layer
      (ADEX/CDCA-WREB, increasingly manikin-based CompeDont post-2020) that no
      other domain has and that programs must schedule and track separately.
    discipline_variance: >
      The four-domain reading of this stage assumes the grade-bearing event is a Forms/Evaluations
      submission and that the student-evaluates-the-site direction is essentially unbuilt. Both
      assumptions break once the eight existing disciplines are in scope. For CRNA, Nursing, PA
      and SLP the grading clock can also be stopped by a weighted PATIENT or CCE LOG reaching
      approval — the log setup drawer carries its own Grading block (contribute yes/no, maximum
      score, weightage, grading type, and which school-level scheme to score against) — and for
      Teacher Education a third path runs through an external LTI tool whose score syncs back
      into the Gradebook from GoReact. Each binding is configured separately and nothing infers
      it. And PT ships four validated student-authored instruments in production: PTSE 1 (student
      evaluates the SITE, Student > Site Reviews > School Admin Reviews, publishable as a
      Location Evaluation students see in Explore Locations), PTSE 2 (student evaluates the CI,
      Student > School Admin Reviews, publishing to a school-only Location Evaluation), the SECEE
      (PTAMACS-only, final-term only, and the ONE confirmed case anywhere in the stage of an
      external evaluator COUNTER-SIGNING a student-authored summative document), and the
      Duke-developed Standard PT/PTA Surveys, which point the other way entirely — non-customizable,
      externally validated, distributed by School Admin to SCCEs and CIs so the SITE evaluates the
      PROGRAM. That completes a four-way evaluation loop no other discipline has shipped
      instruments for, and it means the journey's "one-directional evaluation problem" framing is
      overstated as an absolute: the engine is proven in production, and an equivalent for DO,
      Pharmacy, Dentistry or Medicine is a Configure-level build rather than a platform gap
      waiting on an unshipped Surveys roadmap item — Surveys & Course Evaluations has itself
      since shipped too (CORRECTED 2026-08-26 per Exxat PM confirmation, see
      ../prism/capability-map.yaml). OT runs the structurally identical pattern with
      SEFWE I (routes to the Fieldwork Educator for review and signature first — status Pending
      Educator Review — before the school) and SEFWE II (straight to school review), both
      publishing into Location Evaluations and the student-side Explore Clinical Locations &
      Wishlist, which makes this the clearest case of a stage-7 output feeding back into stage-1
      site selection.
      Instrument depth is the real two-tier split. PT and OT ship pre-built, non-editable Standard
      forms — CIET v2.0, PTMACS/PTAMACS, SCIPAI, the PTSE pair for PT; the five-form AOTA FWPE
      family for OT — where Nursing, SLP, Social Work and Teacher Education have NO shipped
      national instrument at all and every form is configured, with new-form creation gated behind
      a prism-support@exxat.com ticket. caa-asha.yaml rates CAA 5.2 "Configure-with-services-attach"
      for SLP for exactly that reason, where it would be closer to Transfer for PT/OT. The
      competitive shape of this is worth naming precisely: CORE ELMS and E*Value both sell
      customizable form BUILDERS into these same disciplines and are rated ahead on the pillar,
      but no competitor file names a single validated clinical instrument it ships — so Prism's
      advantage here is the instrument inventory, not the engine, and the same argument that makes
      the AOTA FWPE the strongest comparability surface makes the Duke survey's non-customizability
      the point rather than the limitation (a customized stakeholder survey would not carry the
      validation).
      Three mechanics in the PT/OT instruments are genuinely differentiated and reusable. CIET
      v2.0's parallel completion with mutual blinding — student and CI fill the same instrument
      simultaneously and neither sees the other's ratings until both submit — is the strongest
      single differentiator in the stage; capte.yaml calls 2D4 "the single best-served element in
      the whole document" and names this as the reason, and no competitor claims blinding,
      anchoring-bias control, or dual-perspective concurrency at all. CIET's status ladder is a
      real turnaround mechanic rather than cosmetic text: the final-term instance does not open
      until the school has reviewed the midterm, so a school falling behind on midterm review
      structurally delays its own summative collection — and that dependency is invisible to any
      Custom Reports pivot, because the final form has no Assigned Date until the midterm clears.
      And the PTAMACS carries a named "Summative Section" and "Final Overall Rating" that exist
      only on the final pass, which is a cheaper way to satisfy an end-of-experience verdict
      requirement than building a separate terminal instrument. Two defects sit alongside them:
      the student holds a cancel control over a submitted grade-bearing form that revokes the CI's
      access (preserving their in-progress work) — an inversion of the normal authority model with
      no equivalent on FWPE, PTMACS or any configured form — and both PTMACS and PTAMACS state
      that "the system will not process any comments that are added once you pass the 10000-character
      limit," i.e. a CI writing a long narrative about an unsafe student can lose the end of it
      without being told. The cap is generous; the silence is the defect.
      Grading turnaround itself resolves differently than the four-domain hedge implies, and the
      real constraint is somewhere else entirely. The Custom Reports Forms-and-Evaluations data
      source does expose Due Date, Submitted Date, Score and Grade, so "SLA-compliance reporting
      is unconfirmed" is no longer accurate as an absolute — the data exists, a coordinator just
      assembles it, and the confirmed aggregations are Sum/Average/Earliest-Latest date rather
      than an elapsed-days calculation, with Gradebook not among the ten Custom Report data
      sources. Auto Notifications only offer two recipient types — Students and Experiential
      Supervisor — so a reminder aimed at the grading FACULTY member (LCME 9.8's exact language)
      has no confirmed path. But for six of the eight existing disciplines the summative
      instrument is completed by someone with no Prism login, which means the DELEGATOR LINK
      EXPIRY, not the form's Due Date, is what actually decides whether a late grade can still be
      entered: it lives in Program Details > Setup > School Profile > Email Setup, defaults to 365
      days, and OT guidance recommends 30-50 days for 4-week rotations so educators lose access to
      student profiles and forms once the rotation ends. PA's Preceptor Evaluation of Student is
      documented as having a SOFT due date — the preceptor can still submit after the deadline as
      long as the link is live — so any SLA measured against that form's Due Date is measuring an
      unenforced target, and the enforceable boundary is a program-level setting, not a per-form
      one. The coupling bites in both directions: a program running the OT-recommended short expiry
      can find itself unable to un-submit a late-reviewed FWPE back to its author.
      PT is the only discipline where the accreditation reads are buttons rather than assemblies,
      and that is the finding rather than the caveat: seven CAPTE Reports carry the accreditor's own
      element numbers in their titles (Average CI Teaching Effectiveness and Total Qualifications
      of CIs at 2024 4P; Involvement in Interprofessional Practice at 6F from PTSE 1 question 14;
      Patient Disease and Condition and Practice Settings at 6H from PTSE 1 questions 7 and 3;
      Number and Variety of Clinical Sites and Clinical Slots) and run by selecting a Group and
      Rotation and clicking Download. The pattern the journey treats as missing is not missing from
      the platform — it is missing from seven of eight disciplines. PA gets closest without reaching
      it: its accreditation guide maps existing reports to standards AND to Self-Study Report
      appendix numbers (SCPE Details to A1.10a-b / Appendix 11a, Comprehensive Assessment Report to
      B3.02a-c / Appendix 15, the summative competency report to B4.03a-e / Appendix 14E), but that
      is a documentation crosswalk a human follows, not a report a button produces. OT, SLP,
      Nursing, CRNA, SW and TE have neither. Elentra is the only competitor with the same
      ship-the-standard-number-as-the-report-name pattern, and its named list covers LCME, COCA,
      CACMS, ACPE, CODA and ARC-PA but NOT CAPTE, ACOTE, CAA, COA, CSWE or CAEP — so PT is
      precisely where Prism holds the pattern and Elentra does not.
      PA's summative story has the most precisely-scoped gap in the stage. ARC-PA B4.03 requires a
      verdict attributable to a named evaluator, date-stamped inside a specific four-month window
      relative to that student's OWN program end date, and assembled from more than one instrument.
      Two documented paths exist — a per-student competency report out of a program-defined
      framework in Competency Management, and a milestone summative evaluation form on a placeholder
      or final-rotation course read out via the Aggregate Report — and both ride shipped machinery,
      so B4.03 is not a build. But nothing records or validates the four-month window: as
      arc-pa.yaml puts it, "a summative evaluation completed five months out satisfies every report
      in Prism and fails B4.03." That is a date comparison between an existing Submitted Date and an
      existing per-student program end date, not new data collection, and it is the same arithmetic
      the anchor-relative due-date primitive already performs against a placement rather than a
      program. PA carries a second, real-world citation risk with no product control: Exxat's own PA
      guidance states that mid-point and end-of-rotation evaluations of the same student by the same
      preceptor should be exactly consistent, because PA programs have been cited where formative
      feedback contradicts the summative assessment — and the mitigation exists everywhere except
      PA, since CIET, PTMACS/PTAMACS and the AOTA FWPE all carry midterm responses forward into the
      final form while no equivalent carry-forward is confirmed for a PA-configured custom form.
      Extending that carry-forward to configured forms would serve Nursing and SLP identically.
      CRNA owns the cleanest completion-verification artifact across all eight: the NBCRNA Transcript
      Report auto-generates a per-student transcript of logged case counts by NBCRNA-required
      category, formatted for national certification eligibility. No competitor teardown names a
      credentialing-body-formatted export for any discipline, and it is exactly the artifact SLP
      lacks — caa-asha.yaml records that "no single artifact combines coursework, hours, and
      competency sign-off into one per-student credentialing dossier," and CRNA has precisely that.
      Alongside it, Student Activity Insights bands per-category completion green/amber/red against
      COA's case minimums, and the CRNA log layout already carries COA's own taxonomy families, so
      the work is loading the May 2025 Appendix rather than building a thresholds engine. Three
      limits carry: no cohort-conditional thresholds (COA's daggered rows bind only students
      matriculating on or after January 1 2026, so one course offering must apply two threshold sets
      by matriculation year), no actual-vs-simulated flag though COA forbids satisfying certain rows
      by simulation alone, and multi-parent "count all that apply" counting needs confirming rather
      than assuming. The Daily Clinical Forms/Evaluations Report solves a structural problem no other
      discipline has — thousands of daily evaluations per cohort over a three-year doctoral program —
      and renders student and preceptor responses side by side per question, which is CIET's
      dual-perspective insight solved at the REPORT layer rather than the collection layer, and
      therefore without CIET's blinding guarantee. It is the clearest instance in the corpus of Exxat
      building for one discipline's structural problem rather than generalising, and the direct
      precedent for extending the CAPTE Reports pattern to other accreditors. Two cautions: the
      per-student PDFs are documented as shareable directly with clinical sites, which coa.yaml flags
      as a FERPA-adjacent disclosure path that should be paired with OTP protection; and the report
      is an aggregation and export layer rather than a competency computation, so bridging daily
      formative volume to COA's Graduate Standards D.1-D.50 requires mapping the daily instrument's
      questions into Competency Management, which no source shows.
      Competency Management > Review > View Report is the single most reused element in the stage —
      four accreditors, four frameworks, one surface. CSWE names it for AS 5.0.1(b); ARC-PA reads it
      as the Competency Tracking Report for B3.03, B3.05 and the B4.03 verdict; COA configures
      Graduate Standards D.1-D.50 directly as the framework, with a custom reporting scale available
      instead of the fixed default (which is what makes fifty critical standards expressible rather
      than approximated); and CCNE/ACEN use the Cohort Performance Tracking Dashboard plus a
      row-per-student, column-per-domain Competency Tracker with drill-down to the sub-competency
      below threshold. The scoring model is 1-5 or custom, threshold configurable at a 70% default,
      and parent-level scores are a POOLED MEAN across all child competencies' mapped questions
      rather than an average of averages — not a footnote, because CSWE AS 5.0.1(a)(v) requires the
      program to explain HOW achievement is calculated, so the pooled mean is the answer to a
      compliance statement. Two configuration constraints carry across all four: questions map at
      the CHILD-MOST standard level only, so a framework configured without lettered children has
      nowhere to attach questions; and Grading Scheme must be enabled first if the framework draws
      on final course grades. The segmentation limit is the sharpest trap: CSWE AS 5.0.1(b) wants
      outcomes broken out per program option AND in aggregate, ACEN 5.1 wants aggregate data
      disaggregated with written justification wherever it is not, and CAEP R3.3 wants disaggregation
      by preparation program and race/ethnicity — while a confirmed one-grid-per-report limit means a
      program that set up separate grids per option cannot produce the aggregate view. cswe.yaml puts
      it exactly: "a configuration decision made months before anyone reads AS 5.0.1(b)." The genuine
      offsetting advantage from nursing.yaml is that because assessment-to-competency mapping happens
      once and calculates automatically thereafter, disaggregation by track or cohort is a FILTER
      rather than a rebuild, which is what ACEN 5.1(c) asks for and what spreadsheet programs cannot do.
      Social Work's summative instrument and its goal-setting document are the SAME object — the
      Learning Contract — which makes an implementation-time configuration choice decisive:
      combined Learning Contract plus Evaluation in one form, separate forms, or a four-way split
      (mid-term, final, Field Instructor rating, student rating, completed independently). CSWE AS
      5.0.1(a) requires at least TWO instruments assessing each of the nine competencies with at
      least one field-based, so the four-way split is how a program produces two separable
      field-based instruments from one placement — and the combined model is explicitly paired with
      the combined-course container option, so the form model and the course model are one decision
      made twice. cswe.yaml rates 5.0.1(a) Transfer, its strongest fit, with the caution that the
      nine competencies must be configured with behavior-level children before field season. Two SW
      specifics: the Comprehensive Report for Placement Based Form is named by Exxat's own CSWE guide
      as the export used to produce de-identified sample Learning Agreements for self-study
      submission (one of the few instances outside PT of a report tied to a standard by name rather
      than inference, with manual de-identification), and the Hours by Category report AUTOMATICALLY
      deducts break and time-off hours in line with CSWE's rule that they do not count toward the
      400 BSW / 900 MSW minimum — a genuinely accreditor-aware behaviour rather than a generic
      timesheet. What is NOT confirmed is whether the summative field EVALUATION can be routed
      specifically to the degree-qualified Field Instructor while excluding an on-site Task
      Supervisor, which is precisely the distinction CSWE B3.3.6/M3.3.6 exists to enforce; the
      student's choice of reviewer is confirmed for HOURS only.
      Teacher Education is architecturally different from every other summative instrument here, and
      the difference is where the evidence lives. For CIET, FWPE, PTMACS, SEFWE and every configured
      nursing/SLP/SW form the responses themselves sit in Prism and export via Raw Data, Aggregate or
      Comprehensive reports; for TE only the SCORE and STATUS cross back, while the timestamped
      comments and the rubric evidence stay in GoReact. That is what LTI is rather than a defect, but
      it makes TE's Prism-side record thinner than any other discipline's and it echoes the Formstack
      dependency risk flagged for OT, where a lapsed third-party subscription puts previously-pulled
      FWPE II data out of reach because no Exxat-side copy is retained. Two further TE findings. The
      setup sequence itself spans two products: Prism auto-creates the matching GoReact activity on
      first save (genuinely good — it removes the duplicate-setup step that makes most LTI
      integrations painful) but the sequence ends with a human switching products and marking the
      activity Done, and THAT is what makes the assignment visible to candidates — so the most likely
      TE failure mode is an assignment that looks complete in Prism and was never marked Done, with
      nothing surfacing that state. And every setting governing what the recording captures and who
      can see it is configured outside the system of record and documented in GoReact's help centre,
      so the privacy posture of TE's primary evidence artifact is not inspectable from Prism. CAEP
      R3.3 then asks for triangulation — the GoReact rubric score, the summative student-teaching
      evaluation, a dispositions instrument and an external licensure exam joined into one
      per-candidate proficiency rollup, disaggregated demographically — which caep.yaml rates Build
      and calls "the highest-value TE-specific build in the file, and also the element CAEP will not
      let an EPP fake." Note that CAEP also names the cohort 3.0 GPA as a monitored transition point
      under R3.2, and the Grading Scheme module is explicitly record-keeping only and does not
      calculate grades — so the one number CAEP asks for by name has to come from the SIS. That
      record-keeping-only limitation is the sharpest element-level competitive delta in the stage:
      CORE ELMS ships automated grade calculation and conversion today, into a discipline list that
      explicitly includes PT, OT, PA, nursing and social work, and is rated ahead on it.
      Three structural notes close the stage. First, the faculty-last architecture CCNE III-K and
      ACEN 4.10 actually turn on is already true by construction: there is no confirmed path for any
      site-side evaluator to reach the Gradebook, so a preceptor's rating arrives strictly as a
      submitted form a faculty reviewer acts on — the same structure serving CSWE AS 5.0.1(a) and
      CAPTE 2D4, and Leo/DaVinci is the one competitor documented with the same architecture
      (no-login emailed evaluation links whose results export to gradebooks). nursing.yaml's
      Configure rating on III-K is about instrument availability, not this. Second, the confirmed
      review-tier orderings run four tiers deep in places (PTMACS: student self-eval > CI evaluates >
      student reviews > school reviews; OT capstone MOU: student > site mentor > faculty > admin)
      against one45's documented "two-tier workflows," so the engine is deeper than any competitor
      claim — the delta is again the instrument inventory riding on it. Third, whether a summative
      form's results can EVER be aggregated across a cohort is decided at form-build time, not report
      time: score-based forms run through the Aggregate Report and non-scoring qualitative forms run
      through the Raw Data Report, two separate paths. Exxat's own PA guidance is to build
      Student-Evaluates-Preceptor and Student-Evaluates-Site forms as SCORE-based so site and
      preceptor performance can be quantified in aggregate while still showing qualitative labels to
      students — get it wrong and the form is permanently stuck in Raw Data, and for SLP and Nursing,
      where form creation is support-gated, correcting it is a ticket rather than an edit. Finally,
      the survey engine is not the constraint for anyone: Exxat Surveys ships persona-based in-Prism
      distribution plus email/CSV and anonymous link/QR, with 14 question types including attestation
      and e-signature, and six of eight existing disciplines already have named instruments in
      production (PT's four APTA-aligned DCE Performance Survey templates, SLP's December-2025
      Graduating Student and Clinical Supervisor Surveys, Nursing/CRNA's annual student/alumni/job
      placement/preceptor/staff set, PA's Graduate Surveys, SW's Post-Placement Surveys). OT and
      Teacher Education have none confirmed — the same shape of gap as the four expansion domains.
      Two accreditor-side limits recur regardless of template and belong to Accreditation Management:
      Prism has no alumni or employer ENTITY (graduates fall out of the student model at conferral,
      so those audiences are maintained as external CSV lists with no durable record), and no shipped
      pillar links a survey finding to the programmatic change made in response — the closed-loop CQI
      object ACOTE A.6.3, CAPTE 2C/2E, CSWE 5.0.1(c)/(d), CCNE IV-A/IV-F and ACEN 5.1(d)-(f) all
      separately require. Program Requirements is the corresponding completion-verification anchor and
      is stronger than the four-domain reading credits — per-requirement status auto-updates to
      "Placed for" on publish and "Completed" on successful finish, reverts to Pending if a placement
      is marked Unsuccessful, highest status wins across placements, and hour thresholds surface on
      the student profile (confirmed in use for Nursing's DNP 1,000 / NP 500, and the same shape
      serves PT's Rural / Underserved / School-based / ICE-Acute and OT's setting requirements). Its
      two limits are shared: nothing confirms a requirement can auto-BLOCK graduation clearance rather
      than display Pending, and thresholds cannot be scoped by degree level or conditioned on
      matriculation date — which breaks ACOTE C.1.12's 24-vs-16-week split for a tenant running OTD
      and OTA together, and COA's daggered post-January-2026 rows outright.
    discipline_notes:
      - subject: "PT/PTA"
        detail: >-
          And PT ships four validated student-authored instruments in production: PTSE 1 (student evaluates
          the SITE, Student > Site Reviews > School Admin Reviews, publishable as a Location Evaluation
          students see in Explore Locations), PTSE 2 (student evaluates the CI, Student > School Admin
          Reviews, publishing to a school-only Location Evaluation), the SECEE (PTAMACS-only, final-term
          only, and the ONE confirmed case anywhere in the stage of an external evaluator COUNTER-SIGNING a
          student-authored summative document), and the Duke-developed Standard PT/PTA Surveys, which point
          the other way entirely — non-customizable, externally validated, distributed by School Admin to
          SCCEs and CIs so the SITE evaluates the PROGRAM. That completes a four-way evaluation loop no
          other discipline has shipped instruments for, and it means the journey's "one-directional
          evaluation problem" framing is overstated as an absolute: the engine is proven in production, and
          an equivalent for DO, Pharmacy, Dentistry or Medicine is a Configure-level build rather than a
          platform gap waiting on an unshipped Surveys roadmap item — Surveys & Course Evaluations has
          itself since shipped too (CORRECTED 2026-08-26 per Exxat PM confirmation, see
          ../prism/capability-map.yaml). Three mechanics in the PT/OT instruments
          are genuinely differentiated and reusable. CIET v2.0's parallel completion with mutual blinding —
          student and CI fill the same instrument simultaneously and neither sees the other's ratings until
          both submit — is the strongest single differentiator in the stage; capte.yaml calls 2D4 "the
          single best-served element in the whole document" and names this as the reason, and no competitor
          claims blinding, anchoring-bias control, or dual-perspective concurrency at all. CIET's status
          ladder is a real turnaround mechanic rather than cosmetic text: the final-term instance does not
          open until the school has reviewed the midterm, so a school falling behind on midterm review
          structurally delays its own summative collection — and that dependency is invisible to any Custom
          Reports pivot, because the final form has no Assigned Date until the midterm clears. And the
          PTAMACS carries a named "Summative Section" and "Final Overall Rating" that exist only on the
          final pass, which is a cheaper way to satisfy an end-of-experience verdict requirement than
          building a separate terminal instrument. Two defects sit alongside them: the student holds a
          cancel control over a submitted grade-bearing form that revokes the CI's access (preserving their
          in-progress work) — an inversion of the normal authority model with no equivalent on FWPE, PTMACS
          or any configured form — and both PTMACS and PTAMACS state that "the system will not process any
          comments that are added once you pass the 10000-character limit," i.e. a CI writing a long
          narrative about an unsafe student can lose the end of it without being told. The cap is generous;
          the silence is the defect. PT is the only discipline where the accreditation reads are buttons
          rather than assemblies, and that is the finding rather than the caveat: seven CAPTE Reports carry
          the accreditor's own element numbers in their titles (Average CI Teaching Effectiveness and Total
          Qualifications of CIs at 2024 4P; Involvement in Interprofessional Practice at 6F from PTSE 1
          question 14; Patient Disease and Condition and Practice Settings at 6H from PTSE 1 questions 7 and
          3; Number and Variety of Clinical Sites and Clinical Slots) and run by selecting a Group and
          Rotation and clicking Download. The pattern the journey treats as missing is not missing from the
          platform — it is missing from seven of eight disciplines.
      - subject: "OT/OTA"
        detail: >-
          OT runs the structurally identical pattern with SEFWE I (routes to the Fieldwork Educator for
          review and signature first — status Pending Educator Review — before the school) and SEFWE II
          (straight to school review), both publishing into Location Evaluations and the student-side
          Explore Clinical Locations & Wishlist, which makes this the clearest case of a stage-7 output
          feeding back into stage-1 site selection. Grading turnaround itself resolves differently than the
          four-domain hedge implies, and the real constraint is somewhere else entirely. The Custom Reports
          Forms-and-Evaluations data source does expose Due Date, Submitted Date, Score and Grade, so
          "SLA-compliance reporting is unconfirmed" is no longer accurate as an absolute — the data exists,
          a coordinator just assembles it, and the confirmed aggregations are Sum/Average/Earliest-Latest
          date rather than an elapsed-days calculation, with Gradebook not among the ten Custom Report data
          sources. Auto Notifications only offer two recipient types — Students and Experiential Supervisor
          — so a reminder aimed at the grading FACULTY member (LCME 9.8's exact language) has no confirmed
          path. The coupling bites in both directions: a program running the OT-recommended short expiry can
          find itself unable to un-submit a late-reviewed FWPE back to its author. Second, the confirmed
          review-tier orderings run four tiers deep in places (PTMACS: student self-eval > CI evaluates >
          student reviews > school reviews; OT capstone MOU: student > site mentor > faculty > admin)
          against one45's documented "two-tier workflows," so the engine is deeper than any competitor claim
          — the delta is again the instrument inventory riding on it. Program Requirements is the
          corresponding completion-verification anchor and is stronger than the four-domain reading credits
          — per-requirement status auto-updates to "Placed for" on publish and "Completed" on successful
          finish, reverts to Pending if a placement is marked Unsuccessful, highest status wins across
          placements, and hour thresholds surface on the student profile (confirmed in use for Nursing's DNP
          1,000 / NP 500, and the same shape serves PT's Rural / Underserved / School-based / ICE-Acute and
          OT's setting requirements). Its two limits are shared: nothing confirms a requirement can
          auto-BLOCK graduation clearance rather than display Pending, and thresholds cannot be scoped by
          degree level or conditioned on matriculation date — which breaks ACOTE C.1.12's 24-vs-16-week
          split for a tenant running OTD and OTA together, and COA's daggered post-January-2026 rows
          outright.
      - subject: "PA"
        detail: >-
          But for six of the eight existing disciplines the summative instrument is completed by someone
          with no Prism login, which means the DELEGATOR LINK EXPIRY, not the form's Due Date, is what
          actually decides whether a late grade can still be entered: it lives in Program Details > Setup >
          School Profile > Email Setup, defaults to 365 days, and OT guidance recommends 30-50 days for
          4-week rotations so educators lose access to student profiles and forms once the rotation ends.
          PA's Preceptor Evaluation of Student is documented as having a SOFT due date — the preceptor can
          still submit after the deadline as long as the link is live — so any SLA measured against that
          form's Due Date is measuring an unenforced target, and the enforceable boundary is a program-level
          setting, not a per-form one. PA gets closest without reaching it: its accreditation guide maps
          existing reports to standards AND to Self-Study Report appendix numbers (SCPE Details to A1.10a-b
          / Appendix 11a, Comprehensive Assessment Report to B3.02a-c / Appendix 15, the summative
          competency report to B4.03a-e / Appendix 14E), but that is a documentation crosswalk a human
          follows, not a report a button produces. OT, SLP, Nursing, CRNA, SW and TE have neither. Elentra
          is the only competitor with the same ship-the-standard-number-as-the-report-name pattern, and its
          named list covers LCME, COCA, CACMS, ACPE, CODA and ARC-PA but NOT CAPTE, ACOTE, CAA, COA, CSWE or
          CAEP — so PT is precisely where Prism holds the pattern and Elentra does not. PA's summative story
          has the most precisely-scoped gap in the stage. ARC-PA B4.03 requires a verdict attributable to a
          named evaluator, date-stamped inside a specific four-month window relative to that student's OWN
          program end date, and assembled from more than one instrument. Two documented paths exist — a
          per-student competency report out of a program-defined framework in Competency Management, and a
          milestone summative evaluation form on a placeholder or final-rotation course read out via the
          Aggregate Report — and both ride shipped machinery, so B4.03 is not a build. But nothing records
          or validates the four-month window: as arc-pa.yaml puts it, "a summative evaluation completed five
          months out satisfies every report in Prism and fails B4.03." That is a date comparison between an
          existing Submitted Date and an existing per-student program end date, not new data collection, and
          it is the same arithmetic the anchor-relative due-date primitive already performs against a
          placement rather than a program. PA carries a second, real-world citation risk with no product
          control: Exxat's own PA guidance states that mid-point and end-of-rotation evaluations of the same
          student by the same preceptor should be exactly consistent, because PA programs have been cited
          where formative feedback contradicts the summative assessment — and the mitigation exists
          everywhere except PA, since CIET, PTMACS/PTAMACS and the AOTA FWPE all carry midterm responses
          forward into the final form while no equivalent carry-forward is confirmed for a PA-configured
          custom form. Extending that carry-forward to configured forms would serve Nursing and SLP
          identically.
      - subject: "SLP"
        detail: >-
          Instrument depth is the real two-tier split. PT and OT ship pre-built, non-editable Standard forms
          — CIET v2.0, PTMACS/PTAMACS, SCIPAI, the PTSE pair for PT; the five-form AOTA FWPE family for OT —
          where Nursing, SLP, Social Work and Teacher Education have NO shipped national instrument at all
          and every form is configured, with new-form creation gated behind a prism-support@exxat.com
          ticket. caa-asha.yaml rates CAA 5.2 "Configure-with-services-attach" for SLP for exactly that
          reason, where it would be closer to Transfer for PT/OT. The competitive shape of this is worth
          naming precisely: CORE ELMS and E*Value both sell customizable form BUILDERS into these same
          disciplines and are rated ahead on the pillar, but no competitor file names a single validated
          clinical instrument it ships — so Prism's advantage here is the instrument inventory, not the
          engine, and the same argument that makes the AOTA FWPE the strongest comparability surface makes
          the Duke survey's non-customizability the point rather than the limitation (a customized
          stakeholder survey would not carry the validation). Third, whether a summative form's results can
          EVER be aggregated across a cohort is decided at form-build time, not report time: score-based
          forms run through the Aggregate Report and non-scoring qualitative forms run through the Raw Data
          Report, two separate paths. Exxat's own PA guidance is to build Student-Evaluates-Preceptor and
          Student-Evaluates-Site forms as SCORE-based so site and preceptor performance can be quantified in
          aggregate while still showing qualitative labels to students — get it wrong and the form is
          permanently stuck in Raw Data, and for SLP and Nursing, where form creation is support-gated,
          correcting it is a ticket rather than an edit. Finally, the survey engine is not the constraint
          for anyone: Exxat Surveys ships persona-based in-Prism distribution plus email/CSV and anonymous
          link/QR, with 14 question types including attestation and e-signature, and six of eight existing
          disciplines already have named instruments in production (PT's four APTA-aligned DCE Performance
          Survey templates, SLP's December-2025 Graduating Student and Clinical Supervisor Surveys,
          Nursing/CRNA's annual student/alumni/job placement/preceptor/staff set, PA's Graduate Surveys,
          SW's Post-Placement Surveys). OT and Teacher Education have none confirmed — the same shape of gap
          as the four expansion domains. Two accreditor-side limits recur regardless of template and belong
          to Accreditation Management: Prism has no alumni or employer ENTITY (graduates fall out of the
          student model at conferral, so those audiences are maintained as external CSV lists with no
          durable record), and no shipped pillar links a survey finding to the programmatic change made in
          response — the closed-loop CQI object ACOTE A.6.3, CAPTE 2C/2E, CSWE 5.0.1(c)/(d), CCNE IV-A/IV-F
          and ACEN 5.1(d)-(f) all separately require.
      - subject: "Nursing"
        detail: >-
          The four-domain reading of this stage assumes the grade-bearing event is a Forms/Evaluations
          submission and that the student-evaluates-the-site direction is essentially unbuilt. Both
          assumptions break once the eight existing disciplines are in scope. For CRNA, Nursing, PA and SLP
          the grading clock can also be stopped by a weighted PATIENT or CCE LOG reaching approval — the log
          setup drawer carries its own Grading block (contribute yes/no, maximum score, weightage, grading
          type, and which school-level scheme to score against) — and for Teacher Education a third path
          runs through an external LTI tool whose score syncs back into the Gradebook from GoReact. Each
          binding is configured separately and nothing infers it. Competency Management > Review > View
          Report is the single most reused element in the stage — four accreditors, four frameworks, one
          surface. CSWE names it for AS 5.0.1(b); ARC-PA reads it as the Competency Tracking Report for
          B3.03, B3.05 and the B4.03 verdict; COA configures Graduate Standards D.1-D.50 directly as the
          framework, with a custom reporting scale available instead of the fixed default (which is what
          makes fifty critical standards expressible rather than approximated); and CCNE/ACEN use the Cohort
          Performance Tracking Dashboard plus a row-per-student, column-per-domain Competency Tracker with
          drill-down to the sub-competency below threshold. The scoring model is 1-5 or custom, threshold
          configurable at a 70% default, and parent-level scores are a POOLED MEAN across all child
          competencies' mapped questions rather than an average of averages — not a footnote, because CSWE
          AS 5.0.1(a)(v) requires the program to explain HOW achievement is calculated, so the pooled mean
          is the answer to a compliance statement. Two configuration constraints carry across all four:
          questions map at the CHILD-MOST standard level only, so a framework configured without lettered
          children has nowhere to attach questions; and Grading Scheme must be enabled first if the
          framework draws on final course grades. The segmentation limit is the sharpest trap: CSWE AS
          5.0.1(b) wants outcomes broken out per program option AND in aggregate, ACEN 5.1 wants aggregate
          data disaggregated with written justification wherever it is not, and CAEP R3.3 wants
          disaggregation by preparation program and race/ethnicity — while a confirmed one-grid-per-report
          limit means a program that set up separate grids per option cannot produce the aggregate view.
          cswe.yaml puts it exactly: "a configuration decision made months before anyone reads AS 5.0.1(b)."
          The genuine offsetting advantage from nursing.yaml is that because assessment-to-competency
          mapping happens once and calculates automatically thereafter, disaggregation by track or cohort is
          a FILTER rather than a rebuild, which is what ACEN 5.1(c) asks for and what spreadsheet programs
          cannot do. Three structural notes close the stage. First, the faculty-last architecture CCNE III-K
          and ACEN 4.10 actually turn on is already true by construction: there is no confirmed path for any
          site-side evaluator to reach the Gradebook, so a preceptor's rating arrives strictly as a
          submitted form a faculty reviewer acts on — the same structure serving CSWE AS 5.0.1(a) and CAPTE
          2D4, and Leo/DaVinci is the one competitor documented with the same architecture (no-login emailed
          evaluation links whose results export to gradebooks). nursing.yaml's Configure rating on III-K is
          about instrument availability, not this.
      - subject: "Social Work"
        detail: >-
          Social Work's summative instrument and its goal-setting document are the SAME object — the
          Learning Contract — which makes an implementation-time configuration choice decisive: combined
          Learning Contract plus Evaluation in one form, separate forms, or a four-way split (mid-term,
          final, Field Instructor rating, student rating, completed independently). CSWE AS 5.0.1(a)
          requires at least TWO instruments assessing each of the nine competencies with at least one
          field-based, so the four-way split is how a program produces two separable field-based instruments
          from one placement — and the combined model is explicitly paired with the combined-course
          container option, so the form model and the course model are one decision made twice. cswe.yaml
          rates 5.0.1(a) Transfer, its strongest fit, with the caution that the nine competencies must be
          configured with behavior-level children before field season. Two SW specifics: the Comprehensive
          Report for Placement Based Form is named by Exxat's own CSWE guide as the export used to produce
          de-identified sample Learning Agreements for self-study submission (one of the few instances
          outside PT of a report tied to a standard by name rather than inference, with manual
          de-identification), and the Hours by Category report AUTOMATICALLY deducts break and time-off
          hours in line with CSWE's rule that they do not count toward the 400 BSW / 900 MSW minimum — a
          genuinely accreditor-aware behaviour rather than a generic timesheet. What is NOT confirmed is
          whether the summative field EVALUATION can be routed specifically to the degree-qualified Field
          Instructor while excluding an on-site Task Supervisor, which is precisely the distinction CSWE
          B3.3.6/M3.3.6 exists to enforce; the student's choice of reviewer is confirmed for HOURS only.
      - subject: "Teacher Education"
        detail: >-
          Teacher Education is architecturally different from every other summative instrument here, and the
          difference is where the evidence lives. For CIET, FWPE, PTMACS, SEFWE and every configured
          nursing/SLP/SW form the responses themselves sit in Prism and export via Raw Data, Aggregate or
          Comprehensive reports; for TE only the SCORE and STATUS cross back, while the timestamped comments
          and the rubric evidence stay in GoReact. That is what LTI is rather than a defect, but it makes
          TE's Prism-side record thinner than any other discipline's and it echoes the Formstack dependency
          risk flagged for OT, where a lapsed third-party subscription puts previously-pulled FWPE II data
          out of reach because no Exxat-side copy is retained. Two further TE findings. The setup sequence
          itself spans two products: Prism auto-creates the matching GoReact activity on first save
          (genuinely good — it removes the duplicate-setup step that makes most LTI integrations painful)
          but the sequence ends with a human switching products and marking the activity Done, and THAT is
          what makes the assignment visible to candidates — so the most likely TE failure mode is an
          assignment that looks complete in Prism and was never marked Done, with nothing surfacing that
          state. And every setting governing what the recording captures and who can see it is configured
          outside the system of record and documented in GoReact's help centre, so the privacy posture of
          TE's primary evidence artifact is not inspectable from Prism. CAEP R3.3 then asks for
          triangulation — the GoReact rubric score, the summative student-teaching evaluation, a
          dispositions instrument and an external licensure exam joined into one per-candidate proficiency
          rollup, disaggregated demographically — which caep.yaml rates Build and calls "the highest-value
          TE-specific build in the file, and also the element CAEP will not let an EPP fake." Note that CAEP
          also names the cohort 3.0 GPA as a monitored transition point under R3.2, and the Grading Scheme
          module is explicitly record-keeping only and does not calculate grades — so the one number CAEP
          asks for by name has to come from the SIS. That record-keeping-only limitation is the sharpest
          element-level competitive delta in the stage: CORE ELMS ships automated grade calculation and
          conversion today, into a discipline list that explicitly includes PT, OT, PA, nursing and social
          work, and is rated ahead on it.
      - subject: "CRNA"
        detail: >-
          CRNA owns the cleanest completion-verification artifact across all eight: the NBCRNA Transcript
          Report auto-generates a per-student transcript of logged case counts by NBCRNA-required category,
          formatted for national certification eligibility. No competitor teardown names a
          credentialing-body-formatted export for any discipline, and it is exactly the artifact SLP lacks —
          caa-asha.yaml records that "no single artifact combines coursework, hours, and competency sign-off
          into one per-student credentialing dossier," and CRNA has precisely that. Alongside it, Student
          Activity Insights bands per-category completion green/amber/red against COA's case minimums, and
          the CRNA log layout already carries COA's own taxonomy families, so the work is loading the May
          2025 Appendix rather than building a thresholds engine. Three limits carry: no cohort-conditional
          thresholds (COA's daggered rows bind only students matriculating on or after January 1 2026, so
          one course offering must apply two threshold sets by matriculation year), no actual-vs-simulated
          flag though COA forbids satisfying certain rows by simulation alone, and multi-parent "count all
          that apply" counting needs confirming rather than assuming. The Daily Clinical Forms/Evaluations
          Report solves a structural problem no other discipline has — thousands of daily evaluations per
          cohort over a three-year doctoral program — and renders student and preceptor responses side by
          side per question, which is CIET's dual-perspective insight solved at the REPORT layer rather than
          the collection layer, and therefore without CIET's blinding guarantee. It is the clearest instance
          in the corpus of Exxat building for one discipline's structural problem rather than generalising,
          and the direct precedent for extending the CAPTE Reports pattern to other accreditors. Two
          cautions: the per-student PDFs are documented as shareable directly with clinical sites, which
          coa.yaml flags as a FERPA-adjacent disclosure path that should be paired with OTP protection; and
          the report is an aggregation and export layer rather than a competency computation, so bridging
          daily formative volume to COA's Graduate Standards D.1-D.50 requires mapping the daily
          instrument's questions into Competency Management, which no source shows.
    key_findings:
      - subject: "Medicine"
        headline: "LCME 9.8's six-week clock is unreportable and its reminders never reach faculty"
        severity: "gap"
        detail: >-
          Auto Notifications offer only two recipient types, Students and Experiential Supervisor,
          so a reminder aimed at the grading FACULTY member — 9.8's exact language — has no
          confirmed path, and Custom Reports has no elapsed-days aggregation.
      - subject: "PA"
        headline: "A summative done five months out satisfies every Prism report and fails B4.03"
        severity: "gap"
        detail: >-
          B4.03 requires a verdict from a named evaluator, date-stamped inside a four-month window
          relative to that student's OWN program end date, from more than one instrument. Both
          documented paths ride shipped machinery, but nothing records or validates the window.
      - subject: "CRNA"
        headline: "The NBCRNA Transcript Report is the cleanest completion artifact across eight disciplines"
        severity: "none"
        detail: >-
          It auto-generates a per-student transcript of logged case counts by NBCRNA-required
          category, formatted for national certification eligibility, and no competitor teardown
          names a credentialing-body-formatted export for any discipline.
      - subject: "PT/PTA"
        headline: "CIET v2.0's mutual blinding is the strongest differentiator and no competitor claims it"
        severity: "none"
        detail: >-
          Student and CI complete the same instrument simultaneously and neither sees the other's
          ratings until both submit, explicitly to eliminate anchoring bias; capte.yaml calls 2D4
          the single best-served element in the whole document.
      - subject: "OT/OTA"
        headline: "Delegator link expiry, not the form's due date, decides whether a late grade lands"
        severity: "configure-needed"
        detail: >-
          For six of the eight existing disciplines the summative is completed by someone with no
          Prism login. The link expiry lives in School Profile > Email Setup, defaults to 365 days,
          and OT guidance recommends 30-50 days — a program-level setting, not a per-form one.
      - subject: "Social Work"
        headline: "Nothing confirms the summative can exclude a Task Supervisor from reviewing"
        severity: "gap"
        detail: >-
          CSWE B3.3.6/M3.3.6 exists to enforce the distinction between a degree-qualified Field
          Instructor and an on-site Task Supervisor, and the student's choice of reviewer is
          confirmed for HOURS only, not for the summative.
      - subject: "Teacher Education"
        headline: "Only score and status cross back from GoReact; the narrative evidence stays outside"
        severity: "gap"
        detail: >-
          For every other instrument the responses sit in Prism and export via Raw Data or Aggregate
          reports; for TE the timestamped comments and rubric evidence stay in the LTI tool, making
          TE's Prism-side record the thinnest of any discipline.
      - subject: "Dentistry"
        headline: "CODA 2-5 stays Configure with OSCE-grade delivery waiting on Exam Management"
        severity: "configure-needed"
        detail: >-
          Competency-linked instruments measuring skills, behaviors and attitudes are configurable
          on the shipped Forms/Evaluations and Competency Management machinery, but proctored
          exam-grade delivery overlaps Exam Management, roadmap Q2 2027.
  - stage: "8. Post-rotation rollup: cross-site comparability, CQI closure & accreditation evidence"
    current_state_in_prism: >
      The weakest stage in the journey by a wide margin, and the one every
      accreditor lands on. Nothing shipped closes it. Cross-site outcome
      comparability requires inferential statistics over site-tagged outcome
      data — coca.yaml states plainly that "no shipped pillar does outcome
      analytics." The finding→action→evidence loop, the standards-to-evidence
      repository, the deadline/submission tracking, and the self-study export
      are all the job description of Accreditation Management, roadmap **Q3
      2027**. Post-graduation outcomes (Match/GME placement, licensure exam
      pass rates) sit past the placement engine's horizon entirely and
      additionally depend on Exam Management (Q2 2027). capability-map.yaml
      itself calls the Accreditation Management roadmap item "the single most
      load-bearing fact for the whole domain expansion initiative."
    pain_or_gap: >
      Every stage above produces evidence; this stage is where the evidence is
      supposed to become an argument, and it currently leaves the product. The
      coordinator exports to spreadsheets, a liaison hand-assembles a binder
      against standard numbers, and the analytical claims accreditors actually
      ask for — is site A's student outcome distribution comparable to site
      B's? what changed as a result of last cycle's finding? — are
      reconstructed by hand every few years. coca.yaml notes the closed-loop
      finding→action pattern "recurs across most 'continuous improvement'
      standards from every accreditor in this workstream" and should therefore
      be a first-class object type in Accreditation Management rather than
      bolted onto Curriculum Mapping. Two scoping constraints are already
      documented: ACPE now runs its own submission platform, PHARMS (replacing
      AACP's AAMS as of Standards 2025), so Prism should be scoped as an
      evidence-aggregation/export layer feeding PHARMS rather than a competing
      self-study portal; and COCA's report structure and field taxonomy should
      be modelled exactly rather than as a generic binder. Element-level
      tracing of the PT/PTA discipline's Annual Accreditation Report workflow
      (rotation-lifecycle--08-post-rotation-rollup-cross-site-comparability.yaml)
      now substantiates the "hand-assembles a binder" claim directly at screen
      level: the confirmed AAR data-gather path visits four separate modules
      and five reports, with manual de-duplication of location rows, to compile
      what a self-study assembly feature would need to automate.
    accreditation_link: >
      COCA Standard 6, Element 6.11 (policy plus the most recent
      statistical-analysis report comparing student outcomes across all
      core/required sites, and plans to address gaps) — **Gap**; coca.yaml
      recommends scoping cross-site comparability statistics explicitly into
      Accreditation Management "rather than assumed to fall out of the rotation
      engine." LCME Standard 8, Element 8.7 (comparable experiences and
      equivalent assessment across every location a course/clerkship is taught)
      — Configure; element-level tracing
      (rotation-lifecycle--08-post-rotation-rollup-cross-site-comparability.yaml)
      resolves the prior "not confirmed" hedge into a confirmed split: no
      purpose-built comparability report ships, but the Custom Report builder's
      Forms and Evaluations data source already supports the underlying pivot —
      Site/Clinical Setting as rows, Score (Average) as the value — as a named,
      documented use case ("Performance by Clinical Setting"), available today
      as manual per-report admin configuration rather than an
      accreditor-formatted, threshold-flagging output. ACPE Standard 7, Key
      Element 7.3.c (standardized key components across all sites offering the
      same course, consistent assessment across sites) — Transfer on the
      form-reuse mechanism; the same confirmed Custom Report pivot is the
      self-service path to cross-site drift visibility today, so "needing a
      build" narrows specifically to the statistical drift-flagging layer, not
      the underlying data access. ACPE Standard 7, Key Element 7.5.b
      (standards-to-evidence repository, gap tracking, reporting deadlines,
      self-study assembly) — **Gap**. COCA Standard 11, Element 11.1
      (closed-loop finding→action→evidence over three academic years) —
      **Gap**; the closest existing analog, Curriculum Mapping's free-form
      "Needs Review"/"Reviewed" tag-and-report workflow, is confirmed to exist
      but confirmed *not* to close the loop (no link from a tag to the
      resulting change, no evidence attachment). COCA Standard 11, Element 11.9
      (timely, complete COCA annual and mid-cycle report submission) — **Gap**,
      called "the single highest-leverage element in this document for that
      pillar's business case." COCA Standard 11, Element 11.4 (four years of
      first-time COMLEX-USA pass rates published within 30 days, with an
      improvement-plan trigger) and 11.5 (public 4-year PGY-1 placement rate,
      improvement plan below 95%) — both Gap. LCME Standard 1, Element 1.1
      (year-round CQI monitoring of compliance with every standard) and
      Standard 8, Element 8.4 (outcome data including national norms, gathered
      during enrollment and after completion) — both Gap; 8.4 depends on three
      roadmap pillars shipping *and being integrated with each other*. CODA
      Standard 1, Element 1-2 (broad-based, systematic, continuous
      planning/assessment/improvement — the backbone of the CODA self-study) —
      **Gap**, "the single item the capability map itself calls the most
      load-bearing gap." CODA Standard 5, Element 5-3 (chart-audit sampling,
      deficiency coding, root-cause analysis, corrective-action tracking for
      patient care) — Gap.
    competitor_comparison: >
      Prism's largest publicly-verifiable competitive deficit, and the research
      is unanimous. MedHub/E*Value ships a named Accreditation Automation
      product: ACGME NAS-aligned dashboards and program scorecards, CLER
      visit/letter/response-action tracking, direct import of ACGME survey
      results, automated ADS-formatted report generation, PubMed-sourced
      scholarly-activity import, and policy-expiration alerts — e-value.yaml
      calls this "the single biggest publicly-verifiable gap found in this
      research." New Innovations ships CLER Visit Management, NAS accreditation
      tools, Annual Program Evaluations with trend and citation/concern
      tracking, and CCC Milestone Review spider graphs. Elentra ships
      named-standard reporting across LCME (including element-level reporting),
      COCA, CACMS, ACPE, CODA and ARC-PA, is an AAMC Curriculum Inventory
      participating vendor with native MedBiquitous support and >40% CACMS DCI
      coverage, and has a referenced LCME mock-visit use case at Miami's Miller
      School. Leo/DaVinci has been an AAMC-authorized Curriculum Inventory
      vendor since 2013 with one-click CI submission and pre-submission
      business-rule validation. one45 has the named eight-year LCME outcome at
      Augusta. axiUm markets CODA-Ready Reporting, though its evidence suggests
      ad hoc query building (Custom Query Engine, Info Manager) rather than
      standard-by-standard evidence mapping. CORE ELMS ships CompMS with
      ACPE-aligned curriculum gap analysis — but notably makes *no* equivalent
      CODA claim on its dental pages, which core-elms.yaml identifies as "a
      specific, provable gap in CORE's dental depth Prism can target first."
      The convergent recommendation across one45.yaml, emedley.yaml,
      new-innovations.yaml, medhub.yaml and core-elms.yaml is the same: because
      Prism's Accreditation Management build is not yet locked, scope it from
      day one around COCA / ACPE / CODA alongside LCME rather than retrofitting
      an LCME-or-ACGME-first model — that is the one axis on which no incumbent
      currently has full coverage. None of these competitor teardowns is
      granular enough in public docs to support a screen-level, field-by-field
      comparison against the element-level tracing done here — the comparison
      stands at the feature-name/process level (e.g. "automated ADS-formatted
      report generation" vs. Prism's confirmed manual per-report pivot), not
      element-by-element, and
      rotation-lifecycle--08-post-rotation-rollup-cross-site-comparability.yaml
      says so explicitly at each step rather than guessing.
    domain_variance: >
      DO — the heaviest reporting burden of the four: cross-site statistical
      comparability (6.11), COMLEX-USA pass-rate publication within 30 days of
      each NBOME update with a 2-SD/90% improvement-plan trigger (11.4), public
      4-year PGY-1 placement rate with a 95% threshold (11.5), the mandatory
      COCA student survey (11.8), and COCA's own annual and mid-cycle reports
      (11.9) — most of which key off data that lives outside the COM (NBOME,
      ACGME, AACOM benchmarks). Medicine — LCME 1.1's demand is *continuous*:
      monitoring compliance with every standard year-round, not at self-study
      time, plus USMLE and Match outcomes as the national norms in 8.4, and a
      longer data-retention horizon than academic-term thinking assumes because
      state licensure boards may require documentation years after graduation.
      Pharmacy — submission itself now belongs to ACPE's PHARMS platform (as of
      Standards 2025, July 2025), so the target is an export/feed, not a
      portal; the outcomes taxonomy should target AACP's COEPA framework and
      NAPLEX Competency Statements, with cohort NAPLEX pass rate as the leading
      indicator. Dentistry — the CQI object is *patient care*, not just
      education: CODA 5-3 requires chart-audit sampling, deficiency coding and
      root-cause analysis over patient records, naturally expressed in CDT
      codes, alongside INBDE/DLOSCE and state/regional clinical licensure pass
      rates as multi-jurisdiction outcomes. Note the CODA structural advantage:
      one accreditor spans both the predoctoral degree and postdoctoral
      GPR/AEGD/specialty residencies, so a single accreditation-evidence model
      extends across the full continuum — unlike MD/DO, where the degree
      (LCME/COCA) and the residency (ACGME) sit under separate bodies.
    discipline_variance: >
      Stage 8 is the one stage where each accreditor's requirements stop being narrative and become
      a concrete, field-shaped report, and the eight existing disciplines materially change the
      four-domain reading in both directions. The strongest correction is that Accreditation
      Management is a GENERALIZATION of a proven per-discipline pattern rather than a build from
      nothing: four accreditor standard sets already ship pre-loaded (ARC-PA 6th Edition for PA;
      ACOTE split four ways by degree level — Doctoral 2023 plus legacy 2018, Master's, Baccalaureate,
      Associate — plus an NBCOT set; the AACN Essentials for Nursing; CAA and CFCC as two
      independently-revised sets for SLP), and three disciplines already get accreditor-FORMAT-MATCHED
      outputs rather than generic grids. PA's B2 Instructional Objectives Report emits one Excel tab
      per ARC-PA standard with sub-lettered standards consolidated. Nursing's Crosswalk Report is
      modelled on AACN's own Essentials Toolkit template and is the only mapping report in the
      product carrying a DEPTH dimension (knowledge/skill/behavior crossed with
      introduced/reinforced/demonstrated) rather than a flat mapped bit — which is exactly what
      CAEP's InTASC learning-progression language and CCNE's per-track demonstration both need, and
      it is currently nursing-only. And SLP's KASA Clinical Certification Report goes furthest of
      all: it generates a SIGNED ASHA certification template, i.e. document generation rather than
      dashboarding, and nothing in the competitor corpus is documented reaching it. Two disciplines
      are NOT pre-loaded and should not be claimed: CSWE's nine competencies run as a
      program-authored custom set under Program Specific Standards, and caep.yaml states there is no
      evidence InTASC or CAEP R1-R5 ships pre-loaded at all.
      The competitive picture here is unusual and worth stating plainly: across all nine teardowns,
      EVERY named-standard accreditation claim is ACGME, LCME, CACMS, COCA, ACPE, CODA or ARC-PA.
      Not one competitor file documents an artifact against CAPTE, ACOTE, CAA/ASHA, CCNE, ACEN, COA,
      CSWE or CAEP. So for six of the eight existing disciplines there is genuinely nothing to
      compare against, and the two exceptions are narrow — Elentra names ARC-PA among the standards
      it reports against (the only real element-adjacent comparison anywhere in this stage, and it
      is for one of eight), and New Innovations ships citation/concern tracking inside its ACGME
      Annual Program Evaluation. Where MedHub/E*Value's Accreditation Automation is genuinely ahead
      — benchmarking, program scorecards, automated ADS-formatted generation, policy-expiration
      alerts — the scope caveat now cuts both ways: it is documented as ACGME/GME-specific, so it is
      not proven to serve any of these eight disciplines either.
      The sharpest NEW requirement the eight disciplines surface is edition churn, and it is not
      hypothetical. Deactivating a standard CASCADE-DELETES every mapping made against it, so an
      edition transition destroys the longitudinal mapping history a self-study trends — and four of
      the eight have a standards edition landing between now and 2029: CAPTE 2024 already effective
      for all programs since January 1 2026, CCNE's AACN Essentials amendment effective January 1
      2027, CAA's 2027 Standards effective August 1 2027, CSWE's EPAS review due around 2029, plus
      the per-SPA churn behind CAEP (ACTFL 2026, AMLE 2022, NELP 2018 and others). capte.yaml and
      caep.yaml reached that conclusion independently, which is what makes it a product requirement
      rather than an opinion. PT supplies the concrete embarrassment: two shipped reports still
      print 2016 numbering — "Number and Variety of Clinical Sites (Standard 2C)" and "Number and
      Variety of Clinical Slots (Standard 8F)" — when there IS no Standard 8 in the 2024 PT or PTA
      documents (both stop at 7) and 2024's 2C is Program Assessment, not sites; the content now
      lives at 2D8. Prism's other five CAPTE reports already carry dual "2024 X / 2016 Y" labels, so
      the pattern exists and these two were missed, and the PT playbook's own enhancements list
      confirms the migration is a known, tracked work item ("Map competencies to CAPTE 7 (2024)
      Standards — in progress"). The report CONTENT is correct and only the citation is wrong, which
      is the more dangerous failure mode. ARC-PA has the same defect from a different direction: a
      stale 5e "C2.01 a-c" citation survives inside Exxat's own guide titled for the 6th Edition,
      where 5e C2.01 was renumbered into 6e B3.02 and the graduate-survey content actually belongs
      under 6e C1.01. COA adds a dimension no other accreditor has — cohort-conditional effectivity,
      where dagger-marked Appendix rows bind only students matriculating on or after January 1 2026,
      putting two matriculation years in one course offering under different totals. The fix is one
      field on the standard object with a versioned attribute rather than report metadata; the
      Standards screen currently makes an edition transition destructive rather than migratory.
      A second cross-cutting requirement the four-domain reading never surfaced: a per-standard
      SEVERITY or STATE attribute. COA asterisks its critical-concern standards — F.7 (the 2:1
      supervision cap), F.1, F.5, A.3, A.10, E.2, G.3, H.1.1, H.1.2, H.1.6, six Standard B faculty
      elements, and ALL FIFTY of D.1-D.50 — and CAPTE currently has an active STAY on Standard 2B
      instructing programs not to respond to it at all. Two accreditors, researched independently,
      attach a per-standard state that changes how a program must respond, and Prism's standards
      model can represent neither. Note that a stay needs a SUPPRESSED state distinct from
      deactivated, precisely because deactivation destroys mappings — so this is one field with at
      least three values, not two features. For CRNA the severity tier matters more than anywhere
      else, and coa.yaml flags the corollary risk on the Competency Review Dashboard: it is a
      DOMAIN-level view, and because COA treats each of its fifty graduate standards as individually
      critical, a domain average can mask a single failed competency.
      The most repeated single requirement across the twelve accreditor registries is one no shipped
      pillar addresses at all: publication to a program-owned PUBLIC page on a recurring clock. Six
      of the eight existing disciplines plus two expansion accreditors demand it, with three
      different cadences and at least two prescribed labels — ACOTE A.4.2 wants a three-year outcome
      table plus an active NBCOT link on the program HOME PAGE; CAA 1.9 wants a three-year table
      under the VERBATIM heading "Student Achievement Data" or "Student Outcome Data," segmented per
      modality for distance education and satellite campuses (which forces modality to be a
      first-class cohort attribute upstream of any report); CSWE AS 5.0.1(d) wants Form B5.0.1(d)
      posted on the program webpage, refreshed at least every two years, hyperlinked to CSWE; COA
      G.3 (critical) wants annual publication of attrition, 6-month employment as nurse anesthetists,
      and the NBCRNA NCE FIRST-TIME pass rate on a page linked from COA's own list; and ARC-PA
      A3.11c imposes a hard April 1 date with distant campuses broken out individually. Nothing in
      Prism publishes anything outward, so this is a genuinely new surface rather than a report
      variant. One data-model subtlety to carry: COA H.1.6.2 wants pass rates AND MEAN SCORES while
      G.3.4.3 wants the first-time pass rate specifically, so a single "pass rate" field satisfies
      neither cleanly.
      Every one of the eight also needs a post-graduation outcome object and none has it, because
      Prism's student record ends at conferral. CAPTE 1C3 wants a 90% two-year employment rate;
      ACOTE A.6.3 counts graduate job placement, employer satisfaction and alumni scholarly activity
      among eleven enumerated annual streams; CSWE AS 5.0.3 wants graduation rate plus one further
      outcome over three years against a program-set benchmark; CCNE IV-E and ACEN 5.4 want 80%
      employment with the RESPONSE RATE reported as a first-class metric; COA H.1.4/H.1.5 and G.3.4.2
      want alumni and employer evaluation; CAEP R4.1/R4.3 want completer effectiveness and
      satisfaction; and CAA 4.8 requires documentation available to graduates and non-completing
      attendees — which bites hardest because the CCC-SLP application is filed AFTER graduation,
      exactly when the hours verification is needed and exactly when nothing confirms the graduate
      still has access. caep.yaml supplies the scoping discipline worth keeping: CAEP R4.1's
      state-owned P-12 growth data is largely unobtainable, so the honest product answer is "support
      the case-study and observation route well," not "integrate state longitudinal data systems."
      External exam ingestion is the paired dependency and is blocked on Exam Management (Q2 2027):
      ACOTE A.6.4 needs an 80% NBCOT rolling average over three calendar years with a small-cohort
      rule extending the window year by year up to five years until 25 test-takers are reached — real
      conditional logic, and acote.yaml warns a naive three-year average would misreport compliance
      for the many small OTA programs; CCNE IV-C needs an 80% NCLEX-RN rate demonstrated FOR EACH
      CAMPUS/SITE AND TRACK by one of four permitted calculations; ACEN 5.3 adds an "at or above the
      national mean" option that requires ingesting a SECOND external feed; CAA 5.5/5.6 need Praxis
      pass and completion rates averaged over three years counting a repeat test-taker once; and
      ARC-PA C1.01 needs PANCE scores AND sub-scores. nursing.yaml calls NCLEX "the highest-value Gap
      in this file" because it is the number state boards act on independently of the accreditor,
      and the per-campus/per-track slice means the exam data model must key on the same campus/site
      entity the placement engine already uses. CAA also imposes a firewall with no equivalent
      anywhere else in the corpus: Standard 5.2 explicitly FORBIDS using the Praxis as summative
      student assessment, so Praxis results must be modelled strictly as a programmatic outcome
      measure and never wired into per-student competency rollups.
      The closed-loop finding-to-action object is now specified rather than gestured at, because
      twelve accreditors converge on it and each adds a field the others do not. CAA 5.4/5.8 needs
      RE-MEASUREMENT (the program must evaluate the improvement, not merely log it, so the object
      needs a re-measurement result rather than a close-out). CAEP R5.4 needs a STAKEHOLDER GROUP
      field, a keep/modify/discontinue disposition, and explicit tolerance for recording changes that
      did NOT improve outcomes — so it must not be modelled as a remediation tracker. CAPTE 2C needs
      two worked examples within the LAST FOUR YEARS each with rationale, process, timeline and
      reassessment result, i.e. a queryable timestamp and an exemplar flag. ACOTE A.6.3 needs a fixed
      eleven-stream annual template — usefully, because an enumerated fixed list means an ACOTE build
      can be a report template rather than a generic evidence binder. CSWE AS 5.0.1(c) needs a CLEAR
      LINK to the specific data point. ACEN 5.1 needs three-year retention of the ANALYSIS rather
      than just the numbers. ARC-PA C1.01's verb is not "collect" but "create self-improvement action
      plans." The nearest shipped analog remains Mapping Tags — a free-form colored label with a
      count — which carries none of those fields, and every one of the eight registries independently
      concluded this belongs as a first-class object in Accreditation Management rather than bolted
      onto Curriculum Mapping.
      Two structural limits recur and pull in opposite directions across disciplines. The
      one-grid-per-report limit is the first: reports run across a curriculum grid and cannot run
      across multiple grids simultaneously. nursing.yaml calls this "the single most consequential
      structural limit in the file, and nursing is the discipline where it bites hardest" — a
      five-track school (ADN/BSN/MSN/DNP/specialty) produces five disconnected report sets and no
      product-supported program-level union view. Critically, it is FINE for CCNE III-B through
      III-E, which are deliberately per-degree and per-track, and it BREAKS ACEN 4.1, which requires
      ONE set of end-of-program outcomes across all options — a CCNE school and an ACEN school need
      opposite things from the same feature. Social Work hits it from the other side: CSWE AS
      5.0.1(b) wants outcomes per program option AND in aggregate from one data set, and cswe.yaml's
      framing is the operationally useful one — "a configuration decision made months before anyone
      reads AS 5.0.1(b)," so it belongs in implementation rather than in a self-study scramble. The
      second recurring limit is demographic disaggregation: Custom Reports exposes Course, Rotation,
      Academic Year, Status, Site and per-question fields but NOT race/ethnicity as a comparability
      dimension — while CAEP requires disaggregation by preparation program AND race/ethnicity across
      EVERY component R1.1 through R4.3 with disparities either absent or explained, and ACEN 5.1
      requires aggregate data disaggregated with written justification wherever it is not. Prism
      holds the data (Students > Reports > Race, Gender, Age & Ethnicity already exists and is one of
      the five sources in PT's AAR pull), so this is a join that is absent rather than data that is
      missing, and caep.yaml's advice is right: treat demographic disaggregation as a cross-cutting
      reporting primitive rather than re-solving it per element.
      The manual seams are best documented in PT and PA and they substantiate the journey's
      hand-assembles-a-binder claim at screen level rather than restating it. PT's Annual
      Accreditation Report pull visits four modules and five reports: Sites > Contracts filtered to
      Active and exported sorted by Start Date; a Learning Activity Group built per cohort before
      running Total Qualifications of CIs; Students > Reports > Race, Gender, Age & Ethnicity
      filtered by cohort; and the live Comprehensive Placement Report, from which the admin MANUALLY
      DELETES duplicate Location Name rows to get the unique-sites count an accreditor asks for. It
      also depends on institutional knowledge the workflow does not enforce — the decelerated-status
      flag has to be set correctly for headcounts to be right, and two other registries independently
      identified that same flag as the denominator mechanism their own rate calculations would need
      (capte.yaml calls it "precisely the denominator control an ultimate-pass-rate calculation
      needs" for 1C2; acote.yaml names it as the nearest analogue to the G3 exclusion in ACOTE's
      graduation-rate formula). PA's is sharper still: the documented best practice for SCPE Details
      is "gold in, gold out" — keep Prism site and location names identical to the ARC-PA Entry Level
      Program Portal, download both exports, and diff them line by line in Excel — which arc-pa.yaml
      calls "the single most concrete, already-validated case for what Accreditation Management should
      automate: a per-accreditor submission-format target with a reconciliation view, not a generic
      evidence binder." Compare Leo/DaVinci, an AAMC-authorized Curriculum Inventory vendor since 2013
      with one-click submission and business rules that flag data errors PRE-submission: different
      accreditor, same workflow, and the delta (validated submission versus manual diff) is the
      comparison worth carrying. PA has one more copy-paste seam: the B3.06 evidence requires joining
      preceptor area-of-practice to placements, and Exxat's own workflow is to copy practice settings
      out of the Comprehensive Personnel Report and paste them into the preceptor-based placement
      report — "the same seam recurs in every accreditor standard that asks did the right kind of
      supervisor deliver the right kind of experience."
      The comparability gap this stage is named for is now confirmed from an existing discipline
      rather than only from the expansion domains, which is the strongest available evidence that it
      is real. ACOTE C.1.11 requires documentation that ALL students had SIMILAR Level I experiences
      across six permitted instructional methods (virtual, simulated, standardized patients, faculty
      practice, faculty-led site visits, or supervision in a practice environment), and acote.yaml
      states that comparability there is "asserted by construction (same course offering, therefore
      same experience), not measured. Nothing compares realized Level I outcomes across sites or
      delivery methods to show that a simulated cohort and a practice-environment cohort actually
      performed comparably — the same cross-site statistical comparability gap logged against COCA
      6.11." OT nonetheless owns the single strongest comparability SURFACE in the product, and the
      reason is instrument standardization rather than reporting: because the AOTA FWPE ships as a
      nationally standardized, non-editable Standard form, grouping the SAME instrument by site or by
      educator produces a like-for-like comparison rather than a comparison of differently-worded
      local forms. acote.yaml is explicit that this is what the four expansion domains should be
      assessed on. The two partial analogs to a comparability engine both live in this stage: the
      Custom Reports pivot (Rows = Clinical Setting or Site, Values = Score (Average), the documented
      "Performance by Clinical Setting" scenario) which offers no variance or effect-size measure, and
      Nursing's Competency Review Dashboard Score Distribution box plot, which renders RED when a
      domain median falls below its configured threshold — the ONLY place in the product where a
      threshold drives a visual state change on an outcome distribution rather than on a coverage
      count. What has no analog anywhere is variance flagging BY SITE against a threshold band.
      Several small findings are worth carrying because they are cheap and specific. The Heatmap
      Report cannot be downloaded at all — the PA playbook instructs CSS to advise programs to
      screenshot it — and every other Mapping Report in the suite exports; for any accreditor wanting
      the coverage matrix in a self-study (ARC-PA B1, CAA 3.1.1B-3.1.6B, CAEP R5.1) the liaison
      retypes it, which arc-pa.yaml calls a real gap for a report whose entire purpose is
      accreditation-readiness evidence. SLP's Mapped Standards Report is the one shipped mapping
      surface that identifies GAPS rather than displaying coverage — every other one answers "what did
      we cover" and never "who is short" — though what threshold defines "insufficiently covered" is
      unstated and should be verified rather than pitched, and mapping frameworks beyond KASA require
      CSS assistance. SLP's report family also caps at 50 course offerings per run with a 6am EST
      Statistics refresh, which turns a full-cohort self-study exhibit into several exports plus a
      manual merge, and means nothing in this stage should be described as real-time — six of the ten
      Custom Report data sources (Slot, Sites, Locations, Contracts, Personnel, Faculty) sit on a
      24-hour refresh tier, honestly badged in the UI. Social Work carries the sharpest privacy
      finding in the stage: the one artifact that physically leaves the institution and reaches an
      external reviewer — de-identified sample Learning Agreements — is de-identified by hand, in
      Excel, with no verification step, and cswe.yaml calls a native de-identified export mode "a real
      FERPA foot-gun" worth closing. SW also has a maintenance hazard hiding in a strength: Client
      System Levels and Dimensions of Learning are defined ONCE under Curriculum Mapping > Attributes
      and reused, so the same attribute is read by AS M3.2.1, AS M3.2.4 and AS 5.0.1(a) — the playbook
      instructs keeping them consistent across all three, an edit for one silently changes the
      evidence for the other two, and nothing detects the divergence. That cross-standard divergence
      check is named in cswe.yaml as "a small, high-credibility Accreditation Management feature."
      Three honest limits close the stage. First, an unresolved internal contradiction: five accreditor
      registries (arc-pa, caa-asha, cswe, caep, acote) record that NO dedicated Interventions report
      exists and the only follow-up surface is the Sites/Locations Dashboard on a 24-hour refresh,
      while the OT playbook documents a "Communication and Intervention Report" under Students >
      Reports and PA gives a concrete path — reconcile before either claim is used externally. Second,
      a registry gap recorded rather than papered over: the SW playbook maps the Course "Nature" field,
      Associate Faculty and Staff, and the Course Offerings export to CSWE AS 4.2.2, and there is no
      AS 4.2.2 element anywhere in cswe.yaml, whose Standard 4.2 coverage stops at B4.2.1/M4.2.1 — so
      that mapping is cited to a playbook, not a registry, and AS 4.2.2 should be added before it
      supports a compliance claim. Third, the most instructive scoping template in the whole file is a
      DISCLOSED gap rather than a capability: Exxat's own CSWE guide states that Form AS 4.2.1 and the
      per-faculty Faculty Data Forms "must be completed outside Exxat Prism" and that Prism "does not
      generate or validate required faculty data fields." cswe.yaml calls that the model for how the
      Q3 2027 pillar should represent partial coverage honestly — supports the narrative, does not
      produce the form. Set against PA's B2 export, the two together define the range: form generation
      is proven possible for one accreditor and explicitly disclaimed for another, inside the same
      product. And two disciplines are structurally under-served in ways that will not resolve
      themselves: CSWE AS 5.0.2 requires assessing at least one anti-racism/diversity/equity/inclusion
      effort in the IMPLICIT curriculum — program environment, climate, governance — which is not
      modelled anywhere in Prism, so there is no object to attach an ADEI finding to, and cswe.yaml's
      warning is that "if Accreditation Management models only curriculum-linked evidence, it
      structurally cannot serve CSWE's implicit-curriculum standards, and Social Work is a live
      existing-customer discipline." Teacher Education has exactly one confirmed TE-specific product
      surface in the entire corpus — the GoReact/Echo360 LTI integration, support-gated per discipline
      — and even there the rubrics live in GoReact, so rubric authoring, versioning and inter-rater
      reliability all happen outside the system of record while CAEP R5.2 requires EPP-created
      assessments to meet CAEP's own evaluation criteria; caep.yaml's conclusion is that "the validity
      evidence CAEP wants for that instrument cannot be assembled from Prism alone." The cheapest TE
      investment identified anywhere is content-ops rather than engineering: adding an Employer
      Satisfaction and a Completer Satisfaction survey template pair to Exxat Surveys, following the
      demonstrated December 2025 SLP precedent — and note the same missing template family blocks COA
      H.1.2's eight-facet student evaluation for CRNA, so it is one motion serving two disciplines.
    discipline_notes:
      - subject: "PT/PTA"
        detail: >-
          The sharpest NEW requirement the eight disciplines surface is edition churn, and it is not
          hypothetical. Deactivating a standard CASCADE-DELETES every mapping made against it, so an edition
          transition destroys the longitudinal mapping history a self-study trends — and four of the eight
          have a standards edition landing between now and 2029: CAPTE 2024 already effective for all
          programs since January 1 2026, CCNE's AACN Essentials amendment effective January 1 2027, CAA's
          2027 Standards effective August 1 2027, CSWE's EPAS review due around 2029, plus the per-SPA churn
          behind CAEP (ACTFL 2026, AMLE 2022, NELP 2018 and others). capte.yaml and caep.yaml reached that
          conclusion independently, which is what makes it a product requirement rather than an opinion. PT
          supplies the concrete embarrassment: two shipped reports still print 2016 numbering — "Number and
          Variety of Clinical Sites (Standard 2C)" and "Number and Variety of Clinical Slots (Standard 8F)"
          — when there IS no Standard 8 in the 2024 PT or PTA documents (both stop at 7) and 2024's 2C is
          Program Assessment, not sites; the content now lives at 2D8. Prism's other five CAPTE reports
          already carry dual "2024 X / 2016 Y" labels, so the pattern exists and these two were missed, and
          the PT playbook's own enhancements list confirms the migration is a known, tracked work item ("Map
          competencies to CAPTE 7 (2024) Standards — in progress"). The report CONTENT is correct and only
          the citation is wrong, which is the more dangerous failure mode. The manual seams are best
          documented in PT and PA and they substantiate the journey's hand-assembles-a-binder claim at
          screen level rather than restating it. PT's Annual Accreditation Report pull visits four modules
          and five reports: Sites > Contracts filtered to Active and exported sorted by Start Date; a
          Learning Activity Group built per cohort before running Total Qualifications of CIs; Students >
          Reports > Race, Gender, Age & Ethnicity filtered by cohort; and the live Comprehensive Placement
          Report, from which the admin MANUALLY DELETES duplicate Location Name rows to get the unique-sites
          count an accreditor asks for. It also depends on institutional knowledge the workflow does not
          enforce — the decelerated-status flag has to be set correctly for headcounts to be right, and two
          other registries independently identified that same flag as the denominator mechanism their own
          rate calculations would need (capte.yaml calls it "precisely the denominator control an
          ultimate-pass-rate calculation needs" for 1C2; acote.yaml names it as the nearest analogue to the
          G3 exclusion in ACOTE's graduation-rate formula).
      - subject: "OT/OTA"
        detail: >-
          Stage 8 is the one stage where each accreditor's requirements stop being narrative and become a
          concrete, field-shaped report, and the eight existing disciplines materially change the
          four-domain reading in both directions. The strongest correction is that Accreditation Management
          is a GENERALIZATION of a proven per-discipline pattern rather than a build from nothing: four
          accreditor standard sets already ship pre-loaded (ARC-PA 6th Edition for PA; ACOTE split four ways
          by degree level — Doctoral 2023 plus legacy 2018, Master's, Baccalaureate, Associate — plus an
          NBCOT set; the AACN Essentials for Nursing; CAA and CFCC as two independently-revised sets for
          SLP), and three disciplines already get accreditor-FORMAT-MATCHED outputs rather than generic
          grids. The comparability gap this stage is named for is now confirmed from an existing discipline
          rather than only from the expansion domains, which is the strongest available evidence that it is
          real. ACOTE C.1.11 requires documentation that ALL students had SIMILAR Level I experiences across
          six permitted instructional methods (virtual, simulated, standardized patients, faculty practice,
          faculty-led site visits, or supervision in a practice environment), and acote.yaml states that
          comparability there is "asserted by construction (same course offering, therefore same
          experience), not measured. Nothing compares realized Level I outcomes across sites or delivery
          methods to show that a simulated cohort and a practice-environment cohort actually performed
          comparably — the same cross-site statistical comparability gap logged against COCA 6.11." OT
          nonetheless owns the single strongest comparability SURFACE in the product, and the reason is
          instrument standardization rather than reporting: because the AOTA FWPE ships as a nationally
          standardized, non-editable Standard form, grouping the SAME instrument by site or by educator
          produces a like-for-like comparison rather than a comparison of differently-worded local forms.
          acote.yaml is explicit that this is what the four expansion domains should be assessed on. Three
          honest limits close the stage. First, an unresolved internal contradiction: five accreditor
          registries (arc-pa, caa-asha, cswe, caep, acote) record that NO dedicated Interventions report
          exists and the only follow-up surface is the Sites/Locations Dashboard on a 24-hour refresh, while
          the OT playbook documents a "Communication and Intervention Report" under Students > Reports and
          PA gives a concrete path — reconcile before either claim is used externally.
      - subject: "PA"
        detail: >-
          PA's B2 Instructional Objectives Report emits one Excel tab per ARC-PA standard with sub-lettered
          standards consolidated. The competitive picture here is unusual and worth stating plainly: across
          all nine teardowns, EVERY named-standard accreditation claim is ACGME, LCME, CACMS, COCA, ACPE,
          CODA or ARC-PA. Not one competitor file documents an artifact against CAPTE, ACOTE, CAA/ASHA,
          CCNE, ACEN, COA, CSWE or CAEP. So for six of the eight existing disciplines there is genuinely
          nothing to compare against, and the two exceptions are narrow — Elentra names ARC-PA among the
          standards it reports against (the only real element-adjacent comparison anywhere in this stage,
          and it is for one of eight), and New Innovations ships citation/concern tracking inside its ACGME
          Annual Program Evaluation. Where MedHub/E*Value's Accreditation Automation is genuinely ahead —
          benchmarking, program scorecards, automated ADS-formatted generation, policy-expiration alerts —
          the scope caveat now cuts both ways: it is documented as ACGME/GME-specific, so it is not proven
          to serve any of these eight disciplines either. ARC-PA has the same defect from a different
          direction: a stale 5e "C2.01 a-c" citation survives inside Exxat's own guide titled for the 6th
          Edition, where 5e C2.01 was renumbered into 6e B3.02 and the graduate-survey content actually
          belongs under 6e C1.01. PA's is sharper still: the documented best practice for SCPE Details is
          "gold in, gold out" — keep Prism site and location names identical to the ARC-PA Entry Level
          Program Portal, download both exports, and diff them line by line in Excel — which arc-pa.yaml
          calls "the single most concrete, already-validated case for what Accreditation Management should
          automate: a per-accreditor submission-format target with a reconciliation view, not a generic
          evidence binder." Compare Leo/DaVinci, an AAMC-authorized Curriculum Inventory vendor since 2013
          with one-click submission and business rules that flag data errors PRE-submission: different
          accreditor, same workflow, and the delta (validated submission versus manual diff) is the
          comparison worth carrying. PA has one more copy-paste seam: the B3.06 evidence requires joining
          preceptor area-of-practice to placements, and Exxat's own workflow is to copy practice settings
          out of the Comprehensive Personnel Report and paste them into the preceptor-based placement report
          — "the same seam recurs in every accreditor standard that asks did the right kind of supervisor
          deliver the right kind of experience." Several small findings are worth carrying because they are
          cheap and specific. The Heatmap Report cannot be downloaded at all — the PA playbook instructs CSS
          to advise programs to screenshot it — and every other Mapping Report in the suite exports; for any
          accreditor wanting the coverage matrix in a self-study (ARC-PA B1, CAA 3.1.1B-3.1.6B, CAEP R5.1)
          the liaison retypes it, which arc-pa.yaml calls a real gap for a report whose entire purpose is
          accreditation-readiness evidence.
      - subject: "SLP"
        detail: >-
          And SLP's KASA Clinical Certification Report goes furthest of all: it generates a SIGNED ASHA
          certification template, i.e. document generation rather than dashboarding, and nothing in the
          competitor corpus is documented reaching it. CAA also imposes a firewall with no equivalent
          anywhere else in the corpus: Standard 5.2 explicitly FORBIDS using the Praxis as summative student
          assessment, so Praxis results must be modelled strictly as a programmatic outcome measure and
          never wired into per-student competency rollups. The closed-loop finding-to-action object is now
          specified rather than gestured at, because twelve accreditors converge on it and each adds a field
          the others do not. CAA 5.4/5.8 needs RE-MEASUREMENT (the program must evaluate the improvement,
          not merely log it, so the object needs a re-measurement result rather than a close-out). CAEP R5.4
          needs a STAKEHOLDER GROUP field, a keep/modify/discontinue disposition, and explicit tolerance for
          recording changes that did NOT improve outcomes — so it must not be modelled as a remediation
          tracker. CAPTE 2C needs two worked examples within the LAST FOUR YEARS each with rationale,
          process, timeline and reassessment result, i.e. a queryable timestamp and an exemplar flag. ACOTE
          A.6.3 needs a fixed eleven-stream annual template — usefully, because an enumerated fixed list
          means an ACOTE build can be a report template rather than a generic evidence binder. CSWE AS
          5.0.1(c) needs a CLEAR LINK to the specific data point. ACEN 5.1 needs three-year retention of the
          ANALYSIS rather than just the numbers. ARC-PA C1.01's verb is not "collect" but "create
          self-improvement action plans." The nearest shipped analog remains Mapping Tags — a free-form
          colored label with a count — which carries none of those fields, and every one of the eight
          registries independently concluded this belongs as a first-class object in Accreditation
          Management rather than bolted onto Curriculum Mapping. SLP's Mapped Standards Report is the one
          shipped mapping surface that identifies GAPS rather than displaying coverage — every other one
          answers "what did we cover" and never "who is short" — though what threshold defines
          "insufficiently covered" is unstated and should be verified rather than pitched, and mapping
          frameworks beyond KASA require CSS assistance. SLP's report family also caps at 50 course
          offerings per run with a 6am EST Statistics refresh, which turns a full-cohort self-study exhibit
          into several exports plus a manual merge, and means nothing in this stage should be described as
          real-time — six of the ten Custom Report data sources (Slot, Sites, Locations, Contracts,
          Personnel, Faculty) sit on a 24-hour refresh tier, honestly badged in the UI.
      - subject: "Nursing"
        detail: >-
          Nursing's Crosswalk Report is modelled on AACN's own Essentials Toolkit template and is the only
          mapping report in the product carrying a DEPTH dimension (knowledge/skill/behavior crossed with
          introduced/reinforced/demonstrated) rather than a flat mapped bit — which is exactly what CAEP's
          InTASC learning-progression language and CCNE's per-track demonstration both need, and it is
          currently nursing-only. External exam ingestion is the paired dependency and is blocked on Exam
          Management (Q2 2027): ACOTE A.6.4 needs an 80% NBCOT rolling average over three calendar years
          with a small-cohort rule extending the window year by year up to five years until 25 test-takers
          are reached — real conditional logic, and acote.yaml warns a naive three-year average would
          misreport compliance for the many small OTA programs; CCNE IV-C needs an 80% NCLEX-RN rate
          demonstrated FOR EACH CAMPUS/SITE AND TRACK by one of four permitted calculations; ACEN 5.3 adds
          an "at or above the national mean" option that requires ingesting a SECOND external feed; CAA
          5.5/5.6 need Praxis pass and completion rates averaged over three years counting a repeat
          test-taker once; and ARC-PA C1.01 needs PANCE scores AND sub-scores. nursing.yaml calls NCLEX "the
          highest-value Gap in this file" because it is the number state boards act on independently of the
          accreditor, and the per-campus/per-track slice means the exam data model must key on the same
          campus/site entity the placement engine already uses. Two structural limits recur and pull in
          opposite directions across disciplines. The one-grid-per-report limit is the first: reports run
          across a curriculum grid and cannot run across multiple grids simultaneously. nursing.yaml calls
          this "the single most consequential structural limit in the file, and nursing is the discipline
          where it bites hardest" — a five-track school (ADN/BSN/MSN/DNP/specialty) produces five
          disconnected report sets and no product-supported program-level union view. Critically, it is FINE
          for CCNE III-B through III-E, which are deliberately per-degree and per-track, and it BREAKS ACEN
          4.1, which requires ONE set of end-of-program outcomes across all options — a CCNE school and an
          ACEN school need opposite things from the same feature. The two partial analogs to a comparability
          engine both live in this stage: the Custom Reports pivot (Rows = Clinical Setting or Site, Values
          = Score (Average), the documented "Performance by Clinical Setting" scenario) which offers no
          variance or effect-size measure, and Nursing's Competency Review Dashboard Score Distribution box
          plot, which renders RED when a domain median falls below its configured threshold — the ONLY place
          in the product where a threshold drives a visual state change on an outcome distribution rather
          than on a coverage count. What has no analog anywhere is variance flagging BY SITE against a
          threshold band.
      - subject: "Social Work"
        detail: >-
          Social Work hits it from the other side: CSWE AS 5.0.1(b) wants outcomes per program option AND in
          aggregate from one data set, and cswe.yaml's framing is the operationally useful one — "a
          configuration decision made months before anyone reads AS 5.0.1(b)," so it belongs in
          implementation rather than in a self-study scramble. Social Work carries the sharpest privacy
          finding in the stage: the one artifact that physically leaves the institution and reaches an
          external reviewer — de-identified sample Learning Agreements — is de-identified by hand, in Excel,
          with no verification step, and cswe.yaml calls a native de-identified export mode "a real FERPA
          foot-gun" worth closing. SW also has a maintenance hazard hiding in a strength: Client System
          Levels and Dimensions of Learning are defined ONCE under Curriculum Mapping > Attributes and
          reused, so the same attribute is read by AS M3.2.1, AS M3.2.4 and AS 5.0.1(a) — the playbook
          instructs keeping them consistent across all three, an edit for one silently changes the evidence
          for the other two, and nothing detects the divergence. That cross-standard divergence check is
          named in cswe.yaml as "a small, high-credibility Accreditation Management feature." Second, a
          registry gap recorded rather than papered over: the SW playbook maps the Course "Nature" field,
          Associate Faculty and Staff, and the Course Offerings export to CSWE AS 4.2.2, and there is no AS
          4.2.2 element anywhere in cswe.yaml, whose Standard 4.2 coverage stops at B4.2.1/M4.2.1 — so that
          mapping is cited to a playbook, not a registry, and AS 4.2.2 should be added before it supports a
          compliance claim. Third, the most instructive scoping template in the whole file is a DISCLOSED
          gap rather than a capability: Exxat's own CSWE guide states that Form AS 4.2.1 and the per-faculty
          Faculty Data Forms "must be completed outside Exxat Prism" and that Prism "does not generate or
          validate required faculty data fields." cswe.yaml calls that the model for how the Q3 2027 pillar
          should represent partial coverage honestly — supports the narrative, does not produce the form.
          Set against PA's B2 export, the two together define the range: form generation is proven possible
          for one accreditor and explicitly disclaimed for another, inside the same product. And two
          disciplines are structurally under-served in ways that will not resolve themselves: CSWE AS 5.0.2
          requires assessing at least one anti-racism/diversity/equity/inclusion effort in the IMPLICIT
          curriculum — program environment, climate, governance — which is not modelled anywhere in Prism,
          so there is no object to attach an ADEI finding to, and cswe.yaml's warning is that "if
          Accreditation Management models only curriculum-linked evidence, it structurally cannot serve
          CSWE's implicit-curriculum standards, and Social Work is a live existing-customer discipline."
      - subject: "Teacher Education"
        detail: >-
          Two disciplines are NOT pre-loaded and should not be claimed: CSWE's nine competencies run as a
          program-authored custom set under Program Specific Standards, and caep.yaml states there is no
          evidence InTASC or CAEP R1-R5 ships pre-loaded at all. Every one of the eight also needs a
          post-graduation outcome object and none has it, because Prism's student record ends at conferral.
          CAPTE 1C3 wants a 90% two-year employment rate; ACOTE A.6.3 counts graduate job placement,
          employer satisfaction and alumni scholarly activity among eleven enumerated annual streams; CSWE
          AS 5.0.3 wants graduation rate plus one further outcome over three years against a program-set
          benchmark; CCNE IV-E and ACEN 5.4 want 80% employment with the RESPONSE RATE reported as a
          first-class metric; COA H.1.4/H.1.5 and G.3.4.2 want alumni and employer evaluation; CAEP
          R4.1/R4.3 want completer effectiveness and satisfaction; and CAA 4.8 requires documentation
          available to graduates and non-completing attendees — which bites hardest because the CCC-SLP
          application is filed AFTER graduation, exactly when the hours verification is needed and exactly
          when nothing confirms the graduate still has access. caep.yaml supplies the scoping discipline
          worth keeping: CAEP R4.1's state-owned P-12 growth data is largely unobtainable, so the honest
          product answer is "support the case-study and observation route well," not "integrate state
          longitudinal data systems." The second recurring limit is demographic disaggregation: Custom
          Reports exposes Course, Rotation, Academic Year, Status, Site and per-question fields but NOT
          race/ethnicity as a comparability dimension — while CAEP requires disaggregation by preparation
          program AND race/ethnicity across EVERY component R1.1 through R4.3 with disparities either absent
          or explained, and ACEN 5.1 requires aggregate data disaggregated with written justification
          wherever it is not. Prism holds the data (Students > Reports > Race, Gender, Age & Ethnicity
          already exists and is one of the five sources in PT's AAR pull), so this is a join that is absent
          rather than data that is missing, and caep.yaml's advice is right: treat demographic
          disaggregation as a cross-cutting reporting primitive rather than re-solving it per element.
          Teacher Education has exactly one confirmed TE-specific product surface in the entire corpus — the
          GoReact/Echo360 LTI integration, support-gated per discipline — and even there the rubrics live in
          GoReact, so rubric authoring, versioning and inter-rater reliability all happen outside the system
          of record while CAEP R5.2 requires EPP-created assessments to meet CAEP's own evaluation criteria;
          caep.yaml's conclusion is that "the validity evidence CAEP wants for that instrument cannot be
          assembled from Prism alone." The cheapest TE investment identified anywhere is content-ops rather
          than engineering: adding an Employer Satisfaction and a Completer Satisfaction survey template
          pair to Exxat Surveys, following the demonstrated December 2025 SLP precedent — and note the same
          missing template family blocks COA H.1.2's eight-facet student evaluation for CRNA, so it is one
          motion serving two disciplines.
      - subject: "CRNA"
        detail: >-
          COA adds a dimension no other accreditor has — cohort-conditional effectivity, where dagger-marked
          Appendix rows bind only students matriculating on or after January 1 2026, putting two
          matriculation years in one course offering under different totals. The fix is one field on the
          standard object with a versioned attribute rather than report metadata; the Standards screen
          currently makes an edition transition destructive rather than migratory. A second cross-cutting
          requirement the four-domain reading never surfaced: a per-standard SEVERITY or STATE attribute.
          COA asterisks its critical-concern standards — F.7 (the 2:1 supervision cap), F.1, F.5, A.3, A.10,
          E.2, G.3, H.1.1, H.1.2, H.1.6, six Standard B faculty elements, and ALL FIFTY of D.1-D.50 — and
          CAPTE currently has an active STAY on Standard 2B instructing programs not to respond to it at
          all. Two accreditors, researched independently, attach a per-standard state that changes how a
          program must respond, and Prism's standards model can represent neither. Note that a stay needs a
          SUPPRESSED state distinct from deactivated, precisely because deactivation destroys mappings — so
          this is one field with at least three values, not two features. For CRNA the severity tier matters
          more than anywhere else, and coa.yaml flags the corollary risk on the Competency Review Dashboard:
          it is a DOMAIN-level view, and because COA treats each of its fifty graduate standards as
          individually critical, a domain average can mask a single failed competency. The most repeated
          single requirement across the twelve accreditor registries is one no shipped pillar addresses at
          all: publication to a program-owned PUBLIC page on a recurring clock. Six of the eight existing
          disciplines plus two expansion accreditors demand it, with three different cadences and at least
          two prescribed labels — ACOTE A.4.2 wants a three-year outcome table plus an active NBCOT link on
          the program HOME PAGE; CAA 1.9 wants a three-year table under the VERBATIM heading "Student
          Achievement Data" or "Student Outcome Data," segmented per modality for distance education and
          satellite campuses (which forces modality to be a first-class cohort attribute upstream of any
          report); CSWE AS 5.0.1(d) wants Form B5.0.1(d) posted on the program webpage, refreshed at least
          every two years, hyperlinked to CSWE; COA G.3 (critical) wants annual publication of attrition,
          6-month employment as nurse anesthetists, and the NBCRNA NCE FIRST-TIME pass rate on a page linked
          from COA's own list; and ARC-PA A3.11c imposes a hard April 1 date with distant campuses broken
          out individually. Nothing in Prism publishes anything outward, so this is a genuinely new surface
          rather than a report variant. One data-model subtlety to carry: COA H.1.6.2 wants pass rates AND
          MEAN SCORES while G.3.4.3 wants the first-time pass rate specifically, so a single "pass rate"
          field satisfies neither cleanly.
    key_findings:
      - subject: "DO"
        headline: "COCA's heaviest reporting burden keys off data that lives outside the COM"
        severity: "gap"
        detail: >-
          6.11's cross-site comparability report, 11.4's COMLEX-USA pass-rate publication within 30
          days, 11.5's public PGY-1 placement rate and 11.9's annual and mid-cycle submissions are
          all rated Gap, and most depend on NBOME, ACGME and AACOM data Prism does not ingest.
      - subject: "Dentistry"
        headline: "CODA's CQI object is patient care: chart-audit sampling and root-cause analysis"
        severity: "gap"
        detail: >-
          CODA 5-3 requires chart-audit sampling, deficiency coding and root-cause analysis over
          patient records, naturally expressed in CDT codes. One accreditor spans both the
          predoctoral degree and postdoctoral residencies, unlike LCME/COCA versus ACGME.
      - subject: "PA"
        headline: "Exxat's own best practice for SCPE Details is diffing two exports in Excel"
        severity: "gap"
        detail: >-
          "Gold in, gold out" means keeping Prism site and location names identical to the ARC-PA
          Entry Level Program Portal, then downloading both exports and comparing them line by line
          — arc-pa.yaml's most concrete case for what Accreditation Management should automate.
      - subject: "Nursing"
        headline: "One grid per report means a five-track school gets five disconnected report sets"
        severity: "gap"
        detail: >-
          It is FINE for CCNE III-B through III-E, which are deliberately per-degree and per-track,
          and it BREAKS ACEN 4.1, which requires one set of end-of-program outcomes across all
          options — so a CCNE school and an ACEN school need opposite things.
      - subject: "SLP"
        headline: "The KASA Clinical Certification Report generates a signed ASHA template, not a dashboard"
        severity: "none"
        detail: >-
          It is document generation rather than dashboarding, and nothing in the competitor corpus
          is documented reaching it. SLP's Mapped Standards Report is also the one shipped mapping
          surface that identifies GAPS rather than displaying coverage.
      - subject: "Social Work"
        headline: "The one artifact that leaves the institution is de-identified by hand in Excel"
        severity: "gap"
        detail: >-
          De-identified sample Learning Agreements come out of the Comprehensive Report for
          Placement Based Form with no verification step, which cswe.yaml calls a real FERPA
          foot-gun. Client System Levels are also defined once and read by three separate standards.
      - subject: "CRNA"
        headline: "COA asterisks fifty critical standards; Prism's standards model has no severity field"
        severity: "gap"
        detail: >-
          All fifty of COA's D.1-D.50, plus F.7, F.5 and A.3, carry a critical state that changes
          how a program must respond, and CAPTE has an active STAY on Standard 2B. A stay needs a
          SUPPRESSED state, since deactivating cascade-deletes every mapping.
      - subject: "PT/PTA"
        headline: "Two shipped reports still cite 2016 numbering that no longer exists"
        severity: "cosmetic"
        detail: >-
          "Number and Variety of Clinical Sites (Standard 2C)" and "Clinical Slots (Standard 8F)"
          print 2016 numbering when the 2024 PT and PTA documents both stop at 7 and the content now
          lives at 2D8. The other five CAPTE reports carry dual labels.
