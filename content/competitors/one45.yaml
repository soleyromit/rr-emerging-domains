competitor: "one45 (Acuity Insights)"
slug: "one45"
domains_served: ["MD"]
category: "Med-ed program management (scheduling, curriculum, assessment/evaluation) for medical schools & residencies"
# Vendor's own published mark, fetched 2026-09-09 from its official site (or its current
# parent brand's) and committed under apps/ecosystem/public/logos/ — see _TEMPLATE.yaml.
logo_asset: "one45.png"
company:
  founded: "2001 (one45, Vancouver, BC); acquired by Altus Assessments in Aug 2021; Altus renamed to Acuity Insights in Nov 2022"
  hq: "Toronto, Ontario, Canada (Acuity Insights parent co.); one45 product originated in Vancouver, BC"
  ownership: "Owned by Acuity Insights (formerly Altus Assessments, founded 2014 by Harold Reiter and Kelly Dore); one45 is one product line alongside Casper (admissions SJT), Duet, and Analytics"

feature_teardown:
  - pillar: "Clinical & Experiential Education"
    competitor_capability: "One45 Program Scheduling: centralized didactic + clinical scheduling across departments, three rotation-allocation methods (Stream Lottery, Rotation Lottery, Randomized Stream Lottery), duty-hours and leave-time tracking at the event level, facilitator tracking, personalized learner dashboards synced to Google Calendar/Apple iCal/Outlook, and multi-layered concurrent schedules with integrated assessment."
    depth_vs_prism: "ahead"
    evidence: "Public product page describes granular duty-hour/leave tracking 'for accurate and simplified program and accreditation reporting' plus three named lottery algorithms and external calendar sync — more granular allocation tooling than Prism's public materials describe."
    source: "https://acuityinsights.com/products/one45/program-scheduling/"
  - pillar: "Compliance Management"
    competitor_capability: "No dedicated, publicly documented compliance module (immunizations, background checks, certifications) was found. The only compliance-adjacent tracking surfaced publicly is duty-hours and leave-time logging inside the scheduling module."
    depth_vs_prism: "unknown"
    evidence: "Product/marketing pages and the public knowledge base surface duty-hour/leave/facilitator tracking but no discrete immunization, background-check, or certification-compliance workflow; unable to verify whether this exists behind login."
    source: "https://acuityinsights.com/products/one45/program-scheduling/"
  - pillar: "Curriculum Mapping"
    competitor_capability: "One45 Curriculum Management: centralized repository linking objectives, sessions, and assessments; standardized vocabularies aligned to CanMEDS and AAMC competency frameworks; version control and audit trail; a 'Canvas Alignment Tool' that syncs LMS learning-event and facilitator data to keep curriculum maps current."
    depth_vs_prism: "at-parity"
    evidence: "Solutions page describes competency-framework mapping, version control/audit trail, and continuous-update capability; a separate scheduling page describes the Canvas LMS alignment tool specifically."
    source: "https://acuityinsights.com/solutions/curriculum"
  - pillar: "Surveys & Course Evaluations (Prism roadmap Q1 2027)"
    competitor_capability: "One45 Assessment and Evaluation is shipped today (not a roadmap item): 360° reviews, two-tier workflows, customizable forms/scales with question tagging, automated distribution of in-training evaluations tied to the master schedule, procedure/patient-encounter logs, EPAs/WBAs, and real-time student access to longitudinal feedback."
    depth_vs_prism: "ahead"
    evidence: "Product page details the shipped assessment/evaluation feature set, including 360 reviews and customizable forms; this pillar is live in one45 today versus Prism's stated Q1 2027 roadmap target."
    source: "https://acuityinsights.com/products/one45/assessment-and-evaluation/"
  - pillar: "Exam Management (Prism roadmap Q2 2027)"
    competitor_capability: "No native exam authoring/delivery/proctoring engine. One45's Analytics product integrates with third-party ExamSoft (Legacy and Enterprise) and pulls NBME CBSE/CCSE exam data into a 'Gateway exams' performance dashboard, rather than owning exam creation or administration itself."
    depth_vs_prism: "behind"
    evidence: "Knowledge-base article confirms Analytics 'integrates with ExamSoft Enterprise' and NBME CBSE/CCSE data for a performance dashboard — this is third-party data aggregation, not a native exam-management module."
    source: "https://one45software.na2.teamsupport.com/knowledgeBase/18353436"
  - pillar: "Accreditation Management (Prism roadmap Q3 2027)"
    competitor_capability: "Accreditation reporting support is woven across scheduling, curriculum, assessment, and Student Affairs data rather than a single standalone module, but is shipped and proven today. Verified case study: Augusta University's Medical College of Georgia credits its evaluation system, 'powered in large part by One45,' as a noted strength in a full eight-year LCME accreditation outcome."
    depth_vs_prism: "ahead"
    evidence: "Direct customer quote: \"We had our LCME site visit this year and received the full eight years accreditation. Our evaluation system, powered in large part by One45 was noted to be a strength of our program here.\" — Andria Thomas, PhD, Sr Associate Dean for Evaluation, Accreditation & CQI, Augusta University Medical College of Georgia. Product page also states One45 'supports accreditation requirements across assessment, curriculum, clinical experiences and logs, and Student Affairs.'"
    source: "https://cdn.featuredcustomers.com/CustomerCaseStudy.document/one45_augusta-university_620704.pdf"

strengths:
  - claim: "20+ years of operating history in medical education specifically (one45 launched 2001 in Vancouver) and used by 100+ health-professions programs globally, spanning MD/DO, dentistry, pharmacy, nursing, PA, podiatry, and midwifery — giving it cross-domain accreditation experience Prism does not yet have."
    source: "https://acuityinsights.com/products/one45/"
  - claim: "Verified, named-customer LCME accreditation win: Augusta University's Medical College of Georgia received full 8-year LCME accreditation and specifically credited its One45-powered evaluation system as a noted strength during the site visit."
    source: "https://cdn.featuredcustomers.com/CustomerCaseStudy.document/one45_augusta-university_620704.pdf"
  - claim: "More granular, purpose-built rotation-allocation tooling than typical scheduling modules: three distinct lottery algorithms (Stream, Rotation, Randomized Stream) plus per-event duty-hours and leave-time tracking aimed directly at accreditation reporting needs."
    source: "https://acuityinsights.com/products/one45/program-scheduling/"
  - claim: "Backed by a multi-product parent (Acuity Insights, ~180 employees) whose broader portfolio (Casper admissions SJT, Duet, Analytics) gives one45 customers cross-lifecycle data (admissions through evaluation) that a single-point Prism cannot yet match."
    source: "https://www.crunchbase.com/organization/altus-assessments-inc"

weaknesses:
  - claim: "No publicly documented, dedicated compliance-tracking module for immunizations, background checks, or certifications — a discrete pillar Prism already ships. One45's only public compliance-adjacent feature is duty-hours/leave tracking inside scheduling."
    source: "https://acuityinsights.com/products/one45/program-scheduling/"
  - claim: "No native exam-authoring or delivery engine; exam-related functionality is limited to pulling data from third-party ExamSoft and NBME systems into an analytics dashboard rather than owning the exam workflow end-to-end."
    source: "https://one45software.na2.teamsupport.com/knowledgeBase/18353436"
  - claim: "Public review evidence is thin and mixed: Capterra shows only a single review (4.0/5 overall) whose stated cons are 'outdated visual design lacking modern aesthetics' and a development team that 'isn't keen on making big changes based on feedback'; a separately-sourced review also flagged a more limited mobile site and occasional duplicate evaluation requests. Sample size is small, so treat as directional, not conclusive."
    source: "https://www.capterra.com/p/126224/one45/reviews/"
  - claim: "No public pricing information of any kind (tiers, per-student cost, or ranges) is published on acuityinsights.com or on third-party listing sites — pricing requires a sales conversation, which slows self-serve evaluation by prospective programs."
    source: "https://acuityinsights.com/products/one45/"

retention_anchor: "Deep, multi-year embedding of a program's full academic record inside one45 — schedules, faculty/peer evaluations, procedure and patient-encounter logs, grades, and MSPE letters all live in one system feeding accreditation reporting. The Medical College of Georgia case study shows a relationship running since 2004 with an enterprise upgrade in 2006 and continued custom feature development (a bespoke log system) built specifically for that customer — this kind of institution-specific customization plus years of historical assessment/accreditation data creates high switching cost independent of day-to-day satisfaction."
exxat_opportunity: "Prism can differentiate on three fronts where one45's public materials show real gaps. First, ship Compliance Management as a genuinely dedicated, discrete module (immunizations, background checks, certifications gating placement start) — one45 shows no public evidence of this as a standalone pillar, only duty-hour/leave tracking bundled into scheduling. Second, build native Exam Management rather than one45's integration-only approach (ExamSoft/NBME data pulled into an analytics dashboard); owning exam authoring and delivery as one system of record is a clear technical differentiator Prism's Q2 2027 roadmap can claim outright. Third, lead with modern UX — one45's own (thin but real) review evidence cites an outdated interface and a vendor slow to act on feedback, which is an opening for Prism's AI-forward positioning (Leo AI, early-risk alerts) against a 20+ year old codebase. Finally, because Prism's Accreditation Management build (Q3 2027) is not yet locked, it can be scoped jointly with COCA/CODA/ACPE standards for the DO/Dentistry/Pharmacy expansion domains from day one, rather than retrofitting an LCME-centric (MD-first) accreditation model the way one45's history suggests it did."
pricing_signal: "not publicly disclosed — no pricing tiers, per-student cost, or price ranges found on acuityinsights.com, in product pages, or on third-party software-directory listings; pricing appears to be quote-based via sales/demo request."
