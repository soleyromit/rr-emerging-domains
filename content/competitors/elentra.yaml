# Competitor research — Elentra. One file per competitor, filename <slug>.yaml.
# Every non-trivial factual claim carries a source URL actually found via public search/fetch.
competitor: "Elentra"
slug: "elentra"
domains_served: ["MD", "DO"]
category: "Health professions education platform (curriculum, assessment, competency, clinical scheduling, accreditation) — spans UME/GME-adjacent workflows across 14 disciplines including Medicine (MD/DO), Nursing, Dentistry, Pharmacy, PT, and Veterinary Medicine"
# Vendor's own published mark, fetched 2026-09-09 from its official site (or its current
# parent brand's) and committed under apps/ecosystem/public/logos/ — see _TEMPLATE.yaml.
logo_asset: "elentra.png"
company:
  founded: "2004 (built internally at Queen's University); formalized as the multi-institution Elentra Consortium in 2008"
  hq: "171 Wellington Street, Suite 101, Kingston, ON K7L 3E3, Canada"
  ownership: "Independent company (Elentra Corp), acquired by growth-equity firm Achieve Partners on July 11, 2023; Queen's University remains a key shareholder and founding academic partner. Since the acquisition, Elentra has itself acquired Skyfactor Benchworks (Jan 2024, rebranded 'Benchworks by Elentra', nursing assessment) and merged with DaVinci Education (May 2024, originated from Duke University School of Medicine's LCMS+ platform) — both now under the Achieve Partners portfolio alongside Elentra."

feature_teardown:
  - pillar: "Clinical & Experiential Education"
    competitor_capability: "Clinical Experience Management module handles rotation/clerkship scheduling across sites, including a 'leading edge lottery system' that auto-builds rotation schedules, learner-driven elective selection within admin-set capacity rules, a Logbook for patient encounters/procedures with supervisor evaluation, and an ePortfolio (folder-based artifact repository with due dates and reviewer flagging)."
    depth_vs_prism: "at-parity"
    evidence: "Public feature page describes lottery-based schedule building, learner self-service elective add/drop, logbook, and ePortfolio — a comparable but differently-architected rotation engine to Prism's anchor-relative scheduling; exact scheduling primitives (e.g. anchor-date logic) are not disclosed on Elentra's site."
    source: "https://elentra.com/features/clinical-experience-scheduling"
  - pillar: "Compliance Management"
    competitor_capability: "No dedicated 'Compliance Management' product page or module distinct from other pillars was found. Compliance is referenced only as a general outcome ('ensure and report on compliance') woven across the curriculum, clinical scheduling, and accreditation pages — not as a standalone item-tracking module (e.g. immunizations, background checks, certifications gating placement start) with its own feature page."
    depth_vs_prism: "unknown"
    evidence: "Homepage tagline claims the platform lets institutions 'manage and deliver curriculum, assess and confirm competencies, and ensure and report on compliance,' but no feature page, help-doc, or press item enumerates a specific compliance item taxonomy or gating workflow analogous to Prism's Compliance Management pillar. Marked unknown rather than behind/ahead because this could not be verified either way from public sources."
    source: "https://elentra.com/"
  - pillar: "Curriculum Mapping"
    competitor_capability: "Curriculum Explorer, Curriculum Search, and Curriculum Matrix tools map course objectives, competencies, and individual teaching sessions to accreditation standards via tag management/mapping; supports filtering by cohort, course, or objective set and searching within attached files. Elentra is a participating AAMC Curriculum Inventory vendor, natively supports MedBiquitous standards, and states its mapping covers 'more than 40% of the Data Collection Instrument (DCI) for CACMS.'"
    depth_vs_prism: "ahead"
    evidence: "A dedicated company blog post explicitly claims category leadership: 'Elentra leads the industry in curriculum mapping.' The platform's mapping toolset (Explorer/Search/Matrix + tag-based accreditation-standard linkage + AAMC Curriculum Inventory + MedBiquitous native support) is more granularly documented in public marketing than anything currently public about Prism's Curriculum Mapping pillar, which per Prism's own capability map is confirmed only structurally ('maps courses/activities to a curriculum structure') without comparable named sub-tools."
    source: "https://elentra.com/elentra-leads-the-industry-in-curriculum-mapping/ ; https://elentra.com/features/curriculum-management-and-mapping"
  - pillar: "Surveys & Course Evaluations (Prism roadmap Q1 2027)"
    competitor_capability: "The Assessment & Evaluation module doubles as a survey/course-evaluation builder: users can construct forms (multiple choice, true/false, open-ended) and distribute them to evaluate 'faculty, courses/programs, and other activities,' including pre-course surveys, with a dedicated evaluations-reporting view summarizing learner evaluations of a course over a date range."
    depth_vs_prism: "ahead"
    evidence: "This is a shipped, generally-available capability today, per Elentra's own feature page and user documentation — whereas Prism's capability map lists Surveys & Course Evaluations as an unshipped Q1 2027 roadmap item. Elentra is therefore ahead on calendar time for this specific pillar, though the two products' underlying survey-engine depth was not directly compared beyond what's publicly documented."
    source: "https://elentra.com/features/assessment-and-evaluation ; https://help.elentra.com/faculty-use-of-assessment-and-evaluation"
  - pillar: "Exam Management (Prism roadmap Q2 2027)"
    competitor_capability: "Same Assessment & Evaluation module supports 'formative assessments to summative exams' with 'automated distributions, gradebook tasks, proctored/secured online exams, and on-demand workflows,' a customizable form/item bank, and gradebook integration for flexible grade scales."
    depth_vs_prism: "ahead"
    evidence: "Proctored/secured online exam delivery is shipped and publicly documented today. Prism's capability map lists Exam Management as an unshipped Q2 2027 roadmap item, so Elentra is ahead on calendar time here as well; specific proctoring vendor/technology and item-bank scale were not disclosed publicly."
    source: "https://elentra.com/features/assessment-and-evaluation"
  - pillar: "Accreditation Management (Prism roadmap Q3 2027)"
    competitor_capability: "A dedicated Accreditation feature page states the platform helps institutions 'align the curriculum with accreditation standards and learning objectives, track student outcomes, prepare for accreditation site visits, and document compliance with accreditation requirements.' A separate Medicine (Undergraduate) discipline page names specific standards supported: LCME (incl. reporting aligned to standards like ED-5, ED-7), COCA, CACMS, ACPE, CODA, and ARC-PA, plus AAMC Core EPAs. A University of Miami Miller School of Medicine case reference states Elentra 'simplified and automated their accreditation reporting process' and was used to generate reports during an LCME mock visit."
    depth_vs_prism: "ahead"
    evidence: "Elentra ships named-standard accreditation reporting today (LCME/COCA/CACMS/ACPE/CODA/ARC-PA) with at least one referenced institutional use case, while Prism's own capability map lists Accreditation Management as an unshipped Q3 2027 roadmap item. Note the general accreditation feature page itself is thin on specifics (no standards named there); the standard-specific detail comes from the discipline-specific Medicine page instead."
    source: "https://elentra.com/features/accreditation ; https://elentra.com/disciplines/medicine-undergraduate"

strengths:
  - claim: "Long-running multi-institution consortium model (20+ university members across US, Canada, Singapore) where features built by one member school are shared back to all others, giving Elentra a wide, continuously-refreshed base of real institutional requirements baked into the product."
    source: "https://elentra.org/2018/04/04/introducing-the-elentra-consortium/"
  - claim: "Explicitly ships named-standard accreditation and curriculum-inventory reporting today: AAMC Curriculum Inventory participating vendor, native MedBiquitous support, >40% of the CACMS DCI covered, plus LCME/COCA/CACMS/ACPE/CODA/ARC-PA report alignment referenced on its Medicine discipline page."
    source: "https://elentra.com/features/curriculum-management-and-mapping ; https://elentra.com/disciplines/medicine-undergraduate"
  - claim: "Growth-equity backing (Achieve Partners, acquired July 2023) plus two subsequent acquisitions/mergers (Skyfactor Benchworks in nursing assessment, and DaVinci Education/Duke's LCMS+) signal active capital and product-line consolidation rather than a stagnant legacy vendor."
    source: "https://elentra.com/elentra-news/press-release ; https://elentra.com/elentra-news/elentra-acquires-skyfactor-benchworks"
  - claim: "Has achieved SOC 2 Type 2 and TX-RAMP provisional certification, plus is described as GDPR-aligned, for its Google Cloud-hosted, dedicated-instance infrastructure — a credible security/compliance posture for institutional buyers."
    source: "https://elentra.com/elentra-news/elentra-corp-achieves-soc-2-compliance-and-tx-ramp-provisional-certification-ensuring-unparalleled-data-security-for-higher-education-institutions"
  - claim: "Explicitly and evenly serves both MD and DO programs on its Medicine discipline page, naming COCA, AACOM Osteopathic Core Competencies, and COMLEX-USA Levels 1 & 2 alongside LCME/USMLE — direct relevance to Prism's DO expansion domain."
    source: "https://elentra.com/disciplines/medicine-undergraduate"

weaknesses:
  - claim: "No public G2, Capterra, or Software Advice listing could be located after multiple targeted searches — meaning prospective buyers have no independent third-party review/rating signal for Elentra, unlike many SaaS ed-tech competitors."
    source: "unable to verify — searched g2.com, capterra.com, softwareadvice.com for 'Elentra'; no product listing found as of 2026-08-24"
  - claim: "No dedicated, publicly documented Compliance Management module (e.g. immunization/background-check/certification tracking gating placement eligibility) distinct from the curriculum/clinical/accreditation pages — compliance is only referenced as a general outcome, not a named feature with its own page."
    source: "https://elentra.com/ (compliance mentioned only in tagline copy; no dedicated feature page found at elentra.com/features/)"
  - claim: "Pricing is entirely non-public; a third-party listing (G2) states Elentra 'has not provided pricing information for this product' and directs buyers to contact sales, consistent with an opaque, custom-quote enterprise sales motion."
    source: "https://www.g2.com/products/elenta/pricing (accessed via search snippet; direct fetch returned HTTP 403)"
  - claim: "A Glassdoor employee-review search surfaced at least one review describing 'terrible management, lack of support and communication, employees doing unpaid overtime, and micromanagement' alongside other more positive reviews — a mixed internal-culture signal that could affect delivery/support consistency, though this is employee sentiment, not customer sentiment, and sample size/date are unverified."
    source: "https://www.glassdoor.com/Reviews/Elentra-Reviews-E5471208.htm"
  - claim: "Company has undergone two major structural changes in under a year (Achieve Partners acquisition mid-2023; Skyfactor Benchworks acquisition and DaVinci Education merger through 2024) — integration risk across three previously-separate codebases/platforms (Elentra, Benchworks, DaVinci/LCMS+) is plausible but not publicly confirmed or denied."
    source: "https://elentra.com/elentra-news/better-together-elentra-and-davinci-education-combine-to-drive-transformation-in-healthcare-education"

retention_anchor: "The consortium/open-source heritage creates unusually deep switching cost: member schools have historically contributed custom-built features back into the shared codebase (per the Elentra Consortium model), meaning long-tenured institutions may have institution-specific configuration, curriculum-tag taxonomies, and years of longitudinal curriculum-mapping/accreditation-reporting history embedded in the platform that would be costly to rebuild elsewhere. Additionally, active accreditation-cycle dependence (LCME/COCA self-study evidence built up over years inside Elentra's curriculum inventory and reporting tools) raises the switching cost right before and during accreditation site visits specifically. (Source basis: https://elentra.org/2018/04/04/introducing-the-elentra-consortium/ ; https://elentra.com/disciplines/medicine-undergraduate — retention rationale is Exxat-side inference from these public facts, not a direct Elentra claim.)"

exxat_opportunity: "Elentra's clearest public gaps line up well with Prism's core strength: Elentra has no dedicated, named Compliance Management module (the concept only appears as marketing-copy language, not a distinct feature with its own documentation), while compliance/placement-gating is one of Prism's three already-shipped pillars — this is a concrete, verifiable wedge in DO-program sales conversations where clinical-placement compliance gating is high-stakes. Second, Elentra carries real integration risk from stacking two acquisitions (Skyfactor Benchworks, DaVinci Education) onto its own platform within roughly a year of being acquired itself by Achieve Partners — Prism can position as a single-codebase, single-vendor system of record against a competitor now managing three formerly-independent platforms under one brand. Third, Elentra's near-total pricing opacity and absent third-party review presence (no G2/Capterra listing found) make it harder for a prospective buyer to benchmark Elentra against alternatives during procurement — Prism's own transparency and reference-ability, if genuinely stronger, is a differentiable sales point. Prism should NOT lead with the Curriculum Mapping, Surveys & Course Evaluations, or Exam Management pillars against Elentra, since Elentra ships named-standard accreditation/curriculum-inventory reporting (AAMC Curriculum Inventory vendor, MedBiquitous native support, >40% CACMS DCI coverage) and shipped course-evaluation/proctored-exam tooling today, while Prism's equivalents are still Q1/Q2/Q3 2027 roadmap items — until Prism ships Accreditation Management in Q3 2027, Elentra is the more credible accreditation-reporting story in an MD/DO sales cycle and Prism should compete on Compliance + Clinical & Experiential depth and single-platform stability instead."

pricing_signal: "not publicly disclosed. Elentra's own site has no pricing page (features pages route to a 'Request Info' contact form). A G2 listing found via search snippet states 'Elentra has not provided pricing information for this product or service' — direct fetch of that G2 page returned HTTP 403, so this is reported as a secondary/unverified signal, not a primary source read directly."

