domain: "Pharmacy"
full_name: "Doctor of Pharmacy"
credential: "PharmD"
program_length_years: 4
market:
  program_count: "142 ACPE-accredited colleges and schools of pharmacy in the U.S. as of 2022, up from 78 in 2000 (nearly doubling in two decades)"
  program_count_trend: >
    Number of programs grew rapidly (78 in 2000 -> 142 by 2022) but student
    demand fell sharply in the same window: total applicants to PharmD
    programs dropped from 106,815 (fall 2011) to 40,552 (fall 2021), a
    decline of over 60%, and national PharmD enrollment fell from 44,403
    (2023) to 42,312 (2024). At least one program (University of Charleston
    School of Pharmacy) closed in December 2024 citing declining enrollment.
    The trend has since shown early signs of reversal: applications rose for
    a second consecutive year, up 6% from fall 2024 to fall 2025.
  total_enrollment: "42,312 students enrolled across PharmD programs, Fall 2024 (AACP)"
  sources:
    - "Drug Topics, 'Number One No Longer' (142 accredited schools by 2022, growth from 78 in 2000, application decline 2011-2021): https://www.drugtopics.com/view/number-one-no-longer"
    - "AACP, 'Academic Pharmacy's Vital Statistics' (enrollment figures): https://www.aacp.org/article/academic-pharmacys-vital-statistics"
    - "AACP, 'Pharmacy School Interest Rises as Applications Jump 6%': https://www.aacp.org/article/pharmacy-school-interest-rises-applications-jump-6"
    - "WVU Today, University of Charleston pharmacy program closure (Dec 2024): https://wvutoday.wvu.edu/stories/2024/12/19/wvu-school-of-pharmacy-offers-support-to-university-of-charleston-students-affected-by-program-closure"
