clinical_education_shape: >
  PharmD experiential education runs on a two-tier structure that is
  structurally distinct from Prism's existing allied-health domains. Tier
  one is the Introductory Pharmacy Practice Experience (IPPE): ACPE requires
  a minimum of 300 hours (including at least 150 hours split across
  community pharmacy and hospital/health-system settings), completed as
  short, recurring placements woven concurrently through the first two
  didactic years alongside coursework. Tier two is the Advanced Pharmacy
  Practice Experience (APPE): a minimum of 36 weeks (1,440 hours), delivered
  as a block of roughly six to seven rotations of four-to-six weeks each,
  full-time, with no concurrent coursework -- most programs devote the
  entire final (4th) professional year exclusively to APPE rotations. Four
  rotation types are mandatory (community pharmacy, institutional/health-
  system pharmacy, general medicine/inpatient, and ambulatory care), with
  the remainder as electives across community, hospital, ambulatory-care,
  and specialty sites. Supervision is a one-to-one preceptor model (a
  licensed pharmacist precepting one or a small number of students at a
  site) rather than a large clinical-teaching-team model. What differs most
  from a typical allied-health program (Prism's current base) is the
  dedicated, coursework-free capstone year of full-time block rotations
  (APPE) sitting on top of a separate, much shorter longitudinal IPPE
  requirement earlier in the curriculum -- allied-health programs more
  commonly interleave shorter clinical rotations with coursework across the
  full length of the program rather than culminating in one uninterrupted
  rotations-only year. Rotation blocks (4-6 weeks) also run longer than
  typical allied-health clinical rotations, and licensure requires clearing
  two distinct national exams (NAPLEX for clinical competence, MPJE for
  jurisprudence) plus state-tracked intern hours, on top of program
  completion.
distinctive_pain_points:
  - claim: "PharmD applicant volume fell over 60% from fall 2011 (106,815) to fall 2021 (40,552), even as the number of accredited programs nearly doubled since 2000, straining program viability and driving at least one program closure in Dec 2024."
    source: "Drug Topics, 'Number One No Longer': https://www.drugtopics.com/view/number-one-no-longer; WVU Today (University of Charleston closure): https://wvutoday.wvu.edu/stories/2024/12/19/wvu-school-of-pharmacy-offers-support-to-university-of-charleston-students-affected-by-program-closure"
  - claim: "The 4th professional year is typically 100% experiential (36 weeks / 1,440 hours of APPE block rotations, 4-6 weeks each, no concurrent didactic coursework), a structurally different capstone-rotation model than programs that interleave clinical time with coursework throughout."
    source: "University of Texas College of Pharmacy, IPPE/APPE overview: https://pharmacy.utexas.edu/programs/pharmd/experiential/ippe-appe; Noodle.com, 'How Do Pharmacy School Rotations Work?': https://resources.noodle.com/articles/pharmacy-rotation/"
  - claim: "Licensure requires passing two separate national exams administered by NABP -- NAPLEX (clinical competence) and MPJE (state-specific pharmacy law) -- plus state-tracked supervised intern hours, in addition to APPE completion."
    source: "NABP, NAPLEX/MPJE Candidate Application Bulletin: https://read.nxtbook.com/nabp/bulletin/naplex_mpje_bulletin/what_is_the_naplex.html and https://read.nxtbook.com/nabp/bulletin/naplex_mpje_bulletin/what_is_the_mpje.html"
