  - "University of Texas College of Pharmacy, IPPE/APPE structure: https://pharmacy.utexas.edu/programs/pharmd/experiential/ippe-appe"
  - "Noodle.com, 'How Do Pharmacy School Rotations Work?': https://resources.noodle.com/articles/pharmacy-rotation/"
