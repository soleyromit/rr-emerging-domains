domain: "DO"                           # DO | Pharmacy | Dentistry | Medicine
full_name: "Osteopathic Medicine"
credential: "DO"
program_length_years: 4
market:
  program_count: ""                    # number of accredited programs, cited
  program_count_trend: ""              # growing/flat/shrinking + evidence
  total_enrollment: ""
  sources: []

# Numeric, machine-readable SIBLING to the prose `market:` block above — not a
# replacement for it. Both are required and both stay: `market:` holds the cited
# narrative a human reads, `market_sizing:` holds the numbers a scorecard
# criterion, a metric_ref, or an integrity check can point at. This is the block
# content/dissection/<slug>.yaml's "market-size" question names as
# `domains/<slug>.yaml#market_sizing`, alongside `market/programs/<slug>.yaml`
# (the per-program registry this block aggregates — see
# content/market/programs/_TEMPLATE.yaml).
#
# THE RULE FOR FILLING THIS IN: a number goes here only when it is sourced to a
# registered source_id, never carried over from the prose above just because the
# prose states it. The figures in `market:` are real but carry bare URLs, no
# source_id, and no per-field as-of date; copying them down turns uncited prose
# into uncited machine-readable numbers, which reads as more authoritative while
# being no better sourced. An all-null block with confidence: "low" is an honest
# state, not an unfinished one.
market_sizing:
  as_of: "2026-01-01"          # YYYY-MM-DD — the date the numbers below were last set
  unit: "program"              # the thing being counted in every count below
  tam:
    programs: null             # every program in the domain, once sourced
    basis: null                # <=150 soft / 300 hard chars — what this count
                               # actually represents, once known
    source_id: null            # a registered source_id (see content/sources/)
  accredited_programs:
    count: null
    qualifier: null            # e.g. "accredited PharmD programs" — stays null
                               # while tam.programs is null
    source_id: null
    variance_note: null        # <=200 soft / 400 hard chars — only when tam and
                               # accredited_programs genuinely disagree
  sam:
    programs: null
    basis: null                # <=150 soft / 300 hard chars
    derived_from: []           # the filters applied to tam to get to this number
  som:
    programs: null
    basis: "Not sized — no named target list or win-rate assumption exists yet"
  enrollment:
    students: null
    as_of_year: null
    trend: null                # growing | stable | declining | recovering | unknown
    yoy_pct: null
    source_id: null
  current_clients:
    count: null
    named: []
    source_id: null
  churned_clients:
    count: null
    named: []
    source_id: null
  penetration_pct: null        # computed only once tam.programs and
                               # current_clients.count are both real numbers
  acv:
    value_usd: null
    basis: "Not sourced — no pricing artifact exists in this repo"
    confidence: "unknown"      # unknown | low | medium | high
  revenue_potential_usd: null  # HARD RULE: may only be non-null when
                               # acv.value_usd is non-null and sourced. A revenue
                               # number standing on an unsourced ACV is a guess
                               # wearing a dollar sign
  adjacency:
    claim: null                # <=150 soft / 300 hard chars — one line, sourced.
                               # The cross-discipline overlap claim, not the case
                               # for it: evidence goes to source_id
    cross_discipline_overlap_institutions: null
    source_id: null
  confidence: "low"            # low | medium | high — "low" is the correct,
                               # honest value for an all-null block

# Where this domain's programs sit inside an institution, and who actually signs.
# An empty buying_roles list means nobody has researched it yet — a countable
# state, not a missing field. Do not populate it with a plausible org chart.
org_structure:
  typical_parent: null         # <=200 soft / 400 hard chars, once known
  buying_roles: []             # [{persona_ref, title_in_domain, decision_role, note?}]
                               # persona_ref  — a content/personas/ file slug
                               # decision_role — economic-buyer | champion | user
                               #                 | blocker | influencer
                               # note          — optional, <=200 soft / 400 hard
  sources: []
# OPTIONAL. The single discipline whose accreditation structure this domain most
# resembles, so a reader (and a build plan) knows what can be scaffolded rather than
# rebuilt. Omit the whole block when no real source establishes an analog — an absent
# block reads as UNRESEARCHED, which is the honest state; a guessed one is
# indistinguishable from a researched one the moment it is committed (the same
# sparse-by-design rule content/ARCHITECTURE.md states for the Level-2 lenses).
# Never write it out as `closest_analog: null`; just leave it off the file.
#
# closest_analog:
#   discipline: "OT/PT"        # plain label. This discipline may have no domain hub
#                              # page of its own — that is expected, see domain_slug.
#   domain_slug: null          # a route slug ONLY if listDomains() really has it;
#                              # otherwise null, and the renderer shows `discipline`
#                              # as plain text. Never construct a Link from a slug
#                              # that does not resolve (apps/ecosystem's lateral
#                              # cross-link rule — a stale reference degrades to
#                              # text, never to a 404).
#   similarity: "..."          # <=160 soft / 260 hard chars — ONE sentence, the real
#                              # structural reason the two are alike, not a guess.
#   reuse_note: "..."          # <=200 soft / 350 hard chars — what specifically can
#                              # be scaffolded from the analog rather than rebuilt
#                              # from zero. The move, not the argument for it.
#   source: "..."              # where the analog claim comes from, same free-prose
#                              # shape as distinctive_pain_points[].source below.
standards_bodies:
  - name: "COCA"
    type: "institutional accreditor"
  - name: "AOA"
    type: "professional body"
clinical_education_shape: >
  How rotations/clerkships work structurally in this domain — length, site
  types, supervision model, what makes it different from Prism's existing
  allied-health domains.
distinctive_pain_points:
  - claim: ""
    source: ""
sources: []
