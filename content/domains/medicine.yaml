# Numeric, machine-readable sibling to the prose `market:` block above. The two
# coexist deliberately and neither replaces the other: `market:` holds the cited
# narrative a reader reads, `market_sizing:` holds the numbers a scorecard
# criterion or an integrity check can point at. This is the block
# content/dissection/medicine.yaml's "market-size" question names as
# `domains/medicine.yaml#market_sizing`, alongside `market/programs/medicine.yaml`.
#
# Every number below is null on purpose. The figures in `market:` above are real
# but carry only bare URLs, no registered source_id, and no per-field as-of date
# — copying them down here would turn uncited prose into uncited machine-readable
# numbers, which is worse, not better. An all-null block with confidence: "low"
# is the honest state. Phase 2/3 populates it from a registered source_id and the
# per-program registry in content/market/programs/medicine.yaml.
market_sizing:
  as_of: "2026-09-11"          # YYYY-MM-DD — when the numbers below were last set
  unit: "program"              # the thing being counted in every count below
  tam:
    programs: null             # every program in the domain, once sourced
    basis: null                # <=150 soft / 300 hard chars — what this count
                               # actually represents, once known
    source_id: null            # a registered source_id (see content/sources/)
  accredited_programs:
    count: null
    qualifier: null            # e.g. "accredited PharmD programs" — stays null
                               # while tam.programs is null
    source_id: null
    variance_note: null        # <=200 soft / 400 hard chars — only when tam and
                               # accredited_programs genuinely disagree
  sam:
    programs: null
    basis: null                # <=150 soft / 300 hard chars
    derived_from: []           # the filters applied to tam to get to this number
  som:
    programs: null
    basis: "Not sized — no named target list or win-rate assumption exists yet"
  enrollment:
    students: null
    as_of_year: null
    trend: null                # growing | stable | declining | recovering | unknown
    yoy_pct: null
    source_id: null
  current_clients:
    count: null
    named: []
    source_id: null
  churned_clients:
    count: null
    named: []
    source_id: null
  penetration_pct: null        # computed only once tam.programs and
                               # current_clients.count are both real numbers
  acv:
    value_usd: null
    basis: "Not sourced — no pricing artifact exists in this repo"
    confidence: "unknown"      # unknown | low | medium | high
  revenue_potential_usd: null  # HARD RULE: may only be non-null when
                               # acv.value_usd is non-null and sourced. A revenue
                               # number standing on an unsourced ACV is a guess
                               # wearing a dollar sign
  adjacency:
    claim: null                # <=150 soft / 300 hard chars — one line, sourced.
                               # The cross-discipline overlap claim, not the case
                               # for it: evidence goes to source_id
    cross_discipline_overlap_institutions: null
    source_id: null
  confidence: "low"            # low | medium | high — "low" is the correct,
                               # honest value for an all-null block

# Shape only, no content yet: where this domain's programs sit inside an
# institution and who actually signs. Populated alongside market_sizing in
# Phase 2/3 — an empty buying_roles list means nobody has researched it, which
# is a countable state, not a missing field.
org_structure:
  typical_parent: null         # <=200 soft / 400 hard chars, once known
  buying_roles: []             # [{persona_ref, title_in_domain, decision_role, note?}]
                               # persona_ref  — a content/personas/ file slug
                               # decision_role — economic-buyer | champion | user
                               #                 | blocker | influencer
                               # note          — optional, <=200 soft / 400 hard
  sources: []
standards_bodies:
  - name: "LCME (Liaison Committee on Medical Education)"
    type: "institutional accreditor — jointly sponsored by AAMC and AMA; accredits all U.S. and Canadian MD-granting programs"
  - name: "NBME / FSMB (USMLE)"
    type: "licensure exam board — co-sponsor and administer the United States Medical Licensing Examination (Step 1, Step 2 CK, Step 3), the pathway to state medical licensure"
  - name: "ACGME (Accreditation Council for Graduate Medical Education)"
    type: "GME/residency accreditor — accredits the ~13,762 U.S. residency and fellowship programs (5,380 specialty, 7,024 subspecialty) that MD graduates enter after the degree"
  - name: "NRMP (National Resident Matching Program)"
    type: "residency placement body — runs the Main Residency Match that algorithmically places graduating students into ACGME-accredited residency positions"
  - name: "AAMC (Association of American Medical Colleges)"
    type: "professional association — represents MD-granting medical schools and teaching hospitals; publishes curriculum, MCAT, and workforce data"
  - name: "AMA (American Medical Association)"
    type: "professional association — co-sponsors LCME, publishes clerkship and residency guidance, represents practicing and student physicians"
clinical_education_shape: >
  MD clinical education is a two-phase, exam-gated structure that is
  substantially more layered than a typical allied-health program. Years 1-2
  are pre-clinical coursework; years 3-4 are clinical, organized into "core
  clerkships" (internal medicine, surgery, OB/GYN, pediatrics, psychiatry,
  family medicine, neurology, and often radiology), each running roughly
  4-12 weeks (commonly cited as ~48 weeks of core clerkships total across
  year 3) at teaching hospitals and affiliated outpatient sites, under a
  layered supervision model: attending physician -> senior/chief resident ->
  intern -> student, rather than a single preceptor-to-student relationship.
  Year 4 adds "sub-internships" (near-resident-level responsibility) and, for
  most students seeking residency positions outside their home institution,
  "away rotations" (auditions at other institutions, coordinated through the
  AAMC's VSLO platform) that are logistically and financially significant on
  their own. What is structurally different from allied-health/nursing
  programs on Prism today: (1) clinical training does not end the pathway —
  it feeds into a separate, nationally match-based GME/residency system
  (ACGME-accredited, placed via NRMP) that is itself 3-7+ additional years
  and is licensure-gating; (2) two board exam milestones (USMLE Step 1 during
  pre-clinical, Step 2 CK during/after core clerkships) sit inside the
  clinical timeline itself and gate residency eligibility, not just program
  graduation; (3) supervision is multi-tiered (attending/resident/intern)
  rather than single-preceptor, so evaluation and sign-off responsibility is
  distributed across a hierarchy that changes every few weeks as students
  rotate services; (4) the "site" a student is evaluated at often changes
  every 4-12 weeks across a hospital system rather than one placement
  running a full term, and a meaningful share of fourth-year rotations are
  "away" rotations at institutions with no prior relationship to the home
  school.
distinctive_pain_points:
  - claim: "Clinical training-site capacity has not kept pace with rising medical-school enrollment: schools report growing difficulty finding clerkship sites and qualified preceptors as clinical education has shifted from inpatient to outpatient settings, and 44% of AAMC-surveyed schools feel moderate-to-severe pressure to pay community physicians/clinics to host students (something most don't currently do)."
    source: "https://www.aamc.org/news/so-many-medical-students-so-few-clerkship-sites"
  - claim: "Away/'audition' rotations impose a distinct financial and logistical burden layered on top of core clerkships: most students report $2,500-$10,000+ in total away-rotation costs, over half (54.9%) report declining at least one away rotation due to cost, and 75.9% say finances influenced which rotation offers they accepted."
    source: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5109707/"
  - claim: "The residency Match is a hard downstream bottleneck built into the pathway: even in the largest Match on record (2025), 6.5% of U.S. MD seniors and roughly a third or more of international medical graduates did not match to a PGY-1 position on Match Day, requiring the separate SOAP process to place remaining applicants."
    source: "https://www.ama-assn.org/medical-students/preparing-residency/biggest-match-day-ever-here-s-what-2025-numbers-reveal"
  - claim: "Medical school enrollment growth has outpaced growth in residency (GME) positions, meaning capacity constraints in clinical/GME training are a recognized structural issue for the pathway, not just an anecdotal one."
    source: "https://www.aamc.org/news/medical-school-enrollments-grow-residency-slots-haven-t-kept-pace"
