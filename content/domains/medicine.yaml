  program_count: "159-161 LCME-accredited MD-granting medical schools in the U.S. (count varies slightly by month as new schools reach accreditation; ~160 as of the 2025-2026 admissions cycle, ~96 public / 64 private)"
  program_count_trend: "Growing. AAMC reports U.S. MD enrollment crossed 100,000 students for the first time in 2025-26 (100,723 total, +1.3% year over year), with first-year matriculants up 1.2% to 23,440; total applicants rose 5.3% in the same cycle, reversing three prior years of decline. Enrollment growth has outpaced growth in downstream clinical training capacity (see distinctive_pain_points)."
